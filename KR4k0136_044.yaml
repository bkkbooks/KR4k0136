body:
  text: 第四十四回辭水月伴居櫳翠庵照情天群瞻太虛像話説黛玉帶了雪雁往紫菱洲去與湘雲岫煙間話紫鵑也自回去五兒春纖並小丫頭們見黛玉走開各人自去呼姊喚妹偷間玩耍去了只有襲人在自己屋裏悶坐了一會想起要描花樣子來找雪雁因雪雁剛才正在做鞋幫子黛玉叫他跟出門去將未做完的活計隨手撩在炕上走了襲人進去不見雪雁便在炕沿坐下一手拿起瞧他的針線比頭裏跟他姑娘在園子裏住的時候好的多因要等他回來找花樣子拿著鞋幫子呆呆坐著又想到自己先前伺候寶玉何等有臉如今進來雖蒙林姑娘垂念舊情另眼相看晴雯亦不記前嫌照常姊妹和好但自己總得時時留心讓人一步眼看怡紅院舊地鵲巢鳩占此身即終老大觀園中有何趣味想了一會兩手便懶懶的將鞋幫放下來一時神思困倦倒身下去就枕朦朧睡去誰料寶玉進屋鴉鵲無聲不見一個人影兒走到雪雁屋裏見炕上睡的是襲人看他鬢雲墮枕星眼微餳心上一動便去推醒了他正在情不自禁之時雪雁因翠縷與他討香餅子回來找取掀簾進屋瞧見不敢做聲縮身退出一盆的火要去告訴紫鵑正出瀟湘館門來了個晴雯見雪雁滿臉氣急的樣兒便問你做什麼雪雁就把所見之事與晴雯説了晴雯笑道你管他們什麼呢雪雁道你倒説的好我原不該管他各人有各人的屋子憑他把二爺藏起來黑夜白日去鬧都使得怎麼鬧到我屋子裏來呢我炕上是乾乾淨淨的他倒也像姓蔣的不問那個地方就是戲臺晴雯道他這一會上去開了台應個好日子你的臺子現成底下熟門熟路叫你接一台不好嗎雪雁紅了臉使徑啐道你是應過官戲的了屋裏有現成臺子為什麼不招他到你臺上去呢晴雯道白同你説一句玩話當真就生氣了好妹妹是我的不是我幫你去拿他們晴雯往前就跑雪雁跟著走到瀟湘館門首晴雯雖然與襲人不對想起黛玉勸他的話又見襲人近來諸事退縮大不比從前光景甚覺可憐便煞住了腳把雪雁拉住勸道罷呀饒了他這一次罷咱們也行些方便就去撞破了也怪沒意思雪雁冷笑一聲道我知道你是要護庇他的我去告訴姑娘評評理晴雯忍不住要笑道這件事還有什麼理可評自然是襲人之錯我倒要問你怎麼好開口對姑娘説姑娘聽見了還要惱你呢你再去想罷二人正在講話來了個侍書問晴雯道我遠遠瞧見你們像在這裏拌嘴到底為什麼晴雯道沒有的事我們説間話你要往那裏去侍書道我來找我姑娘可在裏頭嗎雪雁道三姑娘同我姑娘都在邢大姑娘那裏咱們同走罷雪雁也不去拿香餅子同了侍書自往紫菱洲去了一時寶玉出來見了晴雯便道襲人一個在裏頭你同他説話去晴雯瞧了寶玉只是抿著嘴笑寶玉問有什麼好笑晴雯道房東不依你們呢我在這裏勸了好半天才走的寶玉聽説知剛才的事已被雪雁瞧見晴雯也知道的了便向晴雯擺手轉身回蘅蕪苑去才到荇葉渚遠遠瞧見一個小尼姑走來便站住了一時小姑子走近向寶玉打了個稽首細看認是芳官想他向在怡紅院一旦被王夫人怒逐恨氣出家今見丰韻依然而妝束已非昔日不禁愀然半晌説不出話來芳官道二爺不必傷心你上年走了再不回來這會兒也同我一樣各人願幹各人的罷了寶玉道可記得你同襲人姊姊派分子給我做生日衆人説你和我倒像雙生弟兄大家喝得爛醉的時候嗎芳官冷笑道記得便怎麼樣叫你説這個我倒感激太太催逼我跳出來了一個人不早遇些驚風駭浪那裏就知道回頭是岸太太説唱戲的女孩子沒有一個好的若論享榮華受富貴自然唱戲的沒有這個福分講到立心看破紅塵要超拔情天孽海到論不定是什麼出身我偏要替天下唱戲的爭口氣寶玉眼看著芳官不語沈思道他住的水月庵就是我走的大荒山近的住牢了我遠的倒跑了回來不過各人自有了不了的塵緣他倒先了我一步於是轉悲為喜向芳官道我和柳五兒説過你既堅心修行何不隨著妙師父住在櫳翠庵比外邊到底清淨些五兒説你不願進來所以也沒有來叫你今兒難得你進來了當面問你可到櫳翠庵去不去芳官道我這個身子住在外邊同裏頭一樣可以不進來便可以進來我要去看看妙師父二爺可知道妙師父的事嗎寶玉吃驚道妙師父有什麼事芳官道我看你們園子裏這幾個人四姑娘是已經參悟的了我在外邊聽説妙師父坐禪又走了魔虧你家四姑娘不知怎樣與他搗鬼妙師父變了一個奇醜的相貌二爺不知道這件事嗎寶玉道從沒聽見人説起咱們同去看他一語未了只見園門上的老婆子同著蘅蕪苑一個小丫頭來找寶玉道有一位本家老爺在書房裏坐著請二爺出去會呢寶玉便對芳官道你可知道晴雯姑娘沒有死又進來了還住在怡紅院你可瞧瞧他們去芳官道今兒同師兄來收月米我師兄還在璉二奶奶屋裏等著我看了妙師父就同他回呢過幾天再來瞧他們芳官自往櫳翠庵去了寶玉回去換了衣服出外見是雨村談了一會送客後徑到瀟湘館黛玉已經回來寶玉道玉釧妹妹的姻事已成了剛才你雨村先生來説甄年兄接到家書他南邊沒有定親竟就這裏的親事因他宅子窄小想要借妹妹進京來住這所公館一個院子我想橫豎空著已應許他了黛玉道我前兒借給姨媽家了底下姨媽家挪進去也住不了這許多屋子分一座院落給他們也使得明兒去告訴太太叫二嫂子吩咐林之孝家的這幾個媳婦趕緊辦起來寶玉道忙什麼他們年裏頭也趕不上你聽見史大妹妹的婆家有什麼話今年可要娶過門去黛玉道前兒史大妹妹家裏有兩個老婆子來老太太問起他們説要到明年呢邢大姊姊是要等薛大哥回了家才與薛二哥辦這件喜事的了咱們三妹妹周家也有信來極遲總在明年冬間寶玉道遲些好我早説過這句話叫他們多做幾個月清清白白的女孩兒留在咱們園子裏熱鬧些黛玉道你別再講這樣不中聽的話依你講起來我倒有個主意叫寶姊姊回了張家我依舊到南邊嬸娘家裏連紫鵑帶了去叫晴雯到堡裏他舅舅家住了咱們各人自去做水做的女孩子讓你一個人住在園子裏省是混水攪和了可好不好寶玉聽了竟無言可答只得笑了一笑又問黛玉道我聽説妙師父變了相是四妹妹壞了他你可知道什麼樣的那不是四妹妹胡鬧嗎黛玉道真的真的這是他們講參悟一道的元妙你別去管他們寶玉因是日已晚等至次日一個人到櫳翠庵果見妙玉形容已改昔日冰姿玉貌忽變為牛鬼蛇神幸早知這段緣由相見之下留心審察仿佛認是妙玉禁不住長歎一聲放大了膽故以戲言試探道妙師如今妙而不妙了妙玉怡然自得道你那裏知道不妙而妙呢寶玉因聽黛玉之言信他禪門作用也不究問其故只得將無限感懷付之流水當下款留寶玉奉茶覺比從前酬應較為有禮而一種曠達坦白光景迥異昔時真是可以意會難以言傳寶玉提起芳官道不料芳官拋卻舞衣歌扇相安暮鼓晨鍾雖則可憐卻也可敬妙玉道豈不聞放下屠刀立地成佛二爺瞧不出芳官已打破一關的了寶玉道妙師何不留他在庵以衣鉢付之妙玉道青出於藍冰寒于水我如何能做他的師他昨兒説起二爺叫他進園子裏來他亦如流水行雲身無定向我留他在這裏作伴他説去辭了水月庵這幾天就來也不定寶玉此時覺與往日到此意興各別並不久坐辭了妙玉出庵一路行來心上總參不透他們的作為只是與妙玉嗟歎不已卻喜芳官肯進園來雖是已空色相還得散而復聚停了幾日芳官果然進來了並不到黛玉寶叉屋裏徑至櫳翠庵住下妙玉與他改了法名叫蓮貞取乎出污泥而不染又正而果也之義晴雯知道倒先拉了紫鵑到櫳翠庵去看他晴雯是與芳官同時被攆的人紫鵑曾在庵中耐過淒涼況味他們一見芳官都有一種掉淚光景芳官竟漠然無動不過敘幾句別後寒暄問問奶奶姑娘們的好晴雯紫鵑坐了一會回來五兒問姑娘們那裏去晴雯道芳官進來了咱們到櫳翠庵去看他呢五兒飛風趕到廚房裏告訴了他媽那柳家的因五兒進去伺候還是芳官的來由趕忙端整了一席精潔素菜叫人挑了自己帶著五兒送到櫳翠庵去路上正撞見了寶玉問明送菜給芳官的話寶玉歡喜道難得這菜算你媽送的該多少錢我給你柳家的聽了笑道這幾樣子素菜值得幾個錢呢二爺恩典照顧我們的地方多著哩寶玉點頭道我知道了當下柳家的自同了五兒到櫳翠庵去寶玉來到瀟湘館見寶叉探春湘雲這幾個人在裏頭寶玉坐下笑道我聽你們正説得高興要到那裏去逛呢湘雲道二哥哥你還不知道嗎你們起造的什麼太虛宮連神像都塑好的了後兒開光來請拈香還聽説配殿上塑的像寶姊姊林姊姊咱們園子裏的人你道奇不奇咱們打夥兒都要去呢寶玉聽了歡喜道這樣我也同你們去逛逛寶叉介面道這還少得了你嗎寶玉道寶姊姊你去不去呢寶叉道問你林妹妹他去我也去探春道二哥哥不用你多管間事咱們已經説停當的了寶玉忙起身又到各處去邀那個問這個這裏正在講話見香菱急忙忙趕來向黛玉道姑娘們後兒去逛琴姑娘也去的為什麼不來叫我我也要去呢黛玉道你要到那裏去香菱道姑娘們到那裏我跟著也去黛玉道你這個人為什麼這樣憨連自己關切的事都忘得了的你想想後兒是幾時了香菱發了怔道後兒是十月朝呢黛玉道可不是你要逛太虛宮底下那一天去不得十月初一這個日子你是錯過不得的在天齊廟有親人見面的話你忘了嗎香菱想了想笑道當真不是姑娘提醒我竟忘了呢寶叉道我們大嫂子雖然有這句話也是沒影響的探春道那也論不定他還有叫香菱扶正的話這件事倒有幾分可信就去白跑了一趟也礙不了什麼於是衆人慫恿他去回太太到後兒趕早去守他一天看這句話準不準香菱又坐了一會隨衆人走散自回家去告訴了薛姨媽到天齊廟去不提這裏黛玉等到了初一日各人早起梳妝已畢用了早膳一面林之孝家的和周瑞家的算定了人數吩咐二門外小廝叫預備車子去的是黛玉寶叉探春惜春岫煙湘雲寶琴李紋李綺連李紈鳳姐東府裏的尤氏也高興去逛逛還有鴛鴦平兒晴雯紫鵑那鶯兒雪雁五兒麝月等各自隨著伺候小丫頭同老婆子們不計其數除了賈母邢王二夫人不去其餘的人比那一年五月裏元妃在清虛觀設醮榮府裏奶奶姑娘們去逛的還熱鬧等周瑞家的來回車子早已齊備各人行至垂花門丫頭們各自伺候上了車寶玉騎上馬趕先行走這裏一群車輛離了榮國府徑往太虛宮來進了頭門下車講到起造這座太虛宮原有仙人在內指點所以殿宇房廊款式並匾對上句語金陵十二叉正副册上的塑像無一不仿照下來如同水裏面印出來的太虛幻境只有各匱的册子上不留墨迹恐漏泄天機至於費了幾十萬銀子的工程其雕刻精巧鋪設輝煌自不必説那時黛玉寶叉先見牌坊上橫書太虛幻境四個大字兩邊石柱上並宮門外的對聯一路觀看心中思想這座宮殿的規模氣象竟像是熟遊之地連匾對也還記得些影響正要步進正殿聽見寶玉嚷説對聯句語不好怎麼不到裏頭來請示就胡亂刻上了明兒叫匠人來敲毀斟酌定了再鐫那管工家人的媳婦連忙上來回道這些匾對字句抄了進去回過姑娘的姑娘説就是這樣所以叫匠人照樣鐫了如今姑爺吩咐照著辦就是了寶玉聽他叫的是姑爺知道是黛玉家裏的人説是回過黛玉的也就沒言語當下衆人在正殿上拈過了香仰視塑的警幻仙子宛似平時熟識姊妹別後相逢的光景又遊到兩旁配廡也有春感秋悲癡情薄命結怨各司匾額寶玉看了怪不受用便想逐一更換他黛玉諸人看各處塑的仙女有像這個的有像那個的呼姊喚妹攢三聚四有看了塑的像比著那一個人笑的有瞧了這一個人指著塑的像説的寶叉道就是蘇州山塘上捏作鋪裏瞧了這個人捏出來的臉兒也不過是這樣罷了難為這些匠人從沒見過我們一面塑來這樣活龍活現的想起來他們並不知道咱們這班人原不是有心塑來要像誰難得在無心暗合這裏頭果然有個緣故探春道今兒不是來遊太虛宮各人照鏡子來了大家講了一會又去看見塑的一位仙女背上插了兩柄劍圓長臉兒嫵媚中帶一種肅殺之氣有人見過尤三姐的都指著向珍大奶奶道這不是你妹妹三姑娘嗎尤氏笑道果然像又有人指道這活脫是死過的蓉哥兒媳婦珍大嫂子快來瞧呢一句話引得這裏的人又趕過去惟有鳳姐見了記起秦氏死後在園子裏遇見他的光景身上倒覺凜了一凜因説道怎麼死的和咱們活的同塑在裏頭寶叉道鳳姐姐你別多心世界上的人無生無死無死無生那一個是長生不老的那時湘雲也厭惡塑的混雜聽了寶叉的話便道寶姊姊你是不怕死的橫豎死了有人替你活的但不知這塑的是張家姑娘還算是蘅蕪君黛玉笑道替活兩個字出得新鮮從來沒有聽見過的那湘雲想起剛才的話未免有些唐突寶叉連忙尋話岔開因向黛玉道可惜你這幅照沒有帶來再把這一幅子挂起竟是戲裏唱的太上老君一氣化三清化出三位瀟湘妃子來了探春道史大妹妹這句話虧在如今講了林姊姊聽了沒生氣照像他先前的脾氣不知又要怎麼樣了湘雲道可不是那一年外頭來了一個班子在老太太院子裏唱的正本蕊珠記扮蕊珠夫人這個孩子鳳姊姊説他活像一個人我口快説了出來二哥哥瞧了一眼連二哥哥拉扯在裏頭與他賭氣的嗎黛玉笑道虧你還記得這些沒要緊的陳年舊話如今憑你們愛把誰來比著我都使得湘雲道蘧伯玉行年五十而知四十九歲之非你早早就改悟了賢于蘧大夫遠矣衆人一笑過去了寶叉道別講古語了我倒想起一件事來這裏該招募住持要緊我瞧前後配殿及兩旁廊廡房屋不少晨夕啓閉焚香灑掃不是一兩個人可以照料得來的必得有個當家便好督司其事若講到這裏來住的僧道固非所宜須訪得一個高雅清趣的女尼怕一時沒處找呢黛玉道只有妙師父配在這裏住寶玉道我也正想著他就是他在園子裏住著忽然要請他出來似乎下逐客之令又使不得正在議論那邊薄命司裏有像襲人的塑像雪雁進去見了觸起前情帶玩不玩的道他算什麼也塑在這裏便伸手上去羞他的臉兒紫鵑忙把雪雁喝住晴雯四下裏一瞧想虧他今兒沒來當著衆人被雪雁這樣局踏臉上怎樣下得來這裏晴雯一班人牽裾聯袂的轉出回廊逛到別處去了黛玉獨自一個人走到絳珠宮丹墀裏站著見牆腳下白石砌的花壇內長出一叢芝草精神豐彩搖曳多情似系攜來仙苑之物正在出神接著寶玉也來了一眼瞧去見了牆下的芝草更覺舊雨重逢十分親熱與黛玉兩個人相對半晌並無一語湘雲遠遠望見他們兩個人在那裏便笑著趕過來問你們在這裏瞧什麼好看的東西不叫咱們也來瞧瞧黛玉回過臉來道沒瞧什麼呢湘雲只道他們在這裏看水磨磚上的雕工也沒理會到花壇內這莖草三個人一路説笑出了院門衆人也都回出來了見管工家人的媳婦陪笑上前道後邊還有小小一所花園雖然這時候沒有什麼花兒可玩請奶奶姑娘們進去瞧瞧結構款式可好不好衆人都道咱們逛了一天時候也不早了底下再來瞧罷於是一群人出了儀門陸續上了車管工的家人媳婦送衆人走了自己也到大門外上車回了公館自有他男人到各處照看一會然後把門關鎖貼上封條也自回去衆人到了家都到賈母王夫人處請了晚安問他們幾句話各回自己屋裏講到寶玉騎在馬上一路行走正盤算匾對上該換的字句要與黛玉商量進門下了馬將到垂花門首焙茗上前回道奴才有句話要回二爺寶玉道這會兒我心上不得間有什麼話明兒再説罷説著便進了垂花門往賈母王夫人屋裏一轉徑進園子裏到瀟湘館見黛玉道今兒聽見管工的媳婦説牌坊宮門上的對句寫進來請過示妹妹為什麼不斟酌好了發出去如今我改了幾個字來請教妹妹牌坊石柱上的該題假作真時真不假無為有處有非無宮門上橫書四個字該題恩海情天對句上聯堪歎兩字該改惟有下聯該改為到頭風月債還酬兩旁配廡上匾額朝啼司改為朝歡暮哭司改是暮樂薄命司改為造福春感秋悲改做春花秋月逐一改了他也見得古今來有情的都成就他美滿前程豈不妙呢黛玉搖頭道我看這些句語都有來歷是要點醒世上這一種癡男怨女的照你這樣改了不是顯悖了建造太虛宮的意旨了寶玉道妹妹論的果然是但我還有一個想頭比如你一病竟歸大夢我走入大荒山再不回家那裏還有這一座太虛宮呢如今憑咱們的血性歸根兒恨能填海石可補天可見債難酬者終是情不盡到十分地步原鐫對句豈不把古今之情同你我之情都抹煞了黛玉道你不知道咱們這班子人原是蒼蒼破格矜全不可援以為例若説合該是這樣的倒不足為奇連這座太虛宮也可以不必建了所以對上的句語竟不用去動他才可以點醒世人寶玉道這個地方不比別處庵觀寺院許間人進去走動白擺著這些頽喪話又去點醒誰呢黛玉道我也在這裏籌畫這裏頭既有咱們的塑像原不許男女混雜進去若一概禁止難道警幻的意思就只為點醒咱們園子裏頭這幾個人須得一年之內擇定幾個日期大開宮院許近京一帶城鄉婦女進去燒香遊玩只不許有男人跟隨進去內中有認識字句粗通文理的女人看了匾額對聯知所感悟才曉得情天便是孽海之源只可安於薄命自甘暮哭朝啼而已然話也不可説煞了普天世界的人或也有情到十分癡到十分到頭酬得了風月債的由他們去碰罷了寶玉聽到此處又歡喜起來道真是妹妹講的透徹咱們商量停當請璉二哥到兵馬司衙門裏去給了示懸挂大門每逢朔望日期許婦女們走動要幾名番役在門外巡邏查察不放一個男人進去就是了寶玉正與黛玉議論得高興雪雁上來説今兒有管園的老婆子來回現在天氣冷了各處院子裏擺的盆景都該下地窖了請發出去叫他們標簽記認明年開春後再來送還不知姑娘屋子裏這盆草該發去下窖不下寶玉介面道正是妹妹玩的這盆草我幾次盤問妹妹總不肯和我説明我細細問了紫鵑才知道來由古來貫虹化碧原是連山川草木都可感動的這盆子草也不怕霜雪來侵今兒咱們在太虛宮院子裏瞧的這一莖覺比蓬萊閬苑長的瑤樹琪花另有一種可人之處何不把妹妹愛的這一盆攜去並植了也不致冷落了絳珠仙草黛玉微笑道山海經並本草綱目諸書裏頭沒見這種名色何以知他是絳珠仙草呢寶玉道在絳珠宮裏長出來的自然是絳珠仙草了黛玉道原來是你胡謅的這麼著盆子裏草我也有個美名兒見贈他寶玉問道妹妹叫他什麼草呢黛玉道湘妃灑淚染成斑竹這淚染的草該名淚芝寶玉笑道妹妹前哭的眼淚灑在院子裏竹枝上也該有斑點斑竹淚芝倒是個絶對但我不敢與古賢妃媲美只叫他做杜鵑紅也好二人又説笑了一會當日無話到了次日飯後黛玉記起一事要往寶叉處探聽未知所為何事且看下回分解
