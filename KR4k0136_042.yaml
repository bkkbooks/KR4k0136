body:
  text: 第四十二回還原璧疑破金鎖案嘲顰卿戲編竹枝詞話説寶玉正在記挂鴛鴦劍見劉姥姥跟了一個老婆子來到蘅蕪苑劉姥姥送還鴛鴦劍道前兒趕回家去把劍交給他們依二爺的話叫他們挂在女孩子屋裏妖怪走到屋門口不敢進去到第二天晚上妖怪自己尋死不知怎樣又去鬧這女子只聽得響了一聲外面掇門進去那怪跌倒地上脖子裏鮮血淋淋現出原身是一隻蛤蟆他們把死蛤蟆撩棄夜裏就安靜了就要備了禮物來孝敬二爺磕頭道謝我對他們説這府裏不輕易進去二爺也不希罕你們東西等他女孩兒病好了就帶他進來當面謝二爺還要見見奶奶們呢話未完見賈母處來了一個小丫頭找劉姥姥道老太太知道姥姥來了請過去説話劉姥姥道我正要過去呢又纍你小姑娘跑一趟説著連忙轉身跟小丫頭走了寶玉便叫麝月放下了鴛鴦劍湘雲黛玉正和寶叉在里間間坐聽劉姥姥去了都走了出來寶玉笑道你們總説劉姥姥的話是撒謊剛才你們可聽見了黛玉道焉知剛才説的話是真的你瞧見這個蛤蟆精了寶玉道底下這女子還來見你們呢問他就是了寶玉話未完聽得寶琴在簾外笑道二哥哥要問誰一面掀簾進來大家讓坐寶叉道怎麼你不陪媽媽多住幾天就過來了寶琴道我還去呢因聽見一件奇事裏頭還夾著可喜的情節來告訴你們黛玉道你聽見了什麼事快講給我們聽聽寶琴道就是我們這一位死鬼大嫂子説的他不是我家的媳婦原來是討債的他前生是一個販洋貨的大客人第一會到咱們行裏交易有十來萬銀子的貨跟他的小夥計給他錯上了帳這個人回家就病故了後來算帳短了幾千兩銀子是他的小夥計錯給咱們了也不是有心瞞昧他的轉世過來這客人投了大嫂子小夥計投了香菱冤冤相報碰在一堆兒要了結這宗公案香菱該遭大嫂子磨折死了還要陷害咱們吃官司花用這項銀子幸虧香菱的父親已得道成仙親到森羅殿問明案由與閻王判斷咱們並非有意昧財香菱亦系無心之過這幾年鬧得舉家不安香菱受其毆詈不少已足相抵判大嫂子善終另去投生這不是一件奇事嗎寶叉道這些話是誰説的呢寶琴道我聽媽媽説都是大嫂子死了去醒轉來告訴了媽媽這些話才咽氣的寶叉道這也算不得喜事你説還有可喜的情節又怎麼樣呢寶琴道大嫂子還説他死後香菱合該扶正等到十月初一叫香菱到西門天齊廟燒香有親人相見這不是可喜的事嗎寶叉聽了將信將疑惟有寶玉聽不得這些話便替香菱連聲叫好黛玉道香菱的委曲也受夠了果然這樣辦法已是應該的寶玉道等薛大哥回來只要媽媽作主不怕薛大哥不依明兒請媽媽過來你們就和媽媽説停當了也好寶叉笑道我大哥還沒回來要你忙什麼呢你不知道我頭裏在家見嫂子和香菱鬧得利害還叫香菱跟著我如今嫂子死了便沒有他這些鬼話也想同媽媽商量辦這件事呢就是天齊廟有親人會面這句話且等到十月初一看驗不驗於是大家又議論一番寶玉因鴛鴦劍又斬了妖想起柳湘蓮托他之事便走出園來叫了李貴來吩咐道你去打聽東府裏大奶奶的妹子三姑娘他的棺木停在那裏可曾埋葬看了來告訴我還有話和你講李貴道不用打聽那棺材就是璉二爺在外邊置的新屋子裏擡出去城外埋著那時候因沒人經理由這些做工的胡弄局兒今年多下了兩場雨奴才前兒出門去看個朋友從那裏走過看見那冢上淋的泥都塌了寶玉道既這樣你去請陰陽選個日子把磊的磚都拆了定燒磚壙一副叫他們工料都要認真好好砌起一座壙來就是你去監工李貴應了一聲是打了一個千道整萬兩銀子工程都派別人去了爺再想不出差使來叫奴才去刨墳掘墓也是爺的恩典寶玉道底下有好差使派你去就是了好好的辦去等到完工的日子回我知道我親自要去祭奠呢吩咐畢回進園中到了瀟湘館又提起香菱的話黛玉道香菱眼擺著有個出頭了你倒替他性急我托你的話到底什麼樣了寶玉笑道你和我説什麼話黛玉道玉釧妹妹的事你就忘了寶玉道我有個同年是甄老伯家的遠族年紀還輕現分在部曹與你雨村先生也有世誼前兒托雨村先生去説親甄年兄也願意怕家裏又定下親事不便就允等他家信出來才定局我打聽他是寒素出身一時家裏未必就對出親來總在成功這一邊居多黛玉道你不該央雨村先生作媒他是十説九不成的寶玉笑道那裏的話只要是姻緣與媒人什麼相干二人又説了些間話寶玉自到怡紅院找晴雯紫鵑玩笑去了一日黛玉想起寶叉成親後總沒見他戴過從前常戴這盤金鎖有意把嬸娘送他這一盤戴上來見寶叉才進蘅蕪苑一股清香撲鼻見兩旁湖山石上上下下蔓的藤蘿時近重陽猶蒼翠欲滴結的紅豆纍纍如珊瑚一般可愛覺比瀟湘館另有一種雅趣心中想道屋子是要人住的如今雖當秋令陰氣肅殺倒不比夏初同他進來這一回的淒涼光景一頭思想來至寶叉房內見李紈探春先在裏邊各自隨便坐下寶叉見黛玉挂的金鎖釘眼看了半晌忍不住開口問道妹妹向來沒有見你戴這盤金鎖黛玉道姊姊這盤金鎖為什麼總沒戴我先要問姊姊的金鎖那裏去了寶叉猶未答話探春先笑道就是這件事我和大嫂子留心訪察了一年總不得底裏先前太太打發玉釧送還你我見了原就要問的因別的事打了岔去後來沒見你戴上也就混忘了今兒三對六面連大嫂子也在這裏這疑案可該破了黛玉道疑案又是怎麼樣的你們先把這疑案講給我聽聽李紈介面道上年寶妹妹病凶的時候找他常戴的這盤金鎖給他妝戴許多人找個翻江沒有蹤影鳳丫頭道屋子裏丟不了東西疑心小丫頭們偷了去又要到底下人房裏去搜檢幸虧三妹妹周旋了這件事説金鎖去得奇怪同他二哥哥這塊玉一樣那時候也不用取什麼吉慶話別的拿一盤戴上等他們慢慢的找後來也總沒有下落今兒見了你戴的可巧鐫的字樣相同的像就是這一盤或者其中有個來由所以我也要問問妹妹李紈話未説完紫鵑在鶯兒屋裏聽見忙走出來就把金鎖的緣由細細講明李紈聽了默默會意寶黛二人合有金玉姻緣天工布置巧妙真難測度探春道如今這件事已明白了大半可知就是這盤金鎖了但好好在屋子裏的東西怎麼失去了還得問寶姊姊寶叉只是笑而不言探春見寶叉不肯明言知其中自有緣故上緊問他根究寶叉不能隱瞞只得笑道原是我嗔恨他瞞著鶯兒這班人撩在火盆裏的後來怎樣混出去連我也不知道了李紈探春都笑道這就是了於是大家又談論了一會夏金桂的事李紈探春先走了黛玉把金鎖褪下送還寶叉原璧歸趙寶叉再四推謝道這合該是你的東西豈可還我黛玉道我已有了娘娘賞那一盤這一盤送還了你豈不是你我都有了如今何必又分彼此説著便將金鎖遞給鶯兒寶叉也只得受了停了半晌才開口道你病好回家這幾時咱們總沒見面聽説你的脾氣都改了我還不信此番相聚一個來月真看出你來了你待媽媽的情分我都知道感激不盡難道你未卜先知我要附體回生還到這蘅蕪苑來住的真所謂一死一生乃見交情講到他為了你去做和尚就我這一面看起來未免忍心其實早有這句話也怪不得他至於你的苦處也知道但是我做女孩兒我的媽媽做了主叫我怎麼樣呢你自然該原諒我我説一句不怕你惱的話你先前的存心行事也太古怪夠欺壓人的了黛玉笑道説我欺壓人上頭是天寶叉道不説你如今説的是從前你自去想罷黛玉沈思半晌道咱們早知道可以像如今這樣在一堆兒過一輩子你我都不至遭意外之事了寶叉道你説這句話一點也不錯早知今日悔不當初黛玉道別的話也不用講了我怎樣脾氣古怪你到底説一兩件我聽聽寶叉道我也説不得這許多編幾首竹枝詞給你聽去説著一頭想一頭寫一首一首的遞與黛玉看道老媽因便送宮花順路分來禮未差情分一般皆姊妹爭先畢竟讓誰家奇方海上制應難荷蕊梅花共牡丹自是傳來醫熱症何須著意冷香丸偶然雪夜暖瓊酥酒自宜溫話不誣何事旁敲來刺語故嗔侍婢送銅爐詼諧談吐欲生風行動何曾一返躬羅帕輕拋因底事天邊呆雁笑怡紅年來未展翠眉顰蝶怨鶯秋豈為春乞到微生鄰院去不容人戴赤麒麟自家多淚不為奇反指旁人作解頤一自怡紅承夏楚滿缸誰把棒瘡醫較量身材瘦與肥如簧相詆不知非馬嵬千載思芳躅媲美難當楊貴妃杯弓蛇影古來聞暗裏難將黑白分試問身旁棕拂子可曾羅帳逐飢蚊黛玉看道倒虧你好記性拉拉扯扯連人家和你取笑的話也編派在我身上了算數了罷不必再謅下去了寶叉道如今也不必説人家自己從前之事概付東流我同你兩個人竟不算死後還陽只當過投胞胎到大觀園裏來了結前生的情緣蘖債就是了正在説笑寶玉進來見了這幾首竹枝詞有知道的事也有不知道的事不過他們追敘舊話閨幃嘲笑之談看畢隨手搓了個紙團兒撩了寶叉道怎麼把我寫的毀了又怕得罪你林妹妹今兒當你林妹妹在跟前我要問你一句話可要抖出良心來説不許口是心非你待林妹妹和我兩個人到底和那一個好寶玉道都好寶叉搖頭道只怕未必為什麼林妹妹死了你去做和尚我死了你做了和尚倒還俗寶玉笑道別講做和尚不做和尚夫婦之情總是一樣的寶叉冷笑道你説到夫婦之情這會兒沒有外人在跟前我説一句話我先前只當伴你做了幾個月姊姊算不得夫婦只有寶叉説了只有兩個字便住了口黛玉道只有什麼怎麼不講下去了寶叉道講下去怕你著惱黛玉道你們的事與我何干寶叉笑道我們的事倒偏有你這些話我也説不出口來你私下悄悄去問他就是了寶玉笑道如今呢可不像姊妹了還有什麼話説呢寶叉聽了笑臉微紅便默默無語寶玉又道別的事都算我的不是為什麼林妹妹回過來好端端在瀟湘館後來要回家去你也聽了人家瞞著我不説句真話呢寶玉詰到這裏寶叉竟無詞可答寂然半晌只得勉強支飾道何嘗不和你説過實話呢寶玉道屈天屈地的你幾時和我説過林妹妹病好的話寶叉笑道你做祭林妹妹祭文給我瞧我説題目不切文章明明對你説人還活著何為祭文你自己解不透寶玉想了一想道果然有這句話的這時候我心思瞀亂那裏想得到呢黛玉道你做的祭文在那裏給我瞧瞧寶玉道悖悖悔悔的事還瞧他什麼黛玉道古人如陶靖節之自祭司空表聖自著墓銘最為曠達今及身而見祭我之文更為千古美談説著立刻索取寶叉道這稿紙不知撩在那裏還得去問襲人黛玉便令小丫頭去叫襲人來寶玉與他細細説明叫去找尋襲人道我也記起有這件東西如今屋子都搬騰過了怕一時沒處找呢説著連忙回去叫了麝月同去找這稿紙找了一會在寶玉書箱裏頭找著了麝月道不知可就是這不是再沒有別的了襲人道上年林姑娘回南上一天我見二爺寫的多分就是這個襲人接過便至蘅蕪苑送與黛玉看道嗚呼三更雨夜鵑啼淚以無聲二月花朝蝶銷魂而有夢追憶仙遊舊境恨三生債自難酬朗吟莊子遺編悟一點靈應早毀維我瀟湘妃子髫年失恃內賓依舅氏之門夙慧能文進士競關家之號妝台弄粉向無同櫛之嫌繡榻橫經不異聯床之友茜窗剪燭共寫龍華苔徑牽衣同扶鳩杖戲解連環九九消長日以怡情間尋曲徑三三餞殘春而覓句詞勒螭蟠碑上蘭室增榮才傳鳳藻宮中椒房志喜綺閣悟參禪之諦直勝談經繡闈拜問字之師無須載酒賈勇續金箋一五律杏簾獨冠群芳補荒臨玉版十三行松墨真貽至寶吟詩結社字疑香圃搜來集豔成圖室貯水仙作伴敲枰落子饒有餘間擊鉢留音何須索句落紅冢畔埋香竊步芳蹤櫳翠庵中試茗叨陪韻事折絳梅於雪裏溫酒宜寒抒彩線於風前慧心格物剪通靈之穗規過增漸收拭淚之巾邀憐知感詎意變聲忽兆驚聽緑綺之音無端讖語先成謬改茜紗之句鷓鴣春老絮欲沾泥鸚鵡詩傳花誰埋冢似曾相識乍逢訝有前因畢竟非凡永訣難憑後果聆歌榭霓裳雅韻已傳小像於登場拈花枝曉露清愁早逗元機于宣令試認粉筠個個淚點常斑空餘香屑重重吐絨尚豔蓼風軒裏堪摹入畫之容蘆雪亭前難覓聯吟之侶籬畔如來問菊孰意悲秋池邊留得殘荷阿誰聽雨緑窗明月尚留垂露之箋青史古人已渺駢雲之駕鬥寒圖在尋蹤許問霜娥焦尾琴亡遺響空悲月姊乞借仙莖之粒化丈六金身擬浮宿海之槎渡三千弱水昔聆侍戲語驚魂早渡江鄉今嗟仙佩遐升濁魄難追碧落看攝影花飛隨去問盡頭天在何方記前言於漏盡燈殘早驚塵夢泐寸臆於天荒地老聊慰泉台雲爾黛玉一頭看一頭想難為他把頭裏瑣瑣屑屑的事都記在肚子裏寶玉真是知己我就當真死了沒有回過來留此一篇祭文雖死猶生寶玉坐在一旁察看黛玉神情怕他見了祭文傷感便在黛玉手裏奪過去火燒化了黛玉道這又何必留他瞧瞧有什麼使不得寶叉笑道你們兩個人的古典是那裏張羅來湊成這一篇將來林妹妹過八十歲生日就把這篇前後改換幾句可以當得壽文的黛玉道別要嚼舌了姊姊你提起生日咱們的生日上半年已經過的了等到明年再講這九月初二是鳳姊姊的生日咱們倒要給他玩鬧一天老太太也是高興的寶叉聽了笑道就怕像頭裏鬧出緣故兩口子又打起架來怎麼樣呢黛玉也笑道咱們索性把鳳丫頭灌個醉吃夠了酒自然不去吃醋了二人正在説笑寶玉坐在一旁只是呆呆的出神並不搭言就走開了黛玉道這不又是一件奇事他是無事要生出法兒來鬧的今兒為什麼聽替鳳姊姊做生日的話倒冷冷的走開忽然發起什麼心事來了寶叉道這個我也猜不透他二人商議已定便同去和賈母説了賈母果然高興到了初二日傳梨香院內兩班女孩子早上吃面午間酒席就擺在議事廳上一賀生辰二為酬勞的意思開戲後不約而同座上走了寶玉和玉釧兩個人黛玉悄悄叫秋紋碧痕分頭去瞧他們碧痕去不多時來回道剛才出去碰見跟玉釧姑娘的小丫頭説他姑娘到園子裏東南角那邊拈了香回來換衣服去了就出來的還説二爺也在那裏回來了話未完玉釧與寶玉先後進來衆人都沒理會惟黛玉心上已猜著他們幾分是日盡歡而散書無可紀之事不必細表過了幾日這天寶玉一早起來走出園去到清客相公房裏坐坐見嵇好古與詹光早就攏局程日興王爾調坐在一旁觀看見寶玉進去便都站起來笑道世老先生久不到敝齋來賜光了今兒難得移玉至此説著程日興讓寶玉坐了自己又拉了一把椅子過來擺在旁邊仍看下棋他兩個人各下了幾子詹光要另尋劫打寶玉指道這一著不應他不是這一大塊黑棋都沒有了嗎詹光算了一算道幸虧世老先生提醒這一著竟看不出來呢嵇好古道向來從沒領教過倒不知世老先生手談亦甚精明程日興道我聞説世老先生這兩位夫人都是高明的自然是刑於之化了嵇好古笑道程兄的通文好似趕老羊叫了個倒通了呢寶玉忍不住地笑起來程日興臉上一紅嵇好古連忙把話岔開道正是我們求世老先生的單條字幅好幾年來還沒見惠如今的筆墨可是越發難求了寶玉道什麼話如不嫌棄過兩天塗幾張奉送補壁就是了程日興道且慢説求字的話世老先生的喜酒我們都擾過了但詹王二兄原是冰人世老先生該替己端整幾樣好菜謝謝媒牽帶我與嵇兄做個陪客寶玉笑道一定要奉邀王爾調道聽説令侄的文章很得意自然是恭喜的咱們先擾了令侄的喜酒再講寶玉道我正為此在這裏打聽今兒放榜早該有信了這會兒鴉雀無聲怕沒想頭了一語未了只聽一棒鑼聲喧嚷進來不知的是賈蘭是賈環且看下回分解
