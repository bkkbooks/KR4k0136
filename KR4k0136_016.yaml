body:
  text: 第十六回夜守空房老嫗疑怪心無宿憤方物將情話説林之孝家的來回瀟湘館出了妖怪紫鵑戲説推晴雯去睡歇李紈尚未開口那晴雯一聽紫鵑的話一則因上夜老婆子搗鬼未必實有其事二則他為人膽壯心直被紫鵑一激竟勇往直前三則因投繯時見土地情形自知定有個好結局命不該絶何懼這些便向紫鵑道那倒不用來拗逼我今夜就去看當真有什麼精怪出來拖了我去不成便要打發人到紫檀堡去取他鋪蓋林之孝家的笑道晴雯姑娘還是那麼性急你看天也黑了二三十裏路來回還趕得進城嗎李紈道聽他的話就要取東西也不便打發一個小子去聽見太太説起要留他在裏頭多住幾天少不得打發個老婆子出去走一趟連要用的東西叫他拾掇了進來這裏還少了他鋪蓋的不成了紫鵑道我就有現乾淨被褥姑娘走的時候給了我五六床都沒用過呢李紈又向晴雯道罷喲你才進裏頭來他們既是見神見鬼説那裏不乾淨何必定要去充好漢呢我勸你不如安安靜靜在這裏歇罷林家的笑道那是晴雯姑娘説的玩話大奶奶又當真勸他起來如今且討奶奶的示下只好先叫他們挪個地方底下再瞧罷晴雯聽了這話越發執意要去道林嬸子你倒別説我的是玩話叫他們給我把炕燒得熱熱的我吃了飯就過去林家的笑著走了不多時果見瀟湘館上夜的老婆子提了燈籠來接晴雯道剛才林大娘來説姑娘有膽氣肯到那裏去住這是極好的了我們兩個萎蕤不堪的老婆子仗著姑娘的威風膽子也大起來了一面晴雯便催紫鵑拿出被窩褥枕等物交付來的老婆子晴雯又要了幾枝安息香同了兩個老婆子出了屋門紫鵑趕上來叫道晴雯姊姊你到那裏害怕就叫他們送了你回來別臉上下不來小性命要緊晴雯回頭笑道你明兒早些起來聽信罷説著出了稻香村來到瀟湘館老婆子引著晴雯徑到自己睡的屋裏道把我們的被窩挪出去讓姑娘在里間屋子裏歇晴雯道我今兒倒先來逛過一趟呢怪道沒見你們一個白日裏就遠遠的躲開了我受不得你們這屋子裏一股醃臢味兒倒讓我在外間屋子裏歇罷把火盆給我生得旺旺的儘管睡你們的覺有妖精來讓他先吃我那老婆子道姑娘又來講笑話了一面就在外間炕上把被褥攤好添上火盆內的炭炷上安息香關了屋門一切收拾停當一個老婆子又灌了一小壺白酒一手拿了一包花生一包鹽炒杏仁兒送到晴雯面前道姑娘喝一杯趕趕寒氣晴雯搖頭道我不喝你們也少喝些別灌得大醉了停會妖精來把你們連骨頭都吃了去還不醒呢那老婆子道姑娘別再講這些話來嚇我們了當下老婆子們自去喝酒晴雯因不帶針線過來無可消遣獨自一個人坐在炕上因地思人未免想起林姑娘來發了一會心事寒天夜漏正長屋內並無鐘錶遠遠聽得譙樓正交二鼓窗外忽起一陳風來吹得竹枝簌簌有聲里間屋裏兩個老婆子早已睡熟打的鼾聲不絶晴雯此時也覺有些膽怯站起身來把蠟花剪了剪靜聽院子裏毫無響動且去就枕直挨到三更有些倦意朦朧合眼一覺睡至天明醒來見兩個老婆子都已起身説夜兒真睡的安靜托姑娘的福把那邪祟都壓住了如今可天天要求姑娘在這裏住著呢一個老婆子早舀了臉水進來晴雯便起身穿好衣服道我不在這裏洗面當下出了院門望稻香村來徑到紫鵑屋裏紫鵑道我正要來瞧你夜裏可見些什麼晴雯道來的一群妖精都是青面獠牙要來找紫鵑姑娘的説他先前住在這裏為什麼躲開了我和他們説如今在稻香村住著仔細今夜來找你呢紫鵑笑道你本是狐狸精如今可和外四路的妖精認了朋友來欺侮人家我也不怕一面取出梳具借給晴雯晴雯趕忙梳洗了來見李紈回明夜間無事的話李紈道我早知是他們造的謠言便叫林之孝家的來説明林家的將信將疑嗔怪上夜的婆子胡説晴雯一連三夜在瀟湘館住歇照常安靜到了第四日因在那邊諸色不便便不肯過去老婆子們料不能相強只得把晴雯的被褥送了稻香村來晴雯自與紫鵑同炕睡歇夜長話多晴雯自然要將自己出去後園內的情節細細盤問前日周瑞家的所講不到的情事紫鵑與他痛快直談聽得晴雯忽而眉豎忽而淚垂忽而罵那個忽而怨這個竟似聽了一本有悲無歡有離無合沒團圓的新戲紫鵑亦如琴遇知音流水高山彈的不厭不倦直至五鼓始睡過了兩日晴雯不在瀟湘館便又作怪起來鬧的兩個老婆子一夜沒敢睡覺等到天明才打了個盹沒法兒又來找晴雯晴雯生氣嚷道我是太太的恩典叫進來在裏頭玩幾天不是替你們上夜的真是活見鬼我在裏頭住了幾夜何嘗聽見娘的什麼響動偏偏我走了又鬧起什麼妖怪來了我又不在龍虎山學過法的妖怪就怕我了誰耐煩憋在你們這屋子裏住呢任憑妖怪出來把瀟湘館的屋子都踩平了也不關我事晴雯正在這裏吵嚷那邊惜春偶然來到李宮裁處坐坐李紈説起寶玉至今尚無下落惜春道算起來不久該有消息了正説著聽得晴雯的聲音在那裏喧嚷李紈便叫素雲過去查問素雲轉得身王夫人處打發小丫頭來請李紈李紈就把此事撩開一徑走了惜春素來不管間事隨後也起身要走素雲回來因此事奇怪便將晴雯吵嚷緣由告訴了惜春惜春叫素雲去叫那兩個老婆子來那老婆子素知惜春在園不理家務今聽他叫喚只得過來要把前後情節回明惜春道不用你們講我都明白咱們園子裏正要興旺的時候那裏有什麼妖孽你們既然害怕我給你們鎮治鎮治就好了便叫老婆子跟到自己屋裏命彩屏取了筆硯裁了半張紅紙提起筆來寫了幾個字當時封好又在封面頂頭畫了一圈遞給老婆子道你記清楚了有圈兒的為上別顛倒過來拿去高高的粘在屋門上邊包管你不聽見什麼響動就是了可不許拆開封來倘給人家瞧了一瞧就不靈了老婆子雖然不信只得謝了惜春先將紙封兒拿去粘貼不道果然靈驗書且少表再講李紈來到王夫人處見從前送黛玉到南邊的人回來了炕上堆著許多東西都是黛玉給他帶來送人的自賈母起以及邢王二夫人東府珍大奶奶婆媳薛姨媽凡素日相好各姊妹連趙周二姨娘都每件上粘簽記認另開總單一紙無非江南土物綢綾香粉巾帕筆墨箋紙配搭得宜輕重不等外送妙玉伽南鑲嵌珊瑚佛頭念珠一串海南香四束龍井茶二瓶尖筍尖兩簍又敬獻佛前鵝黃哆羅呢顧繡龕門一挂絹地錦裱白描達摩渡江一幅系名人手筆王夫人因見內有送寶玉寶叉二人的物件不覺觸目傷心垂淚不已講到黛玉焚巾時已將自己所送寶玉之物一一索回毀棄以示決絶因何又送寶玉的東西不知黛玉近來心地將皈於一塵不染境界胸中何有寶玉既無寶玉而衆姊妹皆有投贈獨寶玉無之則未免尚有芥蒂即非菩提無樹明鏡無台之本意矣今不知寶玉已經出家只作泛常應酬聊盡多年兄妹一處相聚舊情親之正以疏之從前臨行時必欲與寶玉晤面辭別即此意也此時王夫人因鳳姐正在病中叫李紈來先把送賈母的東西理出自己引著送黛玉的老婆子並家人媳婦同到賈母屋裏預備老太太要問林姑娘家裏的事留下一個老婆子叫李紈照單打發逐一分送各處除開了寶玉寶叉這兩分李紈恐王夫人見了又要傷心便叫麝月鶯兒兩個來吩咐道這是林姑娘叫送他去的人從南邊帶來的東西送你姑娘的你拿去收著罷送二爺這一分麝月拿去擱著等二爺回來再給他麝月等各自拿回東西獨有鶯兒氣苦交加把東西瞧也不瞧隨後一摔麝月自與秋紋議論一番將物件好好收藏起來這裏李紈料理停當王夫人才從賈母處回來見賈璉手中拿了一封信來回王夫人道老爺任上打發人回來另有與老太太請安稟帖這是給侄兒的書子隨念道兩月以來不接家書殊深繫念前閲北闈鄉試題名録知寶玉已徼幸一第欣甚慰甚但須囑其用心攻書努力春闈勿稍自滿為要昨接雨村來書為甄寶玉與林家甥女求庚此子曾經面見比我家寶玉學問大有進益稟過老太太如肯許親我當覆允再我抵任後因地方偏災礙難奏辦已挪庫貯兵餉銀二萬兩發賑濟民現屆散餉日期不遠別無設法可速措辦銀兩趕緊送到萬勿遲誤余言囑家人面陳不贅璉侄寓目存周手書賈璉念畢説道侄兒問過來的人説老爺到任後清廉聲名頌揚載道果然是好但如今家裏正要打過年的飢荒又添出一宗銀子來説不得盡力去張羅至於林妹妹回了家這裏沒有稟過老爺甄家央雨村作媒也沒提及此話這是極容易稟覆的講到寶妹妹死生有命也可不必隱瞞獨有寶兄弟這件事便怎麼樣呢前兒工部裏查出江西南昌郡屬有一座大荒山同雙角山博白山相連已經打發人尋去叫不必到老爺衙門裏頭恐怕擔柴老頭兒説的是一句沒影響的話寶兄弟未必在這個地方如今回覆老爺信裏要提不提還得請太太的示下王夫人沈吟半晌道據我看起來竟不必藏頭露尾叫老爺知道了那裏也好留心察訪橫豎這會兒銀子也沒現成臨時再商量罷賈璉答應出去回到自己屋裏跌足連聲歎道這個日子怎麼過人瞧著人家放了外任整幾萬銀子拿回家來那裏有家裏倒搬銀子出去的果然金庫銀庫堆著也罷了難道不知一個空架子還支不起來怎麼樣容易打發人來立逼著就有兩萬銀子了況且江西一省的官多著哩單要老爺去管這些間事放起什麼不準支銷的賑來我也沒處打算喝醉了睡我的覺罷説著叫平兒去燙了酒來垂著頭一聲兒沒言語只顧喝完了酒跛離著腳步到西屋裏炕上躺下鳳姐那邊不聽見賈璉聲響便問平兒道二爺呢你請他過來我有話問他呢平兒掀簾進來走近炕沿回説二爺已喝的爛醉到那屋裏睡著呢鳳姐微笑道剛才聽見他嚷的像是説老爺任上打發人回來要銀子果然是飢荒但就是這樣瞎生氣灌一泡子黃湯就灌出銀子來了他既然醉了明兒再和他説話罷到了次日賈璉一早出門各處去張羅了半天回來只聽門房裏幾個人都是愁窮歎苦道這樣日子怎麼熬得下去要帳的才走了一班又來了一班咱們二爺近來倒像去賴債祖宗那裏學了口訣來似的也不肯約人家一個準日子總是停停歇歇打瓜皮醬的話賠茶賠酒是咱們的名分如今沒法兒可帶挈兄弟到老爺任上沾個光兒嗎那一個人答道老爺是要做清官將來升調起來想地方上豎滿德政牌的各州縣的饋送連本衙門的陋規一概革除你們想官兒不要錢咱們弟兄還有什麼法兒去弄嗎現在跟老爺的人都站不住告假的告假求薦書的求薦書十停倒走了五六停咱衙門裏薦出去的人漕務裏是有拿手的就想沾光他們一千八百也不為稀罕那裏知道老爺又不肯掐住人家脖子幹寫的書子是王胖子的褲帶稀鬆一個個都送了幾十兩銀子碰了轉來如今漕糧都收足快了弟兄們再跑到那裏去保不定老爺一定肯薦單靠著弟兄們拉攏自然不肯叫出去跑海丟臉也未必一丟一中站個拿事的門印好不過派上一分幹股子人家吃了肉去我們去喝湯還不夠添補衣服靴帽講到本衙門裏的出息只瞧著老爺到任以來這幾個月正正好時候還打發人家裏來拿銀子就是做兄弟的明知各位在這裏苦苦的不能盡一點敬意真抱愧的了不得賈璉心裏正在發煩聽見這番話越發垂頭喪氣悶悶的走了進來才到屋裏平兒便道二爺今兒起的好早奶奶請爺説話早跑的沒影響了一面小紅在旁打起簾子賈璉走進鳳姐屋裏便問今兒吃了藥沒有鳳姐道這兩天我的身子硬朗了好些今兒叫他們不用煎藥大後兒已是三十了沒的薰得滿屋子裏都是藥氣趕這年裏頭還要掙起來給老太太太太辭歲拜年呢我瞧你這兩天忙得什麼似的老爺的銀子可張羅出來沒有賈璉道我明知指著我的臉白去給人家開口估量著老爺現任的缺人家都知道是好的就借上他銀三四萬並不是還不出來問了好幾處那知銀局子裏這些老西兒耳朵更長都説老爺是不要錢的缺雖好有名無實還起銀子來保不定許他們九扣二分錢都不肯借這有什麼法兒因此我想起先前鴛鴦經手借老太太的當頭已經贖還的了如今還得和他商量不是老太太叫我寫的賞單找著寶玉送回來賞銀一萬兩老太太自然有現成銀子擱著老太太既然疼愛孫子難道不疼愛兒子老爺現虧空著兵餉銀兩雖然以公濟公免不了丟官問罪如今寶玉還沒有找著何不就把這宗銀子先應了老爺的急有了一半好再去打算鳳姐撲嗤一笑道倒虧你實在想的到老太太為著寶玉使碎了心所以不惜重賞叫你們去貼招子如今寶玉還沒影兒倒看相老太太這宗銀子起來就不疑心你們安心不去找寶玉也叫他老人家聽了傷心這是何苦來呢罷喲我積攢的幾兩銀子再拿東西去質當只怕湊得上這個數兒來賈璉道那麼很好只算替我轉一個肩將來仍算還你三分利錢何如鳳姐欠起身來輕輕啐了一口道我要盤剝利錢盤剝到自己家裏來還成了一個人嗎到底來的人幾時動身賈璉道過了新年到燈節前打發他走也趕上了還有一句話和你商量這兩天有幾注要緊帳必得開發這裏頭我先挪三千兩去打個飢荒可使得嗎鳳姐道我説你就見不得銀子我的東西橫豎交給你的了過了年填不上這個窩兒我可再沒有了賈璉道誰再來打算你的過了年底下就好移挪你盡管放心總誤不了老爺的事鳳姐就叫平兒道前兒恆舒當這張三千兩的銀票你拿出來先給二爺賈璉便歡天喜地的出來等平兒取出銀票接過看有字型大小銀數忙插在靴掖子裏頭自往外邊清理帳項一路暗想鳳姐的銀錢總是有進無出莫非因這場病都看破了可是從來沒有的事不説賈璉心中思想再講送黛玉回來的人在賈母處問了好半天的話才退出來一個老婆子又提了一個包袱進園來找紫鵑紫鵑正同晴雯聽素雲講起林姑娘南邊送了許多東西來開著單子一分一分送人的話老婆子進去見了晴雯已忘了他從前的事照常一個個問好一面打開包袱道這些東西林姑娘替另給我裏頭也有一張單兒開明因我認不得字叫紫鵑姑娘瞧著撿出那幾件子是送姨太太和香菱姑娘的交給我送去余外都是給姑娘的了紫鵑也顧不得看東西便問姑娘身子近來是大好的了路上平安到家怎麼樣光景老婆子笑道林姑娘身子也很好一到家就有人家來提親要恭喜呢紫鵑聽到提親便呆了一呆問是那一家呢老婆子答道聽説是什麼甄家寶玉紫鵑一聽寶玉二字越發神思瞀亂便道怎麼説是寶玉去求親如今寶玉在那裏呢老婆子道寶玉自然在家裏紫鵑急的變了臉道你怎麼這樣糊塗素雲在旁笑道他倒不糊塗是你糊塗呢他明明講的是甄家寶玉不知你聽到那裏去了紫鵑被素雲一證倒覺不好意思便又問道甄家寶玉説親你可知道放定了沒有呢老婆子道多分放定了罷素雲道那是沒有的事今兒老爺任上有書子來還提起林姑娘的親事説是雨村本家替甄家作媒老爺不肯做主請老太太的示下呢紫鵑道原來還有這一節事怪道你肚子裏明白一面又問老婆子道寶二爺出去做了和尚林姑娘家裏可知道沒有老婆子道我才回家來他們和我説的隔了兩三千里的路怎麼就知道呢晴雯道你也問的太嘮叨了把送人家的東西理出來給了他叫他快去送罷於是紫鵑就把送薛妻太太同香菱這兩分交付老婆子道今兒天也不早了你拿去擱著明兒再送也不遲老婆子答應著轉身出了屋門又回來道林姑娘還吩咐我的話才記起來説裏頭還有一幅畫是林姑娘寄來給姑娘瞧的別落在旁人手裏看過了交給大奶奶收好底下有人到南邊去包好了寄還林姑娘呢紫鵑心想不知一幅什麼畫兒説的這樣鄭重便一件件打開紙包不過是些新樣花朵精製宮粉杭州的絨線常州的篦箕之類紫鵑都無心觀玩連晴雯素雲二人都爭先要看那幅畫兒當下紫鵑找出了這幅畫展開觀看不知畫的什麼故事且看下回分解
