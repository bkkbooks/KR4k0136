説到那裏去了真可謂強項矣探春道咱們別再講戲了就聽史大妹妹的話玩品實是高的他同二哥哥兩個鬧了半年的詩社還沒鬧成如今年也近了趁這新閣子落成人也齊全咱們到這裏來起一社好過年明兒的東就算了史大妹妹的寶玉聽了歡喜道虧是三妹妹提醒鬧了幾個月戲竟把這件事忘了咱們何不就定了明兒遲了一兩天怕滿園子裏雪被太陽收拾了去減了梅花的精神就掃了咱們的詩興了先算算有幾個人寶叉道先前詩社裏頭的人都在這裏沒短一個黛玉道還添了琴妹妹紋妹妹綺妹妹香菱四個人探春道可巧二姊姊昨兒回來了還要拉大嫂子在那裏李紈道賀林妹妹新婚詩我胡謅了幾句你們起詩社別拉扯我寶叉道大嫂子不高興這裏人也夠了當下約定席上傳杯弄盞極盡歡娛不多時閣子內外已點上燈賈母高興了一天未免有些倦怠向薛姨媽道這會兒瞧到外邊去恁什麼白的紅的都不見了一面叫鳳哥兒再讓姨媽幾杯酒薛姨媽道今兒陪老太太已吃的不少咱們也該散了請老太太去歇歇罷當下鳳姐忙催端飯各席上點景用了些丫頭老婆子們爭先掌燈先有許多人上前扶賈母下了梯子出了半仙閣各自散去寶玉跟黛玉回了瀟湘館黛玉道今兒寶姊姊和史大妹妹兩個人的話史大妹妹果然是詼諧遊戲之談寶姊姊亦非守矩循規之論你雖然在家裏逢場取樂傳揚出去到底有礙官針非金馬玉堂人所宜蹈此寶玉道那怕什麼我同年裏頭就有好幾個會串戲的柳湘蓮二哥最愛串戲他還做了神仙呢既是妹妹這樣説我不玩這個就是了説著便涎臉兒過來與黛玉代除簪珥道我不串戲聽了妹妹這會兒妹妹也要聽了我一句話黛玉道有正經話儘管請講寶玉笑道就是前兒看見元史上講的我也和妹妹參一參祕密大師樂禪定黛玉喬嗔帶笑把寶玉推開道你今夜才到這裏來歇又要參什麼禪我也多吃了幾杯酒了快替我安安頓頓睡覺罷再來鬧我要攆你出去了話未完聽得自鳴鍾上已打了四下寶玉道果然時候不早了明兒還要起早呢當夜無話就寢次日清晨起來王道士已經打發人來通知起懺趕忙到天齊廟拈了香瞧了供的疏紙是尤三姐金釧司棋可人智能另立一疏超度秦鍾果有二十七員羽士在後殿上志心朝禮寶玉並不久坐留壽兒雙瑞兩個小廝在廟裏照應自己帶了焙茗掃紅回府徑進園子裏先到瀟湘館見詩社裏人都已齊集黛玉先叫人去和柳家的説了今兒的東是史大姑娘的照昨兒的菜一樣備三席暗裏又替湘雲給了錢當下雪雁忙催傳二爺的飯才一疊連聲應了出去寶玉見里間屋子裏秋紋同五兒兩個還未吃完便坐下把他們剩飯殘菜胡亂吃了些衆人見了都發笑湘雲道二哥哥今兒真忙的連吃飯工夫都沒有了説著一群人同寶玉來至半仙閣黛玉道昨兒因老太太步履不便都坐落在第二層閣子裏今兒可要更上一層我已吩咐他們把火盆鋪墊安排停當早有寶玉跑在前面引衆人上了第三層閣子見四面也是一色嵌鑲玻璃窗臨窗遠眺園中山坳水曲樹木橋亭一覽無遺湘雲道這會兒瞧起來越顯出蘆雪亭即景詩象伏千山凸蛇盤一徑遙這兩句描摹入神寶琴道雪裏紅梅果然另有一種丰韻天賜胭脂一抹腮未足盡其妙處怪不得老太太誇他比白的強探春道文花姑娘的豔曲亦可為紅梅生色湘雲道別盡間話了先擬了詩題大家好謅兩句你們不瞧對子上的就便沒有詩魂難道詩屁也不放一個説的衆人都笑起來寶叉道我瞧他的對聯不如用邢大妹妹這兩句緑萼添妝融寶炬縞仙扶醉跨殘紅黛玉道琴妹妹的間庭曲檻無餘雪流水空山有落霞越發超脫的配這閣子上對句寶玉拍手道果然我倒忘了他們這兩句了明兒把我的除了挂上他們的湘雲道這又何必毀你的呢瞧這裏該用對子的地方還不少再挂上兩聯就是了這會兒且別講對擬題要緊寶琴道今兒的詩題本地風光自然脫不了梅花寶叉道詠梅花的詩太多了憑你怎樣翻新總不免拾前人牙慧探春道咱們也像頭裏詠菊如憶梅訪梅種梅多擬幾個可不好黛玉搖頭道題先犯了抄襲的病有何趣味我倒想得些好詩題在這裏寶玉道妹妹既有好題快講出來給咱們聽聽黛玉便提起筆來接連寫了二十餘個就是張功甫論梅二十六品衆人看了都道好這幾個題卻不見有什麼詩説的仍是梅花妙在轉了一個彎子題目就新鮮有趣該有好詩寶玉道別如先前憑各人自己去揀我有一個條陳在這裏説著便寫了二十六個鬮疊攏盛在盤裏叫各人去拈湘雲先去拈了三個黛玉道再沒他猴急我讓了你不算為奇説著也去拈了三個香菱忙推寶琴道姑娘還不快去拈停會兒盤子裏的鬮兒完了説著便動手去拈了六個分給寶琴一半隨後探紋綺岫迎每人拈了兩個寶叉瞧盤子裏只剩了四個鬮子還有寶玉未拈只得去拈了兩個剩的讓與寶玉各人仍去賞玩梅花暗暗把所拈的題搜尋佳句黛玉道今兒不必刻香為度不許給燭就是了探春道刺繡才添一線的時候這兩首詩也夠咱們玩兒了那邊岫煙指著窗外道你們望到櫳翠庵裏可不是都瞧見的四妹妹不知在裏頭幹什麼今兒請他也不來早知他去住了這裏起造閣子可不用告訴妙師父了寶玉道幸虧先去説一聲不然前兒他這一走倒疑心有別的意思了黛玉道你們盡仔説話我的差不多完快了等掌上燈收卷時就不接你們的卷子呢當下被黛玉提醒各自索句揮毫不多時衆人都已落稿互相觀看先念黛玉的詩道輕煙飄搖步屜木九疑峰煙細浮藍徑不封指點林霏非近市分明仙豔好尋蹤為憐香斷籠紗淺小障春寒著月濃領袖衆芳清韻遠回看九點百花叢薄寒雪蕊瓊英勒北枝小寒春信故遲遲沖將有意還思放清到無言更不知玉倩誰溫皴未甚花堪共笑冷猶持詩情羞似何郎健學把寒香沁入之林間吹笛何處梅花一曲終蕭然身已到山中影隨聲寫尋常月吹引香飄斷續風人倚畫樓花笑俗鶴歸雲徑雪初融貞心試罷湘江竹落寞林間萬籟空又念湘雲的詩道細雨徘徊月地共雲街既趁新晴雨亦佳銀線潤沾迎歲管寶珠香溜辟寒叉凝脂餘濕明如洗倚竹無聲淨欲揩定有詠花人過訪春帆搖曳水雲涯疏籬窈窕籬根露蘚斑分明瓊樹影班班枝高花自重重密竹細藩仍處處間坐久香清篩夜月夢回林靜逗春山歸輿圖畫梅邊照冗處青鏤筆盡刪孤鶴臒然素影共寒林夢繞清香恰在陰愛爾形單偕古意羡伊影冷獨知音孤山巢閣雲中翅明月揚州物外心雞唱午前群衆衆溪橋間步自孤吟又念探春的詩道曉日曙報銅鉦挂古梅殷勤送暖百花魁橫斜素影金烏近睡起新妝寶鏡開同夢餘情隨曉逐北枝半面破寒來晴窗細玩華光淡藥向孤山旭照回石枰下棋豈是偷間誚野狐寒窗梅影不須辜高情寧借文犀飾冷韻何嫌三百枯落子間睡鶴空林寂寂倦花奴談餘細檢枰間局幾笑清音雪共輸又念寶琴的詩道膝上橫琴修來生已是同根恰按梅花斷古痕鶴步林間親玉指鴻飛霞表伴冰魂揮弦韻繞山中樹顧曲人來竹外村延佇停琴容膝處雪消金鏡已黃昏松下昔年盟訂歲寒交訪竹還殷問鶴巢蔭滿冰魂篩日影香隨麈尾透林梢相逢袂向濤邊拂欲贈叉留月夜拋六旦五辰驚豔息何如清節兩蓬茅佳月雲淨香清憩小窗湛然仙迹已心降古來明月秋三五鏡裏寒梅此一雙姊自有情憐獨夜卿寧無夢伴春缸問誰一樣尋常看睡起參橫又悵雙又念李綺的詩道淡雲妒羅妙鬘弄晴微淡襯新妝月下妃慢席林梢空藹藹淺籠花影現霏霏無心應惜仙衣濕帶笑隨看玉葉霏願祝慈雲宏瑞蔭莫教清豔早春歸明窗問君春信寄如何靜對疏簾夢欲過忽見一枝橫瘦影恰教兩地泛金波堂前樹玉輝相照亭畔栽紅豔畢羅此日廣平援筆處寒窗對景凍頻呵又念香菱的詩道蒼崖山磴尋花路復南鞭停彳亍近煙嵐樹挨蒼廠春稠疊苔染清香境蔚藍玉瘦凝峰排六六枝疏瞰徑漏三三此中孰占風情盡笑對巉崖一靜參掃雪烹茶梅英雪影共春妍習習清風意欲仙山徑客來童乍掃瓦鐺鶴避茗初煎低分虛白通幽處細嚼寒香繼火前錦帳高兒群羡美笑餘花隱掬冰泉微雪漫道淩寒屬素裙銀花未許過紛紛灑枝豈遜三分白皺玉還開一片雲慣惹霜禽偷俊眼笑疑青女弄清芬金樽檀板心難醉雪裏吟香樂我貧又念寶叉的詩道銅瓶更深許與伴疏櫺滿屋幽香一古瓶垤起沙斑金作屋枝攢雪影玉為屏寒花不事官哥媚清韻還宜我德馨絶妙涵春君姓氏簷前笑誦擷英名紙帳巡簷料理聘紅妝寶帳春愁剡玉光減卻羅浮風露冷催將官閣海苔裝月明鑒徹惟知薄樹密裁成夢亦香自笑鴛鴦債未了與君偕隱且聯床又念李紋的詩道竹邊錦繃匝地湧檀欒數點春光畫裏看蔭滿橫斜聲簌簌香浮蓊債影珊珊幽居相對超塵俗自倚無言忘歲寒幸不折來傷古意此君應與報平安清溪浮光如許淨無塵為有貞姿接水濱四顧憑誰傳玉照一泓差許結芳鄰鏡中淡寫凝妝曉籬畔疏涵漱影顰偶點波心花瓣瓣寒香唼喋沁遊鱗又念迎春的詩道珍禽梨雲落寞夢如何啄宿飛鳴性自舒香惹緑毛頻采采隱隨皓翅共與與可人最是尋芳蝶幽徑偏來踏雪驢寄語江南何遜道護花鳥已惜花疏夕陽未信詩成雪又稠晚晴春色更清幽斜陽酒肆人初倦薄暝山家屐尚留儼賜胭脂憑一抹何來瘴霧足千愁寒鴉不住林間噪好趁曛黃把盞酬又念岫煙的詩道小橋是否仙源白玉溪尋來略臥平堤逶迤水曲通林薄繡枕香迎過竹西驢背寒吟苔徑窄鴨頭春漲石梁低花光人迹涵清淺佇聽噍嘈隔岸啼緑苔葉未生枝緑未成春苔繡綺碧鋪平龍眠借得三分古蟾度相於五夜明欲費平章隨意坐不長掃淨益香清氍毹閣外花陰敞休遣青蒼屐齒迎寶玉見衆人都完便趕忙寫道多謝你們留了兩個給我也趕上了一時寫就衆人來念寶玉的詩道晚霞蹇驢向晚步山家遙指紅綃一縷斜樹老遠分夭矯勢夜寒預借綺羅遮蕭蕭飛鶩孤山嶺隱隱歸帆緑水涯按罷落梅花一曲更誰琴裏聽殘霞美人淡妝簪戴誰緣夢裏悵花嬌想像羅浮淡淡描數點香欺紅兩頰一枝春壓翠雙翹人來月下明華钅念韻繞林間影步搖不羡辟寒金飾貴花生雲髻燦裙腰衆人看畢湘雲道這一社是怡紅公子得手了寶玉也去看了各人的詩道你們都比我強是不用説的了我就服香菱姑娘的詩怎麼長進的這樣快公然是一位老手在這詩社裏可以頡頏群生湘雲道二哥哥你不知他是拜在瀟湘妃子門下早有緑蓑江上秋聞笛紅袖樓頭夜倚欄的佳句沒有瞧見嗎黛玉道他是青出於藍的了正經咱們的詩該去請教一個社外人評一評湘雲道社外人現有一位詩翁可去請教他衆人問是誰不知湘雲指出那一個來且看下回分解
