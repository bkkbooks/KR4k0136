body:
  text: 第四十七回延羽士禮懺為超生登高閣賞梅重結社話説黛玉等邀了探春來到櫳翠庵見了惜春都説四妹妹挪到這裏為什麼不言語一聲兒惜春道我住蓼風軒便是我的櫳翠庵櫳翠庵猶然蓼風軒我還是我叫你們知道怎麼呢難道也要像送妙師父這樣送我進院嗎一面讓坐見送上茶來的是入畫與衆人都磕了頭湘雲道前兒他的娘進來求珍大嫂子珍大嫂子説不來碰你這個釘子還是林姊姊看得準説你一定留他的惜春冷笑一聲道不是説我這位嫂子他眼睛裏瞧得什麼皂白出來我先前説的一個人總要看他最初這一步最初這兩字原不可看死了人能繩愆改過回頭轉來便是最初我頭裏不留入畫也不專為入畫起見他這樣苦苦哀求總不理他豈不知我的心早已決絶今忽然又要進來自然有幾分拿把料得定他這個身子可以跟我住牢在櫳翠庵的了先前應該攆他如今便該留他惜春這一番話聽得衆人都默默無語當下又敘了一會間話大家起身惜春留岫煙在庵下棋送了衆人黛玉等出了庵門順路賞玩梅花見天上彤雲漸布迅飛的從西北上推過東南微露淡淡陽光寶叉道這天氣有些意思雲大妹妹的東道怕要輸湘雲道打夥兒賞雪玩兒我願意輸這東道一路講話不多時行到荇葉渚前離蘅蕪苑不遠寶叉拉了衆人到他屋子裏去坐坐才進屋門不料寶玉一個人靜坐在內寶叉笑道這也難得的事二爺又做起靜攝的功夫來了原來寶玉於歡樂場中忽又動起一段感舊的心事想叉黛重圓襲晴復聚又添了鵑鶯兩個四兒五兒藕蕊等輩皆歸園內再推己及人小紅齡官萬兒亦皆得遂其願獨苦了死過這幾個人便把心事告訴了衆人想要延請羽士超度以慰香魂黛玉問道要超度的是那幾個呢寶玉道第一個是尤家三姐他因柳二哥退了親懷貞抱璞霎時玉碎珠沈委實的可憐可敬第二個就是金釧姐姐為了太太幾句話攆他出去就憤激投井死了豈不可惜黛玉道正是要問你一句話我記得金釧投井是在夏天那一天鳳姊姊生日你到園子裏去搗鬼什麼寶玉道我也不必瞞你們金釧姐姐就和鳳姐姐一天生日的不是頭裏派分子給鳳姊姊做生日我也為這個遠遠的跑到北門外水仙庵裏拈了香回來遲了老太太還教訓我的黛玉道這虧你好記性寶玉道我也忘了因你們提了鳳姊姊的生日才想起來呢如今你們大家給我想想該超度的還有什麼人探春道還有一個二哥哥忘了尤家二姐不也是吞金死的嗎寶玉道他是已歸璉二哥的人不用我去多事探春道這倒沒處想了若病死的也算數太太屋裏還死過一個可人寶玉道病死的雖不比死於非命但春花易老秋月難圓亦是人間缺陷也該超度的寶叉介面道眼前一個人也該超度為什麼你忘了寶玉想了半晌道我一時想不起姊姊和我説了罷寶叉笑道就是薛寶叉衆人聽了怔了一怔黛玉會意過來便和寶叉取笑道這一個人倒難超度呢若論要懺悔薛寶叉便該懺悔你要懺悔你又不該懺悔薛寶叉説得衆人都笑起來一時笑聲未止見四兒上來道園門上的老婆子來回請二爺出去會客寶玉知是要見的人連忙換了衣服出去見是雨村坐下講了幾句話雨村走了寶玉徑至賈母處適王夫人亦在裏邊寶玉滿臉笑容向賈母道剛才雨村本家來提鴛鴦姊姊親事也是孫子的同年又是世交不知老太太可許不許賈母道鴛鴦已認在你太太跟前便該你太太作主不知這個人年紀多少怎生個樣兒寶玉道包管老祖宗歡喜説起這個人來和我差不多王夫人笑了一笑道不害臊的因是老太太歡喜了你你就算是好的倘然像你這樣淘氣也是好的嗎賈母也笑道果然像得寶玉來也就罷了別他在這裏胡説寶玉道老祖宗總不放心説起這個人老祖宗同太太都見過的就是甄家寶玉賈母聽了十分樂意王夫人笑道璉兒媳婦回來就説起甄老太太要和這裏結一門子親到底被他們想了一個去正説著見鴛鴦來了大家一笑把話掩住賈母自與王夫人另講別的寶玉心上又有事盤算便出去叫小廝吩咐備馬往天齊廟去掃紅一面去叫馬夫焙茗問二爺這會兒到天齊廟去幹什麼寶玉和他説明緣故焙茗道二爺要做法事清虛觀路又近張道士到底敕封什麼真人的寶玉道張道士討人厭不如找王道士去説著馬已伺候寶玉帶了焙茗掃紅出門加鞭徑往天齊廟來王道士見了忙請安送茶向寶玉焙茗道二爺好久不到這裏來逛逛了記得還是同老媽媽來還願這一會來過了再沒來呢寶玉道王師父如今的膏丹丸散越發行的遠了呢王道士笑道托二爺的福頭裏説的療妒湯二爺回去傳給人家可靈驗不靈驗寶玉道別講這些話了我今兒來和你商量正經事要請幾位法師在廟裏拜幾天懺王道士問道二爺是薦祖還是外薦寶玉搖頭道都不是因幾個未出嫁的女孩子橫死夭亡要懺悔他們的意思王道士道這是要禮拜超生宥罪懺悔請羽士二十七位上表祭煉法師在外明兒做過太平火司醮會就起懺七晝夜圓滿焙茗在旁道二爺不到清虛觀至至誠誠求找王師父請的客師都要有講究呢王道士道瞧不出我王道士來往的師兄師弟都有些本領所以西門外一帶屯裏住的人到廟裏來求驅邪鎮宅符咒的比王一帖名聲還遠寶玉答道這麼講起來那劉姥姥家鄰居出了怪請你去鎮治可記得這件事嗎王道士想了一想道二爺説的劉姥姥年紀有七八十歲在屯裏住這一個劉姥姥嗎寶玉點頭道正是他王道士道他是老主顧時常擔柴到廟裏來賣的鬍鬚是雪白的了好精神寶玉聽了這話知他又是胡謅了便忍住了笑問道為什麼鎮治那一家偏不靈呢王道士道二爺不知這裏頭有個緣故先前那一個莊子上請我去拿妖拿住了一個螃蟹精把他裝在罈子裏封皮封了口我捧著罈子走到魚池邊只聽裏邊開口問我幾時放他我隨口應説再到這裏放你説著把罈子撩在池裏誰料劉姥姥又請我去拿妖偏偏這一家住的離池子不遠我一到池邊只見興風作浪水面上拱起曬扁大一個背脊來我喊聲不好了掇轉屁股狠命的跑才跑脫了寶玉道你不該跑呀王道士道怕妖怪趕上來吃了我呢寶玉道王師父你是有法力人家才請你拿妖你還怕妖怪嗎王道士道不瞞二爺説的大凡道士總姓不得王姓了王拿起妖來便有些咬手寶王問這是什麼緣故王道士道二爺不見戲裏唱的王道斬妖鬧得他有法也沒法了説的寶玉同焙茗掃紅都笑的腰也彎了王道士道別講笑話了正經請二爺把亡人的姓名年歲開明或死於刀或死於繩或是投河落井留個底子好填疏頭於是寶玉逐一向王道士説明焙茗拉了寶玉到一旁告訴道還有兩個人怕二爺忘了寶玉問還有那兩個焙茗道不是多姑娘勾搭上了璉二爺被璉二奶奶知道多姑娘吃不住一索子吊死的寶玉罵道放屁這種混帳東西也講起他來焙茗哚著嘴就不言語了寶玉問還有誰呢焙茗道那一個也不説了省碰二爺釘子寶玉再三根問焙茗才又道這一個就是二姑娘屋裏的司棋姐姐寶玉忙問道司棋出去怎麼樣死的我還不知呢焙茗道就為他表兄潘又安逃走了又回來司棋情願嫁姓潘的他娘不依司棋烈性撞破了腦袋死的比投河奔井慘多著呢寶玉聽了蹬足歎道怎麼有這樣狠心的娘連自己女孩兒也不疼的又暗暗想道林妹妹不叫我改太虛宮的對聯果然風月債難酬可不該這樣點醒人家嗎那時候我睜眼瞧著他出去沒法兒保全他倒是我的罪孽了呆呆的出神了一會復又想出智慧兒雖已出了家也是薄命司裏的女孩兒還該添上於是因智慧想到秦鍾脈脈關情黯然回首便去告訴王道士疏紙上添了焙茗上來催寶玉道二爺快回罷瞧這天就要下雪了寶玉起身王道士送出廟門道二爺公事忙不必天天到這裏打發一位管家來也使得寶玉上了馬與焙茗掃紅趕回當下就在怡紅院襲人屋裏歇了次日天才明寶玉醒來聽見老婆子們已在院子裏掃雪説道今年第一場雪下了那麼大足有一尺厚呢寶玉便叫起小丫頭子問這會兒還下不下小丫頭連忙出去掀簾子瞧道已出了太陽了寶玉起身穿衣襲人也著忙起來伺候漱盥已畢寶玉隨便吃了些點心先到蘅蕪苑一轉見這些老婆子們各自帶了苕帚照分管的地界將積雪掃開已顯出一條路來便吩咐他們走櫳翠庵這條路也要掃淨老太太去賞梅花呢説著一路觀看正喜雪霽天晴透起一輪旭日照耀得瓊樓琪樹分外光明從蘅蕪苑來到瀟湘館黛玉尚未起身便到麝月屋裏見麝月正對著鏡子梳頭寶玉放輕腳步走到背後站著鏡子裏已照出兩個人臉兒麝月只管梳他頭並不回過臉來寶玉便走到他面前向桌上拿起篦箕道多時不與你篦頭了麝月便伸手過去把篦箕奪下道如今可再不敢勞動二爺了寶玉道為什麼如今不要我篦頭了麝月帶笑不笑的説道二爺愛弄這些新的舊的要篦頭的人還不少寶玉道你才在鏡子裏瞧見了我為什麼不理我麝月道我沒瞧見寶玉笑道鏡子裏明明有我怎麼你瞧不見麝月道我這面鏡子是黑的了鏡子裏的二爺我就瞧不見寶玉道黑了為什麼不拿去明一明麝月道不是鏡子黑是我這個人黑了對照過去連鏡子都昏暗了寶玉聽説麝月的話來便道你別性急少不得園子裏頭的鏡子還要叫他明出幾面來就是了今兒請老太太到半仙閣去賞梅你也跟著奶奶去鬧熱一天説著轉身便走出了瀟湘館來到賈母處請安道老祖宗高興年年做消寒會的前兒史大妹妹這幾個人等天下了雪請老祖宗到園子裏去賞雪看梅湊巧夜兒下了這場大雪我請老祖宗去賞了雪回來再做消寒會不知老祖宗高興不高興賈母歡喜道有雪有梅就在園子裏做消寒會再沒那麼映時景的了何必定要在這裏呢見過你太太沒有寶玉道先請了老祖宗再到太太那裏去呢賈母道你去對太太説就打發人去請了姨太太珍大嫂子那邊也去説一聲今年大大的做個消寒會寶玉得了賈母的話越發興頭忙去告訴了王夫人仍回怡紅院來襲人見了寶玉道如今遵瀟湘館奶奶吩咐春衣冬衣雖然該晴雯紫鵑他們經管但是你在這裏出去的他們那裏知道天才下了雪衣服也該添換怎麼一閃眼就跑了出去正説著晴雯也來道我早上醒來聽説下了雪知道二爺是起得早的趕忙穿好衣服出來誰知他已跑得沒影兒了今兒愛穿什麼衣服早言語一聲兒讓人家去翻騰出來襲人笑道有一件衣服他兩三年不肯穿了如今有了俄羅斯國匠人可該拿出來穿穿晴雯聽了知道説的是孔雀裘並會意寶玉所以不肯穿的緣故便要去開箱找尋道一個紫鵑是生手我雖然經由過的也隔了兩三年一時摸不著頭路寶玉忙拉住晴雯道在自己家裏換什麼衣服就是出門會客你們手頭找出什麼衣服我便穿什麼也值得費那麼些力氣晴雯道你自然不講究這些太太同奶奶們看見了難免説我們不經心底下須得同紫鵑費兩天工夫把箱子統翻疊過一遍才有頭緒呢襲人道我還有些記得同你們找罷於是襲人便進去指點開那一隻箱寶玉也跟著見開了一隻箱子沒有孔雀裘上面疊著一套烏雲豹寶玉道就穿這好晴雯取了出來與寶玉換上聽自鳴鐘點子已交巳正初忙傳寶玉的飯菜伺候用畢然後各人都吃了飯寶玉催他們快走自己先到賈母處見王夫人鳳姐寶琴玉釧已在屋裏不多時便有尤氏帶了佩鳳文花並邢夫人薛姨媽香菱陸續到來賈母早命王夫人打發人到園子裏止住他們説地上掃不盡的雪凝