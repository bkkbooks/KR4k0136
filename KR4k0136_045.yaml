body:
  text: 第四十五回朱砂痣甄母認嬌兒伏梁症襲人思舊院話説黛玉上一天遊了太虛宮回來天已晚了次日飯後來到寶叉屋裏便問香菱昨兒天齊廟去怎麼樣了姊姊知道沒有寶叉道我正要打發鶯兒去問呢鶯兒在旁介面道估量沒有這件事果然真的太太早叫人過來通一個信了寶叉道白間在這裏叫你去走一趟就説躲懶的話説聲未了香菱笑嘻嘻的進來説道白到天齊廟去守了這一天懊悔昨兒不跟姑娘們去逛逛黛玉道難道竟沒碰見什麼人嗎香菱道來的人可不少知道那一個是我的親人寶叉道我説我們大嫂子的話是聽不得的黛玉道可憐他家在那裏家裏有幾個人一些都不知道到底他親人是老的小的男的女的叫他去認誰寶叉道可不是見了親人認不得是親人也算不得親人了香菱道有一位太太瞧我個仔細淌了一會眼淚後來各自走開了黛玉道這個人就古怪該問問他的來歷香菱道瞧他老人家像有五十來歲跟的老婆子丫頭勢派不小也像那一家宅子裏出來的寶叉道這樣説香菱與他沒有什麼相干的了正在議論只見同貴喘氣吁吁的跑來對香菱道太太叫你呢你才走了有一位太太來問咱們太太説昨兒天齊廟去這位姑娘是親生的還是抱養的太太對他説這個人原是在路上買來做丫頭的為了他還吃一場人命官司這孩兒的住處姓名他自己一點也懂不得那位太太説既是買來的多分是他的女兒無疑了還得出一件真憑確據他眉心裏一點胭脂痣迎面便見的猶恐冒認還有右腰眼裏照樣那麼大一點那是説謊不來的太太説同他過了這幾年倒沒留心到這上頭等著你去瞧呢寶叉笑問香菱道到底你身上有這個沒有我也沒瞧見過香菱搖頭道連我自己也不知道黛玉和寶叉兩個爭著要揭起香菱衣服來瞧見寶玉進來了香菱便不肯叫他們瞧看忙跟著同貴走了寶玉笑道真是香菱的母親來了寶叉道又在這裏瞎説了你怎知是他的母親呢寶玉道不是剛才同貴來講他母親説香菱腰眼裏有點胭脂痣嗎香菱果真有的寶叉道越發亂話了香菱就有我和他同住了這幾年沒有瞧見你又怎麼知道寶玉道就是那一年我過生日香菱和豆官這班人在園子裏鬥百草玩兒拌起嘴來泥水裏濺汙了香菱的石榴紅裙子我叫襲人拿一條來給他換上他背著我換裙子我蹲在地上偷眼瞧見的黛玉笑道説話留點子神也不怕薛大哥回來知道不依你寶叉瞅著寶玉半嗔不笑的道真是下作脾氣人家女孩兒怎麼好意思瞧他黛玉笑問寶玉道你瞧寶姊姊身上可有沒有寶叉介面道先前倒有的可惜瞧不著了如今張家姑娘身上可是沒有這個的又向寶玉道你林妹妹身上有一對鴛鴦痣晚上點著燈細細瞧去寶玉笑了一笑站起身來便往怡紅院去要把香菱的話告訴晴雯紫鵑走進裏邊各處瞧了一瞧靜悄悄的他們兩個人都出去了便轉身往外聽得兩個老婆子在屋子裏講話説這件事先是女孩子自己不願意就按著他脖子幹嗎寶玉聽了女孩子不願意的話越發放輕了腳步走到窗戶台邊潛聽他們又講道怕趙廷棟要他媽去求璉二奶奶有幾分拿手不是頭裏來旺家的就求了璉二奶奶辦成的嗎那一個老婆子道如今他也怕做惡人未必再幹這樣強橫霸道的事只看他們的月錢總是按著日子清清楚楚發給再沒個捏拉挪移就是咱們園子裏的人經管這些花兒果兒盡咱們的規矩送他也收了設或有個來遲去慢也不來挑剔咱們他先前有這樣好脾氣嗎這一個婆子道那是他明知瀟湘館二奶奶強似他不能像先前這樣由他鬧鬼有的是銀子索性打撒手落得做個好好先生罷哩那一個婆子笑道這話也別委曲他如今咱們府裏的事比頭裏多添了幾倍瀟湘館二奶奶不過拿個總還是平姑娘幫他按著定的規矩認真辦的不過不像先前的尖酸刻薄了只就一件事就瞧出他的厚處來了這個老婆子便問是什麼事那老婆子道你不知道我告訴你聽寶玉聽了半晌見他們把話岔到鳳姐身上把正經要聽的話倒打斷了不耐煩再聽他們只得踱了進去兩個老婆子連忙站了起來陪笑説道晴姑娘和鵑姑娘都逛去了沒有在家呢寶玉便根問他們女孩子不願的話這一個老婆子因和那一家子有些瓜葛膀胱氣不服見寶玉盤問他們便將計就計道我們本不敢在二爺跟前胡説亂道二爺既是聽見了問我們也不敢瞞著二爺就是先前在這屋子裏當差的四兒那時候因園子裏鬧事太太攆了他出去配了個小子沒過門女壻死了他娘要揀一門子對頭親還沒合意的那裏曉得趙廷棟的女人死了他們硬央了媒人要去定這頭親事年紀大小了一半四兒心裏不願天天在家裏尋死覓活寶玉道你們講的就是四兒我再不料他還在家裏你們又怎麼知道他們要去求璉二奶奶老婆子笑道那也是瞎猜的話因為趙廷棟的媽是奶過璉二爺的璉二奶奶很看重他呢寶玉站著出了神半晌想起太太性子本來好的不知聽了那一個的混帳話一時發起火來晴雯芳官這一班子人沒有什麼不是就為沒相干的事都攆的走了鬧的害病的幾乎死恨氣的出了家四兒現擺著要受人家的欺壓我不能叫薄命司裏的女孩兒一個個都歸到他們院子裏來就只和他們多過幾天快活日子也是好的便道我叫四兒依舊進來他媽自在外面給他留心好親事趙家的話有我呢不知四兒願意不願意你們去問他一聲那老婆子笑道問也不用問得二爺多大的恩典四兒同他媽還有什麼不願意寶玉道那麼著我就叫他進來當下出了怡紅院可巧遇見林之孝家的走過寶玉便叫住了他説要叫四兒進來伺候的話林家的笑道如今二爺住的地方多叫四兒到那一個院子裏去伺候吩咐明白了好和他們説寶玉想了一想道叫到蘅蕪苑去罷林家的就先去回了寶叉又到鳳姐處説了寶玉的話鳳姐心想晴雯攆了出去太太還叫他進來芳官出了家如今也進園子裏來了太太已經把先前的事撩開可不用去回又因昨兒趙老媽子果然去見鳳姐提起這話鳳姐含糊答應正在為難今聽見寶玉要叫四兒進來正可借此推卸便吩咐林家的叫了四兒徑送到蘅蕪苑去四兒喜出望外難得又進園子裏頭當差臉上也有了光彩且不怕趙家再來纏擾立刻跟了林之孝家的到蘅蕪苑來書且不提講到香菱天齊廟親人相會一事原來賈雨村娶了甄士隱家的使女嬌杏扶正後甚是相得當年賈雨村在林如海衙門裏教讀一日間步到鄉間見一座破寺院門外挂的對句身後有餘忘縮手眼前無路想回頭有些意旨可味牢牢記著及至顯榮後記起那座智通寺便捐助銀兩起造這寺把門外舊對句做新懸挂不曾更換句語如今廟宇煥然一方香火有求必應那時雨村除了內任從京裏打發人到南邊接家眷進京先由水路坐船尚未起岸那日守風停泊離這智通寺不過二三裏路賈夫人坐在官艙聽後面艄婆笑講道不用説人要走運氣就是佛菩薩也要講交運的幾年前頭一座破廟白日裏鬼也捉得出的自從賈雨村大人布施了這宗銀子就有緣頭出來募化翻改了這寺院菩薩重裝了金佛地應該興旺起來菩薩也靈了左近一帶去燒香許願的人挨擠不開賈夫人聽見就是他老爺布施銀子這座寺也要去進香因大船撑不進小港便叫家人雇了一肩小轎帶了丫頭老婆子請了香燭到寺裏拈了香回來見一個五旬以外的貧婦汲了一桶水走進小間子裏去宛像他舊主甄士隱的太太賈夫人叫住了轎命跟去的老婆子到這一家去問明剛才進去的這個汲水婦人姓什麼從那裏遷來的有無子女那婆子進去問了出來回話道這婦人夫家姓甄向在蘇州閶門仁清巷居住並無兒子只有一個女兒幼年已被拐去的了賈夫人聽了知是舊主無疑便命轎子擡到他門首歇下出轎走進門裏相見之下甄太太一眼認出他是嬌杏起居服色大非昔比説話之間甄太太講起別後連遭荒疫闔家貧病流亡遷移到此度日艱難的話各各垂淚賈夫人拜認甄太太為母邀同進京甄太太樂從並無箱只行李可帶只收拾了幾件隨身東西包了個包袱其餘破爛傢夥俱留送院鄰賈夫人叫老婆子拿了包袱下船順便取了一套衣服趕忙就來賈夫人又與甄太太坐了一會等老婆子送到衣服更換因此地離停船地方不遠不上半裏之遙賈夫人也不坐轎同甄太太步行回舟次日風順開船一路敘話舊事到了京中先叫前站家人通知了雨村的信接進住宅雨村感念甄士隱昔時知遇之恩竟依了他夫人的稱呼認甄太太為嶽母相依度日這一天甄太太也去天齊廟拈香香菱已早到廟中凡有進廟的人留心瞧認不知那一個是他親人還是甄太太見了香菱模樣兒有些像他女兒釘眼看個仔細一時未便啓齒訊問只是怔怔的淌了一會淚各自走開甄太太回到宅裏便將廟中所見之人告訴了賈夫人賈夫人亦費猜疑惟賈雨村早知此事底細因當日作宰時曾經判斷此案衙內門子即系葫蘆庵小沙彌將案情始末細細稟過雨村今甄太太提及想起來被拐的就是他女兒如今尚在榮國府的親戚薛府上便與甄太太説明來到薛府訪問薛姨媽叫了香菱回去母女相認難免一番傷心落淚薛姨媽把他們勸慰又將等哥兒回來把香菱扶正的話告訴了甄太太一面治酒款待留住盤桓這裏賈母知道以為奇事要瞧瞧香菱的母親命王夫人打發人過去薛姨媽陪著過來又請了本家雨村的太太大家逛了一會園子因冬天取屋子暖和賈母那邊綺散齋書房設席叫梨香院戲班伺候這日姊妹們只有探春在座黛玉因有他師母同寶叉過去應酬飲酒中間賈母細問甄太太家事甄太太便將他女兒乳名英蓮自幼被拐離散住居蘇州閶門遭了回祿夫主甄士隱看破紅塵出了家孤苦無依説著瞧了一瞧賈夫人只説這是先前認的女兒多年遠別今在路上遇見同到京都這許多事講與賈母聽了賈母只是歎息卻説怡紅院晴雯知道兩位奶奶都過那邊聽戲去了一時高興叫到清音請邢大姑娘史大姑娘還有麝月秋紋這幾個人寶玉不過那邊去也在這裏玩兒取樂湘雲進來説道老太太今兒請客停會兒戲文煞了台説聲要聽清音便怎麼樣晴雯道史大姑娘不用你著急我安頓在那邊的了要叫就讓他們當下打起鑼鼓一套未曾打完見林之孝家的自己跑來道本家太太要聽清音太太叫他們去伺候呢晴雯便叫班子裏使喚的老婆子快收拾傢夥孩子們跟著林家的走了湘雲攤手道何如寶玉道他要聽明兒再叫他們來唱就是了史大妹妹同邢大姊姊都來晴雯道我明兒偏不愛聽湘雲道晴姑娘聽清音倒合著一件古事所謂興至而喚興盡而止何必聽他不聽比聽的越發有趣了再不然他們自己到梨香院去鬧一支湘雲正和晴雯説笑見四兒進來與衆人問好滿屋子瞧了瞧湘雲道他也是舊時王謝堂前燕今兒又飛回怡紅院來了晴雯見了四兒分外親熱拉住他手道怎麼我竟忘了你了多早晚進來的四兒答道前兒進來的在蘅蕪苑伺候奶奶今兒奶奶到老太太屋裏陪客聽戲去了過來瞧瞧姑娘們聽説這裏唱清音為什麼不見呢麝月道你原是要聽清音來的不是來瞧他們四兒笑笑晴雯又問四兒道你又為什麼出去的四兒道就是姑娘出去那一天太太瞧著我説我也是個沒廉恥的還説我是與二爺同日生日道我曾説過同一天生日的就是什麼也把我攆了晴雯聽了頓時一盆火發道太太是仁慈的因何送咱們的人不好等明年二爺生日這天我的東替另辦兩席酒給你做過生日把平姑娘也請了過來看還有人去唆聳太太來攆咱們不攆四兒道正是平姑娘也同這一天生日要攆大家攆説得衆人都笑起來晴雯道你別胡説了仔細平姑娘聽見了要捶你當下湘雲站起身來向岫煙道咱們也該興盡而返了寶玉笑道虛邀你們明兒寶姊姊林妹妹都間著叫這些孩子們來大家在這裏鬧一天説著寶玉與晴雯等都送至院門外正要回進裏邊見五兒飛跑的進來道襲人姊姊不知為什麼手裏拿了一面鏡子栽倒在那邊路上叫他也不應我回到瀟湘館去遠了奶奶也不在屋裏所以到這裏來告訴一聲寶玉吃了一驚趕忙過去麝月秋紋這一班人都隨著寶玉去看走到跟前見襲人兩眼泛白面色改常寶玉與衆人把他攙扶起來叫了兩三聲襲人神色已清睜開兩眼將頭微點並不答言五兒拾了地上的鏡子寶玉欲就近將他扶入怡紅院去襲人搖頭示意只得慢慢的扶回瀟湘館到他自己炕上睡下寶玉與他墊高枕頭又拖被子蓋好忙叫人吩咐去請醫生晴雯紫鵑在他屋子裏坐了一會起身走了寶玉叫麝月秋紋在此照應不多時醫生來診了脈説外感甚輕此由心境惡劣肝氣上逆所致治以舒郁平肝為主但須自己保養切忌思慮過度非全恃藥餌所能奏功日久恐成伏梁症伏梁者如屋梁之伏於胸前將來必至胸膈鬱塞飲食漸廢不得救藥矣寶玉把醫生的話告訴了襲人叫他總要養心散悶別自己糟踏身子又叫五兒輪替照看湯藥一切黃昏後賈母處席散黛玉回來知道襲人這件事也過去瞧他還問了幾句話吩咐麝月等夜間留心照顧麝月秋紋五兒幾個人替換在襲人屋裏走動二更後寶玉進來見碧痕正在煎藥麝月坐著打盹寶玉叫醒麝月道你叫他們泡一壺茶來窩在暖桶裏你同秋紋自去歇罷今夜我在這裏陪他麝月撲嗤的一笑襲人在炕上欠起身來道我這會兒身上舒服了二爺的恩典我再一輩子也是感激不盡的別再住在這裏替我鬧亂子寶玉道這有什麼先前你們有人病了不是我也給你們遞湯遞水過的嗎襲人歎口氣道先前是先前如今是如今況且頭裏也是你自己胡鬧我們敢要你這樣嗎我的好麝月姑娘快替我送了二爺出去我給你磕頭麝月便道當真二爺出去了罷頭裏我也聽見説過這句話我和秋紋兩個是他調教出來的見他這樣光景就在這裏熬兩三夜子也是情分上應該的這點子也還幹得了要爺在這裏做什麼呢寶玉沒法兒只得訕訕的走了還不肯回到別處去就在黛玉屋裏歇了原來襲人那一天在雪雁炕上與寶玉敘舊被雪雁瞧見雪雁雖聽了晴雯勸説未曾嚷破這件事然顔色詞氣之間終露些圭角襲人豈瞧不出來追想當日與寶玉初試雲雨之事後來挪到怡紅院去諸事惟我占先憑他屋子裏收了誰總越不過我的分誰人還給我臉子瞧呢想到此處不覺羞愧之心與怨苦之氣鬱結於中不勝病骨支離甚至寢食減廢觸起當日王夫人罵別人妝這個病西施樣兒給誰瞧呢的話不敢言語一聲兒只得勉強照常支撑過去一日五兒來借他一支抽絲蝴蝶簪看樣兒便翻騰梳匣裏有一面小手鏡記起是紫鵑來陪伴寶玉隨梳具帶來寶玉指留這件東西在屋裏後來忘了還他隨手撩在梳匣裏頭的見物思人因人想話紫鵑不過瞎説一句林姑娘要回家的話那一個就嚇得什麼樣似的他們兩個人的心事誰還瞧不出來呢就先娶了寶姑娘照像如今這樣辦法也很好寶玉自然不走了寶玉不走我何至有此一變萬不該在他跟前把林姑娘回來的話也瞞得緊緊的總是自己糊塗該死悔也無及正在出神晴雯打發小丫頭子來請他去聽清音襲人因為睹屋傷心懶怠到怡紅院去走動今晴雯打發人來請執意不去又怕他見怪延挨了一會沒奈何去走一趟帶還紫鵑這面鏡子出了瀟湘館無精打采的往怡紅院來才瞧見院門心上一酸眼前烏黑頓時暈倒在地不覺昏迷過去幸虧五兒也要到怡紅院去瞧熱鬧隨後趕來看見告訴了這句話衆人才來扶他回去的襲人本是心病今見寶玉多情不改舊時黛玉又親去瞧他還聽寶玉告訴他醫生的話只得自放寬心把不得已之事暫且撩開服藥後病去其半到第二天便可強步起來飲食漸增再講寶玉次日一早起身忙過襲人屋裏問明服藥後安穩才放了心便倒賈母王夫人處請安回來正見春纖端了一盆清水灌溉那盆淚草便笑道我怎麼把這件事忘了忙催擺飯與黛玉用畢叫一個老婆子捧了玉盆寶玉跟在後面到二門外叫焙茗接著同了鋤藥叫備馬坐上要到太虛宮去早有管工家人帶了鑰匙開進裏邊寶玉徑到絳珠宮院子裏親自動手把那一叢淚草端詳了一會帶泥捧出與絳珠仙草並植了見他互相披拂宛似故交覿面各有知識的光景焙茗在旁見寶玉看得呆了便端了空盆子催著回去寶玉起身步出院來焙茗笑問道這是什麼矜貴蘭草值得把他種在玉盆裏頭寶玉道天下那有像這樣珍重的蘭草焙茗道莫非是大荒山帶來的仙草不成寶玉道説起他的來處這個地方你也到過這會兒沒有間工夫講給你聽焙茗道怪不得爺的事忙要遇爺間的時候甚難前兒這件事還沒回明二爺他們又來找了奴才兩會難得今兒伺候爺到這裏來辦這件清間差役還回得上兩句話請了爺一個明示也好去回報他們寶玉道什麼事情我不知道焙茗道講起來話長請爺到裏頭殿上坐了好回爺的話寶玉心想殿上都有塑像他們進去見了定要指東説西未免唐突仙姝便站住在院子裏道不用進去有什麼話就在這裏講罷焙茗道他們也在家孰裏念過書説起他兩個的雅號來二爺還該記得寶玉道家孰裏念書的人來來去去多著呢我那裏記得這些焙茗道就是香憐玉愛兩個敘起親戚來是遠的了因和二爺交好一番他們近來家裏的日子很難過來求二爺不過想照顧他們些寶玉笑道記起來了我好久不見他們為什麼不來見我焙茗道他們原想見二爺一來爺的事情忙怕候不著二爺礙著臉上下不來所以盡仔來纏奴才轉求二爺寶玉道我怎樣照顧他們呢只好給他們幾百兩銀子一個去過度就是了焙茗道給他們銀子果然好但是他們吃用慣的又不用肩挑貿易把這幾兩銀子使完了底下便怎麼樣兒呢據奴才的意思如今這些本家爺們整十萬兩銀子領出去開當鋪字型大小因親帶眷拉攏進去的人還少嗎只要二爺説一句話不拘那裏送他們進去幫辦些事派一點釐頭就夠他們沾光一輩子吃著不了寶玉道送他們到那裏去好我和誰説呢焙茗道爺有了一句話奴才説去誰敢駁回他們兩個自然要當面謝二爺呢話未完只聽宮門前轔轔之聲一時到了門外停車寶玉心想此處諒無別人敢來間逛莫非裏頭有誰出來正在動疑見前面走的老婆子後邊小鬟隨著一人緩緩行來卻是妙玉寶玉便叫焙茗鋤藥遠遠站開自己趨步上前問訊道難得妙師羽輪蒞止可作人間丹府將來蒼梧溪畔黃庭觀中道德二經得所傳矣殿上多園中諸女伴塑像妙師進去摩頂一番説著心想陪他進內因不知妙玉乖僻性情已改有焙茗鋤藥在此他一時嗔喜難測未敢造次因向妙玉道緣有俗事未及奉陪望乞涵恕寶玉瞧妙玉進了殿回身往外吩咐焙茗安頓香憐們的話便上馬而回這裏妙玉在各處瞧見塑像果與黛玉諸人面龐無異看到自己還是未改相的本來面目便叫一個老婆子去尋了些窯煤親自把塑像塗壞了話不細表講到焙茗鋤藥跟隨寶玉回家繳進玉盆寶玉徑到瀟湘館來五兒回報奶奶同三姑娘史大姑娘到蘅蕪苑才進裏面聽見笑聲未絶又聽湘雲道橫豎二哥哥的同年多著留心選罷一時寶玉走進湘雲先開口道二哥哥你可知道太太又要認幹女兒咱們端整喝喜酒呢寶玉笑問太太要認誰探春介面道你們且別講出這個人來先叫二哥哥猜一猜寶玉道猜也不用猜這個人我知道湘雲道果然二哥哥猜著了前兒高興聽清音風雨近重陽的佳句被催租人掃興咱們另備兩席酒是我的東但要一猜就著若一擊不中就算二哥哥輸了寶玉因剛才聽説同年裏頭選的話估量這位姑娘還未配親除了眼前沒有人在園子裏頭來去的有大嫂子兩個妹妹還有喜鸞四姐都沒定親想了一回一定拿不準是誰黛玉見他思索想要提一句當著衆人不好開口假作吟哦詩句道寄語東風好擡舉繡簾從此脫青衣湘雲瞅著黛玉嘴裏哼了一聲嚴拿傳遞黛玉微笑不語寶玉一聽念的詩句心已明白想如今太太屋裏這幾個並無垂青之人因寶叉故後王夫人曾誇過鶯兒便拿準是他指名説了出來寶叉聽了忍不住撲嗤的一笑探春也笑道太太果然認了鶯兒做幹女兒鶯兒和他姑娘倒該姑嫂稱呼了呢黛玉瞧著寶玉道怎麼你這樣糊塗也不想想鶯兒是寶姊姊屋裏伺候的人太太怎樣叫他過去認幹女兒湘雲笑道並不是二哥哥糊塗倒被二奶奶兩句詩題糊塗了不用説該罰多説話的備東道二哥哥替另猜罷寶玉道我也不猜第二個了但等喝太太的喜酒我先備席請你們何如到底太太認的是誰也要向我説個明白別我猜著了你們故意慪我黛玉道沒有的話這會兒我們有我們的事太太認這個人停會兒再和你講你自逛你的去罷寶玉道正是剛才妙師父一個人到太虛宮去逛呢不知回來了沒有探春道前兒你們説起妙師父配住在這個地方我聽邢大姊姊説他要到那裏去住四丫頭要去住櫳翠庵珍大嫂子受過四妹妹的氣如今也未必管他這些怕太太不肯由著他黛玉道據我看起來四妹妹的性子執住了憑誰也拗不過他來況且他的參悟功夫已經差不多了他要到外邊什麼地方去住自然使不得就在咱們園子裏隨他去罷咧三妹妹聽見太太有什麼話咱們多勸勸不必阻止他衆人聽了皆以為然惟寶玉默無一語心中似有些悵然的光景湘雲道二哥哥又發什麼心事了咱們都到四妹妹那裏逛去問問他櫳翠庵前的梅花可開了沒有好慶賀新閣子賞梅黛玉道你們先走我和寶姊姊還有句話商量呢湘雲道你們商量什麼話黛玉道過兩天總知道這會兒不叫你們聽湘雲站起身來笑道有什麼聽不得的話不過又是那一個姑娘那一個姐姐的事情説著便拉了探春同寶玉出門徑找惜春去這裏黛玉不知有什麼話和寶叉講且看下回分解
