body:
  text: 第二十七回貯金屋嬌婢會么弦興寶藏財星臨福地話説紫鵑往櫳翠庵去遇見寶玉拉住他説話怕寶玉有什麼私語説出來被跟來的老媽子聽見不雅便灑脫了手徑自走了紫鵑到了櫳翠庵先在菩薩面前磕了頭然後見了妙玉把黛玉送的禮物交點明白妙玉道射問了些南邊的話紫鵑又到他從前住的屋子裏看了一會自己帶了些揚州的土儀送給老佛婆們想起上年在此何等孤淒如今主婢皆有依歸那夜夢見寶玉拜堂並自己與晴雯之事果應其兆全仗菩薩護佑底下還要來完願心老婆子見了紫鵑覺得分外親熱殷勤紫鵑坐了一會帶了同去的老媽子徑回瀟湘館來因王夫人在黛玉屋裏紫鵑便找鶯兒去了一時寶玉回到瀟湘館問麝月道上年林姑娘南邊送來的東西為什麼不給我瞧瞧麝月笑道當真我們竟忘了這件事虧得多是送爺們的東西我們一點子也用不著的不然還疑心我們瞞昧起來偏偏前兒又翻騰了一遍過幾天再找出來給你罷寶玉聽説也就罷了這裏黛玉因向來寧榮兩府規矩做姨娘的不但正經酒席上面沒他們的分就平常擺酒聚飲也不能上場反不如有體面的大丫頭碰著老太太高興時候倒許同姑娘們在一堆兒吃喝玩笑所以黛玉要替寶玉收晴雯紫鵑兩個人不叫開了面明當納妾丫頭婆子不許他們叫一聲姨娘也像先前襲人一樣月錢等項情願在自己名下捐給他兩個人等過兩三年再正名分因王夫人在此順便回明就趁後兒好日子把他兩個人收在屋裏伺候寶玉方便些王夫人因晴雯的話已經提過紫鵑是黛玉的人出自黛玉之意想來他們和氣所以説這些話就一口許了到了後日鳳姐聽賈母吩咐便令十二個清音女孩子在瀟湘館清唱設席是日迎春已被孫紹祖打發人來接了家去喜鸞四姐因家裏有事都回去了只有寶琴香菱李紋李綺湘雲岫煙探春惜春來到瀟湘館都已知晴雯紫鵑的事先與他們道喜接著慶齡遐齡等十二個女孩子都來了寶玉見他們個個體態輕盈口齒清脆便歡喜同他們問長問短把慶齡的臉兒細瞧一會宛然是芳官因此尤愛慶齡一時擺開場面各人伸出筍芽兒的纖指動起鑼鼓魚板打出錦上花大富貴蝴蝶探這些牌兒名來比聽戲倒覺清趣雅靜少停坐起席來並排兩桌第一個湘雲豪爽高興首倡搳拳猜枚豎旗揚鼓的與合席對壘黛玉還守新人體統靜默陪坐寶琴道史大姊姊你再像先前説的古文唐詩骨牌名曲牌名時憲書一連串這個這會子你一口氣能講出三個來我滿滿的喝三杯酒湘雲問酒底呢寶琴道酒底説一花名又要是鳥名或蟲名亦可再説一句古詩映合湘雲道這也難不倒我講了出來你是要喝的呢賴酒的就是個哈叭狗兒便道我張我三軍電閃旌旗日月高好一個將軍挂印回去朝天子宜上表章酒底是杜鵑花聲聲啼血向花枝衆人聽了都道有意思寶琴催他説第二個湘雲又道揚眉吐氣華堂今日綺筵開擺列了錦屏風與那好姐姐宜結婚姻酒底是蝴蝶花等間飛上別枝花衆人都笑道好對景兒越發有趣晴雯站在旁邊雖聽去不懂文義那好姐姐結婚姻的話明是打趣他們便道史大姑娘行令再要取笑我們先前的桂花油還沒有給如今是要定的了湘雲道桂花油倒端整著等你們上了頭好來送賀禮香菱對晴雯笑道那可你自己招出來的連別人都拉在裏頭了黛玉帶笑瞅湘雲一眼道偏是他咬舌頭的會謅出這些來寶琴對湘雲道算你好的不用再説了我喝了兩杯罷探春道二哥哥你瞧史大妹妹太猖獗和他搳三拳寶玉猶未開口湘雲便卷起衣袖輕抒玉腕伸過手去與寶玉搳了三拳連輸了晴雯忙過去在湘雲面前滿滿斟了三杯酒湘雲哼了一聲道承照顧便連喝了兩杯見寶玉面前有半杯剩酒一時趁晴雯不留心便把寶玉的酒杯拿在手內站起身來向晴雯道好姐姐替我喝了這杯酒再不敢和你取笑了晴雯只道是湘雲輸的拳酒接過了酒未咽下喉去湘雲大笑道喝過交杯酒了晴雯會意也忍不住要笑一口酒都噴在紫鵑臉上身上了寶玉忙用手帕子與紫鵑擦衣服湘雲看見又笑道這杯酒連紫鵑姑娘也交在裏頭了引得闔座哄然晴雯紫鵑都紅了臉避進里間屋子裏去了探春道別盡你的興這樣鬧了咱們靜靜的喝兩杯聽他們唱幾套曲子黛玉便叫慶齡你們看這瘋子鬧得高興連曲子也顧不上唱了慶齡們聽了笑著連忙開場先唱了一套闖宴爭花那唱大淨的年紀不過十三四歲聲音宏亮真有響遏行雲之妙寶琴道難為他腔口道白色色到家我們如在隔壁聽了誰説不在這裏唱戲呢李紋介面道請到他們的曲子比戲班子裏還認真呢説著聽他爭花完了又接唱了生旦曲子兩套屋子裏早點上燈了寶琴道這樣長日子咱們在這裏鬧了一天還不夠別喝得大醉了也惹的人來鬥席打架起來話未完只聽得一片喧嚷之聲漸近瀟湘館門前衆人都吃了一驚寶玉便命老婆子們出去打聽什麼事情不多時林之孝家的來回道剛才那邊聽見嚷説園子裏走了火像在瀟湘館左近嚇得我們慌了手腳連忙叫齊了人趕來進了園門還瞧見沖天的火光誰知走到這裏靜悄悄的恁什麼兒也沒有倒驚動奶奶姑娘們了我們再往別處去瞧瞧好回報太太璉二奶奶放了心説著轉身走了探春道咱們都在這裏沒聽見什麼真是瞎見鬼混來造謠言惜春道那倒不是謠言呢黛玉聽惜春話裏藏機便著急問道這可是什麼兆頭莫非要防防火災惜春笑道請放寬心這是姊姊的福分所招非凶兆也探春介面問道林姊姊福分所招該怎麼樣惜春道過幾天便見這會子連我也不明白探春知道惜春不肯泄漏不便再問衆人終席後各自散去黛玉獨留惜春背了寶玉悄向説道鶯兒要尋死覓活的事四妹妹自然也知道的了我叫他過來總不肯安心住在這裏怪可憐這丫頭他説情願去伺候四姑娘四妹妹可收留他去了了他的心願也好惜春道這又同你的紫鵑住到櫳翠庵去前後印板文章其間不同之處一個是發于自己心願一個是為他人逼迫若論鶯兒要跟我又是不了的事這會子也不用和我講什麼叫他暫在這裏住著等到下半年我收留他就是了黛玉聽惜春講的話雖然不得明白也不便根問下去惜春走了黛玉要到賈母王夫人處請晚安帶了晴雯紫鵑見賈母請安畢便叫晴雯紫鵑磕頭賈母忙問緣由兩個人羞得説不出話來鴛鴦已知此事笑著回明賈母點點頭道該是這樣辦法又到王夫人處也磕了頭然後到瀟湘館晴雯紫鵑也要與黛玉行禮黛下把他們拉住那時怡紅院的屋子早已收拾停當晴雯紫鵑分屋住開黛玉又把自己的小丫頭與他每人派了兩個去伺候催他們都到怡紅院去此時寶玉直從心眼裏歡喜出來不知今夜該到那一個屋裏去住歇才好紫鵑晴雯又互相推讓晴雯拉了寶玉要送到紫鵑屋裏去紫鵑連忙把門關上寶玉知道他是不開門定的了只得到晴雯屋裏晴雯再不便推卻想起從前在此被攆帶病出去冤苦無伸今日公然得與寶玉成其好事真是夢想不到便同寶玉坐下寶玉扯了晴雯的手道咱們天天見面總不能暢暢快快説一會子話把個人急得什麼樣似的倒比不見面還不好過你在外頭的光景我聽見紫鵑説起多一半我知道的了我單要問你一句話後來你的病好了為什麼不帶個信進來給我知道晴雯道不要説我住在堡裏沒處寄信就寄進信來便怎麼樣呢寶玉道你竟不想進來嗎晴雯道虧我不想進來這會子還有我倒得進來了假如巴巴結結要想進來你知道了保不住又鬧出什麼故事來太太一定要擺布我就死不了還有我這個人在嗎説著揭起衫子露出貼身的舊襖指給寶玉瞧道你看這件襖子我總天天穿又捨不得穿脫下了又想穿他兩三年來倒弄爛了寶玉細瞧襟子上斑斑點點的都是淚痕便道你如今也可把他撩棄了還留他做什麼呢晴雯道為什麼這是我一輩子也不撩的寶玉道如今你比人家有臉了先前的委曲也可以消釋了晴雯道我只感激林姑娘寶玉道説起林姑娘的苦楚比你還加幾倍我娶的寶姑娘都哄著我説是林姑娘我雖然病著模模糊糊也省得些後來林姑娘病好了家去又哄我説林姑娘已經不在了我還到瀟湘館去哭了一會燒了些紙錢這不是活活的咒詛他嗎可憐再沒一個人告訴我一句真話連紫鵑也不叫見我一面我被他們瞞得來倒像不在世界上活著的一般到如今還似雲天霧地裏過日子心裏終究不大明白林姑娘雖然來了不肯和我多説話頭裏的事他並沒提起一個字晴雯道我是個丫頭那裏敢比林姑娘講到受人家算計幾乎把命也送了這樣説不出的苦真同我差不多呢你不知道我告訴你罷於是晴雯就把前前後後的情節並人家哄他説林姑娘不在了的意思要他再不起別的念頭好一心一意同寶姑娘過日子的話説得來竟似晴雯在跟前親眼看見的一般寶玉道你住在外頭為什麼倒知道這些呢晴雯道那都是人家告訴我的裏頭那一件事情我不知道寶玉道人家告訴的你自然紫鵑也知道的了難道不告訴他姑娘到底林姑娘知道我的心沒有怕他還怪著我呢晴雯道這可是沒你的説了林姑娘怪你還到你家來嗎如今你們兩個人的心好比新磨出來的鏡子對照得通明透亮的了有什麼不知道呢這裏正在説話那紫鵑悄悄的開門出來走到窗戶底下早已聽了多時又聽得晴雯説道咱們講的高興不覺的你聽雞都叫了我見大奶奶那裏喂了許多雞子這遠遠的聲音一定是稻香村裏的寶玉道你瞧瞧我的表什麼時候了晴雯道我懶怠動彈左不過交寅時候了寶玉笑道正經今兒晚上別叫你再擔個虛名一語未了只聽得一陳嘻笑之聲兩個人的聲音漸漸低了下去聽不清説些什麼話了紫鵑聽到這裏也就轉身回去睡歇次日起來梳洗已畢便到瀟湘館將上一夜所聽的話一句句都告訴了黛玉黛玉聽了心頭暗想這個人為什麼癡到這步地位連晴雯的見識都不如這會兒還有什麼要説的話還有什麼要説的我不知道的話細細追想起來他這條心一天十二個時辰除開睡覺工夫十分之中只有三分在別人身上其實這三分還是容易使出來的沒有什麼隱微委曲之處歸根兒分出去這三分時候也要並到這七分裏頭來的難為他怎麼挨過了這幾年頭裏只道我這個心是撩在連柏水裏泡透再沒第二個心比我苦的了誰知他到如今還是這樣倘我死後回不過來倘就去做了和尚這一腔怨氣也曆劫不能消化的黛玉呆呆想出了神紫鵑見了暗吃一驚將黛玉臉色神氣打量了一會想姑娘病後除了幾個月我不在跟前從沒見他發過心事瞧他這會兒活脫是舊時形景莫非我剛才説錯了什麼話一句句想去並沒有也不犯著為他發悶滿腹猜疑倒把一個紫鵑糊塗住了且出去叫小丫頭搧了茶來假以送茶為由留心察看紫鵑端了茶送到黛玉跟前站了半晌叫一聲姑娘喝茶黛玉才見是紫鵑心上一動也覺得自己的神情已被紫鵑瞧破微微笑道有他們在這裏呢紫鵑也是一笑走開以後寶玉提起前情黛玉便笑臉聽訴苦衷故意尋話問答寶玉才得把受人胡弄並從前幾次三番要寬慰黛玉説不出的話都傾肝剖膽逐一分證明白了一日黛玉向晴雯道我聽紫鵑説起你還有些東西在你舅舅家裏也該打發一個老婆子出去取了進來晴雯沈思半晌道想我病了攆出去半死不活撩在一個薄皮棺材裏頭擡到野地裏不是我舅舅舅母救了我這條性命養活了兩三年在我姑表哥子家裏還住得的嗎這一點子東西就留在那裏算謝了我舅舅家也不想去拿回來了黛玉道不是這樣的既然你舅舅家待你好要補補他們的情我打發人去叫你舅母把你東西帶了進來也好説説話瞧瞧你的光景叫你舅母歡喜歡喜我這裏有個道理叫他們過得去就是了晴雯道姑娘的恩典那麼著敢仔好於是黛玉就叫周瑞家的坐了車子出去引著晴雯的舅母進來在晴雯屋裏講了半天的話臨走時給他五百兩銀書刪繁冗卻説襲人在家先聞寶玉有了下落又聽鳳姐親往求親回來接著林姑娘已到不多幾日寶玉完姻林姑娘的主意收了晴雯紫鵑叫他兩個人同住怡紅院一報一報似提塘報的傳到他家別人得意之事襲人聽了件件觸心不料林姑娘竟是一個大方寬厚的好人從前看不透他的深沈錯會了東風壓西風西風壓東風的話枉費心機提防過甚順看一帆風以致顛顛倒倒連遭不得意之事自己又沒主意錯跨了這一步路真是後悔無及一日開看梳頭匣子撿出兩截斷玉簪想起勸説寶玉的時候拿準了要與他過一輩子的誰知自己反落了一個沒下梢正在傷心見他嫂子走來道這幾時裏頭府裏的喜事接二連三的出來姑娘何不借著叩喜的由頭進去走走剛在家裏給我們臉子瞧也不中用自己該拿個主意才是襲人聽了越發沒好沒氣的發作起來道嫂子叫我拿主意我的主意早就拿定的了花自芳家的道姑娘定了什麼主意別放在自己肚子裏説出來我們商量好辦襲人道求嫂子和我哥哥説一聲要他看同胞情分好好的買一副棺材備著這是我的主意花自芳家的見襲人氣得臉都黃了只得陪笑道姑娘的氣也太旺了叫姑娘往裏頭走走我沒有使什麼壞心認真你哥子想靠著妹子拉扯他嗎也不過為姑娘自己一輩子的事太太的恩典不用説了那年年頭上姑娘回了家寶二爺找到我們家裏來留他吃飯只是那兩個人的光景也瞧出來了俗語説的好人有見面之情姑娘你自己去再想想襲人半言不語道要我自己進去就死也不進府去的了花自芳家的聽出襲人的話頭一心想進去自己不肯舍臉便道怨不得姑娘的臉重説不得我去跑一趟當下換了衣服出門想起從前叫他姑娘出來原是走周大娘這條門路的解鈴還得系鈴人不如再去找他一路思想徑往周瑞家來見了周媽便講起襲人之事托他想個法兒周瑞家的沈凝了一會道上年太太原叫過一回他自己不肯進去如今裏頭沒人提起我們怎樣説話呢嫂子既然托了我再沒有不放在心上只好碰機會在旁邊替他幫襯一兩句話也容易嫂子你回去對你姑娘説叫他不用性急且等我的信罷或是過幾天你自己進去走一趟探探裏頭的光景怎麼樣也好花自芳家的坐了一會就回家去了卻説寶玉這裏一日麝月把上年黛玉送與寶玉的東西找了出來寶玉看見便都捧在手內走去與黛玉瞧道林妹妹家去還送我這些可見妹妹始終沒有惱我心上終有我的黛玉微笑道你也是參悟過來的人全不想我送你的東西與送別人不同正是心上沒有你呢寶玉也不理會只當黛玉故意慪他的話便拿去仍給麝月收拾好了走出院子裏喝道你也來做什麼黛玉與紫鵑鶯兒在屋子裏聽見不知寶玉吆喝的是誰只見傻大姐掀簾進來黛玉看見了記起蜂腰橋撞見他哭訴被打的故事來此時另換一番心境反笑自己當日過分一點惟紫鵑與鶯兒兩個見了他各人想起前事都因他而起惱得傻大姐如眼中釘一般紫鵑愣著眼瞅他道沒好樣兒各處地方傻夠了又傻到這裏來我去告訴鴛鴦姊姊仔細揭你的皮黛玉因是賈母屋裏的人便叫住紫鵑反叫去摣些果子給他傻大姐嘻嘻的笑道我聽見人家説林姑娘屋子裏有女孩子唱戲我來瞧熱鬧呢説著撩起衣服兜了果子出去到瀟湘館外一路玩耍吃完了果子又到牆根底下刨竹鞭兒刨出一件東西認不得是什麼恰值王善保家的因邢夫人叫他往黛玉處道謝出來看見傻大姐問道你手裏拿的東西是那裏來的傻大姐道我在這地裏刨出來的王善保家的便站住了腳估量是瀟湘館裏人偷出來的東西埋在土裏的便起了貪心哄傻大姐道這不是一件好東西你可記得頭裏你拾的被太太瞧見滿園子的人都鬧的不安靜你給我罷傻大姐嚇得呆了忙遞給王善保家的道奶奶拿去別告訴大太太王善保家的道是了你快回去別在這裏玩了當下王善保家的傻大姐各自走開到第二日早上邢夫人來到王夫人處鳳姐也在那裏邢夫人道咱們園子裏又鬧出一件希奇事來了昨兒王善保家的從林姑娘那裏好好回去睡到半夜裏翻天覆地的鬧起來像有什麼附在他身上道瀟湘館牆外一帶地裏藏著一千三百萬銀子看守了多時等他們起了去好回去銷差你敢瞞昧了一個元寶缺了數叫誰補上還不快拿出來一頭説伸手到炕頭邊摸了一個元寶出來就撩在地上鬧到這會兒還昏迷不醒你們道奇不奇説著便向跟來的老婆子手裏接過手帕子解開給王夫人瞧看見元寶面上鏨著林黛玉收四個字鳳姐看了笑道這也奇了怪道前兒瞧見那裏有火光呢原來林妹妹是個財星既然有這件事咱們商量去起罷王夫人道王善保家的見神見鬼的話那裏就信得準鳳姐道這元寶是假不來的太太不必多心咱們拿了這個元寶告訴林妹妹大家同去看看就明白了於是傳了賴升林之孝家的哄動一衆老婆子丫頭們隨著都往瀟湘館來邢夫人自回去了王夫人見了黛玉説明此事同往院外牆邊查看有幾個獻勤高興的老婆子已帶了鋤頭鐵鍬不由吩咐向地裏扒不上一尺來深就是元寶瀟湘館前後左右鋪得滿滿的王夫人鳳姐驚喜非常黛玉見了雖覺得奇異不過是身外之物不足以炫目動心王夫人心上盤算了一會道且不用上庫開了綴景閣就近運放在裏頭傳齊做粗活的女人帶了器具隨起隨運吩咐賴升林之孝家的輪替小心照看又叫紫鵑晴雯們大家留心林之孝家的笑道奴才們自然不敢離開太太也不用操心現有榜樣那一個起了黑心他們不怕做王善保家的丟了臉還要受罪一兩黃金四兩福有他們的分嗎黛玉請王夫人鳳姐到他屋裏坐了一會各自散去起的藏銀自往綴景閣堆放接連運了兩天已經堆滿回了王夫人王夫人道這宗銀子原是林姑娘的去回明林姑娘請了封條封鎖了綴景閣的門再開嘉蔭堂運放以後怎樣存貯運用到瀟湘館回話憑林姑娘主張黛玉聞知等起運完後暫時把嘉蔭堂與綴景閣一同封鎖所有開掘藏銀地面隨掘隨平不消吩咐黛玉定了主意擇定日期請了李宮裁王熙鳳並邀探春同到議事廳敘話不知所議何事且看下回分解
