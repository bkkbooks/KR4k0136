body:
  text: 第四十回慶團圓賈母賞中秋博歡笑村嫗陪戲宴話説黛玉在蘅蕪苑見小丫頭來請回到瀟湘館走上臺階聽見雪雁屋裏一片嘻笑之聲卻不聽得襲人説話黛玉便問道小丫頭説不明白説來了一位奶奶可是襲人姐姐嗎襲人在裏邊聽了奶奶兩個字臉先紅了趕忙迎了出來與黛玉磕頭黛玉把他拉住問道如今可大好了我倒惦記你呢説著拉了襲人的手走進里間讓坐襲人不敢就坐黛玉笑道這屋子裏你頭裏常來慣的咱們舊日在一堆兒猶如相好姊妹一樣別生分了我襲人只得在一張小杌子上就凳沿欠身坐了低頭無語黛玉看他一種拘謹羞愧之態迥非舊時舉動便問見過老太太太太沒有襲人欠身答道剛才進來見過的了又問晴雯寶姑娘的事都知道了嗎襲人道都知道的了黛玉道第一個先説晴雯那時病著被太太攆出去死了放在棺材裏擡到地頭活了轉來悄悄的在他舅舅家裏住了兩三年咱們都不知道世上還有這個人第二個寶姑娘金玉姻緣不到頭靈柩現停在鐵檻寺有這位張小姐的遺體附魂還了陽更是天下少有的事説到我黛玉説出我字瞅了襲人一眼重又道我也是死去活來上年回了家都料定我再不能到這個屋子裏來的了那曉得後來的事竟是神仙也不能知道的你和我們一個樣兒今兒進來也只當轉世投胎把頭裏的事再別挂在心上大家過快活日子晴雯不過嘴躁一點其實心上也是坦白的襲人聽了黛玉的話不能回答一句惟有流涕説道奶奶寬宏仁厚我活一天戴奶奶一天的恩德説著又跪下去黛玉忙拉住他道話都和你説明的了還要這樣算什麼呢又道寶姑娘仍舊住他的蘅蕪苑做新房晴雯紫鵑叫他們住在怡紅院了你愛住那裏憑你去揀罷晴雯聽了忙過來叫道襲人姊姊照舊同咱們去住怡紅院好襲人心思撩亂話不留神説一句我不去住這屋子也住膩的了晴雯聽了心想好意留他他倒説出這句話來由不得答他一句道你住膩了再到蔣晴雯才吐出個蔣字紫鵑正同晴雯站著連忙在他衣巾上拉了一把晴雯記起黛玉勸他的話便縮住了口襲人只做不理會便介面道我到這裏來伺候奶奶黛玉道你願意在這裏住也使得快去看看寶姑娘再來襲人道我的鋪蓋還沒拿進來呢紫鵑道雪雁就有幾床被褥怕短了你的鋪蓋嗎當下襲人出了瀟湘館一路行走細想林姑娘的話説得情理懇切似沒有惱我他素日是有心眼的人真假尚難揣度只好留心再看底下正走間頂頭來了彩屏見面彼此問好彩屏便問姊姊那裏去襲人道蘅蕪苑去瞧寶姑娘彩屏笑道姊姊怎麼連園子裏的路都認不得了這是到櫳翠庵去的路呢襲人因心裏有事不留意順腳走去被彩屏道破擡頭一看自己醒道我當真發昏了便回身同了彩屏一路敘話過了荇葉渚彩屏自回蓼風軒去襲人徑往蘅蕪苑他一進外間屋門見了寶叉並不驚奇疑異竟當了素常見慣的寶姑娘把自己嫁到蔣家才回家時候要往鐵檻寺哭訴的心腸就此發泄滿腔怨苦結為悽楚之聲抽抽噎噎的哭起來寶叉一見襲人也禁不住兩行珠淚直滾下來鶯兒忙上前悄悄勸道今兒是姑娘回九的好日子快別這樣你瞧引得姑娘也傷心起來了薛姨媽在里間屋子裏聽見也出來把襲人勸説了幾句襲人才住了哭寶叉道剛才小丫頭來請林姑娘説來了一位元不認識的奶奶林姑娘就猜是你我先要問你是誰叫你進來的襲人答道是林姑娘呢寶叉道林姑娘叫你進來就很好你見了林姑娘他和你説些什麼襲人就把黛玉説的話一一告訴了寶叉寶叉道難得林姑娘同你講這些話你也不用傷心就把林姑娘這番話細細領會去我也再沒別的話和你講了你在那裏住呢襲人道我就住在瀟湘館裏寶叉點點頭襲人又問了寶叉借體還陽的話一時寶玉回來見了襲人因前日已與襲人見過面知道他進來了此時不過與他淡淡問答幾句等將來到無人處私與綢繆自不必説是日薛姨媽同襲人都在瀟湘館住下到了十五早上賈赦率領子侄輩先在賈母處行禮已畢散出邢王二夫人及尤氏李紈鳳姐黛玉寶叉衆姊妹挨次與賈母叩節然後李紈妯娌等又見過了邢王二夫人薛姨媽與賈母邢王二夫人互讓一會坐定寶玉先已隨著賈赦一班行過禮了只混在姊妹們裏頭同那個扯扯與這個講講衆人坐不多時賈母便令邢夫人尤氏婆媳各自回家去過團圓節晚上不必過來邢夫人先自走了尤氏隨後站定回轉頭來笑道老祖宗趕我們只好走了鳳姐也笑道不知好歹的老祖宗體諒你們不磕個頭謝謝你們瞧他還要拿腔呢別害躁儘管走你的罷説著把尤氏一推蓉哥兒媳婦也帶笑隨著走了衆人各自回去鳳姐到自己屋裏脫了衣服才吃完飯平兒進來説道老婆子上來回劉姥姥來了在二門外站著呢鳳姐道為什麼不叫他進來老太太前幾天還問起呢平兒吩咐了老婆子便站在月臺基下等他不多時劉姥姥走進院子趕著上前與平兒問好見廊下放著一大堆西瓜劉姥姥道我女壻家裏種了十幾畝瓜地裏頭一箍腦兒起來還沒這些呢平兒道這幾個是挑出來賞丫頭婆子們晚上供月的你去瞧咱們堆西瓜的屋子比這裏還多幾十倍呢説著進了堂屋劉姥姥見了鳳姐彼此問好鳳姐道姥姥算你有兩三年沒來瞧你倒越發硬朗了咱們都説姥姥為什麼不來連老太太也惦記你別一會子得罪了你惱了咱們了劉姥姥念了一聲佛道我的好奶奶説起這樣話來就為上會子奶奶同老太太太太姑娘們都看顧我拉了許多東西回去我女壻家裏添了好幾畝地屋子也蓋了幾間一年四季瞧他們間的時候就少看不過幫他們動動手那裏走得開所以沒有來看奶奶鳳姐笑道你又拿什麼時新菜蔬來送咱們呢劉姥姥道今年雨水多結的瓜果都不好上會子來孝敬了這點點硬的軟的騙了一大車子東西回去今番進城來我女兒女壻原叫我地頭上搜尋搜尋多少帶一點子再不然蟈蟈也捉兩籠子來送給哥兒們玩玩我想哥兒們年紀也大了不愛這些説到別的還有什麼希罕東西知道的呢説我盡一點窮心那一等刻簿嘴一定説那討人厭的劉姥姥又拿了兩籃子蟲蛙扁豆退倭瓜來打抽豐了不如塌拉了兩條胳膊進來看看奶奶倒乾淨鳳姐道那是姥姥你多心咱們倒想你們田裏一點野味兒換換口底下來再給我們罷劉姥姥又回過臉來向平兒道姑娘給我要的葫蘆茄子條兒有了心也沒孝敬果然奶奶姑娘不嫌棄那些東西值什麼錢呢鳳姐道你外孫外孫女兒為什麼不同你進來劉姥姥道他們如今也都大了不許他們出來玩耍在家裏輕便活計也好替替力我一個人搭了一輛屯車趕天明就進了城到門上不叫進來盤詰個難耽擱了有時候呢鳳姐聽他的口氣知還沒有吃飯便命平兒叫他們與姥姥端飯他屯裏上來走了十多裏路了先拿兩個月餅來給姥姥先點點飢老太太那裏傳過飯了姥姥你吃了飯同他過去太太也在老太太屋裏呢我到園子裏去走走看他們收拾圓月的地場當下便帶了小丫頭子進園來先到凹晶館前看了看見已撑起五色彩帳老婆子們搬擡桌椅小丫頭支架風爐洗滌茶酒器具正在忙亂鳳姐吩咐了幾句話下來要到瀟湘館去見五兒正走來道姨太太同奶奶都到蘅蕪苑奶奶那裏去了鳳姐又回身來到寶叉處見史湘雲李紋李綺探春惜春寶琴香菱玉釧都在寶叉房裏説笑薛姨媽與黛玉兩個看寶叉做的針黹因這些繡花東西都是張家姑娘的手迹所以看了還議論針線好歹鳳姐進去大家讓坐講不到兩三句話只見翡翠進來找璉二奶奶道老太太因為劉姥姥來了留他聽戲叫就在賞月的地方傳梨香院戲班來唱戲晚上再圓月呢鳳姐道凹晶館前唱戲就寬敝便叫小丫頭去叫林之孝家的來吩咐預備著一面先打發人去告訴王夫人黛玉笑問可就是大火燒了毛毛蟲這一個劉姥姥嗎鳳姐道可不是他呢寶叉湘雲都笑道今兒來了他可有了玩意兒了當下衆人都拉翡翠坐下翡翠道我要走了你們去罷老太太今兒高興也就來了鳳姐忙同翡翠出了蘅蕪苑這裏薛姨媽一衆人也都慢慢起身齊至凹晶館紫鵑鶯兒晴雯又去拉了襲人都來瞧戲衆人才至凹晶館李紈也來了遠遠望見鴛鴦琥珀攙扶了賈母顫巍巍的行來王夫人同翡翠玻璃隨在後面劉姥姥走得快站著等賈母一同到來相見劉姥姥見了花團錦簇這一群人已斜著眼瞧道奶奶姑娘們可要恕我老糊塗我見了奶奶姑娘們都面熟卻認不真那一位姑娘那一位奶奶誰是誰鳳姐笑道別位奶奶姑娘都不用説內中有兩位奶奶姑娘須得我來告訴你才明白因指黛玉道這一位是先前住在園子裏你見過的林姑娘如今是咱們寶二奶奶了又指寶叉道這一位也是見過的姨太太家的寶姑娘做了咱們寶二奶奶如今是張太太家寶姑娘又是姨太太家寶姑娘還是咱們寶二奶奶賈母聽了笑道你們聽這猴子又故意鬧他呢薛姨媽道這可真把姥姥糊塗住了你越往明白裏説越不得明白呢劉姥姥也不理會鳳姐的話便道老祖宗今兒叫我在這裏賞月月亮還沒有上我先跑到月宮裏來了這一個賽一個的都不是月裏嫦娥嗎鳳姐道姥姥到了月宮裏那桂花樹底下的石臼子可要你去搗兩錘呢劉姥姥道奶奶又取笑我了這不是叫我做老兔子嗎衆人又都大笑起來一時戲班伺候點戲賈母道點什麼戲呢我同姨太太隨便瞧他們兩出只揀好的唱就是了一時開場先唱浣紗記采蓮因少腳色連清音女孩子都拉在裏頭接著又唱解妓趕車賈母問道姥姥你瞧咱們的戲比你們屯裏唱的好不好劉姥姥道我活了這麼大年紀戲也聽過的多那裏有這樣好戲別的我不懂只瞧扮的旦腳活脫像個女孩兒衆人都笑起來鳳姐拉了蕊官推到劉姥姥身旁叫他瞧道姥姥你仔細瞧瞧他是真女孩子假女孩子劉姥姥道那是我認得清的他不過生來俊妝扮得像那裏是女孩子呢説著把蕊官的頸脖子撫摩了好一會蕊官見劉姥姥認他做男孩子瞅著他嘻嘻的笑劉姥姥越捨不得放手鳳姐道姥姥你喜歡他肯把你家孫女兒給他做個老婆你也招了一個好孫女壻劉姥姥道我倒願意呢便問蕊官你定了小媳婦兒沒有蕊官忍住了笑説不出話來只是搖搖頭劉姥姥道我回去問問青兒的媽把青兒給了他罷鳳姐又笑道到底要察訪察訪明白別把青兒送到他家兩口子配不上退回家來人家説你孫女兒配給戲子都不要底下就不好攀親了一句話説得襲人臉上紅了又紅鳳姐偶然睃眼到廊簷下見了襲人才想起這句話無意中傷觸了他悔已無及連忙把別的話岔開了去一時賈母要散步出來看看園景便叫煞了場同薛姨媽先走衆人都隨在後面一陳風來滿鼻子聞的桂花香劉姥姥道別説別的花卉就這桂花香比屯裏桂花香的不得一樣鳳姐瞧著山子底下兩株桂樹道果然今年分外開的茂盛園子外就聞著香呢説話間早走了一節多路鳳姐回頭叫老婆子們快到前面沁芳亭鋪設好了一面隨賈母進去坐歇便道老祖宗看看河裏種的菱角子早就密層層結的多呢劉姥姥介面道這些瓜果蔬菜輪著年分那一年種的那一樣有收成就是咱們莊家人也再拿不準照像這園子裏誰還計較到收成不收成不過玩意兒種上些點點景罷了鳳姐説姥姥你不知他們園子裏這些瓜兒果兒各有地段分給管園的老婆子經理比如河裏的蓮藕菱角都是駕娘們的出息他們比你們鄉里種莊家的還用心盤算呢正説著寶玉拜客回家換了衣服趕來道我知道老祖宗今兒要逛園子趕早回來了説著見過賈母薛姨媽自與黛玉寶叉諸姊妹隨意説笑一面賈母道荷花早開敗了這些殘敗荷葉子也該叫駕娘們坐船下去收拾乾淨鳳姐道這是寶兄弟頭裏聽林妹妹説什麼丟脫柴胡剩葛根所以叫留著的賈母不懂這句話黛玉寶叉史湘雲這幾個人已笑得腰都彎了寶玉笑向賈母道老祖宗別聽鳳姊姊的話林妹妹説的是一句唐詩留得殘荷聽雨聲不知他纏到那裏去了寶叉住了笑才對平兒道你奶奶這幾天想是傷了風請王太醫在那裏吃發散藥一鬧就鬧到藥鋪子裏去了衆人聽了又笑起來這裏寶玉見了劉姥姥便道姥姥多時不來了這幾時那裏有什麼新聞講與咱們老太太聽聽黛玉悄向衆人笑道你們聽他講新聞又有個穿緑的女子要作怪了那時晴雯正穿著一件蘭花緑的夾紗襖子站在葡萄棚下摘葡萄湘雲指著他取笑道你瞧晴雯姑娘就是穿緑的他作起怪來還要奶奶鎮治他呢晴雯悄悄道我本來是狐狸精也不用奶奶鎮治請太太再攆了我出去就是了黛玉釘了他一眼大家無話聽劉姥姥道二爺問我這話可真有呢就是我們間壁鄰居有一個女兒因是屬雞的小名就叫金雞兒怪好的模樣今年十七歲了兩個月前頭忽然面黃肌瘦起來請了幾個大夫來看治都不識這種病夜間關上屋門像有男人在裏頭説話他娘老子留心瞧他見有一個穿緑衫子戴秀才巾的後生天天夜兒來呢衆人聽到這裏都指著黛玉笑道怎麼顰兒的話説的能準一面又聽到劉姥姥道他老子娘只有這個女兒鎮天哭哭啼啼有人叫他到天齊廟請了王道士鎮治畫了幾張符貼在家裏也不中用到底猜不透他是個什麼妖怪鳳姐正色道這個妖怪我倒猜著他是個黃狼精劉姥姥道奶奶為什麼知道他是黃狼精呢鳳姐道那姑娘叫金雞兒黃狼想拖金雞可不是黃狼精嗎賈母聽了笑罵道這猴兒又要胡謅了寶玉聽見這些話便代他們著急道這女子被妖精迷住了還了得該叫他們再想法兒才好劉姥姥道正是他們要請張天師不知幾時進京叫我裏頭來打聽打聽寶玉道天師三年進京一回上年才來過了再等兩年那女子還有命嗎李紈見寶玉這樣著急他也是誠實仁慈的人便笑道咱們園子裏有張天師呢説著便叫劉姥姥去求惜春道咱們四姑娘能驅邪除祟畫的符靈驗劉姥姥見了不管是真是假便向惜春求符惜春那裏理他賈母因李紈的話不比鳳姐隨口取笑聽了有幾分相信便叫四丫頭我知道你常和妙師父來去果然有什麼驅邪符咒就給他兩張這也算行好事靈不靈沒有什麼要緊惜春道老祖宗不要聽大嫂子的話他又何曾見過我書符畫咒呢李紈笑道我從來不肯説謊不是林妹妹回了家那看屋子的老婆子鬧的晚上不敢進去睡覺你畫了一張符給他們貼上就安靜了不是你鎮治的嗎惜春聽見李紈道破這事難以分證只得叫瀟湘館上夜的老婆子來命他去取上年給他們這一封字條兒那老婆子已換了班忙去查看只見那封字帖兒還高高的粘在門上頭便揭下拿在手中忙忙的趕來送還惜春這裏賈母和衆人已先向李紈問明瞭上年的事第一個黛玉要緊開看便在惜春手裏接過拆開裏面並無符咒只有林黛玉在此五個字黛玉靈機透徹事關切己一時看了便知瀟湘館並無邪祟定是看守藏銀的護從神往來走動欺壓這些運退命窮的老婆子以致失驚打怪四妹妹早覺未來寫我的姓名貼上鎮之即寧只是不肯説破衆人見了都嘲笑惜春戲弄老婆子們並李紈亦為其所愚惜春便借此向賈母掩飾道但凡一個人疑心生暗鬼這原是上夜的老婆子見屋子裏沒人覺著冷靜了心裏害怕倒像有什麼作耗似的我原要哄騙他們沒的寫上就寫上林姊姊姓名封嚴了給他們説拿去貼上就不怕了他們從此放大了膽夜裏也沒聽見響動了可見我並不知道畫什麼符如今劉姥姥聽了大嫂子的話來纏我就照樣再寫一百張給他拿去也攆不了妖怪惜春幾句話把衆人都哄瞞了過去賈母道他們不會拿捉妖怪也別管人家的事且去逛我們的罷説著站起身來行行歇歇往各處逛了一會來到蘅蕪苑看寶叉的新屋子賈母坐下道我先前説你屋子裏太素靜如今還像新屋裏的擺設也就看得過去一面寶叉捧茶送與賈母王夫人薛姨媽衆姊妹隨便散坐吃茶寶玉又去應酬湘雲寶琴李紋李綺一衆人鶯兒先拉了劉姥姥到他屋裏吃茶去了坐不多時天色已晚林之孝家的上來回凹晶館的圓月酒席已預備多時鳳姐因賈母今日多走了幾步路怕賈母身子倦乏便叫把軟轎擡來請賈母坐轎衆人隨著只見皓月一輪已從樹梢影裏推上來了秋色澄鮮碧天如洗一時到了凹晶館席面已擺現成賈母與薛姨媽坐了居中一席拉劉姥姥同坐了道咱們在一堆兒説話近便些別去鬧他們年輕的原來榮府規矩有喜慶事宴客賈母坐了主位邢王二夫人皆不能坐就是尋常家宴媳婦孫媳婦亦皆侍立捧觴賈母命坐然後退下不比孫女兒們可隨著賈母共坐不拘今夕雖無外客而中秋慶宴不比尋常王夫人要按規矩李紈鳳姐自然隨著至於黛玉寶叉兩個人與從前在園中作客之時不同亦在紈鳳之列賈母見他們各人要按禮節便笑道我有一句話你們大家聽著別説我偏心未知賈母説出什麼話來且看下回分解
