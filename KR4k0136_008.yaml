body:
  text: 第八回棘院尋郎驚心冤孽畫堂演劇指證仙圓話説平兒同鶯兒兩個人從紫菱洲出來各自回去回明瞭話連日事無可記書不細表時光如駛到了八月初頭點定主考房官初六日監臨各官送主試等官入諱府尹衙署前起至貢院這幾條街各胡同口兒上都是老幼婦女看的人非常喧鬧榮國府裏自有一番調度李貴本來專管寶玉出門的又添派了幾名老誠家人同著焙茗鋤藥雙瑞壽兒四名小廝伺候寶玉賈蘭另有伺候的人先在附近貢院左右找下一所精潔房屋派定廚子火夫買辦人等扛擡一切動用碗盞器具鋪墊食物在寓所妥為安頓這一天寶玉出門到賈母王夫人各處一走雖然就在京裏並沒離遠賈母等因寶玉從來沒有出門過的竟像寶玉此時要遠走幾千里路的一年半載才回來的光景十分惦記王夫人叫周瑞家的上去傳諭跟寶玉蘭哥兒的人都要小心寶玉同了賈蘭走出榮禧堂早有馬夫帶著馬匹伺候寶玉賈蘭上了馬衆家人簇擁著到寓所去了這裏襲人等早已把寶玉睡的被褥並要替換的衣服鞋襪等物收拾得停當叫老婆子送到垂花門外指名交給焙茗自寶玉出門後寶叉為人大方明知數日之別心上安然毫無牽挂惟暗祝寶玉三場得意早聽捷音那服侍寶玉這幾個大丫頭倒覺眼前似掉了一件活寶屈指計算有好幾天不得見面獨有襲人更加關切巴不得上頭吩咐出來叫他們跟著去伺候才好講到寶玉進場這一天五鼓起來吃了早飯便同賈蘭帶了衆家人小廝來到貢院前見進場的人已人山人海不多時升炮開門唱名聽點寶玉與賈蘭兩個那裏挨擠得上跟去的人在稠人之中用力擠開前後護住才得上去聽著點到自己便應聲擠上進了頭門李貴等因與衙門裏多有熟識的人瞞上不瞞下混了幾個人進去到儀門前照應看寶玉賈蘭點過名走進儀門自己提了籃子魚貫而入從甬道上走龍門到至公堂領了卷寶玉與賈蘭雖一樣領的官卷各自坐開不在一座號子內寶玉歸號後還陸續有人進來寶玉命號軍挂了門簾懶怠和同號的酬應那號房又低又窄自出母胎何曾見過這樣房屋雖有號軍伺應那裏如得在家中襲人這一班人周到寶玉此時已心有所悟也不計較到這上頭等到下午時聽得外邊放炮封門胡亂用了些茶飯天晚安寢睡到半夜聽得人聲鼎沸寶玉驚醒起身出號觀看只見火光燭天都説西文場走了水了外面巡場各官一齊趕出撲救忽然火光消滅各號靜悄悄在那裏睡覺並未失火知是魁星耀鬥應有文曲星在場各官都自散了接著就有題目紙分來號軍接過送與寶玉觀看首題是人而無信不知其可也大車無軏小車無軏其何以行之哉二題是人之其所親愛而辟焉三題是內無怨女外無曠夫寶玉看了這三道題目很不自在悶悶的坐了一會免不得想要落筆毫無思路連破承也沒有一句不覺精神困倦就伏在號板上合眼睡去只聽有人喚道寶玉還不快做文字睜眼一道金光顯出他失去的通靈寶玉在號板上定定懸著便覺文思泉湧汩汩而來也不留心去看那塊玉趁著亮光展開卷子拈筆直書竟如夙構一般頃刻間三篇落稿擡起頭來見天色大明那塊玉已不見了重又研墨照稿謄清從頭至尾念了一遍頗覺得意詩題是此日中流自在行寶玉素長於此越發機神流利一揮而就正打點上去交卷因號門未開且在自己號中坐等片時忽聽得同號裏頭喧嚷起來説這一個人吊死得奇怎麼好好的坐著把繩子套住脖子裏就會死了寶玉不信有這件事便出號踱將過去已有許多人拿了他這本卷子在那裏瞧寶玉擠不進去只得站立在人圈外面聽一個人笑道你們看剛寫上題目沒做一句文字倒有間情逸致填起詞曲來了説著一頭念道淚燭催何急冰蠶凍欲僵回廊步屜木空留響可記得小犬吠花陰覷紗窗月上奴也曾漢臯貽玉佩洛浦解明璫誰料你鴛鴦雙鎖春風穩忘卻了蝴蝶三更夜夢長都因是結下的前生孽帳到如今只落得珠沈玉碎增惆悵休思想高攀蟾窟桂枝香調寄世難容寶玉聽那一個人念畢旁邊的人都哄然道這是幹了負心事冤魂到場裏來索命附在身上寫的當下紛紛議論早有號軍回明瞭號官稟了監臨就有許多人進號來把這個人抱放在地上摸他胸前猶溫趕緊提發的提發擦胸的擦胸又拿官桂散用筆管吹入兩耳再灌薑湯那人命不該絶漸漸蘇醒正值開門放牌便命號軍背至號門外交給打掃夫背出有人認明擡回場內查明坐號貼示再講寶玉聽見此事心跳不止連忙上去繳了卷子走出頭門李貴領了焙茗鋤藥等四個小子早在門外伺候見寶玉出來了便引上了車先回寓所因賈蘭尚未出場留幾個家人小廝等候焙茗等先送寶玉回寓早煎好參湯端與寶玉喝了寶玉無精打采的躺在炕上焙茗上來問話寶玉只是嫌煩打發他走開只想場中之事一定他也和什麼人有了私情後來另締婚姻害那女子不知怎麼樣死了怨不得他來索命那女子有這樣詞筆也是雋慧不凡的死了豈不可惜這不是我和林妹妹一樣的故事嗎雖然我與林妹妹毫無苟且之事但他詞句內也不過花前月下情去情來沒有寫玷污那女子的實迹這負盟之處已經過不去了我再進二三場倘林妹妹也像這樣找我來了出那麼的醜豈不是求榮反辱寶玉一個人躺著盤算直等到黃昏後賈蘭也回來了寶玉勉強起身問了幾句場裏頭的話説你也趕得快今兒就出來了賈蘭答道侄兒不過敷衍完篇而已就挨到明兒晚上出來也是這個樣兒寶玉笑道很難為你了一時便叫端飯小廝們連忙應著端上飯來寶玉點景用了些各自安歇次日起身寶玉對賈蘭道明兒你一個人進去我可進了這頭場就算了賈蘭聽説只道寶玉做的文章不得意所以不高興便道咱們沒有犯規貼出好歹進了三場就算完了一件事中不中隨他二叔叔既然不高興侄兒也要回去了寶玉道你不知各人有各人的心事又何必看我樣兒呢賈蘭再三勸寶玉完場寶玉想到此番原非專為功名而來半途而廢回去一來對不住家裏二來此願何時得了況且我正想見林妹妹如今林妹妹果然尋到場裏來見了他正好訴訴我的委曲還怕死嗎於是轉想過來依舊打點進場只見焙茗進來回道璉二奶奶打發興兒送來兩支庫參還有些吃食東西寶玉點頭道你去收拾了叫興兒回去道謝焙茗出去自與興兒敘話一面收拾東西見院子裏走出一個鄰居家女人來年紀不過十八九歲生得身材梟娜一張瓜子臉兒有幾分姿色那女子溜了興兒一眼帶笑不笑的自出去了焙茗便向興兒道這個女人你認識他嗎興兒笑了一笑也不答言坐了一會走了壽兒對焙茗道剛才出去這個女人你不認得他嗎他就是多渾蟲女人的妹子娘家住在楊梅竹斜街早與興兒有一手的前年嫁給一個姓錢的在工部裏當貼寫興兒還去走動呢興兒求了他二爺工程上還給他拉攏好些事情住在這裏左邊拐彎兒上不遠興兒出去這會兒只怕還在他家裏你只當去找興兒叫他給你拉根桑條可好不好焙茗道好話李大爺查察得緊饒是安分守法在這裏還叫我們少喝酒耍錢別去鬧亂兒安安靜靜過了這幾天回到府裏去等下班的日子有錢那一個門子裏去花不了壽兒道我不過這樣瞎説罷哩當真叫你去闖亂兒嗎話未説完見雙瑞進來焙茗問道那裏去了這半天別偏了我們到好地方去逛來雙瑞道那裏的話我替二爺測一字拈著個仙字他説人立山旁定然高捷今科是恭喜的咱們興興頭頭要喝二爺的喜酒還要討賞焙茗介面道二爺中了説著把大拇指一伸指著自己道第一個是我的功勞壽兒問道怎麼説是你的功勞焙茗道伺候二爺上家孰念書才得中舉不是我的功勞嗎鋤藥道先在家學裏原虧你聽了薔哥兒的調撥鬧起事來不是李大爺在那裏張羅得快二爺也等不到這會兒才挂名金榜那兩塊硯兒飛過來倒早已頭角崢嶸了衆人聽了都笑起來不説焙茗一衆人耍笑講到寶玉進了二三場並無可紀之事到了十五日傍晚寶玉與賈蘭都出了場是夜不在寓所耽擱當時趕回這裏賈母因寶叉來做媳婦過第一個中秋想熱鬧一天打發人去接湘雲迎春湘雲推辭這裏又叫人去接才來了賈母因園子裏冷靜不高興到園子裏去就在自己院子裏月臺上擺了兩席酒坐的是史湘雲邢岫煙迎春探春惜春王夫人李紈鳳姐寶叉這幾個人陪著賈母賞月薛姨媽因家裏有事沒去請他邢夫人因感冒著也沒過來大家陪賈母喝了幾杯酒賈母想起年年過中秋有黛玉今年回南去了寶玉又不在跟前雖有鳳姐等輪流把盞説長道短與賈母取樂終覺沒興坐了一會先去睡了王夫人見賈母走後也起身回到自己屋裏歇著惟有湘雲還高興與衆姊妹猜枚行令正在熱鬧見寶玉同蘭哥兒回來先到賈母屋裏去請了安賈母甚是歡喜問了幾句話叫出去同他們喝酒熱鬧寶玉趁空兒關照了湘雲幾句話寶玉見了鳳姐便拉著蘭哥兒一同過去道謝鳳姐道我早就收拾出來等你們出門的時候倒渾忘了前兒叫興兒送去的説著衆人讓坐寶玉因從小和姑娘們成群作伴慣的不比別一個做親後仍無避忌便同賈蘭入席隨便坐下丫頭們添送杯箸團圓聚坐賈蘭不耐久坐先拉了他母親回園子裏去了這裏探春道你們看耿耿銀河碧天如水今年的月色何如湘雲道月色雖佳到底不如去年在凸碧山莊的暢飲探春道早知道二哥哥今夜就出場趕回來的我們鼓舞老太太起來依舊擺到園子裏去才樂呢湘雲想到上年和黛玉在卷篷底下韻事不禁脫口而出道同來玩月人何在風景依稀似去年探春釘了他一眼那知寶玉聽了已止不住一陳心酸霎時掉下淚來又怕被人看見只得低下頭去用衣襟拭了淚痕湘雲瞧著把邢岫煙的囑咐一時口頭留不住的話好比骨鯁在喉欲茹不得欲吐為難勉強周旋世故在丫頭們手裏接過酒壺向寶玉斟了一杯酒道請幹了這杯狀元紅專等重陽佳節耳聽捷音寶玉只得起身接過酒去飲了探春笑道二哥哥喝了史大妹妹的我們一遞一杯都要幹的呢正在説笑只見鴛鴦走來道老太太説寶玉這幾天也乏了別多喝酒早些去安歇養養神明兒月亮也是好的還要樂呢姑娘奶奶們高興再多坐一會兒寶玉因心頭有事本是勉強應酬聽見賈母吩咐便道少陪你們起身走了鳳姐便拉鴛鴦坐下灌了他幾杯酒大家點景用了些飯各自散去再説寶玉的行李物件先已交代進去襲人一一檢點明白伺候寶玉安歇次日飯後寶玉將頭場的三篇文字端楷謄好來到代儒處送與評閲代儒便問你自己做的還是遇著了對題你肚子裏記得就在場裏寫的寶玉道實是自己做的並非抄襲舊文代儒點頭道這幾篇文章局警詞煉氣足神完原像是一手出的照你平日的本領還沒到此地步不料你一病之後學問倒長進了説著又撚須笑道很有想頭寶玉便問蘭哥兒的太爺見過了沒有代儒道早上見過比你的自然差得遠了也算虧他的當下寶玉告辭回來賈母還要備席宴月問寶玉在那一個地方好寶玉因瀟湘館在園已視大觀園為恨地要依舊擺在賈母院子裏鳳姐寶叉兩個人深恐寶玉進了園生出一番枝節今聽了寶玉的話彼此放心是晚又聚飲至三更而散連日無話寶玉惟盼望揭曉之日榜上有名等至初九是辰日都知寶玉場中得意初八日夜裏從頭門上起至垂花門止上班的家人小廝至老婆子們都像除夕守歲一般耍錢的耍錢喝酒的喝酒不敢睡覺等至五更以後果有報録人等擁進府來一棒鑼聲直到榮禧堂上高貼報條寶玉中了第五名舉人各處早已點得燈燭輝煌老婆子們往裏頭報喜惟賈母處不去驚動其餘王夫人各處都已知道賈璉起來命林之孝等端正開發賞封一面吩咐廚房備辦酒席犒賞報子接著有平日來往公卿世家並賈政的同寅交好以及親族人等都來道喜自有賈珍過來與賈璉分頭酬應那日領了鹿鳴宴回來洞開賈氏祠堂門擺宴祭祖寶玉穿了公服至祠堂家廟行禮順便到寧府一走又去見了賈赦夫婦然後回來到賈母王夫人處都磕了頭再與賈璉鳳姐並李紈就在王夫人屋裏見了賈環賈蘭也來與寶玉叩喜寶玉安慰了賈蘭幾句話便叫了名班連日唱戲宴客已畢這一天家宴止有寧榮兩府內眷除薛姨媽史湘雲二人其餘並無外客戲臺搬到榮禧堂後面內眷們往來便易翻軒下一溜挂了堂簾因連日宴客酬應勞乏這一天改了早席免得熬夜擺了四席以次而坐薛姨媽與賈母互相推讓點定了戲開場演唱賈母與王夫人心中甚樂連薛姨媽亦因寶玉青年高捷暗喜寶叉金玉姻緣相當相對便舉杯向賈母今兒是寶哥兒的喜酒老太太該多喝一杯老太太那麼樣疼他難得寶哥兒巴結的早早中了舉老太太見了也喜歡喜歡可見先前並不是真不肯念書因他老爺期望之心太重總嫌他不肯用功可也是委曲他的賈母聽了越發歡喜道姨太太説的話就同我一樣心腸寶玉真不肯念書這個舉人那裏來的呢他小時候雖是有些淘氣瞧他並不是沒出息的不必管的他太嚴倒把這一個人拘束壞了如果生成的下流種子就打死了他那一輩子也變不過來的鳳姐趁著笑道老祖宗的酒自然該喝姨媽也該多喝一杯呢寶兄弟害了這場病不是姨媽疼他允了這句話寶妹妹好意思自己跑過來給寶兄弟沖喜把病沖好了才得下場中舉呢寶叉聽了嗔著鳳姐多説話便道那有像你這張嘴混説的賈母一面道鳳哥兒説的不錯你快去敬姨太太一杯探春笑對寶叉道寶姊姊你怪鳳姊姊説的話老太太還誇他呢探春話未完湘雲介面道正是我們盡仔瞧戲玩兒忘了敬二哥哥一杯喜酒説著便提了壺來敬寶玉於是姊妹們並李紈鳳姐挨次都與寶玉賀喜末後輪到寶叉只是不動衆人越發要和他取笑催逼著與寶玉敬酒寶叉便帶笑不笑的扯回頭去説道我是從來不會給人家斟酒的湘雲道前年二哥哥生日那一天夜裏頭我們慶壽玩兒寶姊姊你不記得行令掣簽你掣的簽上寫著什麼豔冠群芳那夜裏沒有給二哥哥安席送酒嗎寶叉搖頭道我不記得李紈笑道史大妹妹你們再不用熬寶妹妹玩兒了我有一個調停之法説著便叫鶯兒過來道你替姑娘斟了一杯酒敬姑爺就算數了於是鶯兒便斟上酒送與寶玉喝了一面李紈又説道今兒提起這件事我還記得寶妹妹掣詩句寫著任是無情也動人要在席衆人各賀一杯還要唱一支兒新曲賀他不是叫芳官唱的翠鳳毛翎嗎如今想起來那掣的籤子竟有些意思你們賀了寶兄弟也該賀寶妹妹一杯寶叉發急道席面上有了雲兒一個人已擱不住連大嫂子也鬧起人家來了正説著寶玉因受了衆人的賀酒自然要還敬衆人先與薛姨媽賈母王夫人敬了一杯然後以次而及那西首席上坐的有蓉哥兒媳婦不敢當寶玉送酒其餘都接杯飲幹寶玉在席上酬應了一會因唱的都是繁華熱鬧戲文不耐煩看他便出席掀簾出來走下臺階遇著戲班裏因點的戲將已唱完拿了戲目又上來找值席的請上去點戲寶玉接過戲目翻開一看便點了兩出吩咐不用再點就去唱這兩出罷寶玉點了戲轉出遊廊信著腳步兒要往冷靜地場去散動散動從東院耳房門前經過這個地方是派著幾個老婆子在那裏經管燙酒的寶玉聽得裏邊笑説道這是我們打平夥備了兩樣菜不是沾光廚房裏的還沒動箸子呢你老人家賞臉請喝一杯又聽一個人道今兒唱的好熱鬧戲文你老人家也沒去瞧瞧那一個人答道瞧戲呢也沒這個分兒就有一件説給你們評評理那一個老婆子道又有誰來得罪了你老人家嗎那一個人道並不是有誰來得罪我我告訴你們聽寶哥兒原是太太養的環兒也不能不算是老爺的兒子那孩子雖然沒志氣巴結不上一般念了幾年書難道比蘭小子還趕不上就不值得給他也捐一個監帶挈去進場叫他也裝個人兒中不中有命我一開口人家就壓派我護短這也是我護短嗎你們替我想想叫同那一個説理去話未完寶玉聽是趙姨娘便笑了一笑走過了又慢慢的轉了幾處才走到王夫人屋後西廊下將過鳳姐這邊來見麝月秋紋兩個趕來道白要我們到園子裏去跑一趟原來在這裏快回去罷老太太問呢寶玉道我是一輩子不到園子裏去的了你們自要去瞎跑説著便同麝月秋紋過來這裏早開唱寶玉點的五郎出家那唱楊令公的老外唱五郎的大淨都是有名腳色又唱得認真看得賈母王夫人等都傷心流淚起來賈母查問誰點的戲林之孝家的在旁回明是寶玉點的賈母也無言語那時寶叉知道寶玉還點一出仙圓便回了賈母説仙圓不如笏圓好賈母聽了寶叉的話叫改唱笏圓接著寶玉到了五台尚未唱完連忙上去又與賈母王夫人敬了酒答轉身來斟了一杯恭恭敬敬走到寶叉面前作了兩個揖送過酒來寶叉不曾提防看見寶玉這個樣兒漲得滿臉通紅當著衆人又不好説他什麼鬧得各席上哄然大笑起來虧鶯兒在旁靈變忍著笑過來接了寶玉手裏的酒杯遞到寶叉面前寶玉叫聲寶姊姊我只敬你這杯酒算謝過你了此時連賈母也禁不住發笑又恐寶叉臉上下不來叫聲親家太太你看他們別笑寶玉失了體統這一杯酒兩個揖很該謝他寶姊姊的寶丫頭到我們家來做了這幾個月的媳婦爽爽快快出來坐席聽戲還是第一回呢一進門來寶玉就害了病纍得他鎮日間悶在屋子裏頭後來病好了念書也是寶丫頭陪伴著還是寶玉想的周全我瞧著他像做戲的這樣做我看了比瞧戲還樂呢薛姨媽也笑道那總是老太太疼愛孩子們的緣故説著見戲文開了笏圓寶玉問道我點的仙圓為什麼不唱寶叉介面道老太太看了五台心裏怪不受用因是這一出團圓戲要取個吉利我回了老太太叫改唱笏圓的難道這戲文還不好嗎正説著只聽得戲臺上笙簫細奏冠佩趨蹌來與汾陽王慶壽的公侯卿相叫兒孫們分班陪宴果然顯赫非常薛姨媽便比著賈母道老太太到一百歲做起生日來富貴滿堂曾元繞膝也就有這樣勢派呢賈母道那是親家太太過獎了我也不想活到一百歲他們也沒有這樣福分賈母雖然謙遜心裏也覺歡喜便叫鳳哥兒再給你姨媽斟酒我們吃了飯下半天再聽罷薛姨媽站起身來互相推讓道酒已深了鳳姐過去便點景兒斟了些這裏寶玉不等戲文唱完對寶叉笑道我想姐姐到底看不透終算你不識戲文不記得你先前和我講過魯智深打山門這一出是好戲末了兒一支寄生草唱的沒緣法轉眼分離乍赤條條來去無牽挂那裏討煙蓑雨笠卷單行一任俺芒鞋破鉢隨緣化我如今還牢牢記著寶姊姊你為什麼改了脾氣了仙圓不要看要看笏圓你可知仙圓裏頭唱的你是個癡人我是個癡人那盧生悟得五十年狀元宰相美妾姣妻只在邯鄲枕上黃粱飯熟時的風流富貴這仙圓才是正經團圓戲文呢寶叉只是不理他不多時戲文煞了台正在歡天喜地之時想不到鬧出一件舉家驚惶的事來畢竟鬧的何事且看下回自有分解
