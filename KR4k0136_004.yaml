body:
  text: 第四回會芳園劇飲餞長行賦陽關聯吟抒別緒話説黛玉湘雲惜春同往稻香村來剛走進李紈屋子裏見有許多人在那裏熱鬧見了黛玉等進去李紈便向黛玉笑道餞行的人我給你請了多一半來了我兩個妹子剛才去瞧你丫頭們説你同了史大妹妹到妙師父庵裏去了他們在這裏坐了一會還要去找你我就説你庵裏出來一定轉到這裏的你看二姊姊也來了都在這裏等著你呢於是大家見過款敘寒溫都問了些黛玉病後調養的話探春又問迎春姊夫近來脾氣可好了些沒有迎春道要好是難説不過我如今經見慣了不似先前這樣受不得的光景沒法兒只好由他罷哩李紈介面道正是太太也説過這句話一年半載大家摸著了脾氣就沒有什麼了迎春笑道知道我能熬得一年半載呢李紈道真是一家不知一家事姨媽那裏蟠哥媳婦又和香菱淘氣安靜的日子少叫姨媽也真沒法兒湘雲忙問道大嫂了去邀琴妹沒有他可來不來李紈道琴姑娘是説來的香菱心裏想來恐怕走不開我算是足夠兩桌的人日子也看定後兒了湘雲道有一句話要告訴大嫂子在座還有妙師父呢叫廚房里弄幾樣精致素菜才好李紈道那不費事想不到他也這樣隨和起來可見我們給林妹妹餞行的心誠我還想著這酒席擺在那裏好呢也要大家議定好叫他們去收拾探春道大嫂子這裏就好何必再揀別的地方李紈道我這裏瞧個村野景兒麥浪秧針倒有及時的點綴湘雲道據我的意思林姊姊在那院子裏住了幾年咱們姊妹不知去了多少趟兒如今他走了未必有人再到那裏後兒的酒席不如擺在他屋子裏熱鬧一天如同與瀟湘館也餞別餞別衆人以為何如李紈等聽了都道與屋子裏餞別此論倒也新奇竟是那麼著很好探春笑道真是愛烏及屋了黛玉介面道後兒我要點一味菜衆人問道你要點什麼菜黛玉笑道那一碗燉鹿脯是少不來的倘一時沒有吩咐他們到秋爽齋蕉葉底下去牽出來就是了大家都笑起來湘雲道顰兒這張嘴一句也不肯讓人的於是坐了一會各自起身散去李紋李綺在李紈處住了黛玉同湘雲又到岫煙探春各處走了一走仍拉著湘雲到自己屋裏住下命雪雁叫老婆子到廚房裏吩咐了不多時用過晚飯黛玉想起湘雲有擇席之癖二人談到三更後各自就寢湘雲總睡不著靜聽黛玉已寂無聲響輕輕叫了他兩聲不應知他早已睡著自己一個轉側至五更才朦朧合眼醒來時只見紅日滿窗黛玉已起身梳洗連忙披衣坐起道差不多是吃飯的時候了呢叫翠縷快打臉水早有伺候的老婆子在窗外接應打了臉水翠縷接過端進伺候湘雲洗臉畢快要去開梳具匣子湘雲道不必嚕蘇了橫豎沒有多大日子住有林姑娘現成的在這裏借他使用著就是了當下黛玉勻粉點脂已畢站起身來讓著湘雲湘雲便挨身坐到黛玉坐的凳上檢點脂粉口內笑説道我先前見你整夜睡不著的為什麼如今倒像身上釘了磕睡蟲頭還沒粘著枕腳先睡了黛玉道你不知我這場病回過來諸凡不比舊時心裏頭是空空洞洞不追既往不憶將來倒比沒病的時候精神好了許多湘雲道你這個人病也比人家不得一樣我沒聽見害病都害得好精神的黛玉道當真我自己也不得明白想是菩薩保佑我素來敬信觀音大士如今回家去要塑一尊大士像朝夕頂禮呢説著見雪雁送過開水丸藥黛玉道我如今也不愛吃這些你都收拾起來罷一面叫擺飯黛玉與湘雲用過便有衆姊妹到來敘話一天過了到了次日餞行之期李紈姊妹岫煙迎春探春惜春陸續來到隨後見寶琴同著香菱也來了大家見過坐定寶琴又站起身來向黛玉道媽媽給姊姊問好媽媽因這幾天家裏有些瑣碎事務料理不開走不脫身不能過來送姊姊還叫姊姊也不必過去你不知道我嫂子又在家裏尋鬧呢黛玉忙站起來道媽媽過來可不敢當論理我該去辭行呢探春介面道姨媽既是這樣説你竟不必過去不是我説他這位尊嫂可不去見他也罷姨媽也再不怪你的又問香菱道琴姑娘來了太太跟前沒有一個人為什麼倒肯放你出來呢寶琴道他原走不開的媽媽知道他心裏想來説他怪可憐的天天窩憋在屋子裏受這一個的氣所以叫他出來逛一天散散心我今兒就要同他回去呢正説著只聽得小丫頭子報道妙師父來了説聲未絶妙玉早已走進先是湘雲笑道緑萼華下降紅塵非瀟湘妃子不能結此仙緣也接著衆人都道今日之敘難得妙師父一降正是咱們餞行的心誠一面敘話李紈道天氣也不早了我知道妙師父是不能久坐的琴姑娘同香菱也要回去咱們早些坐席罷當下吩咐一聲老婆子們上來調排停當並排兩桌黛玉要讓妙玉首座妙玉笑道這可是新樣兒今兒奶奶姑娘們與林姑娘餞行我是來附驥的那有主人僭客的理黛玉尚未開口惜春道不論眼前在這屋子裏妙師父倒也坐得首席妙玉道什麼四姑娘也鬧起我來難道去來今三個字的界限你不分明麼惜春一笑並不答言湘雲開口道你們講禪門裏的話咱們也懂不得據我看來妙師父本是希客林姊姊在這裏還算是主人就讓妙師父坐了也使得妙玉執意不肯和黛玉互相謙讓李紈道前日原要擺在我屋子裏的就是史大妹妹説要與瀟湘館餞別如今鬧得大家坐不成了探春道我説一句話包管就定了這屋子本來不是林姑娘的他就住在這屋子裏也算是客如今要走了咱們為的是餞行這屋子與林姑娘更不相干的了衆人道此論極是可再沒的説了黛玉聽探春説到這屋子與他無相干涉的話正與瀟湘決絶之意相合心中甚覺舒服便欣然坐了首席妙玉第二湘岫紋探挨次而坐第二席是寶琴李綺香菱迎春惜春李紈隨便坐下疊敬黛玉一杯丫環們輪流把盞衆人談笑彼此説到咱們今日一敘須要暢飲盡歡湘雲一看座中連黛玉十二人便道我有一句話耐不住要講出口來只是礙著琴妹妹在座寶琴笑道我也不知道你要説些什麼既為礙著我就不必提倘你實在耐不住只管請講何妨湘雲道我想寶姊姊同咱們這班人在園子裏相聚了幾年如今林姊姊回家了咱們公分餞行連妙師父都到了寶姊姊竟不來和咱們見個面兒真令人不解我平日不和寶姊姊好也不肯説出這句話來還不知大嫂子沒有去給他個信兒呢怎麼樣寶琴聽了低頭無語探春便把此事攬到自己身上來説這件事別抱怨大嫂子都是我的不是因為寶姊姊這幾天感冒著那邊也走不開咱們去和他説了倒叫他為難所以我叫大嫂子不去邀他的此時黛玉心中亦料寶叉決不知我近來的心事來了有許多作難之處並不是有意冷落我湘雲口快説了這幾句話瞧著寶琴的光景倒過意不去便叫春纖我瞧琴姑娘面前杯子裏沒一點兒酒為什麼呆站著不過去斟一杯寶琴道我倒喝了好幾杯呢妙師父真一點兒沒有喝黛玉道妙師父本來是戒酒的我不敢去勸他湘雲道咱們喝靜酒沒有點興趣要尋個玩意兒呢衆人商議什麼玩意兒才好妙玉道不如飛觴罷飛到誰跟前誰喝酒我只可以茶代之衆人都道好妙玉問飛什麼字呢探春道今兒和林姊姊餞別灞橋折柳是本地風光柳字太易不如飛個橋字兩席上順轉倒轉飛一句兩句詩都使得衆人道好便讓黛玉先起黛玉説了一句何事名為情盡橋橋字飛到寶琴面前寶琴喝了一杯酒道有意思我説一句春水斷橋人不渡橋字數著迎春迎春照樣喝了酒飛了一句朱雀橋邊野草花該李紈喝酒李紈道我飛什麼呢幸喜還記得一句星橋鐵鎖開合該敬林妹妹一杯黛玉喝了酒道這杯酒叫史大妹妹喝了罷天津橋上無人識湘雲舉杯飲幹笑道你們瞧要叫誰喝就是誰第一杯叫琴妹妹喝了雁齒小紅橋寶琴也笑道史大姊姊找我我可不肯饒了你喝幹酒便道你們宣過的倒轉也使得我便説一句看余渡石橋回數到上桌去還敬你一杯湘雲一面喝酒道倒數不算為奇這也不像一句詩別是你謅出來的寶琴道宋之問的詩待入天臺路看余渡石橋你沒有見過倒説人家是諂的湘雲便不和寶琴搭話念了一句人迹板橋霜探春忙喝了酒道安得五彩虹駕天作長橋仍飛到湘雲面前湘雲喝酒道頻逐賣花人過橋香菱姑娘也喝一杯一時香菱喝酒探春遞他個眼色香菱會意笑道解鞍欹枕緑楊橋又數到湘雲湘雲道不好飛來飛去總輪著我喝酒你們打夥兒算計我定要把我灌醉怎麼樣探春道芍藥花正是時候灌醉了你好到青石子上去受用湘雲道別鬧這個人今兒餞行不可無詩咱們不拘休不限韻各人賦詩一首贈瀟湘妃子送別未識衆人以為何如探春道咱們這會兒很有興致雲丫頭又要鬧起詩來從來餞行詩最沒意趣徒然惹出些離愁別恨我勸雲丫頭別鬧這條子罷寶琴道上年八月十五夜裏林姊姊同史大姊姊兩個人在園子裏聯句後來還是妙師父來續完的這首詩香菱寫來我看過妙師父的詩筆真是躍躍欲仙剛才飛觴已經落寞了他如今説要做詩正好領教妙師父贈別詩怕生悲感咱們須別開生面不落窠臼也不必各做一首除了林姊姊咱們十一個人聯一首五律各人隨意寫一兩句有句先聯衆人聽了都樂從李紈笑道想來也逃不了我不如也像鳳丫頭蘆雪亭賞雪起了一句讓你們去鏖戰罷説著便提起筆來寫了一句衆人看道這一句便起得籠罩一切隨後挨次聯吟不假思索湘雲又搶聯了兩句妙玉忙將詩稿從頭看了一遍道很好我來收結了罷説著便提筆接連寫了三句把一幅詩箋送至黛玉面前黛玉朗吟一遍文園諸姊妹宮栽問字過芳鄰疑晰坊間史香菱詞驚席上賓分題思月夕探春醵飲憶花辰忽聽陽關曲岫煙旋飛灞岸塵載興辭曉夢迎春自出遠周親笛譜梅落花李紋杯傾竹葉醇萍蹤期後會惜春香篆悟前因我笑常為客寶琴君如乞此身長亭離思遠湘雲潭水別情真草四橋邊月李綺三千里外人幕雲重樹隔湘雲芳草一年新誰問東風去江南好報春妙玉念畢極口稱讚道真不落窠臼掃除傷離痛別陳言既承雅愛我當不壁珠玉在前步韻一首以志別忱説罷握筆直書和就送與妙玉觀看衆人都爭著來念道館我瀟湘院琅環許結鄰習嫻鸚喚婢伴久鶴留賓夢轂三千里鄉心十二辰早思尋泛宅才得動征塵檢篋光陰促開樽笑語親驪歌聲欲壯清酒味加醇病舍多愁故情蠲未了因青衣休戀主緑綺自隨身別苦懷宜遣魂消句未真看山雲外路渡水畫中人姊妹情如舊年華物轉新南枝傳信早好寄隴頭春衆人念罷互相讚美寶琴道病舍多愁這兩句煉字警新含蘊無窮意味探春道下一聯青衣休戀主緑綺自隨身林姊姊此番辭別起身光景躍躍紙背矣李紋道看山雲外路渡水畫中人真是王摩詰之詩詩中有畫湘雲笑道林丫頭這場病過來不但一言一動迥乎各別你們瞧他做的詩也不是先前的一派傷感頽喪口氣詩以道性情一點不錯李紈道你和琴妹妹為客乞身兩句亦可頡頏病舍情蠲一聯惜春道你們看不出妙師父淡淡這一收大有意旨可味衆人議論一番老婆子們輪流上菜葷素並陳又暢飲一會無不盡興席散盥手送茶黛玉道明兒是我答席一個人也不許短少住在園裏頭的人不用説了就是琴妹妹和香菱姑娘憑家裏怎麼忙總要屈留一天估量姨媽也決不見怪的李紈道林妹妹既然多情咱姊妹們再敘一天於是衆人都替黛玉相留寶琴香菱香菱本想住下寶琴亦情不可卻勉強應允李紈就打發老婆子去知會薛姨媽説琴姑娘們不回去的話妙玉告辭先行黛玉諄訂明日之約李紈們又暢談了一會各自起身岫煙向寶琴道林姊姊這裏住不下不如到我屋子裏歇罷湘雲拍手笑道顯見得你們兩個比旁人不一樣咱們偏要拉住他在這裏岫煙頓時臉泛紅雲黛玉忙和湘雲道邢大姊姊是擱不住你頑的別再多説了一面又向岫煙道橫豎我這裏也便易琴妹妹就和香菱住著不必又去嚕嗦了説著向衆人道謝畢各自回去黛玉送出門外回進屋裏已是掌燈時分便叫人吩咐柳家的明兒照樣端整兩席該多少錢這裏給他話未完見小紅來説道奶奶因姑娘要緊起身已替姑娘擇定了大後兒是長行吉日回過老太太太太的了黛玉道我這裏已收拾停當專等你奶奶信兒你回去先給我請安見面再謝小紅答應回去黛玉便命雪雁叫家裏來的兩個女人來和他説明了起程日期仍與湘雲寶琴香菱四個人敘話家常香菱又與黛玉講論些詩詞談至更深黛玉等他們睡後又去看了紫鵑知他病體將次就痊飲食漸增睡覺亦頗安穩心中甚喜回房安歇無話次日早起各人梳洗回畢紫鵑過來先與寶琴湘雲請安和香菱問好因紫鵑病後才第一天過黛玉這邊又與黛玉磕頭謝賞黛玉把他攙起道你才病好該在屋子裏多養幾天這會兒跑到這裏來做什麼紫鵑道盡在屋子裏躺著也悶得很昨兒聽見姑娘們喝酒好高興就想出來瞧瞧今兒定要掙扎著走幾步我病是算好的了就是兩腿還軟軟的湘雲道你為什麼不坐著説話呢黛玉指著道就在這小杌子坐著罷紫鵑笑道我知道史大姑娘和琴姑娘在這裏先過來請請安還要回去吃丸藥呢説著轉身就走但見他幌了幾幌連忙把手扶著紗窗槅子站住黛玉道到底病後身子還虛忙叫小丫頭把紫鵑扶了過去這裏又敘興一天至晚各散寶琴同香菱定要回去黛玉知道款留不住只得起身互相拜別寶琴道姊姊起身時我和香菱不過來候送了望姊姊恕罪黛玉道媽媽那裏我竟遵命不過去辭行了妹妹替我多多致意謝罪此時香菱倒覺依依難舍眼淚汪汪的説道我借姑娘這幾册子書還沒看完姑娘要帶回去明兒叫人送來罷黛玉道你愛看儘管留著這些東西我也可有可無的了湘雲笑道橫豎林姑娘明年就要來的到明年你再還他罷香菱不知湘雲是隨口哄他的話便歡喜道那麼著很好姑娘明年再多帶幾册子來借給我看香菱站著還要説話寶琴催走大家送出門外李紈等都説我們也走了省得林妹妹又送一趟客於是分路而行各自回去書無可敘再説黛玉回至房中一面和湘雲敘話心頭想起一件事來叫老婆子到稻香村大奶奶處借一把戥子因黛玉在此多年從無自己使用銀兩之處故瀟湘館中並無此物湘雲笑問這會兒要這件東西來幹什麼不知黛玉借戥子有何用處且看下回分解
