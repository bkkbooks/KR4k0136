body:
  text: 第三十五回慶蒲觴芳洲觀競渡開壽筵舞榭發悲歌話説黛玉叫紫鵑到趙周二姨娘處請看龍舟紫鵑去不多時回來黛玉問他們説什麼話紫鵑道我先到趙姨娘那裏説了趙姨娘歡喜得什麼樣似的道你姑娘賞臉不拘打發一個小丫頭老婆子來叫一聲就是了怎麼又勞動你來他又説早聽見今年園子裏有龍船很想過去瞧瞧怕老太太太太見了憎厭還怕三姑娘説話怪沒意思的如今你姑娘有咱們這些人在眼裏真真當不起明兒定要去瞧的見面再謝你姑娘隨即又到周姨娘那邊他也説來的回來碰見三姑娘問我那裏來我就説姑娘叫我去請趙姨奶奶明兒看龍舟三姑娘並沒言語就走了黛玉點頭暗想探春為人諸凡可敬就只在名分上頭太看得認真豈不思屬毛離裏顧公義而廢私恩也使不得他非不明白這個理蓋過猶不及耳底下須得陶熔他一番不説黛玉心頭暗自議論講到次日早飯後邢王二夫人並尤氏都聚在賈母處同進園來史湘雲一班姊妹也陸續來到李紈鳳姐兩個先在沁芳亭指點安設坐位鋪墊並茶几茗具一切伺候需用物件黛玉同薛姨媽徑往沁芳亭來與賈母衆人相見坐在一處看那龍船已從紫菱洲那邊一隻一隻的鳴鑼蕩槳的開放出來按青黃赤白黑共有五隻先是黃龍次青龍銜尾而上龍頭龍尾並周身鱗甲裝的玲瓏活潑彩色鮮明黃龍船上旗幟招展兩旁共一十六個駕娘並船頭上站的龍宮太子一色穿的黃衣青赤白黑四號各分顔色駕娘們手攜劃槳在水面上掀波逐浪盤旋飛舞各獻技能賈母看得樂意便叫放賞鳳姐早已預備小船貼岸停著一聲吩咐每船賞錢二十千文船上衆人磕頭謝賞駕娘們因賈母與衆人都在沁芳亭過去了又折轉來幾回盤繞以供賞玩足足鬧了一個多時候龍舟過去了才見水台閣過來底下都把木頭扎成筏子用石墜下沈離水面一尺餘並不露出木筏上面用五彩絲綢結成樹木亭台照依所扮故事位置得宜如扮的八仙過海水漫金山都選十四五歲的清秀女孩子下用精巧鋼條貫串或站在漁鼓簡板上的或立在棕籃荷葉上的白蛇小青站在漁蝦背上者法海和尚鬥法真像懸空在水面挂取河水從山上潑下白茫茫一片宛然自下漫起一座過去又接著一座扮的台閣十二座制勝出奇各盡其妙賈母薛姨媽皆讚美不絶寶玉看得高興便要下船去隨著遊玩黛玉道這要坐在岸上看他們從水裏過去由近而遠才看得齊全你下了船不過看見前後兩處餘外的都瞧不見了有何趣味呢寶玉總不肯聽一個人走到蓼漵邊下船上了一座台閣扮的是劉晨阮肇入天臺見一派仙景白石青苔琪花瑤草橋畔一灣流水即是活波便叫扮阮肇的女子脫下衣服與自己穿了扮作阮肇去訪仙女真是心曠神怡先從沁芳亭岸邊經過向湘雲衆姊妹笑著招手賈母眯齊了眼看不清楚問道這向你們招手的是誰鳳姐笑道老祖宗認不清是寶兄弟在那裏淘氣呢賈母道那可不是玩的快叫他起來罷鳳姐道請老祖宗放心這個地方還穩當由他高興玩罷湘雲笑道二哥哥上年到了大荒山如今又想入天臺了仙子已在這裏還要去訪誰呢黛玉瞅了湘雲道偏是你會説話一面湘雲同黛玉取笑賈母向薛姨媽道咱們坐了一會也該到別處去散散怕要吃午飯的時候了鳳姐接口道今兒的酒席就擺在綴景閣底下請老祖宗同姨媽太太姑娘們到那邊去坐罷這裏賈母一衆人起身自到綴景閣去再講寶玉一路沿堤順水蕩來見岸上那些老婆子丫頭們攢三聚四的都在緑樹陰濃之處坐著的也有蹲著的過去又見趙姨娘周姨娘帶著丫頭們另在傍水涼亭裏坐著觀看將近藕香榭望見一群紅粉輕搖紈扇坐著説笑漸漸近來乃是邢岫煙晴雯紫鵑這幾個人原來紫鵑知道沁芳亭有姨太太在那裏所以同著晴雯去邀了邢大姑娘悄悄的到此瞧熱鬧先是晴雯認出寶玉來了便指手點戳的與邢岫煙説話寶玉看見他們也就笑笑過去由蘿港之下盤旋而出到了蘅蕪苑前回想起數年以來每逢端節總有寶叉在一堆兒聚樂今年有此龍舟勝會舊時衆姊妹都在獨不見了寶叉不禁觸景傷懷興致索然便換了衣服坐小船攏岸上了雲步石梯轉出蘅蕪苑緩步行來正遇見琥珀道老太太同太太姑娘們都在綴錦閣過午等你去喝雄黃酒呢又瞧著寶玉身上笑道這會兒倒換了衣服了為什麼不照前扮的故事去給老太太大家瞧瞧呢寶玉也不言語便隨了琥珀到綴錦閣坐下一同慶賞端陽賈母説起今兒裝的台閣龍舟很有意思既然費了許多工夫置造出來咱們再玩兩天也好薛姨媽道他們竭誠想出來應景的玩意兒孝敬老太太自然老太太該多樂兩天我家裏還有些事情走出來好幾天了可先要回去叫香菱在這裏多住一兩天罷賈母笑道姨太太既然來了那可由不得姨太太做主呢薛姨媽正要推辭黛玉介面道老太太留媽媽做女兒的有句話這會兒也就告訴了媽媽不是媽媽的生日已經過的了沒有盡女兒一點孝心如今媽媽聽了老太太的話住在這裏再看兩天龍船接著補祝媽媽壽辰就是園子裏這一班姊妹兩位嫂子同珍大嫂子拜夀吃面外頭叫一班好戲打夥兒熱鬧一天話未説完鳳姐介面道唉呀呀不是林妹妹提起連姨媽的生日我們都混忘了到底是幹女兒的孝心誠記得清楚呢賈母笑道姨太太可再沒的説了幹女兒孝敬乾媽慶壽唱戲不用派咱們的公分落得吃喝聽戲那有這樣相應的事姨太太再不賞臉不是心疼幹女兒花錢就不肯叫白便宜了咱們説得在座衆人都笑起來大家順著賈母的話留薛姨媽薛姨媽道一來家裏有事二則蟠兒還不知怎麼樣看了這個不賢慧的媳婦老太太想有什麼好心緒到老太太這裏高興做起生日來也被人家笑話我領姑娘的情就是了黛玉道本該到媽媽家去慶祝才是正理因姨媽那裏諸色不大便易咱們姊妹都去了倒纍姨媽張羅費事所以想個權宜之法不如在這裏辦了總是一個樣兒的媽媽既然撩不下家裏的事看罷龍舟回去到那一天再請媽媽過來就是了説著各席上又點景用了幾杯蒲酒飯畢盥手送茶等賈母起身各自散去薛姨媽回至瀟湘館黛玉又肫肫訂邀薛姨媽順口含糊應許次日又陪賈母坐船玩了一天至晚決意要回衆人不能挽留第三日賈母衆人又到藕香榭坐落玩賞是日黛玉便叫人去請了邢岫煙同著看了一天臺閣又打聽趙周二姨娘連日都到他兩個十分感謝黛玉為人細心周到講到黛玉要與薛姨媽慶壽寶玉知道喜之不勝對黛玉道你認姨媽做乾媽這件事辦得很好可憐姨媽如今眼前沒個親人也苦了咱們這一番舉動聽見旁人都誇你呢黛玉道我那裏管旁人的議論不過各人盡各人的心罷了姨媽向來待我也好我是沒娘叫的姨媽如今也是沒女孩兒世上四種窮民內無父曰孤無子曰獨卻不提及無母無女之人想失恃與失怙無異無女與無子一般可由孤獨類推況我雙親俱喪姨媽痛失掌珠有子若無兩相依傍彼此有情兼可把你棄家披剃一節借為補蓋我心始安你也以為然可見咱們兩個人的設心並非有己無人總要由忠而恕如今也不必講這些了且商量與姨媽做生日的事在園子裏那一個地方唱戲好呢寶玉道你不聽見姨媽的口氣怕未必過來黛玉道咱們只管排場起來到那一天多走幾個人去拉也拉他老人家過來了寶玉道園子裏就是綴景閣同嘉蔭堂兩處寬展我想綴景閣還不如嘉蔭堂好現在天氣熱了嘉蔭堂前靠山腰這二十來株大樹遮得陰陰的又看那流出來的一股泉水清心爽目北靜王府裏上年新弄一班戲腳色也多行頭也全比咱們家裏的戲好老太太同姨媽都愛看熱鬧戲瞧了一定喜歡我去要了來就在嘉蔭堂翻軒外寬寬闊闊搭一座臺子本來無外客可請就是咱們家裏這幾個人聽戲當下説定了黛玉叫人去關照鳳姐那邊鳳姐早已預備與薛姨媽慶壽的事專等黛玉這裏定了地方便吩咐林之孝家的傳老婆子們把應該添設的燈彩鋪墊都挪到嘉蔭堂去一齊動手搭台寶玉親自去指點道戲班裏腳色有一百多人臺子小了擠不下又叫人去開了綴景閣要擡新置的十二扇圍屏鳳姐知道忙來對寶玉道前年老太太生日甄家送的一架大屏是大紅緞子刻絲滿床笏一面泥金百壽圖論起價錢來雖然不及這一架正是配做生日擺的老太太説要送人還沒送出去不如搬那一架去擺好寶玉不聽定要擡他買的那一架鳳姐也就由他當時擡了過去諸色安設停當黛玉上一天就約定了人天明起來梳妝已畢知道寶琴上一天已過去了便同湘雲迎探惜紋綺李紈鳳姐玉釧喜鸞四姐連平兒晴雯紫鵑也高興跟在裏頭帶了一群丫頭老婆子寶玉見了花枝招展這一班人真是群玉山頭瑤台月下便要同去黛玉道等我們過去了你隨後來也使得跟著我們像什麼樣呢媽媽橫豎就要過來的快去換了衣服在這裏等著拜夀也是一樣的鳳姐笑道你要同我們去也該把衣服早換上了你瞧這個樣兒不像伺候寶二奶奶的小子嗎衆人聽了都笑起來寶玉連忙回去找麝月要衣服更換這裏衆人走園子裏便門擁到薛姨媽家裏挨次拜了壽略坐一會便拉姨媽過這邊來吃面聽戲薛姨媽情不可卻便同寶琴香菱隨著衆人過來剛進園門早有丫頭們迎上去道老太太太太都在嘉蔭堂候姨太太呢薛姨媽便徑至嘉蔭堂賈母先迎出來與薛姨媽道喜薛姨媽回讓了賈母接著邢夫人尤氏也到了同王夫人都與薛姨媽道喜拜夀大家遜讓了一會隨後寶玉上前跪下磕了四個頭薛姨媽忙把他拉起賈母便與薛姨媽讓坐各依次坐下見中間供設西池王母兩旁燭臺上點起壽同山嶽永福共海天長的描金大蠟燭文王鼎內焚燒西域進貢的麟瑞名香上面擺開瑪瑙翡翠綴嵌的漢宮春曉圖圍屏耀目爭輝果然是富貴氣象賈母笑道今兒王母娘娘可被衆仙女拉下瑤池來了薛姨媽遜謝道老太太才算得一尊無量壽佛托老太太的福要趕上老太太的歲數還差一半呢承老太太擡愛就是姑娘高興何必這麼樣費心我也不配呢鳳姐道姨媽説老太太是無量壽佛今兒可算得個群仙會請了佛菩薩來陪王母娘娘林妹妹向來人家都稱他是瀟湘仙子今日老王母下了凡須得這位仙子那裏去采一枚仙桃來獻獻才好呢説著戲文已開了場先唱八仙慶壽臺上站了八十多個人都是繡蟒彩衣舞袖蹁躚歌喉宛轉第一出沖場戲已看得賈母樂了接著坐席吃面共擺六席因是外面來的班子翻軒底下滿挂蝦須簾子寶玉走出簾外被領班的蔣琪官看見便到戲房裏叫齊了二十四個小旦都是十五六的年紀生來似粉團玉琢一般在簾子外齊齊站著與寶玉打千請安寶玉在北靜王府裏都見過認識的便笑著同他們説了幾句話叫人取了二十五副寧綢袍褂來連蔣琪官各人賞了一副當下有兩個年紀最小的托了戲目上來點戲在簾子外站住林之孝家的接了戲目進來送到薛姨媽面前點戲薛姨媽與賈母互讓大家商量點了正本火雲洞這本戲文本來熱鬧內中又多添了些彩玩神出鬼沒果然好看引得文官這些孩子同了十二個女清音都來看戲鳳姐見賈母不住的喝彩便悄悄問了黛玉吩咐放賞林之孝家的叫了二十名小廝用炕桌擡了十桌子共二百串滿錢賞了他們賈母見簾子外站著藕官蕊官便叫他們進來道今兒不叫你們唱戲倒在這裏玩耍瞧唱的戲好不好藕官笑道他們的戲不過仗著人手多行頭齊全講到唱起戲來也唱得過他們鳳姐道老祖宗聽藕官的話好不可惡饒由他們在這裏瞧了現成的戲還要誇嘴論起理來今兒他們也該來孝敬姨太太兩出戲的賈母道咱們瞧了這半天熱鬧再叫他們來唱一兩出清戲瞧瞧也好鳳姐聽了賈母的話趕忙叫林之孝家的來吩咐了一面薛姨媽道老太太坐了半天也乏了該請歇歇去賈母道今兒姨太太的大慶我很高興不覺得乏呢咱們到後院子外邊走走再來瞧他們的戲説著鴛鴦琥珀扶了賈母衆人都隨著散步一會仍走後院子回到嘉蔭堂梨香院的戲班早來伺候點戲賈母道今兒有外頭的班子瞧你們只揀好的戲唱別丟臉蕊官便指藕官道王十朋祭江是他的拿手戲唱得好薛姨媽聽了便叫藕官唱祭江藕官下去扮了王十朋上場唱了第一支一從科第鳳鸞飛抑揚頓挫意致纏綿出場便好原來錢玉蓮一腳向來是小旦藥官扮的他們兩個人戲場上的夫妻以假作真十分親熱藥官死後藕官猶忘不了他時時追念前情偷向沒人處掉淚從前芳官還把他的心事告訴過寶玉今點了這戲便借戲中關目發泄自己私情曲曲摹神竟忘了是唱戲倒像場上的身子就是王十朋了哭得來哀猿斷腸鐵人下淚看戲的人個個傷心連王府戲班裏都圍著要看無不叫絶寶玉在座其觸目傷懷之處自不必説又見薛姨媽拿著手帕子不住的拭淚寶玉坐不住了便站起身來往簾子外一走拉住林之孝家的問道今兒姨太太的壽辰要取個吉慶誰點這些戲你瞧鬧得滿屋子裏的人都是淌淚抹眼的像個什麼樣兒林家的道因是藕官的拿手戲姨太太叫他唱的呢寶玉聽是薛姨媽所點便沒言語轉身走到王府班戲房裏蔣琪官拉住寶玉的手悄問二爺給我察聽的事可怎麼樣了寶玉道還沒訪問出來你別性急總在我身上還你個下落就是了又與他説了幾句間話出了戲房轉過嘉蔭堂一路行走盤算蔣琪官之事又因蔣琪官想到襲人心頭納悶回至怡紅院徑進紫鵑屋裏躺在炕上唉聲歎氣那紫鵑同晴雯在嘉蔭堂廓房內看了正本戲完回來正在屋裏換衣服紫鵑問寶玉道為什麼不陪老太太瞧戲也回來了好好的又發什麼的心事呢寶玉道各人有各人的心事紫鵑坐下炕來笑拉著寶玉道有什麼心事和我説寶玉道叫你也摸不著這件事的蹤影對你説也自不中用紫鵑道雖然不中用到底説出來大家知道悶在你一個人肚子裏做什麼呢寶玉道蔣琪官娶襲人這件事你自然知道的了説起來也奇他頭裏還聘定過一個人也是咱們這兩府裏不知那一房出去的因為那一家悔了親才又娶襲人的難得蔣琪官有義氣我已許他訪出頭裏這個人來給他如今竟沒處訪呢紫鵑忍住了笑問道如訪出了這個人二爺還肯把他配蔣琪官不肯呢寶玉道訪了出來為什麼不把他配蔣琪官紫鵑道這個人我倒知道還有處找説著站起身來便拉了晴雯來見寶玉笑道這個人有了快叫他去跟蔣琪官罷寶玉晴雯兩個一時都摸不著頭腦怔怔的四眼互睜晴雯因聽見跟蔣琪官的話便笑罵紫鵑道混咇你的什麼想是你剛才瞧戲倒瞧上了蔣琪官了於是紫鵑細將前事説明又把寶玉的話對晴雯説了晴雯才知紫鵑和他取笑的緣由寶玉亦恍然悔親不肯嫁蔣琪官的就是晴雯還上了一吊才得把親事退成的細情暗歎晴雯貞烈果與襲人不同而蔣玉函兩次定親無心湊合皆系自己房中寵愛之婢又虛名空挂卒歸水月鏡花奇也奇極巧也巧極的了當下經紫鵑一番取笑悶懷頓釋晴雯紫鵑便催寶玉仍到嘉蔭堂去寶玉只得出了怡紅院走到蓼漵一帶欄杆邊就是從前李紋李綺們四個人在那裏釣魚的所在見一個女孩子靠著欄杆手裏拿了半個饅頭一點點摘下來撩在河裏引那魚兒泳遊吞吐玩兒寶玉暗想那女子倒也玩得幽雅清趣走近身旁見他回過臉來眼如秋水含情眉若春山帶蹙見了寶玉微微一笑轉身要走寶玉把他叫住端詳一會道你不是柳五兒嗎那女子點點頭寶玉道為什麼一個人在這裏玩兒五兒道我媽到嘉蔭堂找林大娘回話去叫我站在這裏等他同回去寶玉道嘉蔭堂唱戲為什麼不跟著你媽媽去瞧瞧五兒答道我媽叫我定定的站在這裏不許到別處去亂走呢寶玉道我記起來了有句話要問你未知寶玉記起何事要問五兒且看下回分解
