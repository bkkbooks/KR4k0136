body:
  text: 第二十四回話鄉情愛叨翡翠簪誅盜首飛斬鴛鴦劍話説黛玉登舟送親船隻離了碼頭行到三十裏之外還要遠送林老太太吩咐家人坐了小船分赴各船上阻止便挽了黛玉的手道我為家裏走不脫身不能送你到京底下不知幾時再得見面盼望音信常通稍慰遠念黛玉亦安慰了嬸母幾句話各各垂淚黛玉又把他兄弟摟住親熱了一會林老太太道你兄弟年幼離不開我等他大了幾歲去看姊姊説著就要過船與女眷們一路同回黛玉含淚送出艙外被嬸母攔住只得止步看丫環們扶著太太家人媳婦抱了公子一同過船灑淚而別黛玉回身進艙留心那一盆淚草安設妥當鸚鵡架亦懸挂艙中兩邊上起吊窗裝上玻璃扇觀玩野景岸柳垂絲和風淡蕩正是豔陽天氣淑景怡神行了數日已到清江浦起岸地方因系奉旨完婚進京船隻不怕各閘留難是以徑走水路圖其安逸王府差官急於覆命便要舍舟登陸趕緊進京榮府家人分了幾個隨著差官前站先行那時包勇在船聽見也想起岸因寶玉囑咐不敢離開林府總管向來認識包勇邀他搬到自己船上一同照應渡過黃河行了幾天到山東地界路漸曠野船上無事衆家人媳婦問起紫鵑知道姑娘的生日是二月十二已過去的了那時正值事忙家內無人提及如今在船上間暇無事便派起公分來與黛玉補祝紫鵑告訴了黛玉由著他們各船上知會了該用海菜果品酒面等物伙食船上原來無物不備因醵金慶壽要盡各人的悃忱喚買辦頭帶了幾個人坐著小划船飛風上岸置備酒席上一切應用的東西並請佛馬香燭等件不一時買辦齊全趕上大船交代明白兩府家人都遞手本上船叩喜家人媳婦一齊過黛玉坐船船上供了西池王母南極仙翁點起紅蠟船板上鋪了紅氈與姑娘磕頭便叫那一班小清音過船説這十二個女孩子都是蘇州買來的姑娘還沒有聽過他們的曲子叫來熱鬧一天黛玉見這班女孩子在面前黑鴉鴉的站了一堆年紀統不過十三四歲上下一個唱小生的叫慶齡唱小旦的叫遐齡更覺靈動可愛紫鵑笑指慶齡道姑娘瞧他不像芳官嗎可惜芳官出去了不然到那裏叫他們拜姊妹才好呢當下擺開場面先唱了八仙慶壽就拿腳本送來點曲黛玉點了掃花三醉遊園驚夢唱起來果然歌喉清脆逸韻飛揚這坐船寬大添了許多人並不見挨擠一面吹唱幾號船隻隨幫照常行走黛玉正在靜聽怡情望見玻璃槅扇外波光雲影一時耳目俱清比上年回來時候別有一番光景歡娛日短又早是泊船時候那女孩子還上來點曲黛玉道難為你們唱了一天回船去歇歇罷慶齡遐齡在這裏陪我吃飯那管班女人自領孩子們過了船陸續二十餘號船一排停下這裏河面寬闊兩岸垂楊似系住了一輪落日反照迷離遠近望見村墟裏炊煙起來一時隨風飄滅黛玉想起香菱講的詩句配這一會的晚景真是詩中有畫他説見了詩倒像又到了那個地方我如今到了這個地方觸景又想起他講的詩來了黛玉正在出神媳婦們早已端上酒席各人敬了酒叫慶齡遐齡多敬姑娘幾杯又唱了兩支曲子黛玉問他們住在蘇州那個地方慶齡道我家住在虎阜黛玉道虎阜我也到過呢慶齡問道姑娘為什麼到那裏去黛玉道那一年從京裏回到南邊送老爺的靈樞到蘇州厝在虎阜山背後還記得耽擱了兩天才走的慶齡瞪著眼看了黛玉一會笑道這樣説姑娘我還見過老爺太太的靈樞都厝在山後就是我家看管的到上年遷回揚州安葬我媽媽還説起姑娘的黛玉聽了因是鄉親又念他家裏照看了父母靈柩多年恍惚那年也曾見過那女孩子他年紀還小如今離鄉背井出來因憐生愛便從頭上拔了一根翡翠簪子給了慶齡又叫紫鵑拿兩件金玉插戴分給他兩個紫鵑也給了他們些東西這裏送酒各船上都有席面大家高興猜枚行令點起燈燭照耀輝煌標杆上扯起紅燈只見岸上來了兩個人提了一盞小小燈籠投進一個四頁的大紅手本上寫某路某營守汛兵丁某某等叩賀鴻禧當下賞了他們喜錢汛兵謝賞便説前面一裏多路就是卡房我們自然在這裏支更守夜還要爺們各船上留心一點才好衆人因二十多號船堂堂標著旗號雖然地方僻野還怕什麼都喝得酩酊大醉各自睡了這裏黛玉因慶齡們殷勤多勸了幾杯酒點景用了些飯愛著月色步出艙來見風已轉了四野裏雲頭推起遮得月色朦朧覺身上微涼便回進艙來叫春纖取過清水自己灌溉那盆淚草沈思默默相對忘言紫鵑站在旁邊道姑娘你瞧他發了寶光果然比別的草不同怪不得眼淚叫他淚珠原是珍貴東西可惜姑娘那塊手帕子撩在火盆裏燒了留著他還要變花蝴蝶飛出來呢黛玉微笑啐了一口暗想寶玉是荀令黃涉一流人物不是情到海枯石爛不磨的地步如何能感應草木從小這幾年來他也陪著我淌了無數眼淚點點滴滴都和那些落花片兒拌和了送在埋香冢上當真不知發出怎樣的奇花來呢黛玉想了一會紫鵑因春天夜短便催黛玉安歇再説這夜各船上酒醉熟睡竟鬧出一件意想不到的事來因王熙鳳下江南的時候張華錯認鳳姐作尤家二姐跟了三天鬧了一回被榮府家人喝打開了他心還不死不敢明隨只是暗跟一直跟到揚州打聽得璉二奶奶與林府説媒姻事成了就要送親進京妝奩豐盛頗有資財他本是一個無賴之徒向在京中結識幾個朋友都是鼠竊狗偷也有剪徑為生的今在揚州遇見各道來由便勾通了山東一夥巨盜尾隨林府送親的船走了幾天不敢動手這一天見泊船的地方荒野雖離前面營汛不遠料這四五個汛兵濟得恁事打聽船上的人都因慶壽開筵喝得大醉那為首的兩臂有千斤之力武藝高強敢來覬覦這二十餘號官船的行李時交二鼓以後便齊集數十人坐了划船隼飛蕩槳而來各持器械先撲那有重載的船上首盜飛蹤上船打開艙門這船內正是包勇同林府總管在裏頭也因多飲了幾杯酒睡夢中聽得艙門響動包勇驚醒燈光中見強盜一擁而入一時未備兵器難以空拳架格正在籌思無計才坐起身那為首的提起撲刀砍來包勇閃避自分性命難保只聽颼的一聲見後艙木板上飛下一道白光射到強盜面前那強盜登時跌倒包勇便奪取盜手撲刀格殺衆盜大聲嚷喊驚起本船水手並各船上的人應聲拿賊岸上巡邏的汛兵也拿著撓鈎立在船邊和聲呐喊也有在遠處施放鳥槍嚇賊的賊人見勢頭不好各自逃散受傷的幾個強盜都被捆縛一面點燈照看這盜首已經氣絶身死包勇見林府總管還蒙著頭縮做一團便笑著叫他起來回視挂的鴛鴦劍已出鞘一尺有餘才曉得這道白光所由來包勇重把鴛鴦劍入鞘當下林府管家一齊起來議論報官就把帶傷的幾個人交給汛兵汛兵不敢接手包勇楞著眼道你們平日一天三分三六分六支的皇上家錢糧吃了派你們在這裏守汛不説你們不能擒拿賊盜連這幾個半死不活的人交給你們還要推三阻四你沒有眼珠子瞧著標杆上我們是奉旨進京克期要到那有間工夫在這裏打劫盜官司那汛兵陪笑道大太爺不用生氣不是這話我們武營裏原有捕盜之責拿住了要送有司官衙門裏審辦的這死的死了那幾個帶傷的小心經由著也不怕他跑到那裏去大太爺你沒瞧見來頭我們在岸上看得清來的船不少他們怕拿住的人到堂上供出夥伴來打聽在城裏解的時候截在路上劫奪了去寡不敵衆如何抵擋得住我們這幾個窮兵沒身家有性命委實耽不住求大太爺方便多派幾個人我們跟著把拿住的強盜往縣裏一送等太爺來驗了尸府上的事只消問了幾句話立刻標簽去拿逃犯這案就完結了也沒有多耽擱的工夫衆人聽他説話近理等到天明派了人帶同汛兵解送盜犯一面吩咐衆水手先自開船等他們隨後坐了小船趕上那地方官見拿住盜賊是搶劫榮國府迎親船隻的立刻坐堂訊供把拿住的帶傷夥盜收禁會同營汛到失事地方踏勘驗尸録供令榮府家人自回後來又緝獲了十余人張華亦在其內把上船行劫的幾個人按強盜不分首從律即行正法其餘都問了外遣此是後事表過不提這裏黛玉到辰牌時分才睡醒起來知道昨夜有上盜的事接著衆家人媳婦都過船請安壓驚説起昨夜三更天聽見嚷喊推開吊窗望見姑娘坐的那一號船頭上明明有個穿白衣服的女人手裏像拿著樹枝子這些強盜上船去一個個都打下水來頭裏嚇昏了只説姑娘船上那裏有這一個大膽的女人穿的衣服顔色也不對後來才明白這定是一位菩薩來護佑姑娘的到了京還要替姑娘燒香去呢黛玉聽説知道是白衣大士慈悲感應由平日虔心禮拜所致便道怎麼我夜裏一些兒不聽見什麼響動那媳婦道姑娘睡得夜深了春天困倦好睡倒是沒聽見的好省得耽驚嚇紫鵑道我們也到今兒起來才知道的衆人又陪黛玉講了一會話仍過船去了黛玉因在舟中無事時叫慶齡們過來唱曲消遣一日慶齡唱了一套琴心黛玉想劇本戲曲都被改壞我從前看過的西廂原因詞曲豔麗真可為才子之書讀西廂者須略其事而咀味其詞謂西廂為淫書是不會讀西廂者記得我行令説了一句寶姊姊勸我説閨閣中不宜看此等間書未免有買櫝還珠之見不表黛玉心中思想再講紫鵑不懂文義但覺悠揚入耳可聽高興起來叫遐齡教曲遐齡便與他拍了一套規奴又拍一套掃花紫鵑心靈不到十來天便能上笛黛玉在旁靜聽也順口熟了叫遐齡吹笛自己按板也唱了一套慶齡笑道聽姑娘同紫鵑姑娘比我們唱的好呢於是藉此消間不覺篷窗寂寞那船上受了這番虛驚沿途分外小心催趕水手人等趕緊行程一路閘口先有溜子下去隨到隨放不敢留難一直到了張家灣起旱黛玉坐轎紫鵑等坐兩肩小轎隨身伺候其餘人等同行李分別上了馱轎車輛因一時雇不出許多車子添了一百餘頭騾馱裝運榮府早已得信即忙派了家人媳婦遠遠出來迎接轎子進了公館見房屋已修葺得煥然一新請黛玉在東院花廳套間內住下兩府家人時常往來請安道喜黛玉命紫鵑坐了車進榮國府來先到賈母王夫人處請了安又往李紈鳳姐姑娘們處逐一走到紫鵑不敢停留各處拉拉扯扯問了這件又問那件此時紫鵑一個人倒像在海外出使封王回來似的早飯後進去直至傍晚才得脫身回來便把與各人問答的話約略回了黛玉一遍黛玉便問可見晴雯襲人兩個紫鵑笑道從上頭老太太起一直到底下這些姊妹們拉住我説話的像我出去了幾年回來的光景一天沒有住嘴晴雯襲人都沒見我問晴雯人家説他出去了沒有進來黛玉點點頭又問還見什麼人沒有紫鵑答道聽説寶二爺出門拜同年去了也沒見他黛玉臉泛微紅道誰又問他呢便回過頭去調弄鸚哥這裏並無可記之事書且按下講到賈母聽見黛玉到了比從前黛玉幼時打發人去接的光景更加懸切恨不得立時見面又不便自己出去看他想起湘雲這班小姊妹應該來了便叫琥珀到鳳姐那裏去問問史大姑娘這些人去請過了沒有為什麼還不來琥珀便到鳳姐屋裏只見那幾個管事的媳婦往來不絶回話鳳姐與尤氏兩個人正在忙亂一時林之孝家的來回臨昌伯府裏景鄉侯府裏都來送禮先呈了禮單上去因賈母嫌煩預先吩咐各處送禮的只看咱們先前送去怎樣收受璧還照著行事不必呈與賈母過目就是王夫人也説過不用件件去請示只叫同著珍大嫂子酌量辦理當下鳳姐與尤氏作主該收的收該璧的就璧了接著吳新登家的來回榮禧堂榮慶堂同各處該換的鋪墊桌靠並請客酒席上用的茶酒杯箸器皿各色燈彩都要領出去交給各項管事的人接收登帳鳳姐便叫平兒取出各處鑰匙同吳新登家的引著衆人領取這事沒有發放完畢賴升家的早又等著回皇親郡主王妃福晉太君各位誥命的請酒應該請那幾處等裏頭定了發出單子去帳房裏好照著發帖鳳姐道這倒不用忙那些客氣的女眷總要等寶玉完姻之後再請等查了老太太八十歲生日的請酒單再看這會子送禮簿子上該要添補幾家子就是了你説起請酒倒有一件為難的事還得與太太商量呢説著見琥珀站了好一會便笑著問道我倒忘了你有什麼話嗎琥珀道我瞧著二奶奶正忙呢老太太叫問問這些姑娘們都去請了沒有鳳姐道前兒老太太吩咐了就去請的他們都説今兒來呢話未完只聽得院子裏老婆子們回道大奶奶家兩位姑娘同史大姑娘二姑娘都來了一時進來見禮讓坐鳳姐笑道你們倒像約會了來的説著便指琥珀道你們瞧不是老太太惦記趕著叫他來問呢我也不留你們喝茶了快同他去見老太太罷我這裏再打發人去請四姐喜鸞呢琥珀道我這一趟算跑得有功身還沒轉姑娘們倒都來了説著引了湘雲們一路説笑去見賈母探春惜春也在屋裏大家相見坐定賈母道林丫頭到了大後兒就是寶玉完婚的好日子你們該早些過來大家熱鬧幾天向來和林丫頭都在一搭兒玩慣的林丫頭自然惦記你們該出去瞧瞧他照舊的玩玩笑笑有什麼使不得林丫頭一個人在那裏也怪冷靜呢湘雲道昨兒聽説林姊姊到了就是老祖宗不打發人去叫我們也急的什麼樣似的要來的這會兒就去瞧林姊姊説著見屋子裏沒有岫煙便叫翠縷去拉了邢大姑娘來説姑娘們都在老太太屋裏等著請邢大姑娘換了衣服同去瞧林姑娘呢翠縷去不多時同岫煙來了先與賈母請了安見過衆人便問林妹妹幾時來的在那裏住呢湘雲道我們外邊都知道了你倒不像在裏頭住的人説著便辭了賈母各帶自己的丫頭走出院外鴛鴦叫小丫頭連忙去告訴了鳳姐派幾個媳婦跟著到垂花門上了車徑往黛玉公館裏來到儀門內下車早有林府家人媳婦出來接應引了湘雲岫煙李紋李綺迎春探春惜春一衆人走進黛玉住的院子裏湘雲先開口笑道我們道喜來了黛玉聽見忙起身迎至翻軒下讓進裏邊都與黛玉賀喜問好然後就坐送茶各人先謝了黛玉上年送的土儀又問問南邊的風景路上平安黛玉亦不提及船中遇盜一事探春道林姊姊回南後咱們家裏遭的事可不少想來紫鵑講過姊姊都知道的了可喜的老太太安康咱們姊妹又得相聚老太太自然樂極的了黛玉微微一笑這幾個人裏頭第一個史湘雲與黛玉分外親熱難得別後重逢出於意外可講幾句傾肝剖膽的話只因衆人在座且有寶玉出家寶叉病故這兩節事夾在裏頭措詞終有些關礙難免黛玉多心只好把浮文套語應酬幾句至黛玉此番見了湘雲這班姊妹自然親愛歡喜亦不便流露出來彼此轉覺得生疏了浮談不耐久坐倒是李紋想起上年餞別一事提頭説道咱們如今又該與林姊姊做接風詩了湘雲道接風不如賀新婚的詩好衆人都湊趣道咱們和新婚詩開了場底下重新整頓詩社起來黛玉聽了只是微笑不語大家又敘談一會起身黛玉移步相送衆人阻止紫鵑雪雁送至儀門看上了車才回這裏湘雲一衆人回去仍到賈母屋裏鳳姐同寶玉都在裏頭大家和寶玉道喜賈母問你們怎麼就回來了不和林丫頭多坐一會湘雲道林姊姊家去走了一趟和我們倒像是從來沒有見過的人了也不請老祖宗的安也不給二哥哥問好賈母聽了倒好笑起來湘雲原是取笑寶玉的話大家瞧著寶玉聽湘雲説到黛玉身上竟不來搭問鳳姐忍不住笑道寶兄弟如今為什麼不趕著問林妹妹幾時過來呢寶玉道鳳姊姊虧你還提先前的話來取笑人家我如今可不瘋呢鳳姐聽了寶玉的話會過意來心中一動臉上泛紅只得尋別的話岔了開去賈母道史丫頭你們到園子裏去瞧各人愛住那一個屋子回來都到這裏來吃飯寶玉聽了便跟姊妹們到園子裏來一路説笑道紋妹妹綺妹妹是要到大嫂子屋裏住的二姊姊同史大妹妹住在那裏呢湘雲道怪道你像久不到園子裏來的了我和二姊姊來了那一會不去鬧邢大姊姊呢如今還去鬧他岫煙笑道如今可説得的了我們與林妹妹餞行聯句的事只怕寶兄弟還沒有知道呢寶玉道不要説這些事怕我不知道就是邢大姊姊史大妹妹的面那時候也沒有見做的餞行詩我那裏知道如今可快拿出來給我瞧瞧湘雲道我是要來看你的別怪我探春忙攔住他道別提舊話了如今咱們商量賀新婚詩湘雲道二哥哥高興等我做了給你瞧你也和他兩首寶玉笑道我不愛瞧由你們去鬧罷説著惜春自回蓼風軒李紋姊姊自到稻香村去了寶玉同了湘岫迎探來到紫菱洲寶玉向滿屋子裏瞧了一瞧道窗槅子上的紗也太舊了門簾也沒換我告訴鳳姊姊去叫人來換過邢岫煙道統是好好的換他做什麼探春道史大妹妹同二姊姊不過暫住幾天邢大姊姊也不講究這些這幾時鳳姊姊忙的吃飯工夫也沒有二哥哥倒不必去嚕嗦他寶玉看見桌子上磁瓶裏插著兩朵芍藥花便道芍藥都開了這就是咱們園子裏的嗎岫煙道是妙師父院子裏的寶玉走近桌旁端詳了一會道到底是出家人會培植花兒你看開的這樣精神飽綻姊姊還常到妙師父那裏去走嗎岫煙道他庵裏做三界神仙會昨兒早上還同四妹妹在那裏擾他的素面呢寶玉又與衆人談了一會忽然想著一件事站起身來説再來看你們不知寶玉記起何事要找誰説話且看下回分解紅樓夢補第二部清歸鋤子著
