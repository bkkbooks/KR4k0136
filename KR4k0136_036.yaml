body:
  text: 第三十六回慈姨媽三更夢愛女呆公子一諾恕私情話説寶玉在蓼漵欄杆邊遇見柳五兒記起舊事問道頭裏芳官説你要到咱們屋子裏來我已經應許他的了後來因太太把芳官這些人攆了接著我就害了病鬧出許多不遂心的事來把你也耽擱了如今叫你進來不知你可願意不願意五兒低了頭半晌道有什麼不願意呢就可惜芳官倒出去了寶玉道底下我還要叫芳官進來五兒道還叫他進來唱戲嗎寶玉道不是唱戲他堅心出了家不必定要在水月庵裏叫他進園子來跟著妙師父住在櫳翠庵不比在外頭清靜嗎五兒道我跟著媽去瞧過他見他身上穿的爛布衫子我媽問他道你師兄師弟們已常進裏頭來的你為什麼不進去走走死熬著在這裏他道你們瞧我在這裏受苦我倒樂呢目下的地獄翻轉來便是日後的天堂已經攆出來的人還到裏頭去混什麼如今想起先前的受用倒很沒味兒我聽他對我媽説這番話怕叫他也未必進來呢正説著雪雁來請寶玉寶玉便同雪雁來到嘉蔭堂席已坐定王府戲班又開了場寶玉上前先與薛姨媽敬了酒然後自賈母邢王二夫人尤氏李紈鳳姐各處以次而及隨便入座少停席散湘雲拉了香菱同去黛玉仍留薛姨媽至瀟湘館説起明日宴客之事黛玉道照樣今兒的戲班酒席代媽媽作東不用媽媽費一點心已吩咐他們去辦了薛姨媽感謝不盡説著紫鵑來回管公館的嫂子有話回姑娘黛玉叫他上來呈出太虛宮圖紙回明清虛觀道人説的照這樣起造才合式黛玉看了點點頭那媳婦退出黛玉與薛姨媽敘話至二更後各自就寢次日黛玉起身梳洗畢雪雁説姨太太今兒不知為什麼一早就起來了黛玉忙過去請安見薛姨媽眼圈兒紅紅的便問媽媽不再睡一會兒就起來了薛姨媽道昨兒晚上做了一夢甚是奇怪明明見你寶姊姊站在炕前他説趕不上給我拜夀他也就好回來了林妹妹仍舊住了瀟湘館晴雯紫鵑住了怡紅院沒有人占他的屋子將來還住他的蘅蕪苑打夥兒同在園子裏來去近便些還叫鶯兒等著他不用去跟四姑娘正要問他話他道怕天明快了還要去見他太太呢説著就回身走了我醒來聽聽你屋裏的自鳴鍾已交子正的光景再也睡不著等天明就起來了黛玉道那是媽媽的心記一語未了只聽外邊老婆子們説道太太來了王夫人便到薛姨媽屋裏坐下黛玉問道太太有什麼事早過來了我正要去請安呢王夫人笑道有一件奇事來問姨媽説著便對薛姨媽道昨兒晚上夢見寶丫頭説要回來了還説到園子裏見了媽媽才到我那邊去的妹妹可真夢見他沒有薛姨媽詫異道剛才和姑娘講起果然姊姊也有夢這事奇極了於是便把對黛玉説的話一一告訴了王夫人王夫人道中間的話字字相同就沒提起鶯兒的事還叫我在老太太跟前説一聲他怕天明趕緊要走了我起來心上疑惑所以來問妹妹果然兩夢相同莫非寶丫頭真個要還陽算他死過半年多了肉身已壞那有這件事呢姊妹二人同黛玉談論了一會王夫人因早起未到賈母處請安不敢久坐黛玉也隨至賈母房中講起這話賈母將信將疑半晌道姨太太得了這個夢倒叫他心上越發不定了今兒早些請他去瞧戲散散心罷當下黛玉起身往王夫人處請了安回進園中一路思想此事未必不由姨媽日有所思之故就這鶯兒要跟四姑娘的話姨媽並未知道何以夢中有此一節又與太太夢的一樣委實叫人不得明白大約寶姊姊這樣人夙有根基死後一靈不散來去自由偶然禦風而行晚上到此看看媽媽盡他一點孝心也是應該的你又何必説要回來的話哄騙他老人家呢再者既然到了我屋子裏多年好姊妹何不也來會會在夢裏頭説幾句話莫非怪了我了寶姊姊你若果然怪了我恐蓬萊閬苑容不下你這一個不公道的神仙正在思想只見鶯兒慌慌張張的趕來黛玉問他那裏去鶯兒道太太説我們姑娘要還陽了我想棺柩停在鐵檻寺姑娘還陽轉來在棺木裏喊叫沒人聽見怎麼樣走出來呢我要去瞧瞧聽見有什麼響動就好叫人開棺我到璉二奶奶那裏套車子去黛玉道你也成了一個傻丫頭了你姑娘果然還陽須得的的確確定準了一個日子時辰才好商量這件事如今太太不過在夢裏頭得了一句沒影響的話倒惹你發起呆來你去便怎麼樣呢到底你要鐵檻寺去太太知道沒有呢鶯兒道我沒有告訴太太那裏承望姑娘就能活轉來我去走了一趟看看光景也就死了我這條心了説著掉下淚來黛玉見他可憐便道這也難為你一片熱心不走這一趟想是過不去的回頭便叫跟的老婆子道你同鶯姑娘到璉二奶奶那裏去説我的話叫外頭套一輛車子再派一個有年紀的穩當家人到鐵檻寺你也同了去又對鶯兒道早些回來別去發呆胡鬧説著自回瀟湘館吩咐道姑娘們的早飯擺在嘉蔭堂一時湘雲等衆姊妹都到黛玉處隨了薛姨媽至嘉蔭堂用過早飯賈母王夫人也到了一麵點戲開台黛玉趁寶玉走開便和湘雲們講起薛姨媽與王夫人夢見寶叉一事衆人稱奇湘雲便問二哥哥知道了沒有黛玉道已經瘋了一個鶯兒到鐵檻寺瞧他姑娘去了再對這一個講了不知越發要傻出什麼故事來呢因此衆議紛紛道搜神記如朔方女子趙春幽明録如琅琊王生都是還魂的有的説漢末有人發前漢宮人冢宮女猶活談昔年宮中事了了這都是渺茫的話也有説寧信其有兩夢相同必非無因惟有惜春默無一語湘雲道你們瞧四妹妹只裝聽不見偏是他有些講究不言語一聲兒聽咱們在這裏胡説亂道惜春道將來自然明白湘雲道好一個將來明白咱們想你説句話原是不到將來先要明白若定要將來明白等到三十年五十年寶姊姊還陽不還陽自然知道了但恐將來等得太遲寶姊姊就便還陽咱們這班人又要還陰了呢衆人聽了湘雲的話連惜春都笑起來不説嘉蔭堂敘話講到鶯兒與老婆子同坐了一輛車叫趕車的買了些銀錠紙錢帶在車上老家人將馬幾鞭子趕出了城徑往鐵檻寺下了車鶯兒是前次隨送靈柩來的知道停柩之處一徑進去走近棺旁只見棺蓋上積厚的灰塵連叫幾聲姑娘周圍撫摩個遍棺內寂然全無一點還陽的影響便抽抽噎噎哭個不住老婆子在旁邊化了紙錢便勸住鶯兒的哭催著回去鶯兒還不肯起身又延挨了一會老家人也來催促鶯兒只得叫老家人囑託寺內的和尚叫他們隨時留心到這裏來看看倘聽見棺內有什麼響動立刻進城通信老家人自去依言囑咐了色空鶯兒同老婆子上了車老家人跟著回來嘉蔭堂猶未散席便在瀟湘館等候那邊薛姨媽因不見鶯兒上來伺候便問黛玉黛玉恐被寶玉聽見支吾過去心上記挂鶯兒想起惜春前叫鶯兒且慢去跟他與薛姨媽所述夢中寶叉之言相合今日又聽惜春言語隱約寶叉還陽之説似有幾分可信原來黛玉心中以為寶叉還陽有三樁可喜第一慰了姨媽痛女之心第二夫婦三人可共承歡堂上第三寶叉病故由於寶玉出家我慶團圓不使人留缺陷兩番鏡月重圓先悲後喜豈不是人間難得之事只恐未必是真轉令罔念牽腸癡心難釋又恐鬧得寶玉知道也像鶯兒一樣認真要去開棺胡鬧起來這還了得於是黛玉倒添了一種心事勉強陪著衆人坐在那裏還有什麼心緒瞧戲急欲等鶯兒回來細問鐵檻寺之事不多時散了席薛姨媽定要回去黛玉叫老婆子們掌燈薛姨媽帶了香菱也不回瀟湘館從嘉蔭堂出來徑走便門回家去了這裏黛玉回到自己屋裏悄悄問了鶯兒不禁憮然到底心裏總牽挂這件事隨時探問鐵檻寺有無消息光陰如駛瞬交三伏炎天迎春回了孫家寶琴時來時去湘雲還留住在園李紋李綺亦在稻香村並未回家諸姊妹各自在屋裏看書下棋或隨便做些針黹消遣長日一日午後夕照初斜涼風微至寶玉間步到紫菱洲聽裏邊有人唱曲側耳細聽唱的是花繁穠豔想容顔雲想衣裳光燦新妝誰似可憐飛燕嬌懶這聲音很熟卻不是慶齡遐齡也不像藕官蕊官滿肚猜摸踱了進去想不到唱的竟是晴雯寶玉笑道怪不得時常不見你們在屋裏原來悄默聲兒在這裏樂呢為什麼不早告訴我一聲兒慶齡道史大姑娘也有了兩套寶玉便要湘雲唱一支湘雲道林姊姊同紫鵑姑娘都會唱呢叫你林妹妹先來唱一支我就唱給你聽寶玉道你們玩這個比慪人的彈琴下棋有趣多著呢寶玉因芳官出了家心上未免悵悵難得慶齡貌似芳官心裏頭有了芳官經別人眼裏瞧出來覺像的分外逼真便叫慶齡拍小宴驚變不到兩三天也會了又叫藕官蕊官同慶齡遐齡到怡紅院教身段腳步命慶齡改妝旦腳還逼著晴雯與自己同串晴雯不肯寶玉再三央告他蕊官便把班裏的彩衣翠翹帶來給晴雯扎扮出場黛玉和姊妹們常到怡紅院來瞧熱鬧誰高興也拍一兩支湘雲也想串戲到底為身分拘住寶玉玩出了神連熱都忘了覺此中頗有佳趣並起社一事竟不提及那一天湘雲邀了岫煙到怡紅院一轉不見黛玉便往瀟湘館找他路上遇著探春三個人同到黛玉處問小丫頭們奶奶呢雪雁在裏頭聽見忙迎出來道姑娘在後面佛堂裏湘雲問道供的可是觀音菩薩雪雁笑答道正是湘雲道林姊姊又在那裏稽首慈雲禮世尊了咱們瞧瞧他去一路説笑進來湘雲叫道林姊姊為什麼不瞧他們去晴雯姑娘的戲竟串熟了看他妝扮起來當真有些像楊娘娘呢探春搖頭道不像楊太真還該富泰一點你不記得那一年瞧戲二哥哥説了寶姊姊一句話寶姊姊惱了倏忽間已是好幾年的事了湘雲道正是我瞧他戲目上寫的驚變埋玉叫他們改做埋環才是黛玉道你怕犯了一個玉字嗎這又何必呢一面探春又道今兒瞧見你挂的大士像記起一件事來了林姊姊把你這幅小照拿出來咱們還要瞧瞧説著同到前頭屋子裏坐下黛玉便問雪雁你可記得我這幅行樂圖在第幾號箱子裏要翻騰他出來呢雪雁道前兒同觀音佛像取出來的在這裏呢説著便拿出來湘雲接過展開大家端詳了一會又看到惜春題的詩句正在議論來了寶玉便問你們在這裏瞧什麼湘雲就把這幅照交與寶玉看了笑道也把我畫在上頭林妹妹算是龍女該配一尊善才正説著只見平兒引了小紅柳五兒後面還跟幾個老婆子背著箱子衣包進來衆人都不明白探春笑向平兒道你們這一群人拿了行李包裹倒像投歇店似的做什麼一面小紅五兒與衆人都磕了頭平兒道小紅是先前在寶二爺屋子裏我們奶奶要了去原説挑進人來補還二爺因不把這件事放在心上過了好幾年還沒補上如今挑五兒來補小紅這個缺的黛玉道既是這樣為什麼連小紅也來了平兒笑道小紅的話停會兒再説寶玉道鳳姊姊別因我前兒去要人他頭裏要了小紅去沒有補還我如今賭氣連小紅都還了我可是不要的留五兒在這裏把小紅領了去小紅站在平兒背後聽見寶玉的話忙把平兒衣服拉了一把平兒理會便道那是沒有的事別多心説著便同了小紅五兒進雪雁屋裏見紫鵑也在裏頭便道姑娘們都在外邊我不好説得和你講了停會兒告訴你姑娘一句就是了當下與紫鵑説明緣故平兒轉身小紅又有話求了紫鵑外面黛玉向衆人道我早瞧著五兒是有出息的人也生來幹淨説著便叫一聲五兒五兒連忙走了出來站在黛玉跟前黛玉笑問五兒道我倒盼你進來呢願意住在這裏伺候我還願意伺候二爺五兒微微一笑道奶奶的話在這裏服事奶奶一般就是伺候爺有什麼分別呢黛玉一時倒無言可答湘雲介面道五兒你還不知道這裏瀟湘館是你奶奶住的你二爺住的又不在這裏瀟湘館一處怪不得你奶奶在這裏誇你我聽你答對奶奶這兩句話再沒那麼説的好竟把你奶奶對住了一面向黛玉道這也不必問五兒自然二爺知道你歡喜他仰體奶奶的意思叫上來伺候的大家聽了一笑不覺笑的黛玉臉也紅了紫鵑在旁也笑道當真五兒與姑娘有緣也沒有進來的時候倒先已伺候過姑娘的了探春道紫鵑姑娘的話不知説到那裏去了怎麼人沒進來就伺候你姑娘呢紫鵑道我告訴姑娘聽先前我姑娘叫廚房里弄長弄短熬這個煮那個柳嫂子嫌廚房裏醃臢都拿回家去叫五兒做的不是早伺候姑娘的嗎湘雲道這麼説起來五兒倒有先見之明早早巴結上奶奶了寶玉一面聽一面自看這幅行樂圖不肯釋手湘雲又過來瞧著黛玉道給你寫照這個人如今可還在揚州他肯進京來剛是咱們園子裏頭的人畫起來也得畫一兩年呢寶玉聽了歡喜一時就要請他進京黛玉道你別高興這個人就住在咱們園子裏頭也不肯畫你的照湘雲問道這個人有多大年紀了黛玉道年紀不過二十多歲説起這個人叫人起敬他男人本是個窮秀才專靠他筆上生涯資助家中薪水後來他男人亡故上有孀姑下遺幼子仰事俯育之責都在他一個人身上總在揚州一帶官宦富商家裏畫女眷們的行樂若要他與男子寫照不論許他多少謝金他總不肯動筆湘雲聽了黛玉的話便道二哥哥果然要畫咱們想法兒把你女扮了混在咱們姊妹隊裏他就瞧得出來嗎哄也哄他畫了黛玉道真是你們哥哥妹妹還怕你二哥哥耍不到家代他想出這些刁鑽古怪的想頭來玩呢探春道當真去請了他來把園子裏的人都寫一寫各人愛布什麼景由他自己打稿兒林姊姊再畫過一幅湘雲道林姊姊愛竹子該畫一幅幽篁滌暑圖再不然畫一幅葬花圖也對景兒寶玉道葬花圖果然別致但這一個葬字未免頽喪不如把葬花改作掃花更好探春道我要畫蕉窗玩月圖湘雲道我畫什麼好呢一時倒想不起來黛玉道你畫一幅醉眠芍藥圖極妙的了探春又問道這個人到底肯來不肯來呢黛玉道有什麼不肯他想同我進京為的是要拉了他婆婆同來他婆婆病了沒有起身過了年打發人去接他就來他倒是妙師父一個知己那一種清潔自愛的脾氣竟像妙師父卻也有不同之處寶玉道説起妙師父我又記起一件事來便對邢岫煙道過幾天怕就要動工了姊姊多早晚到妙師父那裏去就煩姊姊轉致一聲岫煙笑道動工有十來天了寶兄弟還不知道嗎這幾天我也沒去走動妙師父昨兒打發老婆子來叫我從稻香村盤轉走他東首後邊小角門沒有人瞧見的寶玉聽了便起身道我瞧瞧去當下離了瀟湘館一路由樹陰遮處望櫳翠庵來只聽蟬噪夕陽與溪澗中涓涓流水之聲不覺心神怡曠暑溽頓消手拿芭蕉扇單穿了一件熟羅長衫撒了褲腳管穿著網線涼鞋慢慢的一步一步到了做工的地方見四面都圍著藍布帽子但聞登登削鑿之聲但不見一個人影兒寶玉挨入帳慢見焙茗在一塊青石子上鋪了馬褥子坐著看那些匠人手忙腳亂的做工見寶玉進去忙站起來先回了工程上幾句話一手在靴統裏拿出一封書子遞與寶玉道候了二爺好幾天再沒見面我媽倒天天擺弄花兒草兒他老人家膽子小守著規矩不敢亂遞東西今兒難得爺到這裏來當面交明瞭更好這是花自芳給我送二爺的寶玉接過想書子上總有提起襲人的話拆開看道沐恩賤妾花襲人叩請二爺恩主萬福金安妾蒙豢養多年恩深如海上年恩主看破紅塵忽然走失寄回發衣作證並無還鄉之意妾遵太太奶奶之命出府改嫁蔣門拜完花燭尚未同房將妾送回今聞榮歸自恨琵琶再抱潑水難收氣苦成疾一命懨懨今生料無見面之日來世投生犬馬再圖報效呈稟不勝依戀惶愧之至寶玉看罷皺眉道好不通的書子不知叫誰寫的焙茗道聽見説花自芳倒能寫寫怕就是他自己寫的罷寶玉道果然花自芳寫的倒很虧他説著把書子撕碎叫焙茗取火來燒了無心觀看工作也不囑咐焙茗一句話轉身就走心想這件事林妹妹如今倒不計論這些先前的事都撩開的了沒有什麼作難就是晴雯難説話也怨不得他頭裏實在受了委曲如今要叫襲人進來擱不住這一個冷一句熱一句的把他排楦個難受不是拉他到活路上來竟叫他進來送死了一路思想回到怡紅院心裏發了躁滿頭是汗珠子連羅衫羅褲汗透的如雨淋一般紫鵑連忙叫小丫頭子提了水來服侍寶玉洗了澡換下衫褲因剛才在瀟湘館歡歡喜喜出去的忽然這個樣兒回來不知是什麼緣故當下黛玉處打發小丫頭來請吃飯寶玉便問紫鵑你們吃了沒有紫鵑道晴雯是在老太太屋裏看抹牌牌局散了璉二奶奶因璉二爺不在家拉了他去不回來吃飯的了就是我一個人還沒叫他們擺飯呢寶玉便叫小丫頭子回去説請奶奶自己用飯我就在這裏吃了一時便傳擺飯寶玉點景兒吃了些問紫鵑道平姑娘送了五兒小紅過來那五兒是我指名要的璉二奶奶把小紅也送了來他和你説什麼沒有紫鵑笑道講起小紅這一件事就有兩三件事牽扯在裏頭呢寶玉問有些什麼事牽扯紫鵑把寶玉拉到自己屋裏坐下悄悄説道你前兒叫林大娘留心有大丫頭打發出去要賞給蔣琪官璉二奶奶正想打發小紅出去一聽了咱們這裏的話璉二奶奶道小紅本和二爺要去的如今送到這裏來憑二爺作主去賞人寶玉道既然是這個緣故咱們就把小紅賞了蔣琪官他們兩口子很配得上呢紫鵑搖手道你聽下去還有緣故不是剛才你見咱們同在雪雁屋裏説話嗎小紅等平兒走了他再三央我求你不要把他賞別人他是死活要去跟西廊下五奶奶家藝哥兒的寶玉笑道他多早晚與藝兒有這些鈎兒麻藤的事紫鵑道他也不瞞我説是好幾年前的事了他在園子裏掉了一塊手帕子被藝哥兒拾去因此兩個人就有了心小紅説在璉二奶奶那裏從沒敢告訴過一個人守到如今好容易把他送了回來要求你開恩遂了他的心願寶玉聽了紫鵑的話不但不肯跟究私情密約而且歡喜成就了他們各人願意的姻緣便滿口應許紫鵑忙去覆了小紅又把細情回明黛玉小紅十分感激他本是林之孝的女兒聽説鳳姐忽然退還小紅叫賞給蔣琪官林之孝家的心裏很有些不願後來知道要給賈藝喜出望外也來謝了寶玉寶玉叫小紅不必回家一面打發人去對五奶奶説了擇定吉日就坐了裏頭的轎車送到西廊下五房裏這裏賈藝正領了二十萬銀子開張當鋪手頭寬裕房屋器具早已置備一新小紅過去甚得其所而且名為側室藝哥並不再娶與正配無異完結了一段手帕姻緣寶玉另與蔣琪官留心仍是榮府裏的丫頭賞了他一個又賞了一千兩銀子此是後話表過不提講到寶玉為了花襲人悶悶不樂黛玉與紫鵑都猜不透他的心事盤問晴雯亦無頭緒適值這一天有一個管園門的老婆子拿了一個衣包送在雪雁手裏説二爺叫他送來的雪雁不知來由拿進黛玉屋裏偶被紫鵑看見問是什麼東西雪雁告訴了管園門老婆子的話紫鵑打開包袱見是一件半舊的女襖子便送與黛玉看道二爺的心事有些蹤影了一面把老婆子送來的緣由回明黛玉黛玉沈思半晌道這件襖子別無來路也不犯著為他發心事除非是襲人的衣服紫鵑道叫那送衣服的老婆子來問他就明白了黛玉道且不用去叫老婆子先叫晴雯來給他看看果然是襲人的東西晴雯或者認識也不定説著即叫小丫頭子去找晴姑娘來瞧一件好東西不知這件衣服究系何人之物老婆子在何處拿來晴雯看了是否認識下回自有分解
