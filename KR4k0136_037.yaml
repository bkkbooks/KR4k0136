body:
  text: 第三十七回送舊衣嗔查紅綾襖證回生録寄柳絮詞話説黛玉叫小丫頭去找晴雯來認老婆子送來的衣服不多時晴雯到來掀簾走進笑道姑娘得了什麼好東西叫我來瞧黛玉道二爺的心事怪道咱們大家猜不透如今倒尋出些蹤影來了你瞧這件衣服可認得是誰的晴雯接過一看脫口嚷出來道這是我的襖子那裏來的黛玉聽説是晴雯的衣服一時倒弄得糊塗了便問道既是你的衣服老婆子在那裏拿來的呢這裏頭的緣故又奇了那晴雯一時嘴快説破了及被黛玉問住回想從前私情不覺臉上一紅露出羞澀的光景黛玉察言觀色知其中又有別情便逼住了晴雯問他道這又有什麼説不得的事晴雯暗想這件事亦不必在黛玉跟前隱瞞便講明寶玉出去看他的病穿了衣服回來留作死生永訣的情由如今問起這件衣服總無下落忽然送到這裏來自何處反尋根到底的追問起來紫鵑説明緣故晴雯立刻打發人去叫了送衣服的老婆子來查問説是二爺叫他到襲人處家裏去拿來的晴雯火冒沖煙不顧黛玉在跟前便罵道這不要臉的東西把我的衣服藏在他家裏算什麼賭氣要撕那件衣服紫鵑連忙趕過奪住晴雯沒處出氣便移怒在老婆子身上道頭裏就為你們遞東遞西鬧到姑娘們房裏也抄檢了把我們都攆出去如今還不守規矩這樣混鬧起來還了得奶奶發他外邊去打了四十再講那老婆子只管磕頭求饒説是二爺叫去拿進來饒過這一次以後再不敢了黛玉便叫老婆子起來吩咐道若講二爺的差使自有二門外小廝承辦或者二爺要送二姑娘史大姑娘的東西打發小子去不便就近叫你們走園子後門出去也是正經再要到別處地方去走動就是二爺吩咐也得進來回一聲叫咱們知道老婆子聽一句應一聲是黛玉又道還要問你襲人家去是二爺同去的還是你一個人去的老婆子道二爺沒有同去叫我去見了花大姑娘他把衣服給我説是二爺叫拿回去交給雪雁姑娘的花大姑娘還病著躺在炕上呢晴雯道竟叫他一聲蔣奶奶就是了什麼花大姑娘葉大姑娘黛玉道明白了想是二爺到那裏走了一趟來的那老婆子還站在門外發戰紫鵑道還不謝了奶奶等什麼老婆子聽了忙向黛玉並紫鵑晴雯都磕了頭然後退了幾步轉身走了紫鵑笑向晴雯道你這個人也太不公道好意把襖子送還了你不謝謝人家倒要把送衣服的人出氣這算什麼晴雯道我的衣服為什麼要他拿去做陪嫁呢説著叫自己的小丫頭拿了衣包自要收拾他的衣服去了原來那一天寶玉瞞了衆人趁著早涼出了怡紅院走園子後門想去看著襲人寶玉是到過花自芳家的依稀認得路徑一個人找到他家門首四下寂靜無人便溜了進去花自芳並不在家寶玉站定嗽了一聲不見有人出來一徑走進裏邊正到了襲人的臥室見炕上一人面向裏睡頭上挽的慵梳髻枕的半新不舊大紅頂繡花枕蓋著一條豆緑西紗夾被像是襲人的舊物炕邊桌上燈檯茗具俱全比從前去見晴雯睡在蘆席上的光景雖大不相同而心中已如沁梅潑醋一般又恐不是襲人不便造次只得輕輕喚了一聲那人在睡夢裏直聲叫了兩聲寶玉寶玉知是襲人尚在夢中便連推他兩推襲人驚醒回過臉來見了寶玉把兩眼亂揉坐起身來寶玉就炕沿坐下拉了他的手可憐花枝瘦損非比舊日丰姿襲人瞪著眼怔怔的看了寶玉半晌哽噎不出半句話來寶玉忙把襲人撫慰一番道等你病好了總要叫你進去的襲人聽見要叫他進去這句話又感激又慚愧越發淚如泉湧放聲大哭起來寶玉道你的事我都已明白不用提他你只把咱們頭裏的話想去就是了調養你的病要緊襲人歎口氣道你的話我也記得你的心我也知道只恨我自己發昏一時錯了主意抱怨得誰呢偏又死不了活在世上現人家的眼寶玉道過去的事都撩開再別放在心上襲人道你今兒來瞧我我又想起一件事來了不是那一年晴雯出去了你去瞧他換了一件襖子穿了回來還撩在我箱子裏這是你們兩個人的恩情在上頭比別的衣服不同別説我有心掯他的寶玉道正是晴雯要過幾次我問麝月説你收著如今還了他很好襲人便叫一聲嫂子那花自芳家的聽見襲人和人説話過來看是寶玉便站在門外竊聽襲人叫他連忙進去與寶玉請安襲人叫他在一隻箱子裏取了一件舊銀紅襖子出來花自芳家的便去開箱尋取交給襲人自出去了襲人抖開衣服掉下一個紙包寶玉拾起開看就是晴雯的指甲重又包好藏在身邊襲人把那件襖子拿在手裏翻來覆去看了一會追想晴雯當年又想自己今日比晴雯與寶玉換穿衣服的時候一樣傷心禁不住撲簌簌淚珠滾下倒將晴雯的襖子濺濕了一大片衣襟襲人落了一回淚見寶玉還呆呆的站著便向寶玉道你出來有時候了快回去罷有誰同你來沒有寶玉竟似沒有聽見一手接過襖子便要穿在身上襲人道這樣熱天還穿得上棉襖子嗎你回去悄悄打發一個老婆子來拿罷寶玉只得把襖子撩在炕上又安慰了襲人幾句話出了花自芳家仍來園子後門回來並無人知道叫管園門的老婆子到襲人家去拿了一件衣服回來交給麝月那園子裏自從傻大姐拾了香囊鬧事以後嚴禁私自傳遞物件因寶玉吩咐不敢不聽那老婆子偷空兒到襲人家去取了襖子回來又錯記了寶玉的話把襖子遞在雪雁手裏被紫鵑瞧見回了黛玉鬧起這件事來那時晴雯説的拿去做陪嫁的話正值平兒拿了支銷總簿送與黛玉過目進來聽見便笑問道又是那一位姑娘要辦嫁妝我們好端整送添箱紫鵑把話岔開道小紅去做藝二奶奶又是好幾天了黛玉道前兒你送他過來早知道要配藝哥兒的不該受他這個頭平兒道藝哥兒也是下一輩子聽説寶二爺認過他做兒子奶奶還是他婆婆呢説著都笑起來平兒又道我送他來為是我們奶奶送還二爺賞蔣琪官的誰料到後來這節事真是姻緣前定黛玉道小紅正是你一個幫手得用的時候你奶奶為什麼急巴巴打發他出去平兒笑道恁也不妨就為二爺多看了他兩眼黛玉道你們奶奶這個醋罐子總丟不了一語未了鳳姐處又打發小丫頭來找平兒問鶯兒姐姐為什麼不過去姨太太那裏又打發人來催説等著他去瞧寶姑娘呢黛玉驚問那一個寶姑娘平兒也瞪了眼説剛才姨太太那裏打發人來叫鶯兒過去我也只道是沒要緊的事這里拉著説話兜搭住了我還不知道是那一個寶姑娘打量就是寶琴姑娘也不定黛玉搖頭道向來人家都叫慣琴姑娘的況且琴姑娘好好在太太那裏姨太太叫鶯兒去看他什麼呢莫非鐵檻寺有了些消息但這裏並沒知道斷沒有姨太太那邊先得信的這句話倒把人糊塗住了平兒笑道那有這件事想是他們錯聽了話這簿子留著奶奶看過了我再來取説著連忙走了黛玉便叫雪雁過去打聽一時寶玉進來問平姑娘來説什麼黛玉道他有什麼説就送支銷簿子來我問起小紅的事好笑鳳姊姊還是那麼愛吃醋他把這條子也改了過來豈不變了一個好人了寶玉道我如今想起來妒也是女子的好處不是女子的壞處黛玉怔了一怔道這話又是那裏來的周南詠後妃之德多半在不妒處稱其賢你反説妒是女人的好處後妃不妒倒是不賢的了寶玉笑道妒有兩種有悍妒有情妒女子貌劣才庸惟恐寵移愛奪比如庸臣竊位不得不忌賢嫉能以自保其爵祿甚至詭譎凶殘正人罹害此與婦人悍妒無異若情妒則不然即如妹妹所言後妃風詩詠君子好求之不得至於寤寐反側君子用情既如此以情感情淑女人非木石其間時勢常變不同人事遭逢不一憂愁思慮悲恐驚憂無所不至不免釀出一個妒字來了妒由情生情到十二分便妒到十二分此與勃溪悍厲之妒大相徑庭黛玉聽到這裏竟如把他自己從前的光景道破體貼入微無可辨駁不覺臉上一紅微笑道誰來聽你這些胡謅正説著見雪雁手裏拿了一紙字帖兒來道請姑娘看了再講寶玉問是什麼字帖兒忙向雪雁手裏接過一瞧連叫奇異便遞給黛玉看道這不是寶姊姊的筆迹嗎黛玉此時分外留神一面與寶玉觀看寶玉看到好風頻借力送我上青雲這兩句便記起這一闋詞來因説道這是寶姊姊填的柳絮詞他們抄來做什麼又看到末後寫的一行薛寶叉録前生于大觀園填臨江仙詞寶玉還不明白黛玉道是了一定是寶姊姊借體還了陽了如今在那一家呢雪雁才笑答道聽説那家姓張張家姑娘死去又活了這個帖兒是張家姑娘寫的張家打發人到姨太太那裏香菱看了叫老婆子送來的黛玉笑向寶玉道這件事還沒有告訴你就是姨媽生日這一天他老人家晚上夢見寶姊姊説要回來了咱們都盼望他還陽那裏想到是這樣還陽的寶玉道我還不信有這件事黛玉道漳郡蘇宗尸為朱進馬所借汝陽張宏義附李簡之體而活古來借尸還陽原是有的寶玉道寶姊姊回生不該借體才好這節事好叫我懸心黛玉瞅著寶玉道這一件天大的喜事倒還有什麼懸心寶玉道你知道張家是什麼樣人家這位姑娘多少年紀才貌怎樣倘是一個粗陋不堪的女孩子叫我還去認和不認呢幾句話把一個黛玉也聽得躊躇起來只得把寶玉勸説道你別性急等鶯兒回來底細都知道了寶玉一時有了這件心事坐立難安只盼鶯兒回來問個明白講到寶叉的真魂留住太虛幻境數月算準還陽日期因肉身已壞湊巧有個做過南韶道張家大老爺的女兒暴病夭殤那一日仍是尤家姊妹和秦氏送寶叉真魂到張家附在那小姐身上借體回生寶叉如同夢醒看了衾帳房屋並上下人等心已了然那張家只有這個女兒愛如掌上明珠忽患暴病身亡他父母哀慟無已今見死而復蘇張太太便心肝乖肉叫不絶口寶叉睜眼細看開口便稱太太道我不是你的女兒快送我回家張太太只道是病人的譫語急請名醫診治肝氣和平已全然無病兩三日後起身梳洗步近妝台啓奩一照竟與前生所見鏡裏的容顔無異暗暗稱奇道天下那有這樣相像的房中也有三四個丫頭伺候都叫不出他們的名兒只得一一問明連生身的父親張大老爺進來也要回避便對張太太道我姓薛哥子薛文起母舅王子騰家住什麼地方要坐車回去見見母親張太太如何肯放便説既有這些緣故不如請薛太太過來大家説説話倒可以使得附身的薛寶叉聽了歡喜巴不得立刻即見母親又恐他不信要等尋一件東西帶去作憑證睜眼首飾衣服都是張家之物因想起前生在大觀園與諸姊妹填的柳絮詞詞義巧與如今附體還陽之事有些映合便要紙筆寫了出來送去為證張太太接在手中走出來將詞遞與張老爺觀看並説明去接薛太太的話張老爺看了柳絮詞大為誇美知他女兒不過識得幾個字那裏填得上這首詞來方信軀殼空留性靈已易自是傷感本來知道薛家是榮府的親戚住居離榮府不遠便叫一個老婆子細細告訴了他的話來請薛姨媽薛姨媽聽了以為奇事所以來叫鶯兒同去的是日薛姨媽帶了鶯兒坐車來到張宅張太太忙出來迎接薛姨媽進去見了這位張家小姐倒吃了一驚看來竟不像附體還陽的如同寶叉活了轉來一樣鶯兒在旁也看得呆了薛姨媽沒有開口母女二人便抱頭大哭張太太忍住一腔的悽楚倒把他們勸慰然後讓坐道敘寒溫張小姐開口便叫鶯兒拉著手又哽噎了一會這裏薛姨媽細問緣由張太太將他女兒病亡蘇醒轉來便不是原魂的話一一説明薛姨媽又問他年紀生日取何閨名張太太逐件告訴了薛姨媽笑道天下那有這樣奇事不但同歲同生閨名也叫寶叉而且長來竟是一個模樣兒我剛才進來見了太太的令嬡面貌竟是我的亡故女兒若這兩個人好好的都還活著叫站在一堆兒我和太太見了真認不出誰是誰的女兒來呢正説笑著薛姨媽忽然想起一件要緊事來便問令嬡在日定過親事沒有張太太道因是沒有合意的人家將這件事耽誤了現在倒有一頭姻事在這裏説是賈雨村賈大人作媒説的南京甄家薛姨媽著急問道占定了沒有呢張太太道看光景兩親家都願意的了還沒過聘薛姨媽道太太快不要應許了我的女兒寶叉是已經出嫁配與賈寶玉的了張太太呆了半晌道且再商量一面吩咐廚房備席款待要留薛姨媽在那裏多住幾天薛姨媽定要回家席散後謝了張太太就叫套車寶叉想跟他母親同回張太太不允薛姨媽心上躊躇想寶叉借了他家的女兒的身體生轉來到底是張家的人反將寶叉勸住叫他不用性急寶叉也是個明白人斟酌其事未便造次只得叮嚀他母親速到榮府議出個萬全之策接他回去現在此間人家看他猶如親人他看人家竟同陌路要留鶯兒陪伴鶯兒即便住下張太太送薛姨媽上了車回到裏邊自與張老爺議論這件事這裏薛姨媽回到家中天色已晚一宵易過次日起身便往榮府先到王夫人處細細説明此事鳳姐正過來探問賈母處已打發琥珀到王夫人屋裏來請薛姨媽過去王夫人道老太太也惦記這件事咱們一同過去先回明瞭就在老太太那裏商量怎麼樣個辦法説著便請了薛姨媽帶著鳳姐來到賈母屋裏賈母滿臉笑容先向薛姨媽恭喜道難得又鬧出這件新奇事來我活了八十多歲從沒聽見過呢昨兒只聽説寶丫頭借體還陽了姨太太去看到底是怎麼樣的要姨太太細細講給我們聽聽薛姨媽陪笑道托老太太太太的福寶丫頭有造化該來侍奉老祖宗一輩子賈母道我先要問問這位姑娘長來相貌怎樣別碰著一個醜陋的白糟踏了寶丫頭了薛姨媽道不講俊醜第一件奇事叫那位姑娘站在老太太跟前老太太再不説是別人家的姑娘竟要嚇老祖宗一跳認是寶丫頭又活了賈母道聽姨太太説來竟同寶丫頭一個樣兒的了這是越發難得於是薛姨媽又向賈母細細講了一遍賈母聽到賈雨村現在與甄家説媒一事便不樂道寶丫頭是我家的人了怎麼又與甄家説媒那雨村荒唐我不依他呢鳳姐笑道雨村本家還是去説張家小姐知道後來的事自然也不去説了賈母道寶丫頭已經與寶玉圓房的了如今咱們只當他是寶丫頭不知道什麼張小姐李小姐説的大笑起來薛姨媽道老太太講的真不錯但昨兒寶丫頭要跟我回來張太太還不肯放我想寶丫頭這個身子終是張家的人寶丫頭也沒法兒只得把鶯兒留在那裏我今兒過來一則報老太太個信二來就要商量這件事王夫人道我倒想出個主意回老太太看使得使不得賈母道你有什麼主意説出來同姨太太大家計較王夫人道我想張家的意思終不肯把這個沒性靈的空殼子女孩兒推了出來既是雨村替甄家提過親沒有放定咱們就央雨村去説媒如同與張家再結了一門子親仍舊行聘迎娶寶玉又算做了他家的女壻這樣辦法諒來張家再沒有不允的賈母笑道這樣也好寶玉又多了一個丈母娘便問璉兒在家沒有鳳姐道剛才聽説馮大爺來拜出去會他不知這回兒客走了沒有説著叫小丫頭子去對興兒説等客去了老太太叫二爺呢小丫頭去不多時便同了賈璉進來賈母便問賈璉道你知道寶妹妹還陽的事情嗎賈璉答道昨兒孫子媳婦説還不知底細剛才聽見姨媽過來了正要問姨媽呢賈母道叫你媳婦講罷於是鳳姐就把此事一一説明並要央雨村説媒的話也講了賈璉道咱們去央他諒雨村也不好推辭就是事情碰得太湊巧了怕雨村作難老太太太太不記得上年老爺寫信來雨村替甄家提林妹妹的親如今又替甄家作媒求張家的親翻轉來又説到寶兄弟身上雖然有這些情節在裏頭覺得朝秦暮楚不但到張家去不好開口而且甄老伯面上也難為情想起來倒有兩個現成原媒在這裏何不央他們去包管一説便成王夫人道寶玉幾時提過他家的親賈璉道不就是做過南韶道的這一家張家嗎太太忘記了與邢大舅舅家也有些瓜葛親誼那位姑娘長得很俊也還識字因是獨養女兒要招贅女壻到他家去老祖宗不願意回報他們的王夫人同鳳姐聽説都記起這件事來笑道原來就是那一家鳳姐又道如今還要入贅女壻叫寶兄弟入贅到姨媽家去王夫人又問賈璉頭裏説媒的是誰呢賈璉道就是咱們家裏的清客相公王爾調詹光兩個人賈母聽了道這更好又不用到外邊去央人璉兒快去辦妥賈璉應了一聲是退了兩步轉身出外走了這裏賈母又與薛姨媽提起舊話道頭裏娶寶丫頭因寶玉有病又碰在國孝裏頭胡弄局的完了姻太委曲了寶丫頭如今聘娶了張家的親總要成個局面也算補還了寶丫頭先前的虧缺又向王夫人道你們要依我的話王夫人應道老太太想的到遵著老太太吩咐去辦就是了賈母又問道寶玉做親的屋子現在空著不用替另收拾罷就是林丫頭這班姊妹都住在園子裏又隔遠了王夫人道這件事告訴過老太太不是同姨媽那夜兒夢見寶丫頭説他若進來還住他的蘅蕪苑賈母道我倒忘了那麼著很好就依了他罷當下薛姨媽在賈母屋裏又説了一會間話然後進園來到瀟湘館黛玉因等鶯兒不見回來無處打聽資訊正在焦急今聽説姨太太在老太太處正要過去薛姨媽來了黛玉忙問寶叉還陽的事薛姨媽重又講了一遍黛玉才替寶玉放了心薛姨媽又把賈璉去央王爾調詹光到張家説親一節也講與黛玉聽了敘話至晚黛玉款留薛姨媽薛姨媽也因要聽媒人的覆信即便住下大丫頭同貴留在