body:
  text: 第十九回當金鎖巧合證良緣夢寶玉因疑生幻相話説寶黛二人新翻金玉姻緣卻值林府裏寶聚當鋪第一天開張大小夥計到四鼓時分一齊起身敬過財神利市挂出黑漆金字招牌上面披了大紅彩綢早有許多人擁擠進來先是本縣坐捕巡役並地方甲長等當的千鈞蚊帳等件都取個吉利話頭來打抽豐上匱夥計酌量各人身分自二十四兩起至四兩止無論當物價值一概接收將銀兩按號開發仍給當票等那些在官人役當過便有正經來當首飾衣服的人擠上匱來那一天因是新開鋪面該當八錢的便當一兩該當十兩的便當十二兩所以當當的人挨擠不開自黎明起直鬧到已牌時分衆夥計才得替換吃飯見一個人拿了一件絹帕包的當物在匱上放下便有一個年輕的夥計趕忙過來解開絹帕把那一件東西仔細端詳了一會問要當多少銀子當當的答道整整要當一千兩那夥計向著當當的笑道可惜這一件東西上鑲嵌的珠寶已經過火就當的是金子成色還是多算些總值不到五百兩怎麼當出一千兩銀來還是要當一百兩罷當當的道一百兩銀那裏當不出要大遠的趕到這裏來我不管東西值多少總要當一千兩銀那夥計已有些生氣便道值多當少大例如此雖是我們第一天開門就要通融多當些那有值不到五百銀的東西要當一千兩的那當當的聽了發急道你們這裏不當叫咱幾千里路跑到這裏來回盤纏要花幾十兩叫與誰去算帳呢那夥計便高聲嚷道到底誰叫你來當的當當的道是咱老子叫到你們這裏來當的那夥計道快回去叫你老子自己去當罷當當的又道咱老子已經死過沒處去找是他老人家托夢的那夥計聽他説話這個人像有些瘋傻將當物丟還不去理他自去接別人手內的東西當當的又趕過來攔住纏個不了那夥計按不住心頭火發登時漲紅了臉罵道那裏來的野雜種原來不是當當竟是來鬧當的這個地方容你外路人鬧事當鋪都不用開了便叫頭兒們同本圖地保呢快把這一個鬧當的拴起來連東西一同送到縣裏再究問他東西的來歷你們看他賊頭賊惱的樣子那東西不是偷來的就是拐來的説聲未絶早有坐捕地保人等因林府新開當鋪恐有鬧事的人一半為公一半為私都在當鋪前照應聽見有人鬧當巴不得生事直擁上前向胸前掏出鏈子正要動手擒鎖被一個年老的夥計走過喝道且慢動手便向那當當的好言相勸道老客我對你説你的東西我雖不見聽他們説值不到五百兩銀子你怎麼要當一千我們當鋪裏的成規凡是足色赤金值十當七衣服綢緞值十當五當進來的物件各人經手都有記號將來期滿落架如不夠本利要經手人認賠我們做夥計的人若説一票當就要賠五六百那裏有這些家産來賠我勸老客拿了東西快走是正經休討沒趣當當的道那麼著老掌匱何不把咱的東西來瞧瞧呢老夥計笑道不用再瞧老客疑心我們鋪子裏人不識貨敝處城裏城外有幾十座當鋪何不去多走幾家當當的聽了這番好話無言可答只得把東西揣在懷裏垂著頭慢慢的走出鋪門原來這個當當的就是石呆子因賈璉出了一百兩銀子一把要買他的古扇還不肯賣鬧了一場官司古扇仍歸烏有越發窮得支援不下他有一個表兄聞説現在江都縣裏跟官從前曾借給他家幾十兩銀子石呆子想到揚州討這一項舊欠這一夜夢見他死過的父親説欠項竟沒相干咱們有一宗意外財香可得叫石呆子明日見有換糖擔子裏頭放什麼異樣東西買得到手趁便帶到揚州見第一天新開當鋪招牌上有寶字的便進去當只該發一千兩銀子的財不可多當切記石呆子窮思極想次日一早起身站在門首呆等等到早飯後果有一副換糖擔子走過石呆子便過去搭訕著説話見他一頭挑的是糖一頭都是換來的破銅爛鐵別無罕物內中有一件東西似銅非銅似鐵非鐵黑暗無光細瞧著制工精巧心想夢兆或應在此拿在手內一提竟是沈甸甸的心中暗暗驚喜便與換糖的講價此物合該為石呆子所得只要得京錢二千文石呆子還價便賣自京中帶到揚州可巧遇見一座當鋪新開招牌上有寫寶字石呆子原想應夢發一注大財那知當鋪還價不對險些鬧出事來便垂頭喪氣出了鋪門還恐走錯了當鋪又對著招牌細看分明有一個寶字在上石呆子正在狐疑有一個人汗雨淋身跑進鋪道匱上夥計可有人拿了金器問要當一千兩銀子的嗎衆夥計忙答道有的因他説話懸虛沒有當成才出門走還不遠話未完驚動了地方坐捕人等見來人言動慌張銀兩對數便疑方才進當的東西一定來歷不明一窩蜂擁上前要拿賊贓見那個人尚呆呆站著不由分説即套上鎖鏈帶進鋪來搜起贓物交與方才跑來的人那人在身旁取出一張紙條來與那金器上鐫的字樣一對便叫開了鎖道我在西街上鋪裏聽他們講起有一個外路人來當過這件東西連上面字樣都記在那裏我所以寫了來對明要留他的東西你們不要錯疑別的緣故冒冒失失把他鎖了現在並沒失主如何起贓列位都是隨官人役可知誣良不是當耍的地方人等認得此人是林府總管不敢不唯唯聽命便開了鎖各自走開林府家人讓石呆子進匱房坐了略敘了幾句間話並不根究當物的來歷令鋪夥如數兌銀子一千兩寫了當票一張交付當當的人石呆子甚為感激想當內夥計都不識貨幸遇此人到來一千兩始得到手正是馬逢伯樂玉遇卞和便將當票留存以酬賞識並明不來取贖之意一拱而別鋪內衆夥計俱不識此物值價如許之多復接過細看向問緣由林府總管亦笑而不答令出了一千兩支帳將當票銷號袖了當物回府交進裏邊這因黛玉嬸母林老太太因甄府求親黛玉執意不允又看出他近日行為勸之無益心甚納悶是夜忽得一兆見一老人告以次日新開當鋪內有人持金鎖一盤要當銀一千兩兩面刻的什麼樣幾個字必須留下可定爾侄女黛玉姻緣醒來記得清楚便把幾個字寫在紙上正值是日新開寶聚當鋪已信夢中之事非全無影響即命總管家人遵照辦理如果有人來當金鎖但看上面所鐫字句相符無論價值多寡憑他要當一千兩也如數當與他不可有誤那知夢兆有因果得此物見鎖上字句不錯一字林老太太如獲珍寶再講黛玉自從供奉大士晨夕至誠禮拜心中已是萬慮皆空一塵不染間時連題詠一事也撩開了惟以撫琴臨帖玩月賞花有時調弄鸚鵡或教雪雁下棋為消遣一日雪雁偶開書篋撿出黛玉所寫字迹黛玉接過逐一翻閲想到寫經時候曾對雪雁講過留此手筆將來他們見了如見我一般的話如今紫鵑遠隔數千里不知作何歸結自己反把這些東西帶回南來猶及檢點入目恍如丁令威化鶴歸來有隔世重逢是耶非耶之景象又將近日寫的字來比較覺先前運腕軟弱指下乏力亦如詩犯郊寒島瘦之病今則豐腴潤澤比前大不相同觀玩之下益覺心曠神怡又悔病中何必將詩稿焚毀留在這裏看看亦可覺悟今是昨非黛玉想了一會忽聽架上鸚哥念的念煩惱不念煩惱念不念煩惱我煩惱我所煩惱黛玉笑道真是淮南得道雞犬同升你聽鸚哥也忘了昔日這些詩句了黛玉命春纖添了水罐內的水自己坐過調弄一會站起身來隨手在書架上取了一本莊子看到至人無夢一句又有所悟想庸人愛憎喜怒紛擾於中神不守舍則夢多即如我惡夢驚人皆由心境不寧之故如今回到家來於七情一無粘滯便寂靜黑甜黛玉正在展卷凝思見嬸母處打發丫頭過來手持一盤項圈説太太出一千兩銀子得了這件東西金鎖上面刻的吉慶話叫我拿來與姑娘看了太太還要把這上頭經過火的珠寶換下重新鑲嵌好了再送姑娘黛玉接到手中十分驚異道這件東西從何處得來怎麼出了許多銀子那丫頭回説不知黛玉隨叫他先自回去將金鎖遞與雪雁道你可記得見過這件東西雪雁瞧著笑道這不是寶姑娘身上長挂的嗎怎麼到了這裏黛寶聽説益信而無疑隨命雪雁前去細問來因自己又將金鎖翻覆再看緣黛玉自見寶叉後只因寶玉有玉寶叉有金一聞金玉姻緣之説刻刻關心過目時看得十分真切今見鎖上鐫的不離不棄芳齡永繼八個字不但字句相同而且筆畫模樣絲亳無異決非另有一盤金鎖他們正團聚金玉姻緣何得分飛至此此時黛玉心中一塊疑團萬難解釋專待雪雁回來再問分明及至雪雁來時將黛玉嬸母昨晚得夢及今日當鋪中之事一一回明黛玉聽了不但不能消釋疑團且因牽涉自己婚姻反覺入耳厭聽便欲叫送來的人立刻拿了開去又轉一念道我主見已定豈有因物遊移才悟從前認理未明此時既承嬸娘好意送來我看刻不容緩棄之如遺又蹈焚巾毀稿的故轍了於是心上隨將金鎖一事撩開不復置念是夜就枕合眼朦朧覺有人在耳畔悄喚妹妹道咱們同來睡覺再聽我講靈洞裏耗子偷香芋的古典黛玉聽是寶玉聲音便舉手一推叫道寶玉你別再來鬧我咱們如今廝擡廝敬怎麼又是這樣涎臉沒規矩呢説著欠身起來見了寶玉吃驚問道你怎麼做了和尚了寶玉歎道我做和尚正為的是妹妹怎麼妹妹倒問起我來我虧的去做和尚到一個地方走了一趟把失去那塊玉拾了回來如今交給妹妹替收著説罷將通靈遞與黛玉道這玉失去多時連那絡子都舊了還得煩妹妹給我重打一個黛玉道我打的也不稀罕可央你寶姊姊叫鶯兒打的好寶玉笑道寶姊姊已經回了家我也不和他好憑他弱水三千丈我只取一瓢飲的禪語難道妹妹就忘了嗎黛玉嗔道你説不和寶姊姊好我給你一件東西瞧瞧説著取了桌上的金鎖撩在寶玉手中寶玉道這東西可不是寶姊姊的了好妹妹暫且賞我換了我的寶玉罷黛玉不肯寶玉笑嘻嘻把金鎖拿了轉身就跑黛玉趕上拉他一交跌倒地上驚醒卻是一夢聽鼓樓正打三更房內殘燈未滅黛玉起身將燈剔亮見桌上放的金鎖依然無恙便喚醒雪雁倒了暖壺裏一盞溫茶喝了復又睡下心想自回生以後一切私念破除淨盡因何舊事復擾胸懷更怪寶玉做和尚一語本系莫須有戲談竟相因生幻起來甚為不解於是輾轉反側竟難成寐黛玉只得勉強操持拼除思慮然後又入睡鄉天明起身梳洗已畢仍到佛堂照常功課他嬸母處命人來取金鎖去換嵌珠寶黛玉這裏的事且按下不提再講鳳姐帶了紫鵑從清江浦上船一路無話到了揚州心中早已盤算停當先與紫鵑説明教他將從前辦事欠妥並寶玉出家心事及此番誠心求婚細細回明探了林姑娘的口氣再酌量自去面求的話紫鵑道照二奶奶先前所辦的事聽説姑娘如今的光景別説一位二奶奶就有十位二奶奶去也沒相干據我的意思現在有三件事靠得住紫鵑還可替二奶奶出幾分力鳳姐笑道那三件事你且講給我聽紫鵑道第一件寶姑娘已死我姑娘不做二房名分上頭並無關礙第二件老太太還康健寶玉出家不肯回來老太太怎樣捨得他姑娘也要體諒老太太疼寶玉的心第三件看二奶奶如今的行事似難執意若説單靠紫鵑這個人去説話我雖然伺候姑娘多年怎敢在他跟前胡講一言半句呢鳳姐聽紫鵑侃侃而談又情理又透徹便用手在紫鵑肩上一拍道好孩子我只道你本本分分跟了林姑娘這幾年再不知道你有這樣見識口才正是強將帳前無弱兵原像在林姑娘跟前調教出來的將來你姑娘過了門真是一個好幫手我總教林姑娘別放你出去就是了紫鵑臉上一紅道在這裏講正經二奶奶又和我取笑算什麼呢當下船泊碼頭先叫周瑞上岸通知林府一面預備轎子帶了紫鵑一衆人等來到林府是日黛玉在房內臨帖消間夢見寶玉之事又陡上心來便擱筆步向窗前賞玩幾樹杏花因早上才飄了幾點細雨枝頭分外精神一縷清香隨風送過覺目前塵氛俱滌黛玉正在凝神領賞見雪雁捧上茗碗叫聲姑娘喝茶黛玉回過頭來一手接了茶杯道爐內香滅了好半天你們也不來添添雪雁道太太那邊聽他們講起前兒不知那裏來了一個小和尚到老爺墳上祭奠哭的十分傷心問他跟來的人又不肯説明管墳的看了怪異不敢隱瞞到裏頭來通報的黛玉聽説便觸起寶玉做和尚一夢怔怔的呆了半晌反嗔雪雁傳話不清叫去問個明白雪雁尚未動身只見一個老婆子來報黛玉道榮府裏有一位璉二奶奶同了什麼紫鵑姑娘先到太太那裏太太請姑娘過去説著便回身走了黛玉一時摸不著頭路連日奇夢異事接踵而至登時心旌搖曳起來翻疑身在夢中連叫幾聲雪雁問我可在這裏做夢不是雪雁笑道姑娘瞧滿窗戶太陽照得紅紅的怎麼説做夢起來要説姑娘做夢難道雪雁也陪著姑娘在這裏做夢不成黛玉將身坐定又問雪雁道剛才老婆子説璉二奶奶同紫鵑來了的話你可聽見嗎雪雁道怎麼不聽見呢我去瞧瞧紫鵑姊姊問他們為什麼事到這裏來黛玉心上已猜著鳳姐來意幾分還拿不準等見了紫鵑自然明白便屬咐雪雁道你去見了璉二奶奶先替我請安説姑娘感冒著這會兒不能過去呢此時雪雁也滿心疑惑巴不得見了紫鵑好問來因答應著飛跑走到那邊林老太太正與鳳姐敘話寒溫一面叫管家婆子上去吩咐廚房備酒接風指點房間安歇上下人等雪雁過去先把黛玉的話致意鳳姐這裏鳳姐亦巴不得不先見黛玉恐致僨事自己且在林老太太處延挨等紫鵑過去講通了再聽消息且説雪雁一見紫鵑兩個人如有萬語千言一時無從訴起呆呆的對看了一會雪雁拉了紫鵑到僻靜地方盤問來意紫鵑道我的話一夜也説不完橫豎見了姑娘要説你總聽見呢我先要問你姑娘近來的主意怎麼樣聽見有人家來提親沒有雪雁道姑娘依舊是先前回來時候的光景倒像觀音菩薩面前的龍女是要做定的了那老婆子回去自然和你説過就可笑姑娘前世不知欠了寶玉兩個字什麼債頭裏的話不用説回到家來姑娘恨的是寶玉偏有什麼甄寶玉來求親回絶了他去後來又混説賈寶玉現在甄寶玉家裏甄寶玉家又替賈寶玉來作媒知道他甄的是假賈的是真姑娘的主意拿得定定兒總沒理他紫鵑笑道賈寶玉在甄寶玉家的話倒是真不是假呢雪雁性急要聽紫鵑的話便引紫鵑來到黛玉屋裏猛然聞聽喚了一聲紫鵑來了紫鵑擡頭一看見架上鸚哥似有親近之意紫鵑把手逗他道隔了好多時倒還認的人説著掀簾進內見黛玉面容豐澤氣度安嫻真與小像上描的無二心上已十分寬慰紫鵑與黛玉請了安黛玉站起身來先問老太太身體康寧次及王夫人並園中諸姊妹紫鵑一一應答黛玉拉紫鵑坐了情談款敘一番説咱們臨別時自分南北分飛此生難圖後會誰料隔不上一年又得見面真是意想不到的事你來也罷又跟著璉二奶奶同來更不可解到底所為何事紫鵑道説起來有極可惱的事又有極可憐的事不知姑娘先要聽那一種黛玉笑道你問雪雁我如今可大改先前的脾氣了便説可惱的事我聽了也未必生嗔你講可憐的事我聽了也不為酸鼻隨你愛講什麼只如漢書之下濁酒而已不知紫鵑説出何話黛玉聽了如何光景且看下回分解
