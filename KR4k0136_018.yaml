body:
  text: 第十八回下廣陵鳳姐願為媒過棲霞焙茗欣遇主話説王夫人和鳳姐商量要聘黛玉的事鳳姐先訴了一番委曲然後道要替太太想出一條萬穩萬妥的路把寶兄弟同林妹妹兩個弄他們攏來請老太太太太看他們完了花燭才算數呢原來鳳姐意中並無別人可以為媒惟有從前想出接木移花瞞天過海妙計足智多謀伶牙俐齒的王熙鳳可以去得便道此事任憑叫誰去只算得隔靴搔癢都沒相干先前幹錯的事只可全彀兒兜攬到我身上來仗著臉皮子厚沒死賴活地纏住了林妹妹我估量起來倒還有幾分拿手太太只要回明老太太願意叫我去走一趟我也萬分不敢推辭王夫人道你去果然妥當老太太有什麼不願我瞧你的病才好還沒十分硬朗為了寶玉的事要你大遠的去跑這一趟我心裏也不安鳳姐道太太不用管這些先前寶兄弟走失了大海茫茫不知在那塊所在委實沒法兒如今別説在咱們老家地方就在西洋外國也要去哄他回來倒還得指名要一個人同去做幫手才好呢王夫人問是誰鳳姐道就是紫鵑王夫人點頭鳳姐道就怕紫鵑推託必得太太獎勸他幾句一面就命小紅去叫紫鵑且説紫鵑正與晴雯在房內講起鳳姐這些人都錯認甄寶玉的笑話晴雯便罵麝月秋紋這兩個蹄子怎麼當著衆人走到跟前去親熱還動手給他解東西呢可問他臊不臊不是襲人嫁了漢子今兒定要把別人家的寶玉拉到屋裏去不知怎麼樣才好呢話未完只見小紅進來説奶奶叫紫鵑姊姊去説話紫鵑道奇喲這幾時你們奶奶從沒來叫我先前寶二爺做親要我去扶寶姑娘可離不了我如今你奶奶又是什麼地方要使喚我晴雯笑道先前叫你伺候假林姑娘如今想是叫你去伺候假寶玉呢紫鵑啐道那是要叫你們向來伺候寶玉這班人去的小紅向紫鵑笑道我見平姑娘抹的雀舌粉説是林姑娘寄來給他的不知姊姊這裏還有沒有也給我兩匣子紫鵑道我也不愛這些都分給人家了記得還剩四匣子在這裏你要都拿了去説著便去拿了粉匣兒遞給小紅小紅一面道謝催著紫鵑同出稻香村來到鳳姐處王夫人尚未回去鳳姐便將剛才的話與紫鵑説明紫鵑聽了甚慰私願惟口中卻不肯允許故意推辭道我雖是老太太屋裏人自從老太太派我服事林姑娘這幾年倒像是跟林姑娘的人了如今二奶奶要到南邊去算把我帶去送還林姑娘使得若叫我幫著二奶奶説什麼話斷乎沒有這個理況且林姑娘的心事我也猜不透奴才主子怎麼好輕嘴薄舌不守一點子規矩王夫人道誰叫你在林姑娘跟前説什麼話不過看我分上陪二奶奶去走一趟因為寶玉鬧的不像樣兒寶姑娘又死了先前的事再別提他如今一邊疊牆兩邊要好我知道林姑娘和你對脾氣保不定林姑娘心裏沒有點芥蒂倘然執意起來也好勸勸你姑娘王夫人又叫了幾聲好孩子把紫鵑灌了一泡米湯然後紫鵑才允王夫人便到賈母處將鳳姐帶了紫鵑親到黛玉家裏去求親的話回明賈母十分歡喜又道鳳哥兒也是咱家媳婦那有自己妯娌作媒的王夫人道等璉兒媳婦先去求允了自然還得再請冰媒賈母又問鳳丫頭的病怎麼樣呢王夫人道他説不相干因為寶玉的事很著急呢賈母點頭道這也難為他當下便摧王夫人選定長行吉日一面賈璉端整家信通知寶叉病故現奉賈母之命欲為寶玉續聘黛玉可回覆雨村並與王夫人商明瞞住寶玉出家一事以免賈政生氣隨往甄老爺處囑勿泄漏一面趕緊備齊銀兩打發家人起身邢夫人尤氏知道寶玉有了下落過來與賈母王夫人道喜談心王夫人因寶玉留住南京甄府甄太太現在京中又親往道謝此時鳳姐欲下江南為寶玉求親一事闔府皆知衆人自有一番議論紫鵑知道行期不遠便收拾行李及隨身應帶物件記起黛玉小像一幅尚在李紈處便取來自己帶去送還湘雲見衆人忙亂園中亦無興趣先回家去了講到鳳姐病已大愈回明王夫人與寶玉檢點行篋帶去王夫人將通靈寶玉取出見絡子已舊要重打新絡以為聘物那時探春亦在王夫人處便道據我意思竟不用換那舊的倒是林妹妹向來見慣離而復合睹物思人可以感動王夫人點頭當下將通靈玉遞給玉釧叫他去送交鳳姐鳳姐這裏正在點派跟去的人因周瑞上京來算繳租籽順便帶著回南並帶周瑞家的又派了旺兒包勇還有兩房家人鳳姐隨身服事的丫環是豐兒小紅又命送黛玉回去的一個老婆子路上伺候紫鵑平兒道我也跟去服事奶奶鳳姐道都走了這屋子裏的事情交給誰呢平兒道奶奶出了門我一個人在屋子裏像什麼呢鳳姐聽出平兒話中有話鼻孔裏出了一口氣道你這句話我倒正經囑咐你二爺是個饞嘴貓兒裏裏外外你要留一點子神我回來知道了只是問你平兒道奶奶在家還管不了叫我把二爺怎麼樣呢我説不如跟了奶奶走的好話未完見玉釧送了玉來大家把話掩住鳳姐接了自去收拾晚上鳳姐又安頓平兒一番話到了次日轎馬車輛俱已停當隨行僕婦各自忙亂照應鳳姐行裝鳳姐先到賈母處告辭自有一番囑咐然後到王夫人屋裏先有李紈探春邢岫煙並尤氏帶了蓉哥媳婦都在王夫人處與鳳姐送行尤氏笑道我們不知道你今兒就走趕不上給大媒餞行你們瞧鳳丫頭真是太太麾下一員勇將為了寶兄弟的親事不辭勞苦獨馬單槍的直下江南連他腳跟上的泥我們還趕不上呢話未完見鴛鴦進來説老太太叫二奶奶到了南邊得了林姑娘那裏的準信二奶奶先打發一個人回來老太太在這裏盼望呢鳳姐道有我這張涎臉纏住林姑娘總要叫老太太做了外孫女兒的婆婆才歇手呢求允了林姑娘自然到甄家去拉了寶玉先同他回來請老太太儘管放心説著辭了王夫人並衆人尤氏李紈等都送至二門口才回鳳姐與紫鵑豐兒小紅四個人坐了兩乘二馬車家人媳婦們坐車家人騎馬離了榮國府出城走了兩程到第三日正走之時只見一個人走上來拉住鳳姐坐的二馬車杆子要求看顧前面家人見了趕忙跳下馬來拿著馬鞭子亂抽那人只是不理這裏家人楞著眼罵道那裏來這個野東西這是榮府裏來的你沒有問問明白瞧那一個人道我就知道是榮府裏來的那家人又道這裏頭坐的是榮府璉二爺的二奶奶呢還不遠遠的滾開那人道正為是的璉二奶奶所以敢來找他大太爺你問問裏頭坐的奶奶我先前和他到底有些瓜葛沒有這會兒公然裝奶奶樣兒眼珠子就瞧不見人了那家人聽他説的混帳越發生氣就把這個人打了七八個耳刮子那人一手按著臉一手仍拉住杆子賴著不走旺兒在前面聽見嚷鬧勒住了馬回頭一瞧見那個人有些面熟忙跳下牲口將他細認便知來因勸住了這一個家人道別動手又向那一個人道這位璉二奶奶是做過九邊總制王子騰王夫人的親侄女我知道你是錯認了人得放手時且放手別再沒眼色馬上叫了地保村頭送到衙門裏可是有便宜到你沒有那個人把旺兒釘了一眼連忙跪倒在地上碰了十幾個頭跑開了兩個家人都上了牲口一路談論那人胡鬧的緣由不多時進店打尖鳳姐便叫旺兒上來問道剛才放肆這個人到底是什麼來頭旺頭問道此人就叫張華本來不習上想是把這宗銀子花完了回到京裏沒有打聽尤家二姨已死聽説二爺的奶奶回南一定錯認了人做夢的跟了兩天想訛詐幾兩銀子奴才告訴他明白就不敢撒謊了鳳姐想了一想道我記得你們回過説這個人已經被截路打的死的了怎麼又跑出他來呢旺兒猛一下子被鳳姐詰住記起先前扯謊一時圓不過來忙扒倒地上碰頭道先前錯聽了人家的瞎話沒有打聽確實是奴才該死鳳姐喝道去罷我如今也不追究這些事了旺兒又碰了兩個頭起身退出不多時連忙上車傍晚住店連日夜宿曉行到了清江浦換船水路行程間話少敘且講寶玉在甄府度年桃符換歲柏酒迎新江南風景一般熱鬧而現在客居又因黛玉親事尚未定準回憶大觀園中與諸姊妹猜謎行令玩燈剪綵何等興趣今隻身落寞虛度良辰真自出母胎從未經過此淒涼歲月又轉念道我離卻繁華不享非由旁人逼迫乃是自己尋出來的淒涼總為林妹妹分上大荒山尚且願去何論於他想到此處又將眼前寂寞境界安之如故一過新年便稟知甄老太太欲往揚州遊玩甄母叫多派童僕幾人伺候寶玉前去恐去船走水路耽險命備鞍馬至鎮江岸口對渡瓜州行走原來南京到鎮江只有兩站路程一條平坦大道寶玉騎的一匹小青馬手挽絲韁正走時見一衣衫襤褸的小和尚肩挂飯桶向馬前沖面迎來四目互睜小和尚忙上前抱住了寶玉的腿叫道可是二爺在這裏了甄家跟來的人見小和尚無禮忙勒馬近前用馬鞭子向他身上亂抽那小和尚拖住寶玉死命不放口裏亂叫二爺道我是焙茗呢寶玉聽出聲音果然焙茗驚喜非常喝開甄家家人説這是跟我的小子我出門後不知他為什麼也出了家當下勒住了馬向焙茗細問緣由焙茗道説起奴才的苦處半天也講不完怕耽誤了程途等晚上住了店再細細講罷這件東西可要告別他了説著把飯桶撇在地上甄家的人忙讓焙茗騎上坐馬自己命馬夫把引馬帶過騎了一同行走不多時住了宿連甄府家人都要聽焙茗講他出家的情節焙茗便從頭至尾説起道就是那一天輪著奴才同鋤藥該班大家正喝二爺的喜酒高興裏頭又沒吩咐伺候二爺出門二爺趁熱鬧跑出了府連大門上都沒瞧見奴才們那裏知道呢不知誰在裏頭使了促狹只説奴才是該班頭兒不分皂白把奴才一個人發到外邊鞭責一百不算後來知道二爺做和尚去了還著奴才身上找回二爺將功折罪奴才沒法兒帶了盤纏銀兩一個人跑出府來打聽南邊有大叢林料定二爺必到南邊奴才沿路尋來那知路上遇著了拐子向奴才告訴説這裏棲霞嶺有一個才落發的小和尚聽他講的小和尚相貌竟是二爺這一個人就住在南京叫奴才廝趕著他還肯引奴才到棲霞嶺去找尋二爺誰料到了半路把奴才的行李拿的精光逃跑了奴才只得剝下身上穿的衣服當的幾兩銀子做了盤纏心還沒肯死沿途短雇腳驢跑到棲霞嶺來找個遍見的老和尚小和尚可不少那裏有二爺個影兒比那一天二爺聽了劉姥姥的混話沒頭沒腦叫奴才跑到鄉村裏去瞎找還難受呢身邊盤費沒有半文進退無路只得就在棲霞嶺出了家他們寺裏的規矩新收徒弟落了發先要擔三年水不就是背了飯桶出去化三年齋飯奴才當了化齋的差使爺想想奴才是伺候爺慣的那裏吃過這些苦如今天天背了飯桶來回要走幾十裏路今兒碰見二爺奴才可也不想活了寶玉瞧了瞧焙茗倒好笑起來道再不料你也出了家焙茗道咱們爺兒兩個和尚伺候和尚可不親熱些嗎焙茗一夕話説的甄府家人聽了也道他訪主出力頗有忠心大家贊歎便取出衣服鋪蓋送給焙茗焙茗説二爺還是和尚打扮要還俗等著二爺一齊還俗止留了一副鋪蓋甄家的人又向焙茗説明寶玉來蹤去迹當晚話至三更安睡次日渡江寶玉坐在舟中觀玩吳頭楚尾煙景滄茫焙茗手指金山寺道這山上一座大寺院內也去找過的寶玉縱目遠觀知是名山勝地霎時揚帆飛渡已收了瓜州口住宿一宵往揚州城內寶玉叫甄家的人問明林府住址要去探望那甄家的人都知求親不允一事婉言勸阻寶玉心想咱們本是老親只不提別的話難道姑母家裏不該去走勸我先去看看林妹妹在他家裏怎麼樣見了我他自然要生氣我也甘心順受由他痛痛快快罵我一場消消他一年來的積憤我心裏也過得去一時執定主意那裏肯聽人勸説甄家的人怕跟著榮府哥兒出來失了體統回去難免老太太責罰又因客邊不便重言得罪寶玉便拉了焙茗背地裏叫他勸阻説你爺這會兒要到林府論舊親有什麼使不得但現在要結新親況這樣一身衣服豈不惹人笑話説招上一個和尚姑爺來了你爺兒們到底向來在一處知道脾氣的勸勸這位小爺別再淘氣才好焙茗聽了甄家家人的話便到寶玉跟前依般直説勸了一會寶玉想道他們那裏知道我的心事若論林妹妹不但不怕他笑話就正要他見我穿的一領袈裟比腰金衣紫還能歆動他呢但只他家裏還有當家的人照焙茗説的話果然當一個瘋和尚瞧我因我這一走等到家裏有人去提親他們不給林妹妹知道倒先回絶了便怎麼樣呢於是又把要見林黛玉之念中止不得已想到紫鵑身上自己盤算道林妹妹既不便相見紫鵑這丫頭也還實心但得一見紫鵑告訴我的苦衷叫他轉達林妹妹猶如見林妹妹一般想起先前對我説他姑娘將來要回南邊原是哄的我話如今弄假成真不知紫鵑心裏又怎麼樣呆呆的想了一會便叫焙茗道我聽了你的話不到林老爺家裏也罷咱們同到門首只要你進去叫紫鵑出來説幾句話就是了焙茗笑道爺出了幾個月門怎麼園子裏的人都記不清了奴才聽説紫鵑姑娘還在咱們園子裏住著沒有同林姑娘回南呢寶玉生氣罵道放屁我病好後從沒見他一面怎麼説還在園子裏呢焙茗道爺別生氣原是奴才打聽的不明白就算紫鵑同林姑娘回來了爺想奴才在自己府裏頭可曾走進二門叫那一位姑娘説過話沒有如今林府裏就許奴才進去叫紫鵑姑娘他就肯同著奴才走到大門外來和二爺説話嗎爺講的話可都是有理的勸爺不用盡著這樣發呆了明兒去逛平山堂是正經寶玉聽了也沒言語當晚無話連日同了甄家的人焙茗跟了各處去遊賞勝迹時交春初雖草才萌緑柳乍舒青而江南早暖已是日麗風暄遊人不絶衆人都瞧著寶玉納罕背地裏紛紛談論有話傳入寶玉耳中亦恬不為怪只顧遊玩一日聞得旁人傳説林府新造墳墓壯觀離平山堂不遠寶玉觸動心事命甄家人置備祭禮親詣吊奠一因姑爹姑媽逝世後遠隔程途未曾顧問今既如此本應稍盡晚親絮酒瓣香之敬二則求婚心願須默通于二大人之靈使冥冥中護佑主持三則欲供墓前盈尺之地一瀉滂沱宣舒積鬱不多時祭品辦齊雇夫挑在林老爺墳上衆家人隨了寶玉策騎行來是日正值雇人添種墳上樹株工人出進絡繹寶玉約離墳墓百余步便跳下馬來走近墓前無心觀看墳塋儀制只見石碑上鐫著敕授資政大夫原任兩淮鹽政探花林諱如海公之墓坐西南兩穴寶玉知是林公夫婦合葬在內便命焙茗令挑夫擔上祭品先自動手擺列焙茗忙去馬上揭了一條馬褥鋪在地上寶玉焚香叩首默默禱告已畢又想到姑爹姑母只生林妹妹一人天既畀以超凡靈慧絶世姿容不幸怙恃無依髫年寄往舅家雖遇了我這一個知己奈事遭磨折棒打分飛致使我大荒山一行正為不肯負林妹妹幾乎又誤了他此時胸中愁緒萬千連一句話也無處告訴想到傷心止不住大放悲聲淚如瀑布泉湧哭的幾乎暈了去連那種樹的人都看的呆了寶玉從前在家為了黛玉雖也傷心痛哭過幾次有襲人輩百般勸慰焙茗自跟寶玉以來未經見過嚇的滿頭是汗便叫我的爺別再這樣鬧了好容易碰著二爺同回家裏還算奴才的運氣可以贖罪了照這樣鬧起來奴才的膽子小驚嚇不起情願去做化齋飯和尚受些磨難也説不得了甄家人也都來勸説寶玉才住了哭焚帛撤奠將祭物賞了看墳的人焙茗忙催寶玉上馬離了林塋未知寶玉在此祭奠一事有無傳聞到黛玉處寶玉究竟能否得見黛玉書且慢表所有寶黛二人未了情緣警幻仙子既欲破格玉成其事早已移花接木斡旋金玉姻緣翻出一段新奇故事下回書中再為分解
