body:
  text: 紅樓夢補第一部清歸鋤子著目録紅樓夢補序序第一回絳珠宮議償恩怨債警幻仙重補離恨天第二回識病源瞞生施巧計接家音證往悟冰心第三回贈多珍反勸有情婢占神數預定再來人第四回會芳園劇飲餞長行賦陽關聯吟抒別緒第五回撰祭文癡心人悼亡念親情老太君痛別第六回怡紅子泣黛感殘春滴翠亭訴鵑傳密信第七回巫峽殘雲對姊喚妹藝房幻夢兆吉疑凶第八回棘院尋郎驚心冤孽畫堂演劇指證仙圓第九回踐戲言新貴入荒山試凡心夙緣還寶玉第十回叩仙壇乩盤藏隱語遁禪門蠢婢露真言第十一回痛郎削髮潑藥輕生憶主傷心擁衾敘話第十二回毀金鎖遺言囑賢女呼寶玉切齒類顰卿第十三回太虛境遣邀薛蘅蕪紫檀堡補敘烈晴雯第十四回花襲人出府喪節守蔣玉函感舊退婚姻第十五回酆都府冤魂纏熙鳳大觀園冷院感晴雯第十六回夜守空房老嫗疑怪心無宿憤方物將情第十七回寶玉還家混淆真假惜春題畫點破機關第十八回下廣陵鳳姐願為媒過棲霞焙茗欣遇主第十九回當金鎖巧合證良緣夢寶玉因疑生幻相第二十回癡絳珠感情灑舊淚莽紫鵑認物發嗔言第二十一回賜聯秦晉詔下南京賞賜奇珍恩頒北闕第二十二回清虛觀仙詞留粉壁幻影鑒亡配照黃昏第二十三回尋花公子屬意還珠掃墓佳人傷心淚草第二十四回話鄉情愛叨翡翠簪誅盜首飛斬鴛鴦劍第二十五回金殿傳臚榮膺曠典香閨制錦集賀新婚第二十六回不忘舊鶯姐欲捐軀因忌才鳳姑思退位第二十七回貯金屋嬌婢會么弦興寶藏財星臨福地第二十八回置産營財葛藟誼重因金恤玉樛木恩深第二十九回訴往事窗外站癡人辭側室園中談摯語第三十回領白鏹陡成新富戶制霓裳重集舊伶人第三十一回訊芳蹤香院惜間花還詩集絮詞盤侍婢第三十二回委任得人因奴托主傳家存厚薄利輕財第三十三回話夢新聞敦倫遷善葬花舊地聆曲怡情第三十四回義認螟蛉周旋往事錦添富貴成就家童第三十五回慶蒲觴芳洲觀競渡開壽筵舞榭發悲歌第三十六回慈姨媽三更夢愛女呆公子一諾恕私情第三十七回送舊衣嗔查紅綾襖證回生録寄柳絮詞第三十八回以情感襲婉語勸晴設法制環正言索彩第三十九回恩償夙願追憶畫薔緣了前生重諧蔔鳳第四十回慶團圓賈母賞中秋博歡笑村嫗陪戲宴第四十一回擊鼓傳花預征佳兆推雲淨月立毀冶容第四十二回還原璧疑破金鎖案嘲顰卿戲編竹枝詞第四十三回聽捷音稻香村設席洗繁華蓮花落侑觴第四十四回辭水月伴居櫳翠庵照情天群蟾太虛像第四十五回朱砂痣甄母認嬌兒仗梁症襲人思舊院第四十六回開綺筵豪飲賽清歌抱錦裯分房還故寵第四十七回延羽士禮懺為超生登高閣賞梅重結社第四十八回過除夕了結絳珠緣撕改册驚醒紅樓夢紅樓夢補序月如無恨月自常圓天若有情天應終老試看山中白骨一夢如斯無非鏡裏紅顔三生莫問如石頭記傳奇演紅樓之歌曲即色皆空驚黑海之波濤回頭是岸絳珠還淚誰憐淚眼之枯頑石多情終負情天之債憶雯鵑而飲恨涕蠟流幹代寶黛以銜悲唾壺擊碎然而王嬙歸漢不埋塞外之香荀粲齊眉尚剩奩間之粉借生花之管何妨舊事翻新架噓氣之樓許起陳人話舊此後續兩書所以復作也但如賓豈有並尊抑後來更難居上屈我瀟湘之位尚費推敲讓人金玉之緣終留缺陷且也太君已逝未觀合巹以承歡伯姊雲亡莫試如簧之故智籲其甚矣憾如之何于焉技癢續貂情殷附驥翻靈河之案須教玉去金來雪孽海之冤直欲黛先叉後宜家宜室奉壽考於百年使詐使貪轉炎涼於一瞬大觀園裏多開如意之花榮國府中咸享太平之福與其另營結構何如曲就剪裁操獨運之斧斤移花接木填盡頭之邱壑轉路回峰換他結局收場笑當破涕芟盡傷心恨事創亦仍因雲爾嘉慶己卯重陽前三日歸鋤子序于三時定羌幕齋序稗官者流卮言日出而近日世人所膾炙於口者莫如紅樓夢一書其詞其顯而其旨甚微誠為天地間最奇最妙之文竊謂無能重續者不圖歸鋤子復有此洋洋灑灑四十八回之作也余在京師時嘗見過紅樓夢元本止於八十回敘至金玉聯姻黛玉謝世而止今世所傳一百二十回之文不知誰何傖父續成者也原書金玉聯姻非出自賈母王夫人之意蓋奉元妃之命寶玉無可如何而就之黛玉因此抑鬱而亡亦未有以叉冒黛之説不知傖父何故強為此如鬼如蜮之事此真別有肺腸令人見之欲嘔歸鋤子乃從新舊接續之處截斷橫流獨出機杼結撰此書以快讀者之心以悅讀者之目餘因之而重有感矣夫前書乃不得志于時者之所為也榮府群豔以王夫人為之主乃王夫人意中則以寶叉為淑女而襲人為良婢也然寶叉有先姦後娶之譏襲人首導寶玉以淫是淑者不淑而良者不良譬諸人主所謂忠者不忠賢者不賢也又王夫人意中疑黛玉與寶玉有私而晴雯以妖媚惑主乃黛玉臨終有我身乾淨之言晴雯臨終有悔不當初之語是私固無私惑亦未惑譬諸人臣所謂忠而見疑信而被謗也歸鋤子有感於此故為之雪其冤而補其闕務令黛玉正位中宮而晴雯左右輔弼以一吐其胸中鬱鬱不平之氣斯真煉石補天之妙手也其他如香菱如鴛鴦如玉釧如小紅如萬兒如齡官一切實命不猶之人慈悲普度俾世間更無一怨曠之嗟此元人所雲願天下有情人都成眷屬即聖賢所雲王如好色與百姓同之者也前書事事缺陷此書事事圓滿快心悅目孰有過於此乎犀脊山樵序
