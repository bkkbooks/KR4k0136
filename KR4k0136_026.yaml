body:
  text: 第二十六回不忘舊鶯姐欲捐軀因忌才鳳姑思退位話説寶玉正在園中拜堂之時那邊鬧出一件事來只因黛玉仍要住瀟湘館寶玉先前做親的屋子已騰空出來麝月秋紋碧痕同小丫頭們都挪在瀟湘館伺候連文杏也過去了獨有鶯兒不肯出來這一天寶玉做親鶯兒看見益增悽楚也不出去瞧戲悶坐在自己屋裏到晚上孤燈相對只聽內外鼓樂之聲不絶想起他姑娘心中傷感走出外間設靈之所連穗帳都已除去一室空空棺樞又遠停鐵檻寺呆呆站了一會仍回房內聽見外邊迎娶到門戲文煞了台這裏賈母王夫人鳳姐同女眷們一齊擁進大觀園裏連丫頭媳婦們都走個空只留幾個看屋子的老婆子不敢走開在炕上打磕睡此時鶯兒住的屋子冷靜猶如從前寶玉同寶叉做親的時候那邊瀟湘館裏沒有一個人去走動的光景講到寶玉娶的寶叉哄寶玉説是林姑娘鶯兒是知道的想林姑娘也受過委曲寶玉出去做了和尚一輩子不回來倒也罷了那知把我姑娘慪死他和尚做不成回來仍舊娶了林姑娘雖然是各人的緣分但我姑娘不能死而復生這冤苦好比沈於海底我在這裏住一天看了他們增一天的怨氣就便離了這地方也活得無趣味不如尋個自盡找著姑娘同在陰司裏過日子倒比陽間還自在些鶯兒這個念頭不是此刻才動所以日間早向一個老婆子屋裏要了一包鉛粉只説有個用處預備停當一時主意已定哭了一會便取鉛粉包子抖開吞下不多時毒發肚疼倒在炕上亂爬亂滾正在危急可巧一個看屋子的老婆子進去要蠟燭見鶯兒在炕上喊滾不知為什麼緣由回身見地上雪白的灑了許多連忙取燈照看知是鉛粉連包的紙還在那老婆子一面叫人自己趕到園內叫林之孝家的才進園門見了老田婆便問嫂子見林奶奶嗎田媽答道他在省親別墅伺候這會兒正忙呢這一個老婆子又道我不知省親的別墅在那裏呢田媽笑著指道你尋上有矗燈的路左手轉彎望見那向南的屋子門前有牌坊燈兒點得紅紅的就是了這老婆子依著田媽告訴他的話找尋到省親別墅見林之孝家的拉著王善保家的説道嫂子你是大太太那邊的人難道就不懂這府裏的規矩大太太同老太太在裏頭瞧寶二爺做親一定短了你進去伺候你不想想自己是個半邊人兒只看咱們的大奶奶為什麼不過來呢林之孝家的話未完那老婆子便上前告訴道林奶奶不好了鶯兒姑娘服了毒了你老人家快瞧瞧去林之孝家的聽了便向他兜臉啐道我瞧你年紀有了一把竟是到三不著兩你看我還離得開這個地方嗎不趕早叫幾個人去灌活失驚打怪的跑到這裏來好沒眼色説著便走了開去那老婆子不敢回答一句只得忍著氣跑轉來見已來了兩三個人有一個老婆子道救是有救的要用黑鉛五斤打一把壺壺裏灌了酒泡上土茯苓乳香煮他一天一夜埋在土裏半個月拿出來喝了就好衆人笑道依你這樣泡煮了起來土裏埋的酒沒刨出來人倒已經埋了説著聽見鶯兒還在炕上哼哼又有一個老婆子道看來毒還輕快去取些小磨香油來灌下去只要吐了就有命當下便去尋了香油灌治也是鶯兒命不該絶少停嘔出了許多毒來喝了幾口米湯那老婆子就在鶯兒屋裏歇了隨時送些湯水睡至天明漸漸平復那老婆子再三囑咐鶯兒不要説出在他屋裏取用鉛粉的話鶯兒理會再講省親別墅拜堂見禮已畢花燭引道衆侍女張燈奏樂送至瀟湘館賈母衆人各自回去惟有湘雲這一班姊妹一同跟了來看坐床撒帳已畢又鬧了一會才各散去此時黛玉已挑去蓋頭巾紫鵑雪雁幾個人簇擁著坐在炕上寶玉等不到紫鵑們散開便笑嘻嘻走近黛玉身旁叫道咱們到今兒也得見面了我為了妹妹寶玉才説出這幾個字又縮住了轉口道妹妹統知道了沒有黛玉低頭不語晴雯在外聽見怕寶玉傻出什麼故事來林姑娘才過門第一天妝新擱不住他這樣歪纏隔著簾子叫一聲請二爺呢寶玉聽是晴雯的聲音叫他便轉身跑了出來拉住晴雯的手不知從那一句話説起對面看了一回便問道你穿的什麼衣服説著就來掀晴雯的衣袖見有陪房媳婦們走來晴雯慌忙脫身走了開去陪房女人看表已交醜初三刻便請寶玉安寢是時與黛玉二人雖無為雲為雨之歡都有相親相愛之樂覺比從前款洽綢繆意味判分涇渭實有難以言語形容之處香夢酣濃因各矜持早起黎明已醒黛玉起身梳妝外邊已經伺候多時同寶玉先往宗祠行禮回來到賈母房中請安賈母亦已起身因昨日未曾瞧見黛玉的臉今兒來了便一手拉住叫琥珀打起窗子把黛玉臉兒細瞧一會真歡喜到十二分不知怎樣心上一酸幾乎掉下淚來連忙忍住黛玉看見賈母光景亦不免眼圈兒一紅賈母吩咐跟來的陪房女人道園子裏過來路遠姑娘路上辛苦了以後不必按著規矩早來請安再消停幾天隨姑娘的便隨著姊妹們高興人家到這裏來逛逛衆人齊應了一聲是擁了黛玉到王夫人屋裏見過王夫人亦如賈母吩咐再至鳳姐處順路走東角門回園正要往稻香村只見素雲碧月兩個趕來阻步黛玉便回了瀟湘館是日正請永昌宮主北靜王妃南安王太妃錦鄉侯誥命臨昌伯誥命這幾位同衆勳戚命婦賈母王夫人俱按品大妝迎接賈母吩咐林之孝家的請新人到來見禮北靜王妃道聽説新人洞房就在大觀園瀟湘館咱們都要去逛逛園子呢就一路逛到新人屋裏見了豈不是兩便賈母笑道這太覺不恭了於是衆人都進了園一路賞玩園景穿花渡柳而來將近瀟湘館林之孝家的先抄徑路去通知了黛玉便盛妝迎出接至裏邊序次欲行大禮南安王太妃與衆人阻止對賈母笑道這位就是令外孫女記得太君大慶這一年咱們也到園子裏來見過的如今越顯得豐腴富泰了真可謂丹山之種玉勝綿祥總是太君的福分所招賈母連忙遜謝衆人略坐一會起身出來見園子裏高高下下千百竿翠竹遮映著一帶朱欄緑蔭濃濃苔痕點點兩旁回廊亦造得曲折精致沿牆引進一股清泉往復瀠回浸灌都道好幽雅所在也只配太君這位令外孫女如今是孫媳婦住的一路説笑出院黛玉送至門外才回那一群人又轉過沁芳亭繞出浣葛山莊見省親別墅的燈彩未收衆人問及賈母告以欽賜寶玉在此間拜堂的緣故説著行至嘉蔭堂讓進坐下只見花木深處青溪瀉玉石窟飛雲兩邊畫樓繡檻隱約於山拗樹杪之間都道這裏很好咱們何不就在此坐坐呢王夫人聽了連忙叫賴升家的把戲班子傳了來一時鋪設齊全呈上戲目各人點了吉慶戲開台便是張仙送子賈母陪席恭肅盡禮邢王二夫人與尤氏鳳姐俱站立值筵按著榮府規矩説不盡席上山珍海錯場前檀板金樽少停客散各自回房安歇次日女眷們仍在王夫人院內坐席聽戲內外宴客六天外面系賈赦賈珍應酬花宴一天亦在嘉蔭堂內黛玉首席是鳳姐妯娌探惜姊妹作陪並湘雲岫煙寶琴李紋李綺迎春香菱還有喜鸞喜鳳連巧姐亦在其內書不細表三朝後黛玉命紫鵑理出送賈母王夫人以及衆人的禮物按照單開樣數各處分送連趙周姨娘處都有湘雲們各人做的新婚詩送到黛玉處正在事忙大概看了一看便貼於屋內因見寶琴詩中有通靈即是溫郎鏡之句便叫紫鵑取出那塊玉來送還寶玉佩帶一時寶玉進來正要看湘雲們做的詩見紫鵑手內拿著通靈玉便接過笑對黛玉道這碰不爛的牢什子不是為了妹妹如何能到大荒山青埂峰下找他回來如今這件東西要算妹妹賞我的了説著麝月上去與他系好道你系上也該去告訴太太看看寶玉就往王夫人處去了黛玉看見那金線絡子想起鶯兒向麝月查問原來鶯兒服毒一事衆人都已知道因是黛玉吉期不敢在他跟前提及今見黛玉問起難以隱瞞麝月還怕黛玉見怪鶯兒支吾著不敢一直講出口來紫鵑已明白這件事便細細告訴了黛玉黛玉沈凝半晌不但不怪鶯兒而且重他有義氣就叫麝月去同了他來麝月才掀簾出去笑道史大姑娘同三姑娘來了兩個人進內坐下探春看見黛玉挂的金鎖走近去細瞧了一會探春早已聽見內裏賞賜金鎖一事今見一面鐫的字樣便問那一面又鐫的什麼字呢黛玉伸手把金鎖疊轉給探春看了探春稱異黛玉怕他們取笑趨步仿照鐫刻便説明這就是娘娘賞下來的湘雲也看與寶玉這塊玉上字字相同笑道林姊姊你不表明來歷免不了人家説你是抄襲舊文呢正説笑間見玉釧捧了一盤金鎖就是鳳姐帶來回聘之物王夫人見寶玉帶了玉去記起金鎖叫玉釧拿來送還黛玉黛玉見玉釧細瞧他行動舉止又想起他姊姊的話便動了個垂青之意叫紫鵑陪到那邊屋裏坐坐雪雁自去接了金鎖收拾探春見了正想探問來由麝月已同鶯兒來了探春湘雲各自走散鶯兒自向黛玉磕頭道喜黛玉見他面容慘淡眼帶淚痕心上甚是可憐他把好言勸慰一番叫他挪了過來別孤孤淒淒的一個人在那裏儘管傷心那鶯兒並不是個糊塗人雖然痛他姑娘卻不能怨恨到黛玉身上今見黛玉如此待他也甚感激便改口叫奶奶道我來服事奶奶願意就不願伺候別人奶奶這裏難道短了我這個丫頭也不過可憐著我我求奶奶説個情送我到一個地方去就感戴不盡黛玉道你想到那裏去呢鶯兒道我要去跟四姑娘黛玉已明白鶯兒心事便道你要跟四姑娘不難且到這裏來住幾天等我和四姑娘説了叫你過去就是當下叫老婆子跟鶯兒去把他的東西搬了來説不要你伺候別人間著到園子裏去逛逛再撅些柳枝子來編幾個花籃給我瞧瞧鶯兒笑笑引著老婆子去搬他的東西只得權在瀟湘館住下講到鳳姐這裏忙過了幾天便趁空兒把黛玉的妝奩簿細細查對因一應器具箱只物件瀟湘館安置不下什麼物件該歸什麼地方的逐一注明號數登記準奩銀十萬兩五萬寄在庫上吩咐且不用去支動其餘是銀樓上彙的銀票共有十幾張要去照一照票的一千畝奩田的契紙都已稅過田在南邊連各租戶的租券並看莊子的家人花名册亦在其內等回明王夫人再送到黛玉處自行經理正在忙亂寶玉由王夫人處轉到鳳姐屋裏笑嘻嘻的在衣襟上摸出這塊通靈寶玉叫道姊姊你送去的東西又帶在我身上了鳳姐瞧著笑道這可該謝媒了呢寶玉道自然該謝姊姊就是有一件事不得明白言明瞭再謝鳳姐聽了不知又要牽扯他頭裏幹錯的什麼事便膽忒忒的問道還有什麼事你不明白寶玉道寶姊姊同林妹妹兩個人都是從小和我玩笑慣的先前娶了寶姊姊來就不會説話了如今林妹妹也是這樣難道做了一個女孩子總要過這一個不會説話的關嗎鳳姐撲嗤的笑道林妹妹還妝新呢寶玉道見了熟人也要妝新嗎為什麼和史大妹妹三妹妹這一班人又不妝新呢我倒還要問姊姊一句話姊姊在家裏時候和我們璉二哥哥是不大見面的姊姊到這裏來越發該妝新了到底幾時才和璉二哥哥説話呢鳳姐臉上一紅道寶兄弟你問出這樣話來叫我怎樣對答你呢你還去問你林妹妹罷平兒在里間屋子裏聽了走出來也和寶玉耍笑了兩句寶玉自覺沒意思訕訕的走開自回園子裏去鳳姐向平兒道你看官也做了還是這麼傻怨不得傻出奇奇怪怪這些故事來我想起先前的事原白使的心計太重了就一個人兜攬起來都算我的錯如今把石沈海底似的一個林姑娘原是我去撈了起來交還了寶玉沒有對不住林姑娘老太太跟前也可以贖罪了我的罪名就只死的苦了一個寶姑娘活的苦了一個姨太太也都是前世的一劫不用講他看咱們這個地方將來也難站了寶玉的喜事算有了老太太這一宗支撑過來了擱不住後手不應上年年底下老爺在任打發人來要銀子二爺急的什麼樣似的我看不過沒法兒把我的墊了下去二爺説暫挪個窩兒如今丟到爪窪國裏去了再蹦出什麼事來我還有嗎難得林姑娘來了這裏的事怕他還辦不了千里搭長棚沒有不散的筵席不如回到那邊受大太太的熬煎罷平兒道林姑娘家拿來的不少可以有個通挪鳳姐道你説出好話來了林姑娘的陪嫁肯放在公中使用嗎就便有個挪移也等到三年兩載林姑娘實在自己看不過去憑他發心這會子還是簇新新的媳婦咱們現站在這個地方掉了牙去和他開口平兒道這幾天我沒有見林姑娘的面瞧不出他光景上年要回家的時候看他這一場病回了過來全個兒不是頭裏的脾氣了鳳姐搖頭道未必林姑娘是有心機的人你們那裏瞧得出他來呢話未完只見王夫人屋裏的小丫頭進來道太太在老太太那裏請二奶奶過去看林姑娘送老太太的禮呢鳳姐便把炕上料理未清的東西交給平兒忙到賈母處一路笑了進來道太太叫我來看林妹妹孝敬老祖宗的什麼好東西説著便看見擺的西藏赤金無量壽佛一尊八寶嵌鑲盤螭壽星拐杖一根東珠佛頭珊瑚念珠一串金玉如意四支三藍顧繡西池蟠桃赴會福色哆囉呢炕幔一挂刻金五彩妝蟒朝服一襲朝裙一條七襄天孫錦四端鵝黃湖皺四聯紫絳羽皺四板內造佛青寧綢八端鳳姐笑道這是林妹妹的孝心也難為他嬸娘配搭這些好東西出來有了錢一時也沒處找呢賈母道我也不希罕這些東西就這林丫頭家去了又來做了我的孫子媳婦孝敬我的我看了很歡喜自然他婆婆那裏也有的了王夫人道林親家太太也多禮了送的金鍾玉磬兩架七尺珊瑚一枝羊脂玉連環供璧兩對百福盤金猩紅大呢炕圍一條餘外同老太太一樣的賈母道林丫頭先前住在這裏你做舅母的也疼了他幾年如今做了他的婆婆該盡他一點子孝心我算他後兒該回九了怎麼辦法呢王夫人道這件事同璉兒媳婦商量過正要回明老太太林姑娘家裏遠新宅子裏又空空的沒有他一個親人住著不如叫班戲子擺幾桌酒就在咱們家裏熱鬧一天老太太看好不好賈母道也使得接連聽了好幾天戲人也乏了我聽説林丫頭家裏帶來一班小清音叫他們就在林丫頭屋子裏寶玉同他姊妹們玩一天就是了話未完小紅走來悄向鳳姐道寶二奶奶打發人來送禮平姑娘請奶奶回去呢賈母問他説什麼鳳姐道這是當不起怎麼連我們那裏都送起禮來賈母笑道你是個大媒送的禮越發比咱們該豐盛些才是鳳姐道老祖宗説起謝媒倒有一個笑話講給老祖宗同太太聽呢於是把寶玉講的女孩兒家總要過不會説話的一關這些話前前後後統學説與賈母王夫人聽了都笑起來因見小紅還站著不走賈母便叫鳳哥兒回去把林丫頭送的禮收了打發來的人走罷鳳姐同了小紅回去王夫人自陪賈母説話再講寶玉自鳳姐處回到園中正要往紫菱洲找湘雲説話頂頭碰見紫鵑帶了兩個老媽子走來寶玉便問那裏去紫鵑答道姑娘叫我去送禮呢寶玉道送禮為什麼叫你去呢紫鵑道那是送妙師父的寶玉道你姑娘又幾時與妙師父交往起來紫鵑笑道怪道頭裏的事你一些兒也不得知道上年姑娘回家妙師父還同史大姑娘們替姑娘餞行送姑娘的人回來姑娘送過妙師父好些東西史大姑娘們統有的還有送你的你見了沒有寶玉歎口氣道你姑娘家去送我的東西人家肯給我瞧嗎紫鵑道這倒不是人家不給你瞧那時候你已經走了我問的是你回來見了沒有寶玉道也沒見呢你姑娘送我的是些什麼東西呢紫鵑道我沒有瞧見也不過南邊的土儀不是麝月與秋紋替你收拾著去問他們就知道了寶玉道我還有許多話要問你説著就來拉紫鵑的手不知紫鵑怎樣光景寶玉有何話要問紫鵑下回分解
