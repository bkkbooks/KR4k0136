body:
  text: 第十一回痛郎削髮潑藥輕生憶主傷心擁衾敘話説話寶叉聽了傻大姐的話雖不十分仔細做和尚三個字已清清朗朗的入耳因寶玉出門不歸寶叉只防他去走這條路今聞傻大姐之語觸動心病一時魂魄驚飛竟似林黛玉在沁芳橋聽見寶玉娶寶叉的話一般樣光景便略略按定了神叫住傻大姐問道你為什麼知道寶二爺去做了和尚呢傻大姐瞅著寶叉笑道沒有的事我和奶奶説了又嫌我搬嘴他們要捶我呢寶叉道剛才你説的話我都聽見了這會兒你和我説我再不告訴別人你不説我就去告訴你姊姊仔細挨捶罷傻大姐呆了一呆便説道剛才琥珀姊姊叫我到玉釧姊姊那裏要這髢發玉釧姊姊又給我兩支花兒我在太太院子裏見林大娘手裏拿了寶二爺剪下的頭髮還有穿的衣服進太太屋裏人家説寶二爺去做和尚了太太在那裏哭呢後來我還站著彩雲姊姊攆我出來叫我不許多嘴寶叉不等傻大姐説完頓時神魂飛亂急火攻凡噴出幾口血來眼前一陳烏黑昏暈倒地嚇得傻大姐轉身便走接著鶯兒同臻兒從鳳姐處出來看見趕忙來把寶叉扶起寶叉已漸漸蘇醒過來搭在臻兒肩上鶯兒見寶叉面色如灰腮頰上尚有血迹忙拿手帕子給寶叉揩抹淨了扶著慢慢走回屋裏鶯兒便問姑娘怎麼著寶叉道我一時心裏不好過起來讓我躺躺去鶯兒便把枕子墊高一面叫小丫頭倒了半盞溫茶來送過寶叉唇邊嗽了口小丫頭接去茶盞鶯兒扶寶叉睡下早有襲人麝月等知道急忙趕來見寶叉臉上氣色改常襲人明知寶叉為寶玉傷心但不致忽然著起緊來當著寶叉又不便盤問鶯兒鶯兒亦不敢告訴襲人惟有四目互相覷視默然無語半晌寶叉睜眼望屋子裏一瞧問臻兒沒有回去嗎麝月便推臻兒過去一面介面道臻兒在這裏奶奶有什麼話吩咐他寶叉道這會子我也沒有什麼話説叫他回去太太跟前少説話沒的他老人家知道了又著急鶯兒在旁便把寶叉的話又叮嚀了臻兒幾句臻兒自走了襲人走近炕前問寶叉道奶奶身上不爽快嗎寶叉閉著眼點點頭襲人知道他嫌煩便走出房來趕上臻兒問道奶奶為什麼忽然這樣起來臻兒一路走著答道我和鶯姑娘從平姑娘屋裏出來走到穿堂裏見寶姑娘跌倒地上傻大姐在面前飛跑的走了也不曉得為的是什麼姑娘你去瞧瞧説著拉了襲人走到寶叉跌的所在指與襲人一看襲人吃驚道這還了得當下叫臻兒快些回去別忘了姑娘的話我告訴璉二奶奶去叫快請大夫呢臻兒走了襲人獨自一個站在那裏看了拭淚心想大凡鬧出來的事再離不了傻大姐仔細想起來比不得先前的事況且寶姑娘是個明白人斷不至聽了傻大姐的話就認真當一件事怎麼樣起來一路思想往鳳姐處見林之孝家的正在那裏回道門上這些人在外頭打聽都説沒有知道這個地名又問程日興相公們也不知道且翻著什麼廣輿記不知查得著沒有還到工部裏去吊齊了各省輿圖細細再查只怕也未必查得出來呢襲人聽説估量著為尋寶玉的事等林家的回畢了話便把剛才看見寶叉的光景告訴了鳳姐叫人快請醫生去鳳姐便吩咐林之孝家的趕忙叫人去請王太醫你回的話我先去回了老太太太太等二爺回來再商量林之孝家的答應退出鳳姐向襲人道這件事自然瞞不得寶二奶奶也要説得委婉些才好不知道又是那個快嘴大驚小怪的去嚇了他才這樣的襲人道剛才臻兒説起他和鶯兒見傻大姐不知和寶二奶奶講了些什麼話呢鳳姐道這又奇了傻大姐又怎樣知道小紅在旁邊道林大娘進來的時候傻大姐也在院子裏呢鳳姐聽了著急道可不要在老太太跟前有的沒的傻出些話來可了不得襲人聽了一面還聽不出傻大姐説的是什麼事正要細問鳳姐只見平兒進來回道太太也在老太太屋裏叫奶奶立刻過去呢鳳姐連忙站起身來向襲人道你快回去鶯兒到底年紀小麝月秋紋這班子人是靠不住的停會兒大夫來叫蘭哥兒陪了進去説著自往賈母處去了襲人便向平兒盤問平兒把寶玉出家送回東西來的話和襲人説明襲人一時痛苦不減於寶叉因當平兒面前勉強忍住回到自己屋裏抽抽噎噎的哭了一回且説鳳姐來到賈母處先把林之孝家的回的話告訴了賈母説等查出了這個地名再來回明老祖宗賈母點點頭又問璉兒回來沒有鳳姐道剛才回來姨媽家裏叫去不知商量什麼要緊話老祖宗要叫他就打發人去賈母道既然姨媽家裏有事這會兒且別去叫他我才和你太太説過咱們上緊去查這個地場一則人家也不放在心上二則就查著了倘若今兒在那裏過幾天又到了別處白不中用不如吩咐他們趕緊多寫幾百張招貼上面寫明寶玉年貌住址姓名有人找著送他回來給他多少銀子通風送信的人減半給賞人家看見貪圖發財自然分路各去找尋比咱們打發出去的人更上緊呢璉兒回來你就告訴他鳳姐應了一聲是王夫人在旁介面道老太太吩咐自然叫他們照著辦但我想頭裏失了玉不是貼過賞單真的沒有影響倒叫他們弄了假的來胡鬧賈母道你別糊塗玉可以弄得假的難道人也可以弄出一個假的來嗎果然有人找了寶玉回來鳳丫頭你聽這宗銀子也別叫動官中的你太太折變不出我那裏還有幾件子東西呢你們可記得上回賞單上寫的多少鳳姐道上回寫的送玉者賞銀一萬送信者送銀五千賈母道論理起來人自然比玉更矜貴些如今説不得只好照舊寫罷哩鳳姐聽了賈母吩咐忙回來問平兒道二爺回來沒有平兒道二爺在廳上陪王太醫呢原來外邊請到王太醫因賈璉如今未便陪進寶叉屋裏早叫賈蘭候著一面老婆子傳説大夫到了鶯兒上前回明寶叉寶叉不叫診治襲人在旁再三勸説寶叉勉強聽了他的話王太醫與寶叉診了脈足有半個時辰然後退出至廳上坐定開方自與賈璉細談病症而去賈璉走進裏邊鳳姐忙問王太醫怎麼樣説賈璉搖頭道王太醫雖然沒有講到十分決絶的話聽他口氣説是竟像頭裏林姑娘的脈氣很難治呢鳳姐道既然像林妹妹就可保無事了賈璉道我何曾不是這樣問他王太醫説先前園子裏住的這位小姐病重的時候論脈氣已萬無生機及至回了過來復去診視截然似換了一個人的脈他也從來沒有經見過這種病症説不得是醫藥調治之功如今這位奶奶除非也有意外之望才能保得平安鳳姐道到底開了方子沒有賈璉道方子是勉強開了一個他説不過盡人事罷哩還不敢擔承叫再請高明斟酌鳳姐道我不信寶妹妹平日氣體壯健比不得林妹妹生來單薄才吐得幾口紅便説得那麼樣凶險就只要寶兄弟早一天回來自然一角安四角安了你到底知道那一處有個叫什麼大荒山青埂峰賈璉道你倒問的奇無影無蹤的話人家都不知道我就知道嗎鳳姐道老太太叫你照著先前找玉的賞單多寫幾百張趕緊去貼呢賈璉道可是老太太的話哩若講寶兄弟是榮府裏出去的又是新科舉子人家看見了敢把他藏起來嗎旁人去找得著咱們打發出去的人也找著了不比得那塊玉偷偷摸摸拿去賣給人家或因愛這一件罕物想要瞞昧起來必得多許他銀子才起眼便肯拿來送還咱們鳳姐道這塊玉在咱們家算件寶貝人家要藏起來做什麼不過當一件玩意兒東西留著估量值這一萬兩銀子嗎也不過聽著老太太辦罷哩賈璉道那倒別講這話像石呆子精窮一個人他的湘妃棕竹扇子還他一千兩銀子一把不肯賣呢如今別説間話外頭的飢荒正打不了比如寶兄弟本來自己要回家那些人見了賞單便因風吹火兒拉扯著混説是他們去找著送回來的揭了賞單立逼著要兌銀子你那裏現成嗎鳳姐道啐我有銀子你早變法兒來鼓搗了那倒不要你著急老太太有這句話太太那裏折變不出老太太預備著呢賈璉道既然有老太太不心疼的銀子要寫十萬兩的賞單也不難賈璉立起身來就走鳳姐又叫住道姨媽的病可好了些嗎剛才叫你去説什麼可提起寶姑娘的事沒有賈璉道姨媽的病已好了些為的是薛老大的官司也沒有什麼要緊話今兒寶兄弟的事情他老人家早已知道的了寶妹妹身上不好過我也回來碰見大夫才知道的賈璉話未完鳳姐便催著他道快去幹你的事去罷我點給平兒送太舅爺家的生日禮還要過去看寶妹妹呢不表鳳姐這裏的話且説紫鵑在櫳翠庵聞知寶玉中舉後忽然失走便到稻香村來看李紈為由暗暗打聽這件事李紈因寶玉不在家裏諒無妨礙可憐紫鵑一個人在櫳翠庵孤淒冷靜便打發人去告訴了妙玉留紫鵑住下紫鵑鎮日牽腸挂肚思想回南又因寶玉這一走心裏想道或者他病好了到底撩不下姑娘所以瞞著衆人私下找尋到姑娘家裏去了也論不定但是他從來沒有出門憤的遠隔幾千里路獨自一個人怎麼能夠找尋去呢倘或路上有個閃失如何是好紫鵑這幾天來又換了一副心境半驚半喜心上總不得安穩今日見李紈過去了一天到晚上還沒有回來不知為寶玉沒有資訊在那裏商量打發人去找尋呢還是寶玉回來了老太太太太大家歡喜留著講話專等素雲回來探聽個信兒一個人在燈下呆呆坐著再講李紈在賈母處吃了夜飯又到寶叉屋裏坐了一回回至稻香村已交三鼓賈蘭把陪王太醫並王太醫講的寶叉病緣都告訴了李紈素雲伺候李紈母子睡了來見紫鵑便笑問道你這幾天倒像越發有了心事了這樣冷天氣為什麼不到被窩裏暖和去一個人坐著間打牙兒紫鵑道夜很長呢橫豎睡不著你和奶奶也沒有回來今兒那邊有什麼事整整去了一天素雲道我告訴你一件事寶二爺今兒有信回來誰知他竟剃下頭髮去做和尚了穿出門的衣服連頭髮都寄了回來寶二奶奶聽見了這句話嚇得死去活來現在請王太醫叫蘭哥兒陪著瞧呢紫鵑聽到寶玉去做和尚一語吃了一驚不覺情現乎色素雲瞅著紫鵑道這又奇了你又不是襲人為什麼也這樣著急起來紫鵑沈下臉來道混咇些什麼怎麼把我比起襲人來素雲笑道好姊姊別生氣我有一肚子話在這裏統告訴了你罷你快把被窩攤好剛才園子裏的西北風刮得我臉都凍僵了到炕上去暖和著講給你聽説著二人上了炕素雲便道看起來寶二爺今番去做和尚總為的是林姑娘你不知道先前定寶姑娘的事大家瞞著他的後來娶親時候怕他不依哄他娶的是林姑娘拜堂後揭去蓋頭巾看見不是林姑娘寶二爺正病著一半明白一半糊塗還鬧個翻江呢紫鵑道後來他病好了為什麼不聽見説要去找林姑娘呢素雲道怨不得你是蒙在鼓裏頭過日子的寶二爺是只知道林姑娘已死過的了就沒一個人告訴他林姑娘回家的話所以如今鬧出這件事來呢紫鵑怔怔的聽他説完竟如夢方醒連聲歎氣道他們幹的事也太狠了聽你這麼説來連那一件事我也明白了素雲道還有什麼事紫鵑道這會兒也不必説他我要問你既是知道這些事情為什麼早不告訴我呢素雲道我頭裏也不過聽著些風言風語不得很明白況且林姑娘回家瞞著寶二爺的話上頭囑咐不叫你知道如何敢提這話呢如今和你説了別再告訴人家紫鵑一面拭淚道你聽聽這樣喪心昧良的事叫我怎麼樣不替林姑娘傷心敢仔你又要笑話我呢素雲道別再説了我身上也暖和了睡覺罷素雲先自睡了紫鵑一個人仍和衣躺在炕上前前後後的事如轆轤一般在心頭轉動想寶玉到底去做了和尚他原不負林姑娘也不枉姑娘素日這番用心但只姑娘如今現在可恨這班子狠心人瞞得寶玉鼓樣似的緊拿定沒有林姑娘這一個人寶玉便一心一意守著寶姑娘偏料不到有這樣事鬧出來別人固然沒有什麼好處姑娘的事情又怎麼呢又想寶玉雖然願意出家老太太太太必不肯依一定要變法兒弄他回來知道他要出家的心事自然有個調度但不知姑娘打的什麼主意紫鵑這夜的心事真是千回百轉直到天明沒有睡著講到寶叉這裏天天延醫看治因王太醫已經回絶另請鮑太醫也是束手那邊賈珍聞得張友士又進京來素信他脈理精細推薦過來看了兩回説的也是王太醫鮑太醫的話不敢擔承寶叉又不肯好好服藥竟像林黛玉絶粒捐生的光景王夫人與鳳姐等十分著急一日鴛鴦過來看了寶叉襲人便招他到自己屋裏坐下問道你瞧我們奶奶的光景怎麼樣鴛鴦搖頭道不好呢你瞧天天幾個大夫進來看治吃藥下去沒一點子鬆動似乎精神越發痿頓了襲人歎道你還不知道他何曾肯好好的吃了幾劑藥我們幾個人輪流煎好了去伺候就把我們支使開了把藥都潑在火盆裏不知他安的什麼心鴛鴦道果然是這樣也沒法兒了襲人又湊近一步悄悄的説道還有一件事要告訴你璉二奶奶倒一天幾趟的來看奶奶我瞧奶奶近來竟像有些厭惡他的光景倒教我解不出來鴛鴦微笑道這個我也猜不透只怕還是你奶奶懈怠説話所以是這樣冷冷的也不定有什麼別的意思襲人道那也是一句沒要緊的話我聽見老太太叫璉二爺寫了許多單子有人找著二爺回來給他一萬兩銀子那一個不上緊去找阿彌陀佛但願二爺早一天回來我倒情願替二爺出了家鴛鴦笑道你既要出家也不必盼你二爺回來趁這會兒去做了姑子好去伺候和尚呢襲人紅了臉道咱們從來沒有取笑過的為什麼你也説起我來鴛鴦道你別著忙寶二爺出了家倒有個著落便容易找他回來就耽遲三頭四個月也沒要緊倒是勸你奶奶好好的服藥調理是正經襲人道好姊姊你見了四姑娘只説是老太太的話叫他再去問問妙師父二爺出家這個地方到底可找得著嗎鴛鴦隨口應道我見四姑娘叫他去問就是了一時鴛鴦起身走了再講到寶叉的病日重一日王夫人天天過來瞧他不過講些寬慰的話説老太太已叫你璉二哥哥寫了幾百張招單許了重賞附近各處已貼遍的了這幾天裏頭總有些消息我的兒你安心保重老太太很惦記你呢寶叉聽了勉強笑道老太太和太太可是疼我的我還沒有好好的孝順一天不想寶叉説到這裏就咽住了禁不住落下幾點淚來王夫人見了頓時眼圈兒一紅一面拭淚又安慰了寶叉幾句囑咐鶯兒秋紋這一班人小心服事自回房去了停了一回小丫頭來回姨太太來了寶叉聽説他母親到來不覺一陳心酸淚如雨下不知薛姨媽到此母女相見如何光景再看下回分解
