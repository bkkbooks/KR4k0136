body:
  text: 第四十八回過除夕了結絳珠緣撕改册驚醒紅樓夢話説黛玉要把各人的詩請教社外人評閲湘雲指出一個人來大家問他是誰湘雲道就是我和瀟湘妃子在卷篷底下聯吟他來續完三十多韻五律一首的檻外人寶玉拍手道果然想的不錯既是那麼要一手謄了出來不必提明那一首這一首是誰的就這二十六首詩秉公定了甲乙看誰的壓卷湘雲道我猜妙師父評起來還推薄寒這一首為全璧黛玉道你的細雨收這兩句用梅花詩定有詠花人五字想要拍到細雨上甚難下句忽接春帆二字竟把細雨直擡出來同邢大姊姊緑苔第三聯一樣皆用成語卻極自然可謂神妙直到秋毫顛了寶玉道史大妹妹的坐久香清夢回林靜一個篩字一個逗字直把疏籬刻劃入微也敵得住了就是紋妹妹的幸不折來四字用杜少陵看梅詩恰好接上竹報平安巧也巧極寶琴道二哥哥的一枝春壓翠雙翹還不出色嗎探春道便宜了二哥哥偏留這個他得意的題給他香菱道你們要寫我就帶去明兒早上可有了黛玉道忙什麼你去消消停停寫就是了認真像舉子入了場要緊看榜嗎當下丫頭們收拾開了筆硯管家媳婦上來安放杯箸各人隨便坐下黛玉先笑道我有一句話告訴枕霞舊友昨兒鬧了一天今兒又接下去攏了一社擾了你的東也算盡興的了可惜借東風的人倒沒有在座衆人聽了一笑黛玉又道這會兒再要猜枚行令鬧這些討人厭的事可不能遵教的了湘雲道不借此消消長夜你趕緊回去到底有什麼幹既是你厭煩這個可叫清音女孩子來唱幾支昆曲這樣冷靜酒可吃不慣衆人都道這倒使得一時喚到慶齡遐齡這班人來斟酒唱曲暢敘盡歡又在席上取各人做的詩互相評論一番約交二鼓已散了席書不冗敘香菱次早起來便把二十六首詩端楷謄清交與黛玉打發老婆子送到太虛宮去了這裏寶玉連日又到天齊廟走了幾趟至懺事圓滿完了心願看看殘冬將盡榮府料理過年大小一切事務正在忙亂所有發給族中銀本陸續發運開張除承領總數已經結算外尚未送到支用清册若起造太虛宮及彩飾宗祠房屋工料細帳濟貧四局支銷費用須逐一查對找發又添了許多莊子上完納租稅也要查銷發給各倉廒上分別收貯還有北靖王南安郡王樂安郡王永昌附馬錦鄉侯臨昌伯及諸王親蔭襲勳戚世交平日來往文武官員仕宦之家以至親友宗族皆須查照饋送年禮舊規從豐備送榮禧榮慶堂各院落堂屋書房賈母王夫人處及園內瀟湘蘅蕪怡紅三院嘉蔭堂綴景閣秋爽齋紫菱洲並常有人坐落之處添換燈彩鋪墊早有經管家人媳婦開單回明鳳姐置備領價家孰代儒束門客相公詹光程日興王爾調單聘人蔔固並各夥計勞金分別查明找送廚房買辦及各行當領帳過年家人媳婦老婆子丫頭小廝們賞賜亦須按照預備給發諸如此類年前應辦之事不下幾千百件鳳姐與平兒兩個振作精神盡心辦理每夜熬至更深毫無倦意不比先前這一兩年多病心煩苦於支援獨有寶玉給假在家清間無事外邊不是十分要緊地方亦不出去應酬惟天天到賈母王夫人處請過了安只在黛玉寶叉並晴鵑鶯襲這幾個人屋裏玩笑適情有時也到紫菱洲秋爽齋與湘雲岫煙探春姊妹敘談一日到湘雲處見剪了滿桌的五色碎絹寶玉笑問道你們在這裏做什麼岫煙道老太太留史大妹妹在這裏過年前兒打發老婆子到他家去告訴這句話他嬸娘已應許的了他高興起來要我和他扎百花燈明年過燈節玩兒還要你們大家從他的興呢寶玉聽了喜之不勝道我也想玩這個便叫翠縷去瀟湘蘅蕪請兩位奶奶同三姑娘大奶奶屋裏兩位姑娘都到櫳翠庵去説我和你姑娘同邢大姑娘都在那裏等著呢湘雲道為什麼要到四妹妹那裏去寶玉道四妹妹靜守禪關前兒詩社裏都不肯隨興咱們偏要去鬧他説著便催同走當下三個人來到櫳翠庵見惜春煮茗圍爐炕桌上攤了一張本色紙入畫在旁研墨在那裏白描除夕賣呆圖湘雲道四妹妹倒先在這裏寫應時景的畫幅了惜春擱筆讓坐不多幾句話早見寶叉黛玉李紋李綺探春陸續都到湘雲笑道你們瞧發符召將也沒那麼快翠縷算是二哥哥一員旗牌令箭傳去兩位奶奶火速的趕到轅門聽令了寶叉道我們只道四妹妹這裏有什麼商量的話所以就趕了來到底你們又要幹什麼呢寶玉道剛才我見邢大姊姊史大妹妹在那裏扎百花燈咱們各人想出一件來預備明年鬧元宵衆人聽了也都高興李綺道邢大姊姊扎百花燈我扎雙鳳雲中扶輦下六鼇海上駕山來賽他寶叉道我扎四十匹竹馬叫小丫頭們騎了串馬燈黛玉道我扎四十座燈檯閣扮的安福門宮女踏歌樂昌宮主破鏡重圓白馬馱經青藜照讀這些故事都要本地風光探春道我去定制幾十架煙火助助你們的燈興李紋道你們都在陸地上玩我要玩到水裏去扎幾百盞荷光燈從荇葉渚一帶放下去也不教寂寞了碧水寒流寶琴道我還要玩到天上去大大小小糊起幾十個風箏來帶上彩燈把風箏放高了連園子外頭的人都瞧見呢寶玉笑道都被你們想了去叫我換出什麼樣兒來呢探春道人家費了多少心思力氣鬧起這些玩意兒來二哥哥現現成成瞧熱鬧倒不好嗎寶玉道到底自己也要想出些玩兒來我記得娘娘省親那一年正是燈節園裏頭樹株枝上都有點綴如今叫他們見什麼樹就扎什麼花綴上剪綵為花縷絲作柳其間顔色紅緑相映好比羯鼓一催百花齊放較那一年還要新奇異樣才有趣呢話未完李紈到了原來李紈因惜春這裏邀了衆姊妹過去以為罕事走來一問衆人告訴他緣由寶玉便要李紈也來隨興李紈道我是稻香村本色就在門前扎些田家樂故事燈罷了黛玉道史大妹妹何必自去動手你縱有巧思也要費工夫像你這樣玩起來不是取樂竟是討苦吃了只要大家出個主意我和二嫂子去説一聲叫扎燈匠依樣做起來什麼燈彩不齊備呢大家都道這樣簡截寶玉見惜春靜坐不發一言便道四妹妹庵裏也該布置些什麼請老太太來瞧瞧別太孤寂了惜春道一定要瞧我的明年元宵等你們盡了興到庵裏來我便仿葉先師故事結起一座虹橋同你們上橋赴廣陵一遊衆人都疑惜春謊言惟有黛玉半信半疑道四妹妹果然顯出仙術帶挈我俯覽蕪城風景好比又回了家鄉一趟感不勝言寶玉也歡喜道四妹妹果然比衆不同把他們的都賽下了湘雲道你們自上揚州我在園子裏玩我的燈這裏衆人還坐著講些間話寶玉便當一件正經事趕忙出了櫳翠庵來到鳳姐處告訴了要鳳姐也隨他們鼓起興來鳳姐道唉呀呀原算你們會樂你不瞧瞧攤了一桌子天天一個三更虧大嫂子不來幫幫我倒同你們鬧起這些來正説著院子裏老婆子報道東府裏大爺過來了一時賈珍走進鳳姐與寶玉連忙起身讓坐賈珍見鳳姐正在查算帳目兩個小丫頭手裏捧了兩絡子帳本站在旁邊平兒也幫著核對便笑道我知這幾天妹妹忙壞了鳳姐道過年的事按著老規矩倒不費什麼前兒大哥那邊送來的彩飾祠堂工料帳知道是大哥經手的不用細查不過瞧了瞧後邊總結就撩開了這裏頭局同工程上的支銷帳不能不細細查一查也差不多清楚快了賈珍道那邊的工費都是我同蓉兒親自料理他們也不敢浮冒我先核了一核駁正了才送過來的鳳姐道近年來大哥那邊事情也忙又纍大哥多費這一番心正是前兒蓉哥兒到禮部裏領出來的春祭銀兩老太太説橫豎要大哥經手辦的往後領出來就留在那邊不必送過來賈珍笑道老太太原是優恤小輩要省事的意思我叫送過來也不過要他老人家歡喜瞧瞧著皇恩永賜四個字既是老太太那麼吩咐底下領了銀子來告訴一聲就是了鳳姐又道今年莊子上來的野味分了許多過來別那邊不夠分派賈珍道那裏的話烏進孝這老頭兒自己也不來因是今年的收成足有十分租籽也完得好送的禮更豐盛咱們族裏這些人往年等不到繳租籽的時候先猴頭吊頸的進來打探了幾趟今年到如今還有好幾家子沒來領再等幾天只好打發人送去完畢了這件事好過年今兒這來有一句話同妹妹商量好多時沒有請老太太太太同妹妹們過去坐坐一來因這裏的事情忙又想不出什麼新奇玩耍不過外頭去叫一班戲進來就是這幾出戲也瞧熟的了前兒在老裘家赴席見一班跑馬賣械的女孩子人都長得乾淨他們對跑換馬又在馬上耍的什麼丹鳳朝陽黃鶯穿梭這些牌兒名還有翻雲梯上高竿十錦雜耍比瞧戲新鮮一點那邊桂香廳箭道子裏頭先前寶兄弟在那裏射過鵠子的馬也跑得開大家過去樂一天不知老太太賞臉不賞臉妹妹這裏的事暫且擱得一天賈珍話未完寶玉介面道我在外邊也聽説這一班果然大哥哥想的到的老太太一定愛瞧的鳳姐道只要老太太高興斷沒有不陪著過去的賈珍站起身來道我過去見見老太太説著便同寶玉到賈母屋裏去了賈珍才出去賈璉進來道咱們老爺升了任上還有書子來我去見了老太太回來再説話賈璉便往賈母處來與賈母叩喜道孫子剛才在吏部裏頭聽見軍機處有信出來老爺升了河南臬司接到廷寄就要進京陛見扣算日子起來趕燈節前可到老爺任上還有書子説著向懷裏掏出先念了賈政與賈母請安稟帖再將家信念與賈母聽了信內的説話家中可喜之事備已知悉皆賴祖宗福蔭所致不可因手頭寬裕任意驕奢寶玉給假在家慎勿以遊嬉為事荒廢詞章時下外官州縣難做將來朝試散館一放外任伊年幼無知甚為可畏等語賈母聽了道老爺信內為什麼不提進京的話賈璉道老爺發信在先還不知有升轉一事所以未曾提及賈母點點頭賈璉又笑向寶玉道寶兄弟可聽見了嗎寶玉聽賈璉念家書説到訓飭他的話早已站了起來此時賈璉提了一句只得應了一聲聽見的了賈珍在旁介面道論寶兄弟的學問也斷不至此況且聖恩優渥知他年輕未諳民社一定多留在瀛署多年易於升轉那是老爺的過慮賈母聽了歡喜道正是珍大哥你的寶兄弟也算虧他的了他老子自己任上的事情也繁何必這樣操心兒孫自有兒孫福不是我自己説這句話如今算起來壽也有了福也享了我歡喜的孫子重孫子都中舉做了官了不遂心的事都遂了心了家裏意外的喜事也瞧見了仰賴上蒼保佑皇恩祖德天高地厚還要盤算什麼只顧樂我的就是了你今兒來請我過去瞧跑馬賣械算起來年底裏也沒有日子了過新年再瞧罷賈珍應了一聲是又和賈母説了幾句話然後站起身來退了出去賈璉寶玉都送了賈珍寶玉自回園子裏來間話少敘連日就有親族交遊到來賀喜賈璉支應非寶玉的同年至好也不出去應酬只躲在園裏頭玩耍一日間步到紫菱洲來見黛玉寶叉先在那裏瞧湘雲扎燈寶玉道鳳姊姊已分付叫外邊燈彩匠趕緊扎去你又在這裏忙什麼湘雲道我知道橫豎盡間在這裏我是扎幾盞來玩我的聽見珍大哥也傳了精巧匠人在那裏扎燈請老太太過去瞧跑馬賣械自然咱們都要跟著去的我一天盼一天過了年好瞧熱鬧黛玉笑道我也盼四妹妹帶挈我上揚州呢寶叉道瞧你們高興到那時候偏偏老爺回來了寶玉道只要老太太高興請了老太太來玩咱們的燈樂咱們的老爺回來陛見過了也沒在家耽擱的工夫那裏還來查察湘雲道咱們的詩妙師父為什麼留住了還沒送回來這裏打發個人去問聲才好黛玉道別去催他這會兒沒有送來一定他留情要和我們二十六首呢正在間話只見薛姨媽的丫頭同貴來找寶叉説大爺出了罪同二爺回家了太太叫我來告訴姑奶奶一聲才到蘅蕪苑四兒説奶奶找瀟湘館奶奶去了我到了那裏又找來的於是衆人都替薛姨媽歡喜黛玉道難得你大爺趕年前回了家你太太自然歡喜的了同貴道正是太太説新年裏就要擺酒請客梅家任上還沒信來三月裏先要辦香菱姑娘的喜事底下再辦同貴説到這裏瞅著岫煙又一笑縮住了口衆人都已理會獨有寶玉心上未免悵然以為咱們園子裏又少了一個知己姊妹寶叉因要問同貴的話站起身來先和同貴回蘅蕪苑去了寶黛二人又坐了一會然後回去時光迅速瞬眼已是除日清晨起來自賈母以下凡有誥命者皆按品妝戴入宮辭歲回來賈母先在自己院裏供了天地佛馬等寶玉入朝回府帶領他姊妹並邢王二夫人妯娌人等先在竈王前供獻已畢到宗祠家廟裏行了禮拜過影像回房歇息寶玉就在賈母王夫人處辭了歲又到各處一走吃了早飯外邊已經伺候出門揀幾個要緊地方親自一到趕忙回來見榮國府大門洞開門前車馬喧闐人聲雜遝都是來辭歲的官員紳士以及戚好世交寶玉躲在車內不及招接徑到儀門下車裏外懸燈結彩顯耀異常寶玉望聚錦門來進園中一路豎起矗燈兩旁樹枝上果有紅緑相間的點綴是花是葉巧奪天工衆媳婦丫環都已換上新豔衣裙粉香脂豔鬢影叉光目不暇給一時到了怡紅院小丫頭道姑娘們都逛去了寶玉因早上起來應酬了大半天覺身子有些乏了便一個人坐下心中歡喜想道照像今年過這麼一年光陰洵不虛度凡可悲可恨之事翻轉來都成了天下所無古今罕有的樂事不但事已如斯連所見所聞別人的事亦無不稱心如意有生若此竟不知離恨天為何物矣正在出神鳳姐處打發人來説老太太吩咐今年的合歡宴擺做兩處本家爺們來的不少席面擺在大花廳上叫咱們二爺同那邊珍大爺支應二爺和奶奶姑娘們就在綺散齋老太太出去近便些今年老太太分外高興定了兩班好戲還叫傳梨香院的女孩子都去伺候有幾十架煙火晚上放呢二爺快走罷寶玉把身上帶的表瞧了一瞧道時候也不早了今兒老太太高興起來多坐一會子咱們再瞧瞧燈火怕就該出去隨班朝賀的時候了不如趁這會兒打個盹兒當下和衣倒在炕上才朦朧合眼耳邊聽得有人喚了聲二爺似四兒的聲音睜眼一看卻是五兒遞過一本詩稿説是妙師父打發人送來的寶玉接過展開留心要瞧妙玉評的詩眼力何如五兒手裏又遞過一紙字帖兒道還有妙師父的名帖請二爺就到太虛宮去有要緊話告訴二爺呢寶玉便將詩本撩下瞧那帖兒上寫的太虛幻境妙玉拜寶玉看了心上狐疑道這會兒請我去講什麼話呢他向來自稱檻外人忽然又換了太虛幻境四個字心想到黛玉那裏告訴了這句話再去又恐黛玉阻止他便起身步出園來走至二門外不見小廝們獨自一個出了府門直行至太虛宮前見宮門半掩徑進裏邊過了牌坊見情天匾額下站一宮妝女子宛似從前曾見面浹洽的人料他必來款接忙趨步上前那女子反向寶玉叱問道何處俗物擅入此間寶玉見女子加以厲色逡巡卻步自覺赧顔只得俯首相告道我是來會妙師父的不知他住在那一個屋子裏望仙姑指引那女子答道這裏沒有什麼妙師父還不快走寶玉道明明剛才妙師父打發人去招我來的怎説沒有他呢那女子道這裏乃清虛飄渺之所説有便有説無便無縱然有他也未必肯出來見你你如不信儘管在此著迷莫怨耽誤你的事説著徑自走進把角門掩上了寶玉恍惚記起前日親送妙玉到此為什麼一時竟無處找尋他的居室這宮妝女子又是可處來的被他冷落心頭納悶信步行去進了一座宮院見牆下自己移植那棵淚草蔥翠依然正在注目凝思只聽隔牆送出一派歌聲字字清朗歌的是一個是閬苑仙葩一個是美玉無瑕只怕沒前因今生怎想遇著他畢竟有奇緣肯教心事成虛話從前枉自嗟呀到後何須牽挂撈起了水中月栽活了鏡中花眼中能有多少淚珠兒怎忍他秋流到冬春流到夏曲終人不見餘韻悠然寶玉聽了還要咀味其詞出神佇立忽見院門啓處步出一女子來似曾相識一時記不起是誰因才被宮妝女子呵叱未敢造次見那女子笑臉相迎迥非頃間落寞光景便向前作揖問道何處歌聲繚亮乃爾昔年似曾聆過此音那女子道詞調雖舊句義更新今被竊聽了去恐還未能明晰我感使者送劍之情不避嫌疑與君一面引你到一個地方去索性把曲中的前因後果都明白了説著便挪移向前寶玉廝跟在後轉彎抹角行來依舊到了配廡薄命司中那女子道這裏是使者到過的還把先前所看金陵十二叉正副册一瞧別的都不用看他當下揭了廚門上封條開取薄册出來翻開先將册上舊的指與寶玉瞧了再看改的寶玉看了大半有些會悟向女子央告道敢乞神仙姊姊借我紙筆抄那幾頁的詞句回去叫咱們園子裏姊妹大家一瞧庶不辜負了今兒這一番指示那女子沈思道已往之事也不怕漏泄天機那旁桌子上現有筆硯花箋你都録了去就是一面寶玉録寫仙女指道這便是正册上第一頁改分兩頁的看寶玉寫了又把看過這幾頁挨次指點明白寶玉寫就又道姊姊何不再引我到那未曾看過這幾司裏頭去瞧瞧仙女道古往今來普天世界的女子雖各人遭際結局不同總越不過匾額上的情天孽海四個字就是金陵十二叉裏頭這幾個人全虧太虛幻境的警幻仙子費了多少神力硬改了注定的册子才得椓燈復焰也只為完就絳珠仙子靈河岸上一段未了情緣其餘幾個人都是帶挈的何必再閲他司多牽情恨使者到此也有時候了速速回去罷寶玉無奈只得把抄的詞句揣在懷裏拜謝仙女離了太虛宮回家徑至怡紅院見黛玉寶叉湘雲迎春鴛鴦香菱晴雯襲人這許多人坐的坐站的站滿屋子裏鶯聲燕語翠族珠圍先是湘雲開口道我們都來給二哥哥辭歲丫頭們滿園子找你不見躲到那裏快樂寶玉道剛才妙師父送了咱們半仙閣的賞梅詩來湘雲不等寶玉説完忙介面道在那裏快拿出來給咱們瞧瞧妙師父怎樣評的寶玉道且慢瞧這個有一件事告訴你們妙師父送了詩來還有帖兒邀我去説話我趕忙到那裏妙師父不見倒遇著一位神仙姊姊引我到一個地方拿出許多册子給我瞧他説是太虛幻境的警幻仙為了絳珠仙子要了結什麼靈河岸上的夙緣因此把注定的册子改了其中道成全了咱們金陵十二叉裏頭幾個人不信現有抄來册上的詞句説著便向懷裏掏出衆人爭著來瞧寶叉笑道我瞧起來明明説著咱們呢黛玉道姊姊你這麼一個聰明人怎麼説起糊塗話來你想世界上那裏有什麼太虛幻境難道咱們這班人都從太虛幻境來的統是他編造出來的説謊言哄騙咱們的説著便要撕毀寶玉慌忙伸出手來只聽得院子裏山崩的震響衆人趕出去瞧道天上塌了一塊大石下來寶玉驚醒並無黛玉寶叉諸姊妹晴襲鵑鶯一個人在眼前原來是紅樓一夢
