body:
  text: 第九回踐戲言新貴入荒山試凡心夙緣還寶玉話説戲文煞台後賈母趁一天高興到那上房裏躺了一會又邀薛姨媽出來聽戲王夫人等都來陪著重又點戲開場晚上並無席面只吩咐些端整精潔食品都放在一張茶几上擺列各人面前隨其自便寶玉先於午間散戲後忽然不見了寶叉心上動疑便叫鶯兒到賈母王夫人並鳳姐處去看了沒見又叫老婆子小丫頭各處去找找的人沒有回來見小紅來請説老太太姨太太姑娘們都在那裏聽戲了請奶奶快出去襲人聽見便道請奶奶且陪著老太太們瞧戲我到園子裏去找寶叉道你不聽見小紅説姑娘們都在前頭只有邢大姑娘沒出來也未必在他那裏別處地方不用去找除非到瀟湘館去了你去瞧瞧倘在那裏就拉了他回來説著同了小紅自去瞧戲這裏襲人趕進園子裏徑往瀟湘館來推進門去先到里間屋子裏瞧了又向各處一看不見有人那襲人自從寶玉病後搬出園去輕易沒有到此走動就是那一天跟寶玉祭奠來了一次慌慌張張的走了今日進來滿目淒涼也覺另有一種光景剛要出去見一個看屋子的老婆子回來襲人便問道你瞧見寶二爺到這裏來嗎那老婆子答道就是林姑娘回家這一天寶二爺到這裏哭了一回走了再沒見來呢我們就見寶二爺總遵上頭吩咐不敢胡説姑娘請放心襲人聽了笑道誰又和你們翻這些陳年爛話一扭頭便出了瀟湘館心裏還放不下便往紫菱洲去一問岫煙回報沒有來又往稻香村各處問一遍才出園來見了剛才打發去找寶玉這幾個老婆子小丫頭們問他都説沒有瞧見呢襲人且不去回寶叉自己趕到垂花門口叫人去問焙茗二爺到那裏去了焙茗正同掃紅壽兒這幾個人在那裏喝酒搳拳聽了連忙放下酒杯來到垂花門見了襲人發怔道二爺出門我們總輪替著跟出去的今兒二爺在裏頭瞧戲跟二爺出門的人都在屋裏也沒聽見二爺要到那裏去多早晚出門我們實在不知道襲人道別裝糊塗哩快去門上問罷我在這裏等著呢焙茗往外就跑不多時回來道都沒瞧見二爺出去這會兒叫人各處去找呢襲人便啐了一口罵道都是一班子死人説著轉身進內悄悄的回了寶叉寶叉也不敢做聲因賈母先已問過寶玉為什麼不出來看戲寶叉回道想是多喝了兩杯酒在屋裏歇著呢賈母道這幾天也怪乏了由他歇著罷別去叫當下在座有幾個人知道的也不理會等戲文散了各自回去寶叉對襲人歎了口氣道這件事太太那裏可不能不先回一聲襲人見寶叉臉色悲中帶急便寬慰道奶奶也不用著急我想起來不過到那沒要緊的地方去走了走牽扯住了估量也就回來的寶叉一面搖頭又問襲人道今兒二爺可和你説過什麼話沒有襲人道二爺這兒時早就和我們不多説話的了寶叉道你瞧不出二爺中舉之後一時歡喜一時煩惱行動改常今兒點的戲講的話大有些古怪我一時不留神這會兒才查察起來已經遲了保不定他去幹出些稀奇新樣的事來我告訴太太去説著一面拭淚忙起身出來襲人也跟到了王夫人屋裏寶叉把這件事和王夫人説了王夫人也不在意因見寶叉神色慌張聲勢急切便吩咐叫人趕快找去接著鳳姐李紈並賴大林之孝家的這幾個管事媳婦都知道了陸續來到王夫人屋裏聽候呼喚王夫人道寶玉往常出門總有人跟著今兒到底多早晚出去的難道門上這班人竟沒有一個人見的你們快查去賴大家的先應了一聲是鳳姐介面道太太吩咐去查如果有人瞧見寶兄弟出去這會兒還有人敢出來承認嗎且先去問他把今兒大門上該班的是那幾個問跟寶玉出門的這班小廝是誰通班打夥兒發出去打了四十再問他呢賴家林家的聽了鳳姐的話一面瞧王夫人眼色王夫人停了半晌道且叫他們上緊找尋去如果找不見我定要處治他們的難得老太太歡喜了一天這會兒去告訴了這句話老太太定要著急鳳姐道太太且別和老太太説去等一回寶兄弟回來了明兒只當沒有這件事這會兒老太太沒有叫寶玉可以瞞了過去沒的要嚇著他老人家王夫人點頭一面叫彩雲去打聽老太太睡了沒有彩雲回來説老太太已經安歇了王夫人略放寬心同鳳姐寶叉坐著等寶玉的資訊寶叉道古怪在跟他出門的人不短一個怕未必就回來呢説著一替一替的人回來都説世交親族人家連寶玉的同年寓所各處找遍並無蹤影直鬧至五更才各人散去歇了一歇寶叉與襲人一夜沒有合眼到了天明仍不見寶玉回家王夫人料不能再瞞只得回明瞭賈母賈母聽了驚得臉上失色十分著急忙叫人四下找尋埋怨王夫人不早去告訴又罵襲人這班人並不留心鬧得榮國府中如倒海翻江連日不得安靜各處去求籤問蔔有説找得著的有説一時難找也有説不用找得自然回來的紛紛議論不一邢夫人尤氏等都來問信薛姨媽就是家宴唱戲這一天戲散後回了家因染時症臥炕不能起身一天幾趟打發人來探聽寶叉過去請安又細細盤問緣由寶叉只得委婉相告薛姨媽自是記挂打發薛蝌在外邊留心察訪寶玉下落且説那一天戲文煞台後寶玉趁熱鬧之際沒人瞧見溜出府門也不辨東西南北見路便走心中似迷似醒像不由自主一般走了半日也不覺困乏一時站住腳跟定睛四望但見四野曠闊絶少人煙卻喜水秀山清一洗城市囂塵之氣象竟是生平從未閲曆之所反覺耳目一新漸見金烏西墜正愁無處棲身忽聽清磬一聲在樹林中隨風飄送出來寶玉便望著林子裏尋聲覓徑而入盤旋曲折約行半裏許見一座茅庵庵門半掩寶玉走進裏邊有一老僧夜課甫畢爐內香篆未消那僧相貌清臒杖履古朴寶玉趨步向前稱上人稽首了老僧連忙回禮也不問寶玉來蹤説貴人想是來投宿的小庵方便招寶玉就在一張竹榻上坐下寶玉啓口問道上人高夀在此靜修有幾多年了老僧答道山中無曆日寒盡不知年貧僧只記進步的功程不算修行的歲月花落花開不知閲幾多春秋矣寶玉又問此去大荒山青埂峰從那一條路走有多少程途老僧笑道只一往向前不要止步便是大荒山並無第二條路徑説近便近説遠便遠寶玉聽老僧應答大有禪機不敢再問凝神坐了片時見竹榻上放有新制僧衣僧履瞧著自己身上全不像個出家人行徑想就在此披剃了再到大荒山去見師父也顯得我心意至誠便向老僧稽首道弟子立志出家因起身忙促未曾改換緇衣今見有現成衣履在此乞師父就與弟子披剃了把身上的衣服留下作抵未知師父肯賜提挈否老僧道這副衣履是一位護法布施在此有佛門的雲遊到來那一個有緣儘管穿去貴人穿來的衣服貧僧留此無用寶玉聽了自愧失言忙站起身來求老僧剃度老僧笑貴人出家的緣故不過要盡一點心罷了何必定要剃發寶玉求之再三老僧應允就尋了一把刀子替寶玉落了發寶玉忙把自己衣服靴帽脫棄穿了僧衣僧履向佛前拈香參拜又拜謝老僧想起出門時候並沒和一個人説明老太太和太太不知怎樣在家裏盼望不如把頭髮衣服寄回叫他們一看心裏就明白了也免得著人四處尋訪主意已定便向老僧告知老僧答道這裏常有擔柴的樵子進城這事極便但請放心老僧又去取了兩枚鮮桃遞給寶玉道貧僧不食煙火食已久不便留齋奉敬冰桃二枚聊以充飢寶玉捧而啖之感謝不已當下在庵中住宿一宵次早辭別老僧拿住不要止步的念頭迷迷糊糊的望前行走猶如夢裏一般無明無夜奔往前途見山中繁花綴樹緑樹成陰心想時交冬令何得見此花柳鮮妍定然地接仙源已非塵凡世界離大荒山不遠了正走間忽見前面岔出兩條去路躊躇不得主意聽得山坳裏有人歌曰芒鞋踏處白雲浮柯爛歸來月一鈎隔斷紅塵千萬裏滿山黃葉一肩秋寶玉聽罷移時見一老者肩挑一擔柴枝從山坳裏出來寶玉上前問道往大荒山去不知從那一條路走現有岐途望老丈指迷那老者答道心頭無岐念便足下無岐途何須指迷你怕走錯了路老漢便是要回大荒山去的跟著我來就是寶玉滿心歡喜隨了樵子行去先後不過數步心想趕著那老者還有話問總趕不上只見那老者回過頭來指與寶玉道從松林裏翻上坡去便到大荒山了寶玉向山上一望霎眼不見樵夫原來寶玉所遇老僧樵子俱是僧道變化指引他到此寶玉盤上山來見山上寺門外站立一僧一道上前細認便是從前見過的癩頭和尚同跛足道人當下倒地便拜那癩僧開口道你怎麼便能尋到這裏寶玉道山下樵子指迷引弟子到此拜見二位師尊跛足道人道此非國清寺安有寒山拾得耶癩僧便道你的來意我們已知但你塵緣未滿此時還不逢皈依的時候還了你的東西且回去罷寶玉道弟子虔誠削髮披緇今日有緣尋見二位師父豈肯退步還祈收納僧道佯不理竟返身回進寺門寶玉便跟了進來癩僧道你身雖入了我門心上總未乾淨如何容得下你寶玉道弟子心中已是八垢皆空九根無染十二時中一絲不染的了師父怎責弟子心頭尚未乾淨癩僧道魔頭正盛敢在禪門打誑語跛足道人道弗與多言試之可耳當下僧道便把寶玉留下令其執爨洗器掃地烹茶在府中小廝如焙茗輩所不為之事寶玉甘心供役甚至責以汲水拾薪挫磨筋骨亦任勞盡瘁不辭日則淡飯黃齏夜則繩床破衲寶玉處之泰然如在安樂鄉一般僧道憐其意誠便令寶玉打坐參禪一夜在蒲團上攝氣凝神意不旁騖用起功來才合眼見有一隻斑爛猛虎張牙舞爪撲入殿來寶玉明知是魔毫無驚悸虎去了又見巨蟒一條身長二十餘丈眼若銅鈴目光如電張開血盆大口向蒲團蜿蜒而入寶玉亦如不見鎮靜如前又見大觀園中一班姊妹湘雲寶琴李紋李綺等紅搖翠動牽裾連袂而來圍繞著寶玉也有邀他去入詩社的也有拉他去放風箏的也有叫他去釣魚看花玩兒的寶玉一概不理湘雲等去後又見寶叉淚痕滿面把他拉住哭訴道你不念往日姊妹情分也罷自從我嫁到你家不到半載一味冷淡著我全無伉儷之情忍心拋撇了到此出家便是佛門也許慈悲為本蓮台座下容得你這樣狠心人嗎寶玉心頭思想道你自錯認了金玉煙緣也怨不得我仍漠然不動停了一回忽聽得耳畔有人叫道寶玉寶玉你被人家哄瞞了我病好後已經回到家裏沒有死呢你當真就做了和尚了寶玉睜眼一看見是黛玉禁不住叫出一聲林妹妹兩手往前一拉撲了個空登時從蒲團上跌下來只聽得僧道呵呵笑道好一個八垢皆空一絲不挂的出家人寶玉聽説明知自己走了魔便欲鎮攝精神再做蒲團上的工夫那知蒲團已無連屋宇僧道都沒有了此時天色大明朝曦欲上見身在孤松樹下那樹株礌碐多節千丈森森虯鱗濃蔭如廈橫庇九畝又見一柱青峰嶒砢壁立聳接雲霄寶玉走過舉手撫摩山根下顯出一片字迹卻模糊認不分明看至下邊見地上小小一物晶光四射炫目爭輝拾在手中一看驚喜非常原來就是失去的那塊通靈寶玉連鶯兒所結的金線絡子依然無恙心想從前因為失了玉病了被他們哄弄到這個地步我若心裏不迷糊到十分豈肯幹出這樣負心事來夜兒明明見林妹妹來和我説他並死有死就不是當真林妹妹來師父説我塵緣未斷焉知不是幻出林妹妹來點化我合該與林妹妹還有見面之日所以失去的玉復有了但我有玉林妹妹沒有玉我小時候恨這勞什子還要把他來砸過偏寶姊姊有了什麼金的來配鬧出這些事來是今日得玉又不必定應在林妹妹身上此時寶玉心裏倒弄得七上八下沈思了半晌只得把那塊玉系在身上想如今這個地方既不能安身只可把出家的念頭暫時中止且訪尋林妹妹再作計較一時移步四壁一望都是懸崖峭壁瞧不見底的萬丈深坑寶玉瞻顧徘徊心頭焦躁這個所在並無坡路如何下得去我先前原説過死了還要化作飛灰隨風飄蕩而沒的話這裏跌下去雖不到隨風飄蕩的光景也與飛灰爭不多少了如林妹妹已不在世上了我倒願意一死好去遍曆泉台終有尋得著他的日子倘林妹妹還在我這一死反又耽誤他了正在尋思無路忽聽得半空中鶴唳一聲有人喚道寶兄弟不要著急寶玉擡起頭來見松梢影裏一雙白鶴回翔而下一隻鶴背上還騎著一個人旋看旋近認得是柳湘蓮一時落地寶玉便和湘蓮握手問訊喜之不勝忙叫柳二哥聞説你隨了一位道長雲遊去了竟是仙凡迥隔音信難通使兄弟心中悵悵無已今見鶴背逍遙想已丹成九轉何不將別後之事細説一番湘蓮道已過之事何必問他且説你現在之事要緊寶玉道我的心事在家裏從沒告訴過一個人今兒不肯瞞你我和你原是一路上的人我立志出家寶玉正要把來蹤去迹告訴湘蓮湘蓮道你心上的事我已盡知不必再講如今我來引你回去何如寶玉道我家裏是不回去的了湘蓮説道誰來引你回家少不得送你到一個所在去了你夙願就是了寶玉十分感激湘蓮便讓寶玉跨上鶴背寶玉搖頭道這上頭如何坐得住人柳二哥何不去換匹馬來騎上湘蓮道這個地方不用説找不出馬也不是馬能行走的路寶玉道我步行尚能到此怎麼馬倒行不去湘蓮道你來的時候一往向前心不偏陂故地無坑陷如今回轉去便不是來的路途了寶兄弟你放大了膽跨上去試著瞧罷説著便過來扶寶玉上鶴背寶玉死命抓住湘蓮不放道你瞧我兩腳下垂又沒腳蹬踩住如何騎得穩呢湘蓮道寶兄弟你在這裏説呆話了鶴背上挂了腳蹬倒還得去尋一副鞍串來配上才好你只管放開手閉上兩眼隨著他去再沒亂兒寶玉只得放心依言把眼閉了那一隻鶴便展翼淩空而上湘蓮亦跨上了鶴趕著寶玉相離左右不遠寶玉連叫柳二哥照應著些只聽耳畔呼呼聲響真如列子禦風而行爽快絶倫那身軀猶如粘住在鶴背上一般約有兩個時辰鶴便墜下地來寶玉睜眼看時見往來人迹尚稀而村莊籬落已入塵寰湘蓮道寶兄弟你雖無十萬貫纏腰幸上揚州不遠了送君至此行將別矣一面解下身系寶劍向寶玉道我有鴛鴦劍二柄其一已為尤家三姐殉葬之物此柄雄鋒又將萬根煩惱絲斬絶留之無用古人原有挂劍墓門以酬知己者煩足下帶回送至三姐冢上使雌雄合而為一五百年再當出世今交足下帶回將來護送寶眷進京還須借重此物言畢把劍連鞘遞與寶玉寶玉便問後會何期湘蓮答道後會非遙即在你黃粱飯熟之年寶玉一時未能會晤只是扯住湘蓮的衣袂依依不舍湘蓮一面指道你看那邊焙茗來找你了當下哄寶玉回頭湘蓮已跨鶴離地冉冉淩空寶玉仰天觀看旋入杳冥已無蹤影不勝感悵望見前邊雉堞高聳知是城垣便將鴛鴦劍系在身旁慢慢步入城來見街市上肩摩轂擊來往行人稠密不知什麼地方因湘蓮有上揚州不遠之語錯記林公任所為住宅逢人便問林老爺家衆人見他出家人打扮舉止言語俱不相稱引得那一班遊手好間的人都跟著瞧看寶玉還只顧向人訪問有那老年誠實的向寶玉指道小師父問的那一家鄉宦就在前邊要去募化他家那位老太太最肯結善緣的話未完只見兩上人跑得汗雨直淋來請寶玉此時寶玉並不想來請我的是誰家的人也不想我才從大荒山回來怎麼就知道有我這個人因心想林老爺家一開口便道你們是林老爺家來的嗎那兩個人應道正是正是當下引了寶玉到一座高大門樓前正門三間五架門飾緑油銅環獸面氣象規模雖略遜寧榮兩府也頗顯赫堂皇寶玉心想林妹妹家已經中落焉得有此巍峨門第心甚疑惑正要移步上階見裏面有兩個年輕小廝飛跑出來對著同來這兩個人嚷道快著些罷裏頭催了好幾回哩説著進了大門轉過角門讓這兩個小廝引了寶玉進內才至正廳院裏面又有兩個小廝掀簾出來一見寶玉便笑嘻嘻掇身回進又走出一個人來見了寶玉四目互睜了一回那一個人開口問道你莫非是賈寶玉嗎寶玉應道我便是寶玉你是誰那一個答道我也叫寶玉引得旁邊衆小廝稱奇叫怪原來那一個便是南京甄寶玉剛才引寶玉這兩個就是甄府家人聽見問他可是林老爺家來的這句話因林字與甄字音聲相似一時錯聽了並非有心胡弄寶玉甄寶玉也曾到過榮府甄府家人非不知自家寶玉之外有個賈寶玉只因出其不意一時引了個人進來是和尚打扮與甄寶玉相見竟像個西遊記孫行者鬥法又有一個六耳獼猴前來廝混看得衆人繚亂眼花且説兩寶玉挽手進內讓坐甄寶玉道昨兒接到家書家君提及二哥鶚薦後忽然隱遁一事兄弟大為駭異才間有人進來説起街上見一小沙彌年紀相貌與兄弟一般趕忙打發人出去請來一認不料果是二哥自從那年到尊府別後三秋之感叫兄弟想的了不得今兒有此奇緣真是意想不到的事不知二哥因何作此遁迹空門之想還當慢慢領教寶玉尚未答言只聽得裏頭傳出話來老太太叫寶玉引了榮府的哥兒同進去呢甄寶玉道想是我們老太太也聽見這件事了於是兩寶玉挽著手來至上房見院子裏站著一群丫頭婆子指五戳六的在那裏説笑甄寶玉讓寶玉上了臺階早有伺候的老婆子掀起門簾寶玉進內見炕上端坐一位老太太起居服色仿佛與賈母相似甄寶玉便向寶玉指道這就是家祖母寶玉恭恭敬敬的趨步上前打了一個千那位老太太把寶玉瞧了個仔細道你是榮府裏寶玉嗎寶玉應了一聲是甄老太太把榮府裏的事情細細盤問寶玉逐一應答甄老太太便一手把寶玉拉過一手摩挲他頭上道一個大家的公子哥兒忽然剃了頭髮做起和尚來也不怕人笑話我聽見你們老太太疼你像我疼自家寶玉一樣你們太太越發把你當作的寶貝似的了怎麼就肯放你出來呢寶玉道我出門的時候家裏沒有一個人知道呢甄老太太道打量府上是不知道的那個更使不得你自己不打緊這會子家裏不知鬧的怎麼樣在那裏呢一面叫人吩咐外邊打發人進京到榮府裏報信婆子們應了一聲是自去傳話甄老太太又道我們的太太那一年從京裏回來説起見這哥兒生得與我家寶玉一模樣兒的話我還不信如今看起來果然比雙生弟兄還像呢説著又叫人去叫了到過榮府這兩個女人出來指著寶玉給他們瞧道你們是見過的可就是榮府裏的寶哥兒嗎那女人把寶玉細細打量一回笑道可不就是這位哥兒呢幸虧穿了這一身和尚衣服和我們哥兒站在面前叫人怎麼認得清呢都説我們的哥兒淘氣老太太看這位哥兒竟是意想不到的事都鬧了出來只怕在家裏比我們的哥兒還淘氣呢甄老太太笑道這也不是他當著玩意兒事幹出來的一定有個緣故又向寶玉問道聽見府上有一位老爺不肯住在家裏受享到什麼觀裏去幹這種修真養性煉丹守庚的事連命都送了這一位是什麼輩分寶玉答道那是我們東府裏的敬老爺長一輩呢甄老太太道這皆因你們生長官宦人家在富貴場中混的膩了看見了這些旁門左道的書一時動起那成佛作祖的念頭來了一面又吩咐甄寶玉道寶玉你以後在學堂裏除了四書五經之外再不許放著別的間書我知道了是不依的甄寶玉應了一聲是當下叫伺候寶玉的人拿出一副出門衣服靴帽停會兒送出去給榮府哥兒更換又向寶玉道還虧到了這個地方有我們的人瞧見倘走到別處被那些遊方和尚誘拐了去還了得嗎如今住在這裏就同自己家裏一樣愛什麼吃的玩的只管和我們伺候的人説寶玉你陪著到園子裏去逛逛來的是客要有個盡讓才是別玩的淘氣了説話時已擺上茶果甄寶玉便讓寶玉點景用了些然後同了出去這裏甄老太太疼愛自家寶玉原與賈母疼愛寶玉一般今見寶玉生來與自己的孫兒無二偏又穿著這一套出家衣履更覺可憐可愛就把疼自家寶玉的心腸去疼他聽説寶玉在家裏離不得女孩子們陪伴便打發兩個丫頭出去伺候那些丫頭們也上都也願意口裏只説他不是自家的寶玉又是個和尚怎麼好去伺候他嗎甄老太太笑道管他和尚也罷姑子也罷叫你們出去有什麼避忌呢當下便選定了兩個人後來雖沒出去卻留下話柄都和這兩個丫頭取笑叫他們是香夥間言少表不知寶玉住在甄府幹出什麼事情來再看下回分解
