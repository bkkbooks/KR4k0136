body:
  text: 第二十九回訴往事窗外站癡人辭側室園中談摯語話説寶黛二人談了一會詩黛玉把賞賜物件珍藏好了便進房卸妝寶玉跟了進去見黛玉寬去外罩衣服步向妝台卸除簪飾纖纖玉手重理烏雲越顯豐神嫵媚寶玉歪在桌上一張杌子上瞧著出神黛玉星眼微睃故意將掠鬢的抿子輕輕一灑微微幾點水兒到了寶玉臉上才自覺著寶玉便笑道我記得頭裏史大妹妹同你睡覺早上我來瞧你們定要攆了我出去你才肯起來穿衣服如今為什麼很大方呢黛玉抿著嘴笑半晌才開口道那年我才來大家都還小在老太太住的套間裏不是也在一張床上這時候何曾理會什麼呢寶玉道那時同著一張床上雖然親近總是兩樣的黛玉道別講古話了他們那裏你也好幾夜沒有過去別盡在這裏討人厭今夜隨你便到那一個屋子裏去歇著讓我安安靜靜一晚寶玉又靦腆延挨了一會才起身叫老婆子掌燈陪至怡紅院先到紫鵑那裏剛進外屋門一個小丫頭正提著水桶要往裏走見了寶玉便站住叫道姑娘二爺來了話聲未絶只聽得輕輕呀的一聲兒把里間房門掩了然後聽紫鵑在裏面笑道睡了不起來了寶玉把門一推已經閂上便道你姑娘叫我到這裏來的姑娘是關了門了紫鵑道那麼請二爺到晴雯姊姊屋裏去寶玉道我怕到了那裏照你樣關起門來便怎麼樣呢紫鵑道他是不關門的寶玉問為什麼你關門他不關門呢紫鵑笑了一笑又道還有麝月在那裏説話呢寶玉回身便走道你不開門少不得和你姑娘算帳當下徑往晴雯處先在窗戶外聽了一聽果然是麝月的聲音道那也沒有什麼要緊蔣家去住了兩天姓蔣的又不在家第三天就把他送了回去還是原封不動一個襲人晴雯冷笑道你這句話就是真的還虧蔣琪官倒有一點良心保全了他不然這會兒襲人要做媽呢麝月道話別説盡了一個房子裏多年的姊妹三天不好也有兩天好的他嫂子好容易巴結進來了一趟摸不著一點門路可是要你看開一點在奶奶跟前幫襯一半句話回了太太叫他進來也占不去的什麼別要太狠心了晴雯直聲嚷道我的麝月姑娘你和他本來交厚他是該進來的我便是什麼狐狸精寶玉是我誘壞了該攆的麝月道這又奇了那些話是他在太太面前挑唆的嗎晴雯道沒有他暗地裏撥火兒太太就能編出這些話來你知道不是他到底是誰呢可還出一個人來麝月半晌又説道那我也不敢憑空指誰晴雯道可又來我正病得四五天水米不沾牙生巴巴炕上拉下來退送到那一輩子沒有見過這樣骯髒屋子裏偏又撞著這些黑心腸的人憑你嚷破喉嚨要口水喝也沒人來理麝月笑道沒人理那窗戶臺上的茶吊子就飛到你嘴邊來了晴雯聽説估量那一天寶玉出去看他的情節麝月已經知道不與分證這話又接下去説道把我裝在棺材裏擡出去要不是天有眼連這幾塊骨頭也不知那裏去了如今我倒進來了他氣不服有臉兒只管進來太太還有替己月錢分給他呢難道我敢攆他出去嗎麝月道別的事都不用提就是你出去了他也整整的哭了幾場你沒有親眼瞧見信不信由你太太吩咐除你貼身穿的衣服外不許拿一點東西出去他私下瞞了太太把你所有的銀錢穿戴細細拾掇了半天不少一件包了包袱還把他自己幾吊錢打發宋媽送到你家裏可是有的嗎便這上頭也該見人家一點子情寶玉在外面聽了講論襲人這一番話便不高興進去一個人回到瀟湘館想起鶯兒這幾時再不和我説話不如去問問鶯兒不知襲人的嫂子進來説了些什麼借此也可去搭訕搭訕慢慢的走到鶯兒那邊見門已關了紙窗上照著燈亮未息又聽鶯兒在裏面歎了一口氣寶玉便悄悄的叫道鶯兒姐姐開一開門鶯兒不應寶玉又連叫幾聲裏面才應道可是二爺嗎為什麼三更半夜跑到這裏來奇不奇寶玉道我來問你一句話鶯兒哭喪著聲氣答道二爺如今是心滿意足的了慪死的已經慪死活著的不過在這裏現世還有什麼話來問我呢寶玉道你可聽見襲人姐姐的嫂子今兒進來説了他些什麼鶯兒道二爺問襲人嗎左右不過也是熬煎著死各人怨各人的命罷哩寶玉又問道你到底知道襲人姐姐有什麼話沒有呢鶯兒再不答應撲的一聲把燈吹滅了寶玉站在廊簷底下呆呆想著大凡一個人在性情脾氣都因遭際而異的鶯兒從前出言吐語何等樣柔順如今大變了於是因鶯兒想到寶叉又因寶叉想到襲人死別生離纏綿寸抱不禁掉下淚來呆了一會仍回黛玉處叫開門進去歇了到了次日賈璉傳齊賴升林之孝吳新登等一衆管事家人雇備人夫鳳姐命吳新登家的來到蕭湘館回明黛玉道璉二奶奶打發來領綴錦閣的鑰匙璉二爺親自在那裏照應起運寶銀上庫入了收帳再送來過目黛玉便命雪雁取鑰匙交給吳新登家的道今兒一天不能運完鑰匙存在那邊不必再送過來吳新登家的答應出院來到鳳姐處回明這話賈璉先到帳房裏囑咐管帳相公們幾句話帶了隆兒興兒兩個小廝進了園門一徑來到綴景閣早有吳新登帶領人夫備了擔子伺候賈璉便命開鎖揭封進內搬動挑運上庫點齊了十擔派一個人輪流押送掣回籌碼兩邊記了數目賈璉在門外照看隆兒悄悄拉了興兒一把道橫豎這銀子沒數的咱們何不撮巧宗兒進去拿幾個使用興兒搖頭道不想發這宗財你沒聽見大太太那裏的王老媽他瞧得眼紅了起了貪心財沒有發得成白耽了個壞名兒還嚇得七死八活如今病著要瘋呢那是林姑娘的福分鎮治的別人敢動他一個邊兒隆兒笑道我當真豬油蒙了心白説著玩罷哩這裏事且按下不表再説賈璉出去了鳳姐便向平兒道我昨兒晚上對你説的話就去走一趟討個準信好回報人家平兒忙應道我正要去呢説著便到王夫人處找玉釧兒彩雲説他到大奶奶那裏去了平兒轉身就走一徑進了園門往稻香村來知道今兒綴景閣那裏起運銀子有腳夫來往繞了遠路兜轉走過山坡相離不到十余步前面有兩個老婆子一路行走講話一個就是玉釧的娘白媽一個是管園子的祝媽白媽指著地上道你瞧樹上的果子刮了許多下來雖然沒有很熟白槽踏了今年春裏雨水多外邊這些東西見新的都沒味兒祝媽道可不是這園子裏的比外邊買的強因沒派定人沒人來照管過幾天就好了嬸子你不知道底下去又另換一個勢派了昨兒寶二奶奶請了大奶奶二奶奶到議事廳上講了半天家務璉二奶奶就插不下一句話説起那位寶二奶奶再沒那麼仁慈寬厚比璉二奶奶一個竟在天上呢平兒聽了便煞住了腳讓他們走遠幾步才高聲叫道白媽你多早晚進來的二人回過頭來見是平兒祝媽先吃了一驚心想幸虧相離還遠估量著剛才説的話他未必聽清兩個人便回身迎了上來祝媽先開口道白嬸子到太太那裏請了安進園子來瞧瞧我偏我走了開去回來碰著他拉到我屋裏去歇歇姑娘到那裏去我瞧著許多人在那邊扛銀子呢白媽忙介面道才到奶奶那裏去請安瞧瞧姑娘紅姑娘説奶奶正忙著也沒得進去平兒笑道難為你今兒你自己進來還是太太叫你進來呢白媽道我自己進來的平兒又問道見過玉釧妹妹沒有白媽道我在太太屋裏沒瞧見他也沒什麼話和他説就這孩子年紀也大了盡仔跑開去玩姑娘見了他替我管教管教平兒道那是你過慮了如今太太很看重他呢白媽眼圈兒一紅道我底下也只靠著他呢但願依得姑娘的話就是這孩子的造化平兒又和他説了幾句間話各自分路走開且説玉釧因聽了鳳姐的話心上怪不受用悶坐不過想到稻香村來看看園景一路到了李紈院子裏聽見湘雲探春許多姑娘們在裏頭説笑玉釧原是到此間逛沒有正經説話可回便到碧月屋裏説了一會間話起身出了稻香村順路要到紫菱洲去走走頂頭撞著了平兒平兒和玉釧本是素日相好的姊妹一見面便笑臉相迎的不料今兒玉釧見了平兒沒言語一聲兒登時沈下臉來一扭頭回身便走平兒心裏想道奇喲我口還沒開怎麼惱到我身上來了欲待不理他各自走開怎樣去回覆奶奶且傷了姊妹相好的情分只得趕走幾步上前陪笑臉向玉釧道妹妹慢些走我來和你説話呢玉釧回轉身來答道你那一個見風使帆飛高枝兒的主子我那一隻眼睛裏瞧得進去一面平兒把他拉著手兩個人在一塊石子上坐下平兒又陪笑道你別生氣並不是奶奶叫我來的因我昨兒聽見一句話猜不透你心上的盤算咱們好姊妹自來問問你我想起來先前大太太去討鴛鴦不是我在背地裏敢説這句話怨不得鴛鴦不願意講到你如今林姑娘也瞧出他的行事來了晴雯不過嘴上頭躁一點其實也沒有掉三窩四的壞心腸紫鵑更不用説了比鴛鴦可不把你擡到雲端裏去了到底還有什麼不如意呢玉釧只是拿著塊手帕子擦眼平兒一瞧手搭在他肩上堆著笑道這有什麼害臊説不出的話你還不知道這都是林姑娘的好意為著你家姊姊所以要照應你倒不是寶玉有什麼私意玉釧才説道我也知是林姑娘的好意就這寶玉鬧的我家姊姊死得那麼傷心又落了一個不乾不淨的名兒我因此反去做他屋裏人心上怎麼過得去再者晴雯紫鵑兩個已經過了明路底下去鶯兒只算未必麝月秋紋這一窩子總要留一兩個襲人現在他家裏保不定不弄他進來難道咱們這一班人都要跟寶玉的嗎林姑娘我感他的情少不得過一天去磕頭我對你説這些話你奶奶跟前説得的説了兩句説不得的別去多嘴放在你肚子裏就是了平兒點頭又問道你媽今兒進來別太太和他説了什麼玉釧忙問道你見我媽麼平兒道才進園子裏來瞧見他這會兒在老祝媽那裏估量還沒走呢説著兩個人站起身來平兒一擡頭見在一株楓樹底下四面瞧了一瞧笑道怨不得事沒成就原來一個地方風水不吉利玉釧問什麼風水平兒道不和你講罷玉釧道我也不愛聽你嚼舌我要找我媽去呢當下平兒又瞧瞧這地方自己不覺發笑道我還要到山子背後瞧去一頭笑著當真往裏邊瞧了一瞧出來道今兒可沒有人躲在裏頭了平兒這番言動倒把玉釧怔住因笑向平兒道做什麼青天白日你見了鬼了當下各自走散玉釧自找他媽去平兒回到鳳姐屋裏告訴了玉釧的話鳳姐因黛玉要他管理家務重新提起精神辦事這第一件就不得成功似乎掃興丟臉便生氣道太太已經應許怕他不依立刻要傳賴升家的叫玉釧的娘進來當面吩咐以勢淩壓平兒在旁再三解勸道這原是寶二奶奶的好意奶奶這樣翻騰起來玉釧的媽有什麼不願意呢保不定玉釧執性再鬧出點緣故來叫寶二奶奶怎樣過得去呢奶奶倒落了個抱怨也不犯著明兒我去和寶二奶奶説包管他沒有什麼芥蒂還要想法兒提挈玉釧呢鳳姐聽了平兒一番話細想也似有理且因他這場病後諸事留神不敢任性逞強便丟開了手任憑平兒自去回報黛玉果然黛玉瞧起玉釧説他立志存心令人敬服反悔自己唐突了他心上盤算了一會定了主意去見王夫人講到寶玉從賈母處回來不見黛玉便問奶奶呢晴雯正在裏頭聽見寶玉回來忙趕出來笑向寶玉道有一件奇事告訴你別聽見了盡仔嘮叨起來人家又嫌我多嘴呢寶玉便拉晴雯挨著身子坐下問道好姐姐你和我講了我再不告訴別人晴雯道那倒不是要瞞人家的事就怕招惹你的呆性出來我先問你玉釧兒這個人好不好寶玉怔了一怔道你為什麼忽然提起他來你問我我瞧女孩子那一個是不好的呢晴雯嗤的一笑道依你這樣説老太太屋裏的傻大姐他也是個女孩子你瞧著他也是好的了寶玉忍住了笑向晴雯道咱們講正經你到底為什麼問我這句話難道為他姊姊的事他不理著我就硬派他一個不是晴雯搖頭道不為這些我和你説了罷姑娘托璉二奶奶和太太討他來給你做屋裏人他反不願意你説奇不奇寶玉聽了晴雯的話又想起當日梨香院齡官的故事便對晴雯道這也算不得奇事我早説過你們的眼淚不能葬我一個襲人尚然有意外之變何況別人晴雯聽説到襲人便沈下臉來道你想襲人何不去叫了他進來説著一扭頭站起身來要走寶玉正去拉他只聽見黛玉走進來笑嘻嘻的問道二爺在家嗎請到太太那裏去道喜呢當下小丫環打起簾子黛玉含笑進來寶玉問道我早上在太太屋裏沒聽見説什麼這會兒叫我去道什麼喜説著又向雪雁道可是你姑娘哄我呢黛玉道我説給你聽為的有個緣故我要認玉釧做幹妹子太太也知道我的意思很歡喜就説你要認他做幹妹子不如我認他做幹女兒剛才已經拜過的了太太要揀個好日子請客叫他到老太太那裏去磕頭呢寶玉歡喜道妹妹真是我的知心那麼著我心裏也過得去了橫豎太太要揀日子擺酒我到那一天與太太叩喜未遲黛玉道也使得還有一件事統告訴了你叫你越發樂一樂咱們先前梨香院這班女孩子都散開了後來因為芳官在你屋裏淘氣太太連各處派給使喚的打夥兒攆了晴雯在旁不等説完觸起舊事傷心便默默的自回怡紅院去了衆人都沒理會又聽黛玉道太太因為擺酒要叫班子想起園子裏頭向來有一班小戲子不如把攆的女孩子叫他們回來同清音班住在梨香院多早晚老太太高興瞧戲他們伺候著現成已經告訴鳳姐姐吩咐外邊叫去呢寶玉聽説要叫芳官這班人回來園中越發熱鬧又得與芳官親近正是離而復合事事稱心再講榮府族中風聞有上千萬銀子發給房族中營運各人畫策門路或想囑託賈璉或想賄通鳳姐以圖捷足先登不知此事出於黛玉調度無所用其夤緣外邊如何明白先是賈藝心上盤算去走鳳姐門路又怕如前一回謀幹工部事件白槽踏了些繡貨鳳姐推辭不管先要他母親進府去走一趟到小紅處探聽些消息又恐鳳姐生疑事不成功反纍小紅受毒左思右想不得主意直至那一日賈璉邀齊族衆照依黛玉開單所議宣明一番各人照著派定的章程自去幹辦遠處先行制備行裝聘請夥計銀子都已現成照數支領衆人自有一番議論有的説近處便於照應有的説遠地方去見識蘇揚風景有的説從陸路走克期可到有的説走水路省了腳價有的説銀子多了要請保鏢的有的説搭幫同行也不怕什麼分頭打點各自經心這許多承領銀本之家都仗著財福星鎮住到處貿易獲利內中有幾個不務正業刁鑽遊蕩的人皆化而為善不敢營私舞弊激發天良以圖報效此是後話表過不提當下因親及親因友及友來薦幫夥的來求投靠的不計其數鬧得賈府族中紛紛攘攘書中先敘出一個人來不知是誰下回分解
