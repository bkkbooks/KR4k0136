body:
  text: 第二十二回清虛觀仙詞留粉壁幻影鑒亡配照黃昏話説鳳姐回到屋裏聽説王夫人有事與他商量連忙趕去王夫人叫他坐了道你也太性急了路上纍了這兩個月才回家來也等歇息幾天何必急巴巴趕去走這一趟就是你婆婆那裏也沒有不體恤你的我不知道你到東府裏去了剛才打發人去叫你也沒有別的事寶玉做親的日子近了這會子要再給他收拾屋子又費一番起倒我想寶丫頭百日已過靈座設在那邊本該多擺幾天如今只好從權説不得委曲他一點子把靈幃撤了騰出屋子來咱們一頭一緒辦寶玉的喜事也省得擺著看了盡仔傷心就是姨媽那邊須得去告訴一聲不知姨媽的意思怎麼樣鳳姐答道太太想的到一時再去收拾屋子也費事寶兄弟完姻自然要成個體統那屋裏現擺著寶妹妹的靈座也不吉利我明兒橫豎要到姨媽那裏去走一趟順便和他的家人説一聲估量姨媽也不説什麼話的這件事太太不用放在心上頭一件咱們這會子手頭狹窄難得有老太太這宗銀子添補在裏頭便放心的長手躺腳辦事省打多少飢荒太太可知道老太太是想不到這上頭聽説是鴛鴦不知對老太太講了什麼才挪過來的王夫人道前兒鴛鴦過來説老太太吩咐的話在我跟前並沒一點居功討好的口氣鴛鴦這個孩子真叫人看重他如今咱們定了你明兒就去見見姨媽我還要在清虛觀請張道士拜幾天懺寶玉要下場叫蘭兒去支應也使得鳳姐聽了便打發人去通知張道士請了二十員全真啓建清醮七日趕忙打掃庭院蓋搭天棚房廚內煤米油鹽及供菜等物多多買足又預備一應碗盞傢夥忙亂開箱取出法衣法器挂幡神像又開明壇前需用供物並檀降油燭黃表金銀錠件帳單送交榮府備辦又用四張奏本黃寫了超升仙界鬥大四個字在觀門首懸挂到了起懺之日賈蘭便穿了素服到觀中在壇前支應這裏自派了家人小廝伺候寶玉入場等到三場完畢正值醮事圓滿王夫人因寶玉連日辛苦命他且自歇息寶玉那裏肯聽便帶了焙茗鋤藥等來到清虛觀張道士早迎至門外躬身施禮寶玉連忙下馬一直行至大殿聽得金鐃法鼓響振雲霄又見燭焰香煙氤氳滿殿寶玉在壇前上香行禮畢賈蘭上前見過寶玉回了幾句話張道士便讓寶玉至靜室先請了賈母王夫人安一面送茶寶玉還是那年跟了賈母到來完願因張道士送了他許多金銀玩物在賈母跟前給他提親所以惱了張道士常久不到觀中來的了如今已把前事撩開又因張道士是榮國公的替身不便輕慢他當下敘談幾句偶然擡頭見那旁粉壁上寫有數行字迹心想不知那一個不懂事的人手間了沒的恁幹把這牆上塗壞了不知寫的什麼在上頭定是粗鄙不堪的句語便站起身來慢慢的踱到牆邊見那字兒便寫得逸致橫生大有仙骨從頭念道鐵笛吹還裂金磚煉欲柔脫韁意馬倩誰收調和了甜酸苦辣撒勻了離合悲歡霎時間掣電驚漚無緣的悔不當初有情的但看日後謾説道月從西墜水東流認準了根由大踏步闖開世界三千伸出拿雲手一腔熱血在心頭化作人間海市與蜃樓底下落款是渺渺真人戲筆寶玉怔了一會便問張道士壁上是誰寫的張道士笑道我真老的不中用了竟把這件事忘記告訴二爺那壁上字句是一個遠方道友寫的還有件東西留在這裏叫給二爺寶玉道莫非也是那些金銀玩物嗎張道士搖手道不是不是那件東西很有些奇怪叫什麼太虛幻影鑒亡過親人幽明間隔心上思念不能相見對他一照便照出這個人來寶玉聽了趕忙要鏡子來瞧張道士道但是還有些荒誕的話二爺信不信總別見怪寶玉等不到話講完忙著要鏡子張道士走進里間屋子裏去取了出來用大紅緞盤金錦袱包著寶玉接過手去了錦袱露出一團精瑩四射的寶貝來仿佛妝鏡大小捧起迎面一照一無所見睜眼仔細再看仍是空空無物恍如一輪明月挂在眼前寶玉道為什麼照不見一點東西張道士道就奇在這上頭二爺想眼前有什麼形鏡子裏就有什麼影也是容光必照的一面説一面轉過身來向著鏡子裏道瞧雪亮的鏡面不屋子裏擺的許多物件一些兒照不出來連咱們的人影也見在裏頭二爺你瞧古怪不古怪寶玉道張爺爺你才説心上想著那一個人就照的出來這又怎麼講呢張道士答道那是不要在白日裏照的道友説與二爺有緣將此物一入塵凡還有許多話我的徒孫倒記的周全説著便叫小道士進來與寶玉請過安垂手站著寶玉瞧他就是那一年拿著燭剪撞在鳳姐懷裏挨打的這個小道士已長成了寶玉叫他坐下細講鏡子的來歷小道士答道那道長説有兩面鏡子一名風月寶鑒一名太虛幻影鑒在什麼太虛元境通靈殿上鑄的這面幻影鑒照陰不照陽照死不照生心裏記念亡過親人到夜靜時候焚香祝告鏡子裏便照出這個影來寶玉正在思念寶叉今得了這件寶貝轉悲為喜想漢武帝想念李夫人仙人授伊蘅蕪香惟夢中能得一會這鏡子更勝蘅蕪香了便包好交給焙茗收好囑咐不許開看小道士陪笑道那道長還要化二爺三十六萬銀子寶玉一時計算銀數尚未答言小道士道這句話家師祖也曾攔過説二爺府上近年來不比先前這數目太多了恐不便啓齒那道長説只要二爺應許不必就要支用府上園子裏頭遍地皆金多於點石施捨這宗銀子來叫在東首空基子上建蓋一座太虛宮殿兩廊要列許多配廡裝塑各司儀像感化世界上這一種癡男怨女的還要博施濟衆起四大舍局一施藥二施棺三施粥四施衣施藥局延請名醫多贖藥料合制各種丸散膏丹那些窮苦人害了病沒錢請大夫看治的都到這局子裏頭就醫領藥又施棺局凡有窮人死了沒錢棺殮的無論異鄉本地一概賞他棺木一口至於舍衣施粥都是憐恤窮人凍餓的意思就這幾件事二爺積了萬代陰功寶玉聽了笑道咱家園子裏有銀子照這樣辦起來就是了據我想還得添設一個局子凡有兩家連了姻因貧不能婚娶也叫他們到局子裏來領費別叫有怨女曠夫可不好嗎小道士笑道敢仔那麼著二爺的功德越發大了寶玉坐了一會見院內松陰過午又到壇內行了禮忙著叫鋤藥拉馬小道士又道道長説過這面鏡子三日內就要來取的一面張道士趕忙出來送了寶玉賈蘭仍留觀中照應寶玉先自回了家見過賈母王夫人便回自己屋裏嚷著拿衣服來換一時麝月秋紋們都走開了只有鶯兒一個人睡在里間炕上淌淚聽見寶玉回來叫喚沒人答應只得勉強起來懶懶的站著寶玉瞧他眼圈兒通紅便問他們那裏去了你一個人在屋裏為什麼傷心鶯兒也沒答話寶玉還要搭訕著只聽麝月秋紋兩個人一路説笑掀起簾子進來見了寶玉道我們拿了衣服趕到太太屋裏想不到二爺倒先回來了寶玉道我是順便先到太太那裏就從老太太東院子穿堂背後繞了過來你們可瞧見焙茗送進來的一個小包別去亂動麝月向書架上指著道那不是嗎到底什麼玩意兒在裏頭包得圓圓的沈又沈倒像一面鏡子寶玉道算你猜得準可不是你們用的東西説著看看天色尚早又往鳳姐處一轉鳳姐問了清虛觀好些話賈母那邊打發人來叫寶玉寶玉去陪賈母吃了飯回來呆呆的等到黃昏後便叫小丫頭們擡一張香幾當空擺著命秋紋挪過大銅供爐自去取了藏香一手提過包袱打開把鏡子安放幾上炷香默默禱告已畢向外作了一揖捧起鏡來一瞧果然現出影來宛如寶叉立在面前春山斂恨秋水含顰似欲向寶玉告語的光景寶玉止不住一陳心酸便覺眼前昏黑只得把鏡子放下退回幾步坐在椅上垂頭落淚麝月秋紋先見寶玉這番舉動不解何故忽見他對鏡生悲都猜是這件東西作怪不約而同趕過來取鏡照看不見一些影兒把鏡子一摔都來拉著寶玉問道二爺就瞧見了什麼變成這個樣兒寶玉道瞧見了寶姑娘了你們可要瞧瞧麝月秋紋只道是寶玉的玩話都笑應道我們想見見奶奶呢寶玉站起身來道你們都來便又拿起鏡子心頭暗禱三個人並排站立瞧見鏡子裏有個寶叉像立在他們背後一般嚇得麝月秋紋寒毛直豎回過頭來又不見一些形迹虧有寶玉壯了膽一同照看寶玉見寶叉嬌態如生丰姿若舊比先前照的時候又換了一個樣兒麝月想起鶯兒時常記念他姑娘便走到他門口叫道鶯兒快來看呢那鶯兒就在東廂房睡歇並沒睡著聽他叫了幾聲故意不應麝月又著緊問道你到底聽見沒有多少應一聲兒鶯兒在屋子裏賭氣答道憑什麼我都不愛瞧麝月道人家好意叫你倒像踏了你尾巴似的寶玉擺手道別叫他瞧罷説著只是對鏡沈思恨不得把寶叉拉下鏡來伸手向前忽然不見一時想起了一個人便又禱告再照誰知左照右照瞧不見一些影兒心頭焦急暗暗想道莫非他不是這一路上的人還是與我無緣算不得親人所以不能見他照了一會呆呆的坐著淌淚麝月道這面鏡子又是禍根擱不住天天這樣鬧起來明兒須得去回太太一聲寶玉道我原不該叫你們瞧的告訴太太不要緊鬧得姨太太知道了也要這面鏡子照起來叫他老人家傷心放在屋子裏天天照他橫豎照不下寶姑娘來你們不用費心去回太太我明兒拿去還了就是麝月等聽了便沒言語聽得鶯兒在那屋子裏咳嗽一聲寶玉道你們聽鶯兒還沒睡著這丫頭怪可憐麝月道別提他罷一個紫鵑去跟林姑娘到林姑娘病凶的時候沒好沒氣的背地裏天天哭得淚人一般林姑娘回家去了紫鵑縮在園子裏頭面也不見講到鶯兒還沒有細細的告訴二爺呢自從他姑娘死了活脫又是一個紫鵑二爺沒回來的時候還好一點如今二爺回來了他越發變的個不成樣兒了寶玉點頭歎道林姑娘一個紫鵑寶姑娘一個鶯兒都算難得了麝月道二爺既道鶯兒好底下剛叫他來伺候秋紋笑道別説叫他伺候二爺只怕掉個轉兒叫二爺去伺候他還得一天碰十幾次釘子呢寶玉道誰要叫他伺候説畢起來把鏡子包了放好一面取過表來一瞧道時候不早了再別説話罷麝月秋紋兩個人過來服事寶玉睡歇明日起來先到賈母王夫人處請了安想起上一夜麝月的話自己病後果然也沒與紫鵑見面後來他們哄我説紫鵑送林妹妹靈柩回南去了聽焙茗説起紫鵑沒有同他姑娘回家還在園子裏住著我要問問他林妹妹到底怎樣回家去的先前聽我娶了寶姑娘他可説些什麼人家哄我娶的是林姑娘他可知道不知道一頭思想進園徑往瀟湘館來各處屋子裏找了一會不像紫鵑在裏頭住的才想起黛玉回了家紫鵑一個人自然不在這裏住了此時寶玉心中雖明知花殘又放月缺重圓不久就要團聚這所瀟湘館比先前到此祭奠這一次情景自然各別然室邇人遐懸懸盼望想到那幾年一進屋門來見了黛玉就有多少情談款敘説不盡的綢繆何不早早完我心願又岔出寶姊姊這一番枝節纍我跑到大荒山平白地落下許多抱怨又呆怔的看了這屋子一回轉身走出院子裏聽得廂屋裏有人説話寶玉煞住了腳聽是老婆子的聲音便走進屋去兩個老婆子見是寶玉在炕上連忙站了起來寶玉便問紫鵑姑娘如今在那裏住呢那老婆子答道紫鵑姑娘是上年林姑娘起身回家這一天就搬出去住的了那一個老婆子瞪了他一眼道你不要發糊塗在寶二爺跟前混説話紫鵑姑娘是送林姑娘靈柩回南去了這一個又道我不發糊塗你才是在這裏做夢呢如今皇上作媒給寶二爺娶林姑娘天天大鑼大鼓在這裏嚷寶二爺肚子裏怕不明白你還記著上頭吩咐的陳年爛古話哄二爺嗎那一個聽了笑道我因是遵上頭的吩咐怪怕你錯説了話我們擔不是一時忘了二爺如今人家瞞他這些事情都已知道的了寶玉聽他們擡了一會杠到底沒説到紫鵑住在那裏的話便賭氣不再問他們回頭走了出來在瀟湘館門首站立多時才往稻香村各處去一走因李紈探春都在王夫人處惜春到妙玉庵裏去了只有邢岫煙在屋裏寶玉便會坐問起紫鵑邢岫煙只得約略告訴了幾句不便細説寶玉才知道鳳姐帶了紫鵑到南邊現留在林妹妹家裏自然要跟著同來的了便起身徑出了園子到鳳姐處見尤氏幫著料理瑣碎事務寶玉上前與尤氏見過説我回家因老太太叫靜養著不許出門昨兒場事畢了又到清虛觀裏去了一天還沒過大嫂子那邊去呢尤氏道我時常過來見面的你珍大哥那裏我也替你説聲再消停幾天過去罷鳳姐介面叫了一聲寶兄弟你看珍大嫂子撩了他家裏的事過這裏來忙得什麼樣的還不先給他謝謝尤氏道我也不希罕寶兄弟謝我等林妹妹來了和他算帳就是了一時説笑著寶玉便問鳳姐道聽説姊姊帶了紫鵑去沒見他回來可是留在林妹妹家裏了嗎鳳姐道不留在林妹妹家難道把紫鵑拐騙到別處去不成當下寶玉在鳳姐處坐了一會出來便叫焙茗因這一天不是焙茗該班壽兒上來回道焙茗正和雙瑞在那裏拌嘴這件事是焙茗的不是二爺還得把他申飭幾句寶玉道他們鬧什麼壽兒道説了又嫌奴才搬嘴偏袒了那一個二爺叫他們自己來講罷寶玉道那麼你把雙瑞也叫了來壽兒去不多時同著焙茗雙瑞都上來了寶玉問道你們為什麼吵嘴焙茗沒有開口雙瑞先回道上年二爺畢了三場奴才去測一字拈了個仙字那測字先生説是中的今兒奴才和焙茗説他測的字不準那測字的問明緣由道聽爺們的話據在下的字明明一個舉人要入山修行去的還説不準嗎焙茗惱著測字的先沒有講明纍他出去受了一趟苦不許測字的在那裏擺攤場奴才説你去問二爺的功名他只就功名上講後來的事他又不是神仙那裏知道把焙茗拉了回去焙茗還不依奴才呢寶玉聽了道這原是焙茗多事隨把焙茗吆喝了兩句叫壽兒雙瑞自去罷焙茗自知理虧站著不敢言語一聲兒誰料寶玉又有話吩咐焙茗道蔣琪官如今可還在紫檀堡住打發個人去喚他來焙茗聽説到蔣琪官身上知已把自己這件事撩開的了因答道二爺記不得為了他挨過老爺一頓板子這會兒老爺雖然管不到底下老爺回來有小耳朵吹風查究出來別説二爺要淘氣奴才可再挨不起了寶玉道老爺回來也查察不到這些上頭就是知道了也不用你著急有我呢焙茗知道拗不過主人的脾氣口內便應了一聲是又回道琪官家裏離的不遠奴才馬上打發人去叫他但他常在王府裏伺候在家裏住的日子少二爺也是知道的倘然不在家別的地方可不能去找他二爺別性急才好寶玉聽了點頭無話焙茗就一溜煙走了不知蔣琪官來也不來寶玉與他講些什麼話且看下回分解
