body:
  text: 第四十一回擊鼓傳花預征佳兆推雲淨月立毀冶容話説賈母在凹晶館賞月坐席王夫人等欲按規矩伺候賈母便道寶丫頭林丫頭都做了我的孫媳婦自然該隨著他兩個嫂子行事但是他們不比人家做媳婦兒都受過一番委曲的我的意思要叫他們如今且不必按做媳婦的規矩照像先前在園子裏做女孩兒時候陪著我喝吃玩笑等我抱了重孫子再叫他們盡起媳婦的禮來王夫人笑道老太太的話原是疼愛他們講到孝順兩字只要老太太歡喜也就是行孝的道理何必拘定什麼樣遵老太太的吩咐就是了王夫人説著又笑道可是太便宜了他們了賈母也笑道剛便宜了寶丫頭林丫頭他兩個嫂子同你做婆婆的不叫你們占些便宜你們心裏也不輸服連你們一概都蠲免了説著便叫王夫人在賈母這一席上旁首坐下東邊一席坐的湘雲寶琴李紋李綺西邊坐的探春惜春喜鸞四姐玉釧東邊下一席便是李紈鳳姐寶叉黛玉寶玉並無定位隨便往來又在西首擺了一架小圍屏圍屏之外另設兩席坐的是香菱鴛鴦琥珀平兒晴雯紫鵑這班人平兒又去拉了襲人紫鵑拉了鶯兒一同坐下寶玉因聽了賈母的話喜得手舞足蹈道老太太不叫寶姊姊林妹妹按規矩咱們還照先前姊妹們玩兒取笑才有趣呢鳳姐對寶叉黛玉笑道你們兩個人聽聽老太太的話要圖舒服別趕早養兒子黛玉寶叉都來擰嘴鳳姐難以招架兩邊只得討饒一時坐定酒肴齊備劉姥姥因這酒上口甚醇不等相勸便接連吃了幾杯酒賈母道今兒劉老親家來可巧碰著這中秋節咱們別吃悶酒想行個什麼令才好劉姥姥搖手道頭裏行令灌得大醉了不知丟了多少醜可再不敢鬧這個了老太太高興行令我聽著學個乖沒有我的鴛鴦在那邊聽賈母説要行令忙走過來向劉姥姥笑道你頭裏行的令好今兒可脫不了你姥姥你不和興瞧地上現擺著兩大罈子紹興酒要你一個人吃的劉姥姥笑道我就是彌勒佛肚子也盛不下這些賈母道劉親家你別聽他們不相干有人再來鬧你我不依咱們玩兒取樂你吃不得酒見個杯兒也算了説著鳳姐也過來伺候問道老祖宗行什麼令呢賈母道劉親家在這裏再別嚕嚕嗦嗦説什麼今兒賞月花月相連月中有桂折一枝桂花來傳花飲酒闔席都道老祖宗行這個令很好賈母又想了一想向王夫人道我恍惚記得前年賞月也弄這個你老爺還講了一個笑話是怎麼説的我記不起頭尾了王夫人與衆人聽了賈母的話都記起賈政講這個笑話兒大家只是好笑卻沒言語賈母瞧著衆人也笑道你道都這樣好笑何不再講一遍給我聽聽闔席的人都面面相覷那鳳姐兒明知這笑話帶些村俗在裏頭便帶頑向寶玉姊妹們説道前年賞中秋偏偏沒有我你們誰記得為什麼不講給老祖宗聽聽呢那衆人有礙口説不出來的也有要説不敢説的鴛鴦便笑著把這個笑話講與賈母聽了倒臊得自己臉都紅了於是大家哄然一笑賈母道今兒再別想聽笑話桂花枝有了沒有當下值席的媳婦早去折了一枝桂花來鳳姐接過送與王夫人轉送賈母一面叫丫頭們隔著圍屏打起花腔令鼓來那一枝桂花在四桌席上轉遍恰恰又轉到賈母手中鼓才住了衆人都道花兒第一回落在老祖宗手裏先該老祖宗添壽增福鳳姐便斟了一杯酒王夫人接過送與賈母鳳姐又道合席同有福都該陪老祖宗吃一杯於是賈母衆人都飲了重又起鼓傳花遞到李紈手內住了鼓賈母歡喜道這枝桂花偏落在他手裏蘭兒今年有想頭呢薛姨媽道老太太説的是蟾宮折桂這佳兆應在他母親身上蘭哥兒一定恭喜王夫人介面道但願托老太太的福李紈此時聽了也樂寶玉忙過來斟酒敬賀李紈接杯飲了花在李紈之手吩咐起鼓晴雯因要戲耍劉姥姥便在小丫頭手內接過鼓來敲打一面在圍屏縫裏覷看那花遞到劉姥姥忙住了鼓劉姥姥只得吃了一杯重又起鼓花枝將到劉姥姥之手他聽出鼓音將絶推著不肯去接晴雯在外面瞧準忙又急打幾下劉姥姥只得接了鼓聲截然而止衆人都笑道又該姥姥吃了鳳姐道咱們向來傳花的規矩接連兩次花在誰手吃了酒還要唱一支小曲兒賈母明知鳳姐頑他便道讓了劉親家這杯酒剛唱一個曲兒算數了劉姥姥道我不會唱別的曲兒就這聽見青兒在家裏哼哼咀咀唱的紗窗兒外高底兒響叮噹我也會哼兩句怕唱的不好聽老太太同奶奶姑娘們別笑話鳳姐道這支曲兒就好咱們正要聽你的妙音呢衆人瞧劉姥姥這樣兒唱的聲口可想而知今聽鳳姐加以妙音兩字已先忍不住要笑都瞪著眼瞧劉姥姥他便拿腔做勢擠眼咂嘴的唱了幾回嗓子唱出來老貓聲而且牙齒掉了一大半個個字兒不關風扭扭捏捏妝出許多惡劣的形狀來哼一句衆人笑一句直到哼完滿席的人都已笑得彎腰曲背不可支援賈母與劉姥姥近在一處瞧著他這一副扭頭額頸嘴臉越發好笑只得背轉身子把臉伏在翡翠肩上笑個不止寶玉聽了想起那年同薛蟠在馮紫英家行令比薛蟠唱的哼哼調更難聽一時笑止林之孝家的來回梨香院戲班還伺候著鳳姐問了賈母賈母道晚上正要瞧月亮兩隻眼睛那裏還有空兒看戲不如叫清音女孩子在山頂子上打兩套絲弦鑼鼓咱們聽橫豎兩個耳朵盡間在這裏當下一聲吩咐立刻傳到清音班上了山坡先打一套鬧龍舟只聽一隻一隻的開了出去又轉回來忽近忽遠隨緊隨慢真似有許多龍船在凸碧山莊鬧勝會一般劉姥姥聽出了神伸著脖子只望山頂子上瞧鳳姐笑道姥姥隔著路遠呢停會兒他們自然要劃到面前水裏來的你再仔細瞧罷賈母道這裏近著水聽山上的聲音越發幽雅好聽那年聽吹笛子雖然清裂覺得太淒涼了到底不比今夜的好又笑道就這中秋鬧龍船不配時景一點王夫人見賈母高興叫重換熱酒奉敬賈母此時月到天心銀蟾光滿四面彩雲微起照耀池中倒像水裏頭湧出一輪金鏡來了賈母十分樂道林丫頭説的果然不錯水邊玩月比山上更有趣又對劉姥姥道劉親家多飲幾杯別辜負了今夜的好月咱們都是八十以外的人了能再過幾個中秋劉姥姥道別説老祖宗正要享福我還想年年到這園子裏來再陪老祖宗過一百回中秋貪嘴吃好東西呢寶玉聽了劉姥姥的話他是想要常聚不散的便向黛玉寶叉們發呆道咱們果然得能如劉姥姥説的在這裏過一百回中秋才樂呢黛玉悄悄的説道便再活一百年我們這班人早成了劉姥姥了寶玉被黛玉一句提醒愀然有感惜春道二哥哥別想到將來歡喜也別想到將來煩惱眼前過一天的日子樂一天就是了話未完又聽山上打起鑼鼓各席上弄盞傳杯益添興趣丫頭媳婦們各自隨便在臺階上吃酒輪替上來伺候直到三更以後夜氣漸涼各人的丫環送衣服來添了賈母道今年這卷篷底下到底不比在山子上又多吃了幾杯酒倒不覺得涼呢一時用了飯撤開席面重又擺上圓月的果品另送好茶大家不過點景用了些又坐了一會賈母似有倦意王夫人便請賈母去歇息説聲已備軟轎伺候鳳姐等扶賈母上了轎衆人簇擁著送出園門各自回去黛玉拉了湘雲寶叉笑道我還捨不得凹晶館前這兩個月亮咱們再去坐一會子湘雲道怪不得你們成雙作對了連月亮都跑出兩個來了黛玉道你不瞧水裏比天上的月亮還有精華呢三個人一路説笑回至凹晶館前欄杆邊坐下見老婆子們還未散去黛玉道儘管收拾你們的叫小丫頭看看茶爐子留幾個細茶杯在這時就是了一語未了寶玉趕來笑道我就知道你們還在這裏這個好地方玩月不可無詩咱們四個人在此聯句罷湘雲道不瞞二哥哥説兩年前倒先偏過你了湘雲當把前事説明寶玉道我沒見過你們的詩何不背給我聽聽寶叉道我也沒見過黛玉道五言排律有三十多韻那裏記得清呢我稿也沒留想香菱寫在那裏姊姊幾時家去向香菱要來瞧就是了湘雲又道二哥哥要瞧我們的詩內中有兩聯好句我念給你聽寶玉道好妹妹你就先把這兩聯念給我聽湘雲便念出寒塘渡鶴影冷月葬詩魂這兩句寶玉拍手道真是仙句寶叉介面道凹晶館中秋賞月聯吟得此一聯已如劉禹錫賦金陵懷古詩探驪得珠元白擱筆你再別想在此聯句了湘雲道不做詩便步月咱們再鬧妙師父去寶玉聽了越發高興慫恿同行當下吃了杯茶一路步月來到櫳翠庵門猶未掩走進裏邊見妙玉供月才畢妙玉一面款接待茶先問寶叉借體回生一事又與黛玉湘雲追敘聯吟舊話大家即景敘情湘雲問妙玉可曾出庵步月妙玉道才送邢大姑娘出去在庵前站了一會一個人也無處可走就進來了湘雲道園中月色雖佳終有天上人間之別妙師父功行已深能如羅公遠擲杖成橋引挈咱們遊清虛之府否妙玉笑道法便有只恐瓊樓玉宇高處不勝寒耳寶玉便道自有繡襦並甲帳瓊台不怕雪霜寒妙玉注目微笑道彩鸞已得其雙猶羡慕鍾陵西山麼寶玉瞪了一眼四目互睜妙玉紅雲暈頰自回過臉去與湘雲們敘話當時雞聲已唱黛玉們猶清談不倦反是妙玉催促他們回去因便告辭妙玉送出庵門外寶玉與寶叉新婚尚未滿月同回蘅蕪苑去了黛玉拉湘雲到了蕭湘館薛姨媽已經安歇湘黛二人亦各就寢不提講到寶玉睡下想著劉姥姥講的女子要設法救他總睡不安穩記起那口鴛鴦劍可以鎮邪驅祟主意已得便朦朧合眼醒來天已明瞭忙起身下炕麝月上來伺候諸事完畢便叫他到怡紅院去取鴛鴦劍捧著跟他出了園門到賈母房後穿堂內站著等他麝月笑道像捧劍將軍站在這裏走個人來見了算什麼呢寶玉道我到老太太那裏請了安就出來的你別走開寶玉去不多時找了劉姥姥來對他説道我有一把寶劍能鎮妖魔姥姥你拿去叫他們挂在這女子屋裏那怪自然走避倘或不驗咱們再想法兒三日後拿劍來還我説著便把劍交付劉姥姥一面叫二門小廝雇車送劉姥姥回家劉姥姥把這話和平兒説明出門坐車回去了這裏瀟湘館薛姨媽起身梳洗才畢只見他家裏一個看屋子的老婆子慌張趕來問我們太太可在這裏住嗎同貴聽見接應道太太在這裏你來做什麼那老婆子走進屋裏見了薛姨媽開口便道太太不好了大奶奶要回家去了呢薛姨媽聽了啐道他要家去誰又攔他他去了倒得安靜幾天要你慌慌張張鬼趕來似的報什麼那老婆子道不是呢前兒太太過來了到了晚上大奶奶就喊不好過頭裏頭疼一晚沒有好睡昨兒因是個大節下沒去請大夫誰知病的死險到半夜裏過去了又醒轉來叫就請太太家去有幾句話説明白了再回他老娘家呢薛姨媽聽了又氣又急黛玉也過這屋子裏來問老婆子的話認得他就是那年寶叉打發過來送花兒胡説亂道的這一個因對薛姨媽笑道這婆子的話怕有些説不明白媽媽倒得過去瞧瞧那老婆子因黛玉完婚後猶未見面夾忙裏又與黛玉磕頭賀喜他向來只聽人家叫林姑娘慣的一口還稱林姑娘黛玉笑笑叫雪雁賞了他兩匹綢子薛姨媽帶了同貴就走回頭又對黛玉道寶丫頭那裏我也不過去和他説姑娘見他替我告訴一聲我家去看了怎麼樣再打發人過來通知你們説著走下臺階黛玉送至館門外香菱來了薛姨媽便同著香菱徑走園裏的角門回家去了黛玉到賈母王夫人處請了早安順便告訴了姨媽家裏的事回至瀟湘館同湘雲吃過早飯寶叉到來把寶玉取鴛鴦劍給劉姥姥拿去斬妖之事當笑話講了一遍黛玉亦將夏金桂病凶緣由告訴寶叉正説話間寶玉進來問知姨媽已回家去了便道早知姨媽回家我拉了邢大姊姊來了他一個人在屋子裏怪冷靜的湘雲在里間屋子裏聽見忙出來道咱們同去瞧他三個人正要起身到紫菱洲去見賈蘭來了復又坐定賈蘭與各人請了安寶玉命他坐下問下場裏頭幾句話又問你環叔叔三場都完了沒有賈蘭答道三場都完了一面在袖管裏取出場內做的文章站起身來送與寶玉觀看寶玉從頭至尾大略看了一遍便叫五兒取筆硯過來五兒送過筆硯磨好了墨寶玉提起筆來正要加批又問太爺看過了沒有賈蘭道還沒到書房裏去先送來二叔叔看了再去呢寶玉道既是太爺沒有看過我不便動筆説著重又放下筆道你這起講開門見山驪珠在握起比未見出色中二偶筆勢夭轎中權握要所嫌後幅單薄了些據我看起來中是中的了名次恐不能高講到時藝一道原不過假他誆取功名之具與聖賢立心行事竟是天然相反的要知心平則無嶮巇之思心直則無邪曲之私推之路平則行人便水平則放舟穩凡一切裁料造作古人于規矩之外匡之以繩墨皆取乎平與直也獨文章用筆則大忌此兩字你將來持身立行務要反乎作文之用筆庶俯仰無所愧怍賈蘭應了幾聲是寶玉一面和賈蘭説話湘雲笑道二哥哥深惡而痛嫉之者是文章見對聯上有了這兩個字連這屋子裏都不肯進去坐的虧他場裏頭不知寫些什麼公然鄉會兩試中式點了詞林想是文曲星在天上也跟著紅鸞星跑的寶叉黛玉聽了道這咬舌頭的又不知謅到那裏去了寶玉也笑道難道我評的不是嗎湘雲道如今你是一位老前輩了誰敢説你評的是不是呢寶叉道我聽他並不是老前輩的講究又談到禪門裏去了大家説笑了一會賈蘭告辭走了只見鳳姐處打發人來道姨太太家大奶奶不在了寶叉因完姻尚未滿月黛玉雖已認在薛姨媽侍下素日亦甚鄙夏金桂為人不相浹洽鳳姐正值家中有事分身不開王夫人是長輩都不過去惟寶琴不能不回家幫著料理瑣碎事務寶玉亦不過的那邊一吊並不久坐就回來了卻説櫳翠庵妙玉中秋那一夜送了黛玉諸人出庵獨自一人對天仰望見彩雲羅疊回護團漸漸現出霞光萬道俗語所謂中秋月華是也妙玉呆呆看了一會但聽秋蟲唧唧四無人聲不覺露冷衣單回進禪房見小環和老婆子們東倒西歪鼾聲盹睡妙玉叫他們起來重添爐火煮茗滌煩打發他們去睡了自己做起靜攝功夫來才合眼朦朧只見寶玉來拉他道妙師相許伴入仙壇西山絶頂處不遠矣妙玉道我是跳出火坑的人了此時夜深人靜你來纏我則怎寶玉笑道非是我來纏你你多次有情於我我怎肯漠然妙玉厲色道這話奇了我何曾留情於你寶玉道你可記得耳房裏把你自己常用的緑玉鬥飲我梅花雪水咱們在蘆雪亭賞雪聯吟我獨自一個人到你庵裏多情贈我紅梅檻外人飛帖賀我生辰又一回你在四姑娘屋裏下棋我一句話問得你兩頰生春後來我們兩個人同到瀟湘館竊聽彈琴這幾樁事可都是有的嗎還有別人不知道的情節也不須我講出口來請妙師自去心照妙玉著急道寶玉你莫非瘋了膽敢這樣放肆還不快走我是要去告訴你家老太太呢寶玉道我非園子裏的寶玉你告訴誰去妙玉道你非園子裏的寶玉是那裏來的呢寶玉道你不知我來的所在但看我去的地方説聲便向妙玉胸前一撲霎時不見妙玉驚喊一聲跌倒地上幸有一個老婆子尚在看管茶爐未睡喚醒夥伴把妙玉扶起服事他睡好忙進薑湯灌治至天將明漸漸平復又睡了一會雖于氣體尚無妨礙而煉性功夫已間斷了心中焦急不得主意便叫老婆子去請四姑娘不多時惜春到來妙玉一把拉住惜春的手歎道我是枉費推移方羡你中流自在行竟漠視不作他山之助惜春道這是你的心病何處求得友聲説著見妙玉臉上一紅無言可答惜春便道只有一個推雲淨月之法把你心上的渣滓移在臉上這腔子裏就乾淨了包管你此後功夫再無阻滯妙玉道有法你且説來惜春道法雖有你可別懊悔妙玉道你這話説得我奇我只要把這一關打通了即使刀鋸在前亦所不懼有什麼懊悔呢惜春道你如果心堅力果立可奏效叫個老婆子跟我去給你一服藥只須用清水調了臨睡時塗於臉上明日起來即在鏡中見效妙玉道我要驅除心頭魔障怎在我臉上擺弄起來這不是隔靴抓癢嗎惜春道你試試瞧當下站起身來便去取藥老婆子跟去帶了藥來交付妙玉妙玉總不解其故且依言敷上不知此藥上臉怎樣疼痛難受豈知毫無痛癢及至次日起身將藥洗去對鏡一照只見臉上一片片青黑相間洗擦不淨竟變了一個奇醜的形狀本來面目已歸烏有妙玉初照鏡時又嗔惜春將他戲耍轉念一想知他定有作用只歎了一口氣把菱花擲地碎了幾塊從此誓不對鏡了以後參禪打坐起來果然如月到天心風來水面一關通徹一關佩服惜春之至一日惜春到來見妙玉面龐已變便襝衽稱賀妙玉感謝無已又道我雖由之尚未透徹所以然之理惜春道冶容誨淫四個字儒家淺言是推到外邊去講的如慢藏誨盜一般佛家元論則不然須要收到腔子裏來由己及人其中細微曲折也不容我再説你細細去想這四個字就明白了妙玉點頭道早知燈是火飯熟已多時總因我的根基不如你惜春道並非根基不如我不過我的心比你乾淨些罷了不説二人談論且將惜春作用代為表明要知潘車過處東村女自漸形穢必不輕將果擲則心中較為清淨今惜春即以此法針灸妙玉之病確是對症發藥話休絮繁再講寶玉記挂鴛鴦劍時刻盼望回音到了第三日果見劉姥姥進園來了寶玉忙向前問訊未知能否除妖且聽劉姥姥如何答言下回分解
