body:
  text: 第二回識病源瞞生施巧計接家音證往悟冰心話説鳳姐講到要治寶玉的病須用瞞天過海之計便道除非把林姑娘回過來的話瞞他一輩子才好襲人聽了這話回過臉來只瞧著寶叉鳳姐道寶姑娘這會兒是不肯出主意的咱們商量停當是了襲人道這句話怕老太太不依鳳姐道要寶玉的病好老太太有什麼不依你也不用管帳只囑咐寶玉屋子裏人不許多嘴再等兩三天看寶玉的病果然有了起色我就把這番話和太太説明再去告訴老太太包管辦得妥帖襲人又笑道難道叫他兩個人總不見面嗎鳳姐道一個在這裏一個在園裏頭路也隔得遠況且大家起不來就等他們病好了寶玉屋裏林姑娘未必來如今園裏住的也沒有幾個人將來寶玉要到園子裏去就請大奶奶姑娘們大家走了過來説園了裏頭冷靜得很去逛不得大家哄住了他再商量底下的話襲人聽了並無言語鳳姐一面罵平兒道這蹄子在屋裏不知幹些什麼到這時候也不叫個人來襲人指著笑道那不是小紅提著燈在這裏接奶奶呢鳳姐道走來也不叫人見過面你也像寶二奶奶裝新媳婦怕見人嗎小紅道剛才掀開簾子見奶奶和襲人姊説話才回了出來呢説著連忙提了燈照鳳姐回去襲人自去伺候寶玉寶玉卸妝安歇書不細表鳳姐回到屋裏平兒忙迎了出來鳳姐便問有什麼人來回事沒有平兒答道沒什麼要緊事就是旺兒家的來説那一家子還要挪三百兩銀有扣頭的我説這一宗的利銀還沒清楚等奶奶回來了你自回奶奶去他就走了再寶玉喜事裏的雜項費用老爺起身的盤費同跟隨的人雇的車價都有帳單送進來了説庫上沒有存項別處張羅來墊發去了説著要去拿帳單子鳳姐鼻孔子裏出了一口氣道忙什麼這宗銀子還不知指著那一項子來開發呢鳳姐又問二爺呢平兒道才送了老爺回來就去睡了想是這幾天也鬧的乏了鳳姐道委實有些支不住你也去歇歇罷不提鳳姐這裏的話再講李紈回至稻香村才進屋門見林之孝家的的站著李紈問你這會兒還在這裏有什麼話嗎林家的陪笑道恭喜林姑娘已回了過來一件東西是人家讓轉來的他們要現錢交易昨兒要緊央中間人挪來墊發的了如今退不回去知道帳房裏也很飢荒憑空費了許多銀子置了一宗鈍色頭貨倒是一件作難的事李紈道你明兒且叫人説去退得轉很好果然退不回去也説不得回了二奶奶停幾天張羅銀子給他們就是了林家的道也只好那麼著我剛才就要回二奶奶因在寶二奶奶屋裏不便提這話如今還要請大奶奶的示退不了這件東西放在那裏李紈想了一想道要不是地藏庵便是水月庵這兩處且擱著再叫外邊留心碰著有人家要就出脫了他虧折幾兩銀子也使得林家的道差不多的人家輕易撈不起這種價錢叫他們留心就是了説著回身出去李紈自同賈蘭安歇不提卻説寶玉自從那日昏暈之後醒來似有覺悟精神清爽飲食漸增連接四五日竟似忘了黛玉一般口中絶不提起林妹妹三個字來襲人刻刻在旁窺察暗暗歡喜便去告訴了鳳姐鳳姐到王夫人處便把寶玉近日光景説了一番又將前日在寶叉屋裏和襲人講的話細細説明要討了太太的示下再去回老太太王夫人道我是巴不得寶玉安靜有什麼不願意呢鳳姐道我跟了太太過去我自有話回老太太寶兄弟是老太太的命根我們也都為的是寶兄弟估量沒有釘子碰下來萬一老太太不依自有我去承當總不與太太相干話未完只聽得窗外小丫頭子説道琥珀姊姊來了説著琥珀掀簾進來見了鳳姐道二奶奶也在這裏老太太請太太過去説話呢鳳姐問道老太太這會兒歡喜不歡喜琥珀道剛才叫鴛鴦到園子裏去瞧了林姑娘回來説林姑娘的病竟好起來了老太太先聽了歡喜後來又像有了什麼心事似的王夫人又問老太太叫我有什麼話琥珀道老太太只叫我來請太太不知有什麼話估量不過為林姑娘的事王夫人連忙起身同了琥珀往賈母處鳳姐隨著過來便先陪笑道恭喜老祖宗寶兄弟同林妹妹的病都好了到底托老祖宗的福賈母道這也是他們自己的造化一面向王夫人道我叫你過來也沒別的話説就為想著林丫頭這件事如今寶玉已成了家怪可憐林丫頭沒了爹娘我又有了年紀他舅舅到了任上事情也繁那裏想得到這些還是要你做舅母的疼他一點王夫人尚未答應鳳姐介面道這件事太太也常提過的別説太太該上緊就是我們也該體貼老祖宗的意思盡一點子心底下有了合意的人家就來告訴老祖宗喲賈母道那呢遲早有個定數一時也要緊不來我不過説這句話給你們聽我瞧寶玉這幾天光景很好還服王太醫的藥嗎王夫人應了是賈母道他的醫道本來穩當等寶玉好了要重重酬謝他才是鳳姐笑道王太醫的手段果然好老祖宗還不知襲人用的藥妙呢賈母道你又胡説了襲人知道用什麼藥鳳姐道寶兄弟成親那夜的樣兒老祖宗是看見的後來我們才送老爺出去他又迷迷糊糊起來拉著襲人要去瞧林妹妹那時候還不知林姑娘回過來的信襲人識透寶兄弟的病根也虧他有膽量竟告訴他林妹妹病凶已經這麼樣了寶兄弟傷心了一會後來知道無可如何便斷絶了別的念頭心也安靜了才一天好似一天起來倒不是襲人的一服清涼散嗎賈母聽了點點頭道果然是這麼好怕底下他們見了面寶玉還是那麼孩子氣起來又纍墜呢鳳姐道老祖宗慮的是據我的糊塗想頭要除寶兄弟的病根只好把林妹妹回過來的信瞞他到底不叫他兩個人見面再沒飢荒了賈母閉著眼半晌説道叫我也委實作難你們想得到只要寶玉的病好憑你們怎麼樣就是了鳳姐探了賈母的口氣又説些間話與王夫人各自回去鳳姐便呼叫平兒去告訴了襲人這裏黛玉回生之後醫藥調養病體日輕一日夜間睡臥安寧神情亦頗恬適想起離魂之日所到地方光景與仙子一番敘話雖仿佛有些蹤影不能記憶清楚又想到先前聽了傻大姐一句話病至垂危焚巾毀稿怎樣痛苦如今連自己也不解其故心中竟似秋雲無迹止水澄空把天荒地老石泐金寒銷不去的一團恨塊已化為烏有了先幾天不見紫鵑便問雪雁雪雁怕傷了黛玉的心不説他們病重的緣由只含糊答應説紫鵑因是感冒了在他自己屋裏躺著黛玉心想紫鵑不到十分不能支援的分兒斷不肯不過來一走心中疑惑便支使開了雪雁細向小丫頭盤問黛玉聽了止不住心中傷感掉下淚來停會兒雪雁走進叫他去告訴紫鵑安心養著別性急過來養他自己的病勝如養我的病一般又吩咐小丫頭們隨時過去照應不許躲懶雪雁便將黛玉的話告訴了紫鵑紫鵑知道黛玉病體漸愈十分快慰因黛玉叮嚀也不想掙扎過去便向雪雁道好妹妹我這幾時躺在炕上全彀兒把姑娘那邊的事都撩開了要你和春纖兩個出一點力我起來給你們磕頭雪雁道你的心也不必使到這上頭去姑娘如今不比頭裏夜間茶也不喝就是睡到三更天醒來嚷肚子裏飢我起來端了一碗燕窩熬粥給他吃了那一覺睡到天明才醒呢紫鵑道那麼説起來姑娘竟大好了二人又説了些間話雪雁自出去了那一天紫鵑坐在炕上把被圍著下身向小丫頭道剛才大奶奶那裏送了一碟玫瑰餡子的穌油餅過來很配口我多吃了一點了這會兒胸口裏覺著有些發膩你把榻上這一個靠枕拿過來放在背後讓我歪著靠靠一時小丫頭捧過靠枕向炕上一放袖管裏掉了一張四折的字帖兒出來紫鵑伸手拾起展開一看是一張五千錢當票卻認不得寫的什麼物件紫鵑問道這是那裏來的小丫頭正要答話雪雁進來看見道叫你拿去掖在我炕上褥子底下怎麼又交給紫鵑姊姊看起來紫鵑道那倒不是他給我瞧的我叫他端個靠枕過來袖管裏掉出來我看見的正是我要問你為什麼當當雪雁道你不是叫我和林大娘説過到璉二奶奶那裏去支月錢他回報不能破這個例後來送了四吊錢過來説是他替己的叫我且對湊著使如今過了期月錢還沒送來估量他們就要頂對這幾吊錢所以也沒有去支好幾回大夫來的轎錢他們也不管連藥錢都是自己的昨兒就斷了錢沒法兒我拿了一個金戒箍指叫管園門的老婆了去當了五吊錢來且使著我想他們那邊雖説天天打飢荒也不短我們這幾個錢姑娘分上也太頂真了老太太那裏知道這些事情呢前兒素雲悄悄的和我説為了林姑娘的事他奶奶也落了不是紫鵑道大奶奶落什麼不是呢雪雁道就為辦了這件東西花的錢太多了如今白白的擱著叫什麼開銷這筆帳他奶奶還沒有知道這些話呢紫鵑聽説歎了一口氣道姑娘正在這裏住不得了又叮囑雪雁道那可叫姑娘知道不得的一面把當票遞給雪雁叫他收拾著停一天就去取了出來雪雁走了紫鵑一個人想起先前他們在一堆兒好到這麼個分兒如今寶玉雖然負了心料林姑娘決不肯再打別的主意就算回過來的人該看破一切把憂愁煩惱都撩去了到底作何了局呢或者寶玉心裏未必肯丟了姑娘今番這節事不是他情願的底下還可商量的不知人家心裏又是什麼樣況且寶姑娘已占了先去論到名分上頭也是一件難事怕姑娘未必肯受委曲心中七上八下算後思前倒做了從前的一個林黛玉了心上鬱結不開又因這一點積食凝滯在胸渾身發燒病又翻覆起來變了一場小傷寒重須醫藥清理自不必説且講黛玉病已脫體只懶於應酬尚未出去走動一日晨妝對鏡見臉上顔色如帶露桃花精神飽綻雪雁在旁伺候梳洗已畢聽見簷前連聲鵲噪雪雁笑道昨兒晚上姑娘屋裏開了半夜燈花今兒喜鵲又叫姑娘有雪雁説到這裏見黛玉瞪了他一眼連忙改口説有客來呢一語未了只聽得有人走進院子裏一路話道姑娘就在這裏住喲種的多是竹子青翠得好夏天自然透涼的了黛玉聽的是南邊口音連忙出來站在屋門口簾子裏往外一瞧見周瑞家的引了兩個面生女人進來年紀都約四十以內模樣才上臺階周瑞家的先開口道恭喜林姑娘家裏打發人來接姑娘回去了那兩個女人進來釘眼細認了黛玉半晌周瑞家的指道這一位就是你家姑娘喲兩個女人連忙跪下磕了四個頭黛玉他他們扶起兩個女人退了幾步笑道姑娘也認不得我們了黛玉道瞧著很面熟呢那一個女人指著那一個道他和我都是二太太的陪房那年二老爺赴任的時候我去看姑娘姑娘還小記得有一位姓賈的師爺在書房裏念書後來聽説姑娘到舅太爺這裏來了因隔的路遠好幾年不通音信二老爺調了廣東布政這幾年很好年紀還不算大因是衙門裏的事操心太重得了個怔忡病上年春裏就不在了先在從前大老爺衙門東首這條街上買了一所大房子打發人回來修葺連後面園裏也蓋了許多房屋又堆了幾座假山上年添補了好些樹木花卉秋裏扶柩回來二太太就搬進新屋裏去住了姑娘不知二太太跟前只有一個少爺今年才得七歲老爺臨終的時節囑咐太太這少爺要一門兩祧過繼在大老爺這邊的也算得姑娘的親兄弟因為年紀還小不能同來叫我們到這裏不要多耽擱怕遲下去天氣熱了有少爺稟老太太的稟貼投在門房裏送到上頭去了姑娘這裏沒有家書二太太叫我們問好送姑娘的東西還在箱子裏不曾打開同來的人叫我們先對姑娘説聞他明日進來請安帶來黛玉點點頭又問了他們幾句話心甚歡喜原來林如海本無親友兄弟這一門也將近出服的了因靠林如海之父教養成人讀書發達與如海誼若同胞從前遠宦他鄉如海故後聞黛玉已被舅家接去音問久疏今黛玉之叔已故他嬸母扶柩還鄉念侄女黛玉寄養舅家故遣人往接回歸完其婚嫁大事以報從前恩惠話休繁瑣再講黛玉正與兩個女人説話只見小紅急急跑來叫道周嬸子奶奶説林姑娘家裏來的人見過他姑娘叫你陪到那邊去吃飯呢周瑞家的笑道正是這兩位嫂子剛才見了老太太太太因你奶奶正忙著還沒見過我們去見了二奶奶下來吃飯估量姑娘這裏也還沒有擺飯呢説著便讓了兩個女人便同出去回頭不見小紅叫了兩聲小紅連忙走了出來跟著説道我去瞧瞧紫鵑姊姊呢一時周瑞家的一衆人出了瀟湘館這裏黛玉暗想一個人的心是著不得急的須如流水行雲才除得一切煩惱記得先前夢見家裏有人來接我回去心裏又驚又怕又氣又急如今當真家裏有人來了為什麼倒歡喜起來呢可見魔緣夢入夢由心生心既無滯再沒有這樣惡夢來纏擾了想了一會見老婆端上飯來雪雁春纖伺候已畢黛玉獨自一個走到紫鵑屋裏打發小丫頭們也去吃飯紫鵑先開口問道聽見姑娘家裏有人來接姑娘了嗎只問了這一句底下便不説什麼原是要探黛玉的口氣黛玉早已立定主意叫了一聲紫鵑妹妹道難為你貼力體心服侍我幾年咱們兩個原想在一搭兒過日子的如今説不得只好各人走各人的路的紫鵑聽説雖已猜透幾分假作不知問道姑娘為什麼説起這句話來黛玉道我這一場病後早動了回南的念頭可巧家裏有人來了真是天從人願就是你病還沒好我在這裏多住一半個月等你同時走也沒有什麼使不得但我的心事只可告訴你一半料你也猜著一半不知猜的準與不準所以我不好叫你不去又不好叫你去只可憑你自己主意紫鵑聽了只是拭淚停了半晌才回答道想姑娘也捨不得我偏害了病起不得身沒有倒叫姑娘等著的道理這會兒且挨著底下終要跟了姑娘在一堆兒的原來黛玉從前本思主婢同歸一處今既初願已乖一空色相自不便作雞犬同升之想雖然回至家鄉亦可為紫鵑另謀所適但紫鵑本非自己帶來的人或者數年來亦有癡情也未可料況若輩自不難於金屋中添一位置黛玉想到此處便不肯徑情帶了紫鵑回去而紫鵑不想回去之故卻無半點私情全為黛玉起見想寶玉娶寶姑娘一事尚未明白不知他聞了姑娘病凶的信怎麼樣姑娘回過來之後又怎麼樣此番姑娘要回家去更怎麼樣偏偏一些消息不通如今的寶玉好像隔了千山萬水一般我若跟了姑娘回去南北分開竟如石沈大海了不如託病為由且住在此間將來見他討一個確信隨機應變再到南邊説去尚可挽回于萬一此是紫鵑與黛玉兩個人各有意見之處且講黛玉聽紫鵑口氣他既願在這裏自然有戀戀朱門之意將來未必不遂其欲也丟刑事一樁心事又想到病中難為他這番光景未免依依坐了一回到自己屋裏叫雪雁吩咐道你們趁空兒收拾起來那邊拿過來的古玩陳設同些動用的器皿家貨現在手頭還要使著的且別去動先把使不著的檢點檢點我們走的時候一同交給他們省得臨時嚕嗦路上要穿的衣服多留出兩件把穿不著的都疊了箱子紫鵑是不能同去的了要你們諸事經一點心才好雪雁本來也靈動因紫鵑上了前分外出色黛玉總離不了他所以雪雁就退了一步今聽紫鵑不跟回去諸事要靠著他們雪雁就盡心周到起來黛玉也頗稱意此是後話不題再説鳳姐先前這幾日知道寶玉與黛玉兩個人的病已好兩邊都可出門走動怕似提影戲兒戳破這張紙心上十分著急正要盤算一條出路這一天聽説林姑娘家裏有人來接他喜出望外知道周瑞家的引到園子裏去了便叫小紅去同了來那兩個女人見過鳳姐彼此問些家常話鳳姐便道你們來接姑娘怕要白走了一趟呢我們老太太是第一個疼你姑娘姑太太又歿了姑娘回家去老太太總不放心前兒還在我們太太跟前説起要給你家姑娘留心好親事呢兩上女人陪笑道老太太同奶奶自然要留姑娘叫我們底下人倒作難了在家裏起身時節我們太太還再三囑咐務必要接了姑娘趕早回去不要耽延日子要求奶奶在老太太跟前方便一聲賞底下人一個臉鳳姐故意躊躇道論理我也該幫著老太太留你姑娘沒有倒聽你們在老太太跟前叫你姑娘回去的但聽你們講起來也是一件為難的事遠遠的跑了一趟叫你們空回白轉到了家怎麼銷差呢那兩個女人忙陪笑道奶奶説的真是體諒我們的話鳳姐道我自然想法兒去回老太太我再教你們幾句話總要説你們太太惦記姑娘到十二分回去如同自養的女兒一般他時常提起要替姑娘訪一位好姑爺的話兩個女人道這話倒是真的我們太太因自己跟前沒有千金從小就喜歡姑娘如今回去見了怕不似親生的一個樣兒奶奶只管請老太太放心説著鳳姐便叫周瑞家的陪了下去吃飯接著林之孝家的進來回了幾件事鳳姐逐仲吩咐了話一面叫平兒留心暗囑周瑞家的別引南邊來的女人到寶玉那邊去且看鳳姐往賈母處如何回話且聽下回分解
