笑臉微紅向慶齡腮邊輕輕的擰了一把道都是你們胡鬧惹出史大姑娘的話來了又向湘雲道姑娘剛和我們取笑算什麼呢黛玉介面道再沒有雲丫頭這張嘴討人厭湘雲道你是聽了老太太的話要圖舒服怕做媽呢席上哄然一笑黛玉道等明年咱們都到他家鬧去少不得有翻冤的日子一面講話聽唱了訪素踏月兩套湘雲道剛是哼哼咀咀的聲音不耐煩聽他慶齡去叫他們開一套闊口慶齡道唱大淨的嗓子疼不能唱曲寶玉道那麼叫戲班裏的人來他們是走得轉的便叫老婆子去不多時大淨葵官進來各人面前請了安就站在湘雲跟前湘雲道葵官好好的唱兩套曲子給咱們聽走了板眼是要捶的葵官忙去入座開口唱了一套山門又接唱一套掃殿一面湘雲又要行令射覆黛玉道你才聽了兩套大淨曲子好比大碗的酒大塊的肉解過你的饞了這會兒間情逸致令興又發勸你蠲了這條子罷怪慪人的誰去弄這個湘雲道不行令便搳拳三拳後勝贏家過拳輸家唱一支昆曲他們的笛笙鼓板現成不會唱曲的叫他們代唱會唱的不準代衆人聽了都説這倒公道便推湘雲出手湘雲一伸手就找鴛鴦鴛鴦道史大姑娘怎麼先找起我來湘雲道你還叫我史大姑娘先罰一杯便叫翠縷與鴛鴦姑娘斟酒當下搳了三拳偏偏湘雲輸了衆人都道盼他輸了拳咱們好聽昆曲湘雲不等人家催他叫遐齡吹笛接了鼓板過來開口唱了一支蝴蝶呵慶齡道闊口最難史大姑娘好嗓子我們班裏唱淨的那裏趕得他上來寶玉道史大妹妹愛唱大淨曲子先前偏就把葵官分給他再沒那麼巧的一面鴛鴦向岫煙對手鴛鴦輸了後拳叫他們代唱岫煙又找了玉釧以次而及黛玉寶叉輸了因無外人都自己隨便唱了一支席上鶯聲燕語翠舞紅飛呼姊喚妹之聲與叫二猜三之韻徹於怡紅院外獨有襲人心想自己此時仍得與晴鵑等並住怡紅院人逢喜事精神爽合當開懷奈思前算後似有一團鬱結在胸難以消化之處和他們坐在席上意興索然只得推病向衆人道我身子疲倦要歇歇去呢晴雯知他的東西還在瀟湘館裏沒有拿過來便道你到我炕上去躺躺罷襲人起身走上臺階晴雯笑道睡便去睡別像在雪雁屋裏鶯兒問道在雪雁姊姊屋裏怎麼樣紫鵑知道這件事便瞧了睛雯一眼道鶯姊姊你別聽他的話鶯兒還向晴雯根問晴雯忍不住要笑道他在雪雁屋裏就像你今天晚上在你自己屋裏一個樣兒的鶯兒還怔怔的想了一回道我不明白你的話衆人都不理會惟麝月已聽出話來瞅著鶯兒只是笑半晌説道你儘管慢慢想去到了明兒包管你就明白了話未完只聽裏邊探春道外面姑娘們為什麼喝的能雅靜晴雯介面笑道他們裝新的裝新作客的作客不像奶奶姑娘們那麼高興呢於是晴雯鼓起興來各人也拇戰了一會天已晚了各席上並翻軒下挂的燈一齊點起蠟來湘雲嚷熱叫翠縷去拿小毛衣服換上李紈道這天氣太暖了怕要蒸下雪來寶玉道半仙閣前的紅梅都開了我天天在這裏盼下雪老天老天快快下一場雪就好寶叉道諸葛孔明在東吳借得東風大破曹兵百萬風可借雪也借得可惜如今請不來一位孔明先生岫煙道四妹妹就算得一個女諸葛何不求他去一借惜春在袖裏占了一課算準長至前三日有一場瑞雪便道二哥哥你們盼雪我就借一場下來寶玉問幾時可有惜春道遲了日子不算為奇要借便借在冬節前寶玉道那麼請老太太到半仙閣去賞梅咱們大家樂一天湘雲道四妹妹果然有這樣神通賞梅酒席之費攏共算我的惜春道正是這樣冬至前沒下雪我便作東賞梅何如探春道咱們是腳踏兩頭船不用掏腰總有吃喝寶叉道誰的東都沒要緊倒要瞧瞧四妹妹的本領黛玉悄向寶叉道你不信這東道雲丫頭要輸呢一時清音班裏鬧起絲弦鑼鼓來各席上洗盞更酌又暢飲了一會湘雲站起身來叫翠縷掌燈道少陪你們了留些量在這裏做消寒會衆人看他步履欹斜舌音舌延舌單今兒又喝得大醉了黛玉便叫門外伺候的老媽子掌了燈同翠縷送史大姑娘回去湘雲步下臺階衆人送他也不理會還唱的醉熏熏眼花被旁人笑咱行過了碧峰尖早來到山門下連清音女孩子都笑道史大姑娘醉了李紈道咱們也該散了別盡仔鬧下去當下用飯盥漱已畢各自起身回去這裏晴雯紫鵑都説鬧了這一天我們都乏了聽鍾上的點子也該歇的時候了不知二爺到那一位姑娘屋裏去歇晴雯又笑道二爺還該先進襲姑娘屋裏今夜可再沒人來打你們的岔了那知襲人已經閉門安歇晴雯道如今鶯姑娘可不能把二爺推到怡紅院外頭去了説著便同紫鵑送寶玉到鶯兒屋裏又來拉了鶯兒進去晴雯紫鵑轉身出來拽上屋門一路嘻笑各自回去鶯兒屋裏早炷上安息甜香湯壺茗具一切安備停妥鶯兒背著燈遠遠站在錦子旁邊寶玉拉他坐下道怎麼常見面的人重新生分起來你可記得在這屋子裏給我打梅花絡子的時候鶯兒道如今倒記得的寶玉道聽你的話莫非頭裏竟忘了為什麼到如今又記得呢鶯兒臉上一紅道見了這屋子自然記起來了寶玉道你説你姑娘有幾件好處果然不錯可惜我先前沒有細細領略如今第一樣他身上這般甜靜可愛的香味兒就沒了鶯兒道這是張家姑娘不服冷香丸的緣故寶玉道你為什麼不服冷香丸鶯兒撲嗤的一笑道這是姑娘醫病的我服他怎麼呢寶玉道你服了這個一般像你姑娘有這樣好處了鶯兒聽了寶玉這句話羞臉微紅把頭低了下去一時松扣寬衣少不得如晴雯輩共試橫陳之樂次日起身鶯兒到賈母王夫人處磕了頭又往各處去走了一走襲人只在瀟湘蘅蕪兩處與黛玉寶叉磕頭黛玉叫他坐了才説道我有幾句話和你講襲人聽了料黛玉此時定有一番嚴飭心上怔怔的忙站了起來黛玉笑道不為別的就因二爺如今伺候他的人多有時候倒沒人伺候了一時要穿起那一件衣服來不知那件衣服撩在什麼地方找也沒處找你同晴雯是向來經由慣的鶯兒紫鵑是生手我派你同鶯兒管二爺夏秋衣服晴雯紫鵑管春冬衣服比如出門要穿什麼二爺在我這裏這裏打發人去告訴你們就拿了出門衣服到這裏換上回來又在蘅蕪苑奶奶那裏自有蘅蕪苑的人去告訴了把出門的衣服換下拿去收拾我叫人把二爺的四季衣服箱子都擡了過去講到吃飯他玩高興了連飯也可以不吃的這裏估量他在那邊吃了那邊又道他在這裏歸根兒一處也沒有著落如今叫廚房裏替另備了二爺的一桌飯二爺在那裏就叫那裏的人去傳飯也責成你們四個人留心到擺飯時候打發人到廚房裏去問一聲二爺的飯發到那裏去倘廚房裏回報沒人去傳過飯即刻到園子裏各處去查問了再傳你們的飯這樣定了一個章程你們伺候的便有個頭緒至於別的事情也要你們留一點子神別叫他放縱了自然你們各人也都知道不用我囑咐這些話晴雯紫鵑幾個人我也要告訴他們話未完門外老婆子們報蘅蕪苑奶奶來了早有小丫頭打起簾子寶叉進來黛玉見他已換上衣服一面讓坐便問姊姊那裏去寶叉道我們都不知道四妹妹就是送妙師父那一天他回來已悄悄的挪到櫳翠庵去住了昨兒他在我們跟前説起今兒早上知道來邀你同去走一趟黛玉道姊姊就在這裏吃了飯邀雲大妹妹同去寶叉道我是飯吃過了這時候為什麼這裏還不見擺飯黛玉道因是剛才和襲姑娘多説了幾句話所以遲了些於是黛玉便把吩咐襲人的話和寶叉講了寶叉道原該這樣的是你想的周到黛玉回過臉來見襲人還站著便道你也該回去吃飯了然後襲人轉身走出自回怡紅院去這裏雪雁端茶送了寶叉春纖五兒兩個伺候黛玉用飯已畢換了衣服四兒五兒跟著寶叉黛玉徑往紫菱洲來岫煙湘雲也正要到櫳翠庵去寶叉笑問湘雲道夜兒回來半山亭可打塌了沒有岫煙道我回來的時候他早已酣入醉鄉的了説著出了紫菱洲又去邀了探春不知衆人到櫳翠庵見了惜春怎樣光景且看下回分解
