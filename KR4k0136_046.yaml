body:
  text: 第四十六回開綺筵豪飲賽清歌抱錦裯分房還故寵話説黛玉在蘅蕪苑要與寶叉講話原因聽了雪雁告訴上一夜在襲人屋門外聽見寶玉在裏頭説的話並他們前日兩個在雪雁屋裏的事知道寶玉向來脾氣是這樣的叮囑雪雁不許多嘴不但不嗔怪襲人反動了個垂憐之意來到寶叉處見探春湘雲同在屋裏未曾提及等他們走了便向寶叉道襲人進來有兩三個月了萎萎蕤蕤的縮在我屋子裏連話也沒有一句瞧他的光景也怪可憐先前服事他二爺這幾年也還實心可惜錯走了一步橫豎這一個不理論這些不如依舊到怡紅院去同晴雯紫鵑一樣的伺候姊姊以為何如那襲人出嫁這件事是寶叉恨氣勸過他的後來寶叉回生知道襲人嫁到蔣家又退了回來甚悔先前不該勸他趕緊走這條路如今進來住在瀟湘館當差連這裏也不見他常來走動想到他許多説不出的苦處甚難為情惟暗地裏打聽他的光景亦無可如何難得黛玉發心説出這句話來倒替襲人感激便道我也有此意妹妹既然疼顧他是極好的了黛玉道還有一句話我瞧你的鶯兒頗有忠心人也穩重何不一同收了他寶叉笑道林姑娘樛木之恩怕他屋裏的人太多了呢黛玉道我有樛木之恩莫非你無江沱之悔嗎寶叉道可惡鶯兒這東西先前在園子裏頭見了這一個一般説笑不避如今反是冷冷兒的臉輕易不肯上前我也猜不透他是什麼緣故黛玉道你不解這緣故我倒和你説了罷這是他的餘怒未消寶叉道他怒什麼黛玉道你不知道他為的是黛玉説到這裏又一笑住了口便道咱們講正經鶯兒這件事須得要去回太太一聲襲人等他病好了叫過怡紅院去只當沒這件事誰還來理論這些只算咱們兩個人瞞官法度幹了這節事寶叉笑道按律治罪你是個起意的我該為從減等黛玉坐了一會自走了講到鶯兒竊聽剛才的話心上雖感黛玉為人公平只因寶玉這一走待姑娘如此薄情卻不願做他屋裏人又想捐軀守義原要同姑娘死活在一處如今不允這件事少不得有走散的日子況且寶玉待女孩兒們再沒得説的了難道比這裏還有好的地方心上盤算了一會也願意了再講寶玉出了蘅蕪苑性急要聽王夫人認的幹女兒是那一個在路上再三根問探春探春早知細情的底細便和寶玉説明一路間話到蓼風軒老婆子回報妙師父打發人來請姑娘説話去了寶玉道四妹妹到了妙師父那裏未必就回來咱們瞧邢大姊姊去説著便往紫菱洲來湘雲道我從小兒到如今再沒有像今年和邢大姊姊住的久了來喝了林姊姊的喜酒接連下去竟沒空兒回家瞧這園子裏頭比先前熱鬧了許多該是興旺氣象就沒這些敗興的事蹦出來了探春道到年不過兩個來月這兩個月裏頭熱鬧的事正不少呢你過年也別回家了湘雲道就怕我嬸娘打發人來叫探春道那怕什麼只説老太太留你在這裏你嬸娘家裏也不是一定少了你這個人寶玉聽得高興道我就想咱們這幾個人在這園子裏玩一輩子史大妹妹再別回家湘雲截然無語探春瞅了寶玉一眼寶玉自知説話有病也便默默一時到了紫菱洲見岫煙一個人在屋裏做針黹連忙站起身來讓坐敘了幾句間話湘雲道三姊姊久不與邢大姊姊下棋了今兒何不手談一局説著擺開棋枰探春岫煙對奕寶玉與湘雲坐在旁邊靜看座中寂然只聞枰間落子之聲院外一陳風來吹得簷馬叮噹作響寶玉心中想道好了起這個風信該作冷了探春道二哥哥你先回去穿衣服罷我們這一局也快完了寶玉因探春催他便起身出了紫菱洲路上遇見四兒手裏拿了一件大毛衣服急急走來寶玉問道你那裏去四兒道奶奶到老太太屋裏去了回來瀟湘館奶奶留住吃晚飯天氣忽然冷了叫我去拿大毛馬褂換呢寶玉同了四兒一路行走見四兒還穿著小毛羊皮坎肩因向四兒問道你替奶奶拿了衣服自己為什麼不換一件穿上四兒道我不冷寶玉又問四兒道奶奶待你怎麼樣四兒道二爺待我們寬厚自然奶奶也疼顧我們的寶玉道我叫你到舊時住的地場去可好不好四兒一扭頭斜眼睃著寶玉臉上一紅才説道我是要在蘅蕪苑服事奶奶的鶯兒姐姐又要出去了寶玉忙問道鶯兒到那裏去四兒道二爺假裝不知嗎寶玉道我真個不明白四兒笑了一笑道二爺自去問他寶玉見四兒這一笑心裏倒有些疑惑起來還要向四兒根問不覺已到了瀟湘館門前二人便進裏邊寶玉先去看了襲人的病然後到黛玉屋裏笑道太太認的人你們都不肯和我講我問三妹妹已經知道的了寶叉道誰來瞞你呢你也在同年裏頭留心招一個好姊夫叫老太太歡喜歡喜是正經寶玉道湊巧有一個人在我肚子裏只等太太那裏認下了我就通一句話過去他那裏自然央媒來説親黛玉道太太那裏後兒就要擺酒唱戲還請媽媽過來喝喜酒呢且講出你肚子裏的人來年紀可配得上相貌可看得過寶玉道又是同年又是世交年紀也在二十以內論相貌卻不算出衆寶叉道別十分醜陋叫鴛鴦姊姊抱怨寶玉道就和我一個樣兒先要請問二位奶奶可抱怨不抱怨寶叉黛玉都笑道別聽他胡謅沒有這個人的寶玉道你們説沒有這個人我老實告訴了你們罷扳了咱們的親討老太太的歡喜不用説連我也補他的情了我説的不是別人就是甄寶玉寶叉問道你為什麼要補他的情寶玉笑道不是張家姑娘同林妹妹兩個人甄寶玉都去求過親的兩回都被我奪了來可不該補他的情嗎寶叉道才説你胡謅可不是真的他們扳親難道不細細察聽況且甄太太也到咱家裏來過他們的老婆子也常來走動説是太太的幹女兒是使女出身甄家就願意嗎寶玉道你們不知道裏頭有個緣故因為甄寶玉親事屢説不成前兒把他年庚叫張鐵嘴排了一排説定親到不要人家親生女兒須得如芝草無根醴泉無源的來歷出身貧苦的姑娘螟蛉到這一家的才是姻緣可許和諧到老甄家最聽信張鐵嘴的話這裏有了一點口風甄家就來求親黛玉道你雖是那麼講再別先在老太太跟前説話倘事不諧倒叫他老人家心裏不舒服寶叉道妹妹説的話很是我就不信甄家當真沒處去定出一頭親事來了黛玉笑道姊姊我問你一句話你未曾還陽之前倘張家姑娘已受了甄寶玉的聘張家定要把你送到甄家去你到底去也不去寶叉道我也要問你雨村先生來説媒你嬸娘作主允了你還從也不從黛玉道我是不相干已經跳出三界外的人了怕什麼寶叉哼了一聲道你跳出三界外的人為什麼又跳進這園子裏來想是你願修行是甄不願修行是賈的黛玉便笑著站起身來和寶叉廝鬧道什麼真的假的倒要問問你這位張家小姐寶玉忙把兩個人拉開道別再鬧真的假的了留寶姊姊在這裏端整什麼好東西請他黛玉道沒有好東西呢就是照常的菜叫廚房裏添了兩樣不知弄些什麼來當下送上杯箸三個人一同坐下點景用了幾杯酒飯畢敘談一會寶玉便問寶叉道你的鶯兒到那裏去寶叉還不理會這句話道左不過在園子裏頭他到那裏去呢黛玉道好快的耳報神寶玉聽出話中有因便涎臉挨近黛玉身旁叫聲好妹妹你知道的告訴了我黛玉臉上一紅把寶玉推開便借話取笑他道鶯兒是要送他到太太那裏認幹女兒去了寶玉道你們倒一樣説的藏頭露尾的話正説著見鶯兒提了燈來接寶叉回去寶玉瞧了鶯兒一眼便笑問鶯兒道你不在姑娘屋裏伺候要到那裏去呢鶯兒只當沒有聽見並不理著寶玉寶叉黛玉忍不住大家一笑寶叉出了屋門又回頭向寶玉道你在這裏晚上細細問林妹妹罷寶玉站起身來道你們不肯明白告訴我我問晴雯紫鵑去説著連忙趕上寶叉同走寶叉在臺階上站住了叫丫頭掌燈送二爺到怡紅院去裏面黛玉笑應道在這裏點呢當下五兒提了一盞紅紗燈趕上寶玉一同出了瀟湘館分路各自走了黛玉等五兒回來問了幾句話也就安歇次日無事書中少敘到了後天薛姨媽早就同了寶琴香菱過來因是園內便門先到了瀟湘館才坐下叉黛二人已從賈母王夫人處請安回來黛玉道我才與姊姊説媽媽同妹妹們就該來了老太太早在那裏吩咐薛姨媽道我們也不坐了説著一同起身出了瀟湘館正走間聽得後面有人叫道姨媽姊姊們等一等咱們廝跟著走薛姨媽回頭見是湘雲同他丫頭翠縷只聽笑語之聲急急趕來薛姨媽道慢些走我們在這裏等呢話未完湘雲已到跟前一路敘話出了園門來到賈母處見邢王二夫人尤氏婆媳李紈鳳姐探春喜鸞四姐兒一衆人先已到了便向賈母王夫人道了喜然後彼此相見讓坐賈母便問親家太太為什麼不來薛姨媽道謝只見鴛鴦已妝扮得珠圍翠繞居然繡閣千金叫林之孝家的挑了兩個小丫頭進來給鴛鴦使喚早上在王夫人屋裏供了南極西池與王夫人行禮又在賈母前磕了頭此時卻與邢夫人薛姨媽見禮不免推讓一會各人的賀禮覿儀早已備送以次姑嫂姊姊俱系平輩相見寶玉一早出門拜客回來忙到賈母處叩頭道喜然後在王夫人跟前照樣行了禮便恭恭敬敬向鴛鴦叫了一聲姊姊作了四個揖賈母笑道底下也像你玉釧妹妹替他招一個好姊夫我也歡喜呢賈母一句話説得鴛鴦臉泛桃花只得把頭垂了下去一面薛姨媽道老太太調教的人出來果然比衆不同我瞧鴛姑娘滿臉的福氣將來自然有一位好姑爺配他呢賈母道姨太太知我的心我有什麼調教就為我老的越發記性不好了全靠他在跟前提醒我一點瞧這孩子人還本分心地也明白想我已是八十以外的人了將來我故世後就不把他配一個小子也沒有對頭好親事可惜糟踏了這孩子我要把他認在身邊礙著寶玉姊妹們倒壓下一輩子去了又使不得不如拜在你姊姊身邊做個幹女兒送他飛上高枝兒去算替我成全了這個人一時我還離不開他等把琥珀翡翠這幾個人領了起來能接手他的事情了才放他出去呢這會兒不過應個名托你姊姊的福定下一頭親事再不怕有人起什麼壞心了説著又向王夫人問道鴛鴦家裏還有他娘老子沒有鳳姐忙答道他老子金彩在南京看房子兩口老子都死過的了有他哥子金文翔兩口子現在裏頭當差賈母道你們多給金文翔幾兩銀子將來不許他們去走動別教他妹子丟臉王夫人和鳳姐都應了一聲是鴛鴦聽了賈母的話想起先前鉸下頭髮立定主意等老太太天年後自尋一個了結不想這樣擡舉他起來人想衣裳花想容世間那有有福不願享的人轉想到主人豢養如此操心直同恩撫兒女一般不但不覺歡喜禁不住心上一酸兩行珠淚直滾下來怕人瞧見忙把臉兒背轉用手帕拭幹獨有邢夫人觸起前情自覺慚愧等賈母衆人用過早膳起身推病告辭自回去了賈母滿屋子裏瞧了一瞧向李紈道迎丫頭偏碰著他家裏有事要後天才來呢你兩個妹妹是愛熱鬧的為什麼今兒不來呢李紈道因為嬸娘身子不爽快他們走不脫身過一天就要來呀賈母又道四丫頭早上在這裏為什麼就走了正説著只見惜春同了妙玉蓮貞進來妙玉先向賈母稽首然後見了王夫人挨次辭行賈母並不留心到妙玉臉上王夫人因早知這件事向妙玉仔細瞧了一瞧帶笑説了惜春幾句也不究問根由又向蓮貞問道這位小師父倒像有些面熟幾時進來的蓮貞便向王夫人行了個全禮鳳姐笑道太太不認得他了他就是芳官先前住在水月庵如今到妙師父那裏沒有幾時了王夫人聽了鳳姐的話便叫丫頭去拿了兩匹綢子來給芳官蓮貞當著王夫人不好推卻勉強受納當下蕊官藕官拿了戲