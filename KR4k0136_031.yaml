body:
  text: 第三十一回訊芳蹤香院惜間花還詩集絮詞盤侍婢話説寶玉到梨香院不見芳官問藕官根由藕官道頭裏芳官蕊官和我三個人太太叫各人的乾媽領出去我們想好容易派了房頭沒福分住得常到別地方去還有什麼好處大家看破求太太許我們出了家我和蕊官都拜給圓信做了徒弟要等個好日子才落發誰知狠不過是這些出家人心腸哄了我們到庵裏後來見了銀子又眼紅了貪圖一百兩銀子到手翻轉舌頭來説我們是穿好吃好慣的熬不得苦日子又道我們是唱過戲的人住在庵裏難免地方上這些混帳人造謠言他也擔不起依舊把我們送去幹那行次可憐我們又沒一個親人在跟前沒法兒憑著他擺弄不承望我們又進來了底下保不定還有些好處各人再看唱下半台的戲罷了你的芳官比我們心堅苦也受得起現在水月庵裏死守著這個破蒲團不肯放看來倒是他一出團圓戲了寶玉聽了怔了一會便道何不去叫他進來同你們唱戲玩兒可不好藕官笑道他已經光著頭做了姑子怎麼唱戲呢難道叫他常唱潘必正偷書小尼姑下山不成寶玉道那怕什麼我上年要做和尚也把頭髮剃了如今留得齊齊的就添上髢發了説著將身子扭過把頭一低叫他們都來瞧著一時五六個人趕攏爭瞧著道和尚養了頭髮自然姑子該還俗了説的衆人都笑起來藕官向桌上端起茶盤一手揭開蓋子遞給寶玉寶玉接上手來不喝藕官因在黛玉屋裏住久深知寶玉脾氣便道這碗是我一個人認定了喝的二爺別嫌醃臢寶玉便喝了幾口藕官接過放下寶玉道姑娘們都在園子裏你們可想去瞧瞧藕官道昨兒文官出來我們問了半夜的話裏頭事情他都和我們説過不料寶姑娘竟不在了他做人怪好我們聽了也是怔怔的怨不得蕊官哭的那麼傷心二爺瞧他眼還腫著呢寶玉看了也禁不住淌了幾點淚藕官自悔出言莽撞忙忙把話岔開道我們這幾天趕的排戲裏頭沒有人叫不敢走動難得二爺到這裏來咱們跟著走罷寶玉便站起身來帶了藕官這幾個人出院文官送至門外自回裏邊排他的戲衆人隨了寶玉穿林渡水一路觀玩園景道我們離了這園子兩三年你瞧這路徑都生疏了不是跟了二爺來防走迷了呢寶玉笑道別説你們這條路輕易走不到如今又被這些樹葉子遮得嚴嚴的連我也模糊了呢説著便煞住了腳藕官轉過寶玉面前趕緊的跑了一箭多路繞出山子站在一塊太湖石上招手道二爺這裏來寶玉同蕊官們行至藕官站立之處藕官指與他們瞧道走過了這一條曲折朱欄板橋沿堤繞東行去再轉過荇葉渚前不是那院子裏一叢翠青青的竹子都瞧見了嗎寶玉笑道繞了遠路了好久不進來引你們多逛一會子也好一路説話行走蕊官指著堤上的柳枝子道到了這裏可再迷不了路了藕官你可記得鶯兒姊姊編花籃子被芳官幹媽的姑媽看見鬧了一場沒趣籃子也掠在河裏了寶玉問道前兒進來你們這些乾媽去瞧過你們沒有藕官道誰願意他們來瞧就這園子裏管廚房的柳大娘要算疼顧我們的説起這幾個乾媽不如沒有倒乾淨寶玉道誰叫你們認這些混帳東西做乾媽我吩咐你們先前的話都拉倒如今就是他們來認你們做乾媽也別理他藕官們都笑道先前我們年紀小也有些淘氣如今大是大小是小盡他們一個面子上的規矩不怕他再來盤算咱們了説著已到瀟湘館門前寶玉趕在前頭跑進裏邊見湘雲探春和黛玉坐著説話寶玉站在廊簷下招手道你們姑娘們都在這裏快進來罷幾個人一齊擁進先到黛玉湘雲探春面前請了安又向屋子裏的人都問過好黛玉的藕官湘雲的葵官探春的艾官各人走近各人身旁自有一番親熱光景問長問短説些出去後的情事獨有蕊官一人遠遠站著似失所依黛玉一眼看見記起他是派在寶叉屋裏的人雖不比主婢恩深義重如今他進來不見了寶姑娘卻有一種伶仃形狀又想到自己設使去年一病不起或回南後永別瀟湘今日他們到此將藕官易地而觀也不免有此情狀觸景追思默然神動於是喚過蕊官道怎麼你就像失了群似的想是見你同伴的都去找著姑娘親熱只不見你寶姑娘傷心嗎蕊官勉強笑了一笑黛玉便問這些時學了些什麼戲蕊官道現在那裏排蜃中樓呢黛玉又問了他幾句話便命雪雁去裝些果子來給他們吃雪雁裝了四盤精細點心叫兩個小丫頭端了出去放在小桌子上各人過去隨意吃了些蕊官便問雪雁道鶯兒姑娘在那裏黛玉道正是藕官們都住在這裏蕊官叫他到鶯兒那邊去逛逛寶玉道別叫他去罷他兩個人見了面就大家淌眼抹淚鬧一泡子黛玉道他們哭也是應該的由他去罷你管住人家不哭嗎説著就叫小丫頭引了蕊官到鶯兒的屋裏這裏湘雲便笑道林姊姊是一個公道人州官放了火就許小百姓點燈他自己愛哭再不厭惡人家這個寶玉忙介面道你林姊姊如今又何嘗哭呢湘雲道二哥哥再慪他林姊姊就會哭寶玉道咱們小時候我也並沒去慪他你林姊姊多心和我慪氣只是哭我見他一哭心裏頭就不知怎麼樣才好後來他便哭總瞞著我我也知道如今要再瞧他先前淘氣的樣兒正經慪他還慪不上來呢湘雲抿著嘴一面推著黛玉笑道林姊姊聽聽你們先前的故事可都是二哥哥自己説出來的黛玉道你們好哥哥好妹妹一遞一句去嚼舌我沒聽見話未完只見晴雯急忙忙的掀簾進來一疊連聲的問芳官寶玉歎了一口氣道你要問芳官的事情蕊官都知道他在鶯兒屋裏你找著他問去晴雯抽身便走湘雲道但凡一個人總有個交情故舊你看蕊官進來便問鶯兒晴雯又急巴巴的來找芳官黛玉介面道正是為什麼不見芳官寶玉正要講芳官的事只見香菱的小丫頭臻兒手內拿了兩套書進來先與衆人問了好便走近黛玉身邊道我們姑娘給奶奶請安臻兒才開口湘雲便悄悄的向探春誇他道你看臻兒年紀小嘴頭上倒很靈變不是向來聲聲口口林姑娘叫慣的這會兒忽然改口叫起奶奶來了黛玉道雲丫頭又是鬼鬼祟祟什麼姑娘奶奶湘雲道二奶奶別聽我們的話臻兒又介面道我們姑娘説奶奶的詩稿子在那裏趕著寫完了就給奶奶送過來這兩套子是叫什麼臻兒想了一想道叫裏開褲包氈裙上年留在那裏先拿來送還奶奶的倘然奶奶用不著的了等著我姑娘要看再來取罷臻兒話未説完湘雲和探春聽見書名兒説的古怪趕忙走攏同黛玉看時見書套標簽上寫的一册是庾開府遺稿一册鮑參軍全集大家笑得彎腰曲背湘雲只指著臻兒説不出話來寶玉忍住了笑道他小孩子家那裏記得清這些話説著也忍不住大笑起來探春笑的一面擦淚對湘雲道你才誇他嘴乖就鬧出緣故來了臻兒瞪著眼估量他們這些人笑的是他便紅了臉道我説錯了話嗎聽見我姑娘吩咐是那麼樣的呢湘雲道你説的不錯我們是笑你姑娘黛玉道當真是香菱説的纍墜呢簡簡截截叫他拿了兩套書來就完結了要那麼提得清怨不得鬧出褲也開裙也要包了説的大家又笑起來探春道想他又天天在那裏清新庾開府俊逸鮑參軍的念溜了嘴了我們不知道這兩册書你幾時借給他的黛玉道因是那一年香菱要我教他做詩我先借給他王摩詰全集這幾部去看了末後來又借給他這兩套不是上年來給我餞行這一天他還提起我叫他留著看就是了這會兒不知為什麼又打發臻兒送了來黛玉正欲向臻兒問話臻兒已走開了雪雁忙找出院子裏見他同藕官們在假山石子邊刨那新出土的竹筍兒玩呢雪雁便叫臻兒道姑娘有話問你呢怨不得你姑娘不肯打發你出來正經話沒有講完脫滑兒就玩去了臻兒把手上的泥搓了搓自回屋子裏來雪雁又嚷藕官們道你們如今又不比在裏頭住的時候了玩了這半天仔細回去師父要捶藕官道蕊官還沒有出來呢又各人拿起刨的筍株子給雪雁瞧道我們拿回去和廚房裏討些火腿片兒放起湯來才新鮮有味兒呢雪雁道你們也太淘氣了這都是些嫩梢子祝媽瞧見和你師父算帳呢説著蕊官已從鶯兒屋裏出來大家重又回進裏邊説要走了黛玉便命雪雁去各人給他們兩個錁子又叫老婆子把他們吃剩的滿滿四盤點心包起給他送去探春對湘雲道咱們也該走了寶玉便問你們到那裏去呢探春道瞧邢大姊姊去寶玉道咱們同走又叫藕官們跟著一齊下了臺階藕官們各自去取刨的嫩筍寶玉見了喝道不怕髒了手什麼希罕東西便叫一個老婆子替他拿了寶玉湘雲探春帶了藕官們又跟了許多老婆子丫頭一群人出了瀟湘館這裏黛玉才問臻兒道這兩套書你姑娘愛瞧只管放著為什麼拿了過來臻兒道聽見我姑娘説住在這裏要來園子裏和奶奶姑娘們説個話兒也方便如今把走熟的一個地場生巴巴要離開了我姑娘還一個人在屋裏淌淚呢太太叫我姑娘收拾東西要挪屋子所以把這兩套書叫送還奶奶的黛玉道挪到那個地場去住呢臻兒道不知到那裏去住只聽得我們二爺在外城找新屋子黛玉道姑娘打發你來太太知道沒有臻兒道太太知道的黛玉道我這幾天就要到你太太那邊去先替我請安姑娘跟前問好臻兒答應著要走黛玉道不去瞧瞧你鶯兒姊姊嗎臻兒道要去呢一面臻兒自往鶯兒處去黛玉走進里間屋子見紫鵑一個人靠著窗戶在那裏做盤珊瑚的扇絡子黛玉道我倒沒見你帶了活計來的外邊那麼説笑你也不出去聽聽趕緊弄這個做什麼紫鵑站起身來把針線放下笑道我到姑娘這裏來帶這個來消消間奶奶們外邊説的話我都聽見呢黛玉道你可聽見臻兒的話嗎紫鵑道那是姨太太要辦邢大姑娘的事嫌這屋子不寬展所以要換新屋子呢黛玉道那裏是為這些我們沒有去見過嗎屋子雖然整齊的沒有幾院除他大奶奶占了一個院子丫頭老婆子們都住的乾乾淨淨屋子當真就讓不出一院來我倒猜著有八九紫鵑笑問道姑娘猜的是什麼黛玉道寶姑娘不在了他老姊妹兩個雖説是和氣到底少了一個親人二則咱們這園裏的人先前都和寶姑娘在一堆兒耳鬢廝磨的姊妹姨太太住在這裏保不定在園子裏來多走幾趟瞧著難免不傷心況且咱們的事鶯兒見了尚然如此姨太太就看破到十二分心裏頭就沒有一點芥蒂嗎不如離開這裏的好但是姨媽沒有想到挪了開去聽得那位大奶奶很不賢慧邢大姑娘還沒過門琴姑娘年紀也小在這裏住的日子多就同香菱兩個人越發孤伶了再講到我們這裏不要説太太面上的體統情分上不好看就是我心上也過不去想起先前姨媽待我也好後來就為寶姑娘的事存了點私心那是親疏厚薄誰沒有一點半分別紫鵑笑道姨太太別的上頭也再沒的説就是那一天説起姑娘的事他老人家既沒真心就不該當玩話説既講出口來也該認真辦去為什麼我多説了一句話還把我來取笑後來就撩在九霄雲外了黛玉微笑道你怎麼這些話還都記得紫鵑道如今姑娘算沒有委曲到底先前的不論什麼話原可不必提起但是我在睡夢裏想起寸寸節節的事來還心驚膽戰除了他沒有一個人不叫人寒心呢黛玉沈思半晌道罷喲就如你在南邊和我説的話頭裏的事都撂開再別提他了我先到太太那裏去探聽姨太太那邊的事太太知道了沒有便命雪雁春纖跟著出了院門走不多路見小紅同著剛才送藕官們回去這兩個老婆子一路説笑走來見了黛玉老婆子便站在一旁回過了話自回瀟湘館去小紅含笑問道奶奶那裏去呢我們奶奶打發我來請奶奶明兒吃了早飯奶奶這裏沒有事請到議事廳去倘定下了詩社別攪鬧奶奶姑娘們的雅興改日再來請罷黛玉道沒有的事明兒我準過去的你去請了大奶奶三姑娘沒有小紅道我們奶奶沒有叫去請三姑娘我先到了奶奶這裏再去請大奶奶奶奶要請三姑娘我帶便就替奶奶去請了回去告訴我們奶奶一聲就是了黛玉道你奶奶沒有吩咐你別去請罷橫豎請了三姑娘也未必來你回去對奶奶説前兒送來的册子都看過了明兒帶到議事廳上還有話和你奶奶當面説呢小紅答應了一聲是道不到奶奶屋裏去了站著等黛玉走了才往稻香村去再説黛玉來到王夫人處正值王夫人睡午覺未起便至玉釧屋裏見玉釧頭上金珠璀璨服飾鮮妍已改了妝飾王夫人又派了兩個小丫頭服事他炕上鋪陳帳幔及屋內簾櫳器具等件雖不精雅卻也富麗一新玉釧面龐豐滿態度從容正是移體移氣潤星潤身黛玉上前相見叫了一聲姊姊玉釧臉泛微紅似形局蹐二人自有一番套言絮語不必瑣述黛玉坐不多時只見一個小丫頭來請道太太起來了黛玉辭了玉釧便過王夫人處王夫人叫黛玉坐了道這樣長天你不歇個中覺嗎黛玉道剛才史大妹妹和三妹妹在那裏説了一會子話混了過去倒也不覺的倦了王夫人又向院子裏瞧了一瞧道這時候晌午才熱呢雖然四月裏天氣這太陽曬著地上熱氣蒸上來就利害你這會兒又趕來有什麼話嗎黛玉道沒有別的我聽説姨媽在家裏趕著拾掇東西在外邊找屋子太太知道這件事沒有王夫人道姨媽這些時也沒過來我恍惚也聽過這句話你又聽見誰説呢黛玉道剛才聽臻兒講起小孩子家也説的不明白所以趕著來問太太果然是真的咱們過去留住他老人家才是個正理王夫人道姨媽瞞了咱們背地裏在那邊辦這些事估量他已打定主意要留也留不住黛玉笑道太太盡仔放心包管把姨媽留住就是了王夫人歡喜道果然能把姨媽留住頭一種老太太那裏得時常有個人來間話解解悶兒再者我心裏也過得去就是大概體統上也不落旁人褒貶黛玉道明兒就過去王夫人道據我想起來你倒不必過去橫豎這幾天裏頭要請酒前兒打發人到孫家去説你二姊姊明兒一準回來的停會兒對你鳳姊姊説戲又現成一搭兩便請了姨媽過來聽戲那時候你留姨媽自然有你的一番情意趁著老太太和我們都在跟前人多理會説的姨媽下不臉來便把他留住了黛玉應了一聲是又説了幾句間話出來由穿堂經過鳳姐後院見小紅已從李紈處回來黛玉道才和你説的話可記明白了小紅笑應道説下了奶奶不到我們奶奶屋裏歇歇去嗎黛玉道不進去了明兒見面再説話罷黛玉自回園去小紅便到鳳姐處回了李紈的話又道才在穿堂背後碰見寶二奶奶想是太太屋裏出來鳳姐點頭便叫過平兒悄悄的吩咐道你到太太那裏打聽林姑娘剛才説些什麼話平兒笑道我去見了太太沒有什麼話可回便怎麼樣呢鳳姐想了一想道你只説錦香伯府裏的添妝同南安郡王府裏的壽禮和寶二奶奶商量過比往常加豐已辦好繳進來的了等打發人送去的時候再請太太過目回了這幾句話可不就唐塞過去了太太沒有提什麼你悄悄叫一個小丫頭子問他別叫玉釧知道平兒答應走出房門見賈璉正掀外屋門簾子進來悄問奶奶睡中覺起來沒有平兒扭了一嘴賈璉就在堂屋裏坐下嚷熱叫平兒打水洗臉平兒笑道你叫小紅去我有事呢説著出了院子小紅只得上來伺候鳳姐便從里間走出坐下瞧賈璉洗臉賈璉問道你可知道姨媽那裏的事嗎薛老二趕緊在外邊找屋子要挪出去住呢鳳姐道不是姨媽自己也有幾所住得的房子為什麼又要去找呢賈璉道你不知姨媽家的房子都賃給人家住著一時騰不出來所以要另尋這件事不知太太知道沒有鳳姐道太太卻沒在我跟前提起這件事估量琴姑娘常在這裏難道不吐露一半句話出來嗎賈璉道我們就大家不言語一聲兒但憑姨媽挪出去住鳳姐道唉呀呀太太不用説上頭還有老太太呢且姨媽要離開這裏自然有個緣故如今的事比不得先前再怪不到咱們身上來倒不用你操心你想姨媽這樣性急就等不得薛老大回來你到底打聽他的官事了結沒有賈璉道有什麼不了結不過瞎花錢罷前兒他老二回來説起衙門裏頭的事都是胡打胡撞先在縣裏已經花了幾千辦了一個誤傷人命上司衙門也照轉的了刑部裏駁了下來據照册上供情為燙酒口角起釁憎嫌跑堂的不就去燙把酒潑地失手連碗擲去碰在跑堂的頭上受傷身死明系是鬥毆怎麼算得誤傷就是誤傷身死律應絞抵也不能收贖委員發審提了一干人證上去又拉出蔣琪官這些人來蔣琪官來了王爺一封書子也沒到案就只難為薛老二東鑽西跑花的是姨媽的錢現今案是定了捏改了姨媽守節年分等秋審後辦孤子留養幸遇海疆奏凱一應罪囚減等薛老大的案還算鬥毆情輕準減流三千里只等部覆一轉就可辦留養回家了鳳姐道部裏還得去安頓才好賈璉道那是彙奏事件又是照例辦的倒不用去照應就是薛老大回來要改改他的脾氣才好兩場人命官司歸根兒外邊也不去走走就這樣麻花踏煞別把他的性子越發縱起來鳳姐道姨媽如今也苦了只盼薛老大回來叫他老人家寬寬心底下的事情那裏料得這些賈璉道別盡仔講姨媽家的事了上兌銀子的總數你瞧見了嗎鳳姐道正是這句話整千萬的銀子可巧沒有一點畸零賈璉道我也那麼想不是末後這幾天我也在那裏瞧著要猜疑他們把尾數截去了正經還有一件事我前兒和你説芹兒的話向林妹妹提過了沒有鳳姐道明兒到議事廳上再説賈璉又問了幾件事書不繁敘再接下回分解
