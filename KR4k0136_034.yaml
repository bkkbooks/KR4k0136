body:
  text: 第三十四回義認螟蛉周旋往事錦添富貴成就家童話説黛玉聽見薛姨媽到了同了平兒徑往賈母處來見王夫人鳳姐李紈寶琴都在那邊便上前欲與薛姨媽行禮薛姨媽再三阻止並道謝黛玉兩次送的禮物黛玉站住開口便叫媽媽道早要到媽媽那裏請安因是媽媽不叫過去到了如今今兒媽媽又不叫行禮做女孩兒的有幾句話總要媽媽賞臉先前這幾年媽媽疼愛著我比衆不同也不過看我是沒有親媽的人早有這句話要認在媽媽跟前做個幹女兒媽媽也應承過的就沒有與媽媽磕頭今兒定要媽媽受了禮算還了舊日的心願薛姨媽眼圈一紅半晌説道先前原有這句話也出於我的本心因恐人家議論沒有當一件事辦成就撩開了如今可越發使不得黛玉道媽媽説的什麼話那是我自己願意媽媽今番認了我這個女孩兒越顯得先前疼愛我的心腸是千真萬確的了我是可憐沒有親媽的媽媽認了我就是我的親媽也算是媽媽的親女兒了黛玉講到這裏雖沒有提及寶叉一個字薛姨媽心中已轉到寶叉身上並賈母聽了黛玉説到沒有親媽的話各人暗自傷感連王夫人鳳姐都掉下淚來當下丫頭們已把繡毯鋪上黛玉跪下去薛姨媽要拉也拉不住身不由主只好由黛玉自去行禮磕了頭然後起來與衆人讓坐賈母歡喜道原該是這樣的姨太太再別多心瞧咱們院子裏搭起臺子請姨太太過來瞧戲就算是會親喜酒明兒叫林丫頭再孝敬乾媽一天戲姨太太嫌煩林丫頭家裏帶了一班清音女孩子來咱們陪姨太太再聽一天清音還叫林丫頭備席鴛鴦笑道老祖宗如今該改口了還像頭裏這樣叫賈母道那是我向來叫順了口就是我底下抱了重孫子還是這樣叫呢説得衆人都笑起來黛玉登時紅了臉因是賈母講的話不敢頂嘴反悄向鴛鴦抱怨道但憑老太太去叫就是了要你多什麼嘴惹出老太太這些話來鴛鴦道大家評評這個理我可説錯了什麼寶二奶奶倒不依我呢鳳姐介面道咱們且講正經老太太同太太都留姨媽不叫挪屋子姨媽不聽如今只看幹女兒的臉了黛玉道我也不過順著老太太太太的意來留姨媽媽媽要挪屋子我猜著沒有別的意思不過為娶邢大姊姊過門嫌這屋子不寬敞現今還沒定下日子到那時候再挪也不遲我聽見媽媽尋的新屋子在外城離的太遠就要挪開去一時在這左近地方找不出來咱們那一所公館翻新修理過的可以住得如今白間空著請媽媽挪進去住豈不近便些鳳姐道正是這所房子是林妹妹家裏買著預備送親來住的我進去見過又齊整又寬大別説要娶一房媳婦姨媽將來要娶十房孫子媳婦也住不了勸姨媽竟聽了林妹妹的話再別三心兩意了於是薛姨媽思前想後見黛玉這番情分懊悔從前不該存了一點私心兩情相感由不得認真疼愛黛玉起來並不怨旁人錯把姻緣撮合以致葬送寶叉性命也不怪寶玉忍心拋棄室家雲遊出外只恨自己同女兒命苦禁不住傷心落淚王夫人又殷勤勸慰一番接著史湘雲迎探惜紋綺一班姊妹進來都與薛姨媽道喜請安此時邢岫煙病已痊愈因有薛姨媽在此推病不來薛姨媽見了衆人都是從前在園子裏和寶叉親熱的一班姊妹又不覺心上一酸便勉強忍住與衆人問了幾句話因不見邢岫煙便道你們姊妹為什麼不拉了邢大姊姊同來湘雲們笑笑薛姨媽道先前常見面的有什麼避忌呢鳳姐介面道邢大妹妹頭裏這幾天身上不爽快想來還不大好並不是沒過門的醜媳婦怕見婆婆呢衆人聽了都笑起來當下坐定蕊官們上來點戲賈母與薛姨媽推讓一會鳳姐道老太太同姨太太也不用盡讓了叫他們揀新排的好戲唱起來唱的不好告訴他們師父要捶的蕊官道後雷峰塔前兒已排出來了又熱鬧又新鮮薛姨媽道這本戲我們記得也瞧過可是許仙的兒子中了狀元祭塔團圓的嗎蕊官道不是這樣的那一本戲是許狀元已經拜了相黑魚精下凡做了靠海大王的軍師造反起來許丞相挂帥出征小青逃下七寶池來幫助許元帥成功王母娘娘啓奏玉皇大帝遣了天神天將打開雷峰塔放出白娘娘重又與許仙成為夫婦團圓的薛姨媽聽了向賈母道聽他講的關目很好老太太愛聽就叫他們唱這一本罷賈母道我聽來也是好的快叫他們妝扮起來一聲吩咐戲房內早已伺候齊集沖場便是王母娘娘赴了蟠桃會駕返瑤池衆仙女舞雲奏樂腳色齊整服采鮮明果然好看及至看到白素貞出了雷峰塔許仙已在金山寺披剃五十年仍是小生扮的容顔如舊重與白素貞夫婦團圓薛姨媽看了又觸到寶玉出家一節想起寶叉死者不能復生那得如白娘娘再有團圓之日情動於中止不住淚珠直滾看到正本戲完又點了幾出耍笑雜戲混了過去然後擺開席面照常坐定重又點戲開場席還未散寶玉回來與薛姨媽請了安坐下薛姨媽見了寶玉雖然傷心只得耐住只管看戲這裏史湘雲向寶玉道二哥哥你不早回來瞧新戲後雷峰塔許仙是藕官小生扮的許仙的兒子許夢蛟倒是艾官老外扮的公然一位老丞相鬍鬚已蒼白的了這本戲妙在兩個腳色先翻新得奇寶玉道那也在舊本子裏脫胎來的你見長生祿小生扮劉晨入天臺遇了仙子回家已閲數十年劉晨的夫人已老的龍鍾了探春問道二哥哥今兒在外面瞧的什麼好戲也講給我們聽聽寶玉道也不過常唱的這幾出熟戲我就很不願意瞧沒法兒不應酬人家多坐一會這裏寶玉自與探春講話黛玉一面向鳳姐道過幾天就是端午了我上年回家正趕上了看龍船多年不在南邊看這一回覺得新鮮咱們園子裏蓼漵紫菱洲一帶的河道也還寬展吩咐他們趕忙置備起來龍船外再用木排扎幾座水台閣玩兒咱們留姨媽在這裏看了龍船回去寶玉聽了更加高興道咱們這幾年來從沒有弄過這玩意兒老太太同太太一定歡喜看的怕日子近了趕不上鳳姊姊叫他們趕緊置造起來才好呢鳳姐道寶兄弟你聽不得一句話的林妹妹才講出口來這會兒就有龍船劃到你面前才稱你的意呢老太太同太太未必定要瞧這個第一個數你高興賈母便問你們講些什麼鳳姐把黛玉的話對賈母説了賈母道我記得小時候看過很有意思咱們園子裏玩耍應個景兒也好鳳哥兒你就叫他們辦去寶玉拍手道你們聽老太太的話可是歡喜不歡喜當下鳳姐就向林之孝家的説了立刻傳到巧手扎采匠並各項匠人趕辦這裏席散後黛玉便邀薛姨媽到瀟湘館住下鶯兒上前伺候黛玉免不得提起寶叉一番薛姨媽又落了一會淚各自安歇寶玉自到怡紅院住了次日起來記起一件事便寫了一封書子藏在袖裏先到賈母王夫人處請了安又回進園中往邢岫煙處見迎春岫煙都起身梳洗已畢寶玉進去大家讓坐寶玉便問岫煙身體可大好了又道史大妹妹還沒起來嗎一面取出書子送與岫煙道這一件事與姊姊商量不知可用得嗎岫煙不知是何事接書展開看道昨訪蓬瀛遙瞻仙範不啻遠隔洪濤萬丈弱水九重惟於牆外巡簷摸索見紅梅幾樹緑葉成陰不禁憮然追往憶來擬于左側隙地開玉照堂仿鐵腳道人嚼雪沁香誦南華秋水但恐百尺齊雲逼近閬風之苑望仙迎仙引度天花貝葉耳用肅蕪奉商如蒙俯允庶便鳩工怡紅濁主稽首上檻外上人蓮座岫煙念畢笑道這也太周到了本是極雅的事妙師父斷沒有不樂從的這封書可不用打發人送去就留在這裏我好幾天沒有出門明兒想到庵裏去走走我帶了去給他瞧一瞧就是了寶玉連忙作揖道姊姊帶去還可借重美言那是極妙的了寶玉又和迎春説了一會間話起身出來徑到瀟湘館秋紋道二爺又往那裏去璉二奶奶打發人來請呢姨太太同奶奶都到老太太那裏去了寶玉便往鳳姐處來鳳姐問道寶兄弟你多早晚兒布施清虛觀裏三十六萬銀子要造什麼太虛宮還要設局濟衆可是有的嗎寶玉道就是頭裏在他觀裏拜懺的時候話是提過一句的我也並沒回絶他如今他們來領這項銀子嗎鳳姐道既然有這句話就該當一件事辦起來況且來的人也説得明白並不是要這許多銀子交給他們經手原請咱們派了人去經理不過估計工程費用須得這個數目如今銀子現成只要寶兄弟説準了好辦寶玉道姊姊自去問林妹妹鳳姐道你們聽聽這是寶二爺自己説出來的總得要求奶奶爺們可當不得家呢寶玉被鳳姐説得臉紅回身就走鳳姐又把寶玉叫住道別臉上下不來正經還有話和你商量你林妹妹跟前我見他提一句就是了諒來沒有什麼作難的這件事工程也不小管工的自然有些沾光我替你想起一個人來那焙茗出去找你很吃了一番苦賞罰要公道不如叫焙茗去管了這件事明叫他沾個光兒寶玉道櫳翠庵外邊也就要興工我想叫焙茗去經營那裏另派人罷鳳姐道櫳翠庵又興什麼工我不知道寶玉道那是我才起的想頭姊姊如何得知呢於是寶玉就把緣由説明並托邢岫煙去與妙玉商量的話也講了鳳姐道寶兄弟你也太鬼祟了這個地方起了閣子上去玩的不過是咱們家裏太太奶奶姑娘們還有什麼外四路不相干的人瞧見他庵子裏什麼東西嗎既是焙茗有你的差使林妹妹留住他的家裏人有一房看他公館盡間著我去和林妹妹説了把起造太虛宮的工程交給他拿了一個總餘外設局施捨的事再另派人話未完見賈母處小丫頭來叫寶玉吃飯寶玉便往賈母處見薛姨媽同黛玉衆姊妹都在寶玉隨他們吃了飯是日黛玉孝敬乾媽一天戲次日是湘雲迎春探春這一班姊妹的公東賀喜薛姨媽順便與黛玉還席黛玉向薛姨媽道大嫂子總沒來過媽媽何不叫他過來也瞧瞧戲逛一逛咱們的園子把他胸襟開展開展省的悶在家裏尋事生非叫香菱也同了來王夫人介面道當真姨媽聽林姑娘的話叫蟠哥兒媳婦過來散蕩兩天或者他心裏頭有什麼説不出的鬱結悶氣也可消釋消釋還有一説他們這一班姑嫂我不敢説一定是大賢大德的到底規矩體統都不錯俗語説的近朱者赤叫來瞧瞧他們的樣兒或者能把脾氣改過些也料不定的香菱待他奶奶自然知道有個盡讓但蟠哥兒媳婦平日厭惡了他總看不出這個人的好處鎮天在家裏免不了雞爭鵝鬥的説著叫老婆子去請了姨太太家裏大奶奶同香菱姑娘來薛姨媽忙止住道罷姊姊不知道我這一個媳婦是見不得人的所以總沒叫他過來給老太太姨媽請安姨媽跟前不用説了也不怕老太太同姑娘們笑話就被這裏老婆子丫頭們見了也不好看若講要他改改這種好樣兒就請孟母來也教化不過來的這是前世的冤孽拚著我這條苦命盡著和他熬一天算一天的事看誰熬過誰倒是我走了出來怕香菱在家裏越發難受不如去叫了香菱來也好當下王夫人吩咐老婆子去不多時同了香菱過來這裏戲文早開了場無事可記不必碎繁晚上散了戲次日照舊又相敘一天黛玉款留薛姨媽賞玩龍舟薛姨媽因黛玉懇摯纏綿情不可卻只得同香菱住下這裏寶玉便把清虛觀之事告訴了黛玉黛玉聽説太虛兩字雖記得不十分清楚恍惚死後遊魂曾曆於此並模糊與太虛宮仙子敘話一番猶如夢境今聽寶玉説到清虛觀雲遊道人要化布施知有來歷甚為合意又道那設局濟世這幾件本是應該辦的前兒在議事廳與大嫂子鳳姊姊沒有議及不過先親後疏由近及遠留待日後再辦不知在清虛觀已先有此議這是極好的了寶玉又將造閣賞梅一事説明黛玉亦以為可到了明日便打發人去關照鳳姐説清虛觀布施只管開工辦理鳳姐又將所派看公館的家人去承辦告知黛玉即時擇定吉日破了土管工家人領銀趕緊督辦趕辦去了這裏寶玉回到怡紅院紫鵑便道邢大姑娘來找二爺説妙師父見了書子很樂完工之後冬天下起雪來妙師父還要請邢大姑娘同四姑娘到閣子上賞雪看梅花妙師父沒有回書叫邢大姑娘覆二爺呢寶玉聽了連忙走出園來叫傳焙茗二門上的小廝回道不用傳得焙茗一早在這裏候二爺呢話未完焙茗過來請了安見二門上小廝走了開去便道有一件事來求二爺寶玉便問何事焙茗笑道二爺可記得萬兒嗎寶玉道我那裏知道什麼萬兒千兒呢焙茗道怪不得爺出去做了和尚回來都停當了奴才也陪著爺出了一會家回家就不看顧奴才一點子寶玉道有話要説個明白知道你肚子裏什麼萬兒呢焙茗便引寶玉到書廳內講道這事説起來年代原久了那年新年頭奴才跟了二爺到東府裏瞧戲奴才偷空兒出來撞著珍大奶奶的丫頭叫萬兒拉他到小書房間裏按倒他正要上手被二爺踢開了門進來趕散了這件事爺可記得寶玉道我記起來了可是萬兒的娘夢裏頭得了一匹什麼萬字錦才生他的焙茗拍手道正是他寶玉又問萬兒怎麼樣焙茗道萬兒是外頭買的人如今珍大爺叫他娘老子領回許配奴才央媒去説親萬兒同他娘都願意的了誰知他這個混帳老子賭極了尋著慣放京債的老西兒九扣三分吃利錢兩個月一轉票利上起利如今滾到三百多兩銀子那老西兒明知他有個女兒所以安心放給他就要把萬兒準折做兩頭大因為萬兒不肯在家裏尋死覓活的鬧人還沒有擡去他娘轉托媒人來尋奴才叫商量尋個辦法寶玉道婚姻事先要問女孩兒願意老西兒就能霸占他嗎焙茗道擱不住老西兒天天逼著他老子要銀子怎樣得開交呢寶玉道這會兒有銀子還了他老西兒可還要人不要呢焙茗道有銀子清了他就要人也由不得他了寶玉道那有什麼難處要多少銀子我給你叫他們還了老西兒你把萬兒擡了過來就完了這件事了焙茗忙爬下磕頭道謝爺的賞寶玉又將起造閣子要他監工的話對焙茗説了焙茗道奴才的表兄就是個有名的工匠頭兒內裏起造花園的工程就是他攬的二爺要怎樣造法怎樣的工料奴才對他説了叫他遞上一張攬狀講定多少銀子限他幾時完工奴才自然天天來照看不費二爺一點子心寶玉道我知道要什麼樣造法你只和他説閣子要起得高材料要精細完工要快速該多少銀子隨他估價就是了焙茗答應寶玉叫焙茗先領了五百銀速去辦他的親事焙茗知道庫上新定章程先具領紙由帳房送驗再給對牌赴庫領銀因是寶玉所賞不比別項支銷各處並無批駁焙茗領了銀子便去找著媒人原來媒人就是冷子興知焙茗有了銀子不難玉成其事立逼萬兒的老子邀了老西兒來本利算清當面抽還欠約那老西兒知道榮府的來頭又有冷子興説話現在借欠已清並無挪借只得死了心垂頭喪氣的走了冷子興討了萬兒的庚帖送與焙茗之母葉媽一面擇日完婚焙茗自去與他表兄工匠頭兒説了當下繪了圖紙來回寶玉講定工料銀九萬兩都包在內先領銀一半限四個月完工再找銀兩寶玉看見圖紙又限的完工迅速恰到寒梅開放的時候閣子蓋成十分歡喜便叫焙茗赴庫上支領銀兩這宗銀子領出不用開去公道加一扣頭除庫上門上花銷外焙茗大大沾光便興頭排場娶親了卻數年前書房一敘之緣也應了其母夢得富貴萬字錦的吉兆再説午節的龍舟台閣到初四日製備都已齊全那時迎春香菱俱被黛玉留住賈母又叫打發人去請了喜鸞四姐到來第一寶玉高興早已到蓼花汀一帶看駕娘們演習因來説與黛玉道果然好看黛玉想起每逢佳節良辰遊戲賞玩總少見趙周二姨娘趙姨娘做人雖然器量窄狹行為鄙陋未免人家也太奚落了他激之使然我想天下無不可感化的人何不甄陶他同歸於善書上講的和氣致祥俗語流傳一家和氣值千金我先盡我的道理明兒的龍舟定要去邀他們來瞧瞧當下便叫紫鵑去請趙姨娘周姨娘明兒到園子裏來看龍船未知趙周二姨娘來不來明日的龍舟怎樣有興且看下回分解
