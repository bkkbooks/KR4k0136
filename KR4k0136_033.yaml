body:
  text: 第三十三回話夢新聞敦倫遷善葬花舊地聆曲怡情話説李紈妯娌在議事廳聽了小丫頭的話獨有寶玉更加高興都哄至賈母處只見迎春打扮得服飾鮮豔面龐豐潤氣度舒徐迥非向來愁病萎蕤的光景各人相見問好湘雲寶琴探春先在那裏一面敘話寶玉忍不住向賈母問道老祖宗叫我們來聽的是什麼新聞湘雲道誰叫你們來遲我們是已經聽過的了賈母道正是迎丫頭你把這些話再講給他們聽聽剛才我還有些聽不明白細細的再聽一遍倒比女先兒説的書還好聽呢也叫大家聽了歡喜歡喜迎春先紅了臉笑而不言湘雲道二姊姊還有什麼害躁的二哥哥第一個熱心腸先前知道你在那裏受委曲還要求老太太把你接回家來留住在這裏一輩子不放你到孫家去這會兒不快快告訴他鳳姐笑道再沒有他的那張嘴留不住一句話的迎春見人多了又聽湘雲的話越發礙口難言倒急得湘雲不等迎春開口便道我是已經聽你講過的了若像你們才來的要聽生巴巴要把一個人急死了老祖宗我替二姊姊講橫豎他剛才講的話我都記得周全呢賈母歡喜道到底史丫頭好代二姊姊説了比他自己講的我還得聽清朗些便叫琥珀道你把二姑娘送來的百果糕同早上的桂花酥油餅裝了拿出來叫他們泡好茶去讓奶奶姑娘們吃些點心一時茶果俱到湘雲先喝了口茶故意咳嗽一聲道開書了二姑娘半月頭裏睡到三更時分想起姊夫不和他好委實難過日子就要來告訴老太太替他出氣可惡孫家這些婆子丫頭們一個個都不肯引他二姊姊氣得沒法兒就瞞著他家裏一個人從後門跑了出來偏認不得路一走竟走迷了不往寧榮兩府大街反跑了別處去越走越遠到了一個曠野地方四圍一片白茫茫連路都沒有了他心裏正著急呢寶玉聽到這裏嚇的臉上變了色道這還了得嗎二姊姊你好糊塗怎麼等不到天明打發個人告訴一聲套車子去接你半夜裏一個人跑了出來到底後來怎麼樣呢湘雲看了寶玉發急形狀自己倒不講了只是笑探春道史大妹妹講的話先沒提清故意藏頭露尾的慪人我們沒有聽見二姊姊講過這會兒聽他説的話也要聽迷糊了二哥哥別著急那是講二姊姊做夢呢鳳姐笑道怪道我也聽去有些不像話了老祖宗聽史大妹妹的話果然比女先兒説書還會哄弄人家呢史大妹妹你快些接下去講罷湘雲道正有好聽的在後面呢你們不知道二姊姊迷路著急的時候來了一個穿破爛衲裰的和尚口內朗念南無孽海情天救苦光明佛説有緣的善男子善女人要想脫離苦難快跟著我來二姊姊心裏不得主意便跟了那和尚儘管走走到一座牌坊前和尚忽然不見前面顯出許多房屋分明像是宮殿式樣便定了心只往前走見宮門前有個年輕女子站著遠遠向二姊姊招手走到跟前認是東府裏蓉小大奶奶他碰見了家裏親人心上歡喜就忘了這個人是死過的了蓉小大奶奶挽著二姊姊的手到旁邊一個屋子裏説二姊姊本該就要到這屋子裏去的因為一樁公案未了把幾個人一生結果注定的册子改了連二姊姊也在裏頭二姊姊不信他的話他便開了屋子裏頭的匱子拿一本册子翻開指給他瞧還和二姊姊道喜呢寶玉便向迎春問道二姊姊你可記得册子上寫的什麼念給我們聽聽迎春道我在夢裏看得清楚到醒來還記下數句及至起來連一個字都想不起了鳳姐道寶兄弟你別打諢快聽史大妹妹講完了我還要去看他們找出戲臺上的陳設來呢湘雲道二哥哥到底要聽他自講呢怎麼樣寶玉忙央告湘雲道册子上寫的什麼二姊姊忘了你替他講給我聽湘雲道二姊姊夢裏的事他自己早都忘了我知道册子上寫的是天地元黃叫我替他講什麼呢説的連寶玉自己也笑起來了賈母道我聽了寶玉的呆話比聽鳳丫頭説的笑話還惹笑呢衆人瞧著寶玉只是暗暗的笑一面又催著湘雲道老祖宗要聽呢你快講罷湘雲道蓉小大奶奶送了二姊姊出來二姊姊要拉他廝趕著回來蓉小大奶奶道我是再不得回去的了家裏也沒有什麼牽挂先前對二嬸娘説要立永遠基業的話如今祭田義産眼見就可辦成了鳳姐先聽湘雲的話一半還疑心他們是搗鬼及聽到這裏不禁毛骨悚然怔怔的又聽他講道二姊姊還拉住他要問話蓉小大奶奶叫一聲二姑姑到孫家去過好日子罷就把二姊姊一推只聽得耳邊一聲霹靂驚醒原來是二姊夫也在夢裏喊叫醒來道好怕夢嚇死我了那時大家睡不著等到天明起身二姊姊沒敢説起夢裏的事倒是二姊夫把做的夢一一從頭告訴二姊姊道他夢見一個青面獠牙的把他抓在一座殿上上面坐的不知那一位菩薩不敢擡頭只聽得上面坐的菩薩開口道你祖上靠著榮府提拔恩德未報後來結這一門親戚原是注定的惡姻緣但如今公案已翻你就不能照前這樣磨折懦弱欺淩伉儷了倘再不知悛改黃巾力士何在喚聲未絶只見黃巾力士手起刀落拍尺一聲霎時身軀分為兩段睡夢裏就嚷醒了二姊夫便千姑娘萬姑娘左作揖右作揖央告二姊姊一個總叫別記他先前許多不好湘雲話未住口李紈鳳姐都笑問迎春道二妹妹這話果是真的嗎迎春低頭微笑道我就知道他要替我講的意思定要編派這些話出來取個笑湘雲道我編派些什麼那都是二姊姊你自己講出來的話老太太也聽見的探春道前頭都是真的末後來未免有些裝點賈母道雲丫頭講的不錯要是那麼才好呢衆人知道賈母喜歡的是湘雲説孫紹祖給迎春陪禮的話大家又笑了一笑賈母道那和尚定是菩薩的化身迎丫頭做人忠厚菩薩也怪可憐他你們年輕的多聽著記在心上一個人總要吃齋念佛做些善事菩薩自然來保佑的鳳姐道那是老祖宗敬神信佛修行了一輩子積德蔭在兒孫二妹妹還全靠老祖宗的福庇呢李紈道這句話是千真萬確的賈母又笑道但願迎丫頭的女壻常常記著這個夢再別發舊脾氣出來就是迎丫頭的造化了寶玉道老祖宗放心孫姊夫再像先前那麼欺侮二姊姊叫二姊姊再做起夢來找蓉兒媳婦告訴他就是了湘雲道只找蓉兒媳婦沒相干那黃巾力士又叫誰去找呢賈母道寶玉這孩子心腸太熱説的又是呆話了夢裏頭的人那裏有處找的呢鳳姐道正經寶兄弟在家裏那麼講慣了別裏頭去見了大人們也是這麼隨口亂話起來可不失了體統寶琴道二哥哥不過在老太太屋裏姊妹們跟前説話不大留神是有的若是上朝奏對應酬會客他自然據今證古按部就班不肯錯一點子的了賈母歡喜道琴丫頭是知他二哥哥的果然寶玉到外頭説話原成個規矩體統的只在家裏這樣自説自道我正愛聽他説的呆話比斑衣戲采味兒呢迎丫頭你還沒有見過你大太太趁早過去走了一趟到我這裏來吃飯琴丫頭三丫頭史丫頭也在這裏陪你二姊姊鳳姐笑道老祖宗只叫他們幾個人吃飯我們沒分的別賴住在這裏了説著起身衆人都到院子裏瞧著戲臺見結構得繡圍錦簇耀目爭輝鳳姐道這欄杆結的花樣不配還得從新收拾戲房門簾顔色不好去換新鮮的來臺子上挂的玻璃燈要系高些緊防他們使刀槍碰著呢又吩咐了管台婆子們幾句話先自走了李紈迎春黛玉寶玉四個人隨後走散才出門來只見晴雯紫鵑麝月秋紋素雲彩屏還有許多小丫頭子連鶯兒這幾時常守在屋子裏的也趕了來李紈問道你們約齊了這一群人幹什麼去的衆人只圍繞著迎春不轉眼的瞧還有幾個小丫頭遠遠站著笑黛玉便喚紫鵑道你們這班人還是不認得二姑娘怎麼紫鵑道才聽人説二姑娘回來變了一個人了大家爭著來瞧原來二姑娘就是臉上發了福了黛玉道當真二姑娘長出三頭六臂來不成迎春只是微笑一路行來要與黛玉們分路寶玉道史大妹妹還和邢大姊姊住著二姊姊原到那裏同他們一搭兒咱們去瞧你也近便迎春應道就是這樣很好黛玉道不知二嫂子把二姊姊的東西叫送到那一個屋子裏去了還得打發人去問一聲便叫小丫頭到璉二奶奶那裏去和平姑娘説把二姑娘的東西依舊送到紫菱洲去小丫頭答應著走了迎春分路到垂花門早有小廝們套車伺候跟了丫頭老婆子往邢夫人處自有一番敘話按下不提且説黛玉幾個人同進園門李紈帶了素雲徑回稻香村去寶玉向黛玉道妹妹你瞧今兒微雲遮日樹影搖動咱們何不從梨香院前面繞轉看看園景黛玉因離大觀園一載今復進園與寶玉完姻之後只匆匆到櫳翠庵走了一次拈香尚無暇玩景尋芳今聽寶玉之言正合其意又想順路到妙玉處一談便循崖傍岸渡橋穿徑而來鶯兒先要回去被紫鵑拖住只得與衆人同行在後才轉太湖石見一塊平地上面芳草芊芊寶玉道這不是和妹妹葬花的所在嗎你看春紅落盡連地下的零瓣殘香都不知那裏去了可惜今年忙忙混過沒有再弄這個黛玉道葬花原是韻事可譜無雙若一年一度按板的行起來有何新奇趣味正説著忽聽梨香院送出一派歌聲黛玉側耳細聽因風不順聽不清演的何曲不知是清音還是戲班裏的但覺音調悠揚神怡心曠因想起當日在此葬花的時候聽他們演的良辰美景奈何天賞心樂事誰家院這兩句已禁不住纏綿感歎如今細味眼前光景好把這兩句底下奈何天誰家院這六個字截去同一春去難留花殘可惜的時節而心境迥與舊日不同即再聽牡丹亭尋夢曲文又何必傷心似水流年呢黛玉正在出神寶玉笑問道你又想的是什麼了難道因地生感還要想隨花飛到天盡頭嗎黛玉笑了一笑道咱們走罷行不多時已到櫳翠庵黛玉道我前兒來這一趟沒見妙師父今兒你先回去我進去和他説説話就來寶玉道咱們同進去擾他的茶黛玉道這像什麼如今不比頭裏你要見他你明兒一個人來倒使得今兒你要拉扯我讓你一個進去我自走了寶玉道這有什麼要緊我就不進去在外邊等著你黛玉道説話要準的呢別停會兒又跑了進來説著帶了紫鵑雪雁進庵去了寶玉在庵外瞻顧徘徊見那些梅樹緑葉重重想到上年開花時候不曾賞玩假如我做成了和尚那有再見他開花的日子一面向晴雯道這裏年年開的好紅梅我就上年沒在家你不見這花開了有兩三年了咱們今年要興興頭頭賞梅做些玩意兒晴雯道我不愛這些寶玉道你愛什麼呢麝月在旁笑道他就愛坐在薰籠上暖和也配著梅花呢寶玉道瞧這裏左近沒有個坐落離蘆雪亭又遠妙師父那裏不便常去攪擾他不如蓋起一座院宇來到冬天請老太太到這裏來賞梅和姑娘們結社做詩但只看梅賞雪必得起一座高閣怕逼近庵旁閣上開了窗瞧見妙師父院子裏還得要和他去商量晴雯道咱們的園蓋咱們的閣子有那麼些功夫和他商量去寶玉道我怕不知道是咱們的園子他比不得別一個別冒失寶玉和晴雯一面説話各自隨便在假山石子上坐下那小丫頭們因晴雯近來性氣不比從前又為他們是伺候奶奶的人諸事看開一點不去嚴行彈壓他們寶玉是向來沒人怕他的這裏一帶花果樹木歸於庵中經理與管園老婆子們無涉沒人攔阻越發任性的玩起來有的蹲在牆下挖那嫩竹筍兒也有攀拉籬笆摘那薔薇花朵甚至有猴上樹枝打才結的梅子吃的鶯兒也站在樹底下瞧著他們寶玉見了怕他們栽下樹來便招手道快下來罷這些不是玩的才結的小子兒有什麼味兒麝月道二爺去嚷他們呢少不得栽下來跌個希糊腦子爛才免淘氣呢小丫頭聽寶玉吆喝都笑嘻嘻的下來走攏寶玉身旁獨鶯兒一個人遠遠站著寶玉叫道鶯兒姐姐他也來這裏坐坐鶯兒只是不理寶玉在石上坐了一會黛玉還不出來便向小丫頭手裏接過一朵花兒插在晴雯鬢邊晴雯帶嗔不嗔的扭回身去伸手把花摘下撩在地上引得鶯兒也撲嗤的一笑麝月道難得鶯兒姑娘也有笑臉兒給二爺瞧了一語未了妙玉已送黛玉至庵門首寶玉連忙站起妙玉早已看見把寶玉釘了一眼和黛玉取笑道有人來接你呢寶玉忙趨步上前道瞻謁不誠故爾止步正不啻有浮槎已入蓬萊境門障蓮花無路通之憾妙玉並不答言只顧與黛玉笑道恕不過虎溪了寶玉走了十余步回頭見妙玉還站在門首妙玉見寶玉回過臉來便抽身進庵去了寶玉一路問黛玉道妹妹坐了好一會與妙師父講些什麼話黛玉道我進去先拈了香和他話的也不久不過講講路上風景南邊古迹寶玉道可惜我在南邊住了這些時先前心上有事顧不得後來到了揚州只逛得平山堂兩回別的地方沒有都去逛黛玉道有的地方不過徒有其名其實也沒有什麼好景致還有附會其説的我今番回家不過到爹媽墳上走了幾回順路瞧瞧野景記得小時候出去逛的地方不少那裏逛得遍呢即如妙師父剛才講起的露筋祠我就不知道在那裏寶玉道露筋兩個字什麼出典呢黛玉道舊説傳有女伴夜行至此因天雨泥濘不能前進此地蚊蟲最多難以露處旁有耕夫草舍其嫂止宿伊姑寧死不進田家遂被蚊蟲咬死致露其筋後來立祠嘉其貞潔我不信有這樣利害的蚊蟲寶玉道可憐這一個女子自然姿色不是平庸的了如此捐軀守潔還不該建祠表揚他嗎一路講話行過朱欄板橋已到蘅蕪苑寶玉道咱們進去瞧瞧黛玉恐寶玉傷心待要不進去又想既到這裏必執意徑過又似顯露形迹且寶姊姊並非病故在此不過是他舊日寄居之所何必避忌豈料一進院內但見室纏蛛網梁落燕泥苔斑柱礎之痕塵積窗紗之格舊時陳設的石頭盆景紗照屏這些古玩都已收去止留椅桌簾櫳壁間尚挂著水墨字畫雖有管屋的老婆子在內住歇連灑掃啓閉之事並不留心以致滿目荒涼不但寶玉淒然欲慟即黛玉此時亦不禁室在人亡之感又想到自己身上倘去年一病不起此日瀟湘館淒涼景況同此一般未知入我室者又何以為情晴雯紫鵑在旁看出寶黛二人各有傷感之意便道你們瞧東牆上的太陽止剩下三四尺天天正是傳飯的時候了黛玉也恐寶玉在此發呆便抽身出外寶玉亦隨了出來一同回到瀟湘館黛玉因家裏來的人已經住了兩個月要回南邊幾天前已將公館內所有的陳設器具開了一扣清折送進派接手人經管黛玉便酌留了兩三房家人媳婦其餘都打發回南專派一房就住在公館內經管一切連夜寫了請安稟帖鳳姐處自料理送黛玉嬸母的禮物並給家人們賞封盤費黛玉另有盛禮附送寶玉次日一早起來出門去了黛玉吃過早飯正要往王夫人處只見平兒過來説姨太太請來了已見過老太太太太姨太太要到奶奶這裏來老太太留住姨太太在屋裏説奶奶就過那邊去的我們奶奶叫我來請奶奶呢黛玉道我正要過去又要你來跑這一趟説著便同平兒來到賈母處未知見了薛姨媽怎樣光景且看下回分解
