body:
  text: 第三十二回委任得人因奴托主傳家存厚薄利輕財話説鳳姐與賈璉議論兌銀上庫之事講起賈芹鳳姐説到議事廳再提的話暫且按下講到次日寶玉因同年的太翁壽辰早起來先到賈母王夫人處請了安一徑出門這裏黛玉起身早有鳳姐處打發平兒帶著老婆子一同到來平兒走進瀟湘館才上臺階便接過包袱命老婆子在外候著平兒走進屋門便問奶奶起來了嗎雪雁在里間屋子裏應聲一面出來見了平兒笑道好早阿姑娘梳頭哩黛玉聽是平兒的聲音便叫雪雁請平姑娘裏頭説話平兒放下包袱同雪雁進內見黛玉正在對鏡理妝春纖站在旁邊手內捧著珠釧叉環等物雪雁進去接過一件件與黛玉妝飾小丫頭子忙端了一張杌子過去黛玉叫平兒坐下平兒欠身就凳沿坐了黛玉叫小丫頭子端茶平兒道奶奶賞我的桂圓建蓮我天天起來叫他們預備著才吃了來的早上不喝茶呢小姑娘別去倒奶奶今天起的早我們奶奶才起來呢昨兒銀庫上送了幾本子支發滾存帳簿進來我們奶奶看過的了請奶奶過目打上圖記再發出去我們奶奶叫先打發人來看奶奶起來了才叫我送過來因是小丫頭説見寶二爺從太太屋裏出來穿了出門衣服像是外邊去拜什麼客我估量奶奶也起來的了所以趕著送了來現放在外間屋裏桌子上黛玉道那又是你奶奶多心了你就是你奶奶一個好幫手不是我背地裏説一句不怕你奶奶見怪的話我先前冷眼瞧著你有時聽旁人説起果然存心寬厚辦事周到又知輕識重憑著人廝擡廝敬自家再不肯作一點威福正經比著你奶奶強遠呢平兒站起身來道我又知道些什麼不過我們奶奶事情忙些小事件可以傳言送語的替我們奶奶分一點勞那裏當得起奶奶這樣擡舉可不要臊死了人黛玉道那是我的真心實話何犯著面腴你前兒重托你奶奶掌管家務也為的是有你在那裏幫著你奶奶靠得住你才説起銀庫上的簿子這會子既送了來且擱著我瞧一下子以後可不必送來説話時梳妝已畢黛玉命雪雁在四寶箱頭一屜內取出蟠螭漢玉圖章兩方來黛玉接過揭開匣蓋取了一方那一方仍叫連匣收好便將取出這一方遞與平兒道這方圖章是我和嬸娘要的玉色也好我又愛他上面鐫的這幾個字簿子上就打上這個如今只當交給你了回去告訴你奶奶一聲就是還得去另配一個匣子擱著平兒接過圖章道蒙奶奶作養盡心幫著我奶奶辦事總不敢辜負奶奶當下又説了幾句間話順便提起明兒擺酒並去請姨太太的話道昨兒打發人來回過奶奶的了平兒一面取出手帕包好圖章辭了黛玉一徑出瀟湘館走了這裏黛玉吃了早飯且不看平兒拿來的簿子命雪雁把前兒送來的册子一同叫小丫頭捧了帶了雪雁春纖步出瀟湘館徑往議事廳來頂頭碰著小紅來請道我們奶奶和大奶奶都在議事廳候著奶奶呢説著便轉身跟了黛玉來到議事廳前見院子裏許多管事的媳婦都垂手站立兩旁黛玉進內與李紈鳳姐相見讓坐雪雁接過小丫頭捧的簿册擱在一旁妯娌們先説了幾句間話黛玉先叫翻開地畝册子指著説道我看册子上有地幾千頃莊子幾十座還怕一半是虛的大嫂子未必明白二嫂子自然知道些大概緣由鳳姐忙答道那是外邊鬧的鬼恐怕老爺太太知道連我都瞞著也不定當真摸不著他們偷天換日頭的事就瞧著手頭一年窄似一年保不住不在這上頭挪個窩兒黛玉道不是飢荒緊沒地方抓挖誰願意把祖遺的血産向別人手裏送呢但是咱們的田産未必敢賣絶也沒人敢承買只要告訴璉二哥一聲把私下質當出去的統贖了回來在庫上開了一筆支帳就是了再查家人花名舊册男女共有二百餘名核對新册因近年散去的短少好幾十名口除開家生子這些人來投靠的若不為有了過犯攆逐是他們自己告退或因無所職司或因出息微細迫於衣食也須格外原諒但凡去而復回者一概收用量材位置現在的都按著舊派職事照常經管賴升林之孝不用説如吳新登仍總管銀庫房再派妥人幫辦戴良仍總管倉務周瑞仍管春秋兩季地租子買辦頭兒仍派錢華各寺廟庵觀月錢月米仍派餘信一應職司及賴大娘林大娘等都不必更動不論何人查出弊端即行重究再園子裏頭老祝媽仍叫他修理竹子老田媽管稻香村一帶禾稼菜蔬怡紅蘅蕪兩處的花朵兒香草兒依舊交給葉媽去擺弄黛玉便問這些人都在麼一語未了早有賴升林之孝吳新登家的這幾個有頭臉的管事媳婦走進簾子裏頭應聲道他們都在院了裏伺候著呢平兒站在鳳姐背後挪了幾步向著簾子外説道三位奶奶都在這裏剛才吩咐的話你們都聽見了嗎衆人在院子裏齊聲答應黛玉又向鳳姐李紈道今兒三妹妹不在這裏我不是要駁他回先前他講的話也是因時制宜比如我與聞其事未必不有他這番調度如今我想園子裏頭原是個玩意兒的所在有人專司葺理那花卉自然開得分外精神足供遊賞即田禾畦菜亦是園中點綴講到出息上頭叫他們多沾個光兒只要每時每節自老太太起至各位奶奶姑娘們屋裏孝敬些時新花朵果品就算盡了他們的心了至於我們用的頭油脂粉及禽鳥鹿兔的糧食並各處簸箕笤帚等類一概不用他們置備歸於帳房內支領開銷倒是園裏頭單做粗重活計沒有出息的這些老婆子多分些餘利給他們是應該的黛玉講到這裏那管園的老婆子們在外邊聽了早已感激不盡面面相覷自有一番歡喜又聽黛玉道若説到賞項上頭各房裏姨娘家裏有了白事向來賞二十兩再加一倍向來賞四十兩再加二十兩紅事仿此各房丫頭到十八歲即行許配如外邊買的人賞給娘家領回或情願配給裏頭小子各聽其便或本人感念主兒恩典願在裏頭多伺候一兩年亦聽其便小廝到二十歲便令成家或裏頭一時沒有丫頭發出令其自行定配格外賞銀五十兩此外若有出力得用之人以及哥兒姐兒的奶哥們家裏遇了紅白事件隨各人的情分恩典不拘定額至於各房大小丫頭月銀月錢再別去刻省他算起來一年費得多少必得把後來減下的數目補上再加一倍賞給丫頭們既添了沒有太太奶奶姑娘們倒照舊的理自然也加一倍還有哥兒在學裏紙筆銀八兩本來不多及各位姑娘房裏每月所用頭油脂粉這些東西不必就在月費裏頭拿錢去買仍叫買辦按月到帳房裏領錢買了交給老婆子們分送各處只不許買辦拿了使不得東西進來胡亂搪塞月例一項到了初一日便按數開發再別遲他們的日子鳳姐聽到這裏觸動他的心病臉上一紅正要開口想和黛玉分證兩句又聽黛玉道先前來遲去慢有時也為庫上不便並非故意壓擱他們如今自然慮不到這上頭了就是我諸事要從豐厚一邊行去並不是有意揭人家的短自己沽名吊譽要知撙節用度原是量入為出的道理如今通盤核算起來任憑怎麼樣揮霍一點也不至於後手不應這斂財聚怨四個字咱們也要慮到的鳳姐此時敬畏黛玉已到十分且聽他議論宏通層層周匝本無懈可擊要因風吹火兒奉承他幾句當著衆人面前防他們要笑話又怕越發招認了頭裏自己尖酸刻薄的行為只是默默不發一語惟有李紈開口道妹妹所見極是剛才説的因時制宜何必拘定與奢寧儉況又重在恩寬下人居多也不失咱們祖上厚道傳家的根本正經照那麼辦去很好的了那時衆人在院子裏鴉雀無聲聽黛玉的話也有擠眼的也有吐舌的也有伸了兩個指頭做手勢握臉的也有悄默聲兒念佛的再講黛玉命雪雁取過人口册揀出使婢花名一本揭開翻了幾頁指與鳳姐李紈看了因笑道這可不是他們糊塗太太已經認了幹女兒怎麼册子上還有他呢林之孝家的忙上前回道這是因册子造在前太太認在後所以沒有開除又陪笑道奴才正要請示這件事向來各房裏的姑娘們發出去配了人或有了不是攆出去就把這個人開除了底下注明某年月日配人或攆逐的話如今該怎麼樣注呢李紈也笑道這倒是一件創事不便不開除他黛玉便命雪雁取一張紅紙條兒貼了這一行道也不用注什麼字樣的只叫他們把後面總數改了一筆就是了林之孝家的應了一聲是黛玉一手又取家人册子翻開提筆圈出了王榮和張若錦趙亦華錢啓四個人道這四個奶哥兒既不在正經行擋上我的意思要叫他們出來或在本地或到南邊四個人分開了不拘跟那一位爺們當鋪綢緞局裏去分上一分子釐頭告訴璉二哥哥對外邊説一句就是了還有爺們哥兒姐兒的奶哥子兩位嫂子再去查一查李紈道蘭兒的奶哥都還小呢鳳姐笑道我們奶的只沒有就是你璉二哥哥的趙媽媽有兩個奶哥兒叫什麼涼呢凍呢平兒在旁介面笑道一個叫趙廷梁一個叫趙廷棟鳳姐道正是這兩個趙媽到裏頭來求過還沒允他如今妹妹想的到原是應該的咱們就先把這幾個人安頓了再查去還有一件事要告訴妹妹不是妹妹查家人册花名册照舊派周瑞經管租籽如今要到南邊去多置田産周瑞一個管不過來且到那時候再開出幾個妥當的請妹妹斟酌黛玉口裏應著一面又命將平兒早上送來的簿子翻開一看面上一本系旬結總簿上寫某年月日結存舊管貯庫銀一千二百八十四兩某日至某日兌進上庫銀一千三百萬兩先提出月例動用銀三千兩另開日清簿長短再算除支發項下某日藝哥兒領銀二十萬兩某日薔哥兒領銀二十萬兩挨次而及共一十八家照依前定發本已如數領訖惟有賈珩賈珖只各領銀五千兩又領辦西寧郡王之孫完姻送禮銀五百四十四兩錦鄉伯府孫女挑選添妝禮銀四百六十八兩南安郡王壽禮銀一千兩世襲陳也俊家生子滿月禮銀一百二十四兩各項下注明另有備禮用銀清帳結存貯庫銀一千零零八萬六千一百四十八兩黛玉命取算盤早有賴升家的捧了二十七柱一面大算盤送到黛玉面前黛玉便輕舉纖指撥動盤珠如落珠迸豆之聲李紈先聽黛玉口內報了數目便向簿子上一瞧總結並無參錯因笑道這又奇了向來從沒見你弄過這些怎麼回家去了幾個月倒像錢鋪子裏做了掌匱來了黛玉道古人背聽唱籌尚能記數這算什麼就是堆積丈量費事一點也只要心眼手相應並非難事一面查對發領銀本底帳便問鳳姐道後街三房芹哥兒為什麼不來領銀還有兩家每家只領銀五千兩呢風姐道那兩家先支幾千銀子出去做聘夥計的安家費用並置辦行李物件等定了長行日子就打總兒來領的至於芹兒這一宗銀子正要告訴妹妹你璉二哥哥説起芹兒很不安分已把錢糧檔子革除的了他倒進來跑了幾趟想要領出這宗銀子去就怕他幹不正經所以還壓著沒有發呢黛玉道璉二哥慮的也是但只闔族中都應酬到了他還算是近支又在裏頭跑動的因他行事不大誠實預料他幹不了單把他這宗銀子扣住人家心裏也不輸服咱們先以不肖之心待人更使不得等到盤查時候虧短了本銀果有對不住裏頭的緣故然後收回他銀子可怨不著咱們了一面説便叫平兒打簿子上的圖記又對鳳姐道早上和平姑娘説過的以後這些簿子就留在二嫂子那邊叫平姑娘幫著看看別再送到我那裏去我的圖章已交給平姑娘的了又向平兒道平姑娘你幫著奶奶又算幫我一樣話未完平兒都打了圖記李紈接過圖章看道好精致黛玉道我愛這幾個字鐫得秀穩精工捉刀有力句語也好我還留著一方上面刻的處世無奇但率真咱們雖不處世這率真兩個字都可去得這一方上是傳家有道惟存厚七個字恰配印在這上頭李紈又在素紙上印了一方細玩稱贊不已黛玉又問林之孝家的道甄家薦來一個人叫包勇為什麼册子上沒有他的名林家的回道那是甄家薦來的時候就説在這裏暫住幾時底下要討回去的所以老爺也沒有派他職事並沒上册子黛玉道薦來的人既然收了也同自己家人一般老爺那裏留心到這上頭況且這個人很有肝膽膂力也好不是進京的時候船上被了盜全虧他出力抵退的二嫂子告訴璉二哥等他們起標把這個人帶著路上有多少照應一面便命衆人各自散去都要循職安分任勞報主衆人齊聲應了一個是魚貫而出這裏人還未散見寶玉忙忙的趕到未進屋內先笑道你們瞞著我倒在這裏興起這件事來了一頭走進滿屋子裏一瞧道史大妹妹三妹妹這些人為什麼不來鳳姐道寶兄弟你説我們在這裏幹什麼寶玉道我問小丫頭子説你們帶了許多書本在這裏起詩社呢黛玉聽了忍不住一笑道頭裏也起過好幾回詩社你見那一個帶了書本子來如果做詩要帶著書本子走請來的醫生要挑幾擔藥書來好現翻湯頭開方呢李紈笑道你瞧這個所在是起詩社的不是你們翰林院衙門裏有設兵馬錢糧的事嗎寶玉便在桌子上隨手挈起一本簿子翻了一翻便撂下笑道原來是這些怪道鳳姊姊也在這裏鳳姐道你別笑話我不會做詩我拚出半年間工夫也像香菱那麼拜了你林妹妹為師怕你們底下要起詩社還得拉我呢黛玉道我也當不起你拜師你也不用再學蘆雪亭就有你的佳句鳳姐道你們爺同奶奶別再取笑我了咱們且講正經姨媽是請定的了明兒請大家聽戲寶玉道偏偏鎮國公牛府裏頭新弄了一班戲邀我明兒去聽我又允了他們了鳳姐道那也沒有什麼作難只管聽你的戲去家裏的戲老太太高興多唱幾天也不定寶玉道我今兒買了兩件東西你們瞧著好不好鳳姐問買的什麼寶玉道我在牛府裏碰見了馮紫英説起有人托他銷的四件東西老爺也見過的銷脫了母珠鮫綃帳還剩自鳴鍾同那漢宮春曉圖圍屏我倒愛他這幅鮫綃帳夏天張在屋子裏説是一個蚊蟲也飛不進去倘被人家買去了豈不可惜圍屏自鳴鍾因賣主急等錢使讓了一千銀子買下了明兒他們叫人擡來圍屏擺在綴景閣時辰鍾就擱在我屋子裏鳳姐道記得那顆母珠原拿來與老太太看過因是沒有錢同那一幅帳子原封兒沒打開還了他們如今到底是多少銀子買的呢寶玉道五千讓了一千不是四千嗎李紈笑道你肚子裏的算盤原不錯人家沒有聽見要五千兩的話知道讓了一千還得多少呢鳳姐又故意慪他道明兒人家送了東西來看你銀子在那裏寶玉道姊姊給他們一面對牌到庫上領呢鳳姐笑道我不管如今我的對牌也不靈了還是和你林妹妹説去他不借給你明兒他們擡來還得叫他們擡回去寶玉聽説便走近鳳姐身旁涎皮賴臉的猴上身來叫道好姐姐你別臊我的臉鳳姐一時把寶玉推又推不開揉搓得他紅上臉來口內嚷道林妹妹看你寶哥哥那麼個樣兒也不管教管教他黛玉道我知道你們姊姊兄弟向來那麼胡鬧慣的倒來拉扯人家一頭説便扭過臉去把日清支銷各簿翻開看了一看叫雪雁包好同那些册子一總交付平兒又與李紈説些間話正要起身只見賈母處一個小丫頭喘氣籲籲跑進來道二姑娘回來了在老太太屋裏説了好些話老太太叫奶奶們去聽新聞我白到園子裏跑了一趟誰知奶奶們都在這裏呢衆人聽了小丫頭的話連忙起身出了議事廳徑往賈母處來未知聽何新聞再看下回分解
