body:
  text: 第五回撰祭文癡心人悼亡念親情老太君痛別話說黛玉叫老婆子到稻香村去借戥子湘雲問他要來何用黛玉道我嬸娘打發人來接我除盤費之外替另給我五百兩銀子叫我起身時零星使用想我也沒有別的用頭就是我在這裏住了幾年如今回家沒有這項在手頭也就罷了嬸娘既想得到寄了銀子來這些丫頭老婆子該賞他們一賞我約摸算算也用不了這些邢姑娘怪可憐的在這園子裏單指著一個月兩吊錢的月費夠他什麽聽見他常當當貼補姨媽家裏有事也想不到這上頭我送他五十兩別敬就是你家裏雖然寬裕也到不了你手裏你那一位嬸娘早就聽見人家說起來銀錢上也是很緊的未必十分疼顧你我也送你五十兩放在手頭給丫頭們添補些針兒線兒湘雲道我沒有盡一點子情怎麽好叨你的呢黛玉道這算什麽不過盡我一點別忱況且我也不短什麽用說著老婆子借了戥子交給雪雁送上黛玉道你把書槅底下這只紅匣子開了鎖把匣子裏銀子都搬了出來打開兩封稱兌二十兩的封起三封來雪雁打開銀包拿了戥子怔怔的瞧著那南邊來的女人站在旁邊道姑娘吩咐我來稱罷說著接過戥子稱了二十兩的三封黛玉道你再打開兩封每封內稱十兩下去湊成六十兩再給我稱出二十兩一封十兩一封那女人道這麽還得打開一封說著又把銀封打開稱畢黛玉叫把封子上貼了紅簽記明數目明兒早上起來同雪雁到稻香村去走一趟和大奶奶說明這一百兩的兩封給園子裏外自老太太屋裏起至奶奶姑娘姨娘各房裏的姑娘們買花兒插的六十兩的兩封一封給各處老婆子們一封給垂花門外小子的那二十兩的兩封一封給管廚子的柳嫂子這一封給廚房裏衆人還有二十兩一封送到櫳翠庵去敬菩薩面前的燈油黛玉在紅簽上寫了敬獻燈油四個字又道這十兩一封給庵裏的小丫頭婆子叫雪雁一個去再拿出三封來放在書槅子上我有用處統共算算還乘多少那女人算了一算笑道只乘得四十兩了黛玉道剛剛留明兒一天這會兒停當了也了結一件心事又向雪雁道你把這兩套皮棉衣裙包好明兒櫳翠庵回來同書槅子上一封銀子送到邢大姑娘那裏去說我的別敬請邢大姑娘留著手頭便易些別再送回來雪雁答應這裏又取了一封交給翠樓說替你姑娘收拾著湘雲當面道謝黛玉又叫雪雁拿那一封去給紫鵑留著又和湘雲說些閒話各自安歇次日王夫人與黛玉餞行命鳳姐代陪照樣兩席也就擺在瀟湘館除了妙玉寶琴香菱不來仍邀集園中諸姊妹鳳姐一早先打發人傳賈母的話說黛玉病後須要靜養避風不必過去請安辭行起身時候與老太太見一面就是了太太也是那麽樣說黛玉答應來的人走了這裏到稻香村去的女人回來把銀子逐一交代明白的話回了黛玉停了一會雪雁回來也回明瞭櫳翠庵的話又拿了銀封衣包去送岫煙飯後李紈等先後到齊岫煙見了黛玉再三道謝李紈也提及賞給丫頭婆子們的銀子已送過那邊去了坐至午後鳳姐才到見過衆人說史大妹妹同二姐姐來了也沒顧得上過來瞧瞧你們如今林妹妹要回家了咱們也留不住他第一個老太太心上有幾天不好過呢明兒林妹妹走了大家到老太太屋裏陪伴說個話兒多住幾天說著叫跟來的老婆子上去把銀子放下一面向黛玉道這二百兩銀子是老太太給妹妹路上買果子吃的這一百兩是太太送妹妹的程儀還有八條金腿十二匣子幹點心建蓮茶葉桂園醬菜這些預備妹妹路上用的東西已經發到外邊叫他們裝車子省是送到這裏又要搬出去黛玉道我在這裏除別的不算一個月倒害十五天的病不知花了舅母家多少銀子還累得老太太太太不夠嗎這會兒又要拿了走我笑劉姥姥是母蝗蟲我不是也成了劉姥姥了探春道攜蝗大嚼圖裏面現成有你不用另費筆墨大家都笑起來黛玉又道蒙老太太太太的賞賜又不敢不領叫我怎麽樣呢話未完跟來的老婆子上去給黛玉磕頭謝賞鳳姐道正是我倒忘了妹妹在這裏又不是客怎麽要賞起他們來剛才大嫂子打發人送過去我就請了太太的示按著他們月錢的分例裏裏外外一概腦兒散給他們說著叫跟來的丫頭過去謝賞一面就催擺席不多一會媳婦子帶著老婆子們上來伺候停當黛玉首席各人依次坐定鳳姐先與黛玉安了席其餘丫頭們送酒觥籌交錯鳳姐在座想到寶玉之事自己心裏也有些對不住黛玉今見黛玉一些聲色不露若無其事天良感發越覺不安坐著很不舒服又不好起身就走正在爲難見平兒進來道太太等著奶奶問話呢鳳姐便乘機走脫向李紈探春道你們大家勸林妹妹喝一杯我去去就來李紈道你自幹你的留平兒在這裏平兒巴不得在此和林姑娘敘話一番聽見李紈留他只是站著不動鳳姐回頭道大奶奶叫你在這裏別多灌酒回去發酒風說著連忙去了黛玉便拉平兒坐下湘雲笑問道你幾多回兒在你們二奶奶跟前發過酒風平兒道聽他的話呢一面叫小丫頭遞過酒壺與黛玉並各人面前斟了一杯探春道咱們在這裏熱鬧了兩天連你個影兒也不見平兒道前兒就聽得大奶奶同姑娘們派公分給林姑娘餞行我倒很想來呢一來不敢附分二來也實在顧不上不然我早趕了來瞧個熱鬧趁著喝你們兩杯酒也好湘雲道前兒還有琴姑娘連妙師父也來的當真比前年那一晚咱們和二哥哥做生日還有興呢探春忙瞧了湘雲一眼湘雲會意便不言語黛玉介面道二哥哥身子一定還沒大好出不得門所以沒過來如他掙紮得起肯不來湊個興嗎我明兒起身要去瞧瞧他平兒聽見湘雲提起寶玉料定黛玉耳中決然聽不得這兩個字不覺身上凜了一凜及見黛玉神色怡如反替寶玉圓釋若心中一無芥蒂竟出平兒意料之外又聽黛玉說到明兒要去瞧寶玉更與鳳姐捏了一把汗只是呆呆坐著出神黛玉看見反照杯過去道太太委你奶奶做主人陪客你奶奶走了你便是奶奶的替身怎麽到這裏來發心事別白熬著替你奶奶省酒正說著雪雁來回柳嫂子說這會兒才出空了手領著廚房裏的人都來磕頭謝賞黛玉吩咐雪雁道你去對柳嫂子說我在園子裏叨擾他們這幾年這一點兒算不得什麽叫他們打一壺酒喝倒勞動他們去罷這裏衆人知道平兒量大都要灌他重又豁拳行令比鳳姐在座時甚爲高興接著又來了鴛鴦平兒問道爲什麽這會兒才來鴛鴦道我趁著老太太睡覺脫滑兒到這裏給林姑娘謝賞呢黛玉道這句話就該罰你說著連忙讓座衆人道罰他先吃三杯酒罷鴛鴦飲酒和黛玉敘些閒話想黛林玉初來在一個屋裏伴了幾時後來搬進園中也時常見面今日分離實出意外未免依依一時恐賈母叫喚不敢久停起身告辭平兒道要走同走二人出席又到紫鵑屋裏坐了一坐出了瀟湘館一路談論黛玉近來光景不提這裏席散後一宵易過次日天明外邊一切預備停妥伺候黛玉起程且說寶玉得了黛玉兇信哭暈後醒過來已打定主意卻不知鳳姐設計瞞黛玉回生一事有時追憶前情還拉住襲人盤問林姑娘臨終光景襲人只得將錯就錯飾詞寬慰他道你頭裏講過晴雯做了什麽花神我不信林姑娘是花朝日生真是花神轉世的那夜裏人家都聽得花叢裏有鼓樂之聲迎他去歸位了寶玉問道林姑娘提起我沒有呢襲人道林姑娘既做了神仙無論人家待他好待他不好都就撩開了還提起你什麽呢寶玉又問道我娶寶姑娘的事林姑娘到底知道沒有呢襲人道那倒沒聽見說他知道不知道就是知道他也不管你們這些事情了寶玉聽了將信將疑不免傷心流淚奈明知花謝水流返魂無術便把從前多愁多慮如醉如癡的念頭漸漸消去於七情上只纏住一個哀字倒覺易於支援又加以醫藥扶持病體一日好似一日便要往瀟湘館祭奠黛玉襲人聽了暗暗好笑又十分著急百般勸阻幸虧賈母王夫人都來說道好孩子你的病才好別這麽著就要到園子裏去逛逛也等自己身子硬朗了再出去你不聽話我們都要生氣呢寶玉沒奈何只得耐性挨著到了黛玉起身的一天寶玉和襲人說叫老婆子去吩咐柳家的明兒端整一桌供菜開我的帳這裏送錢去襲人道錢不錢沒有什麽要緊柳嫂子自然知道的二爺到底吩咐明白這桌供菜那裏使用呢寶玉道我叫端整了自然有個用處說著又叫麝月研墨自已取了一張紙焚了一爐香握管構思擡起頭來見襲人站著不動寶玉催他道你爲什麽不依我的話吩咐去襲人只得慢慢走開寶玉又叫住道就叫廚房裏買辦多買些銀錠紙錢同供菜一搭兒用的襲人明知寶玉的心事走出房外到別處去轉了一轉來回寶玉說已經叫他們辦去了這裏寶玉提筆寫了幾句叫他們都走開思索一回又寫不多時脫了稿重取素箋一幅端楷謄請從頭至尾念了一遍擱開取了底稿來至寶釵屋裏便遞與他看道我明兒要去祭林妹妹做了一篇祭文你瞧著有什麽不妥之處替我斟酌些兒寶釵笑道你做林妹妹的祭文很難著筆不如不做的好寶玉拍手道你的話一點也不錯浮泛了不是我祭林妹妹的話頭粘滯了又恐唐突真難落筆先前晴雯死了我還做一篇祭文林妹妹也見過的難道林妹妹反不如晴雯寶玉一面說寶釵自看他祭文看完說道文章是好的題目不大切貼寶玉道你不見字字行行都是咱園子裏的點綴我和林妹妹這幾年相聚的故事還道不切題嗎寶釵止不住要笑道我原說的不是文章的不切題目是題目不切文章寶玉道你別說這樣巧話總不過是文章不好罷了寶釵才講出口正在後悔這幾句怕寶玉聽了動疑誰知他並沒理會向寶釵手中接過底稿自去收拾一夜無話次日起來便催買辦的東西要往瀟湘館去襲人再三勸阻不住沒法兒去請鳳姐卻說上一天鳳姐等平兒瀟湘館回去問起我走後林姑娘說什麽話沒有平兒答道我瞧林姑娘竟脫體換了個樣兒像把頭裏的事都撩開了聽說明兒起身要過來瞧寶二爺這便怎麽呢風姐點點頭半晌不語才開口道這件事我卻料不到如今只要挨過這一半天就可保無事了到了次日鳳姐一早起來先打發人來園子裏去探聽林姐姐起身資訊一面催促外邊車轎人夫趕著預備停妥此時聽說襲人來請想來爲寶玉的事趕忙過去這裏到瀟湘館自黛玉以及丫頭媳婦們同李媽的鋪蓋行李並包裹箱籠忙亂發運湘雲的隨身物件搬在紫菱洲與岫煙同住紫鵑亦掙扎起來伺候黛玉想起多年主婢相聚情分只是離緒滿懷又說不出所以不能一同回南的苦衷柔腸寸斷向黛玉跪下磕了四個頭只說得姑娘路上保重四個字早已淚隨聲下咽住了說不出話來湘雲在旁看了也覺酸心接著李紈姊妹岫煙迎春探春惜春聯袂而來黛玉移步出檻剛至回廊邊只聽得一聲姑娘回家了黛玉擡頭微笑道不是他叫喚這一聲我竟忘了他忙叫了雪雁把鸚哥架子移下看食罐水罐裏都添了沒有雪雁道都已添得滿滿的了黛玉便命老婆子提去交給垂花門外的小子拿出去叫他們提著別挂在車上磕碰著一面迎著李紈這班人道又要勞動大嫂子同各位姊妹起了個早李紈道不是我趕緊催他們起來再停一會兒林妹妹倒已上車走了好幾裏路了說著見紫鵑已哭得眼紅聲咽便道我瞧紫鵑這會兒不如跟著你姑娘走罷別丟在這裏盡著傷心黛玉道正是我走了剛剩他在這裏單靠兩個老婆子伴著也怪孤冷大嫂子就叫他搬了過去的好一面叫紫鵑避風不用出來此時黛玉款移細步出了瀟湘館門絕無留戀舊居之意簇擁著李宮裁姊妹迎探湘岫這幾個人彼此說笑出了園門一路上丫頭老婆子們磕頭的絡繹不絕黛玉與衆姊妹都往賈母處來賈母見了由不得一陣心酸滴下淚來黛玉趨步上前抱住賈母的腿跪下磕頭賈母一把拖住淚眼模糊對著黛玉端詳了一會暗暗想道如今我瞧林丫頭這模樣兒不像是沒福壽的我先前真是老糊塗了賈母忍住了淚說道千丈的樹枝子落葉歸根既然你嬸娘接你回家也了我一樁心事留你多住幾天白不中用你這會兒走了底下再想見你賈母說到這裏便咽住了聲半晌沒有言語黛玉此時雖已將前事盡付東流一無挂礙然想起多年依傍賈母從前疼愛光景離情別緒觸景交縈禁不住珠淚瑩瑩相感而滴向賈母道外孫女兒蒙老太太豢養之恩飲食藥餌撫育扶持無微不至真是昊天罔極如今這場大病回了過來何以仰慰慈懷外孫女兒回家惟有在菩薩面前朝夕焚香禮拜保佑老祖宗福壽康寧長恬蔗境享受滿門團聚之樂勝似外孫女兒常依膝下說著便倒在賈母懷裏哽咽了一回再說鳳姐趕到寶玉屋裏正見寶玉換好衣服手裏拿著一卷紙要往園子裏去寶釵同襲人兩個抵死相勸只是不聽鳳姐一到硬把寶玉拉住道寶兄弟你聽著寶姊姊的話不錯老太太同太太怎麽和你說話你還是這樣老太太知道是不依你的寶玉道老太太太太不過爲我病著不叫出門如今我的病已大好了叫我盡著住在屋子裏只怕我的病倒還要發呢你們這班人也太狠心了林妹妹病的時候不叫我去看看如今他死了好幾個月我要去燒一張紙也不叫去你們不知道我有滿肚子的委曲須得撫棺大哭一場嘔出我的心來就用我的眼淚把我的心洗乾淨了放在林妹妹棺材裏也算了結這件事了好叫各人去幹各人的正經我今兒到瀟湘館去了一趟以後再去憑你們剁我的腳也使得鳳姐們聽了寶玉說的又是瘋話怕他舊病復發正急得沒法兒見平兒又喘籲籲地趕到在鳳姐耳邊不敢提林姑娘三個字恐被寶玉聽見只說那一個已在老太太屋裏怕就要過這裏來呢鳳姐不等平兒說完忙和襲人道我把寶玉交給你們我要去幹我的事了一面回身就走口中道好歹只爭這一刻兒工夫撞破了可再沒廝羅了趕忙走進賈母院中見王夫人已先在那裏李紈等衆姊妹正送黛玉出來賈母淚眼汪汪一隻手搭住鴛鴦站在台基上黛玉又回轉身去辭了賈母對王夫人道甥女要過舅母那邊去磕頭還要到風姊姊屋裏去謝謝王夫人道在這裏見了面就算了鳳姐介面道妹妹竟聽太太的話就是了給妹妹揀的好時辰起身這會兒也不早了我請太太的示下派了一房家人媳婦還同兩個老媽子路上伺候雇了四輛大車妹妹就坐我的轎車子走長路套個四六擋也就使得到王家營後換船已打發前站先去預備停當的了黛玉便與王夫人鳳姐行禮道謝心頭想起一事斂攝戚容微露笑臉對王夫人道二哥哥有好幾個月沒見面甥女也爲病著才好沒有過去聽說二哥哥的身子還不大好咱們相聚多年今兒回家理該過去辭辭連二哥哥同寶姊姊大喜的事甥女兒也沒和他們道過喜今兒打總兒去走了一趟也算盡了我的禮了王夫人聽了一時無言可答鳳姐忙介面道我剛在寶兄弟屋裏來他還睡著寶妹妹也因感冒了不能出來送你妹妹也不用過去我替妹妹說到就是了黛玉本心並非一定要見寶玉夫婦今因鳳姐姐止便應道既是這麽鳳姊姊替我致意別忘了鳳姐答應心頭才定同著李紈紋綺湘岫迎探惜姊妹一徑送黛玉至垂花門前隨後鴛鴦平兒也趕了來此時垂花門內站著奶奶姑娘及丫頭媳婦老婆子們黑鴉鴉擠了一大群垂花門外一溜兒站的年輕小廝候著磕頭謝賞風姐到了垂花門轉身就回李紈等等黛玉上了車各人灑淚而別岫煙先回園去李紈瞧出賈母心事仍邀衆姊妹至賈母處熱鬧鳳姐先進賈母屋裏見賈母閉著眼歪在炕上一個小丫頭在身後捶背王夫人站在旁邊默默無言停了一會賈母歎口氣道你們頭裏說林丫頭和寶玉兩個人彼此存些私念他們的病都是爲此或者他們兩個從小在一堆兒玩慣的分外親熱一點子也是他們正經情分你們瞧林丫頭今兒的光景若講有什麽別的心迹再別委曲了他林丫頭果然有別的意思如今知道寶玉娶了寶丫頭他提起寶玉來還是這個樣兒嗎鳳姐臉漲通紅與王夫人面面相覷鴛鴦笑道當真林姑娘比先前改了樣兒了我瞧著他滿臉福氣那都仗著老祖宗福庇呢賈母搖搖頭道那裏是我的福庇剛才當著林丫頭我不好提這句話沒的惹他淌淚抹眼的想我只有一個女兒遠遠的嫁了誰料他命苦生了一個女孩兒自己早就死了我也爲可憐他的娘接了林丫頭來住了幾年早知道是這樣先前別去接他來倒也罷了林丫頭今兒這一走別再想見他的面了此時王夫人與鳳姐俱看出賈母心事坐立難安不敢開口然又不能不勸慰賈母幾句鳳姐勉強陪笑道林妹妹的嬸娘疼顧他自然要替林妹妹訪定一門子好親事爲官作宦的內外升轉不定或者一兩年裏頭林妹妹就進京來給老祖宗請安那時候老祖宗瞧見才歡喜呢賈母聽了點點頭半晌才說道如今只要寶玉的病好別的事都不用提了又向湘雲道你們今兒都在這裏吃飯陪我抹個牌兒解解悶鳳姐見賈母顔色稍霽搭趁著便吩咐姑娘們的飯都送到老太太屋裏來一時王夫人鳳姐伺候賈母用過飯李紈探春湘雲陪賈母抹點子牌李紋李綺迎春拉了琥珀一桌子打天九賈母見王夫人鳳姐還站著便說你們也該回去吃飯了於是王夫人鳳姐才退了出去這裏鴛鴦坐在賈母背後與賈母洗牌鬥了一轉莊賈母手氣不好揭不起大牌鴛鴦因賈母今兒心上不樂想法兒要叫賈母開開心這一牌輪著賈母做莊鴛鴦趁桌子上算帳的空兒一手摣起牌來疊了一副把牌做個雀口攤在桌上湊巧李紈坐在賈母對面鴛鴦遞了個眼色李紈開了牌賈母第一張摣起接連起了六張天牌賈母便喜笑顔開道這副可要贏你們幾個錢了問文總武總這兩張牌你們誰揭了快放下來李紈道我們都沒有摣呢鴛鴦笑道大奶奶發急也不中用快搖將罷再別搖個六出來就好李紈道我要瞧老祖宗補了牌再搖誰知賈母伸手第一張就補了文總接著又補了一張文武總賈母更樂的了不得衆人睜著眼瞧李紈搖將偏又搖了兩隻六湘雲拍手道這可樂不得鴛鴦道這一牌是開足的了算也不用算得三十二萬七千六百八十副老祖宗再抹一百年牌也難得碰見這一副一面和素雲取笑道快給奶奶扛錢去園子裏來回要跑得你腿酸呢賈母道今兒偏偏鳳丫頭被他逃脫了我知道他們沒有這許多現錢擱著咱們散了場再記帳罷不說這裏賈母十分歡喜要知鳳姐出去怎樣光景下回分解
