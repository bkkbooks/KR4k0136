body:
  text: 第十三回太虛境遣邀薛蘅蕪紫檀堡補敘烈晴雯話說寶釵臨終抱恨直呼寶玉之名霎時間已魂離軀殼似在夢裏一般見有三個人笑臉迎上寶釵向他們端詳一會那一個便開口道嬸子是不認得我的我便是東府裏蓉兒媳婦又指著那兩個道這是我尤家二姨就是璉二叔叔娶的二房嬸子這是尤家三姨寶釵道怪道都有些面熟輕易不進咱們園子裏來逛逛不在一堆兒廝混所以生分了秦氏道今兒我和二姨三姨來接嬸子順便進園子裏去走走寶釵道正是我也多時沒到園子裏今兒打夥兒去散散心也好當下出了院門寶釵隨了秦氏等徑往大觀園來各處看了看道今兒有客怎麽園子裏這班姊妹們倒躲的不見影兒了說著到了蘅蕪苑寶釵便嗔上夜的老婆子不經心又道屋子是要人住的你看我離這裏不久就糟蹋的不像樣兒了一時轉了出來迤邐走近瀟湘館只見許多挑夫絡繹不絕挑的都是銀鞘前後左右亂堆在地寶釵驚異道聽見璉二嫂子只嚷著饑荒打不開現放著的這些東西做什麽呢秦氏笑道銀子可不少這會兒不能叫璉二嬸子拿去打饑荒寶釵道銀子進來咱們園子裏便是咱們府裏的東西了現在太太這裏辦事有什麽使不得呢秦氏微笑不語話未了已到瀟湘館門前寶釵似忘了黛玉已回家去生前之事都已渺茫拉了尤二姐道咱們進去鬧了林丫頭秦氏介面道林姑娘這會兒也不在家裏咱們別耽誤了正經事快走罷寶釵又問尤二姐道這幾時沒聽說鳳姊姊吵鬧可和姊姊是好了呢尤二姐眼圈兒一紅道我們都是沒造化的走得早了要熬煎得一兩年承望托了人家的福也得過些好日子呢話未完尤三姐把他釘了一眼道姊姊這會兒和寶妹妹講這些有要沒緊的話怎的秦氏一面笑著把話岔開徑往前走不覺已到園外遠遠望見一所高大門第門前車馬喧闐甚是顯赫寶釵指著問道這是那一家勢派也不小秦氏笑道這就是嬸子的家裏寶釵道你別胡說正經我家裏在南京那又摸到這個地方來了說話間過了熱鬧地場已行至鄉村見一座小小結構的院宇門戶煥然秦氏向尤二姐指道這就是襲人的對頭家裏如今可不是他歸結的所在了還要來住幾天是免不了的尤三姐聽說道你們真愛講個閒話不怕寶妹妹聽了嫌煩說著轉過樹林又見一院莊農人家門前站立個人寶釵定晴一看認准是晴雯便招手喚他過來晴雯佯然不理反轉身向屋門裏走了進去寶釵生氣道難道他不是晴雯怎麽叫他也不理到底要喚他出來問個明白秦氏道他已不是咱們這一路的人嬸子別去理他走咱們的路罷寶釵往四野裏一瞧便著急道正是跟你們走了半天怎麽走到這荒村野地來了到底是要到那裏去呢秦氏道我們引嬸子到來的地方去寶釵道來的是這條路我不去回身便走秦氏忙上前扯住道嬸子愛去也要去不愛去也要去可由不得嬸子呢尤三姐笑道寶妹妹別理他我告訴你聽我們去得的地方諒來你也去得的寶釵意欲回身轉去又無同伴只得隨著衆人便道今兒偏不帶一個人出來叫誰去套輛車來才好尤三姐介面道我知道寶妹妹走乏了便向腰間掣出鴛鴦劍一柄向地上一指霎時起青雲四朵一同踩雲飛起徑往太虛幻境書不細表且說寶釵所見的睛雯畢竟是鬼是人是真是假如不急于表明閱者頗費猜疑原來晴雯被王夫人攆出病在他姑舅表兄吳貴家裏寶玉去看了他一會悲痛五中鳴咽至三更昏沈暈去一靈出殼徑進大觀園怡紅院內依依不捨這裏吳貴的女人因日間和寶玉調情未遂其願一夜不能安睡等至天色微明往柴房走動見晴雯僵臥席上只餘殘喘便著緊叫他男人起來那吳貴本是一個有名的醉泥鰍糊塗到十分的也認做他已死趕緊的往裏頭領了賞項買了一口單薄不堪的棺材雇人往家裏一擡多餘的銀兩留著自己吃喝花用不管死活把晴雯往棺裏一撩就是隨身這兩件衣服也沒裝裹所有衣飾被褥並襲人打發人送出去的包袱銀錢等物吳貴的女人盡淨收拾掇在自己箱裏因吳貴有一叔子老兩口在離城十五裏紫檀堡地方務農爲生吳貴知他叔子空地上可以停放棺柩自己先到叔子家裏告訴了話同著來到地頭指點一塊空地停放吳貴回到家裏因裏頭吩咐出來說是害女兒癆死的把屍棺就燒化了吳貴便雇人把棺柩擡往城外化人廠相離吳貴叔子的地頭不遠正擡著走時聽見棺材裏面叫喚起來嚇得衆人連忙放下也不去通知吳貴各自走散及至吳貴夫婦同至化人廠一送只見廠裏正在焚化屍棺吳貴不問皂白兩口子看了一看便自回家又怕他叔子查問晴雯遺物著落他做些功德道場便絕腳不到他叔子家裏去走了這裏吳媽向來最疼愛他外甥女兒的自從晴雯的老子把他女兒賣給賴家賴大家裏把晴雯孝敬了賈母後來又派去伺候了寶玉多年沒有見面吳媽時常記挂今聽說他外甥女兒死了把棺柩擡來停放地頭吳媽叫他男人去買了些紙錢做了一桌羹飯裝在籃子裏提到路上見放著一口屍棺也沒擡到地裏好好停放吳貴也不見想來就是他甥女兒在裏頭止不住傷心哭了幾聲苦命的女兒只聽得棺內應聲道我還沒死呢那吳媽連忙住哭細瞧棺材板片朽薄裂的有二三分縫便問你當真不死嗎裏頭應道正是吳媽趕忙回家告訴他男人拿了斧子鐵鍬趕到棺邊細聽了個真便把棺蓋撬開見晴雯臉上雖帶病容氣色甚正兩口子把晴雯扶起坐在棺內恰有吳家鄰居幾個人剛才聽見吳媽的話當作一件奇事一擁而來吳媽叫一個人快去拿了一只筐籃同扁擔繩索前來吳媽抱起晴雯裝在筐籃裏面就央看的人擡回家裏臥於炕上給他飲些米湯連忙延醫診治過了幾日晴雯見他舅母看待甚好比在吳貴家裏大不相同自知死而復生恍同兩世自己也平心和氣的調養身子把種種氣苦淨盡丟開飯食亦漸漸加增不到一月病已全愈吳媽又替另收拾一間乾淨屋子出來給他居住晴雯因自己一無所有衣食用度都是他舅舅家裏供給心上不安叫他舅舅去吳貴家裏討取銀錢衣物回來幫補他舅舅倒是一個正經務農的人平日瞧他侄子不上眼後來娶了侄媳婦又見是一個歪貨總不許他們上門聽見晴雯要去討他的東西便道甥女兒雖是你的東西放在他家這一個來月已不知鼓搗到那裏去了你那一個嫂子最是眼小的趁你病著順風吹火兒藏的藏變的變貓嘴裏挖鰍不去討倒省些氣瞧你舅母將近五十歲的人了只有你四五歲一個小兄弟粗布衣服是夠你們穿的粗茶淡飯也餓不了你們聽你舅母說起來你也不想進裏頭去的了安心住在這裏底下我給你留心知道你莊家粗活是做不上來的也不要你動手有的針線活計幫著你舅母做做也隨你的便一番話說的晴雯十分感激住在吳家倒也算得個絕處逢生的地場他舅母又引著到前後各處瞧了瞧鄉村風景道你舅舅真是全靠兩隻手做這分人家來一天那有半刻閑的工夫一清早就背了筐子出去拾糞數九天凍的手上開了裂暑伏天鎮日家毒日頭地裏曬著懷裏揣著兩個穀面饃饃也當了一頓飯空閒的時候還趕著兩個毛驢子煤窯上去駝炭掙他一百八十我也幫著你舅舅熬個三更半夜紡花織布怕花錢買燈油趁著月明地裏做活如今都熬出來了靠著老天爺幾年好收成打的糧食吃不了地頭上瓜茄蔬菜都現成那一樣要花錢買的你看屋子也蓋好了上好地置了八九十畝家裏黃牛喂了兩三條自耕自種就添上一個甥女兒也吃不窮你家舅舅我知道甥女兒是在裏頭吃慣好的愛吃什麽儘管和我說也別替你家舅舅省錢太委曲了你晴雯聽了越發歡喜有時到屋後園子裏逛逛見一帶疏籬幾叢翠竹屋旁又有十余株梅李疏密相間觸景縈懷不禁神往大觀園內想無端被太太盛怒攆逐定有人在太太跟前進了讒言雖然我在裏頭性子未免躁烈一點結怨的不少但沒有這個人在太太跟前敢說話就是太太也未必相信他十分我猜起來除了他再沒第二個人我到底害了他什麽路不想我和你都是老太太派給寶玉的人你是已經夠分兒的了再巴結你的不好何苦來暗箭傷人我今番死不了倒要睜開兩隻眼看他別碰在我手裏任憑你做了寶奶奶寶太太肉也要咬他一塊下來的又瞧著貼身穿的襖子感念寶玉多情倘知道我還沒有死寄住在這裏定要變法兒叫我進去太太如何肯依萬一翻騰起來有許多不便園裏姑娘們這些坑兒卡兒已夠他照管了擱得住再分一條心到我身上來可還有吃飯念書的工夫嗎橫豎人家都知道我已經死的了前兒聽這裏舅舅說起來他侄兒兩口子也不上門的我再叮囑舅舅舅母竟把我住在這裏這一節事別告訴人家便好把寶玉瞞住消停一年半載再看機會是正經晴雯打定主意每日靜坐無事做些活計倒可添補自己零星動用約過一年之後忽一日有人來與晴雯說媒他舅母便歡天喜地的來告訴晴雯晴雯一聞此言便嚇得目定口呆心頭暗暗盤算自己爹娘已經亡過推不到爹媽身上去作主要說裏頭許配的了又不便憑空捏出一個人來若說不願出嫁又怕他們動疑也不像一句話總想不出回覆他們的話來一時神思慌亂惟有臉漲通紅悄默聲兒跑到自己屋裏躺倒炕上納悶吳媽還解不開晴雯的意思只道女孩兒家聽了提親的話臉上害臊所以走了便和男人商量作主竟把親事允了因先前問過晴雯的年庚吳媽記得告訴了他男人一面去央一位村館先生寫了八字回來停了兩天媒人來袖了庚帖送去講定天婚不用占卜就擇吉行聘那一天端送盤盒所有金珠首飾細緞綾紗以及喜茶喜果羊酒米麵極其豐盛一面端整酒席款待媒人吳媽將聘禮逐一檢點都是耀眼增光鮮明璀璨料他甥女見了沒有不歡喜的自己守著這些東西便叫他五六歲這個孩子去給姊姊道喜叫姊姊出來瞧瞧晴雯出來一看已明白八九此時再不能隱忍便道甥女兒蒙救命大恩又養活了一年多真是天高地厚同親生爹媽一般凡事原該聽舅舅舅母作主但女孩兒終身大事也要出於自己情願怎麽舅舅就幹得這樣冒失不如趁早把這些東西退還了人家是正經吳媽聽了摸不著晴雯的心事便道這一門子親數他人材是第一等家裏也很勢派來往的都是官宦講到吃的穿的比你舅舅家裏強幾十倍呢他家也就住在這堡子裏相離不過兩三裏路底裏都知道的如今央的媒人就算咱們堡子裏一家大富戶捐的官職叫什麽挂線米桶算起來沒有一件不稱姑娘的心所以前兒我和姑娘說了就叫你舅舅作主許了他家把姑娘的年庚開了去人家也不合婚看了今兒好日子送過聘禮來姑娘你瞧姑娘在榮府裏頭住的日子久自然見識過這些好東西若說莊農人家一輩子沒有見過眼我就看了件件有趣可愛沒有一樣叫得出他名兒呢晴雯不等吳媽說完臉已氣白幾乎要把這些東西踩的踩摔的摔發出舊時在怡紅院的性子來又想他舅舅舅母一年以來豢養恩深此事原是他們的好意不過鄉里人辦事粗率本來自己隱情從未吐露他們如何得知於是又縮住了手回到房中自歎薄命心坎上雖丟不下寶玉但現在內外隔絕將來能否進府尚在水中撈月偏又碰出這樣意外之事不如早早尋死一了百了一面鬆開外衣把換穿寶玉的襖子翻覆細看怔怔的發了一會呆止不住淚點淋漓襟子上早濕透了一塊當下主意已決掩了房門找了一條繩子踩上炕沿一手把繩頭穿在梁上縛做了個活套把脖子套入裏面兩腳一蹬離炕兩手直垂下來霎時咽喉氣閉魂魄離身見一白髮老者將手中拐杖架格縊繩倒身跪地將手亂搖晴雯不解其意不多一會早有他舅母推門進內瞥見驚喊叫了鄰居女人幫同解下灌救蘇醒這一嚷連堂屋內坐的媒人也吃驚不小細細問明緣由怕打威逼人命官司情願收回原聘禮物送還原庚八字一場掃興而散再講晴雯恍惚記起上吊時所見之人明明像是土地大有古怪或者將來和寶玉還有相見之日不該如此結果於是轉悲爲喜反向他舅舅舅母跟前去賠不是說甥女兒年輕性執一時短見累你們老人家受驚別怪甥女兒將來總要報答舅舅舅母的大恩呢隱約其詞說了幾句話吳家夫婦好言相慰自此再不提議親一事晴雯相安度日此是補敘前事交代清楚不表且說花自芳的女人那一日見襲人話不投機一場沒趣回到家裏把襲人的話都告訴了他男人花自芳道我確確實實打聽的寶二爺是不回家定的了他死守在裏頭算什麽呢既是叫你去回太太或因他自己開不出口來你過幾天去找太太的陪房周奶奶煩他在太太跟前方便一聲兒候太太怎麽樣示下當下正接著寶釵的喪事裏頭忙亂把這件事擱起那邊媒人連次到花自芳家方信沒奈何催他女人去走一趟花家的趕著吃了飯出門徑往榮府後街門一直進院來到周瑞家裏告訴這話周瑞家的滿口擔承道嬸子你坐在我家裏老等太太允不允我總出來回你個准信一時周瑞家的進去回了花家的話王夫人想起寶釵在病中也曾提過這件事便道襲人這個人我早瞧起他的如今寶玉這下流東西自己沒造化顛顛倒倒幹出這樣事來已經坑死了一個寶丫頭何苦再把人家女孩兒委屈他一輩子既然他哥子有這句話很好明兒就叫他家去當下吩咐玉釧去和璉二奶奶說寶姑娘屋裏的東西前兒二奶奶已經手封鎖了鑰匙在他那裏叫他自己過去或是打發平兒去把寶姑娘的衣服首飾多拿幾件賞給襲人外頭的例賞也就給了他替我另再給他幾兩銀子一面又叫周瑞家的去告訴襲人一聲那周瑞家的自去和襲人說明了王夫人的話就出來覆了花自芳的女人且講玉釧聽了王夫人吩咐來和鳳姐說了鳳姐歎口氣道死的死嫁的嫁都是寶玉自己鬧出來的事井坍連屋倒怎麽這兩三個月裏咱們家裏的運氣就敗壞到這個地步又問玉釧道這件事到底是襲人自己要出去呢怎麽樣平兒在旁介面道奶奶倒說的發笑怎麽他自己要出去呢頭裏寶姑娘病的時候就恍惚聽見花自芳的女人進來過一趟在襲人屋裏咕唧了半天碰了釘子出去的如今不知太太怎麽又知道了一面笑問玉釧道太太這會兒怎麽忽然要打發他出去玉釧道剛才周大娘來回太太說花自芳的女人央他來求太太的恩典太太一口應許道已經坑死了一個再別委曲人家女孩兒就叫我來告訴奶奶呢鳳姐聽到坑死一個的話一陣心酸頓時兩眼發眩便叫平兒你帶了鑰匙和玉釧同去依著太太的吩咐把東西拾掇出來拿去請太太過一過目再給他說畢就躺在炕上叫一個小丫頭跪到炕沿邊和他揉胸口平兒和玉釧自去拿了東西送與王夫人看了平兒和襲人素來本好今日假公濟私自然只揀好的拿出王夫人還說這些東西留著看了酸不如再多給幾件子如今就是那麽著罷又叫玉釧兌了四十兩銀子同衣包首飾叫一個老婆子拿了平兒仍拉著玉釧廝跟到襲人屋裏見他一個人呆呆的坐在炕沿上眼圈兒已哭得通紅襲人見他們進去忙起身讓坐三個人本是平日最投脾氣無話不說的及至此時明知襲人勉強走了這條路恭喜他又不是勸慰他又不是開口一著形迹反像譏誚他似的襲人一見他們亦覺靦腆局促彼此無話平兒只得叫老婆子打開包袱匣子逐一檢點交代清楚各自推故走了襲人想太太賞給這些東西主子的恩典益重未免悲苦益深一件件知是寶釵遺物觸目傷心寶釵何在寶玉何方我這一個人從此出了榮府也似有若無的了襲人想到傷心之處萬縷愁思回腸百折連身子都晃晃蕩蕩如做夢一般這一夜整整的哭到天明沒奈何掙扎起來鳳姐那邊正打發小紅過來未知小紅何事再看下回分解
