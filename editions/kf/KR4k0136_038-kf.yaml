body:
  text: 第三十八回以情感襲婉語勸晴設法制環正言索彩話說賈璉托了王爾調詹光到張家與寶玉說媒回來賈璉忙至書房先陪笑致謝道勞駕了張大老爺可允了沒有王爾調搖首道難說難說這頭姻事先前原與令叔大人提過因張大老爺要招贅過去所以沒有說成後來人家求親的卻也不少老世台想都是富貴門第誰願意把哥兒送到別人家去做女婿呢蹉跎下來張大老爺也漸漸冷了這個贅婿的念頭前月貴本家雨村先生轉了內任進京就與南京甄大人的公郎乳名也叫寶玉說媒要迎娶過去的張大老爺口允還未出帖放定如今這位小姐病故可巧有薛府上令表妹借體還了陽知道薛府這位小姐已于歸尊府雨村先生的話只可中止今兒小弟同詹兄去說府上求親的話揣度張大老爺的光景也願結這門親事就聽他口氣似乎有一件作難因現在寶二爺已有正配他家又與府上聯了姻這位小姐性靈雖失體質尚存終算張家嫁出來的女兒到府上做個二房這名分上難免旁人誹謗小弟回他說兩家都是閥閱門第再沒有人議到這上頭的況且形質是塊然無知之物不能不隨性靈爲轉移幸喜令媛千金生前不曾受聘捨身歸於榮府兩全其美即或已受甄府之聘也只可棄彼就此難道竟當作尊府千金嫁到甄府去嗎張大老爺聽了小弟們的話終是躊躇倒叫小弟與詹兄到府上商酌停妥了再去回覆他小弟想出個法兒不如請寶二爺奏上一本恭候聖裁何如賈璉笑道使不得皇上一日萬幾怎好爲寶兄弟的婚姻瑣事上瀆宸聰再者借屍一節未免涉於荒誕豈可登之章疏詹光道可不是老世台的高見借屍還陽原是有此事無此理的所以律例婚姻門內並不載此條應作何判斷之處比如趙家的閨女已嫁錢家死了有孫家的媳婦借他的屍身還了陽趙家的女兒該斷歸那一家才是這些事只可私下酌經行權隨機應變辦去如今妙在張府千金未曾受聘總無不可商辦的了賈璉道二公不知林氏舍弟婦胸中頗有經緯可算個巾幗丈夫與亡故的薛氏弟婦他們從幼在一處相聚的好姊妹我就把張家這一番話叫內人去告訴了弟婦他們自然有個公正堂皇的議論出來我來告知再勞二位的駕去走一趟就是了當下賈璉回到自己屋裏見了鳳姐把媒人的話細細講明叫風姐過去與林妹妹商量風姐道姨媽也在瀟湘館裏要聽張家的信今兒晚了明兒早上過去當著姨媽的面和林妹妹說看他出什麽主意你不用去見老太太明兒得了林妹妹的話再講罷一宵易過到了次日鳳姐一早便至瀟湘館薛姨媽同黛玉都已起來在一處敍談鳳姐將賈璉的話照樣講了一遍又道姨媽家的寶妹妹倒要姓張的做起主來你們聽聽好笑不好笑薛姨媽道聽這樣說起來他們還不允呢叫璉哥兒到張家說去再要作難講出這樣不中聽的話來我把這條老命拚了他黛玉道媽媽也不必生氣這件事有什麽難處的就是張家太過慮了若講娶他家的女兒來做二房不必姓張的不依名正言順還有媽媽在這裏該說幾句話呢我盼也盼不到寶姊姊有了這件喜事咱們多年的好姊妹難道還爭這些不要說張家的姑娘與寶姊姊同庚的比我大就比我小我還要叫他姊姊呢咱們照前姊妹稱呼分得出什麽大房二房來薛姨媽聽了甚是歡喜鳳姐暗想寶玉聘娶林姑娘是在寶妹妹亡故之後況且又是欽賜完姻北靜王爲媒名分已定誰敢哼出別的話來這口角春鳳落得做個面子上人情也難得他自己肯講出這幾句話來只要哄得張家過把他女兒娶了過來就完了這件事了惟有晴雯在旁聽出一肚子火來道張家的人也太糊塗了不想自己的女兒沒壽咽出了這口氣不是寶姑娘借他還陽那副身體臭皮囊早就埋在土裏頭了還有這個人在世上嗎這會兒現成有了女婿也不用講到行聘迎親簡簡截截把寶姑娘送了來就完結了黛玉道晴雯的說話也是情理鳳姐笑道再不用嚕嗦央媒作伐他可以沖得蘇州南濠街上打巷奪埠的孫娘娘坐了一輛車子到張家去把寶姑娘拉了回來罷黛玉道別再瞎說了正經鳳姊姊去告訴璉二哥快央媒人去說吉期選近些省得寶姊姊在人家難過日子鳳姐道寶妹妹在張家他們也似親生女兒疼愛他的倒沒有什麽難過黛玉道你那裏知道倒要不像親生女兒疼他猶如作客一般也過去了越像親生女兒這樣待他這個日子等寶姊姊來問他就知道這個味兒了鳳姐聽說就出了瀟湘館把黛玉的話先去告訴了王夫人便與賈璉說知仍托王爾調詹光再到張家去說這裏黛玉留住薛姨媽寶玉也知張小姐容貌與寶釵無二十分歡慰這一天因同年相好送到知單醵分只得換了衣服出去應酬薛姨媽往王夫人處閒話去了黛玉一個人在自己屋裏與紫鵑談論寶釵之事清音班裏女孩子送了兩盤蘋果來黛玉叫收了雪雁包了賞封打發了來的人晴雯過來見了喜歡道咱們園子裏的沒有這樣大可是外頭買的嗎黛玉道我又不愛吃這些東西那裏還去買他是清音班裏送來的又是個抽豐局不知看相我什麽東西呢你愛吃分一盤子過去湃在涼水裏你慢慢吃罷雪雁便隨手拿了那個紐絲瑪瑙盆子滿滿的裝了一盆遞給老婆子送到怡紅院去晴雯見了道姑娘賞我蘋果不拘裝在那裏就好可惜這個盆子他們不小心失手打碎了可惜黛玉道孤零零這一個也不成件器皿晴雯道本來一樣的兩個因是二爺送史大姑娘東西連這盆子留在那裏了掉這一個到如今還沒有碰說著又笑道提起二爺送東西又記起那年碧痕一件故事來了二爺折了園子裏才開的桂花插在聯珠瓶裏打發碧痕送到太太屋裏去太太正在開箱子收拾衣服賞了他一件樂得什麽樣似的我笑他說人家得了多少好的剩下來給你這一件也算不得有臉紫鵑問道給了誰剩下來的晴雯冷笑道那時候的紅人兒還有誰呢紫鵑便知道他說的是襲人便道他出去太太還把寶姑娘的衣服給了他好幾十件呢晴雯道那是太太給他陪嫁的更不希罕黛玉聽了便向晴雯道提起襲人有一件事要勸你前兒這幾天二爺的心事你也瞧出來了接著有了寶姑娘的信才又分了心去底下寶姑娘來了二爺不稱心的事再沒別的就只在襲人身上咱們何不越發成全了他晴雯半晌不語道這蹄子使壞心擺佈人家不用說就是他欺壓二爺的語也太過分了黛玉問說什麽話晴雯道姑娘不知道我明明聽見他妝妖作媚說要出去二爺好意留他倒說強盜賊也跟他一輩子嗎誰料二爺不過出門了兩個月還沒爲匪他不願意跟強盜賊倒去做唱戲的老婆果然比做強盜賊的高貴些如今二爺回來了做了官他又想進來做現成的姨奶奶敢仔體面呢黛玉笑道我的說話不過是爲二爺總不肯撩開這個人何苦看他們熬著至於襲人的身分進來不進來已是這樣定的了將來你瞧他可還是先前這樣有臉嗎晴雯道姑娘既然開恩不計較他的壞處難道我倒不容他進來黛玉道不是說你不容我有幾句話告訴你你不懂史鑒上的事古來惟真英雄真才子才有人殺他咱們雖不敢高比總是一個樣兒的情理你想麝月秋紋這班人都是你們一個屋子裏住的他偏要算計你可見他心眼裏瞧得起的沒有第三個還有一說當日太太沒有攆你後來他即便想走怕你笑話他或是你把他激勸一番襲人不走也論不定到如今他還是他你還是你那裏顯得出你們兩個的好歹來偏偏攆了你就走了他再沒那麽報應昭彰的了勸你消釋了頭裏的氣等他進來再沒提起前事也斷不可刻薄他一言半語咱們待他到十二分好正叫他愧悔到二十四分比奚落他還難受呢正說著見鴛鴦掀簾進來黛玉起身讓坐鴛鴦坐下不住的扇道大伏天已經過了還是那麽熱到底姑娘這屋子裏鴛鴦才叫了姑娘忙改口叫奶奶道我們向來叫姑娘慣了一時竟拗不過口來笑著又說道奶奶這屋子裏外面有這些竹子遮得窗上陰陰的比別處涼快的多黛玉道這毒日頭地下有什麽事這會兒跑來鴛鴦道老太太性急那一家子還沒允出口來趕緊要收拾新屋子叫我到蘅蕪苑去看有要修葺的地方和璉二奶奶說快叫人收拾我各處看了看都是好好的屋子只要裱糊出來就是了咱們倒等著要瞧瞧這一位張家的姑娘像寶姑娘不像真是一件希奇事紫鵑道碰著咱們二爺的事再沒有不希奇的先前娶寶姑娘說娶的是林姑娘如今娶的明明是張家姑娘又是寶姑娘越發連旁人都要攪昏了黛玉向鴛鴦笑道你別聽他的話正經我問你要件東西不知老太太那裏還有沒有那一年老太太給我的軟煙羅糊在窗子上映著外面竹子的顔色果然好看如今再找不出這樣紗來鴛鴦道那是璉二奶奶在庫上找出來的怕沒有了我再到老太太箱子裏找去如有便叫人送過來說著起身要走黛玉道忙什麽你瞧太陽還沒下去坐在這裏涼快涼快不好鴛鴦道老太太還等著我問話呢一時鴛鴦出了瀟湘館接著寶玉回來一疊連聲的叫熱紫鵑晴雯兩個人連忙過去與他脫了衣服靴子換上涼鞋叫小丫頭去取了涼水湃的西瓜來剖開筌了一碗插上銀叉子晴雯托在手裏一塊一塊的叉與寶玉吃了幾塊說夠了黛玉便問那一家有什麽喜事派了多少分子寶玉道有個同年因路遠沒有去接家眷有幾個朋友慫恿他買了一個人派公分賀喜唱戲那買的人我也見來了好模樣兒隨指著晴雯道同他不爭什麽晴雯紅了臉二爺如今越發愛說什麽就說什麽知道了買的什麽人混比起來一扭頭便回怡紅院去了黛玉笑道要去看了別人家的人一句話倒惹惱了自己屋裏的人了寶玉道我說過的就是他難說話要惱由他惱去罷了黛玉道咱們如今講正經話你的心上人早些弄了他進來才好寶玉怔了一怔道你說的可是寶姊姊嗎黛玉歎口氣道你講的話好沒忖量難道是寶姊姊我好講這句話別怪晴雯惱你寶玉道我還有什麽心上人黛玉道別假裝糊塗你第二回要做和尚的人難道就忘了寶玉記起前言黛玉所說的明是襲人想前兒去看他林妹妹已知道的了便乘機進言道我也不是要瞞妹妹因他現在病著不能進來知道妹妹是肯寬恕他的就是晴雯這張嘴肯讓人家一句嗎那一個進來了不是揭他的短便壓派他頭裏許多不是襲人是失時退運的人了擱不住晴雯的磨折怕倒把妹妹的好意辜負了黛玉道論理晴雯說他幾句也是該的如今我已苦苦勸過晴雯包管襲人進來再不欺壓他你放心寶玉便向黛玉連連作揖道謝謝大賢大德的奶奶黛玉見寶玉當著丫頭們在跟前這個樣兒臉上微紅帶笑啐了一口轉身自去賞玩擺的蘭花寶玉記起襖子忙回怡紅院去查問知晴雯已經收到又將指甲交與他自己藏好這裏黛玉正要到王夫人處探聽張家親事只聽得廊下站的老婆子道姨太太二奶奶來了一語未了鳳姐帶笑一路嚷進來道虧了林妹妹幾句話張家就滿口應承了當下坐定把媒人回來張家允親的話說了一遍又說他們的妝奩都備現成倒叫咱們日子看早些黛玉問回過太太沒有鳳姐道老太太太太處都已回過姨媽也在老太太屋裏聽見的老太太叫外頭去選日子要越早越好這幾天裏頭咱們先送聘過去我已叫人收拾蘅蕪苑屋子了鳳姐坐了一坐起身就走薛姨媽與黛玉各各歡喜過了一夜薛姨媽自回家去刑岫煙知薛姨媽去了不時與湘雲探春姊妹至瀟湘館閑坐談論寶釵之事都稱奇異盼望過門迎娶相敘寶玉知道張家姻事已成黛玉又許他叫襲人進來件件遂心十分樂意一日黛玉瞞了寶玉叫裝了兩提盒點心果子就命前日送襖子這一個老婆子去看襲人叫他好好調養病好了回明太太就叫他進去又告訴他寶姑娘已經借體還陽張家許親之事老婆子到了襲人家裏說明是寶二奶奶叫送去的又把黛玉吩咐的話一一說了襲人呆呆的想了一會感激黛玉愧悔無地老婆子臨走時說不出一個謝字惟有兩眼流淚而已老婆子回來把這些形景回明紫鵑紫鵑轉把老婆子的話告訴了黛玉道襲人這東西真不知好歹姑娘這樣待他也不知道感激姑娘叫老婆子回來謝謝不知還哭他的什麽黛玉點頭道你說他不知好歹這就是我對晴雯說的話你不知他心裏正悔的怎麽樣不好過呢話未完見寶玉進來兩個人便住了口寶玉問道你們講些什麽我是聽不得的黛玉笑道偏不叫你聽一語未了只聽平兒在簾子外問道奶奶在家裏嗎寶玉笑應道在家裏呢姊姊進來一面平兒走進里間黛玉忙起身拉他坐下平兒道我們奶奶要自己過來因爲太太那邊不知有什麽事過去了叫我過來回奶奶的話後兒放定迎娶日子揀的八月初五初三老太太生日過了寶二爺喜事接下去和奶奶商量還得請珍大奶奶過來幫幫呢黛玉道自然要請他過來的還有咱們的大奶奶平兒道頭裏娶寶姑娘同今年奶奶的喜事因大奶奶是個單身子人不大上前說起大奶奶也是可憐的瞧他在老太太跟前一般有說有笑我聽素雲說他奶奶陪蘭哥兒念書自己做些針黹淌著眼淚三更半夜的苦熬我替他算起來到那時候又要惦記蘭哥兒下場的事了寶玉聽說下場的話便記起趙姨娘之言說幸虧姊姊提醒了我今年是正科環兄弟該同蘭兒去走走便問平兒道你二爺在家沒有平兒道才同媒人王爾調商量什麽話在屋裏呢寶玉道我就托璉二哥給環兄弟捐監去說著趕忙出去了平兒道寶二爺還想環三爺同蘭哥兒下場這幾時環三爺在外邊鬧的越發不像樣了黛玉問環兄弟在外邊怎麽樣鬧呢平兒悄悄的說道我對奶奶講了且別去告訴太太這話也是二爺在外邊察聽回來和我奶奶說的如今本家這一班子年輕的爺們領了銀子去各自幹正經營生都習好了不肯同環三爺混鬧他偏又結識不相干的人日逐出外非賭即嫖勾引他的錦香院相與一個叫什麽雲兒被堆子上知道了要拿錦香院裏的人也怕吃官司叫環三爺跳後牆逃跑了還聽說趙姨娘的東西所有細軟金銀珠翠多被環三爺拿去鼓搗了好些出去趙姨娘又不敢嚷破私下與環三爺吵鬧不依呢黛玉又問三姑娘知道沒有平兒道誰告訴三姑娘這些話若三姑娘曉得了定要與趙姨娘淘氣我奶奶在太太跟前還瞞著呢黛玉道環兄弟年紀也不小了該早些給他定下一頭親才是平兒道我奶奶和二爺也提過二爺道環三爺的親事就難說差不多的人家攀不上咱們要是門戶相當的少不得打聽打聽哥兒誰家願意把女孩子許他呢黛玉道既然親事一時難定只好先尋一個妥當人給他放在屋子裏倒可以羈絆他些不至於常出去混鬧了平兒笑道講到裏頭的人怕願意跟他的就少除非是太太屋裏的彩雲估量我們奶奶是不肯在太太跟前說這句話的黛玉道不用你奶奶管帳我就和太太說去當下平兒回去把黛玉的話對鳳姐說了鳳姐說果然這樣辦成了也好怕做了太太討鴛鴦的故事要碰太大的釘子又問平兒道林姑娘到太太那裏去了沒有平兒道就要去呀鳳姐便借回別的事由頭過王夫人處探聽這事這裏黛玉來見王夫人先回明寶玉要環兄弟同蘭哥兒下場的話又提到親事上頭王夫人也是賈璉回過說起寶玉要與環兄弟捐監今科正場預備鄉試的話早已曉得今黛玉慢慢說到本題上來了指名直要彩雲給賈環做屋裏人王夫人素日聽的風言風語也有幾分知道賈環與彩雲有些勾勾搭搭的事今是黛玉來說便欲將情賣與黛玉面上沈吟了半晌道我不是捨不得一個丫頭環兒這個下流東西總不肯往上爬他娘又是一個湖塗蟲這會兒給他屋裏人雖然是個丫頭怕白糟蹋了人家女孩兒黛玉道太太慮的很是但凡物因材成器比如樗木堅鐵也要造作他一件器皿出來可以用得環兄弟年紀輕樹枝子從小壓趁這時候他肯收收心回頭轉來還不遲老爺又不在家太太那裏照顧得到所以我來求太太給他個人正是羈禁他並不是放縱他請太太裁奪王夫人道我想寶玉屋裏先前就有個襲人如今又有晴雯紫鵑環兒不給他一個顯見得環兒不是我養的人家說我有偏心況又是姑娘來說我也不好駁回不知彩雲願意不願意你們也得去問他一聲此時黛玉正與王夫人講話鳳姐也到了聽王夫人口風便介面順了黛玉的意思慫恿了王夫人幾句見彩去不在跟前便道我叫平兒去問彩雲當下回到自己屋裏笑對平兒道這件事我竟料不著剛才林姑娘的話太太倒應許了還怕彩雲不願意叫去問他你快找彩雲問去平兒道問也不用問得我替彩雲做主允了奶奶儘管回太太去鳳姐帶笑駡道扯你娘的騷你知道人家願意也要他自己牙縫裏落出句話來我去回了太太彩雲拿起腔來叫你去跟環老三平兒便笑著去找彩雲彩雲聽了平兒的話喜出望外平兒去與鳳姐說了鳳姐就去回明王夫人王夫人賞了彩雲幾件首飾衣服叫老婆子送到趙姨娘處說明此事趙姨娘也感謝不已一面鳳姐叫林之孝家的進來吩咐挑人補彩雲的缺過了幾日這一天賈環見了賈璉想要一溜過去賈璉叫住他道環兄弟別走有話對你說賈環只得站住了未知賈璉有何話說且看下回分解
