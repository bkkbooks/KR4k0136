body:
  text: 第十五回酆都府冤魂纏熙鳳大觀園冷院感晴雯前回書中講到王夫人要喚襲人晴雯兩個人進來話且慢表再說鳳姐自寶玉走失寶釵病亡操心過度兼之聽了些閒話胸懷鬱結臥病不起這一天鴛鴦來到平兒屋裏問起鳳姐病緣道我瞧他臉上很不好看別由他的性兒要上緊醫治才好如今又近年下了事情越發瑣碎也怪可憐他這病全是操勞受乏累出來的平兒眼圈兒一紅道你不知操勞受乏他是慣常的都沒要緊他近來有一種心病真是說不出來的苦說著把身子湊一湊近悄悄說道就爲寶玉同寶姑娘兩個人如今八下裏都抱怨到他身上來太太雖然當著面沒有說出什麽背地裏的話也有幾句傳到他耳朵裏姨太太也是有話說不出來你沒聽見寶二奶奶病重時候的怨言怨語當著他面竟明嚷出來他懊悔的什麽樣似的一個人在屋子裏哭了好幾回你想走的走死的死有什麽法兒呢鴛鴦道豈全是太太抱怨他我對你說了再別叫他知道就是老太太也悔的了不得總說鳳丫頭誤了事不是我說句公道話這件事委實辦的不貼理捏神弄鬼的鬧些什麽話未完只聽鳳姐在那屋裏亂嚷著討車道有人告了他要去聽審呢又一疊連聲的叫喚平兒平兒趕忙過去見鳳姐已跳下炕來披頭散髮兩眼直豎瞧著平兒道你爲什麽跑進我屋子裏來有的是銀子什麽天大的官司結不了平兒這蹄子爲什麽躲開了叫平兒快張羅我的銀子去平兒見了又急又怕鴛鴦嚇得跑了出來忙叫年壯有力的女人多進去幾個把鳳姐連推帶扶的睡到炕上一面回去告訴了賈母連王夫人也知道了一同來到鳳姐處見幾個家人媳婦和平兒等都在炕前看守鳳姐只是把兩手亂抓亂打口中不住的嚷罵賈母歎口氣道我也不知作了些什麽罪孽看他們一個個都這樣鬧起來不如先叫我閉了兩隻眼倒安靜王夫人無奈只得先把賈母勸慰忙傳林之孝家的進來立刻打發人去求醫問蔔賈母又問王夫人道我記得鳳丫頭先前也有那麽一回像還鬧得厲害後來怎樣好的呢王夫人答道那時同寶玉一時起的病都搬到上房屋子裏虧來了一個和尚給他們念了一會經咒才好起來的賈母想了一想道那麽著我回去叫他們把人家替我念的金剛經同沒有散完的佛豆兒盛一小布口袋來給他壓壓邪叫屋子裏站幾個人小心看守著說罷賈母自回房去王夫人又吩咐了平兒幾句話也送賈母出去了接著賈璉回來陪大夫診脈又叫人到玉真觀和張道士討朱砂鎮宅符同賈母處送來的經卷佛豆各各佈置起來果然鳳姐安靜了些賈璉趁空兒拉了平兒來到那邊屋裏涎著臉兒向平兒附耳說了兩句話平兒帶笑輕輕的啐了一口道你不見奶奶鬧的這個樣兒我心裏還是晃晃的你倒像個沒事人兒趁著他這會兒查察不到便來撮巧宗兒我偏不呢說著摔脫賈璉的手一扭頭跑出屋門仍往鳳姐屋裏來了這裏鳳姐外面雖似安靜還是不省人事昏昏沒沈的挨到三更時分見本宅土地引他出了屋門後面兩個猙獰鬼卒趕著行走睜眼看時見面前兩道旗子一扇紅旗上寫的百善孝爲先五個金字一扇黑旗上寫的萬惡淫爲首紅旗下一道金光黑旗下一股黑氣激射過來鳳姐只向著那道金光行走約有半個時辰那股黑氣漸漸消滅紅旗仍在眼前不多時見前面一座牌坊鬼卒站住鳳姐過了牌坊有一個人笑臉迎上來叫聲嬸子鳳姐認是蓉哥媳婦秦氏喜出望外一把將他拉住也不及敍談便道你這裏有什麽地方引我躲一躲才好秦氏道嬸子幸虧了一個人這裏還不是嬸子來的時候那一個地方也不能不去走一趟咱們這裏自與你調排嬸子此去雖然要受些虛驚可保無事這會兒也不便相留恐怕耽誤時刻說著便摔脫衣袖霎時不見秦氏牌坊左邊現出金甲神押送鳳姐過了牌坊仍交與鬼卒鳳姐只得隨著向前有苦難叫一路陰風淒慘撲面黃沙不辨走的什麽去處只顧挨步前行不敢擡頭聽得有人叫道二嫂子你來了嗎鳳姐一看認得那人就是賈瑞手裏拿著一面鏡子正照反照了幾回放聲大哭道算你是個正經人也不該這樣擺佈我今兒可給你算帳的日子了說著把鏡子劈面打來鳳姐慌忙躲避身後閃出鬼卒接住鏡子向鳳姐一照見鏡子裏面現出賈蓉賈薔兩個人來又見賈瑞蹲在台基上賈蓉賈薔在上面揭開溺桶蓋子沖了賈瑞滿頭的光景羞得鳳姐滿面通紅低著頭只顧走路遠遠望著香花幡蓋擁著仙童仙女冉冉行來一見鳳姐仙童忽然變了一個披頭散髮鮮血淋漓的年輕男鬼仙女變了女鬼脖子裏還系著繩子舌頭伸出五六寸長揪住一個老尼姑亂打老尼姑口內嚷叫二奶奶快替我分證分證鳳姐聽了越發心驚膽裂死命躲脫行不到幾步又有許多冤魂撲近身來被鬼卒喝開免遭荼毒一時進了城關約行裏許見一殿宇巍峨雄壯門外無數披枷帶鎖的罪囚往來不絕鳳姐隨了鬼卒進入角門來至號房銷稟挂號見有頭戴軟翅紗帽身穿藍袍手裏拿著一本簿子揭開數頁指著說道王熙鳳你本來是太虛幻境不應墮落酆都緣在生起滅詞訟張口舌斂財苛刻種種罪孽過於男子合該削除仙籍故勾攝至此明日倒到森羅殿上判決罪案說畢仍令鬼卒押去來到一所房間將他推入裏面黑魆魆並無燈火冷風刺骨陰氣侵肌舉目不見一個親人惟有悲號痛苦而已正在傷心見有一個人打進門來覺眼前忽然明亮看他頭戴武士巾身穿箭杆衣腰束絲鸞帶手持令箭一枝口稱璉二奶奶快走罷鳳姐認得他是焦大便如遇見至親骨肉一般問道你是焦大爺怎麽也在這裏又是這樣打扮那人答道奴才因爲當年跟隨老主出征也算得忠心報主立些汗血功勞雖然爲人粗魯倒還心直口快到這裏賞了一名旗牌鳳姐聽說便笑道今兒難得遇見你老人家怎麽樣想個法兒搭救我才好呢焦大道二奶奶的罪名不小明兒到堂免不得一件件要質審發落如今恭喜了因有什麽太虛幻境知照到來說要歸結他們那裏的公案二奶奶雖然劣迹多端獨平日間侍奉太君尚能承歡盡職一善可以蓋百愆因此免了輪回之劫叫焦大來送二奶奶回府於是鳳姐如魚漏網也無暇細問便出了那間屋子望路便走那押解王熙鳳的鬼卒知是奉公而來不敢攔阻只得向焦大好言相告說我們辛辛苦苦跑了一趟不敢爭多論少求你老人家方便一聲兒焦大楞著眼喝道再沒有你們這種不開眼的東西不知道這是榮國府來的人金的銀的早就扛了幾箱來了剛就短少你們的嗎停會兒都來找我焦大太爺當下焦大喝開鬼卒鳳姐隨在後緩緩行走一路月白風清大不比來的時候一派陰霾愁慘氣象心想此番幸虧了焦大倒不記我的恨很來巴結出力一路把焦大獎勵了幾句話且少表再講平兒見鳳姐昏暈過去便記起日裏吩咐的話叫多買金銀紙錁燒化一面要去回王夫人又叫去園子裏通知李宮裁等並過那邊去回賈赦夫婦賈璉聽了聽自鳴鐘點數道這會兒才交子正初刻大驚小怪的叼噔人家算什麽你別盡仔瞎鬧我瞧著他還沒有斷氣呢等到天明再看光景去通信不遲於是平兒也沒言語又不敢高聲啼哭便哄著巧姐兒去安歇自己過來同老婆子們守著只是嗚嗚咽咽傷悲而已直至雞叫的時候天還未明忽聽鳳姐喊了一聲噯喲平兒才住了哭連忙叫小紅去取參湯賈璉也放了心等到天明就請大夫到來診脈開方服藥調治不提且說王夫人因上一天鳳姐狂症忽發心裏牽挂一早打發彩雲過去瞧他彩雲回來撞著趙姨娘四顧無人一手拉著彩雲到自己屋裏坐下把兩個指頭一伸說昨兒聽見那一個忽然又病的著起緊來嗎彩雲道同那一年一個樣兒也是那麽胡說亂道只沒有動刀子殺人趙姨娘聽了又是觸心又是歡喜想如今並沒人暗算他可是祿命該絕自己作死呢又問彩雲道聽說襲人出去了太太把寶二奶奶的東西給了他一半現在又把箱櫃上的鑰匙交給這一個了他死了又叫誰收管呢難道環兒就算不得太太的兒子留一點子底下給環兒可使不得彩雲道前兒給襲人幾件衣服是有的你別聽老婆子們傳來的瞎話說起襲人倒有一件稀奇事告訴你一語未了見賈環進來道剛才我到太太那裏去請安太太賞了我一個玉扳指一個鼻煙壺兒可是從來沒有的事你瞧好不好彩雲扭過頭去道不用瞧那是前兒太太叫我收拾櫥子屜裏找出來的太太叫把這兩件子留在外頭如今你二哥哥去做了和尚太太比先前自然要疼你些諸凡留一點子心討他老人家個好底下好彩雲說到這裏臉上一紅便縮住了口賈環介面道我倒忘了聽見太太叫小丫頭到鳳姊姊屋裏去找你呢彩雲抽身便走到王夫人跟前回明瞭璉二奶奶後半夜睡的安穩早上大夫來診過脈可以放心的話書且少表講到襲人自蔣家退回又氣又恨又羞又悔種種惡劣塞臆填胸想到蔣家既把我這樣好馬不吃回頭草斷無再去俯就之理欲另尋門當戶對親事諒我這樣苦命也再找不出什麽好人家來就在娘家過一輩子更非了局想寶姑娘勸我的話原無歹意如今看起來璉二奶奶竭力弄成了寶姑娘的姻緣到害了寶姑娘寶姑娘苦口勸我走這條路又害了我真是寶姑娘抱怨璉二奶奶的話可不是爲好成歹倒像寶姑娘受了璉二奶奶的胡弄沒處翻冤拿我來還報似的倘然寶姑娘還活著我也好到他跟前訴訴委曲如今只好到鐵檻寺他停靈的所在痛哭一場罷了襲人因此鬱結成病那日王夫人命人去叫襲人晴雯兩個進府襲人自覺無臉推病不肯進去惟有晴雯高興同著老婆子坐車進來先見過王夫人晴雯淡淡妝飾仍不改舊日丰姿因王夫人心中既不憎惡這個人即不顯出他狐媚妖精模樣一時舊怒全消細問在外這幾時景況晴雯便將染病出府死而復蘇寄住母舅家緣由一一回明王夫人聽到此處不覺觸動黛玉光景心有所感又問了些鄉村風景閒話命晴雯在此多住幾時晴雯又去見了賈母隨到舊日相好各姊妹屋裏一走因鳳姐正在病中只到平兒處說了幾句話麝月秋紋留他在屋裏住歇晴雯說要往園子裏逛逛便一個人進了園因時屆寒冬木葉盡脫景物蕭條無心觀玩惟不忘怡紅院舊地想到那裏看看因一個人覺得冷靜剛才聽說紫鵑尚在園子裏且到稻香村見過了大奶奶拉了紫鵑一同逛逛便徑往李紈處來他們都已知道晴雯未死王夫人叫他進來見面時自有一番敍談晴雯知道黛玉死後回生與自己一樣紫鵑不同回南尚住園中彼此見面覺比從前分外親熱一手拉住紫鵑要去逛園子李紈笑道噯喲喲這樣數九天刮的西北風臉上還受得嗎真像好幾時沒有進園子裏來的人了晴雯道橫豎要到各處姑娘們屋裏走走呢李紈道二姑娘已經出了閣只有三姑娘四姑娘同邢大姑娘還在園子裏頭等過了年再收拾屋子出來咱們這幾個人都要往裏頭搬呢紫鵑道我這幾時也住得悶悶的就同他逛逛去李紈道沒有像你們的兩個傻子去去就回來又問晴雯你今兒晚上在那裏歇呢晴雯道我如今倒像做了遊方和尚那裏肯留就在那裏挂單李紈笑道咱們家裏才出去了一個和尚還沒著落你要做遊方僧快鉸了頭髮遊去把那一個和尚引了回來可不好說的大家都笑起來當下晴墳同紫鵑同出了稻香村一路行走紫鵑想起那一晚做的夢再不料他還沒有死既有這個人在那個夢像有些兆頭或者姑娘同寶玉還有完聚之日也未可定一頭思想不覺到瀟湘館門前紫鵑便要進去和晴雯同至裏邊見滿院竹枝青蔥如舊一陣風敲敗葉淅淅瀝瀝連凍雪都飄下來聲韻淒清荒涼滿目獨有紫鵑到了這裏想起黛玉便無精打采的呆站了一會晴雯猜著他的心事便道我舅舅家後園子裏也有幾叢竹子我瞧著就想起這裏的光景來再料不到林姑娘已經回南去了有多大時候園子裏頭就通變了樣兒紫鵑道你出去兩年這裏的事情變遷不一真像有幾十年似的晴雯道我住在外頭路隔的不遠裏頭的事全彀兒沒有得知說是活著比死過的陰陽隔絕一般只算我是前兒見周大娘那一天才回生的紫鵑道你爲什麽不打聽打聽裏頭的事晴雯道我舅舅是一個莊家老兒古板頭自種自吃輕易不和人家來往連他侄兒侄媳婦都不上門的叫我那裏去打聽呢紫鵑道也怪不得你城裏鄉間到底隔著好幾裏路我住在園子裏和那邊也像隔遠了幾千里路襲人嫁了一家姓蔣的說退了回去我昨兒才知道到底不知他家爲什麽退了襲人回去晴雯道姓蔣的不要襲人自然有個緣故你要查察他什麽二人說著走進屋子裏惟有空空一室觸目傷心紫鵑先退了出來晴雯跟在後面又到廂房裏見炕火微紅桌上擺著酒壺茶盞燭臺上未盡半枝殘燭像還有人在此上夜的光景晴雯拉著紫鵑道走罷咱們去瞧瞧我先前住的屋子如今也不知糟蹋的什麽樣了紫鵑道你們那院子裏還是寶主做親那一天去走了一趟到如今再沒去過晴雯道寶玉在怡紅院做親的嗎紫鵑道你不知寶玉做親時怪事多著呢在裏頭多住幾天自然一件件都明白了那時候瞞的鼓也似的緊因我要去瞧熱鬧到怡紅院瞎跑了一趟那知他們已挪了地場晴雯一面聽說想到寶黛二人心事後來竟娶了寶姑娘雖聞大略究未深悉其故意欲探問紫鵑又恐他礙著黛玉不肯細說便笑問紫鵑道妹妹你可知道寶玉到底爲什麽去做了和尚呢紫鵑沈下臉來道你問的奇寶玉去做和尚怎麽問起我來晴雯道好妹妹別生氣因我出去了不知裏頭的事白問問你紫鵑道襲人走了還有麝月秋紋這一班人都沒死爲什麽不去問他們晴雯道他們就明白嗎紫鵑笑道你真發了昏了他們不明白我倒明白這些事據我猜起來只怕爲的是晴雯姑娘死了寶玉才去做和尚呢晴雯紅了臉啐道我算什麽呢只怕還爲是晴雯講到這裏又縮住了口紫鵑介面道正經寶玉有一天回來又添出你這一個死去活來的人真也夢想不到的你知道寶玉還回來不回來晴雯道好紫鵑姑娘剛才我白問一句寶玉爲什麽去做和尚你就說我問得奇你問我寶玉回來不回來叫我怎麽樣對答你呢或者丟不下紫鵑姑娘就回來也不定紫鵑聽說要來撕晴雯的嘴二人一路耍笑來到怡紅院晴雯一看恍如隔世重生又到前後自己屋子裏細瞧一會想起戲撕紈扇病補雀裘往事如在目前止不住滴下淚來比紫鵑進瀟湘館更添悲感紫鵑道咱們別盡仔跑到這幾處空院子裏來發呆天也不早了你今兒進來各處姑娘們屋裏該順便去走走我也廝趕著於是二人出了怡紅院紫鵑道先前這幾年到這院子裏來回的跑足有上千趟今兒同你來走了這一回以後就沒有什麽事跑到這裏來了晴雯道我呢紫鵑道你丟不下這屋子愛住由你一個住著晚上有妖精出來要吃了你去再別抱怨人家晴雯道我單不怕是妖精他敢來試試麽紫鵑道好冷天氣快走罷二人抄近路往秋爽齋等處都遍了回到稻香村李紈也才從王夫人處回來見林之孝家的急忙忙的趕來道有一件事平姑娘叫我來回大奶奶正是年近歲逼照常的事還鬧不開擱得住接二連三的有這些事出來也真沒法兒了瀟湘館上夜的老婆子來回那個地方近來很不安靜夜夜聽的屋前屋後有整百人不住的跑動昨兒晚上他們睡到半夜裏竟像有人進去把炕上睡的人都拖了下來說瀟湘館出了妖精了李紈道林姑娘走後裏頭東西都收拾出來的了剛是幾間空屋他們還在那裏上什麽夜林家的道因爲這幾個人派的專管那裏花息左近也沒住處就一搭兩便歇著看看屋子的李紈便向紫鵑問道這屋子你是住慣的頭裏見過什麽沒有紫鵑道那裏有這些事就是姑娘病凶的時候也是安安靜靜的李紈道如今怎麽忽然鬧出這些話來想他們賭的賭喝的喝自己攪昏挺到炕上便是那麽亂夢顛倒起來既然那裏有妖怪叫他們另找睡的地場去等二奶奶好了你再回一聲這會兒叫我有什麽法兒呢晴雯聽了便指著紫鵑道都是你剛才說起妖精妖精來了紫鵑便指著晴雯道大奶奶道他是不怕妖精的今夜推他到那裏歇去未知李紈可叫晴雯到瀟湘館去睡歇晴雯去也不去看下回分解
