body:
  text: 第十四回花襲人出府喪節守蔣玉函感舊退婚姻話說小紅來到襲人屋裏拿了幾件首飾又提著一包衣服遞給襲人道這裏頭一件天馬皮大毛褂子奶奶說先前給過姊姊的後來要去配豐毛就擱著沒有拿來今兒平姑娘疊衣服才記起叫拿來給了姊姊還有二十兩銀也是奶奶給你的外頭的例賞你哥子領去的了襲人打開包袱一看見是頭裏回家時候二奶奶因天冷給他穿的這一件物則猶是而人已今昔不同禁不住淚珠直滾只得說道勞動妹妹奶奶那裏我過去磕頭小紅略坐一坐也就走了停了一會又見鳳姐處打發一個老婆子來道花自芳自己坐了車子來接在大門外等著呢襲人這裏早有秋紋碧痕這一班人替他裝箱鎖籠收拾停妥襲人一面拭幹了眼淚先到王夫人處玉釧一見襲人便迎出院來悄悄的道太太心裏疼還睡著呢叫你不必去見老太太怕老太太見了傷心別的所在也不用去走只去見了鴛鴦琥珀等一面說明王夫人叫不見老太太的話便回身出院轉過穿堂徑至鳳姐屋裏鳳姐見了襲人道這幾時鬧得我來支持不住百樣事都懶怠開口你這件事我竟摸不著頭緒昨兒聽見說起是太太作主也怕你受委曲疼顧你的意思我想起來也沒有什麽使不得才叫小紅送去的東西都收到了嗎襲人道謝想到此刻自己身分非比從前只得下了一個全禮鳳姐連忙拉住瞧他臉上脂粉不塗淚痕滿眼委實可憐便道你將來不拘到那裏依舊裏頭來走動就是太太也不肯把你當一個打發出去的人看待停幾天我就叫人出去瞧你正說著只見老婆子來回花姑娘的哥子又進來催過呢襲人噙著淚還要進平兒屋裏平兒便拉了他一同出來早有鴛鴦琥珀玉釧麝月等一班姊妹在過廳裏等著送襲人一齊來到二門口平兒便問車了呢見有一個小子回道車子是花家雇來的裏頭沒吩咐出來沒有套車襲人只得同了一個老婆子走到大門外來上車平兒等在二門口站了一回看襲人走遠了各自進去且說襲人所有的箱籠等物自有麝月秋紋給他逐一撿齊叫老婆子搬運出來花自芳瞧著轎車裏面裝不下又雇了一輛敞車襲人同老婆子坐了轎車花自芳在後面押了敞車不多一會到了家裏花自芳的女人早預備襲人住的屋子燒暖了炕把東西都收拾進去這晚花自芳又把姻事稱心並現在趕辦嫁妝的話告訴了襲人不多幾日吉期已到一切禮儀倒也豐盛親朋賀喜鼓樂齊喧甚是熱鬧一面與襲人妝新催妝上轎襲人此刻想到寶玉相待情分未免戀戀舊巢然事已至此亦無可奈何只得隨波逐浪另抱琵琶不說襲人心頭思想再進花轎過門參天拜地已畢甫入洞房忽聽新郎匆促出門不知因何緊要事務花燭良辰孤幃獨守一夜待至天明起身梳洗仍未見新郎回家留心聽得房中伺候的老婆子說起靜王府裏有事傳去一時未能脫身接連三日那一天襲人離了臥房向前後內外細細瞧了一遍見屋宇雖不軒昂而結構新妍陳設體面似非莊農貿易人家客屋東首有一套間極其精雅乃是新郎平日坐臥之所壁上單條畫幅雖不識是否名人筆墨但覺裝潢華麗擺的一色紅木桌椅大紅哆羅呢椅墊顔色鮮明酒樽茗碗無不精潔靠壁一架梨木書櫥無多書籍只有大紅書面貼黃簽的一套槅子上也擺著溜金香爐碧玉花瓶嵌鑲如意等物還有笙笛鼓板這些雜器桌上多盛盤內羅列著幾件漢玉古玩內有玉扇墜一個倒像看見過的炕上月藍洋縐炕幔上面大紅顧繡走水兩旁鍍金幔鈎一疊五六床被子配搭顔色相宜炕邊紫檀衣架上搭著幾件隨常替換衣服裏邊露出半條松花色湖縐汗巾襲人順手抽出一看怔怔的呆了半晌又翻覆細認一遍確就是那一日替寶玉系在褲上換給戲班裏人的那時還嗔他不該把我的東西給人誰料數由前定連身子都歸結在此既然他家姓蔣此人無疑是蔣琪官了雖未免傷心往事然已知數定勝人萬難勉強倒把鶻突的心腸安定了幾分於是想起換來的那一條汗巾子記得撩在箱裏從沒系過就帶了這條松花綠汗巾回至房內打開箱子找出那條大紅的來一對兩邊顔色一襯分外鮮妍襲人又呆呆的看了一會把那松花綠的反收藏起來留這條紅的在外欲待本人回來瞧見了看怎麽樣原來娶襲人的果然就是蔣玉函只因成親那一夜適值北靜王府裏宴客唱戲傳了蔣琪官去伺候接連鬧了幾日直到第四天才得回家趕忙來到新人屋裏欲與溫存一番一眼瞧見衣架上的茜香羅汗巾因這件東西本是外國進貢的罕物又切記那一年贈與寶玉的如何忘記了定睛細認大吃一驚又將新婦端詳了一回便問你莫非是寶二爺屋裏的襲人姊姊嗎襲人粉臉泛紅低頭無語蔣玉函道記得那年和二爺在酒席上行令犯了姊姊的芳名旁人還罰了我的酒說寶二爺屋裏有一位襲人姊姊不該道出這兩個字來才見了這條茜香羅汗巾就是我孝敬二爺的想起姊姊姓花定然就是襲人姊姊了如今千虧萬虧是北靜王府裏傳我去唱戲耽擱了三天雖與姊姊洞房花燭尚未共枕同衾前兒在王府裏聽說王爺爲二爺的事很惦記傳一個起課先生叫張鐵嘴起了一課說二爺這個人本有夙根但此時還不能抛撇紅塵不久就有回家的消息我今誤取了姊姊日後二爺回來縱然寬恕我如何對得住二爺呢便是二爺當真出了家一輩子不回來我也不肯唐突姊姊這件事便怎麽樣好呢當下蔣琪官心上盤算一番便向襲人作了四個揖趕忙出去了這裏襲人聽了蔣琪官的話竟置身無地想寶玉果真回來自然好也叫老太太太太放一條心但就我這個人看起來俗語說的嫁出去的女兒如同潑出去的水我已經到了這裏還有臉兒再進府去不成倒不如寶玉不回來的乾淨不說襲人胡思亂想提過這條大紅汗巾呆呆的拿在手裏嗚嗚咽咽哭個不了再講平兒鴛鴦麝月秋紋這幾個人知道襲人回家去不多幾日就出了嫁夫家離城不遠這一天講起因念素日姊妹情分攢湊幾兩銀子備了四個盒子平兒回明鳳姐叫周瑞家的出去瞧他一瞧周家的便坐了車帶了自己家裏一個小丫頭叫趕車的先到花自芳家裏問明他妹子嫁的人家住在那裏那趕車的早已知道說不消問得就是紫檀堡蔣家離城不過十幾裏路說著一揚鞭趕出了城徑望蔣玉函家來到門前住了車先叫趕車的端了盒子進去隨後周瑞家的下了車帶了小丫頭一徑走進裏邊早有蔣家一個使喚的老婆子聽說是榮府來的人趕忙迎了出來一見周瑞家的穿戴體面不敢怠慢便陪笑迎進堂屋一面讓坐周瑞家的問新娘屋子在那裏那老婆子問明瞭姓便道周奶奶你不知道新娘已經不在了周瑞家的倒吃了一驚忙問道怎麽說不在了那婆子道周奶奶請這裏坐下慢慢講給你聽笑話多著呢想是我們這位相公今年天喜星沒照命頭裏聘過一家姓吳也是榮府裏出來的姑娘媒人已講得停停妥妥到了過禮這一天媒人還不出他家的屋門不知爲什麽那一個姑娘就上了吊了幸虧解救得快沒有死女家頓時把親事退了如今娶了這位新娘來人材也出衆性格也溫存才三四天還沒同房就把他退還了娘家瞧著我們這位相公只好一輩子在場面上給人家做老婆自己竟沒有娶老婆的福分呢那婆子話未完周瑞家的已聽得滿肚子疑惑又想近來不聽見裏頭打發丫頭出去或者是東府裏的也未可知爲什麽又上起吊來此時反將襲人之事擱過一旁盡著盤算那一個是誰便根問頭裏聘的新娘家住在那裏那婆子道就是同堡相離不遠這裏東去過了林子門前一個大場院一溜種著十多株大柳樹從這裏出去轉過那黑叢叢的林子便是他家周瑞家的一面起身那婆子陪笑道周奶奶倒白走了一趟便叫一個小廝把幾個食盒捧了出去道周奶奶順路到花姑娘家裏瞧瞧去自然裏頭還有些鈎兒麻藤的事他細細的告訴你老人家呢說著送周瑞家的出來上了車周瑞家的細想這兩件事心上不得明白先要到那一家去問問又恐這老婆子說話傳借正在拿不定主意書且按下講到吳貴家裏因先前把晴雯的棺柩擡到化人廠去送了回來已算把這件事歸結所有遺下的東西都是他媳婦收了起來還有幾吊錢吳貴拿去花用了心中安然無事到了一年後聽得風言風語傳他表妹子又活了轉來現在他叔子家裏住著心上驚疑不定怕瞞昧他的東西終有要發覺兩口子疑心生暗鬼一日吳貴的女人忽然害起病來昏迷不醒胡言亂語的嚷說我是當方土地查察你們瞞心昧了榮府許多財物不快快拿去送還便不饒你們性命說著站起身來找了一根木棍向吳貴劈頭打來吳貴身心戰慄一手接著棍子雙膝跪倒哀求土地尊神道瞞昧的東西明兒就去送還因不便送進榮府等他女人蘇醒說明此事吳貴的女人也是害怕情願送還了他待至次日吳貴將首飾衣服連花去幾吊錢也拼湊齊了包了一包袱送到他叔子家裏看見晴雯果然活著面龐比舊時肥胖了許多一面認了好些不是然後把東西逐一交代清楚晴雯因那時宋媽送出來的包袱自己在病危之際不能檢點今兒吳貴一總送還了他也是意想不到的事因此把從前待他這些不好之處都撩開了說話間問起榮府近日事情吳貴自然把寶玉中舉出家一事先告訴了晴雯已嚇得膽戰心驚怔了半晌尚未盤問細情吳貴因記挂他女人的病急忙回身便走正值周瑞家的從蔣玉函家出來到著那一家門首像是剛才這老婆子講的便叫住了車事有湊巧一眼瞧見吳貴走出門來便叫過車邊盤問吳貴道難得你老人家到這裏來逛逛這就是我叔子家裏有一件奇事告訴你老人家我家姑舅妹子還在呢周瑞家的笑道我省不起你家姑舅妹子是誰吳貴道在寶二爺屋裏伺候的叫什麽連我也忘了請你老人家到裏頭去坐坐橫豎見了面總認識的周瑞家的下了車吳貴引著先走推進大門便嚷道榮府裏的周奶奶來了妹子快出來又道我有些小事少陪你老人家說著飛跑的走了晴雯在裏面聽說榮府裏來的周奶奶不知因何事故趕忙迎了出來周瑞家的一見認是晴雯記起他被太太攆已經死過的了陡然一驚便忘了吳貴的話一時渾身打戰倒退幾步喊道晴雯姑娘我在太太跟前沒有說過你壞話呢冤有頭債有主你快去纏別人罷晴雯笑道周嬸子你別害怕我不是鬼呢連忙細細的把話說明周瑞家的啐道剛才原聽見你姑舅表兄吳貴說你還在的話我也沒理會見了你到先嚇昏了晴雯等不得周瑞家的話講完便問寶玉出家的根由周瑞家的便從晴雯出去後寶玉怎樣失了玉瘋傻起來怎麽哄他娶林姑娘反娶了寶姑娘哭的死去了林姑娘死去了又活了轉來如今已回南去了寶二爺進場中了舉就去做了和尚害寶姑娘也苦死了這些話約略講了一遍連襲人出嫁的事都說了晴雯聽說渾如做夢一般不料我出來不多時竟翻騰變幻出許多事來又想到襲人身上便觸動他的舊恨止不住夾槍帶棒的說道他是寶玉屋子裏第一個靠得住的人太太早把寶玉交給他的了如今寶玉就走到外國裏去也該跟著去找回來交還太太才算他有能爲爲什麽寶玉一出門這蹄子就要去嫁老公呢周瑞家的笑道晴姑娘這張嘴還是那麽著真是同刀子一樣的晴雯道我倒不管怎麽生硬的太太知道了攆我到陰司地獄裏去敲牙割舌我有命還活轉來呢周瑞家的道太太如今也再不計較你這些就是花姑娘也不是他自己願意走這條路太太主意打發他出去的晴雯聽說把眼一楞道周大娘你倒別說這句話別的事情自然一定要遵上頭的示下這件事全憑自己主意拿得定拚著一個死什麽事不了周瑞家的又笑道那裏都像晴姑娘你這樣執性呢各人有各人的脾氣正是我聽說娶花姑娘這一家先前還定過姑娘的又爲的是什麽不願意上了吊晴雯笑道原來就是那一家話未完見周瑞家的小丫頭進來說道趕車的請奶奶上車呢周瑞家的往院子裏看了看天道果然時候不早了怕趕不進城呢一面又向晴雯道我進去告訴了太太只怕還要叫你到裏頭去住幾天大家還要瞧瞧你呢說著趕車的又來催促晴雯便送周瑞家的至門外上了車回到自己屋裏算後思前整整的想了一夜書且不表再講周瑞家的坐上車急忙趕進城來也不及到襲人家裏徑回榮府已近黃昏時候先到平兒屋裏平兒道奶奶身上不爽快躺著呢咱們等了你好半天大家猜你被襲人留住了在那裏看新人喝喜酒呢琥珀玉釧麝月秋紋等都在裏面大家讓坐周瑞家的未說先笑道送去的盤盒原物帶了回來我到太太屋裏去再來講新奇故事給你們聽玉釧便把周瑞家的一把拉住道太太和大奶奶都在老太太屋裏陪著打牌你且把新奇故事講給我們聽了再去不遲鴛鴦介面笑道憑是什麽新奇故事我都不愛聽我就不信襲人這蹄子才嫁了男人把咱們這班姊妹都不認了連送去的盤盒也不希罕竟退了回來是什麽意思周瑞家的笑道那再別冤屈他可斷沒有這件事姑娘們聽我講出來就明白了於是把蔣家老婆子說的這番話從頭至尾說了一遍麝月不等說完便道這一家姓蔣的多分就是唱小旦的叫什麽蔣琪官二爺挨了老爺一頓板子就是爲他呢他算什麽東西襲人嫁給他還玷辱了他不成怎麽沒緣沒故把襲人休回了娘家周嬸子你爲什麽不當面見一見姓蔣的與他評評這個理玉釧道要你著什麽急你怕襲人受委曲氣不憤明兒許你同了周嬸子到蔣家去評理呢平兒笑道他到蔣家去倘然蔣琪官倒看上了他把他留住抵兌襲人這個窩兒怎麽樣呢大家都笑起來笑得麝月紅了臉正要不依平兒只見一個小丫頭子跑來說道老太太屋裏已經散了場太太下來了叫玉釧姊姊呢周瑞家的忙站起身來道我見太太吃飯去還有一件奇事明兒來講給你們聽罷說著只聽得鳳姐在屋子裏亂嚷平兒連忙擺手叫別言語悄悄的聽得鳳姐嚷熱叫小紅把蓋的綿被揭去一條平兒過去幫著伺候琥珀聽說老太太屋裏牌局已散早先走了周瑞家的走後麝月等亦各自散去再講周瑞家的來到王夫人處提起襲人晴雯這兩件事來王夫人自然記挂襲人吩咐周瑞家的明兒叫人到花自芳家去問個底細又想到晴雯當日並無確實劣迹不過聽了幾句閒話正碰著園子裏鬧的不乾不淨一時生氣把他攆逐出去已撩在一邊如今聽說他死而復生辭婚自縊種種可異不覺有幾分悔意想喚他進來盤問細情只當聽講新聞故事借此散悶也好便問周瑞家的道不用叫人到花自芳家去問了停一天叫襲人晴雯兩個都進來我問他們可笑寶玉一個人作精作怪的去出了家連他屋子裏的丫頭出去一個個鬧出這樣沒有經見過的事來真真活話靶說著又歎息了幾聲周瑞家的見王夫人無話站了一會自回去了要知襲人晴雯何時進府王夫人怎樣看待再看下回分解
