body:
  text: 第二十五回金殿傳臚榮膺曠典香閨制錦集賀新婚話說寶玉在紫菱洲與衆姊妹敍談想起一事徑出門來要喚包勇才吩咐二門上傳話出去包勇正捧著鴛鴦劍進來見了寶玉打千請安畢便指著劍道這是二爺那裏得來的怪不得這樣珍重他可不是塵凡之物奴才的性命還仗著這柄劍救下的當下就把路上遇盜幸虧此劍飛斬盜首船上並無失物緣由細細講明寶玉聽了放心一面接過鴛鴦劍出鞘細玩見光芒四射如秋夜銀河匹練其貴不在切玉斷金真夜行不畏魑魅也看了一會暗暗感激湘蓮不已便攜了鴛鴦劍到自己屋裏藏好麝月等連忙趕過問道這又是那裏來的寶玉道這可又是一件寶貝瞧也瞧不得別去鬧亂兒麝月道二爺把那古古董董這些東西拿回來我們可不曾經由過幾天再不見了又和我們鬧不明白剛才太太打發人來問呢說這一兩天裏頭正經該靜坐養養神別各處去亂跑正說著見翡翠來叫寶玉道姑娘們都在老太太屋裏叫二爺去同吃飯呢寶玉便跟著往賈母處去了講到榮府家人以及家人媳婦平日各有職司如今有了寶玉完姻這件事鳳姐早按著花名冊子重又分派一番某人管某處的陳設燈彩鋪墊某人管某處的茶酒器具某人在某處伺應賓客值幫送茶至王親郡侯國公駙馬等到來另派體面家人伺候管廚買辦都添了人寶玉迎親這天的鹵簿轎傘旗鑼各項人役預先派定某某人等經理衆家人媳婦亦按職司分派常在上頭走動的人如林之孝賴升吳新登這幾個同他媳婦們內外各處照應總理其事焙茗等專管跟隨寶玉別的事一概不派著他們早幾天前頭都已派定回了王夫人這一日趁著裏頭事情稍閑鳳姐抽空兒便坐車往黛玉公館走了一趟回來見王夫人道今兒我也去瞧瞧林妹妹當面沒有說什麽話剛到家就有兩個媳婦子跟著來說他姑娘的屋子不要別處就只要他頭裏住的瀟湘館不是太太吩咐趕緊收拾屋子如今可用不著了這也不費什麽事已經叫人去把瀟湘館裱糊出來林妹妹走的時候收進來的東西照舊發了出去這些帳幔門簾鋪墊都已製備在寶兄弟新屋子裏這會兒要另制起來也趕不上暫時挪了過去總是一樣的還聽見林妹妹那裏有一班小清音陪送過來也是十二個女孩子橫豎梨香院白空著就叫他們去住罷王夫人聽了點點頭鳳姐道還有一件事要回太太林妹妹知道晴雯還在就要叫他進來聽那來的兩個女人口氣將來要把晴雯留在寶兄弟屋子裏呢王夫人道晴雯這孩子我先前錯看了他如今林姑娘有這個意思也很好的了你打發人去叫他進來就是了鳳姐道還不知晴雯在那裏住呢玉釧笑道上年周大娘不是到過晴雯舅舅家裏後來太太要叫他進來還是周大娘叫人去同來的鳳姐道那時候我正病著全個兒沒有知道這些事他舅舅家住在那裏呢王夫人道那麽著還叫周瑞家的去走一趟當下打發小丫頭子叫了周瑞家的來鳳姐告訴他緣故周瑞家的笑道晴雯的脾氣聽見大奶奶說起他知道寶二爺回來的信正逼著要坐車出去太太不是留過他他一定要走嗎這會子去叫他拿不准他來不來呢鳳姐想了一想道周大娘我教你一個法兒包管他肯來周瑞家的道二奶奶的示下依著去辦就是了鳳姐便向王夫人道叫周大娘去見了晴雯竟說是林姑娘叫他也不必到這裏來一徑送到林姑娘公館裏去有什麽話等林姑娘和他去講就是了王夫人道倒是這樣好當下周瑞家的回到家裏帶了小丫頭子坐上車徑往紫檀堡去見了晴雯說明林姑娘叫他的話晴雯知道林姑娘已到便高興同了周瑞家的徑到公館黛玉晴雯見面各人想起舊事轉喜生悲彼此眼圈兒一紅幾乎掉下淚來當著周瑞家的在跟前都說不出一句話來晴雯拉了紫鵑到他屋裏坐了一會講不多幾句話聽說周瑞家的走了晴雯便出來見黛玉道我出去後姑娘的光景紫鵑妹妹都和我說的了我聽了也替姑娘恨得牙齒紮紮的如今恭喜姑娘了黛玉低頭不語到被晴雯幾句話觸起前情用手帕子擦了擦眼拉晴雯坐了細細問他離了大觀園以後的情事想到他遭讒被逐與我被人病中播弄死而復生兩個人都如隔世重逢把自己身子對照晴雯出來如同一轍便覺與晴雯倍加親熱話更投機如今那邊把晴雯送了過來知所議已諧暗令紫鵑在他面前微露其意晴雯十分感激所以進了榮府只算是黛玉的人總叫姑娘不肯改口後話表明不提這裏鳳姐還在王夫人處回話道今番寶兄弟完姻各處請了酒把姨媽撩開沒有這個理倘因咱們去請了姨媽勉強過來他老人家看見了難免不傷心倒是一件爲難的事王夫人沈吟了半晌道你看怎麽樣呢鳳姐道侄兒媳婦想起來橫豎要去請琴妹妹香菱的在姨媽跟前淡淡的邀一聲來不來由他老人家就使姨媽不來總叫琴妹妹香菱來的王夫人道不是你的大嫂子的妹妹同史大姑娘都來了嗎沒見了琴丫頭來呢鳳姐道那是老太太叫打發人去叫他們來玩的正說著見周瑞家的來回覆了晴雯的話王夫人同鳳姐又放開一件事此時榮府內瑣屑的事一天不知有幾百十件概不細述單講寶玉迎娶正在殿試這一天是日天喜月德金馬玉堂諸吉星集照擇于亥時拜堂榮府正門洞開自穿堂及兩邊超手遊廊直到正房大院一色懸挂五彩繡紗挂珠玻璃燈顔色配搭得宜越顯得雕梁畫棟金碧輝煌寶玉一早出門隨著同年諸進士等候殿試去了北靜王上朝後便坐轎來到榮府賈赦穿了公服接至大門外陪到榮慶堂款留各官賀喜絡繹盈門另有知賓分別讓至各廳陪坐四班名戲酌量地方安設榮慶堂是蔣琪官的班子候北靜王一到立刻開台裏邊王夫人院內也有不安慶班預備是日伺候至親近族來賀喜的女眷們酒席少停客都陸續到了鳳姐實在不能分身陪坐王夫人只得推尤氏留心照應自己也到各處讓讓李紈因是孀居要些避忌所以從前寶釵過門時新屋子裏並沒有他今日自然也不過來講到榮慶堂正在唱戲熱鬧賈璉騎著馬趕回來跑得滿頭大汗徑到榮慶堂見了王爺回了幾句話便來找著鳳姐道快叫人去收拾省親別墅來鳳姐聽了這句話摸不著頭路便怔了一怔道這又是怎麽賈璉道我爲寶兄弟殿試的事正在禮部裏聽得傳出旨諭來賜寶兄弟在省親別墅完姻拜了天地花燭迎歸洞房想來是皇上思念故妃寶兄弟是娘娘的胞弟一則推恩以及二來寶兄弟聖眷優隆的緣故鳳姐笑道今番寶兄弟做親連屋子都由不得太太當家一個林姑娘要住他瀟湘館已經翻騰了一遍這會子旨諭都下來了那省親別墅是鎮年關鎖的鋪墊燈彩統要重新安設起來呢賈璉道那個說不得你看著叫人趕緊去收拾外邊的客都來了我也得去點個卯兒支應著些還有要緊辦的事說著又到王夫人處回了幾句話就走了鳳姐聽了賈璉的話便去回了王夫人吩咐了林之孝賴升家的叫多帶幾個人先到省親別墅去打掃出來一面平兒取了鑰匙交給林之孝家的去開省親別墅的門鳳姐又吩咐道既在那裏結親離這裏遠了還得就近在嘉蔭堂綴景閣這兩處預備衆人坐落賴升家的同林之孝家的答應著就走少停鳳姐還親自跑去看他們收拾一回又到自己屋裏辦別的事去了這裏史湘雲爲頭同了岫煙迎春到稻香村拉了李紈姊妹們來找探春要做詩賀黛玉新婚探春道我才到那邊見太太屋子裏的人都擠滿了委實懶怠應酬他們就跑回來了你們又要做詩倒也雅得很新婚詩自然脫不了香奩體只要貼切便佳湘雲道我們還是聯句還是各人做各人的探春道隨各人的便最好李紈道你們大家高興要賀林妹妹我也謅一首岫煙迎春都道自然要推大嫂子首唱那湘雲要想新奇意思一個人走出院子裏出神看缸裏的金魚口內又道那邊好幾個班子唱戲爲什麽一些鑼鼓響也沒聽見探春在屋子裏隔著紗窗道路隔得遠那裏就聽見鑼鼓響呢快來做你的詩罷要聽戲完了你的卷盡管請到那邊去剛才太太還問姑娘們愛聽戲的爲什麽不過去呢李紈道你們盡仔講話我的倒有了李紋道姊姊念來我寫衆人一面聽李紈念他的詩一面看李紋寫道鍾郝徽堪仰清江娣姒緣捧匜循我職聯袂羨卿賢自鼓瑤琴樂同磨鐵硯穿蘭馨征吉兆椒頌制佳篇月盎芙蓉帳花明玳瑁筵稻香村酒熟雙醉玉堂仙衆人都道逼真是大嫂子口氣再不能挪到別一個的爲什麽起海棠詩社不肯助興這樣吝教呢說著探春的也有了湘雲看他寫道自出於歸舅氏門潘楊世願兩諧婚碧桃舊識仙源種紅杏新栽月窟根席奪鸞坡誇婿貴扇開雉尾荷君恩探春才寫了六句湘雲把手按著紙不叫寫下去問是幾韻探春道剛掉兩句了快讓我寫完了再講罷湘雲把探春手內的筆奪過道末兩句我替你續了便提筆寫道祥占早賜投懷燕稽首慈雲禮世尊惜春笑道這兩句是史大姊姊看了林姊姊小照上悟出來的難道叫他天天拜菩薩求子嗎你們瞧我的罷一面笑道花又重開月又圓今生許結再生緣遠辭蓬島三千里許駐塵寰五十年瑤草琪花栽別苑元霜瓊液諦真詮秦台自有神仙路漏泄簫聲上九天湘雲道四妹妹講玄門的話又是一路咱們不懂迎春道我謅的也怕史大妹妹笑話你們高興又不敢不附驥只得集了幾句詩經你們要笑孔夫子已經刪訂過的了由你們去笑罷衆人聽了先好笑起來便催迎春寫道二月初吉文定厥祥天作之合金玉其相寧適不來相怨一方亦既見止懷允不忘菉竹猗猗佩玉將將琴瑟在禦鴛鴦在梁綏我眉壽載弄之璋孝孫有慶俾爾熾爾昌衆人看道這就很好末後連老太太都祝頌在裏頭了邢岫煙笑道我集了四首七絕內中雖帶些戲謔也只可委咎于古人隨寫道芙蓉粉上玩新妝海燕雙棲玳瑁梁今夜月明人盡望溪頭仙子遇裴航生來占斷紫宮春傾國傾城總絕倫雲鬢半偏新睡覺不逢京兆爲誰顰心持半偈萬緣空會向瑤台月下逢百豔再來生倩女桃花依舊笑春風漏聲透入碧窗紗舊是嬌龍小鳳家三扣玉扉人未起覺來紅日又西斜接著李紋李綺各人做了兩首七絕姊妹兩個聯名寫了四首道流水人間一葉紅花開今許問東風莫嫌往歲春遲信春在瀟湘舊院中合是文簫駕彩鸞天香有意護團蕊珠已改升仙劇繡得宮袍下廣寒詠菊詞壇句自仙筆花許放並頭蓮通靈畢竟迷才思早續南華秋水篇日上紗窗竹影重侍妝張敞對芙蓉試描淡淡春山樣記取芳名春未濃衆人看了都道本地風光細膩熨貼探春道怎麽大嫂子兩個妹妹做的詩倒也像在園子裏頭住了多年似的頭裏的事情都明白話未完見寶琴香菱進來道要我們好找誰知你們都在這裏衆人都道估量你們也該來了於是就把賀黛玉新婚詩的話說了要他們也做兩首寶琴道那邊鳳姊姊忙得什麽樣似的你們倒閒情逸致在這裏做詩湘雲道你看我們在這裏又要磨墨又是弄筆肚子裏又要想手裏又要寫還不忙似他們嗎又道算算看如今與林姊姊餞行的人都全了沒有岫煙道只少一個妙師父探春道今兒這一局自然沒有他的香菱道也沒有我別的詩都可以跟著姑娘們學學賀林姑娘新婚取笑我可不敢探春笑道看不出他倒是一個道學先生寶琴道香菱不做我是免不了的便一頭想一頭寫面壁深山萬里遙仙源才認舊藍橋調螺香借生花管引鳳春藏弄玉簫璧種藍田今夜合詩題桐葉幾時飄通靈即是溫郎鏡月下紅絲系一條寫完衆人看道只一起便起得有趣對面文章也貼切湘雲道末後兩句也收得住那大荒山拾回來的這塊玉真是林姑娘一條月下紅絲正評論著只見素雲跑進來告訴李紈道二奶奶叫人收拾娘娘省親的屋子說寶二爺今天要在那裏拜堂呢李紈道那是沒有的事這屋子裏如何敢去開動呢探春道大嫂子你不知道我才在那邊聽說是奉了諭旨賜二哥哥在省親別墅結親還賞錫宮扇雉尾拜堂時候用呢湘雲笑道怪道皇上家的錫典都供了你們的詩料了寶琴便把各人做的詩看過道爲什麽沒有史大姊姊的呢探春道他盡著評論自己的倒不寫出來湘雲道我的詩早已有了就怕送去給林姊姊看了不依我呢說著便寫出來給衆人看道賦罷催妝夜已深鴛綃惹夢醉香林汗融乍試芳脂滑腕怯生憎寶釧沈畫裏素娥空耐冷月中仙子有知音茜紗窗外春迷曉紅日三竿護竹陰探春道怎麽連畫上的人你都取笑他起來了衆人看了只贊他詞句豔麗也不理會一時鳳姐處打發小丫頭過來道二奶奶請姑娘們去瞧戲呢今兒戲文好看差不多唱了半本了探春站起身來道我們過去罷停會兒太太又打發人來叫李紈也叫李紋李綺跟著姊妹們都過去晚上再到園子裏來瞧熱鬧迎春問香菱你太太過來沒有香菱搖搖頭迎春便拉了岫煙都過那邊去各自跟了丫頭一群人出了秋爽齋去了獨有香菱因那邊客多隨了李紈回到稻香村去到了傍晚省親別墅已安排停妥嘉蔭堂綴景閣兩處亦皆燈彩鮮明陳設燦爛自園門首起至省親別墅走嘉蔭堂綴景閣到瀟湘館經由的路上隨著水岸山拗彎彎曲曲兩邊豎起矗燈望去如盤旋兩條火龍一般各處的戲文煞了台不多時重又排場真是筵開玳瑁屏列芙蓉笙簫鼓樂之聲內外叠奏賈赦等陪侍北靜王飲宴家人一起一起的赴午朝門外探聽寶玉殿試的消息等到上了萬言策後肅聽臚傳寶玉中了鼎甲第三名探花加恩即授翰林院編修之職遊街已畢命賜金蓮燈一對送歸省親別墅完姻賞假一年寶玉於午門外尚未起身探信家人飛馬趕回一疊連聲的傳話進來說寶二爺回來了等到一盞茶時候寶玉回來先謝了北靜王並見過賈赦等又進內見了賈母王夫人即刻出來外面鳴鑼開道賈赦先讓北靜王上了轎隨後寶玉坐轎來到林府公館親迎一切奠雁催妝諸禮儀完畢細樂三奏候新人上轎排開執事先是原任京營節度使世襲一等公爵的頭牌次是提督學院又江西督糧兵備道末後是欽賜完姻探花及第兩對朱紅銷金行牌龍頭月斧筆摣沖天棍金銀爪錘等件二十四對擺列齊全馬上吹鼓手賴升林之孝等共二十余對家人並林府管家都披紅騎馬寶玉坐的綠呢玻璃大轎轎前兩對提爐焙茗鋤藥掃紅墨雨雙瑞壽兒等八個小廝一色披了紅坐馬隨在轎後榮府去的十二對丫頭都坐小轎提了宮燈林府陪嫁的十二個女清音一路奏樂黛玉坐的雙鳳盤頂絡珠八寶七香彩輿林榮兩府家人媳婦丫頭坐小轎隨後約有二三裏路長的燈火照耀如同白晝此番比元妃省親也算第二樁興頭體面的事因不用圍幔在兩旁遮擋看的人擁塞當街好比看勝會一般從青龍頭上盤到榮府大門北靜王自帶護從人等回府去了這裏花轎進了大門往儀門向東一座院落內將花轎暫停等候吉時這就是從前元妃歸省更衣之所上房看對鐘錶說要等亥初二刻這會子還是戌正三刻寶玉先到王夫人屋裏坐下早有丫頭們預備參湯伺候送與寶玉喝了幾口湘雲們過去和他鬥耍寶玉也與衆人說說笑笑先是林之孝家的來回鳳姐道剛才打發到那邊公館裏去的人來說迎親的已在那裏起身了晴雯紫鵑兩個也坐了大轎跟林姑娘好不風光鳳姐聽了林家的話忽然想起一件事來便向林家的道你快去找著麝月秋紋兩個人叫立刻就來我有要緊話問他們呢林家的應了一聲即轉身便走鳳姐又叫他回來道倘他兩個人不在一處不論見那一個先叫他來鳳姐性急等了沒半盞茶時便接二連三的打發幾起人去催他們林之孝家的趕到瀟湘館連麝月秋紋的影兒也不見原來他們兩個因這會兒沒事叫碧痕住著他們先往省親別墅瞧熱鬧去了林家的正找得發急有人和他說了便气喘吁吁的跑到省親別墅門外迎面撞著一個家人媳婦把他拉住道正要找你老人家呢這裏地毯有兩條顔色不配還得要換呢林家的聽了把他啐了一口道爲什麽不找管鋪墊的人去我還有閒工夫管這些事嗎一撒手往裏就跑果見麝月秋紋都在林家的喘氣說道跑得我渾身是汗你們不在新屋裏照看著脫滑兒都到這裏來幹什麽璉二奶奶有要緊話問你們快走罷麝月道璉二奶奶從來沒叫過我們有什麽話說呢林家的道你們不知道璉二奶奶的脾氣向來沒有說明白的只叫你們去問話我也不知道爲的是什麽麝月秋紋摸不著頭路只得跟了林之孝家的出園子來正遇著鳳姐打發一起一起的人到來催他們麝月秋紋想我們沒有幹下什麽虧心事倒像拿強盜似的趕這許多人來叫心上轉疑惑起來連林之孝家的也有些發怔便同著來到鳳姐處才進院子又見平兒站著等他們麝月悄向平兒問道你奶奶倒底叫我們做什麽平兒笑道實在連我也不明白快去見了他自然知道的麝月秋紋只得進去見了鳳姐怔怔的站著鳳姐先開口道原是一句沒要緊的話這會兒倒必得先問問你們就爲晴雯他還沒死寶二爺回家來到底知道這件事沒有麝月秋紋聽問是晴雯的話才都放了心便笑道我們都沒提過這話估量別的人也沒有講起若說二爺知道早向我們追根到底的問過幾次了鳳姐聽說便抱怨他們道你們早該告訴二爺一聲才是這會兒不是我想著他不提防見了晴雯免不了失驚打怪也不像一件事這便怎麽好呢林之孝家的站在旁邊見鳳姐著了急便上前陪笑道幸虧奶奶想的到寶二爺見了晴雯真要嚇著他呢奴才的意思不如叫晴雯暫且躲開底下慢慢再和寶二爺說明不知可使得嗎鳳姐搖頭道林姑娘的脾氣如今才進門來的新人把跟他來的人忽然支使開了一時又不便叫人去告訴他兼之晴雯的性子也是難纏的他正興興頭頭的伺候林姑娘進來這裏打發人去叫他走開不說是咱們的好意反疑心有人又要擺布他怕免不了是一鬧麝月介面道二奶奶惦記這件事我就去給二爺告訴明白了鳳姐道且慢著寶二爺現在太太屋裏等吉時拜堂許多人在那裏你著忙的趕去和他講這些話太太聽見了也不便麝月道請二奶奶放心這也算得一件喜事二爺聽了更開心我悄悄和二爺說去包管沒亂兒鳳姐因想不出法兒只得由著麝月去了那麝月走到王夫人屋裏見寶玉正與姑娘們說笑麝月也不避忌衆人走近寶玉身旁道有一件事告訴二爺聽了不知怎樣樂呢二爺可知道晴雯還活著跟林姑娘來呢那知寶玉一聽麝月的話不及細想猛然觸動平日傷痛晴雯之心欲信反疑悲中帶惱登時變色跺足道別再哄我了一個林姑娘好端端的先前都瞞著我這會兒倒說晴雯還活著我如今又不傻又不瘋哄我做什麽呢麝月這句話拿定寶玉聽了歡喜誰料他反著惱臉色都變了怕王夫人聽見責罰一時著急禁不住漲紅了臉欲待把晴雯還陽之事細細講明又礙著裏頭夾些不吉利的話不便講出口來只得籠統說了幾句道上年年底下太太還叫他進來住在大奶奶那裏過了年聽見二爺有信回來他就要出去太太留他不住依舊回去了可是變得出來的謊話嗎因二爺回來事情忙我們也混忘了沒告訴二爺現在姑娘們在這裏可以問得的探春湘雲們衆口一詞道麝月的話是真的晴雯果然還在呢寶玉才信以爲真又如得了一件活寶向麝月問道太太既然不惱了他爲什麽聽見我回來他倒走了呢麝月冷笑道那是各人肚子裏的盤算我那裏知道呢正說著林之孝家的來回吉時已到女眷們族擁著寶玉來到省親別墅有先在綴景閣嘉蔭堂兩處坐的此時也都來了室中燈影繽紛香煙繚繞地上鋪滿了猩紅繡毯衆丫頭扶持黛玉出轎與寶玉並肩站立參拜天地後望北闕謝恩便行夫婦交拜之禮黛玉背後掌了雉尾宮扇二十四個丫環掌燈雁翅排開十二個清音女孩子奏樂音聲嘹亮寶玉此時幾如身在廣寒一眼睃去見扶新人的果有晴雯在內喜極而驚又想起黛玉從前故事猶如看放榜的舉子見榜上有了自己姓名身上又打起戰來的光景一時情不自禁呆呆的向著黛玉口裏說道如今是林妹妹不是我不放心還要瞧瞧呢說著便把黛玉的蓋頭巾揭下對面瞧了一瞧黛玉把頭低下晴雯紫鵑在旁急得沒法又不便過去攔他引得滿屋子裏的人都笑起來鳳姐此時明知寶玉的話不是有意指破他們前番的胡弄聽了未免觸心不覺臉上一紅跼蹐難安又不好躲避只得硬裝出一個不理會的模樣連忙趕過來帶笑把寶玉拉開重新替黛玉罩了蓋頭巾道寶兄弟你好不害臊怎麽還像小孩子似的寶玉見了黛玉的面心已放寬聽鳳姐說他臉上也紅紅的站著不敢擡起頭來當下請賈母過來受禮因在元妃省親之所不敢正坐便向西南坐了受寶玉夫婦行禮賈母滿心歡喜將已往之事一概丟開惟想起黛玉之母不免心上一動只得含笑忍住接著王夫人也照樣見了禮邢夫人尤氏鳳姐並族中諸長輩俱推另日再見衆姊妹都隨著賈母看寶玉拜堂大家高興不料王夫人那邊鬧出一件事來未知鬧的何事下回分解
