body:
  text: 第一回絳珠宮議償恩怨債警幻仙重補離恨天歸鋤子告于友曰紅樓夢一書寫寶黛二人之情真是鑽心嘔血繪影鏤空還淚之說林黛玉承睫方幹已不知賺了普天下之人多少眼淚閱者爲作者所愚一至於此餘欲再敘數十回使死者生之離者合之以釋所憾友曰已有後紅樓續紅樓矣不能掃棄陳言獨標新格歸鋤子曰後續兩書各有所長然寶黛卒合不從自己構思設想濡墨蘸筆而來於心終未釋然是年館塞北其地環境皆山一日燈灺酒闌後夢入一山高峰之下臥一大石五色晶瑩明霞四照見石上迸出兩股泉水點點滴滴如灑淚一般歸鋤子曰石兄有何冤牽遺憾在此垂淚那石頭忽作人言道此名大荒山無稽崖峰爲青埂峰我便是女媧氏補天所遺入世爲通靈寶玉因與絳河仙草有未了情緣千百年抱恨未平淚眼閱人君非太上忘情者盍爲我一試煉石手歸鋤子曰一介凡夫奚克任此石曰我已赴不老情天求女媧氏降太虛幻境商結此案但借足下管城子將紅樓夢截去後二十回補其缺陷使天下後世有情的都成了眷屬我無遺憾矣言畢砉然有聲夢亦驚醒窗外適墜一石大如雞卵有彩色甚異之於是不避雷同且說林黛玉那日行至沁芳橋邊遇見傻大姐告以寶玉娶寶釵一事頓時痛苦迷心怔怔的去看了寶玉一會回到瀟湘館焚巾切齒恨不欲生挨到氣絕的時候一縷香魂離了軀殼才出瀟湘館見一侍嬛含笑迎上道姑娘出來了我來的正好引姑娘回家去呢黛玉定睛一認想了一想道你可不是金釧姐姐嗎黛玉此時似已忘了他是王夫人屋裏的人投井死過的了也不想家在那裏跟著金釧只顧向前行走但聞耳畔風聲身輕如飄蕩雲霧之間停了一會風靜神寧擡頭見一座牌坊甚是高峻前面宮殿巍峨輝煌金碧迥非人間屋宇便向金釧道你爲什麽哄我說回家引到只個地場來別走錯了路了金釧笑道我沒有走錯路姑娘自己忘了家了黛玉聽說定神細想原有些像從前走過的所在正在沈凝已至牌坊底下見上面橫書太虛幻境四個大字兩旁柱上還有對聯正要看時只聽金釧說道姑娘你瞧有人來迎你呢快走幾步罷說著見兩個宮妝女子已到面前瞧著黛玉笑了一笑並不搭話只和金釧說道仙子吩咐請到絳珠宮相見當下回身引路金釧扶著黛玉隨了這兩個女子慢慢行走但見瑤台西峙碧水東流玉宇迢遙青成縹渺又聽得遠遠的鸞鳴鶴唳心境頓清一路觀看到了宮門朱扉雙掩兩個女子也不住步繞過東首又是一座宮院雖不比那一座軒昂也覺規模整肅從正門進內入了儀門兩旁古松老柏瑤樹琪花上面六扇朱漆宮門環銜金獸右首側門內又有兩個宮女站立見了黛玉進來便回身去不多時只聽得咿呀一聲宮門開處有兩對手執彩旄的引道後面衆侍女簇擁著一位仙子出來黛玉舉目細睜似曾見慣一般卻不是園中相伴的姊妹髻簪太真晨嬰之冠足履玄鳳橘文之舄漢儀鎮服玉佩垂裳文彩飄揚形容肅穆似欲下階相迎黛玉趨步拾級而上那仙子笑向黛玉道絳珠別來未久紅塵桃柳己閱十有餘度矣說著攜手同行迤邐繞欄曲折而前進了月洞門覺一股幽香撲鼻吹來比岩桂而尤芳仿湘蘭而更馥靠南一座嵌空玲瓏仙鶴蟠桃水磨花磚牆下方方花台四圍白玉欄杆中間不植雜卉只有三尺餘長一棵芝草迎風搖曳韻致嫣然那仙了一面瞧著黛玉手指那棵芝草道你的靈根夙本倒替你培植得越發暢茂了敘話之間款步上階侍女們拽起珠簾進內施禮讓坐仙子道我到此間本不應僭坐但絳珠今日還算是客不必謙讓於是黛玉坐了客位見室中雕飾精工鋪陳華麗暖閣面前大紅顧繡幔帳兩旁金鈎挂起中設公座心內躊躇未定早有侍女獻茶黛玉接杯見茶之顔色如秋露春雲精光四射才一沾唇便覺香沁肺腑那仙子道此茶乃在放春山遺香洞外采蠲忿花與忘憂草上的露珠按七返九還法煉成異於千紅一窟正與你對症的黛玉未及答言那仙子又道你的職司我在此兼攝原因女媧氏當初煉石補天未將離恨天補完留了一石後來欲將所遺之石補上再無神手可完女媧氏未竣之工致此石化爲神瑛時在靈河岸走動隨有你們這一段公案牽連此間幾個人入世早就注定冊上鐵案難移若論你夙債已償我兼攝之職本該就此交替誰想你忘卻本來悮入癡情司裏未免太苦了況且你爲酬報灌溉之恩若如此撒手反做了天下古今第一樁恨事不是酬恩竟是報怨了前日女媧氏亦來商此案我邀了三生石離恨天諸位仙姬到來再三參酌暫借三生石補了離恨天缺陷把金陵十二冊抽改幾頁絳珠此去但請寬懷你這幾年來還他的眼淚涓涓滴滴流到恨海把那眼淚流充溢地方填起寶來適符金祇祗園區數每區可計萬金知照福德財神遣差護持移運看守將來一併交完使者如此答報可謂美滿前程再無遺恨算與你籌畫盡情的了黛玉聽說茫無頭緒一面警幻仙子複又傳了薄命司裏的人來指授黛玉演算法不多時見金釧走近前來回道是時候了請絳珠仙子起身罷那仙子便道後會有期絳珠請回不便久留說著一齊站起送至宮門外囑金釧引回一時仍依原路行走金釧向黛玉道我家裏還有一個老娘並無依靠只有妹妹玉釧兒底下要姑娘照應話未完霎時回到瀟湘館且說李宮裁和探春兩個人見黛玉氣絕了想起平日姊妹情分又瞧這樣光景大哭一場隨後雪雁也趕了回來與李媽媽小丫頭們哭的哭嚷的嚷亂了一回挨到天明探春同了侍書先自回去了李紈在外間屋裏喚了李媽媽出來說道你瞧紫鵑竟像要哭死的了去勸勸他是正經李媽答道何曾沒有勸他呢他總不理也沒法兒李紈見小丫頭們一個個東倒西歪在那裏磕睡又道他們熬了這一夜是靠不住的還得你留點子神說不得辛苦再熬上一半天也算盡了你的心了李媽道何嘗不是呢我奶了姑娘一場白落了個空說著便抽抽噎噎的哭起來李紈道原是我的話不留神倒傷了你的心了你老人家別哭罷裏頭也去瞧瞧我要回去走一趟呢李紈正要出門只聽那邊屋子裏一個小丫頭哭著叫紫鵑姊姊李紈回身轉來徑到紫鵑屋裏見紫鵑已暈倒在炕李媽也趕了過來同小丫頭們喚了他一會漸漸蘇醒李紈吩咐了雪雁春纖幾句話然後回到稻香村蘭哥兒瞧著李紈道媽媽像夜兒沒有睡覺呢我想林姑娘自己害病死的爲什麽人家說是璉二嬸子害死的呢李紈忙喝道胡說這是那裏聽了混帳老婆子的話仔細太太聽見了捶你說著便進裏邊和衣躺著賈蘭一個人吃了飯自去上學不多時瀟湘館裏一個小丫頭急忙忙趕來請李紈說紫鵑姊姊也死了李紈只得起身胡亂洗了洗臉趕到瀟湘館先進紫鵑屋裏只有春纖站在炕邊垂淚李紈走近炕沿叫小丫頭攜過燈來一照把手摸了摸說手是冰冷的氣還沒有絕正要和春纖講話見小丫頭進來說林大娘請大奶奶呢李紈出來林之孝家的回道就是這件東西八下裏找個難聽說還是周瑞家的女婿姓冷的央了馮大爺去轉了個彎子才讓給咱們的雖然多花了幾兩銀子東西再沒得說的太太同奶奶們在老太太面上心裏也過得去現在外面漆了一糙趕著把裏子托出來晚上就有了李紈道既是這麽著很好這會兒還得再去弄一個林之孝家的聽了怔怔的瞅著李紈李紈道你不知紫鵑這丫頭也保不住像要跟著林姑娘一搭兒走的了林家的道昨兒見他好好的不是二奶奶要叫他我還碰了他一個釘子忽然又怎麽了李紈拭淚道他傷心林姑娘暈了過去如今看是不中用的了林家的道哭是哭不死人的紫鵑果然是這樣早就該退送他出去不過賞給他家裏幾兩銀子是有舊例的裏頭向來沒有給丫頭裝裹買棺材的事正說著探春走來聽見問起緣由便向林家的道爲了林姑娘的事這裏幾個人都鬧得心慌意亂的誰還留心到紫鵑身上去人已死了難道把一個死人推了出去說不得舊例新例只可聽大奶奶的吩咐差不多的再買一口來叫他親人進來看一看胡弄局兒收拾了他往園子後門擡了出去就是了消停幾天那邊去回一聲也使得林家的聽了探春這一番話再不敢駁回只得應了一聲是忽聽得里間老婆子小丫頭們直聲驚喊春纖嚇得臉上失色跑到外邊告訴道剛才見姑娘的手動呢雪雁正在院子裏晾手帕子忙趕進來道別姑娘活了李紈道一個癡的一個又成傻的了當真你們留心別有貓兒跳動衆人你扯我推都不敢上前李媽道姑娘是我奶過的怕什麽說著要過去瞧看才走了兩步見黛玉的手又是一動由不得喊聲啊喲栽倒地上探春便嚷著林之孝家的引了衆人上去那雪雁到底是伺候黛玉慣的人心上關切便不害怕擋前走近床邊細瞧黛玉口鼻間微有氣息臉上神色亦轉了過來便用手去胸前一摸微覺溫和連忙過來叫大奶奶三姑娘道你們不信當真姑娘已有了氣身上也溫暖起來了李紈探春忙進來瞧著向雪雁道有現成參湯快端來給你姑娘灌下雪雁忙尋著前兒用剩的半盞倒在銀吊子裏頭親自拿到外邊風爐上暖好傾在茶杯裏端到黛玉身邊把杯子遞給春纖就向杯中超了一小匙灌在黛玉口內尚未能全受李紈站在旁邊輕輕說道蠢丫頭你把姑娘略略攙起些那麽才好灌呢雪雁忙叫小丫頭找塊手帕子來接過與黛玉圍住兩腮把左手襯入項頸略略扶起將參湯慢慢灌下見黛玉雙眼微開輕輕的喊了一聲啊喲我走得乏了衆人都說回過來了李紈便叫李媽和雪雁兩個人把黛玉的裝裹寬卸仍換了隨常用的被褥叫他們都靜靜的等林姑娘養養神當下點起安神香一面端整湯水小心伺候再說紫鵑傷心昏暈一魂出殼渺渺茫茫似無去路只在沁芳橋怡紅院一帶回繞那時金釧送回黛玉來見了紫鵑問道妹妹要往那裏去紫鵑應道我找姑娘呢金釧道林姑娘在他自己屋裏你快回去罷紫鵑還要問話被金釧一把拉在瀟湘館門首笑道又送回來一個順手把紫鵑一推跌進院門魂複歸舍蘇醒過來小丫頭報知李紈探春過去看明叮囑小丫頭們用心照應又叫人去告訴了林之孝家的話同探春出了瀟湘館李紈自回稻香村去探春到了秋爽齋不多一會見小紅同了侍書跑得喘吁吁的趕來道老爺就要起身二奶奶叫我來請姑娘先到瀟湘館去問他們說大奶奶同姑娘已經走了就和侍書姊姊找到姑娘這裏來的老太太太太都在寶二爺新屋子裏我還去請大奶奶呢說著飛跑的走了探春便換了衣服帶著侍書去送賈政講到寶玉病根所起數年來鬱結於中無可告語前聽鳳姐說娶林妹妹的謊話正似醍醐灌頂心竅皆通如何忘得了這句話今拜堂後把寶釵兜巾揭去見不是黛玉心裏便幌了幾幌頓時如入夢境一般忙向襲人盤問襲人又是藏頭露尾的話寶玉越發瘋傻起來瞧著寶釵叫林妹妹道你自瑤台月殿下來的原非俗骨凡胎也能變化我知你要變了寶姊姊來試我的心難道我的心你還不知道快變過來罷鳳姐在旁沒法兒只得上前勸慰寶玉又哭著拉住他說要在你身上變還我一個林妹妹的鳳姐見寶玉鬧的利害只得順著他的意思謊說道林妹妹是愛靜的你要那麽混鬧他一輩子不肯變過來呢寶兄弟你也乏了快安安頓頓去睡一覺罷寶玉聽了這話便不言語襲人等服侍他睡下賈母王夫人各自去安歇到了次日賈政因除授江西糧道憑限緊迫請訓後即於是日束裝起程知賈在寶玉屋裏進來站在外間請出賈母來叩辭說了幾句遠離膝下不能侍奉晨昏的話賈母也叮嚀了路途保重一番便叫襲人扶寶玉出來向賈政跪下磕了四個頭口是呆呆的跪著襲人狠命攙扶他不起賈政本想訓飭寶玉兒句話因才完姻之後又在病中見賈母在此只得縮住了口便喝道你還不起來做什麽寶玉道兒子有一句話怪不明白要回老爺賈母見寶玉跪在地上多時便道好孩子你有什麽話回你老子快起來講別這樣寶玉只得起身站立定一定神向賈政回道老爺給兒子娶的到底是林妹妹是寶姊姊若說娶的是姊姊人家不該哄我說是林妹妹若說取的林妹妹不該換了寶姊姊去咱們上上下下的人都說娶的是林姑娘如今來了寶姊姊叫林妹妹知道了便怎麽樣呢話未完賈政一面聽著甚爲駭異原來指鹿爲馬的詭計裏頭只瞞著賈政聽寶玉之言不像是瘋話其中必有緣故便向王夫人道寶玉的話是怎麽樣的你自然該知道這些王夫人一時無詞可答鳳姐在旁急得臉漲通紅那時李紈探春都到了也捏了一把汗賈母此時沒法兒不出頭攬到自己身上道這話原是有因的我先前喜歡林丫頭大概同寶玉差不多原起過這條心想來寶玉這孩子看光景也猜著我的意思後來我瞧林丫頭總是那麽多病多災不像個享福壽的樣兒又冷了這個念頭鳳丫頭說起金玉姻緣咱們去求了姨太太一說就定了是瞞著寶玉的不知誰在他跟前錯說了一句娶林丫頭的話如今在這裏嘮叨呢賈政聽了賈母這番話心裏很不受用想老太太既然早有這個甥女兒的性情品格很配得過寶玉如今姨甥女呢也好但不該鬧出這些謠言來又想起當年兄妹情分他母親只留得這一點血脈雖然在此相依也怪可憐的意欲埋怨王夫人幾句因這件事有老太太在裏頭且木已成舟說也無用只得按納住了便問道我聽說天天請醫生到園子裏去給甥女兒瞧病不知見些效沒有王夫人正要開口鳳姐因賈政起程吉日又恐聽了傷心把黛玉的兇信瞞住便回道因是林妹妹的體氣太弱總是好幾天病幾天現在上緊給他調治不過是這麽樣呢賈政歎了一聲拭了幾點淚便辭了賈母又囑咐王夫人幾句話王夫人同李紈鳳姐探春等送了賈政出去寶釵雖算新人因是姨甥女也隨在探惜姊妹隊裏一面鴛鴦扶著賈母自回房去寶玉屋裏只剩得襲人麝月秋紋和小丫頭們襲人見寶玉此時有些清楚便道小祖宗剛才把我的魂都嚇掉了呢怎麽你從來不敢在老爺跟前說話今兒忽然這樣胡說亂道起來不怕老爺捶你寶玉聽了生氣道你還說我呢剛才老爺駁我一個字回嗎我正要討老爺一個示下你們又拉了我進來到底老爺說明白了沒有給我娶的是誰寶玉連問幾聲襲人們總不回答寶玉越發氣急死命拉著襲人要往園子裏去瞧林妹妹那時襲人只知黛玉已死尚未聽見回過來的信深悉寶玉病根又想此事不能隱瞞到底譬如外科療病一味消散不趁早開刀使忍一痛將來日事因循精神耗乏攻補兩難必成不救之症主意已定不如說明使他大慟一場之後倒可漸漸的冷了心了便向寶玉道我老實和你說了老爺原要給你娶林姑娘因爲林姑娘病重大夫都回絕的了所以娶寶姑娘來應你的好日子林姑娘昨兒晚上已成仙去了要不是寶姑娘和你好他肯來替死鬼林姑娘嗎別不知好歹還不感激寶姑娘呢寶玉聽了這話頓時兩眼往上一翻暈過去了麝月一見便咬得牙齒石爭石爭的指著襲人恨道都是你鬧出來的事呢襲人也嚇得冷汗直流手都提不起來只是怔怔的呆看麝月連忙上前左手把寶玉扶起右手掐住人中秋紋幫著亂叫寶玉小丫頭飛跑出去王夫人同李紈一衆人都已回來見小丫頭臉上失色襲人們一片悽楚之聲在裏邊叫喚王夫人等急忙趕緊釵只站在一旁暗暗拭淚鳳姐上前瞧了一瞧道請太太放心一面自己上炕來把寶玉抱住叫取定神丸來沖服又叫外邊去請王太醫這會兒且別去驚動老太太不說衆人在此忙亂且講寶玉暈去自知身軀臥病在炕只見眼前一亮先前失去的通靈玉在面前一幌想要去拿盡是使勁總提不起手來轉念又想我因有了這一件東西鬧出這些意外的事來不如把他捨棄依舊閉上了眼聽得有人說道何不就把這件東西交還了他又聽一個人說道他是不肯做負心人的要應他講過這一句話的咱們且到大荒山青埂峰前去等他寶玉睜眼看時就是頭裏發狂病的時候來救度他這個僧人還有個道士霎時轉身走了寶玉聽了剛才的話有所感悟想我就死了去見林妹妹我這一個心也不能剖開來給他瞧瞧除非走這一條路還可把我的心明一明對得住林妹妹萬分之一但是老太太太太這樣疼我老爺總責我不肯念書無非望我成名一第之榮便是顯揚報答若是就那麽抛撇乾淨了我不能挽回我不肯念書的罪孽老太太太太在老爺跟前說不上我肯念書的真憑實據也白疼了我必得如此聊可塞責一時主見才定即便蘇醒鳳姐與襲人等正在灌治都說好了王夫人寶釵與衆人都放了心一時賈蘭陪王太醫進來看了脈說神氣清正脈息和平比前幾天迥然各別只消服幾劑滋補藥靜養一半個月便全愈了仍是賈蘭陪去開方王夫人回到自己屋裏李紈探春也隨了過來賈蘭拿了藥方送與王夫人看過只見鴛鴦進來向李紈道老太太問林姑娘東西備停當了沒有叫大奶奶諸事留點心兒老太太還要親自過去瞧瞧呢李紈笑道怪道只兩天人都鬧昏了也沒給老太太送個喜信你不知道林姑娘已經回過來了鴛鴦聽說還不信有這件事賈蘭在旁介面道真的剛才我還陪大夫去看脈呢接著鳳姐也來聽見了便道咱們跟了太太去報老太太個喜當下賈蘭自回園子裏去了王夫人引著李紈鳳姐等到賈母屋裏回明黛玉回生之事賈母聽了自然歡慰又道別是殘燈複明不過延挨時日那倒不好他又受苦咱們瞧了傷心李紈道請老祖宗寬心我和三妹妹都在那邊瞧過的大概可保平安了賈母點點頭一面問鴛鴦道該是擺飯的時候了留奶奶姑娘們都在這裏吃飯你快到園子裏去跑一趟瞧瞧林姑娘就來鳳姐道人多了怕坐不開寶妹妹還是新媳婦兒靜靜的一個坐著咱們分幾個人去陪他賈母道我道你們都在這裏了倒忘了他那麽珠兒媳婦同四丫頭在這裏鳳哥兒你同三丫頭過去又向王夫人道你也回去歇歇著當下王夫人先起身走了鳳姐同探春仍回寶釵屋裏見林之孝家的正在那裏找二奶奶鳳姐問道你有什麽話回林家的答道也沒有要緊的事停會兒去回大奶奶罷一時端上飯來鳳姐探春陪寶釵吃了飯麝月秋紋正要出去鳳姐叫回住著一面對探春道聽寶兄弟才間回老爺的話竟是一團道理清清楚楚那裏像有一點瘋病樣兒探春道不是那麽講他在老爺跟前敢回這些話聽不得他的說話清楚那就是他的病鳳姐道這也別去講他我要問麝月寶二爺好好的爲什麽忽然這樣起來麝月道那是襲人不知他什麽主意把林姑娘的事直說了出來寶二爺聽了就哭暈了去寶釵口雖不言心想襲人是個精細的人不肯造次那麽使他一痛後再下針砭也是一法鳳姐沈凝了半晌道林姑娘回過來的話寶二爺知道了沒有呢麝月道我們才聽見這句話誰和他說呢鳳姐道你們過去寶二爺跟前再別提起林姑娘回過來的話襲人沒有什麽事叫他就過來麝月答應便同秋紋出去那邊素雲提了燈進來問三姑娘可就要回去奶奶在老太太那裏穿堂外等著同走呢探春便起身道兩位嫂子少陪說著帶了侍書素雲提燈照著來到穿堂外李紈叫賈母處跟來的老婆子自回去同了探春才進園裏見翠墨也提了燈來一搭兒走到藕香榭山坡前各自分路回去這裏鳳姐見襲人來了便問道麝月說寶二爺鬧的不好你和他講了什麽話才那麽著的襲人道這原是我的糊塗想頭幸虧好了不然還有我的命嗎鳳姐道很不糊塗這會兒瞧寶玉的光景怎麽著襲人道剛才吃了王太醫的藥睡得安靜瞧他神氣也清爽了些鳳姐道何如他知道死者不能複生那些糊塗想頭就不起了然後調養起來心安體泰怕他的病不一天好似一天嗎如今林姑娘回了過來底下的事情倒有些作難了襲人道二奶奶的主意便怎麽樣呢鳳姐道先前是明修棧道暗度陳倉如今說不得要用瞞天過海之法了未知鳳姐有何妙策再看下回分解
