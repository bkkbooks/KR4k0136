body:
  text: 第二十一回賜聯秦晉詔下南京賞賜奇珍恩頒北闕話說甄府家人回明瞭甄母的話見榮府寶玉正在上房便向寶玉打了一個千道恭喜二爺快請換了冠帶預備接旨寶玉茫然不知來由道爲的什麽事要我接旨甄家的人道說起話長請到書房講給二爺聽甄母道何必請哥兒到書房去就在這裏講了也叫大家聽聽那家人向甄母回道咱家哥兒進京老爺知道榮府哥兒這件事告訴北靜王北靜王面奏當今因念賈娘娘已故這位哥兒就是娘娘的胞弟當今推念戚舊調哥兒中式的文章瞧了大喜道好的了不得又因林府小姐的父親就是做過鹽政的林如海老爺當今念他清官無後上年已有賞賜他家這位姐兒自幼寄住舅家那一年娘娘回府省親見過林府姐兒極口誇他的才學鳳藻宮已曾鐫選詩章合該與榮府銜玉而生這一位哥兒訂配良緣就傳諭旨命北靜王爲媒欽天監選定吉日聽說就在殿試這一天完婚所以差老公公下來召哥兒進京定有什麽恩典老公公先到這裏還要到揚州林老爺家去呢奴才見碼頭上已有許多官員在那裏候接這會兒差使約好到快奴才出去叫他們預備說著連忙退出這裏甄母便叫把自家寶玉的大衣服取出給榮府哥兒更換管家媳婦忙應道上年這位哥兒來的時候老太太說叫送一副衣帽出去因哥兒不曾更換還擱著呢甄母點頭就叫去取來一時取到鳳姐此時才得放心趕忙出來給寶玉更換另取一頂網巾紮好了添上假髮再戴金冠叫聲寶兄弟如今可信了現有旨諭下來北靜王爲媒也是哄你不成旁邊管家媳婦也笑道哥兒是要有了旨諭才還俗的聽說跟哥兒的小廝爲他主兒也把頭髮鉸了倒是難得的如今也該改裝了鳳姐忙問寶玉道我正不明白這個人是誰寶玉便把焙茗出家路上遇見收留的緣故略敘了幾句鳳姐道原來就是焙茗怪道他去了多時連音信都沒有了說著聽見外面嚷說旨諭到了快請榮府哥兒接旨寶玉已經冠帶趨步至大廳上甄府家人早將香案排好寶玉行三跪九叩禮聽內監宣讀詔書寶玉三呼謝恩畢然後與內侍相見就是常到榮府走動的夏秉忠太監素與寶玉熟識略敘浮文夏太監極口稱誦主子隆恩無非垂念椒房之戚的意思夏太監起身告辭說要到令姑丈林老爺府上去走一趟主子還有恩典寶玉送至門外候夏太監上馬而回寶玉因欽限緊急不能同鳳姐行走定于次日先後起程甄府忙亂備席餞行鳳姐因寶玉在此攪擾多時命周瑞家的端整銀兩內外僕婦丫頭小廝及廚房人等斟酌輕重各有賞賜當夜吩咐周瑞仍留在南邊辦他的事不必同回家裏寶玉憶及柳湘蓮臨別之言取出鴛鴦劍交與包勇命他自到揚州等候護送新親並珍重鴛鴦劍的話包勇唯唯聽命又將脫換下來的僧衣僧履交付焙茗收藏不可撩棄此是寶玉切己之事非鳳姐所得而知一一自己經心其餘任憑鳳姐主裁鳳姐因帶來的家人周瑞包勇與寶玉分路行走不夠使用有甄老爺京裏差來的人就要回京鳳姐便叫一個家人同了甄家的人與焙茗跟了寶玉同行甄母先已送了寶玉兩套新制的便服次早起身鳳姐引了寶玉同到甄母處叩謝自己又與甄府衆姊妹辭別叫寶玉先走叮囑他路上小心又笑道我可是瞎操心如今你是不比先前什麽大荒山小荒山一個人能跑來跑去的跑了還怕什麽呢寶玉笑著自走了鳳姐然後告辭甄母將待下階相送鳳姐阻止再三甄母才道恕我年邁無禮叫孫女兒們代送罷衆姊妹聯袂上前送鳳姐至穿堂上轎鳳姐出了甄府自與寶玉分路進京不提且說夏太監來到揚州地方官辦差一般忙碌林府得知信息早邀內親在家款陪欽差因有賞賜黛玉物件林老太太穿了二品命服引領黛玉謝恩畢黛玉回避夏太監又與林老太太道喜道主子時常和咱們提起這裏如海公居官清正一任鹽使兩袖清風念他生前沒有哥兒上年頒了許多恩典下來前兒北靜王面奏主子爲的是榮國府那位銜玉而生的哥兒和這裏如海公的千金有一段未了姻緣主子很惦記這件事就命北靜王作媒欽天監選的吉日叫這裏趕緊把姐兒送進京去完婚北靜王那裏過幾天也就有人來如今娘娘賞的內造妝蟒四端珠冠一頂玉帶一圍還有赤金嵌寶鎮衣一盤上面鐫的字樣聽見北靜王奏的榮國公曾孫寶玉這塊玉上幾個最吉慶的字就叫照著樣兒鐫在鎖上取個夫唱婦隨的意思當今聖天子百靈呵護造福錫嘏也配得過哥兒這塊玉了說著哈哈大笑一面設宴自有人陪侍夏太監入席一坐即行起身別無耽擱徑自回京覆旨這裏林府遠近親族都來賀喜冠蓋絡繹林老太太命將欽賜之物送進黛玉房中紫鵑先在那邊正廳屏風後聽夏太監講的金鎖一節便去告訴了黛玉此時送進妝蟒等物逐一請黛玉過目然後與雪雁收拾櫥櫃出來安放黛玉看到金鎖上面字樣果與通靈寶玉相同暗想當今體貼人情無微不至雖九重寵錫毫無補於恨海情天但外觀顯赫亦足爲勢利人吐氣揚眉若不遭蹭蹬早早完就姻緣焉得有此榮顯正是俗語道的不是一番寒徹骨焉得梅花撲鼻香可見人謀究不足以勝天自是滿心歡喜林老太太屈指吉期已近趕緊置辦妝奩因銀錢便易人手衆多揚州繁華之地那一件不可咄嗟而辦因是皇上賜婚一切俱要分外體面不惜花費銀兩先命家人帶了幾萬銀子進京置買房産爲送親住歇公館包勇自南京回揚州先到林府稟明留此隨同送親的話林府自然喚進裏邊衆家人連日奔忙所辦妝奩極其豐厚余外奩田一千畝幾張契紙俱挑附近榮府南邊莊子一帶膏腴又準備奩銀十萬裝鞘運送諸事完備專等北靜王處同榮府家人到來起程講到榮府已先見了旨諭賈母王夫人歡喜也要趕辦迎親禮物諸事匆忙鳳姐又不在家如何料理得開平兒回了王夫人要請東府珍大奶奶過來同大奶奶幫辦王夫人應允於是尤氏同李紈便常在王夫人處幫理因銀錢不能寬裕諸事掣肘鴛鴦看出光景知道鳳姐有些積蓄已運送老爺任上墊了虧空璉二爺外邊饑荒又大如今添出這件事怎樣張羅得開呢白請珍大奶奶過來便八隻手叫他也沒法兒主意已定便趁賈母歡喜的時候說林姑娘到底有福氣寶玉做和尚倒做出好來了北靜王作媒聽說娘娘還賞了林姑娘好些東西今番寶玉做親可不比先前娶寶姑娘自然要像個局面才襯得起來呢賈母道頭裏娶寶丫頭因爲國孝家孝兩層諸事潦草連鼓樂也不用原不成一件事到底不吉利如今鳳丫頭偏偏走開不知多早晚才回來叫珍兒媳婦過來幫珠兒媳婦辦這件事怕他們都是生手費力呢鴛鴦笑道倒不怕生手橫豎有平兒在那裏素日跟著他奶奶經由的事也不少珠大奶奶本來細心東府裏大奶奶也是見過陣仗的就是巧媳婦做不出無米飯是頭一件難事賈母道虧你提醒我這句話先前叫璉兒寫過賞單有人找得寶玉回來賞他們一萬銀子如今省了這一宗且叫他們拿去使了也算花的是歡喜錢差不多夠了鴛鴦道老祖宗願意墊補在裏頭盡仔好賈母道我也是八十多歲的人了留的銀子總是他們的先前錯了主意鬧的顛顛倒倒趁著這會兒我眼還沒閉看他們完聚了孫子媳婦就是我的外孫女兒頭裏又在一堆兒疼了他這幾年我很樂呢你就去找出銀櫃上的鑰匙來告訴太太叫他們來搬了一萬銀子去當下鴛鴦便到王夫人處告訴了賈母的話王夫人等賈璉回來叫平兒領了幾個老婆子徑找鴛鴦搬運銀子發到庫上榮府正在內外忙亂門上報道寶二爺回來了原來寶玉起身後兼程趕進京來才到甯榮兩府街前先是焙茗一馬沖前進府來門上因從前錯認寶玉一事上前仔細認明見有焙茗在內料不致再錯都打千道喜垂手讓寶玉過去從二門口一疊連聲傳話到賈母王夫人處李紈尤氏都在賈母屋裏議論趕辦寶玉喜事的話王夫人說起老太太真疼愛寶玉連家裏帶來的老替己昨兒都挪出來墊在裏頭了正說道聽見外邊丫頭們哄傳寶玉回來一語未了寶玉早已走進先向賈母磕頭賈母便把寶玉抱在懷裏只是好孩子好寶貝的亂叫不知從那句話問起才好便推寶玉去見王夫人說寶玉這會兒才到別說他什麽王夫人拉了寶玉的手見他照常冠帶竟似忘了他上年削髮一事並不瞧他頭上只是呆呆的看了一回也沒一句話尤氏開口笑道寶兄弟出去跑了一趟虧你把失去的玉找了回來如今重重喜事咱們喝不了你的喜酒呢賈母道正是珍大嫂子天天過來幫著你太太大嫂子辦事快先過去謝謝寶玉然後與尤氏李紈見過了禮賈母又叫寶玉道你鳳姊姊路上好喲爲什麽不同著回來寶玉說明分路行走的話接著探春惜春邢岫煙進來各各相見已畢大家坐定邢岫煙說起上年四妹妹詳解妙師父扶的乩真是過後好詳四妹妹獨有先見之明可是要佩服他寶兄弟才走的時候比月之方墮花之初謝畢竟墮後可望東升謝了逢春又發去年冬寒雪凍之時不必尋訪不是今年才交立春就有甄寶玉來報信嗎探春道果然詳的不錯不但這一回准我想先前失玉妙師父也扶過乩二哥哥你這塊玉是什麽所在尋回來的寶玉道這個地場可是人迹不能到的在大荒山青埂峰底下探春道何如你們可記得有青埂峰下倚孤松入我門來一笑逢這兩句嗎寶玉聽了拍手笑道可不是那青埂峰前還有一株大松樹呢就是入我門來這一句也寓真詮不入他的門焉能得我的玉可見我此番和尚做的有功說著滿屋子裏一瞧道爲什麽寶姊姊不見王夫人聽問到寶釵一陣心酸止不住淚珠直滾便向寶玉道你還要提寶姊姊鳳姊姊沒有和你講嗎寶玉道鳳姊姊沒有和我講什麽呢王夫人歎了一聲道都是爲了你寶丫頭已經苦死了寶玉放聲一哭登時暈去急得王夫人李紈等手足無措賈母只是念佛抱怨王夫人不該就告訴他這話惜春在旁勸道老祖宗別著急二哥哥是這樣的停一會就醒過來喲尤氏李紈不住的叫寶兄弟王夫人亦自悔話講的太急我料他心上只有一個林姑娘那知他聽了寶丫頭不在的話一般也是那麽樣傷心便含著一包眼淚連叫寶玉不多時寶玉醒轉哭道寶姊姊我害了你了不是我害你還是人家害了你也別怪人家來害你歸根兒你自己看不透錯了一點主意自己害了自己了便問設靈在於何處李紈等恐寶玉見了傷心勸他且在賈母屋裏歇息寶玉那裏肯聽賈母知道拗他不過只好由他過去一拜以盡夫婦情分也是禮上應該惟囑咐尤氏李紈們陪他過去從旁勸慰一時麝月秋紋都趕了過來隨著李紈們同寶玉至寶釵設靈處所上香禮拜問明棺樞已停鐵檻寺遺衣挂壁穗帳淒涼又哭了一場被衆人勸住只聽得賈璉在院內一路笑聲進來叫道寶兄弟回來了嗎寶玉迎出相見回進裏邊坐了尤氏李紈各自散出仍到賈母處回明寶兄弟同他璉二哥哥說話呢這裏賈璉道寶兄弟在南京見過夏公公了走的真快倒趕上場期了早上部裏已奉旨諭賈寶玉到了不必去謝恩先命禮部備卷送場等揭曉後另旨召見場期近了該靜養幾天寶玉告訴了和鳳姐分路行走的話賈璉道剛才聽同來甄家的人說起都知道的了甄老爺那裏寶兄弟該去走一趟寶玉道這兩天也顧不上只好等場後再去罷賈璉因事忙不及久坐說了幾句話就走了一時老婆子們搬進寶玉鋪蓋衣包麝月秋紋上前檢點便問今晚在那裏住歇寶玉道你們安頓我在那裏就住問我什麽呢麝月道頭裏這些事都是襲人經由慣的怕我們幹不了白問二爺一句寶玉道正是襲人爲什麽不見呢麝月道二爺問襲人嗎麝月說了這句話又縮住了口寶玉道襲人怎麽樣爲什麽又不言語了秋紋道奶奶不在了二爺已經知道襲人的事瞞得到底嗎寶玉吃驚道莫非襲人也死了秋紋道果然死了也罷寶玉道不死就是病著麝月道說起這件事也不是出於襲人情願二爺聽了別生氣襲人去嫁了蔣琪官了寶玉笑道一個人死了沒法兒到棺材裏去拉他起來他嫁了人有什麽要緊要他回來也不難麝月秋紋聽了寶玉的話都好笑起來也不說明襲人已經退回在家的話過了幾日寶玉振刷精神入場鳳姐在路上緊趕趨回家先到王夫人屋裏見玉釧彩雲這幾個人都忙亂的辦寶玉娶親的零星事件鳳姐便與王夫人見過說明定聘一事那塊通靈玉當面交給林妹妹的嬸娘自然林妹妹過門的時候帶來一面在脖子上除下金鎖遞與王夫人道這是他家回來的東西因爲林妹妹心愛之物拿來配寶兄弟這塊玉的王夫人瞧了一瞧道向來沒見林姑娘挂這個倒像寶丫頭挂的也有那麽一盤王夫人才說出口想起林姑娘此時回聘的東西要取個吉利寶丫頭已不壽而亡這會兒不該提起這話來便默默無語鳳姐錯會王夫人睹物傷心不敢回明寶釵病凶時失脫金鎖一事更不便將林姑娘家應兆得鎖一節敍述只得含糊支飾過去王夫人便把金鎖交玉釧收好向鳳姐笑道寶玉這件事真拖累你了等他們圓了房好好給你陪禮酬勞呢鳳姐道罷喲任憑他們惱我也好不惱我也好盡了的心就是了不敢在太太跟前指山賣磨這一趟要算走有功這裏沒有人去和林妹妹說明猛一下子有了什麽諭憑你北靜王南靜王作媒林妹妹這性子保不定倒要鬧出事來呢說著又回了林嬸娘家怎樣款待還到南京甄家的話便站起身來道還沒見老太太當下便到賈母屋裏來一進院門見琥珀同小丫頭們在院子裏放風箏鳳姐笑道你們好樂喲琥珀見了鳳姐把風箏遞給小丫頭跟著鳳姐進屋道二奶奶回來了賈母正歪在炕上閉著眼兩個小丫頭跪在炕沿上捶腿聽見說鳳姐回來便睜眼一看道估量著這幾天裏頭你該回來鳳姐忙上前請安道在路上天天耳熱知道老祖宗在家裏盼望說我呢林妹妹給老祖宗請安賈母道林丫頭好你瞧他果然不像先前這樣瘦弱了鳳姐道比老婆子回來講的樣兒越發長的富泰了咱們同林妹妹家裏都托老祖宗的福姑爹姑媽的墳墓起造的怪體面上年秋裏諭祭諭葬林妹妹回去這一趟可巧兒趕上如今又得了恩典夏公公也到林妹妹家去不知賞些什麽東西林妹妹家裏也很有勢派他嬸娘做人寬厚同咱們的太太差不多脾氣待他侄女兒是再沒的說了鳳姐這番話滿想賈母聽的歡喜那知賈母因聽到祭葬一事思女心傷未免掉下幾點淚來鳳姐揣度賈母之意又講了寶玉蒙召賜婚的興頭話才轉悲爲喜鳳姐又說甄家的光景道甄老太太同老祖宗一般康健甄老爺複官後門第照舊又把來去路上風景講了一會賈母命去歇息瞧你姐兒去罷鳳姐回到自己院裏平兒早引著巧姐迎了出來請安鳳姐問姐兒這幾時淘氣沒有平兒道倒還好夜裏總不要他奶媽就跟著我歇呢鳳姐一面聽平兒說話見家人媳婦丫頭老婆子都候著請安鳳姐走進屋裏見行李都已安放停當自有平兒查明不必再問坐下便道寶玉如今做親比先前娶寶姑娘的費用要加幾倍我可再沒有什麽賠墊下去不知二爺打什麽主意平兒道剛才太太沒有和奶奶說嗎鳳姐道太太說什麽我在太太屋裏也坐的不久就去見了老太太來的平兒道老太太挪出一萬銀子已經發在庫上估量辦這件事添補有限的了鳳姐道有了一萬銀子也差不多了怕又是二爺去搗鬼出來的平兒道二爺倒沒開口前兒聽鴛鴦的口氣像是他瞧出咱們手頭光景不知在老太太跟前說了些什麽話老太太高興就叫搬出這宗銀子來的東府裏珍大奶奶也天天過來幫著大奶奶辦事呢今兒珍大爺不知請什麽客珍大奶奶沒過來大奶奶才回園子裏去了鳳姐道我先過東府裏去走一趟回來看看大奶奶姑娘們算了結這篇帳了一面平兒送過茶來鳳姐喝了隨便用些點心小紅已打了水來鳳姐洗了臉對鏡理妝一會出去坐上車跟著老婆子丫頭們先往東府裏見了尤氏仍舊請他過來辦事坐不多時便出來到邢夫人處請過安約略回了些南邊的話邢夫人因鳳姐路上受乏命他且去歇息鳳姐告辭回來又到園子裏往李紈衆姊妹處走了走然後到自己屋裏平兒道太太等著奶奶有話商量呢鳳姐便往王夫人處不知有何商量再看下回分解
