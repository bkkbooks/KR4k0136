body:
  text: 第十二回毀金鎖遺言囑賢女呼寶玉切齒類顰卿話說薛姨媽一進屋內走近寶釵炕邊見他形容瘦損臉色改常吃驚不小坐到炕沿把兩手拉了寶釵的手止不住流淚道我的兒怎麽樣就病到這個地步我也因爲病了好多時起不來炕沒有來瞧你心上很熬煎丫頭們傳來的話都糊弄著我今兒才掙扎著過來瞧見了你那知竟病的不像樣了我的兒你心上到底要放寬一點寶釵見他母親含悲扶病而來倒要忍淚吞聲凝神攝氣打點一番永訣的話出來從容勸慰便道女兒的病沒什麽要緊倘有不測母親總要看開些第一哥哥的罪名已幹辦停當不久可望出獄嫂嫂雖然不大賢惠還有香菱體心服侍底下蝌兒娶了邢大妹妹過門同自己媳婦沒有兩樣的咱們家裏動用還輕買賣行中張德仁這個夥計是靠得住的蝌兒也是一個幫手將來過日子不用媽媽操心千萬保重自己身子要緊薛姨媽聽了寶釵的話越發傷心起來便含淚道是我害了你了如今想起來說著滿屋子裏瞧了一瞧見襲人這一班子人都不在跟前便道和尚道士的話到底聽不得的說什麽金玉姻緣都因這句話耽誤了你我真是後悔不及寶釵聽到這裏不覺觸動心事怔了一怔歎口氣道女孩兒出了嫁就算完結了這件事好歹憑各人自己的命去碰哩媽媽也別後悔我看媽媽的身子還不大硬朗何苦來跑這一趟薛姨媽道我在炕上躺了這幾時也覺得膩煩了逼著掙扎得住出來鬆散鬆散借了這裏老太太的竹椅子坐過來的剛才到老太太那邊你太太和鳳姐姐都在那裏講了一回話我也不到你太太屋裏去了一面又和鶯兒道你瞧姑娘病的那麽樣子問你總沒一句真話如今再別叫姑娘生氣好好候候著說著止不住滴下淚來又怕寶釵見了傷心暗暗拭了淚痕轉身出了里間房門早有鳳姐隨著王夫人迎面進來鳳姐先陪笑道怎麽姨媽就要回呢在這裏住幾天幫著我們太太和寶妹妹解個悶等寶妹妹身子健了回去也好薛姨媽一路拭淚說道我住在這裏也解不了他的悶況且我自己的身子也還是風擺荷葉似的家裏天天鬧藥罐子明兒還要端整東西打發人送給蟠兒去呢諸件事有他太太在這裏疼他又有鳳姊姊留心我也放心得下的又向王夫人道我也不過姊姊那邊去了鳳哥兒也不用送說著出了院子早有麝月秋紋這一班隨著王夫人鳳姐送了薛姨媽出去這裏寶釵被他母親提破了金玉姻緣四個字便想到寶玉和黛玉兩個人幾年來的心事別人或者猜不透我是已經看到十分的了雖然婚姻大事全憑爹媽作主但只母女之間有什麽話說不得何不把媽媽想不到的所在提一提再看媽媽的主見怎麽樣及至林妹妹回生之後事無不可商量萬不該一錯再錯聽了鳳丫頭的話把活活一個人瞞住他幾個月聽說顰兒走的時候竟是歡歡喜喜的全不像先前的光景也猜不透他什麽心思倒叫那一個鬧出這件事來這一口怨毒之氣全呵在我身上了要想我一個做女孩兒的斷使不出什麽壞心把你們的事情離間了何苦來和我賭氣呢自從嫁到他家他病好後也似乎有些情意到後看來都是虛文就是你要走這條路且到三年五載生男育女後我將來也有個靠傍你再走也耽誤不了你的事只要你把待林妹妹的情分移一分半分到我身上來也就夠了你們兄妹私情那麽樣淪肌浹髓倒把夫婦正禮全當作水月鏡花我原是刻刻提防著不料他認真幹出這樣忍心害理的事來寶釵想一回又氣又恨又怨又悔滿腔說不出的話無從發泄竟移到一件無知之物上暗合著黛玉焚巾的故事來了一時把鶯兒支使開去叫小丫頭把金項圈拿過來原是寶釵病後叫鶯兒褪下隨手撩在桌上並未收拾今叫小丫頭取過那小丫頭因從沒經由過這東西怕有閃失便要去找鶯兒來拿寶釵生氣指著桌子上使勁說道那不是嗎遞一遞就折了你的臂膊小丫頭答道我怕動壞了奶奶的東西寶釵嗔道我叫你拿的動壞了要你賠不成那小丫頭就扒上杌子雙手捧了金瓔珞下來抖抖搜搜的遞給寶釵寶釵接過掙扎著欠起身子把金鎖翻來覆去端詳了一回線斷的淚珠滾將下來使勁高聲連念兩遍不離不棄芳齡永繼便叫兩個小丫頭去瞧襲人姊姊他在房裏幹什麽一時支使開了小丫頭重又提起金鎖歎道先前原聽信你是吉利話沈甸甸的挂了你這幾年如今可是你來棄我並不是我要離你我死之後恐怕他們要把這件東西給我挂上我死也不能瞑目想罷要找一件東西來砸他手頭無物可舉便把金鎖連瓔珞望火盆裏用力一撩眼前金星直迸連忙伏倒枕上喘個不住卻說那金鎖恰好不遠不遠正撩在火盆裏面鶯兒等回來都沒理會到了次早有老婆子端出那火盆傾灰並不留心連灰倒在地上也沒人瞧見被屯裏擔灰的人拾去不知是件貴重之物賤價換脫書且慢提再講寶釵撩棄了金鎖痛恨交迫又連吐了幾口血臉色如灰已支撐不住鶯兒進房見小丫頭一個也不在細瞧寶釵神色嚇得魂不附體趕忙走近炕前將寶釵扶好一手按在他胸前揉了幾下連問姑娘怎麽著寶釵微微睜眼見是鶯兒複又閉上半晌才把鶯兒推開向桌上放的參罐指了一指鶯兒會意便把參湯在藥滬上溫好端過湊在寶釵唇邊寶釵喝了半盞覺得精神略略清爽鶯兒才說道姑娘天天不肯吃藥你看這會兒才喝了幾口參湯比剛才就精神好了些張大夫的藥早就煎好了呢拿來溫一溫姑娘吃了罷寶釵只是搖頭鶯兒正說著見兩個小丫頭進來鶯兒生氣道你們瞧著奶奶屋子裏沒有一個人倒脫滑兒都走了要逛等我回來還不夠你們逛呢寶釵介面道是我叫他去瞧襲人的鶯兒道正是好半天沒見他剛才聽見說花自芳家的在他屋子裏坐了好一回工夫不知咕唧些什麽話那小丫頭子道我們剛才進去見襲人姊姊還在那裏哭呢話未完只見襲人走進寶釵留心一瞧見襲人淚痕未幹只道他不過爲了寶玉傷心便問你嫂子進來和你說些什麽話襲人支吾過去寶釵叫他坐了襲人走近炕沿坐下細瞧寶釵神氣道奶奶這會兒覺著自在些嗎寶釵道這會兒倒覺有些精神趁我這口氣在有句話要告訴你咱們脾氣彼此相得原想廝混著過一輩子的便是先前也曾聽見他說過有人死了要去做和尚的話如今死的沒有真死活的現在活著做和尚的倒認真去做了我想你終身不了太太先前雖然有這條心沒有明公正氣的收在屋裏將來貞節牌坊也輪不到你白耽誤了一輩子我見了太太要把這句話替你回明好歹放你一條出路別自己錯了主意襲人聽說惟有低頭垂淚坐了一會自回屋裏去了到了晚上睡下想後思前可怪寶釵的話恰和他嫂子進來講的話再沒那麽湊巧相合原來花自芳的女人今日進來一徑去找襲人襲人和他哥嫂本來不和睦見他嫂子進來雖然心煩不得不勉強應酬花家的道我輕易沒事也不敢進來走動今兒你哥子叫我來瞧瞧姑娘還有一個喜信報與姑娘得知襲人不等花家的說完便著急問道嫂子可聽見外頭說寶二爺有人找著了嗎花家的道那有這件事你哥子聽見人說裏頭刷了許多賞單發出去各處張貼單兒上寫著賞的銀子可不少旁人都說任憑賈府裏把兩位公爺的蔭襲都讓給人家我們也沒有這樣大福分承受那位哥兒是已經跟著有德行的和尚隱在一個人迹不到的深山裏修行去了一輩子也沒處找的姑娘你想倘有找得著的地方整萬兩銀子擺著憑誰也是眼紅的怕不變法兒去找嗎襲人聽了這番話不覺心懶意灰便道既是這麽說剛才嫂子講的是什麽喜信真把人糊塗住了花家的陪笑道說的是姑娘的喜信呢你哥子說有一頭好親事人家來和姑娘說媒叫我進來告訴一聲要姑娘自己拿個主意襲人聽到這裏便通紅了臉使勁啐道我頭裏瞧你是個明白人怎麽今兒白眉赤眼的說這些話來奚落人怪道你急巴巴的進來敢是要在我身上想法兒你們兩口子別發昏了花家的道願意不願意在姑娘也值得生那麽大氣我勸姑娘凡事要三思別太執意我記起媽死那一年姑娘出來的勢派誰瞧不出來姑娘得了好處帶著你哥子也有臉誰不願意爬高枝兒飛呢如今寶二爺出了家姑娘是沒有過明路的人就在裏頭死守一輩子也沒出頭後來日子正長呢難得有這門子對頭親聽見那一人年紀又輕人才又出衆一般住的高房大廈有的吃有的穿家裏也是呼奴使婢那一件不稱心你哥子爲的是兄妹情分並沒使什麽壞心難道還貪圖在裏頭掙一百八十兩財禮嗎將來多一門子親戚來往逢時遇節端盤送盒賠墊幾個錢是有的姑娘你去想罷襲人聽的厭煩了便道嫂子有話自回太太去我也不犯著和你慪氣說著便不理他花家的見話不投機只得走了襲人越想越惱正坐著垂淚見寶釵屋裏兩個小丫頭來找他慢慢的揩幹了眼淚來見寶釵偏偏又聽了寶釵勸他這一番話雖然還有盼望寶玉回家的癡心已把惱他嫂子的氣減了幾分未免有些活動再說寶釵到了次日叫鶯兒請邢大姑娘說話鶯兒便使喚小丫頭到園子裏去請邢大姑娘那時岫煙未到先是王熙鳳來看寶釵寶釵只是閉著眼懶的開口忽然睜眼向鳳姐瞧了一瞧叫道鳳姊姊你是爲好反成歹了何苦來呢只說這兩句仍舊合上了眼就沒言語了鳳姐聽了想要勸慰幾句明知無益意欲分證一番又見寶釵病到如此地步恐怕反惹他的氣左思右想只得忍耐住了搭訕問鶯兒你姑娘夜裏喝了些什麽睡得自在些麽正說著聽得外間屋子裏小丫頭掀起簾子道邢大姑娘來了鳳姐先與岫煙問好寶釵把身子略略欠起道又要勞動妹妹我今兒請你過來見了一面就算永訣了心上有幾句話要和你講怕再遲兩日趕不上了鳳姐聽著知道寶釵要和邢岫煙講些什麽話怕在這裏不便因向岫煙道邢大妹妹你在這裏多坐一會子我屋裏還有人等著我說話少陪你說著便起身走了寶釵才接著說道想我那一年進京來到了這裏老太太就疼了我這幾年比自己的孫女兒一般後來做了孫子媳婦沒有孝順老祖宗一年半載反叫他老人家眼裏見了這些意外的事自然是我的罪過老太太已是八十以外的人了不過伺候他喜歡一天是一天日子還淺至於太太疼我更不必說也沒有盡我做媳婦的一點孝心不到一年出家的出家死的死了眼前的日子委實也難過但只還有大嫂子在此鳳姊姊比自己的媳婦更著意環兄弟雖是姨娘養的也算得太太的親兒子還有孫子蘭哥兒本來是好的太太心上可以寬慰幾分還有三妹妹這班子人在跟前熱鬧我雖沒有承歡的福分也可放心了惟有我家媽媽寶釵說到這裏淚珠直滾便咽住了半晌不語又說道我媽媽娶了這樣慪氣的媳婦一個不懂事的兒子如今還在監裏要媽媽時刻操心便我哥哥有日回了家也不能叫媽媽過舒暢日子算香菱懂些人事當不得幾分家也是枉然左右盤算起來我的媽媽是要靠托在大妹妹一個人身上的了我在九泉之下也是感激你的我給大妹妹磕頭說著便掙扎起來似乎認真要向枕上磕頭的光景鶯兒趕忙過去把寶釵扶住因掙扎不起仍舊躺了下去撲簌簌的流下淚來邢岫煙心地明白慈祥素來又感念寶釵爲人今聽見寶釵這番囑託他的話十分傷心因自己尚未過門當著丫頭們在眼前靦腆的無言可答惟有流淚而已當下寶釵說完了話便似睡非睡的朦朧合眼神色大不如前鶯兒又取參湯遞到寶釵口邊寶釵只是搖頭不喝也再沒和人講話岫煙便起身回去再講薛姨媽因那一天過來看了寶釵又著了些外感兼之心頭鬱結不開病勢翻覆起來這幾天總沒過來賈母放心不下親自到寶釵屋裏走了幾次王夫人以及李紈鳳姐等等來看視自不必說怎奈寶釵的病一天重似一天自王太醫回絕之後各處名醫束手王夫人真無可如何到了寶釵絕命的時候賈母王夫人李宮裁王熙鳳探春都在屋裏衆人怕賈母見了傷心先勸賈母回去了不多時寶釵兩眼往上一翻鶯兒上前咽住哭聲叫了幾聲姑娘不應只聽寶釵忽然直聲叫道寶玉寶玉你好就絕了氣了李紈探春聽寶釵叫出這六個字來竟與黛玉從前如同響應不禁面面相覷毛髮直豎王夫人聽見明知寶釵心裏怨恨寶玉因痛媳而思子寸腸如割越發大放悲聲號啕不止李紈等含淚把王夫人勸慰一番王夫人歎口氣道我懊悔把這孩子遭蹋了真對不住姨媽聽說這幾天他又病的炕都起不來這會兒在跟前還不知苦到那麽個分兒呢我也走了瞧著委實的難過有一句話對你們說姨媽不在跟前別再委曲了這孩子凡有知道他平日愛的東西都給他穿戴了去留著也沒處用徒然見了傷心李紈鳳姐應道這也不用太太操心我們在這裏留心照料就是了一時王夫人走了早有賴大林之孝家的引領衆媳婦忙亂動手給寶釵裝裹停床惟有鶯兒只是哭個不了鳳姐把他亂推道別哭罷快去把你姑娘穿戴的東西都經由出來那一盤子金鎖是要給你姑娘戴去的鶯兒含著一包眼淚道提起金鎖是我和姑娘摘下來放在桌子上這幾天像沒有瞧見因心裏有事也就混忘了說著便向櫥子上抽屜各處找了個遍問小丫頭子可瞧見姑娘的金鎖小丫頭子道那一天姊姊沒有在屋裏奶奶叫我在桌子上遞給奶奶瞧呢鶯兒道你們聽不問著他還怕有人割了他舌頭不哼一聲兒呢奶奶瞧過了到底交給那一個放在什麽地方了小丫頭道奶奶正瞧著叫我們去看襲人姊姊回來不知奶奶遞給那一個了鶯兒又向各人問過都說沒見鳳姐介面道既沒有見你姑娘又沒起來丟的不過在炕上還怕飛到那裏去了便叫林之孝家的就在褥子絨毯底下細細找尋都沒有鶯兒著了急自己還去翻箱倒篋找了一回總沒找著鳳姐生氣道屋子裏再丟不了東西一定又鬧出墜兒的故事便指著兩個小丫頭子道你們好喲趁奶奶病著偷偷摸摸的把奶奶的東西藏在那裏了快去拿了出來給奶奶挂上的好裝糊塗再推不知道仔細你們的皮兩個小丫頭嚇得不敢出氣只是打戰衆人要脫自己干系你一言我一語立逼小丫頭著落這件東西鳳姐又叫林之孝家的帶了幾個人到小丫頭屋子裏細細查搜也沒搜出探春見這件事鬧得不能完結細想小丫頭們未必有此大膽便道鳳姊姊別性急枉累無辜我看這件東西又像二哥哥失玉的故事了寶姊姊這挂金鎖也有些來歷原不比尋常佩戴之物頭裏二哥哥因失了玉便瘋瘋傻傻起來歸根兒鬧到去做了和尚如今寶姊姊到了我家遭此意外之事一生祿命將絕已近蓋棺焉知不是鬼使神差也先把這鎖攝去了你們的意思謂這盤鎖是寶姊姊在生時心愛之物定要把他來殉葬據我想起來寶姊姊死必嗔此很可不必他生前挂此不棄者原因鎖上鐫有頌禱句語今身已雲亡何必又取此吉利話頭既不取吉利不過是一件金珠佩戴之物沒有什麽希罕只叫鶯兒把他姑娘所有的東西只揀好的收拾出來插戴罷咧也不必去回太太叫他老人家又多一件心事將來姨媽跟前說不說都沒要緊李紈道三妹妹講的很是這會兒別夾在忙裏鬧這件事探春又道我不過是這樣瞎猜也保不定必不是人家偷了去鳳姊姊只管吩咐管事媳婦們大家慢慢的留心查察叫鶯兒襲人這班人底下去都留點心奶奶不在了屋裏沒有主兒別因我這番話有個推卸認真把屋裏的東西偷盜起來倒是我來開門揖盜了鳳姐道既是三妹妹這樣說咱們且把這件事擱起便問林之孝家的道那一件可端整了沒有前兒大夫回絕了聽見二爺說早吩咐你男人的了林家的道正要回奶奶這句話幾天前頭二爺吩咐出來趕忙去看了幾處都看不中價錢又不對我倒想起一件現成的東西不是頭裏替林姑娘辦的沒用著還寄放在饅頭庵裏也化了七八百銀子買的大奶奶情願減價要棄脫因沒飛翔主就擱起了不如就用了他可使得嗎鳳姐道我也想起來了要論價值這件東西很可用得這會兒外邊正打饑荒沒的又去張羅快叫人去擡了來瞧瞧林之孝家的一面出去傳話探春聽說這副棺木本爲林姑娘置備竟留以待用一大奇事益信金鎖之失定非無因不說李紈鳳姐輪替往來照料這裏襲人麝月秋紋碧痕等和小丫頭老婆子常川伴靈到了送殮那一天鶯兒哭著攔住不許蓋棺要望他姑娘像林姑娘一般的還陽轉來也有笑他癡的也有看了傷心的經鳳姐喝勸沒奈何走開大放悲聲悼痛靡已一時把寶釵殮了七日後開堂發靷親族吊喪一切儀文概不瑣述後事如何下回分解
