body:
  text: 第十七回寶玉還家混淆真假惜春題畫點破機關話說紫鵑把黛玉寄來的畫幅展開與晴雯素雲一同觀看見上面畫的一尊觀音大士底下擺著蒲團一旁畫的架上鸚哥又有一個身穿素澹衣裳的女子手內捧著淨瓶瓶中插的柳枝那女子面寵竟似黛玉小像一般晴雯看了又看笑道活脫是林姑娘就比先前胖了好些素雲道你不見林姑娘回去的時候就是那麽個樣兒說著看了一會先走開了紫鵑和晴雯兩個還瞧著不放晴雯道那明明是你姑娘的一幅小照到底南邊人巧畫來再沒那麽像呢可知道你姑娘寄來給你瞧的意思嗎你剛才白問甄家去說親允不允如今瞧這幅小像可猜透你姑娘的心事了紫鵑道我也是那麽想怪道姑娘臨走的時候和妙師父很親熱原來他拿定主意竟走到妙師父那條路上去了任憑你寶珠寶金真的假的總沒相干睛雯道只要咱們家寶玉回來老太太作主太太央人到林姑娘家去求親別管林姑娘允不允就當真上了南海修到五十三參的地步也要拉他回來呢紫鵑笑道再沒有你這張貧嘴誰聽你話呢於是將黛玉給的東西送了些與晴雯又留幾件送給素雲碧月一面留心訪問甄家說親一事老太太如何作主當下已屆歲除只因榮府連遭逆境園中姊妹也如晨星疏落第一個賈母心中懷悶毫無意興鳳姐還在病中未免諸事闌珊雖免不了開祠堂挂影像以及親族往來宴會不過循照刻板舊例有減無增就是東府過年因賈母這裏沒有興致也熱鬧不起來所以甯榮兩府過年再沒冷淡如這年了既無可記事故一概無庸細述且講寶玉留住甄府專候好音一日見甄寶玉來笑道打發到令表妹府上去的女人已經回來了他們傳述的話也不得十分明白大概這裏人去因有前番兄弟這一節事未免動疑尊府去求親何必從捨下這一轉又以二哥已與薛府姨表聯姻早完花燭禮無兩大並尊之伉儷林氏千金豈肯讓居人下還有一說那去的人私下打聽得令表妹已安置佛堂一所晨夕焚香供奉杜蘭香不肯輕下閬風之苑與二哥避世逃禪頗有異地同心的光景據兄弟看起這件事來未必不可挽回但須尊府另懇蹇修先議明名分上可以酌經行權兩無屈抑再將二哥一片苦衷細細訴明令表妹憑是鐵煉鋼腸亦化爲繞指柔矣寶玉道我此時不願先回家裏不如就近自己去走一趟看怎麽樣甄寶玉笑道論至親本非不應上門但既欲到他們下乘龍豈有坦腹東床者自任冰上人的理況二哥未換緇衣亦覺外觀不雅請勿焦急兄弟本擬新正北上如今爲二哥的事當即稟明家祖母趕緊束裝進京到府上告知此事想太君自然著急一定設法料理此事二哥且屈在舍下耽擱幾時何如寶玉聽了十分感激當下時交臘月初旬甄寶玉定了長行吉日來辭寶玉寶玉自有一番叮囑便將通靈寶玉解下遞與甄寶玉道此物前因無端失去便鬧出許多不遂心的事來今物還故我想得失皆關定數帶去交與家母稟明家祖慈見這玉如見寶玉不孝遠違膝下死有餘辜惟望將此通靈作溫家玉鏡臺這玉一日不使南來即寶玉一日不能北往言訖淚如泉湧甄寶玉滿口允許道此事可無他慮又勸慰了寶玉幾句一揖而別慢表寶玉在甄府之事且講甄寶玉帶了童僕數名水陸行程在路無話到京中正過新年自然先至自己宅內見了父母稟過祖母康健又說了幾句家務話便提起寶玉事情甄老爺早知賈母著急世交關切也暗暗著人各處尋訪那知留在自己家中反抱怨甄寶玉爲什麽不同他進京甄寶玉又說明寶玉不肯回家緣故甄老爺立刻命兒子到榮府告訴明白甄寶玉便帶了兩個家人跨上馬徑望榮府而來將至榮府大門前因跟來的家人遇見了一個朋友拉住說話這條街上那些遊手好閒的人一見甄寶玉都是交頭接耳不知講了些什麽話十幾個人一窩蜂擁上前來將甄寶玉瞧個仔細便拉馬的拉馬在後面趂的趂不由馬夫作主把甄寶玉騎的一匹馬竟似騰雲駕霧的擁進榮國府來那兩個家人有一瞬眼不見了哥兒隨後趕來已趕不上只聽衆人高聲嚷叫找著寶二爺回來了門房裏跑出幾個人來迎面一看飛風的嚷了進去早有二門上小廝應聲接嚷傳到裏頭賈母王夫人聽見好似雲空裏掉了一個活寶下來賈母一手搭上鴛鴦一手搭上琥珀顫巍巍的往外直走旁邊鴛鴦忍不住笑道老祖宗這樣走的快不是我們來扶老祖宗倒是老祖宗在這里拉了我們走呢王夫人也在後面隨著又有快嘴的六百里加緊的趕進園裏報知李紈這日史湘雲來拜賈母的年見賈母處冷冷淡淡的不似往年熱鬧便到園裏來找著邢岫煙和探春姊妹都在李紈處閒談湘雲道咱們多少尋些年興出來應了景才好林姊姊帶了些南邊東西來給我還有一副象牙圍籌虎豹獐鹿刻的很精細那是我上年叫他買的我帶在這裏咱們來打圍罷探春道他還記得你喜歡鬧么愛三呢大家都笑起來岫煙道林妹妹真是個信人他和我們餞行詩內說著南枝傳信早好寄隴頭春果然點景兒寄了許多土儀來想來上年給他餞行這幾個人都有的湘雲道正經我要叫回來的老婆子問問他林姑娘的光景李紈道不必問老婆子他有一件東西在這裏你瞧著就明白了湘雲問是什麽李紈便命素雲把紫鵑前兒送過來這幅畫取出來當下攤開與衆人一看各各領會黛玉苦心未免黯然湘雲又贊道好手筆真是神添頰上此時恍與瀟湘妃子覿面一慰闊衷大嫂子何不早打發人送來給我瞧瞧李紈道紫鵑說他姑娘囑咐來人別給外人瞧將來有便要寄還他呢湘雲道既要還他咱們給他一題何如探春道枕霞舊友技癢你瞧著大嫂子屋裏拱的天竺臘梅歲朝圖很對時景隨意謅兩句解饞也好再別題這幅畫湘雲道這又是蕉下客什麽講究呢探春道凡寫小照佈景或吟風或弄月或揪枰敲子或綺閣揮弦皆取平日所愛的景物點綴怡情今林顰卿迫於氣苦不得意的構思關係終身結局你們題跋起來若僅順題敷衍未免有乖情理一經翻駁則又忤其意旨不如善刀而藏爲妙湘雲點頭道蕉下客所見極是惜春道三姊姊自發他的議論我本來不會做詩如今見了這幅照倒要謅兩句在上面叫你們瞧著岫煙道四妹妹既肯揮毫自有妙論咱們也好領教惜春便命彩屏展開畫幅提筆寫道慈雲海上忽飛來露滴楊枝著意栽尚隔紅塵遲永久此身終許近蓮台湘雲等看了正要議論只見一個小丫頭飛跑進來嚷道寶二爺回來了李紈聞言抽身便走湘雲岫煙探春亦喜出望外嘻嘻哈哈的跟著出來獨有惜春早料寶玉交春後必有音耗不爲奇喜便自回蓼風軒去了紫鵑和晴雯兩個人正在屋裏做明兒人日的彩勝銀幡玩意兒聽見嚷著寶玉回來各人心內一動大家怔怔的把活計丟下紫鵑此時也忘了李紈囑咐他不要出去走動的話便道咱們也去瞧瞧睛雯搖頭道我是懶怠走動你要瞧只管瞧去紫鵑會過晴雯不肯出去的意思便道你不去也罷我瞧寶二爺還是和尚不是和尚進來告訴你紫鵑趕出園來只見老婆子丫頭們跑的跑嚷的嚷絡繹不絕都要出去瞧寶二爺的府中大小男女上下人等已到齊十分之七八書且少表再講衆人把甄寶玉擁到垂花門外被榮府衆家人趕上來喝住便都退到門屋前齊齊站著七張八嘴道府上的賞單可揭在此如今有了寶二爺快把銀子照數兌給咱們那門上的人也不敢吆喝他們只說銀子上了萬那有這樣現成的該是你們發財也少不了這會兒且到照牆邊去站一站等正經主兒回來再給你們兌銀子當下內中有兩個人說道大太爺吩咐的是但是咱們這幾個人太爺未必都認清楚停會兒越鬧越多兌起銀子來給誰的是不如先把咱們各人的姓名開了一張單紙留在大太爺這裏別叫沒相干的人鬼混了去咱們就多等一會兒也沒什麽要緊那門上的人道這話倒說的中聽於是查照現在人數記了姓名一面去請賈璉這裏甄寶玉明知他們錯認了暗暗好笑心想且等見了賈府主人再講明真假那知才到廳上賈母王夫人不等他開口便一把拉住叫的心肝寶貝號啕痛哭一時也不想到和尚爲什麽還是這樣裝束甄寶玉急欲訴明情由怎奈哭聲鼎沸話不入耳把自己也怔住了一旁閃出麝月秋紋因他們兩個人素常伺候寶玉慣的所以不避嫌疑也是匆匆忙忙地走近身來瞧著襟子上露出一段金線絡子麝月忙和他解開扣子一看二人喜極便情不自禁道如今可連那玉也回來了才脫了我們的干系呢和秋紋爭著褪下這塊通靈寶玉遞與王夫人瞧了瞧又送在賈母手中說正是先前失去的東西如今連人帶玉都有了賈母王夫人才止了哭只見鳳姐亦帶病扶著豐兒出來走近跟前兩手拉著甄寶玉的手數說道噯喲喲寶兄弟你怎麽就傻到這步地位也不想老太太太太那麽樣疼你就是寶姊姊也和你好你看如今連寶姊姊也慪死了賈母道鳳丫頭你寶兄弟才回來再別給他多說話叫他傷心鳳姐道老祖宗怕寶兄弟傷心我瞧老祖宗和太太哭得淚人似的寶兄弟還只是在那裏笑呢賈母道要那麽好他到了家自然該歡喜甄寶玉見賈母王夫人都止了哭才得進言一面打千請安道我不是賈寶玉是甄寶玉呢鳳姐道寶兄弟你又講糊塗話了誰說你是假的呢甄寶玉道我不是你家的寶玉是江南甄家的寶玉鳳姐聽說也不問青紅皂白便著急道寶兄弟你還鬧的我們不夠這會兒才回來了何苦又變出法兒來混我們呢那時麝月秋紋貼近身旁一聽甄寶玉聲音再細認面龐未免略有些不同之處又想起寶玉已絞下頭髮寄回怎樣好戴束發金冠才信果非自家寶玉羞的滿臉漲紅連忙退開向王夫人回明王夫人曾見過甄家寶玉今被麝月秋紋道破便道你既是甄家哥兒那塊玉從何處得來還是真是假甄寶玉道老伯母且請寬心府上寶玉現在捨下其中情節待小侄細細稟聞王夫人才叫甄寶玉坐了聽他講寶玉怎樣走入深山回到江南留住他家現在尚未改換衲衣今寄回通靈之寶必得聘定林府千金始肯回來及自己進京到此送信被人誤認擁進府來不由分辨緣由逐一敘明此時賈母等雖未見寶玉而寶玉已有下落自可略慰懸心又與甄寶玉敘話家常鳳姐亦深悔鹵莽與麝月等各自含羞躲避那跟甄寶玉的人趕到榮府門上問明始知衆人妄想發財混甄爲賈那時賈璉亦得信回家見照牆邊站著許多人門上回明此事賈璉命叫進衆人一泡子嚷罵道不要臉的東西大新年混要想發財也瞧瞧臉兒著我就不信你們這麽變法兒總想混咱們府裏的銀子那怎樣容易先前拿了假玉來混也罷如今連人都弄出假的來了幸虧還有真憑確據甄老爺宅上的人在這裏你們自去問罷剛才承你們費心送來到底是榮府裏的寶二爺不是混拉扯著的甄老爺知道了你們可吃不了又叫一聲來拿我的片子把這班人都送到馬司衙門裏去問他個圖財拐騙一個個都發他們出去衆人一聽才知道錯認不但銀子指望著空還防打官司吃虧便一哄而散互相抱怨這一個說那一個認得不真那一個道這一個沒有問明大家心還不死都遠遠站著這裏賈璉進內自去應酬甄寶玉一會話甄寶玉告辭送至二門外上馬不說甄寶玉出了榮國府衆人遠遠跟著看他回到自己宅裏才死了心各自走開再講賈璉送了甄寶玉回進忙到王夫人屋裏知道王夫人在賈母處便來與賈母王夫人道喜一面提及要接寶玉回來的話賈母道年底下老爺寫書回來提起雨村本家給你林妹妹說媒你太太來問過我我因是林丫頭已經回他家裏好不好憑他嬸娘去作主我也再不管這些事省的落抱怨現在寶玉雖有著落還不肯回來我懊悔先前錯了點主意如今寶丫頭又死了叫我怎麽樣呢璉兒且別性急等咱們商量停當再叫你寫老爺的回書王夫人介面道問老爺那裏來的人幾時走呢賈璉答道怕老爺懸望這幾天就要打發他起身說著見王夫人手中拿著這塊玉賈璉驚問道這不是寶兄弟先前失掉的那塊通靈寶玉嗎怎樣又打著了王夫人告以寶玉寄回緣故賈璉接過手來端詳了一會笑道我到底認不明白瞧著倒像頭裏人家送來這塊假的一模一樣既是寶兄弟寄回來的多分是真的了難道他自己還哄騙自己不成我記得找玉的時候也寫了一萬銀的賞單總沒人找著如今還是寶兄弟自己去找了回來可省了老祖宗一萬銀子王夫人道正是如今寶玉既在甄老爺家裏可把貼的賞單都揭了進來別叫人知道了寶玉的下落瞧著賞單又變出法兒來哄銀子呢賈璉道可不是剛才就有許多人擁進甄寶玉來說是咱家的寶玉揭了單的來領賞我要把他們送到兵馬司裏去都跑散了太太吩咐的是侄兒就趕緊叫人去把賞單都揭了回來免得再有人混鬧賈母道剛才甄寶玉來連咱們自己的人都認不清別怪旁人他們原貪圖銀子留心咱們的寶玉也並沒安設著壞心故意來鬼混多少該賞他們幾兩銀子賈璉隨口答應了一聲是一面交還了通靈玉便回身出去王夫人接過玉來又看了看因聽賈璉說起假玉的話轉疑惑起來雖然甄寶玉不致捏造虛言而寶玉自己不肯回來或者變法兒照樣造出通靈寄回安慰家中盼望並哄他林妹妹作爲聘物也未可定當時與賈母說完了話回到自己屋裏便命小丫頭去叫了麝月秋紋來細認此玉真假麝月等因人且錯認玉更難辨真假一時想起金錢絡子是鶯兒結的便回明王夫人去叫鶯兒聽說寶玉回來並未隨了衆人出去一瞧惟在自己屋裏垂淚此時王夫人喚他只得勉強過來麝月將通靈遞與鶯兒道你可記得這絡子還是寶二爺挨了老爺的打養棒瘡的時候叫你來給他打的既是你經手的東西自然認得准可是那塊玉嗎鶯兒正苦的寶釵已死不得複生如今便有一千塊通靈寶玉也不放在他心上欲待不理麝月將玉摔棄因當著王夫人面前不敢使性便哭喪著臉答道絡子是我打的那塊玉真不真人家常見的還認不清我就認准了嗎王夫人反陪笑道這孩子倒說的好笑我叫你來原只要認這絡子是不是原物既是絡子還在這玉自然也就是胎裏銜出來這一塊了玉可以做得假的這絡子倒假不來呢於是將玉珍藏起來不表王夫人這裏的事且講鳳姐回到房中先罵門上這一班混帳瞎眼的怎麽一個個都睡昏了糊裏糊塗送了一個人進來就算了咱們家的寶玉問問他們外頭去撞見了像他老子的人也去混叫人家老子不成虧的甄寶玉與咱們都有世誼瓜葛太太們都見過他歲數也同寶玉差不多算我的小兄弟小叔子沒有什麽使不得話未完見小丫頭打起簾子說太太來了鳳姐站起身來讓王夫人坐在炕上王夫人道我來和你商量寶玉的事這會兒怎麽樣辦法剛才聽老太太的口氣是要依著甄寶玉傳來的話去定林姑娘這件事也很辦得就是林姑娘近來大變了脾氣聽回來的老婆子講起只像要做超脫紅塵的人了他性子又本來執拗倘一時勸不轉來我們這一個淘氣的依舊不知要鬧出什麽故事這會兒先沒有一個內外能說話靠得住的媒人我想起老爺信來是雨村本家來托咱們如今轉去托他叫璉兒結結實實寫一封書去諒他也不好意思推辭鳳姐躊躇了半晌道太太想的也是雨村和咱家拉攏的事情不少先前在那邊又教過林妹妹學的男女家拿得幾分主原可借重他但這頭親事很要磨牙呢太太說的非內外可以說話的人斷下不去林妹妹雖從過雨村念書到底是個女學生如今年紀大了就見面也在客氣一邊況且還有這些鈎兒麻藤的事雨村如何得知就便叫他知道也講不出口來說起寶兄弟和林妹妹他們心裏的事我不能推乾淨說全彀兒不知道也難說我能鑽到他們肚子裏去做蛔蟲林妹妹忽而病忽而好老太太也有些明白因是老太太說的林丫頭虛弱不是有壽的又是什麽性子乖僻只有寶丫頭最妥太太也聽見過的所以我們不過順著老太太的意辦了寶妹妹的事那知寶妹妹不是姻緣這憑誰也料不到的提起這件事鳳姐說到這裏眼圈兒一紅道第一個林妹妹心裏不知怨毒我到怎麽樣似的王夫人道你病的才好自己調養要緊過去的事別放在心上今如商量現在的話據你便怎麽樣好呢未知鳳姐計將安出下回分解
