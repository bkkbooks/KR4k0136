body:
  text: 第十回叩仙壇乩盤藏隱語遁禪門蠢婢露真言話說甄寶玉同了寶玉走出門房來至園內見樓臺庭榭山樹坡塘雖不及大觀園規模廣闊而溪徑亦頗幽曲因寒冬並無花卉點染只有幾樹梅花與翠竹青松交相掩映一路留心觀玩走進一座院落是甄寶玉常在此間坐臥之處室中簾幔鮮妍鋪陳富麗比自己怡紅院各有出奇制勝之妙二人就坐敍談未久早有小廝來回擺飯的時候了甄寶玉便命傳飯一時杯盤叠晉海錯山珍其主賓之款洽及下人趨蹌伺候之節俱不瑣述飯罷進盥送茶畢便有兩個家人媳婦進來一個拿一頂嵌鑲八寶紫金冠連著攢珠金抹額一雙烏緞粉底朝靴一個拿一件雲龍大紅袖的箭衣又一件鎖金天青緞排穗褂一條長穗宮縧請寶玉更換甄寶玉瞧他頭上光光的心想光著頭怎好戴金冠既不戴冠便不配穿這些衣服了便向那兩個媳婦道你們剛才沒有瞧見嗎靴子留下把金冠衣服拿去另換一套來寶玉聽說忙止住道不用去換實不瞞大哥說兄弟出家原爲一件不了夙願如夙願不了此身便返紅塵這一輩子不過做一個僧不僧俗不俗的野人那一領袈裟斷乎不肯抛撇只管去回老太太說兄弟已經穿上就是了甄寶玉笑道二哥在這裏保不定時常要請到裏邊去見個面兒這謊如何扯得去一面叫小廝把冠帶等物接過放下叫兩個媳婦去回老太太只說把東西已經送在這裏別多說話我明兒見了老太太自有話講那兩個媳婦子答應了只是笑嘻嘻的站著不走甄寶玉問道你們還有什麽話那一個媳婦便走近幾步湊著甄寶玉耳邊悄悄說了幾句話甄寶玉便笑向寶玉道家祖慈的意思因二哥在家離不開女孩子們伺候家祖慈把自己屋裏的人挑了兩個又恐二哥嫌他們不是自己使喚慣的人未必合意可要叫他們出來二哥切不可見外寶玉忙站起身來道蒙老太太過於疼愛把兄弟當作自己的孫兒一般看待實在感激萬分兄弟先前這小孩子脾氣近來已改過了如今出家一事雖沒有成功而禪心已似沾泥絮便茅庵草舍也可止宿挂單況住在這樣明窗淨几的所在又有尊價們在此伺應已極妥當安適再不敢費老太太的心甄寶玉聽說知是實情便叫那媳婦自去回覆寶玉又躬身致意說明兒見了老太太親自叩謝當下兩個媳婦回身便走私下自有一番議論這裏甄賈兩寶玉又談了一回知甄寶玉已領鄉薦彼此問及年歲又是同庚於是分外親熱說話間早已掌燈時分寶玉也知甄寶玉脾氣大概與自己相同讓他自便甄寶玉告辭進內寶玉一個人靜坐想到剛才進園來爲什麽這些路徑好像曾經到過恍然記起從前夢遊之所醒來還對著鏡子裏的影兒叫喚自己名字連甄老太太屋子裏的丫頭有兩個面熟在夢裏頭叫我臭小子似的可知夢中所見非盡幻境無憑這麽想起來蒲團打坐時看見林妹妹來說他沒有死的話竟有幾分可信便向小廝問道你們可知道這裏有林老爺家先前做過鹽運司的小廝答道這裏左近姓林的宦家很少離這裏二百多裏揚州城裏有一家姓林聽說是做過布政司的他家有一位小姐乳名黑玉不知就是那一家不是寶玉想道我姑爹歿于鹽運使任所並未升轉藩司聽紫鵑說過林妹妹家再沒有出仕的人莫非另是一家隨把黑玉兩字揣摩了半晌因說道黑玉二字不雅如何取名便用指頭向舌尖濺濕在桌子上寫了黛玉二字指與小廝看道可就是這兩個字那小廝看了點頭道不錯這不是叫黑玉嗎寶玉笑了一笑也不與小廝校正心想閨名黛玉本來就少又是姓林這位小姐竟像林妹妹了才說做布政司是他錯記的忙又向小廝問道你爲什麽知道他家有這位小姐呢小廝道因爲我家哥兒去求過親所以知道寶玉著急問道親事說成了沒有小廝道說也古怪不知爲什麽緣故聽見我家哥兒去求親倒像前生有仇恨一般一口就回絕了聽說我們老太太又寫了書子到京裏去叫老爺另央媒人去說呢寶玉聽了小廝的話呆呆的想道聽他講起來不是林妹妹是誰爲什麽家裏人都咒他的可笑襲人我在他跟前這樣盤問瞞得我緊緊的不肯露出一句話出來到底是什麽意思就是老太太也從沒提起林妹妹回南的話怪道那一天到瀟湘館去只是空空一室並沒見棺柩停在裏邊虧此大荒山一走得了些消息不是死過的林妹妹沒有死竟是我這一個活活的死人到如今才弄活在世上了難怪林妹妹恨著我所以甄家去求親提了寶玉的名兒他就生氣但除了寶玉之外還有不叫寶玉的倘不是寶玉去求親便允了怎麽樣呢又轉念道林妹妹待我的光景我也看透的了決不至有意外之事且等明兒問准了甄大哥再作計較當下打發兩個小廝自去安歇便和衣躺下一夜左思右想直至雞唱五更朦朧合眼一覺醒時已見紗窗日上忙起身來早有小廝伺候盥洗畢甄寶玉已進來了二人讓坐略敘幾句套言甄寶玉道早上請安家祖慈已把二哥昨兒的話回過叫問二哥有什麽不遂心的只管請說切不可隱瞞況且兄弟同二哥同名同貌同歲同年也算得古今來絕無僅有的好兄弟了何妨一傾肺腑寶玉心上盤算道他既有求親一事何不趁此道破止其再生妄念便道既承關切實不敢瞞兄弟總角之年與林舍表妹見面即如舊識重逢共櫛聯床勝若同胞兄妹稍長雖避嫌疑而花朝月夕擊缽飛觴性情倍浹雖未曾稟知堂上的而上下人等都猜透老太太心事爲我兩人團聚哄然一傳已入舍表妹之耳不料兄弟在病中變生意外另締姻緣故有此逃禪之舉甄寶玉不等說完拍手笑道兄弟明白了當下也把求親不允一事直說了出來又道如此請二哥把這衣抛度水田此願斷無不遂的兄弟就去把這件事回明老太太明日這裏便替二哥去說親且慢打發人進京等姻事說定了好到尊府去報個雙喜信兒於是甄寶玉回明瞭甄母派人到揚州林府去替賈寶玉求親寶玉才安心住在甄府不表講到榮國府裏自從走失了寶玉連日忙亂這一天探春在寶釵屋裏說起問蔔求籤總無准信探春道我記得二哥哥失了玉請妙師父扶乩乩上寫出來的話頭總像找不見的到底沒有找著我何不去煩他討個信兒寶釵搖頭道頭裏我回家去了也沒瞧見寫的什麽總是仙機秘隱須過後好詳況且妙師父這個人清中帶僻這會兒去求他休保定不推辭寶釵話未說完襲人在旁介面道奶奶的話不錯先前我求邢大姑娘去的邢大姑娘回來說作了許多難四姑娘倒和他好不如求四姑娘去走一趟說著起身便走探春叫住他道你住著我找四姑娘去探春便往蓼風軒去見桌上爐內點著一炷藏香小小一方端硯靠著手爐旁暖氣臨的一筆靈飛經小楷在那裏抄楞嚴經見探春進去便擱了筆連忙讓坐探春道這樣天氣你不怕手冷盡在這裏用功惜春笑道閑著沒有事不過借此消遣探春道你可知二哥哥出去了還沒回家呢惜春道據我看起來請老太太太太儘管放心二哥哥就有資訊的探春道有了資訊就好你知道二哥哥就有資訊這會兒在那裏呢惜春微笑道他在那裏我如何指得出來探春道但願早一天回來就好怕老太太先擱不住我這會兒來找你也不爲別的要你去煩妙師父扶乩倘蒙仙機指示得個早回來的喜信合著了你的話去告訴老太太太太也好寬寬心惜春道既是相信扶乩這是不難姊姊在這裏坐一坐我去了就來探春道我且回去停會兒有了你抄一紙叫彩屏送來說著出了蓼風軒自回秋爽齋去惜春帶了彩屏徑往櫳翠庵來找妙玉剛近庵前見妙玉一個人站在紅梅樹底下看花回頭見了惜春便笑道今年天氣冷的早節令沒到這時候四姑娘才幾天沒來你瞧這幾樹梅花都已沖寒開放了我也今兒見老婆子折了一枝進去才瞧見第一遭出來步步恰好遇見你來正是春在枝頭已十分想是你也爲尋春來的惜春微笑道我卻不爲尋春而來倒爲尋人而來的妙玉道我這裏輕易沒有人來你要找誰惜春道並不是到你庵裏找人因爲我家二哥哥出門走了沒處找尋要煩你扶乩呢一面把緣由說明妙玉聽說不覺神色一變呆呆怔了半晌才讓惜春進庵徑至妙玉房裏坐下妙玉道這件事要神清氣爽的時候才好這會兒晚了明兒清晨起來扶罷我這裏沒有個副手明兒須得煩你再走一趟惜春道這是我來煩你怎麽倒說煩我起來妙玉一時臉泛紅雲無詞可答惜春便與說了幾句閑話小鬟因惜春到妙玉處無事每每要下一兩盤棋才回去便不等妙玉吩咐隨手送了棋盤過來妙玉忙叫取開道今兒可不下棋惜春略坐一回起身出庵徑回自己屋裏過了一夜因恐賈母挂念一早起來梳洗完時用了些點心帶了彩屏便往櫳翠庵來那知妙玉起身更早已經設好乩壇諸事停妥專等惜春過去惜春便向爐內添了香虔誠禱告和妙玉兩個人左右站立分持少頃沙盤內龍飛鳳舞的顯出一個個字來妙玉隨看隨記乩停和惜春說道我念你寫惜春早在盤內看明便在桌子上書匣底下取了一張紙提筆寫就從頭念了一遍點點頭道怕他們看起來未必能詳解呢妙玉道還要管他們能解不能解你心上明白就是了惜春道我不比你第一爲的是老太太不放心說著便叫彩屏道你把這字貼兒送到三姑娘那裏去就說是今兒妙師父扶乩的句語詳解起來寶二爺不久就回來請老太太太太不必著急記清了快去彩屏應著走了妙玉讓惜春到臥室內惜春望桌上一瞧道好應時景早供上折枝了妙玉道今兒咱們弄一個早局一面命小鬟端過楸枰與惜春對局不提且說彩屏到探春處告訴了惜春吩咐的話探春便帶這字貼兒要往寶釵處才出屋門遇見邢岫煙也要去看寶釵因聞得這幾天薛姨媽有病不過來他和寶釵是素日常敘的好姊妹不必避忌所以過去走走便笑問探春拿的什麽字貼兒探春道就爲二哥哥的事又去煩妙師父扶乩呢說著把乩判遞給岫煙接過看了一看也不說什麽仍還了探春二人出了園門來至寶釵屋裏見宮裁熙鳳都在大家讓坐探春先告訴了惜春的話然後把字貼兒遞與寶釵李紈也過來同看著念道喜重重恨重重翻覆情緣轉眼中邯鄲未醒黃粱夢月方西墜去花謝一年紅冬寒雪凍莫尋蹤寶釵看畢便一手放在桌上道我不懂四丫頭是怎麽樣詳解的襲人忙走過拿與岫煙道請姑娘看看詳詳到底怎麽樣的岫煙笑道我見過的了仙機玄奧委實解不透呢想來四姑娘常和妙師父講究這些他說的自然不錯探春道別管詳的是不是且把四丫頭的話告訴老太太太太聽了寬寬心底下再看罷探春說著先自走了李紈鳳姐岫煙又坐了一回各自散去這一天李宮裁王熙鳳都在王夫人屋裏閒話鳳姐眼光早瞅著林之孝家的站在院子裏拿了幾件東西似要進來又不敢進來只瞧著鳳姐眼色鳳姐心靈早已猜著八九分便丟眼色叫他不要進來那知王夫人已經看見鳳姐臉上神色改變兩眼對著院子裏搖頭示意王夫人便問院子裏是誰爲什麽鬼鬼祟祟的不進來林家的答應了一聲慌慌張張要把手裏東西遞給院子裏站的老婆子鳳姐忙叫道快拿進來回了太太罷林家的走進屋裏都睜著眼見他手裏拿的就是寶玉那一天穿戴出門的衣服靴帽還有一股漆黑的頭髮梢上帶著素日墜的紅絲結束一串四顆大珠不待林家的開口王夫人接過手來細細一瞧不問情由便嚎啕大哭道不料他竟去走了這條路了李紈鳳姐在旁再三把王夫人勸慰一面問林家的道如今既然有了這些東西到底人在那裏這東西又是誰送來的呢林家的道這些東西是在焙茗手裏接來焙茗說是一個賣柴的鄉里老兒送到門上只說了二爺在什麽大荒山青埂峰出家一句話那老頭就走了鳳姐跺腳罵道好糊塗混帳羔子難得有這個人送了東西來正好著落在他身上跟究寶玉的下落怎麽就把這個個放走了呢林家的又回道剛才奴才也問過這句話焙茗說門上接了東西正要把他擒住那老頭兒肩上還挑了一擔柴回身飛跑就走門上好幾個人趕上去才轉得一個彎老頭兒便沒蹤影了一時想起他來挑的那一擔柴都是青枝綠葉的現在深冬時候那有這青綠樹枝知道這老頭兒有些古怪料趕也趕不著只得回來了鳳姐道聽他們的搗鬼快叫趕去捉不著仔細他們的腿林家的只得應了一聲是趕忙出去吩咐李紈道這會兒再去趕那個人想來走遠的了既是有這個所在不如打聽確實了叫人找到那裏去自然也找著了王夫人搖頭道這個地名想來也是一句渺茫的話找也白去找我橫豎不要這孽障的了就只苦了寶丫頭早知道這樣先前不如一頓板子任憑他老子打死了他也不至帶累人家女孩兒白受委曲老太太還把他當命根似的一天好幾趟叫人來問信叫我怎麽樣去回老太太呢話未說完只見鴛鴦急急的跑進屋來正要開口見炕上擺著這些東西王夫人淚痕滿面李紈鳳姐都站在旁邊用手帕子拭眼淚鴛鴦也看出些來蹤只得呆呆站著王夫人便問道老太太又打發你來問寶玉的信兒嗎你瞧炕上的東西罷一面鳳姐就把林之孝家的進來回的話細細告訴了鴛鴦鴛鴦道老太太很惦記呢夜兒三更時分睡夢裏醒來還說寶玉回來了聽見在院子裏說話叫我起來開門我說是老祖宗的心記寶玉要回家也不是這時候進來的聽著院子裏靜悄悄並沒有人老太太還說我躲懈立刻叫起上夜的老婆子來到底開門出去瞧了一回何曾有什麽影響呢這會兒又叫我來打聽有什麽信兒沒有我看這些東西可是叫老太太瞧見不得呢鳳姐道東西自然我們藏起來那寶玉現在這個地方總得去回一聲兒知道有了下落便容易找了也好哄著老太太暫且安一安心太太看怎麽著王夫人歎道你們自去酌量回老太太罷哩李紈鳳姐又安慰了王夫人一番便和鴛鴦來到賈母處委婉回明寶玉已有消息現在大荒山要學道修行的話賈母道這個孩子爲什麽這樣糊塗好沒志氣才娶了媳婦中了舉就起這種念頭快叫去打聽大荒山離這裏多遠趕忙打發人去接了他回來鳳姐只得應了一聲是回到屋裏叫人去請賈璉回來商議李紈自在賈母處陪著說話且說寶釵自從寶玉出門後終日與襲人傷心流淚襲人心裏不過胡猜亂想盼望寶玉回來惟有寶釵早猜透寶玉心事懷憂更切不但不肯向別人告訴就在襲人面前也未曾吐露出來這一日在自己屋裏落了一回淚見鶯兒端茶進來便把淚痕拭淨喝過了茶因有事要往王夫人處帶了鶯兒出門才走至穿堂想起一句話來叫鶯兒道你到璉二奶奶屋裏去瞧一瞧倘臻兒還在那裏叫他到我屋裏等著還有話問他呢鶯兒答應著自往鳳姐處去了這裏寶釵才走了幾步只見傻大姐從王夫人後院角門出來一隻手拿了兩枝絨花一隻手拿了一股髢發扭著脖子只顧瞧著嘴裏咕唧道這要他做什麽怎像寶二爺鉸下的頭髮烏漆黑又長又亮可惜他做了和尚了傻大姐一句話已被寶釵聽見不知寶釵聽了傻大姐的話怎樣光景且看下回分解
