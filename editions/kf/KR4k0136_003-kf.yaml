body:
  text: 第三回贈多珍反勸有情婢占神數預定再來人話說鳳姐叮囑了平兒的話往賈母處來賈母見了鳳姐先開口道林丫頭家倒有人來要接他回去了鳳姐道正是因先前他娘兒惦記他的路遠多年沒有人來去上年他家叔叔在他任上拿回來的銀子不多家裏房子花園皆已造了林妹妹的嬸娘自己跟前沒個親女想著侄女兒的很急巴巴打發人來托老祖宗的福林妹妹這場病回了過來身子也健旺了他們家裏的人來看見親戚面上也過得去說著又陪笑道還有一件事更湊巧果然林妹妹回了家寶兄弟的病再沒什麽牽纏了就是老祖宗跟前覺得冷靜了些咱們姊妹多年在一堆兒也怪捨不得他走開賈母道林丫頭雖然我疼他不是我說一句咒他的話比如他沒有回過來便怎麽樣呢況且女孩兒家終是別人家的人論不定我再活幾年難道叫他常住在這裏伴著我嗎既然他家裏好他嬸娘又疼顧他回去也是正經我倒省了一條心鳳姐探了賈母的口氣知道肯放黛玉回來的了少不得要在黛玉跟前款留一番到了次日隨著賈母王夫人來到瀟湘館見雪雁同春纖在外間屋裏疊箱子鳳姐笑道太性急了知道老太太肯放你姑娘回去不肯呢黛玉連忙讓坐道老太太舅母二嫂子那裏早該過去請安謝步因老太太不叫走動所以還沒過去昨兒到了家裏的人我翻翻憲書大後兒是個出行的吉日正想過那裏去呢在這裏住著說不盡蒙老太太舅母的恩典承二嫂子的照顧明兒一總去磕頭鳳姐陪笑向賈母道老祖宗看林妹妹才要回家先就生分了說起這樣話來賈母一面拭淚向黛玉道若論舅舅家裏同自己家一樣多住幾年也是應該的我又只有你一個外孫女兒很想常見個面陪著我說說話但是你嬸娘惦記你遠遠的打發人來我不叫你回去又使不得你才說大後兒的話也不必那麽性急叫你鳳姊姊再給你定日子罷王夫人順著賈母話不用性急的話留了一番黛玉只是笑笑心想老太太並不留我竟似夢中光景虧得家裏的人遲到了幾個月倘到的早了我當真也像夢裏這樣著急起來豈不是空惹一場笑話黛玉自在心頭盤算賈母同王夫人鳳姐又說了一會話然後起身同出瀟湘館黛玉送至門外因多時未出院門站住看了一會園中綠樹成陰架上荼蘼早已開放正是清和風景默感雙丸梭擲極宜早悟塵緣正在沈思見綠楊影裏露出湘裙招展遠遠望見幾個人行來雪雁在旁早已看明因指與黛玉道那邊來的不是大奶奶三姑娘嗎一語未了李紈探春已慢慢走近黛玉先開口道又是兩個留行的來了探春笑道偏偏猜的不著我和大嫂了是來商量餞行的黛玉道我在這裏住慣了倒不想回家怎麽三妹妹下起逐客令來李紈介面道林姑娘果然願意在這裏我同三妹妹就告訴老太太去探春道大嫂子理他呢別說咱們兩個留他不住就是老太太過來也怕留不住他了又問黛玉如今是大好了我們在那邊瞧見老太太太太二嫂子三個人才出去呢黛玉道才送了老太太們出去因今兒還是第一天到這門外站著看看園景就見你同三妹妹來了瞧我的身子早就可以走走因是老太太幾次三番的打發人過來囑咐所以連你們那裏還沒有去呢說著便讓進裏邊坐下探春問黛玉定了起身日期沒有李紈介面道聽三妹妹一開口想真像是來攆林妹妹走了探春道咱們姊姊相處心口如一這會兒說一半句留林姊姊的話明擺著無謂顯見得是客套了黛玉心想探春真是透徹爽快的人因微笑道剛才老太太在這裏講起叫二嫂子定日子估量不過在這幾天裏頭我家裏來的人也不能耽擱探春道我在大嫂子那裏說起姊妹們熱鬧了這幾年如今一天一天的冷落起來了再走了你園子裏頭不算妙師父剛剩我同大嫂子四妹妹邢大姊姊這幾個人了你病了這幾時連雲妹妹都也不來瞧瞧你如今也不知道你家裏有人來了這會兒打發人去告訴他們先前在詩社裏這幾個人都請了來派一個公分給你餞行再熱鬧一天黛玉道我本是鎮日家病的要不是這裏有事去請他們那裏專誠來瞧我的病呢如今我要走了也想大家見個面兒但就是當一件事去請累他們起動一番可使不得李紈道這也不費什麽事不過盡姊妹們一點子情他們也都是高興的說著見春纖在那裏忙忙的收拾東西便問紫鵑的病還沒好嗎黛玉道正是有一件事要托大嫂了就爲紫鵑還病著我走了他住在這裏也不方便難爲他伺候我這幾年求大奶奶疼顧他一點如同疼了妹妹一般免不得把他送到大嫂子那裏將來好了或是送還老太太屋裏或就伺候大奶奶都使得李紈道我不帶他回去嗎我瞧這丫頭與你很對緣法他這場病不是就爲你傷了心起的嗎他是一輩子要跟定你的了呢黛玉聽了眼圈兒一紅只得說道我昨兒問過他因是病還沒好願住在這裏呢探春因笑道大嫂子你瞧林姊姊的盼回家的心那麽急連紫鵑也不等他病好帶了走還說想要人家留他大家笑了一笑當下又問了些黛玉家裏的事各自回去打聽鳳姐那裏與黛玉擇的起身日期一面打發人去告訴各處衆姊妹一聞黛玉回家的信都要來餞行送別自不必說這裏黛玉想起要給紫鵑的東西趁此時閑著撿點出來省是臨期有姊妹們在此多添忙碌便去開了首飾匣子揀了幾件另放在一隻小小洋漆描金匣內自己端了走到紫鵑屋裏紫鵑披衣歪在炕上見黛玉進去便坐了起來道姑娘拿的匣子裏是些什麽黛玉就靠近紫鵑坐下揭開匣蓋逐一點給紫鵑看道這一對金雙鳳釵挑新樣串珠子還圓淨這一副八寶嵌珠環是時新樣式這一對手釧玉情很好這兩隻洋鑽金鐲子顔色也赤這是攢珠翠花一對金如意兩枝玉匾方兩枝還有金戒箍子七事件悲翠的五福拱壽雙鶴蟠桃都是些玩意兒東西我那裏還有把這點子給了你做個紀念你見了這些東西如同見了我一樣黛玉說到這裏禁不住兩眼淚珠直滾下來就在紫鵑炕上拿起手帕子來揩了揩眼睛紫鵑聽了亦惟有鳴咽之狀半晌說不出話來彼此都有不忍分離之意紫鵑意欲將在此逗留的緣故吐露一半句又想先前他們到那麽個分兒明擺著這件事尚且不敢在他跟前道破如今已鬧出意外的事不知姑娘懷的怎麽個心思叫我如何開得出口那黛玉瞧著紫鵑欲言不語半吞半吐的神情因自己把前情已付東流再不想到紫鵑有代他籌畫的意思不過是主婢情重怕離痛別隨又勸慰道要論咱們兩個人這幾年來行動坐臥那一時那一刻沒在一堆兒廝跟著這會兒生巴巴拆開了人非木石豈能忘情但咱們既同姊妹一般要替各人想一個結局我有兩句話和你說可該悟出這個理來人生離合在乎心而不在乎形彼此離了心鏡中燈下徒然嫌影憎形彼此合了心萬水千山亦可魂來夢去我勸你別爲我要走了儘是傷心但願你在這裏有個結局就一輩子沒的見面比天天在跟前的我還樂呢說著蓋了匣子伸手端過去放在裏邊又道還有綾羅綢緞尺頭同那些香袋香串繡帕荷包等類都是南邊帶來的要送人家沒送完昨兒叫他們整整的裝了一箱誰還帶這些到南邊去鑰匙挂著箱子上停會兒叫擡了過來你留著使用紫鵑聽話知道黛玉錯會他不同回南的意思也未便辯明並不道謝只說姑娘的恩典替姑娘收管著黛玉笑了一笑也不理會轉身出來已是擺晚飯時候一時吃過了飯見老婆子上來收拾盤碗便叫雪雁指出那一隻不編號的箱子分咐他們擡到紫鵑屋裏黛玉一個人坐了一會卸妝安歇一宵無話次日飯後黛玉想到櫳翠庵走走原來黛玉本與妙玉疏淡不大往來今因心中別有一番境界忽動親近之意不日遠別自然該去辭行今日空閒何不先去走了一趟當下換了衣服帶著雪雁正要出門只聽得小丫頭說史大姑娘來了黛玉忙站起迎接且說湘雲到來先去見了賈母王夫人鳳姐知道便趕來飾詞叫不必過寶釵那邊走動湘雲也沒理會賈母留住湘雲同鳳姐在賈母處吃了飯湘雲便帶了翠縷徑往園中一路行走心想先前寶黛二人光景如今一個娶了一個要走了滿肚子的話說不出來不知傷心到那麽樣個地步正思酌量一番婉語微詞來相安慰及至見了黛玉兩頰生春笑容可掬絕非舊時模樣甚爲詫異便道這幾時少有人來往所以這裏的事不大知道頭裏有人到我家去偏有客來纏住沒的細問後來聽我嬸娘說你大病了一場想來瞧瞧你家裏又接二連三的事出來昨兒大嫂子打發人去才知道你頭裏的病很重死去才回過來的如今家裏有人來了說道幾天裏頭要起身我今兒一早就趕了來黛玉道咱們多時沒見面很想姊妹們說說話就怕起動你們前兒大嫂子同三妹妹的主意打發人各處去說了倒累著趕早你就跑來了湘雲道你這一走不知多咱會兒才見面要大嫂子不去通知我們悄默聲兒放你走了我也不依他呢說著又問道你的病請著那一個大夫來瞧吃了些什麽藥如今倒調養得很好了黛玉順口應答了幾句湘雲又問你這會兒到那裏去黛玉道我病後還沒出過門想到妙師父那裏回來園子裏這幾處走走湘雲道我和你廝趕著一時出了瀟湘館徑往櫳翠庵來才進門去只見彩屏一個人在院子裏掐玫瑰花兒見黛玉湘雲進去便笑道姑娘們瞧今年妙師父這裏玫瑰花開的茂盛湘雲道你一個人到這裏來的嗎彩屏道我姑娘在裏頭呢黛玉湘雲便轉過東禪堂走進靜室見妙玉盤膝坐在炕上同惜春下棋兩個人忙要下炕黛玉湘雲便過去就炕沿坐下彼此問好說不要攪你們的雅興我們坐著瞧惜春道官著是完了妙師父要尋結打呢黛玉望棋上一瞧見惜春下的是黑子便笑道看起來倒像黑棋勝了呢妙師父如今還讓四姑娘幾個子妙玉笑道四姑娘的棋很長進了對下還輸給他那裏讓得起說著數起子來果然惜春贏了一子半隨將棋盤收拾妙玉叫老婆子去烹茶要那鬼臉青花甕裏的雪水一面向黛玉道咱們同在園子裏竟是天涯咫尺說你大病了一場也沒有過去瞧你今兒四姑娘說起知道你要回南了湘雲道妙師父雖然住在園子裏打量那邊的事情你統不知道呢妙玉道可不是寶姑娘恭喜有一兩個月了也是昨兒才聽見的四姑娘倒常來他從沒有提起這件事黛玉道妙師父可謂桃源中人不知有晉魏的了惜春道林姊姊說的話把這裏比作桃花源確是真的他們這些紅塵世俗的事我傳到桃源中來沒的叫妙師父洗耳湘雲道人家都在紅塵裏四妹妹將來是要上瑤台玉宇的了惜春微笑道你瞧著罷妙玉一面對湘雲道史大姑娘想是來送行的你也好久不到這裏來了黛玉道還是上年八月十五夜裏我和他在凹晶館卷篷底下聯句你撞了來拉到這裏鬧了你一會再沒來過呢妙玉道你們上年也委實高興那一夜有二更多天我在園子裏各處走了走不見個人影兒聽說四姑娘也還陪老太太在凸碧山莊宴月偏是那一夜的月色覺得比往年分外清皎滿園子都像浸在水裏頭一般遠遠望見那座櫳翠庵要浮起來了黛玉道那真是雲丫頭說四妹妹的話瑤台玉宇世界了惜春道不是上年的月比往年不同只因園中一無聞見妙師父心境澄靜覺得眼中月色分外光明要知普天下只有這個月爲什麽歡喜曠達的人看起來便有精神光彩懊惱愁苦的人看起來便覺慘澹淒涼若說歡喜的人不知愁苦愁苦的人不知歡喜便是人人有歡喜愁苦不同的境界易境參觀一個眼中的景象全從心坎裏流露出來的道理就明白了黛玉聽惜春所講竟是悟道旨言又看他神情舉止飄飄欲仙將來是妙玉一路人物想這座櫳翠庵可惜在大觀園裏不然他兩個倒可做志同道合的琢磨那時黛玉呆想出神湘雲推著他想怎麽聽了四妹妹的話又發心事了黛玉被湘雲一語道破便假意轉睛四顧道我羡慕妙師父這裏幽靜所在心裏想呢湘雲道你愛這地方也不用回家去就住在庵裏拜給妙師父做個徒弟可不好妙玉道當真林姑娘住在園子裏也不大見面他如今要走了不知怎麽樣心裏頭倒有些悵然其實人生飲啄有方譬如我本來生長南邊早就皈依三寶因慕長安古迹來尋貝葉遺文後來又到了這裏只怕就是圓寂的去處說不得狐死首丘的話了便如林姑娘在此伴了這幾年想不到他忽然又要回去迢遙南北路隔三千你們兩個再想幹那月下聯吟的韻事也就可遇而不可求了湘雲道我聽說牟尼庵這位老師父占的先天神數最靈你自然得其所傳何不煩你占上一課看咱們和林姑娘幾時再得見面妙玉道占課扶乩這些事我輕易不愛去動他如今你爲姊妹情分我便不便推辭說著站起身來在爐內焚了香虔誠占了一數道這數占得奇只在一年之內林妹妹不但還要來而且來了竟像不去的了湘雲聽了有些信不准妙玉的話便道占的句語何不寫出來大家瞧瞧妙玉道這先天神數並無內象外爻不但詞義玄奧連字迹都是蝌蚪篆文還比乩上的字難識難解就寫出來你們也不懂我原不是神仙不過據數而判信不信由你們於是湘雲再無話說惜春在旁說了一句豐幹饒舌衆人都沒理會惟黛玉心中大以妙玉的話爲不然因不便和他分證只是微笑惜春又道如今且別講林姊姊來的話昨兒大嫂子說的咱們那幾個人定了日子沒有湘雲道我還沒見過大嫂子呢你住在園了裏頭倒問起我來這會兒林姊姊要到大嫂子那裏去咱們同去問問妙玉道史大姑娘是稀客林姑娘又要遠別了茶還沒有喝忙什麽說著小丫頭子已端上茶來盤內盛著仍是分瓜瓟點犀喬皿這兩樣古玩與妙玉自己用的綠玉鬥雪雁翠縷彩屏接過分送老婆子又替另端過一杯送與妙玉黛玉喝著說道這就是那一年喝的你說在玄墓蟠香寺收的梅花上雪水如今還有嗎湘雲笑道妙師父留著等你再來的時候還夠你喝呢妙玉道史大姑娘你剛才和四姑娘說的話想是給林姑娘餞行了我不能盡一點子情便怎麽樣呢湘雲道也派上你一分何如黛玉道雲丫頭鬧什麽湘雲道不是要派妙師父公分給你餞行可笑咱們白鬧了這幾年詩社眼前擺著一位詩翁不來親近豈不是一宗缺典說著又向妙玉道先前自然不便拉你如今就是咱們姊妹這幾個沒有你避忌的人拉上你一位神仙師父林姑娘臉上也有光彩咱們姊妹也高興我去和大奶奶說叫他們的席面就擺在園子裏頭不抱你到檻裏去就是了說的大家都笑起來惜春道好樣不學怎麽這張嘴全彀兒學了二嫂子了妙玉道你們定了那幾個人四姑娘先打發人來說一聲湘雲道你放心打量也沒有別一個在裏頭等來齊了人告訴你就是了說著大家起身黛玉施了一禮說走的時候也不過來了妙玉送至庵外瞧他們走遠了然後回進庵中黛玉湘雲惜春三個人各自帶了丫環先到秋爽齋老婆子回報三姑娘不在屋裏大家抄了徑路往稻香村來不知湘雲與李紈如何議論餞行一事且看下回分解
