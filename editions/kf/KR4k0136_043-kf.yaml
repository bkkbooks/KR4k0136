body:
  text: 第四十三回聽捷音稻香村設席洗繁華蓮花落侑觴話說寶玉正在書房與清客相公嵇好古們敍談只聽一棒鑼聲喧嚷進來忙出去查問是賈蘭中了因有一名中式的磨勘雷同出來重又抽換所以放榜遲了兩個時辰寶玉便進內先到賈母王夫人兩處告訴賈母王夫人自是歡喜寶玉又忙跑往園子裏來徑至稻香村與李紈道喜說蘭兒中了李紈更加樂意不免又想起賈珠幾乎滴下淚來勉強忍住與寶玉說了幾句此時賈蘭喜信合府傳知適平兒在黛玉處回話便叫平兒去對你二爺說吩咐外邊帳房此番蘭哥兒中了一切應酬賞賜查寶二爺上年的舊帳總要加豐鳳姐那邊照黛玉之言回明王夫人自去辦理這裏黛玉約了寶釵湘雲岫煙探春到李紈處賀喜見稻香村外秋禾成熟匝地黃雲宛然田家風景黛玉對李紈道我要替大嫂子這裏挂一張匾寶釵道向來有人題過的杏簾在望最妙的了黛玉搖頭道不切當湘雲道大嫂子教子成名竟是畫荻遺風何如黛玉道也脫了稻香村本色不如老老實實題個耕讀傳家讓他自成一國寶釵道我們在園子裏住了幾年就是興詩社的時候擾過大嫂子一會並沒擺酒請過咱們今番蘭哥兒中了該掏個替己請老太太太太過來賞玩稻香風景咱們大家熱鬧一天衆人都道此論極是黛玉道也不要大嫂子花費我去封三十兩銀子送來叫柳家的端整酒席李紈笑道當真我短少了這幾兩銀子還要你送來只要你們去請老太太定準個日子我好叫他們預備黛玉道你們定了我還有個條陳諸色要配這個地方必得換個新鮮樣兒才好衆人問換什麽新樣兒呢黛玉道鋪墊不必華麗器皿都要古樣咱們穿戴切忌豔妝伺候的丫頭媳婦更不用說才襯得起大嫂子這裏農家風味來湘雲拍手道當真這樣果然別致有趣老太太見了倒也耳目一新李紈道我是現成的怕你們找不出這些衣服來黛玉道找是那裏去找呢各人開了長短尺寸一色是洋藍布青梭叫外頭成衣鋪子裏一兩天就縫起來了當下約定各自散去講到李貴承辦尤三姐葬事諸色停當擇於是日封口請寶玉前去祭奠這幾日因賈蘭中舉親朋道賀往來不絕自有賈璉與賈珍過來應接寶玉自去幹他的事帶了鴛鴦劍出了二門命小廝備馬坐上徑出大門揚鞭往郊外而來這一日正值重陽佳節那裏有一處勝境仿照戲馬台古迹名金台戲馬台甚高峻每逢重九遊人登高聚飲最爲熱鬧寶玉在馬上遠遠眺望因少知己作伴且心頭有事亦無意留戀一路行來見林楓染醉野菊堆金一派瀟疏秋色不多時到了尤三姐墓前下馬祭禮早已擺齊寶玉恭肅行禮想起尤三姐已許身柳湘蓮因湘蓮誤聽讒言退悔親事索還聘物鴛鴦寶劍以致霎時間青鋒殞命血濺梨花真可謂豔如桃李凜若冰霜今湘蓮已登仙籍猶有故情將一劍寄回歸于尤三姐墓中使鴛鴦兩劍不致分飛以示生離死合亦可慰幽魂於冥冥拜畢灑酒化紙接過鴛鴦劍正要送入墓中只見手中飛起一道白光直沖墓門而沒那劍連鞘都不見了寶玉竦然站立暗歎此劍固非塵凡之物又命李貴在此看工人擔土堆塚四周要種植樹株李貴道爺怎麽吩咐奴才總照著去辦要立石人石馬再起石牌坊也容易寶玉道不用你多講那尤家三姐節烈可嘉我將來真要奏上一本替他請旌建坊呢當下寶玉站著看了一會上馬回府一進園來找黛玉寶釵襲人回道兩位奶奶同姑娘們都在凸碧山莊登高去了寶玉連忙趕來見一班姊妹都在山坡子上觀玩湘雲見了寶玉笑道二哥哥到那裏去了各處找你沒見黛玉道他自然往城外別處地方登高去了寶玉道城外是去的就看了人家登高我一個人有什麽興致所以趕回來找著你們應個景兒你們倒都在這裏了園子裏要算這個地方最高你瞧各處的秋色都在目前山子底下這兩株桂樹雖然開敗了還有些餘香湘雲道安得道人殷七七不論什麽時候愛看什麽花就遣他開了何等不妙寶釵道不如登南山文峰清歌一曲更妙寶玉道我就羡慕孟參軍龍山落帽最爲韻事於是各人隨便起坐敍談說起李紈明日請酒的話寶玉道何不應今兒的佳節要等明朝黛玉道只緣今日人心變未必秋容一夜衰這兩句詩你就忘了春秋多佳日何必定要今朝寶玉道及時行樂咱們今兒也該賞賞菊花寶釵道園子裏的菊花咱們來來去去那一天不看他幾回定要怎樣賞他況且那一年賞菊做詩也算玩得他淋漓盡致的了如今憑你怎樣也再打不出新鮮稿子來我想不如把菊花饒了他罷衆人聽了都笑起來一時笑聲未止見一個小丫頭走來道太太叫二爺去問話呢寶玉便下了山坡往王夫人處去了這裏衆人也各自走散到了次日李紈親到賈母處相邀見薛姨媽邢王二夫人尤氏鳳姐已先在那裏衆人簇擁著賈母來到稻香村賈母平日輕易不到此處今值秋成時候與別處另換一番景象便歡喜道這不是到城外鄉村裏去了可惜不留劉親家在這裏瞧瞧到底與他們屯裏光景一樣不一樣鳳姐道這假的總比他們真的強呢一路說話將近門首一班姊妹都迎了出去賈母見他們一色的荊布釵裙田家打扮便笑道又是誰調排你們妝這個樣兒覺得換了眼比你們平日間穿的衣服還好看呢薛姨媽也笑道姑娘們真會玩兒一時走進裏邊就在南屋三間卸下後窗一眼望見稻香村的遠景真有開軒面場圃把酒話桑麻的景象鳳姐道大嫂子爲什麽不早言語一聲兒瞧了你們穿的我身上衣服很不配黛玉道你愛穿現成多幾套在這裏鳳姐連忙換了鴛鴦平兒幾個人見鳳姐換上還有多餘衣服猶如屬饜肥甘的見了蔬菜反覺新鮮可口一般也都換了賈母對薛姨媽道姨太太也見識過多了你們從小到如今倒沒有赴過這樣席面有趣呢薛姨媽道也虧他們變出法兒來孝敬老太太樂一樂呢說著賈母同薛姨媽先坐了邢王二夫人以下挨次就坐李紈執壺遞酒賈母滿屋子裏一瞧問寶玉那裏去了鳳姐道剛才還看見他呢正要叫丫頭們去找只見寶玉穿戴了北靜王送的玉針蓑金藤笠跳了進來合坐都笑他李紈道我們的田禾都要收割了穿了這一套子求雨來了寶玉道他們都扮了老農我也妝一個漁翁賈母道快脫了坐下來麝月秋紋連忙過去與寶玉除下箬笠寬了蓑衣寶玉隨便坐下與衆姊妹說笑飲酒賈母問蘭小子呢李紈答道他今兒去拜房師怕留住吃了晚飯才回來呢賈母又問薛姨媽道琴丫頭爲什麽不來薛姨媽道因是香菱膽小拉住他在家裏作伴沒有過來賈母道正是我聽說蟠大奶奶不在了還說許多搗鬼的話傳來不得明白姨太太講給我們聽聽於是薛姨媽將夏金桂臨終的話從頭至尾講了一遍賈母聽到叫香菱扶正這一節便點頭道這樣辦倒也罷了蟠哥兒幾時能回家呢薛姨媽道前兒蝌兒有信回來說趕年底總可到家王夫人道聽他說到香菱扶正的話竟像有什麽附在他身上他同香菱兩個死冤家天天烏眼雞似的死了肯便宜香菱嗎李紈道人之將死其言也善或者這位蟠大奶奶因他生前磨挫了香菱這幾年一時良心發現擡一擡香菱也未可知寶釵道我想起來還是太太的話不錯我們這位嫂子別想他死來肯說句良心話就到陰司裏上起刀山來還要嘴硬呢賈母道咱們盡仔說閒話姨太太酒也不喝珠兒媳婦今兒你是主人也該想法兒多敬姨太太一杯酒咱們還是行個令罷大家想一個沒有行過的新令才好寶玉道前兒一個同年請客行的令倒好玩我說了好那主人連這付象牙籌碼送了我老祖宗高興今兒就行這個令賈母道什麽樣的你先講給我聽聽寶玉道每一根籌上刻的西遊記上一個像唐三藏孫悟空八戒沙僧共是四根餘外有二十多根都是精怪各人暗取一籌都別言語惟取了孫悟空就要他出來尋師父倘然錯尋了八戒沙僧師弟兄見面各人喝一杯如尋著了妖精兩人拇戰必得戰勝了妖精許他去另尋再尋不著照舊搳拳賈母聽了歡喜道這個令倒沒有行過寶玉便叫鶯兒去取那副鐫像的酒籌來鶯兒去問了小丫頭取到酒籌先送與賈母看過交給鴛鴦抖亂暗中分與衆人偏鳳姐得了孫悟空便不依鴛鴦道怎麽你揀個孫猴子給我了鴛鴦道誰見來呢賈母道我常叫他是個猴子偏偏是他拿著了你們瞧他跳去罷衆人都笑了鳳姐手內拿著籌向各人臉上相面的相去那裏相得出來挨次看到湘雲湘雲笑道唐僧在這裏鳳姐便指著他道只怕就是你湘雲撒開手將籌遞與鳳姐看明原來是個耗子精二人搳起拳來鳳姐連輸了三拳挺著脖子喝了三杯道無底洞的耗子精果然利害直到第四拳才贏了湘雲又尋著寶玉道寶兄弟也做過和尚同和尚在一堆兒一定是了衆人都笑獨有黛玉臉上一紅因寶玉是紅孩兒已與鳳姐交手都看他們搳拳並不理會鳳姐又輸了兩拳然後勝了再尋過去不是沙僧八戒便是精怪鳳姐搳拳已喝了二十來杯酒鴛鴦看他有些支援不住算算籌也剩得沒多幾根了早瞧見賈母分的籌是唐僧便向鳳姐丟了個眼色鳳姐會意便向賈母笑道猴兒今兒殺敗只得來尋老祖宗了不知是不是賈母一手將籌撒放桌上道猴兒猴兒你師父在這裏何不早來尋著我呢當下奉敬了賈母一杯酒還是鴛鴦分籌這會賈母得了個孫行者恰恰鳳姐得了個唐僧賈母道如今該我去重整花果山了不知找那一個才好別也像鳳丫頭碰見就是妖精賈母一面說鳳姐早已照會了鴛鴦鴛鴦指點賈母去尋鳳姐賈母道我也不找別人找鳳丫頭鬼頭鬼腦定是他得了這一根籌子了鴛鴦笑道二奶奶拿出來看罷躲也躲不過去的鳳姐道老祖宗不是孫大聖竟是活神仙怎麽一找就找著了唐僧的籌子果然在這裏呢鳳姐便自己喝了一杯酒把這個令又轉了兩三轉李紈道剛只行令喝酒雖然雅致終究冷靜梨香院女孩子閑著叫他們來伺候唱幾套昆曲罷賈母道在這個地方瞧你們這樣妝扮不配打十番唱昆曲他們會打蓮花落叫幾個來打兩套聽才得呢薛姨媽道老太太果然想的到打起蓮花落來不但地方相配而且今兒統改了一個樣兒分外覺得新奇呢李紈便命老婆子到梨香院去立刻傳了四個女孩子來也穿了布衣服帶了蓮花落傢夥李紈叫他們把對景的蓮花落唱起來那四個女孩子就站在旁邊唱道田家樂春景天甕頭春酒美香甜一朵蓮花鄉村社火家家樂一朵蓮花綠楊影裏耍秋千咦嘛哈哈哈蓮花霎拉拉梅花落田家樂夏景天一溝新雨插秧田一朵蓮花空來閒話前朝事一朵蓮花輕搖蒲扇晚涼天咦嘛哈哈哈蓮花霎拉拉梅花落田家樂秋景天中秋供月慶團圓一朵蓮花高糧稻黍般般熟一朵蓮花不欠官糧便是仙咦嘛哈哈哈蓮花霎拉拉梅花落田家樂冬景天茆簷曝背笑聲喧一朵蓮花迎神社鼓咚咚響一朵蓮花五穀豐登大有年咦嘛哈哈哈蓮花霎拉拉梅花落賈母聽了笑道這一套田家樂蓮花落真配在這裏稻香村唱的咱們今兒這一天也樂夠了田家風味也要吃一口飯點點景兒算數了李紈又送了一巡酒然後用飯漱盥畢賈母又步出村外看看晚景衆人送賈母出了園各自回去黛玉才到自己屋裏見那看公館的媳婦等著回話道太虛宮工程即日便可完竣有件奇事我男人叫進來回明姑娘說開工以後常有一個瘸腿道人在裏頭指點這些做工的有的日子不見道人晚上點人數兒給他們的工錢總比早上點工短少一個人黛玉笑道有人做工沒人領錢不白便宜了咱們那媳婦道因爲領錢的人短少了不是他們鬧鬼也不去查察了常聽人家說但凡工程大了有魯班仙隱在裏頭誰認得出來呢說著在袖管裏掏出一張紙送與黛玉看道這上頭寫的都是太虛宮裏裏外外的對聯句子也是那瘸道人瘋瘋癲癲不知那裏抄來的叫照著在石柱子上鐫的鐫殿門外挂的挂呢黛玉接過約略看了一看知道有些來歷也不必斟酌便遞還那婦命他男人照著去辦就是了再講寶玉從稻香村出來轉到櫳翠庵前焙茗上前回道正要去回爺的話這閣子裏連雕工漆工一應彩飾件件完畢今兒晚了不能細瞧請爺明兒來看罷寶玉道不過在外面大略看看何必等明兒呢說著擡頭看那閣子自下至上共三層聳接雲霄比園內東敘兩樓並大觀樓還高前後左右另有精致坐落四面一色水磨磚牆牆頂滿砌嵌空花磚下面都是五尺來高二丈余長的白石築腳牆外平砌虎皮亂石第二層第三層閣外俱有遊廊通轉窗欄杆雕刻精細時新花樣上面銅瓦泥鰍脊背焙茗問道爺瞧這閣子的工程何如寶玉點頭焙茗見寶玉看得樂意便道二爺再進裏邊瞧瞧越發好看多呢寶玉道外觀已見一斑等天下了雪請老太太賞梅花再進去瞧罷工頭還該他多少銀子你到庫上去領焙茗道還短他四萬五千正項他前兒說這工賠了錢求二爺格外賞賞那也不用理他奴才自同他磨牙去又道屋子裏還得上一張匾額請爺擬定了什麽字叫他們做去二人一路行走說話焙茗自出園去了寶玉來到瀟湘館坐定黛玉道今兒大嫂子那裏各色排場都相稱倒是一洗富貴氣象寶玉搖頭道老太太同你們都說好只是不合我意那一年有了娘娘省親的信佈置園景老爺同清客相公們都到這個地方問我好不好我對他們說遠無鄰村近不負郭總是造作而成欠天然二字老爺還嗔著我呢黛玉道怪不得老爺要嗔你據你的意思不過道咱們園子裏頭不該有這樣地方若講造作而成那一處不費人工的呢即如你的怡紅院寶姊姊住的蘅蕪苑我這瀟湘館天造地設就是這個樣兒不借些人力在裏頭的嗎寶玉笑道派我講錯了不用再說如今有一件事同你商量賞梅的閣子已造起了這也不算得多此一番造作比如這裏栽了竹子就有這座瀟湘館寶姊姊那裏有這些香草便有個蘅蕪苑類而推之蘆雪亭藕香榭蓼風軒梨香院凡有花木香草栽植之處定起一樓閣亭榭以爲觀玩之所獨有那數十樹紅梅開放左近並無一閣一堂想是那時候趕緊辦差只顧得眼面前這幾處地方略幽僻的他們也不暇旁顧了因地制宜此處必得起此一閣不過補其缺漏非漫事添設黛玉道誰人說你多事了寶玉道園子裏各處的匾對多半是我的老爺也知道如今寄到老爺任上看了再定來回要得幾個月我想這會兒先挂上等老爺回來見了嫌不好再換也使得黛玉道老爺回來如今也不理會到這些事情上你擬定了沒有呢寶玉道這閣子原爲賞梅而起高啓梅花詩縞袂相逢半是仙就題名迎仙閣何如黛玉道迎仙望仙古來都有過的不如竟用半仙兩個字倒現成也別致些於是寶玉就定了半仙兩字又念出對句道景借紅霞侵玉照人來紫府換冰綃還有一聯是風約暗香清酒政月邀瘦影伴詩魂請教妹妹你道好不好黛玉道也好這是陸放翁的佳句寶玉道妹妹何不替我改好了就發出去叫他們鐫刻起來黛玉道各人的思路筆意這就很好的了何必又要改呢又笑道如今在老先生面前也不敢捉刀寶玉聽了一笑也就罷了黛玉又問寶玉道前兒太太叫你去問什麽話寶玉道真是沒要緊的就爲蘭兒中了要謝老師鳳姊姊查對上年的舊帳說他們錯記了太太問我送了房師多少贄見禮我那裏知道這些呢當下寶玉在瀟湘館無事可記話刪絮繁一日彩雲去看了黛玉出來紫鵑拉他到雪雁屋裏去喝茶停一會走了黛玉問紫鵑道彩雲同你咕咕唧唧說些什麽紫鵑道彩雲說起環三爺如今竟絕腳不到外頭去胡鬧了看蘭哥兒中了臉上也知道害臊叔叔趕不上侄兒子他一個人在屋子裏看書巴結就有人來給他提親了趙姨娘很感激說都虧二爺給他捐了監同蘭哥兒下場鼓舞他起來的又說他先前自己糊塗外四路進來這些師婆媒婆沒有一個好的底下再不許他們進來走動黛玉道爲什麽趙姨娘講起這些話來紫鵑道我也問他呢彩雲說趙姨娘想來是爲趙媒婆幹的事見不得人趙姨娘同他也有些拉扯如今自己悔過講出來想要做好人了黛玉聽了點點頭道我說天底下再沒有不可感化的人說著帶了雪雁出門往紫菱洲看湘雲岫煙閒話去了紫鵑也自回怡紅院去這裏有什麽情事且看下回分解
