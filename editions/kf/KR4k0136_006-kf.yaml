body:
  text: 第六回怡紅子泣黛感殘春滴翠亭訴鵑傳密信話說鳳姐與王夫人伺候了賈母的飯出來平兒早在廊簷下站了好一會便跟著鳳姐出了院門王夫人自回房去平兒回道瀟湘館的帳幔鋪墊連那些陳設古玩一箍腦兒收拾起來史大姑娘搬到邢姑娘房裏去住了奶奶吩咐的話裏裏外外都已知道再沒有人在他跟前走漏一半句話的了鳳姐歎口氣道我也是白操心你可聽見老太太的話還不是委曲死了人再沒處去訴冤平兒道老太太的話也不過今兒見林姑娘走了心裏自然不耐煩過了幾天也就沒有什麽了鳳姐道不是這句話裏頭說的寶玉在園子裏見了襲人便認做林姑娘講了好半天的私語又是什麽爲著不放心都弄的一身病出來這不是襲人親口告訴太太的話我那裏知道他們這些鈎兒麻藤呢平兒道不是昨兒我和奶奶說過這話林姑娘這個人真是奇怪瞧他今兒走的光景怨不得老太太見了想起頭裏這些話要不舒服呢鳳姐道這也叫人家想不到的事我那能未卜先知一路說話回到自己屋裏平兒道奶奶一早起來也沒吃過一點東西叫他們擺飯罷鳳姐道可不是嗎戴了石臼子提猴兒戲我是費力不討好鬧了一早上這會兒覺著肚子裏有些饑呢平兒忙叫傳飯鳳姐又打發小紅去看寶玉回來說這會兒也在那裏吃飯就要到園子裏去呢鳳姐叫平兒道你在這裏吃了一點子同我到園子裏去走一趟如今可由他去罷就是別叫我太太得知保不定又要生氣發惱呢當下鳳姐用過飯帶著平兒正要往寶玉屋裏去聽說寶玉已到園子裏去了鳳姐連忙趕上寶玉才進瀟湘館襲人先已吩咐廚房裏把祭禮擡來擺設齊整寶玉走進屋內舉目四睜止不住淚珠撲簌簌滴下來便問林姑娘棺停何處鳳姐趕忙上前道林妹妹的靈柩打發人同紫鵑送回南邊去了寶玉歎道林妹妹生前是愛住這屋子的也該多停幾時到月朗風清時候他自然還要出來賞玩院子裏這幾竿竹子怎麽急巴巴的送他回去連紫鵑也走了總恨我這一場病誤了事生不能見其死死不得見其棺說著上香灑酒襲人忙把拜墊鋪好寶玉雙膝跪下不等拜完放聲大哭淚湧如泉幾乎暈去襲人等在旁百般勸慰勉強節哀忍痛起身將祭文焚化爐內又親自走出院內在假山石邊燒化紙錢那火光沖起竹枝上的雀兒飛鳴旋繞起而複下寶玉道這些雀兒想也因林妹妹成仙去了找尋故主不見其鳴也哀大有感舊之意何況於人說罷呆呆的看了一會踅身往裏便走到黛玉臥室內坐下見炕帳門簾鋪陳等物收拾一空黛玉平日所坐這把圈椅還照常安設寶玉就在椅上坐下回首茜紗窗上竹影迷離宛然如舊而室在人亡不勝今昔之感無奈襲人等再三催促只得起身一步挨一步的出了瀟湘館襲人等跟著也不敢引往別處仍由原路而回只見落紅已盡葉滿枝頭寶玉仰天歎息道可憐一歲春光又在病中過去記得林妹妹葬花詩裏的一朝春盡紅顔老花落人亡兩不知奈紅顔未老霎時粉碎香銷不想讖語即應於此日落花不知有林妹妹林妹妹亦不知有落花了然昔年落花而葬花者尚有林妹妹今林妹妹死了連棺木也不得一見是落花爲林妹妹知已我待林妹妹反不如林妹妹之惜落花豈不痛哉寶玉唧唧噥噥襲人在旁只是好笑不敢做聲一時出了大觀園襲人等因賈母叮囑在前命寶玉不必過去請安此刻才祭了黛玉回來餘怯未盡不便引寶玉到賈母處一徑同他回到自己屋裏鳳姐自與寶釵敍談寶玉因剛才進園觸景傷春想起黛玉的葬花歌與襲人索取紙筆研墨寫道燈殘吟罷想伊人令我如癡問宿因恨到無言花入夢儼然花裏夢中身獨立珊珊映繡衣定晴還認是耶非憐卿命爲紅顔薄一片悲心付落菲流年如水美如花遲誤青春恨已賒寄語鵑兒須細揀休教連理惹人嗟人自娉婷花自芳惜花偏其是紅妝癡情吟到春殘句埋塚花魂也斷腸香滿花朝浴水盆知卿花與是同根他年豔骨囊收拾樹樹濺紅滴淚痕香雲稽首問天街毓秀如何黛複釵手鏡自憐消瘦甚芳心已共落紅埋花謝花開十二時晴雯偃蹇已如斯香消此日誰人惜惟有蓉神尚鑒之香歸紅了入情鍾步轉瀟湘拭淚容偏是綠衣知解語隔簾頻喚葬花儂寶玉接連吟了八絕還在吟哦構想襲人過來把筆硯端開道才到園子裏去走了一趟回來也該躺著養養神儘是鬧這些什麽呢我拿去給二奶奶瞧瞧寶玉被襲人一語提醒恐被寶釵走來看見連忙取過自去藏了便和衣倒在炕上不提再說寶玉先往瀟湘館祭奠黛玉之時岫煙惜春在賈母屋裏看抹了一會牌隨後廝跟著走了二人進了園門行至沁芳橋分路岫煙一個人走過瀟湘館門外只聽得裏頭熱鬧止步細聽見一個老婆子出來岫煙問其緣故那老婆子瞧著沒有別人便和岫煙悄悄說道我告訴姑娘一件事心裏我們都不得明白今兒才知道底細原來林姑娘病死後回了過來見瞞著寶二爺的姑娘你評評有這個道理嗎一個人的死活可得混說得的林姑娘年紀輕輕活咒他死了也不知上頭誰出的主意老太太那麽個疼林姑娘倒這樣委曲他老太太知道肯依嗎姑娘你聽聽這就是寶二爺的聲音在裏頭哭林姑娘那麽傷心呢我和姑娘說了這話再別到上頭提起叫我們落不是岫煙聽了心中大以爲不然呆了半晌道你放心我再不告訴人家就是說著一徑自回紫菱洲少停賈母處牌局散了湘雲同迎春回來湘雲一進屋門先叫一聲邢大姊姊道你看天下竟有這樣竟想不到的事頭裏紫鵑不過和二哥哥白說句玩話鬧的連林之孝家的要打出去今兒林姊姊當真回家了我聽說二哥哥的病已經好的了怎麽躲的影兒也沒見前後炎涼判如水火難得顰兒竟像不理會似的反說要去辭別他這兩個人行事古怪倒是一個樣兒的熱起來比太上老君煉丹爐還炎冷起來如同水晶宮裏的冰塊還涼邢岫煙笑道我今兒聽見一件事你知道了越發要生氣湘雲問道你又聽見什麽岫煙道頭裏上頭囑咐叫人家別在寶玉跟前提起林姑娘我只道是爲寶兄弟聽見林妹妹三個字怕勾起他的舊病來今兒才知道大家都哄著他林姑娘已經死的了可是奇不奇湘雲不通道是那裏的話岫煙道剛才我從瀟湘館門首走過寶兄弟正在裏頭哭林妹妹呢湘雲道原來有這些緣故怪道今兒二哥哥還沒有出來還阻止林姊姊不叫去辭行呢這個主意也再沒有第二個人盤算出來的我想林姊姊家裏倘或沒有打發人來接他到底把這一個人藏放那裏去真個把他硬裝在棺材裏頭不成這算心機也使盡的了就是太苦了顰兒偏偏知道得遲了倘早上知道這件事定要和林姊姊說明別叫他錯怪了人這裏正在說話不料探春來找湘雲被他聽見了笑著嚷進來道錯怪了人怎麽樣正要他錯怪了人才好呢於是大家一笑讓坐探春向湘雲道這件事你告訴了林姊姊斬釘截鐵之後又藕斷絲連起來到底要替他想條出路叫他怎麽樣呢他們這樣辦雖然心狠手辣好比砒霜巴豆殺人之藥只要投得對症亦可救人我知道你這張嘴是快的將來見了寶哥哥切不可吐露一半句話明明一座火焰山已借鐵扇撲滅的了經不得再去一挑勢必複燃又將何法救之岫煙道史大妹妹你聽三妹妹的話不錯翻騰出來要落多少人抱怨探春道落抱怨沒要緊破釜難以瓦全公憤每多僨事你細去想罷湘雲道這口氣怕按不住我也再不到這裏來了岫煙迎春聽了都笑起來少表紫菱洲衆人議論再講黛玉那日出了榮府順便過邢夫人處並到東府裏辭了行坐車至水路換船一路行程迅速到了家裏和他嬸娘相見自有一番敘話又叫丫環引少爺來見了姑娘黛玉把他兄弟撫摩一會心甚歡喜當下揀了一坐院落院內也有太湖石金魚池點綴精雅間植幾種翠竹幾株桃杏濃蔭軒窗兩邊超手遊廊欄杆曲折似有瀟湘光景一進內室見房屋精潔鋪設整齊朱漆架上擺著幾盆素心建蘭幽香滿座樓上三間黛玉在西首一間內做了臥房命將書籍一切擺在中間以爲坐落之處留出東首一間供奉大士畫像對面兩座廂樓安頓了老媽子丫頭並放置箱籠等物逐一部署停當那邊又打發人過來另立小廚房起火便於呼應榮府來的家人因南邊有應辦事件同他媳婦暫且稟辭走了留下兩個老媽子和黛玉的乳娘李媽就在院內廊房安歇黛玉嬸母常過黛玉這裏閒話深服黛玉心地明白才幹宏通自是閨秀中出色之人是時因有粵東任內帶來的賑濟抄冊恐接手藩司挑剔糾纏偶與黛玉談及此事黛玉便叫把底冊一齊搬過細細核算並無錯舛不久果有公文到來咨查即便開具簡明清析命管事家人具呈由江都縣詳轉咨覆完結以是越顯黛玉長才卓識凡有家務大事無不與商黛玉回家後經歷一切並安葬林公夫婦非無可記之處因黛玉這一個人原是書中之主如今離了大觀園與寶玉諸人隔絕卻又似主中之賓所事皆非前書關鍵若逐一鋪敍未免寫成兩橛似無趣味不如一概刪除俟到鬥榫合縫峰回路轉之時再爲接敘以省筆墨且講賈母自黛玉去後雖不免心中牽挂細想事已如此留在此間有許多關礙不如走的乾淨又見寶玉早晚過去請安起居飲食如常心中歡喜鳳姐更以黛玉回家一刀兩斷陳平妙計已得收功可以在王夫人面前掙個滿臉一日正在自己屋裏與平兒兩個開了箱子打東西賈璉不知在那裏喝了酒大醉回來趔趄著腳步走進屋門一屁股歪在椅子上平兒聽見因手內不空小紅又支開他去了不在跟前就叫小丫頭去倒茶那小丫頭托茶盤進來被門簾一帶幾乎把茶碗打翻平兒看見連忙出空手來去接了茶碗送在賈璉面前賈璉豹著兩眼嚷道如今這班人一個個都吃飯不管事的了只怕過幾天連端茶遞水都要自己動手的日子還有呢一頭說話吃了幾口茶賭氣把碗摔在桌子上自去睡了鳳姐聽了賈璉的話便把箱蓋關上東西也不找了叫平兒進去說道這又是那裏來的這一股子邪氣不知在什麽地方灌了一泡子黃湯家裏來打悶葫蘆這個日子還過得嗎平兒聽了也不敢言語到了明日起來賈璉酒醒把上一天的事竟全彀兒忘了反喜皮笑臉的向鳳姐道我有一句話和你商量不知你依不依鳳姐道二爺有什麽吩咐只管請說賈璉又陪笑道林妹妹回了家聽說紫鵑沒有跟去橫豎白閑著我看屋子裏的人也不夠使你去回太太一聲何不把他叫到這裏來呢鳳姐冷笑道原來爲這句話所以昨兒來裝下馬威壓派我們的這有什麽要緊也不犯先發這一肚子氣紫鵑本不是林妹妹家帶來的人林妹妹回去了他現在沒有主兒二爺要叫他過來並不是一件難事就聽見他病著過幾天他病好了我去回太太一聲諒來紫鵑也沒有什麽不願意賈璉聽了甚是感激鳳姐難得他那麽大方起來停了一會吃過早飯自出外去了接著林之孝家的進來回話鳳姐吩咐了他幾件事又問道林姑娘走了那屋子裏上夜的老婆子們還在不在林家的道正要回奶奶這句話他們都是經由那一帶歇息的因是左近沒有可住的屋子還照舊在那廂房裏歇著他們倒來請過示奶奶叫他們怎樣呢鳳姐道屋子盡閑著就叫他們住在那裏看看門戶也使得只吩咐他別熬夜賭錢吃酒說著使問紫鵑還在那裏住嗎林家的答道就是林姑娘走的時候搬到大奶奶屋裏去住了鳳姐道紫鵑家裏可還有他老子娘沒有林家的道他老子娘都已死過的了只有他一家子的叔子嬸娘都在京裏鳳姐道紫鵑本來是老太太屋裏的人伺候了林姑娘這幾年如今退回去倒叫老太太見鞍思馬難免傷心過一兩天你叫他嬸娘進園子裏來一徑到大奶奶那裏領了他出去任憑他叔子去許人家我見了大奶奶再提這話就是了林家的答應了一聲是便起身走了這裏鳳姐笑著和平兒說道你瞧二爺這個人真是夾著碗裏瞧著鍋裏的心思單單在這上頭紫鵑沒有跟林姑娘走偏他察聽得這樣明白就盤算到他身上去了要個丫頭原是一件淡事你想紫鵑這個人可放得在這裏的嗎一見寶玉叨噔些什麽話出來就是太太也斷然不依這件事如今在二爺跟前且不必提等紫鵑出去了我和二爺明白講罷平兒聽了沒敢做一聲想到紫鵑相依林姑娘寸步不離霎時間回南的回南遣去的遣去出於人情意料之外心中未免悵悵講到紫鵑送到黛玉後搬到稻香村住下病已養好夢想眠思忘不了主婢恩義一日飯後悶坐無聊便一個人走出門外看看園景定不准到那個地方去好由著腳步向前不知不覺的到了瀟湘館門前見院門虛掩推門進去悄無人聲但見竹影重重綠陰滿地紫鵑一徑跨上臺階走進黛玉住的屋子里間恍如舊識重逢十分親熱一時神魂飄蕩似入夢遊紫鵑獨自一個人坐在屋子裏流了一回淚走出院子裏見假山石畔一堆紙錢灰紫鵑吃了一驚歎氣道不知我姑娘在這裏結了些什麽不解的冤仇他們擺佈得我姑娘還不夠那一個黑心的人見姑娘走了化些紙錢在這裏咒詛他呢當下氣憤憤的出了院門才轉過彎對頭撞著小紅見他跑得喘氣吁吁的小紅見了紫鵑便煞住腳問道姊姊那裏去呢瞧姊姊臉上倒像和人家鬧了氣似的紫鵑便將看見紙錢灰的緣由和小紅說了又道這件事我查了出來一定要去告訴老太太的妹妹你的耳朵長替我留心查察查察有了些蹤影悄悄來告訴我我決不帶累你的小紅對紫鵑怔了一會便道這裏怕有人來不便講話尋一個僻靜地方去說著便緊走幾步超過山子背後回轉身來把手招著紫鵑紫鵑在後面跟著到了蜂腰橋小紅望橋上亭子裏走了進去紫鵑隨後趕到小紅拉著紫鵑的手靠近坐在窗檻上說道姊姊要查瀟湘館化紙錢的人我倒有些影響但不便告訴你你也怨不得化紙錢這個人我勸姊姊把過去的事都撩開了罷現在姊姊有一件禍事到了我來報你個信呢紫鵑驚問道我有什麽祝事原來小紅聽見賈璉對鳳姐說要紫鵑鳳姐已經應的後來吩咐林之孝家的話小紅卻不在跟前並未知道因他從前在怡紅院當差也常往黛玉處跑動與紫鵑說得投機今聽了這個信來告訴紫鵑便道昨兒我聽見二爺和我奶奶說你沒跟林姑娘回南總是閑著要叫你過那邊去呢紫鵑怔了一怔問道你奶奶怎麽樣說呢小紅道奶奶是應許了說回了太太來要你你想這個地方可以去得的嗎平姑娘這麽樣一個人常在那裏受委曲別人不知底細坑兒卡兒的事那一件不在我肚子裏紫鵑不等小紅說完便狠命地指著地上啐了一口道我不是在你跟前說你們爺同奶奶他兩口子的心腸到底怎麽樣生的把一個林姑娘擺佈走了如今還不放手要盤算到我身上來了小紅笑道你瞎生氣也不中用我來告訴你原叫你思前算後拿個正經主意才是紫鵑道有什麽正經主意簡截一句話我不願意過去就是了小紅說這也由不得你二奶奶回了太太太太作主你拗得過嗎紫鵑道別說太太做主我是老太太給林姑娘的人就是老太太有別的話說我拚著這條小性命什麽事不了小紅一面聽紫鵑說話想起從前故事把窗子推開半扇瞧著外面並沒有人來因又說道你既住在大奶奶那裏我的意思不如回去求大奶奶想個法兒不要那麽瞎蹦我趁奶奶睡中覺的空兒瞞著平姑娘趕進園子裏來找你我出來有時候了姊姊你坐著讓我先走說著便飛跑的去了這裏紫鵑無心打采的獨自一個在亭子裏頭坐了一會站起身來離了蜂腰橋也無心緒到別處地方去走動慢牟仍回稻香村來坐在自己屋裏納悶見素雲進來找他道奶奶叫你說話呢紫鵑便跟著素雲來見李紈李紈瞧著紫鵑歎了一口氣道林姑娘回家很該帶了你走的就爲你病著沒好多耽擱幾天也沒什麽要緊我聽林姑娘的話估量你們已經說明白的了誰知林姑娘走後聽起你的話來還是要去跟林姑娘的爲什麽不早拿個主意如今這件事叫我怎麽樣呢紫鵑怔怔的聽了知道就是小紅的話發覺了便賭氣道大奶奶也聽了他們的話那是我死也不願意過那邊去伺候的李紈道你的話是那裏來的誰又叫你到那邊去紫鵑聽說一時摸不著頭腦只是呆呆站著李紈把紫鵑拉過身旁悄悄的說道這件事也難怪你不得明白我告訴你就知道了爲的是林姑娘走了你還住在我屋子裏怕寶玉到園子裏來瞧見了你勾起他的舊病了所以上頭做主要叫你嬸了進來把你領了出去配人家並不是要你到那邊去伺候誰你聽聽這些話我敢留你住在園子裏嗎紫鵑聽了李紈的話心想剛才小紅說來保不定璉二奶奶因璉二爺有了這句話又弄的鬼這是我倒感激他若說寶玉見了我怕勾起他的病來我想如今的寶玉未必像頭裏了他們既然慮的到打發我出去我能死賴在這裏嗎我出去不打緊今生今世別再想和姑娘有見面的日子了此時紫鵑把從前欲見寶玉的念頭已灰懊悔不跟了林姑娘回南以致變生不測身不由主一時氣苦傷心便鳴鳴咽咽的哭個不住李紈看了紫鵑這般光景便道好孩子且別哭林姑娘再三叮囑照顧你的如今叫我替你想不出個法兒來要送你到林姑娘家裏去這會子那有這樣湊巧妥便的人我這裏住不得更沒有你可住的地方偏偏頭裏料不到有這件事早知這樣史大姑娘回家的時候回到他家裏去暫住幾時也使得紫鵑住了哭道那也不成一件事況且史大姑娘當不得家跟他去算什麽呢既然大奶奶這裏不便我倒要盤算出一個地方來了只要大奶奶作主還得到二奶奶那裏去擔當下來底下等有便人再送我到林姑娘家去就是了說著便跪下磕頭李紈忙把紫鵑拉起道你有話儘管講到底這個地方去得去不得不知紫鵑心想去的是那一個地方且看下回分解
