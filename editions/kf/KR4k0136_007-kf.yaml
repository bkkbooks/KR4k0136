body:
  text: 第七回巫峽殘雲對姊喚妹芸房幻夢兆吉疑凶話說紫鵑想出有一個可去的地方李紈問何處紫鵑說是櫳翠庵李紈笑道這也難爲你想得到果然妙師父那裏輕易沒有人走動且去住著等我再想法兒送你到南邊去二奶奶的話我去給你擔下來妙師父那裏你可自己去求四姑娘和他說聲估量也沒有不允的於是紫鵑便往蓼風軒來見惜春正和妙玉下棋紫鵑與惜春請了安便向妙玉問好妙玉瞧著紫鵑你不跟林姑娘回南去嗎紫鵑答道姑娘起身時候我還病著底下想要去呢妙玉一面聽紫鵑的話只顧下子道一半年的時光在這裏住著也使得惜春笑而不語紫鵑因妙玉在此不便說話到彩屏屋裏坐了一會等妙玉走了來求惜春細細說明緣故惜春道你就在大奶奶那裏住著也沒相干既然大奶奶膽小你到妙師父庵裏去暫住幾時底下再瞧光景明兒你過去就是了所有你的東西不用都搬過去省得一番嘮叨紫鵑謝了惜春仍回稻香村來把惜春的話回了李紈過了一夜紫鵑自往櫳翠庵去且講李紈到鳳姐處告訴了紫鵑的話鳳姐心中雖以爲不然因是李紈作主只得勉強應許道大嫂子可叮囑紫鵑不許走出庵來萬一撞見寶玉可是不依他的我吩咐他們打聽有京官家眷回南的便就打發一個老婆子送了他到林姑娘家裏去李紈道因是林妹妹再三叮囑我的看紫鵑這孩子也實心他不願意出去竟是這樣辦法妥當一面說話李紈便同鳳姐到王夫人處去了再說寶釵與寶玉完婚後惟於夜間分床寢宿日則相伴相依一無避忌寶釵每每留心察看寶玉或于梳妝時也喜調脂弄粉或于握管時代爲研墨拂箋一種款款勤勤的光景竟似把當日愛慕黛玉之心漸漸移到自己身上來了豈知寶玉向與寶釵繾綣之處視迎探姊妹雖略有不同較之視黛玉的心思又迥乎各別所以曾向寶釵褪取香珠偷覰一彎玉臂有若生在林妹妹身上將來可以親近之想如今可以親近了雖極意綢繆卻仍以從前姊妹相好的情分相待此是寶玉不肯負黛玉的癡心寶釵如何猜得透講到鳳姐常在寶釵屋裏走動看見他們親熱的光景便與王夫人商量道老太太頭裏因寶兄弟病著要給他沖喜趁老爺在家急辦了這件事把寶妹妹娶了過來我如今看寶兄弟的病已大好了鎮日一堆兒混著不給他們圓房也不成一件事太太何不回明瞭老太太算起來此時還在國孝裏頭依舊不用驚動親友揀一個好日子給他圓了房豈不是好王夫人道我也想過你今兒提起我就回老太太去當下王夫人去回賈母賈母笑道我只算寶玉是已經完姻的了倒忘了他們還沒圓房這也不費什麽你就趕緊去辦罷於是王夫人就叫鳳姐吩咐林之孝家的叫外頭去擇了吉日不過祭祖家宴新房鋪設一切預備現成並無可記之事書不瑣敘且說寶玉圓房之後與寶釵伉儷綢繆而于夫婦敦倫之樂卻甚淡然寶釵身分持重端莊斷無反去俯就之理一日寶玉夢中只記得娶的是黛玉回房進來連叫妹妹見紫鵑在旁笑指床上寶玉寬衣就枕來纏黛玉黛玉半推半就任寶玉恣其歡愛一似夢遊太虛幻境與仙女初試雲雨滋味豈知醒來卻是寶釵口中猶喚妹妹不已寶釵也不言語次日起來寶玉正靠桌上看寶釵臨寫靈飛經字帖想起昨夜夢中之事惟恐寶釵盤問只是默默不語聽得秋紋在院子裏說道蘭哥兒來了寶釵把帖收起放在一邊賈蘭進來請了安寶玉命他坐了賈蘭就在炕旁杌子上坐下寶玉問道你近來的文字太爺可說你有些長進沒有蘭哥兒答道太爺說道倒還有些思路叫侄兒上緊用功呢寶玉道你該聽太爺的話努力用起功來等到明年秋天咱們同去下場賈蘭欠身回答道可不用等明年秋天侄兒正爲這件事來回二叔叔剛才聽見璉二叔說早上在內閣裏見過上諭因當今得了太子不等明年元旦頒發恩旨已敕禮部議奏行文各直省定于本年八月恩科也是想不到的一件事侄兒想二叔身子已強健了何不帶著侄兒去走走寶玉道沒有的是謊話賈蘭道不是謊話寶玉點點頭恍然如有所得介面連說兩句我要去呢賈蘭見寶玉高興便越發歡喜要跟著寶玉下場又說了幾句閒話告辭出去寶玉笑道我還急巴巴盼到明年嫌這日子長遠夢想不到蹦出這件巧宗兒來正是喜熬人一封丹鳳詔速速成全我怡紅院公子的心事了寶釵道頭裏老爺逼著你念了幾個月書後來因你病了就沒去上學俗語道的生蠶做硬繭擺著荒疏了常久饒是你學富五車只怕三日不彈手生荊棘也該靜靜的用點功夫才好寶玉聽說便向書架子上亂翻襲人上前問道二爺要尋什麽東西就言語一聲兒等我們給你找寶玉道我的讀本呢襲人聽不明白怔了一怔寶釵道找他上學的書本兒襲人道真正我的好爺你從園子裏搬到老太太屋子裏越發顧不得了地方換了兩三處怎麽不問一聲兒盡仔在架子上亂找寶玉聽了襲人的話一時想過來了也沒言語襲人便問二爺爲什麽一時又想念起書來寶釵道剛才蘭哥兒來說起開科的話要跟著他叔叔同去下場他聽了忽然高興急巴巴的臨陣磨槍呢寶玉道可見你們這些人的話盡由著自己說的才說三日不彈手生荊棘我就謹遵台命要找書本子溫習溫習又道臨陣磨槍寶釵想著這話果然一時裏說到兩岔去了搭訕著叫秋紋碧痕到怡紅院去收拾書籍過來襲人道這些東西怕他們去經手不來說著便自己同了碧痕往怡紅院去不多時兩個人把書籍搬了過來寶玉親自檢點一番把幾種無關舉業的書撩開命襲人擱在架子上了隨手命了一本精選制藝是代儒選的近科魁墨吟哦咀味起來竟似從前賈政在學政任上有回來的信一時怕查功課埋頭苦讀的光景寶釵陪坐一旁想寶玉向以祿蠹譏人如今大病才好並無父命師箴來相督責因聽賈蘭一語忽然功名念切殊出人意外細細揣度起來想從前因與黛玉一片纏綿之意膠滯於中有所急即有所緩濃乎此即淡乎彼一朝割絕私情便心歸於正鳳姐瞞天過海之計下的針砭實于寶玉大有裨益又因寶玉推到黛玉身上想其情未必不甚於寶玉爲黛玉設身處地想來又將何法融化這一團塊磊便覺心上有許多過不去處正在出神見寶玉搖頭擺膝壹志凝神在那裏用功又想此番開科寶玉果然功名有分將來玉署瀛洲也是意中之事豈不博得堂上歡心自己夫榮妻貴想到此處又喜孜孜得意起來把替黛玉設想的念頭漸漸忘了話不細表且說寶玉苦志用功非溫習經書即揣摩時藝把先前焙茗所買這些飛燕外傳武則天楊貴妃外傳都焚化了一切玩耍之事淨盡丟開只知黃卷青燈不問粉香脂豔竟大改舊時脾氣了寶釵甚爲納罕便告訴了賈母王夫人都道如今沒有他老子來逼他自己肯這樣發憤起來暗暗歎美寶釵爲人能識大體果然金玉煙緣相夫得力而寶釵因寶玉病後身子不免虛弱保養爲要深喜寶玉淡於床笫私情倒也相安寶玉先前見了文章兩個字便要頭疼如今專心於此不但不以爲苦反覺探討些滋味出來毫無厭倦之意自是日親日近的功夫看看場期將近寶玉賈蘭叔侄二人援例入場又因賈政升了外任道員編入官卷凡場前應辦事宜賈璉自去妥爲料理再說紫鵑在櫳翠庵住下心想我不跟姑娘回家原爲姑娘的事見了寶玉一面討個准信兒好拿主意誰料他們起歹心的起歹心變法兒的變法兒要攆我出去諒來也難與寶玉見面的了暫且躲在這裏求大奶奶趁早想個法兒把我送到南邊但憑姑娘拿個什麽主意我死活跟著他過一輩子就是了紫鵑此時已心灰意懶住在庵中度日如年也不敢挪移寸步出庵恐惹是非惟聽晨鍾暮鼓隨著妙玉虔心禮拜觀音大士只求菩薩暗中保佑林姑娘身體康寧早早主婢見面日夕焚香禱祝不已一日惜春看見他笑道妙師父倒像新收了一個徒弟了紫鵑道妙師父肯發慈悲我不想回南去跟林姑娘了惜春道你姑娘要做妙師父的徒弟如今聽你也說這話佛法平等你和姑娘是師弟師兄了妙玉道這會兒你同林姑娘都是這條心將來怕由不得你們做主我果然收了你做徒弟有人和我要起人來便怎麽樣呢紫鵑聽了也沒理會妙玉自與惜春到芸房對局至午後惜春方回紫鵑到了晚上因時交初秋餘暑未淨獨自步出院外就在梧桐樹下一隻石凳上坐著仰見雲斂碧天桐葉枝頭露出一鈎新月那邊佛殿上鍾磬無聲爐內香煙未燼雖此身尚在大觀園中已另是一番境界惟聽砌畔蟲鳴唧唧萬慮俱生百感交集一個人對著月兒想起那年林姑娘來到榮府先在老太太那邊後來搬到園子裏寶玉和他往來稠密種種起居言動凡筆不能寫畫不能描之處猶如記日清帳本一般都打疊在我肚子裏如今寶玉隔絕姑娘遠離把他兩人的事故從頭想起歸根兒有意外之變可見普天世界的人情都是假的了紫鵑只是呆呆癡想恍如夢境迷離不覺夜深露重渾身上下衣裳都已濕透只見一個老佛婆來催他道紫鵑姑娘快進來睡罷夜深了盡仔在院子裏坐著受了涼是要害病的紫鵑只得起身進房安歇朦朧睡去聽得有人叫道紫鵑姊姊你爲什麽不去瞧寶二爺和寶姑娘拜堂呢紫鵑聽了這話猛吃一驚連忙起來趕到一個素日沒有走慣的地方果見璉二奶奶隨著老太太太太都在那裏看寶玉做親晴雯扶著新人拜堂紫鵑急得滿肚子的怨氣無從發泄一時拚舍著臉走過去問問寶玉兩腳猶如釘住的一般只是怔怔的呆看停了一會見新人揭去蓋頭巾卻不是寶姑娘是他林姑娘面前也挂著像寶姑娘的一樣金鎖心中正在疑惑聽得旁邊有人叫道紫鵑姑娘你爲什麽剛在這裏瞧熱鬧不上去伺候你姑娘又聽鳳姐道你們別支使他他也在這裏等著妝新呢說聲末了只見老婆子們過來七手八腳把他拉上還拉了晴雯一同到里間屋子裏去妝扮完畢出來寶玉和林姑娘同坐著叫他們磕頭紫鵑摸不著頭腦心裏又急臉上又臊禁不住直聲叫了兩聲姑娘自己驚醒卻是一夢那時同房睡的老佛婆聽見叫道紫鵑姑娘醒醒你做了什麽怕夢了紫鵑答道想是我的手在胸前壓著沒有夢見什麽老佛婆又道我聽見你發急的叫姑娘這會兒林姑娘倒隔了好幾千里路了還睡夢裏忘不了怪可憐的當下紫鵑也無心緒和老佛婆接話只想剛才的夢真是古怪晴雯是死過的人了爲什麽他來伺候姑娘還和我同拉扯在裏頭想起來總不是吉兆不是應在姑娘身上還有些災晦一定是我這條小性命該斷送的了思前想後不多時窗上發亮又挨了一會起身梳洗便在佛殿上焚香叩禱暗暗通誠夢中之事但求脫晦除災又不便將此事告訴旁人惟有朝夕繫念獨自發愁書且少表那邊鳳姐因李紈將紫鵑安頓櫳翠庵中恐怕走漏消息預防賈璉再提此事先想定了話一日賈璉果然向鳳姐問及鳳姐道這件事我早要告訴你又怕你疑心我在裏頭作梗其實太太那裏我早就碰了釘子來的因還要替你想個法兒所以沒回報你那林妹妹回過來瞞著寶玉的話你是知道的上上下下都囑咐遍可再沒有一個人敢在寶玉跟前說長道短就只紫鵑這個人太太說斷乎留他不得也不過怕寶玉見了他難免翻騰些話出來保不定又勾起寶玉的舊病所以我要請教二爺一句話二爺要紫鵑過來不過當一個丫頭使喚各處跑動太太看見了先不依我也耽不住據我的意思很可不必倘還有別的想頭我倒替二爺盤算出一個主意在這裏不如也像娶尤二姐在外頭弄了屋子叫紫鵑悄悄去躲著再別到裏頭來也礙不著人家的事請二爺示下好去辦賈璉笑道罷罷我不過說的一句閒話來不來都沒要緊你不用這樣東拉西拽的來轄治我正經寶兄弟同蘭哥兒下場的話到底定準了沒有鳳姐道寶兄弟近來很用功看來是定的了大嫂子說蘭哥兒年紀還小比不得寶叔叔叫他等到明年正科再去太太說蘭哥兒既然高興難得他小孩子有志氣就跟他叔叔去走一回大嫂子也不好拗太太的主意你別管他們定不定只管去辦你的事就是了賈璉道部照監照已經現成這裏問准了禮部裏頭還有要關照的話前兒有江西引見的官兒進來說起老爺的官聲很好管的那一帶地方有幾處遭了蟲災在那裏辦賑我再去細細打聽打聽說著就往外走了鳳姐便叫平兒到跟前說道你閑著到大奶奶那裏走一趟只當是閒逛去似的留心紫鵑回來沒有倘然大奶奶提起你說是我的話要大奶奶囑咐他別出來走動我留心察訪妥便送他到林姑娘那裏去出來走動沒要緊碰出亂子來我同大奶奶可不能給他擔呢平兒答應著往園子裏來靜悄悄並不見一個人便徑往稻香村見李紈正看著素雲碧月在那裏收拾一隻舊籃子地上攤著銅罐風爐竹筌油布等物平兒看了不知什麽用處便笑問李紈李紈眼圈兒一紅道這籃子是大爺用過遺留下來的因蘭哥兒要去下場叫他們拾掇出來看缺的什麽還得去添補上平兒笑道這些東西值得幾個錢哥兒要下場替他置備一副新的不好嗎李紈禁不住滴下幾點淚來一面拭淚道你不知東西不矜貴因是他老子遺下的手澤我苦苦的管教他這幾年雖然還巴不到讀書成名今兒有志觀光克承父志也不枉我撫孤守節一番就是大爺在九泉之下也瞑目的我所以不肯撩棄這些舊東西平兒會意便幫著挪這件看那件道蘭哥兒果然肯念書我也聽見太太時常在我們奶奶跟前說他好的真是大奶奶福氣呢平兒又與李紈講了一會閒話笑問紫鵑如今不在這裏住了可還來走走沒有我要去瞧瞧他又怕驚動妙師父李紈道因是你奶奶叫囑咐他的難得他也肯聽信聽見說庵門也沒有出自從前日到那邊連我這裏也沒有來走過一回你去告訴奶奶可放心別惦記這件事平兒聽說笑了一笑道我還去瞧邢大姑娘呢說著轉身就走徑往紫菱洲來路上碰見鶯兒同了個老婆子手裏提了一個衣包平兒便問往那裏去鶯兒道姑娘叫我去瞧邢大姑娘呢平兒道我也要去咱們同走說著三個人來到邢岫煙屋裏見他低著脖子在那裏紮大紅枕頂上的花岫煙見平兒進去便把針線連忙放下平兒和鶯兒都上前問好岫煙讓他們坐了平兒便笑道姑娘在這裏趕緊置備那些針線活計呢岫煙飛紅了臉道如今夜長了白日裏動動這些省是打盹兒黑間睡不著說著又道難得你們兩個人同來逛逛平兒道奶奶叫我們瞧瞧姑娘剛才從大奶奶那裏來路上碰見他同來的鶯兒介面道姑娘因這天氣交了秋早晚就涼了昨兒找出兩件棉衣叫送來給姑娘的說著便在老婆子手裏接過送與岫煙岫煙也不打開包袱便遞給篆兒拿去放好一面說道又要你姑娘費心回去給我道謝平兒道如今有寶姑娘到了我們家裏諸事周到我們奶奶便少操了許多心岫煙道我在這裏承你們奶奶多少照應我總是感激的又問鶯兒道如今寶二爺的身子可越發健朗了鶯兒道如今大好了這幾天倒狠念書姑娘你不知道二爺還要去下場呢所以園子裏也沒有來岫煙道這園子裏不來也罷別的地方去逛逛是沒要緊的二爺進了園子保不定不到瀟湘館去走動再像先前這樣他自己心裏也熬煎人家看了也不像個樣兒鶯兒道姑娘說的很是我想不如回明老太太把瀟湘館拆毀了二爺便進園子來沒看見這屋子也就不想林姑娘了平兒道你別胡說老太太聽見了要生氣就是你姑娘知道也不依你呢岫煙因問平兒道送林姑娘回南的人可回來了沒有平兒道去的人爲田租上的事耽擱住了前兒有個稟帖專差腳子來的說路上平安的話已回過老太太的了又道這幾時史大姑娘和二姑娘都沒來如今園子裏冷靜他們來了自然還住在這裏姑娘也有個伴兒再熱鬧幾天也好邢岫煙道我聽史大姑娘的口氣總等這裏打發人去叫他他嬸娘才肯放呢平兒道可不是我們奶奶說趕中秋前老太太要打發人去接呢平兒們又和岫煙們說笑了一會各自走了未知後事如何且看下回分解
