body:
  text: 第二十八回置産營財葛藟誼重因金恤玉樛木恩深話說黛玉請了李紈鳳姐探春三個人在議事廳敘話各帶丫頭先後到來原來這議事廳便是從前因鳳姐有病李紈同探春幫著鳳姐到此辦事的所在大家坐定黛玉先開口道請兩位嫂子同三妹妹來不但要把家務瑣碎事件整理個頭緒出來還帶著幾件正經大事大家商議瞧匾額上補仁諭德這四個字想咱們祖宗勳烈世代簪纓聖經上講的治國必先齊家家字所包者廣睦姻任恤都是齊家裏頭的事同宗一脈痛癢相關必須有個照應咱們族中寒素者多未必各房豐衣足食前兒回過太太自爺爺這一輩起至蘭哥兒一輩止凡在五服以內及出服不遠的開了一紙清單進來算二十年來族人之間品行賢劣材具短長雖有不同然亦不可預存愛憎之見不過由近支推及遠族分別個差等咱們既得了這宗白放在家也不能滋生不如到南京蘇揚地方或人參局珠寶鋪綢緞行或典當開設幾座也不爲多開在南京蘇揚從京裏起到南邊沿途熱鬧碼頭一處開設一座咱們來往的人也便易凡起標運貨路上更有照應裏頭支發本銀先發三等二十萬兩一等十五萬一等十萬一等族之最近一輩各領銀二十萬以次遞減某人在某處開什麽鋪面這裏議定了叫他們各自去幹辦一年之後開造管收除四柱清冊送核每年滋生利息等簿扣銀股之外管事人分得一半聽其支用其餘收在本銀上源源子母相生三年之後打發人出去查盤一次比較各處生息調管大鋪買賣倘有虧折許他聲明緣由或因置貨脫貨時價值長落不一或因攪纏重大利息微細不夠開銷夥計勞金飯食費用或有意外事故此乃虧本有因尚可原諒許管事人仍舊責成下次比較時將盈補絀如查有挪移侵蝕等弊只好撤回另派接管也不能抱怨了再發銀五十萬置買上則田畝派妥當家人去經理每年所收租息除春秋祭掃及修葺墳塋添種松柏樹株外凡本宗外姻按服圖內至無服之親遇有紅白事件無力辦事之家最近者幫銀一百兩嫁女減半白事尊長幫銀一百兩卑幼減半以及疏遠減至二十四兩爲止至鄉會試年無論親疏遠近送鄉試盤費三十兩會試盤費一百兩以資鼓勵再造義學一所延請名師課讀凡已開筆有志向上無論是否親族許來附學每年資助紙筆銀二十兩經費統歸於租息內支銷支剩之數仍就近歸入當鋪內生息再除祭産外如有良田盡著置買立契投稅後按四季連四尾送驗先於當鋪存項內挪款給價領標歸款講到家裏的事大嫂子同三妹妹代管過的樽節了幾件事沒聽見有人在背地裏哼了一聲兒不是如今要議論久遠的話除開三妹妹咱們三個人論理那一個不該操心但家務事必須有個專責況且咱們事件又繁各行當的人也雜如不責成一個人總理叫底下人摸不著這件事該回那一位奶奶那一位奶奶吩咐了話沒有關照這一位奶奶這一位奶奶又那麽樣吩咐了他們依著辦去又怕那位奶奶說話回了那位奶奶說又怕這位奶奶見怪諸如此類倒弄得散漫而無頭緒了說著便向探春道三妹妹你道怎麽樣探春正聽黛玉說得井井有條暗想先前瞧看不過吟風弄月在閨閣筆墨上用工何曾曆練家務世情如今聽他這番議論竟是洞明世務練達人情還高出寶姊姊之上但不知他說管理家務一層結穴在何處惟笑而不答李紈本來忠厚諸事退縮一步鳳姐先聽黛玉引經據典說得正大光明已經畏服後來議論家務更近情帖理又見黛玉只問探春便不好插入一句話來黛玉見他三個人默默又道二位嫂子別多心不如趁早把這句話講明瞭前兒起出來這宗銀子雖是鏨我的姓名但我的身子已到了這裏這身外之物自然也是這裏的東西可公而不可私的了前兒起出來就該放在外邊庫上何必堆在園子裏頭後來說是太太的主意過兩天搬出去也是一樣的講到東府裏自然遠了一點不用說至於環兄弟蘭哥兒再二嫂子恭喜有了侄兒總是一樣的前兒聽說二嫂子要辭了太太回那邊去不知存的什麽意見我也早知道咱們這幾年支的空架子擱不住如今手頭不用說是紓展的了不過多操一點心二嫂子算熟手還得借重二嫂子一個人把持碰著事情忙的時候還有大嫂子我也幫著是應該的這會兒別說我敢來煩二嫂子呢現在有老太太這裏的事情分得出個彼此來嗎鳳姐未及開口探春先笑道我今兒服了林姐姐了黛玉道莫非先前你不服我嗎探春道二哥哥早就誇你會說話據我看起來不過是詼諧鬥口之間詞鋒銳利壓人從來沒聽見你議論過正經大事今兒才顯出你的經緯學問來怎麽不叫人敬服呢不說探春和黛玉的話講到風姐素來好強前在王夫人跟前告辭原非本意今聽了黛玉這番話又感激又愧悔滿心欲允又未便允出口來欲待推遜一番一時想不出幾句對得住人又不丟了自己身份的話來把一個伶牙利齒的王熙鳳急得汗流浹背不免將近來身子不能耐勞要妹妹疼顧的話支吾了兩句還是探春替他滿口兜攬起來道林姊姊的話已說到盡情的了竟是那麽著二嫂子勿再推辭李紈在旁也順著探春說了幾句鳳姐當下應承黛玉又道先前領對牌支銀還不免有些參錯據我想來對牌之外須得加具領紙比如外邊要支領那一宗銀子先把款項銀數填寫領紙送到帳房查核倘或款項不清或銀數浮開先由帳房駁回另開再送核正用戳然後帶了領紙來請對牌裏頭留下領紙登了內帳再發對牌倘如帳房徇情還許裏頭批駁探春介面道這樣辦法自然越發有個稽察了鳳姐也道妹妹細心想的周到那麽好就定了章程以後照著行去就是了黛玉又道咱們家往來王親公侯以及紳士自宗族以至交遊既有高下親疏之別自有等數厚薄之分及日常飲食動用年節祭祀宴會總照舊章辦理不過再加豐厚些內中有該斟酌之處不妨大家商量還有些話等外邊送了冊子進來再講當下議事已定各自閑坐說話見平兒拿了一紙藥方來回鳳姐李紈問道巧姐兒又是怎麽了鳳姐道正是呢昨夜發了一夜燒直到天明才睡著黛玉道昨兒下半天小紅引了姐兒在我院子裏和小丫頭們撲蝴蝶兒玩我把小丫頭子吆喝著別同姑娘玩鳳姐道就是那會兒回到家裏來嚷著熱把衫子都脫了想是著了些涼真淘氣呢黛玉笑問道昨兒小紅回去那句話可提了沒有鳳姐道正是這句話我要打發平兒去告訴妹妹偏生姐兒要接大夫姨媽那裏又打發人來兜搭住了這會兒告訴你頭裏大太太惹老太太生了一場氣那是該的前兒妹妹和我說的話我是十拿九穩去和太太說了也沒有碰釘子再不料那一個倒拿起腔來天底下竟有這種糊塗蟲李紈笑道你們的話我還聽不出點蹤影又是什麽老太太碰釘子生氣鳳姐道那是陳年的話拉扯上時新話在裏頭怨不得大嫂子糊塗住了黛玉介面道大嫂子聽我們再講下去就明白了又問鳳姐你去回了太太太太怎麽樣說呢鳳姐道我見了太太簡截說是有一件事來求太太並不是寶兄弟有什麽私心就把你的話細細告訴了太太太太道也使得就怕寶玉屋裏的人太多了老爺知道要說話我又回道寶兄弟如今已成了家又發了鼎甲點了翰林也要替皇上家辦事的人了難道還像先前小孩子脾氣盡仔在丫頭淘裏胡鬧就是屋裏多放幾個人也沒相干太太便道既是林姑娘的好意聽你講起來還有這些緣故在裏頭揀一個好日子叫他過來就是了那時候他在里間屋子裏聽見就哭起來我叫他出來當著太太面前問他又不哼一聲兒妹妹你說這不是癩蛤蟆吃著了天鵝肉還嫌腥呢若說寶兄弟別說要太太屋裏一個丫頭誰借給我一張上天梯跑到月宮裏頭告訴了他們怕月裏嫦娥不跟著我走呢李紈黛玉聽了都笑起來李紈又道到底寶兄弟要不要別你們在這裏兩頭忙鳳姐笑道大嫂子說的好明白話寶兄弟這個人還怕貪多嚼不爛的嗎黛玉正要回答鳳姐的話見秋紋急忙走進回黛玉道剛才二爺換了衣服說暹羅國進了什麽貢物裏頭賜宴今兒回來未必早請奶奶先吃晚飯別等二爺還有一張未完的詩稿壓在書槅子上頭請奶奶回去瞧瞧高興就續了下去黛玉道這是什麽要緊事也值得趕來當一件事回呢李紈道你們看寶兄弟有了這樣正經事還有閒工夫留心到這些上頭先前叫他無事忙如今竟有事閑呢鳳姐瞧著黛玉笑道那是記挂他二奶奶生怕耽誤了晚飯才不忙呢說得黛玉臉上一紅李紈把話岔開道三妹妹沒言語一聲兒不知什麽時候走了黛玉道二嫂子怕碰釘子的時候就走的鳳姐道正是咱們也該散了一面又向黛玉道我叫平兒再去探他一個准信回報你說著大家站起身來外面伺候的媳婦們爭先上前打起簾子三個人出了議事廳李紈與黛玉自回園去風姐立刻到王夫人處回明瞭黛玉這番話並仍要他管理家務一節王夫人聽了歡喜不免又抹刷了鳳姐幾句王夫人又去告訴了賈母賈母深悔從前不早把黛玉配給寶玉可笑並沒一個人在我跟前提起未免又抱怨一會再想到黛玉洞明大義頗有作爲仍托鳳姐管理家務妯娌和好財喜重重這榮府裏越發該興旺起來便把已過之事都撩開了不說賈母心上的事再講黛玉回到瀟湘館麝月便在書槅子上取下一張箋紙送與黛玉見題是詠白虞美人寶玉寫得七言兩句在紙上黛玉便命雪雁研墨提起筆來續成一首擱在旁邊叫雪雁取出前兒太太那裏送來這一張單子看那上頭按照宗圖開寫支派遠近一目瞭然除了代儒代修賈敕已上了歲數各有子孫接手家務不算外其餘賈芸賈薔賈芹賈菖賈菱五個人論支派雖親疏不等向來常在府中走動比別的宗族不同就定了賈芸等五個人各領銀二十萬兩近在京城內外開設典當金珠人參局五座賈琮賈瑸也各領銀二十萬到南京開當鋪綢緞局賈珩賈珖各領銀二十萬到蘇州開銀樓綢莊賈琛領銀二十萬到揚州運販福建安徽等省發商茶葉賈瓊賈璘各領銀二十萬到天津會置運洋貨賈蓁賈萍賈藻賈蘅各領銀十五萬賈芬賈芳賈藍賈菌賈芝各領銀十萬在於山東泰安沂州江南王家營子清江浦等處碼頭或當鋪或六陳或雜貨因地制宜懋遷營運統共二十一人該支發本銀三百五十萬兩黛玉便用筆批定叫丫頭把單子送交鳳姐處請賈璉回明王夫人再邀族中到府議定然後支發銀兩又催鳳姐派人將園內所放銀兩搬運貯庫鳳姐自與賈璉商量大家用心料理賈璉因意外得了這宗藏銀自然手頭寬裕心上先已盤算該還那幾宗欠項贖回那幾處房屋地畝已興頭到十分便喚小紅燙酒平兒在西屋裏哄騙巧姐兒才吃了藥聽得賈璉叫小紅燙酒便走出來端正杯箸伺候賈璉喝了幾杯仰著脖子好笑道可惡這一班勢利小人如今可不受他們的氣了不過約的日子遲了幾天狠巴巴的就叫倒票九扣三分利上還要盤利打量我是窮一輩子的了明兒就叫這班亡八羔子來一如一二如二的清了他們還敢來咬我璉二爺的雞巴鳳姐聽了好笑道這也犯不著生氣罵他們放債原是圖利有銀子還了他們自然不來叨噔你了賈璉道敢仔你也是個愛剝人皮的人自然說這句話呢鳳姐歎道咳我盤剝來這些銀錢自己使著了一厘咬嘴嗎如今我也看破再不幹這些事了今兒聽了林妹妹的話越發悔得我置身無地賈璉問林妹妹又說些什麽鳳姐道就是園子裏起了這宗銀子明明是他的東西他要置買祭田義産發給族中營運也罷了還說是咱們家公共的物並沒分個彼此要我接管家務下去以後咱們存了一點私心還算個人嗎賈璉笑道黃鷂子難免不偷雞鳳姐啐了一口道這會兒也不用與你分證底下你瞧著罷這裏賈璉與鳳姐的話暫且按下近日寶玉娶黛玉之後又收了晴雯紫鵑黛玉看待紫鵑竟似姊妹一般與晴雯亦極其和藹親密這一天寶玉應召出門去了紫鵑晴雯兩個在怡紅院吃了晚飯仍到黛玉處坐著閑話紫鵑問道二爺今兒回來怕不早呢黛玉道那也論不定倘宴畢還有獻詩賦的事就有時候了晴雯笑道頭裏老爺只是抱怨二爺不肯念書不知生了多少氣寶姑娘也時常勸二爺用功就只姑娘沒有說過二爺所以我們常聽見二爺說起惟有林姑娘是我的知己如今說句公道話到底二爺何曾好好的念過幾年書可見一個人要做官也不在乎念書還是姑娘見的透黛玉道人與人不同你不知二爺這個人是有夙緣的若講平等一個人不用念書就有官做那是沒有的事晴雯道別說老爺管教二爺的嚴便是襲人也時刻咕唧著倒像將來這頂鳳冠是他頭上有分的如今二爺做了官他倒先走了這也想不到的事正要告訴姑娘今兒襲人的嫂子進來在老婆子們屋裏坐了好半天說襲人這幾時越發哭的人都脫了形了晴雯話未完只聽見院子裏老婆子說二爺回來了旋聞靴聲橐橐晴雯紫鵑連忙上前打起簾子見有兩個小丫頭打了一對五彩玻璃燈後面老婆子拿了東西紫鵑接過認得那老婆子小丫頭是老太太屋裏的人便讓他到廂房裏去喝茶這裏黛玉起身道探花老爺回府了當年翰林院應召撤金蓮燈送回今兒這一對燈可應了古典了寶玉道那裏的話我回來先到老太太那裏見我有了這些賞賜老太太喜歡叫他們掌燈送我到太太屋裏給太太看了才回來呢我給假的人本不能預宴那是格外恩典我先到內閣裏因軍機處議奏海疆奏凱善後事宜等了好半天才有旨諭下來賜宴畢又命賦化被聶耳五言八韻排律一首我忘了聶耳兩個字出典幸虧甄寶玉也在我問了他才潦草完了事黛玉道聶耳國在無腸國之東懸居海中出於山海經上寶玉道典雖不僻我在這些上頭就不大留神一時那裏記得起呢說著到書子上亂找麝月道不在這上頭了那桌子上硯臺底下壓的不是嗎奶奶又寫了好些在上頭了寶玉道妹妹替我續上了嗎說著便轉身取了詩稿且不看詩道我今兒從蘅蕪苑走過見山崖蘿薜倒垂之處開出這一種異樣的花來靜同梨夢清比梅芬記得同妹妹埋花的時候任憑園子裏頭的奇葩異卉那一樣花瓣兒不從咱們手裏經過沒有見這種花可巧葉媽走過我拉著問他說是紅的變種我想這個所在是寶姐姐住的這花忽然變了顔色莫非爲的寶姊姊緣故黛玉道一樣花並不是只開一樣顔色比如牡丹黃的紫的多一般也有黑的白的梅花白的多櫳翠庵前又開了紅梅那裏就附會到寶姊姊身上去你不明白開花的緣故何不去問問花神呢寶玉怔了一怔黛玉指著晴雯笑道花神就是他你頭裏不是說他去做了芙蓉花神嗎寶玉才會過意來道別說笑話了瞧詩罷黛玉道我還要改兩句說著提起筆來改了末後兩句寶玉接過先從自己起句念道誰把靈根垓下栽東風惹恨見花開縞衣殉國春無主香骨埋紅玉有胎淚灑不曾消粉靨夢回只合駐瑤台蘅蕪苑外迷離月倩影亭亭約伴來念畢道這個題單用些縞袂素裳冰心玉骨切那白字最易混到詠梨花梅花上去撩開白字又剛是詠虞美人了比如咱們先前詠白海棠的字樣用到這上頭便不貼切我籠統起了兩句底下便無思路妹妹續的縞衣殉國這一聯是此題絕唱一收也有意味黛玉笑道也不見得黛玉又與寶玉講了一會詩晴雯紫鵑自回怡紅院去黛玉便帶了雪雁把賞賜物件珍藏好了然後進房卸妝不知寶玉在何處住歇有無可敘之事再看下回分解
