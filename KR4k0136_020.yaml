body:
  text: 第二十回癡絳珠感情灑舊淚莽紫鵑認物發嗔言話説紫鵑聽了黛玉的話便將可惱之事從頭講起道先前寶玉娶寶姑娘叫雪雁去伺候拜堂大家不得明白後來聽素雲告訴我這個緣故就是哄寶玉娶的是姑娘寶玉正病著説他明白卻不明白説他糊塗又不糊塗拜了堂揭開罩頭巾見是寶姑娘人家又哄他説姑娘已不在了不叫他知道姑娘回南的事怕我在寶玉跟前透漏他們的詭計不許我見寶玉的面又哄住寶玉不進園子裏來我還躲在妙師父庵裏住了幾時紫鵑話到其間不覺怒形於色連雪雁站在一旁靜聽聽得説他咕哚著嘴生氣道我那裏知道他們弄鬼早知這樣別説寶姑娘就是貝姑娘我也不去扶他呢引的黛玉撲嗤的一笑紫鵑留心黛玉神氣打量聽了他的話未免有些憤憤誰料黛玉毫無介意只是點頭微笑紫鵑心中暗忖他姑娘已經看破塵緣立志堅定恐講到後面寶玉的事憑你説到鐵人下淚的地步亦漠然無動不覺其可憐這件事保不定又變了捏沙成團大費廝羅了紫鵑忽然呆呆的不語黛玉道怎麼不説下去了紫鵑才又將寶玉知道錯娶寶姑娘怎樣悔恨怎樣到瀟湘館去痛哭怎樣中舉過了幾天就出去做和尚了剃下頭髮交人送了回來老太太太太怎樣著急寶姑娘也哭死了又不知怎樣到那裏去找著了通靈寶玉現住在甄寶玉家剛寄了那塊玉到家去要老太太作主求姑娘允了才肯還俗如今璉二奶奶的病才好怎樣懊悔先前的事辦錯了回明瞭太太親自來求姑娘的話細細告訴黛玉不等紫鵑説完聽到寶玉去做和尚一語多時一塵不染的方寸頓將從前纏綿寶玉之私念勾逗起來舊時還不盡的眼淚重又滴了無數恨不得寶玉立刻站在跟前好將婉言勸慰才悟到夢中所見幻出有因直欲仿牡丹亭上杜麗娘去尋那不遠的夢兒又想到爹媽墳上痛哭祭奠之和尚非寶玉是誰他果真牢牢記住做和尚一語回憶時常向我寬慰之言全從肺腑上鏤刻出來也不枉我苦苦用心這幾年我早疑寶玉決不負心至此因回生而後已斬絶情根種種可疑之處不暇追求如今看起來我自謂獨清獨醒這幾個月正是做夢前日夢中之夢乃醒夢之夢從此墮落紅塵我無悔矣黛玉想了半晌只是怔怔的支頤無語紫鵑早已瞧出黛玉光景心上氣不服鳳姐因説道二奶奶今夜還等我去回話我今兒偏不過去還要拗逼一回別叫他瞧得容易了黛玉微笑不語一面叫自己屋裏的人那邊去把紫鵑姑娘鋪蓋包袱這些都搬了過來與自己同房安歇是夜敘話正長所有黛玉回南後榮府日常事情凡紫鵑知道的逐一告訴了説到襲人出嫁晴雯未死的話黛玉不勝驚異感歎直談至五鼓各人就寢次日紫鵑去見鳳姐道姑娘跟前已經替二奶奶講了許多好話前兒商量的拿住三件事那知姑娘也有幾件事來對答鳳姐問什麼事呢紫鵑道聽姑娘的口氣似乎道姑娘體弱本不是有壽的也沒這樣福分去承受怕也像寶姑娘這樣再姑娘原蒙老太太的疼愛太太的照看但只已經應過名兒園子裏外的人都知道的也可算報答老太太過了至於姑娘的身子別人都知道回了家沒有死怕瞞住的人不得明白疑神疑鬼起來也不成一件事姑娘的意思雖是這樣明兒二奶奶當面見了再説罷二奶奶口才本來好的説一句話到底比我們丫頭説十句還擔斤兩呢鳳姐聽了紫鵑的話句句觸心就是嫌黛玉體弱沒壽的話不是他説的其餘都是主謀這兩件事委實對不住林姑娘説起來竟無可置辨欲待不去求他此來所為何事前日又在王夫人面前滿擔肩任了來的甚是為難還要教紫鵑幾句話再去陪禮黛玉紫鵑只推鳳姐自己去説沒奈何硬了頭皮來見黛玉敘過浮談鳳姐滿腹躊躇不知提那一句話講起才是左右怕唐突了黛玉黛玉察看鳳姐囁嚅躊躇情形倒先提件舊事道頭裏我回家纍璉二哥哥遠遠的跑了一趟上年走的時候再不想和鳳姊姊見面那麼快這會兒鳳姊姊到南邊來可是意想不到的事昨兒我向紫鵑知道老太太同太太都好就不料寶姊姊那樣一個敦厚有福澤的人也沒享壽年鳳姐聽出黛玉詞鋒隱刺只得滿臉堆笑道總是年來家運不好暗裏使人幹的事顛顛倒倒千不該萬不該上年不該放妹妹回家就是老太太也後悔的什麼似的妹妹問紫鵑就知道了我也才病得死去又活來的沒法兒不自己走一趟臊著臉來求妹妹妹妹看老太太分上把過去的事再別放在心上就是妹妹的大賢大德處了我給妹妹磕頭陪禮説著便當真要屈膝下去黛玉忙把鳳姐攙住説些間話岔了開去雪雁在旁端茶伺應鳳姐瞧著雪雁誇獎道幾個月不見出挑的身子都長了你們園子裏這班姊姊都惦記著你呢鳳姐又説了一會話然後來見黛玉的嬸母重又提及親事因從前甄家來説林老太太知道黛玉的脾氣古怪如今雖然親上議親那寶玉又與黛玉自幼在一處長大現在奶奶親來打量有幾分成局到底不肯專主便自己來問黛玉黛玉心上已是千肯萬肯只推嬸母作主林老太太心已明白喜侄女終身有托大大放下一樁心事便到鳳姐處允定了鳳姐大喜命小紅取出帶來寶玉親手送交林老太太作為聘物要回一黛玉身上佩戴的珍重東西以訂百年姻好又説回京後另央冰人執柯擇吉完婚林老太太接過通靈寶玉瞧個仔細便遞給跟去的丫頭送到黛玉處去鳳姐笑道瞞不得太親母為了這一點東西鬧出許多希奇古怪的事來瞧不起這塊玉真是我寶兄弟的命根呢林老太太道原來是罕物普天世界那裏聽見有胎裏頭帶出來的金玉想我侄女兒佩戴之物那裏有配得上這玉的可以回聘就是前日得了一盤金鎖雖比不上這玉的珍奇因是夢中老人指示可作紅絲除了他也再無別物隨命侍兒取來當將夢兆説明把金鎖送與鳳姐瞧鳳姐因這些東西系閨閣中多有豈無式樣相同的惟聞應夢而得非比尋常又與寶叉病中所失之鎖相似一得一失事非無因不覺看的呆了便極口稱讚道這件東西就很好一個是胎裏帶出來的一個是因吉兆賜他得的可見寶兄弟和林妹妹合該配就姻緣我遠遠的來跑這一趟也有些功勞咱們本來在一塊兒玩慣的姊妹如今做了妯娌等林妹妹過了門還要重重討他的謝媒禮呢林老太太笑道那個不消二奶奶説得又是嫂子又是大媒別的東西也不希罕自然要他好好做幾樣針黹活計去謝媒説著鳳姐便要辭行林老太太再四款留紫鵑過來鳳姐將林太太已經面許的話告訴了他紫鵑一眼瞧見鳳姐手裏的金鎖心中便不自在道二奶奶是有斟酌的有了這塊寶玉做聘物就好這會兒定親先要取個吉利怎麼就把寶姑娘挂的東西拿了來呢鳳姐道算你這孩子眼尖我就糊塗到十二分也不肯把寶姑娘的東西拿來定你姑娘你只知道項圈手釧姑娘們戴這些男家送到女家去的是常事那裏知道我做了和尚的嫂子來給和尚定媳婦已翻了新花樣那男女定親回禮的東西也拘不得常例了説著把金鎖遞給紫鵑看道你瞧瞧這是寶姑娘的金鎖不是原來那邊失去並這裏當得金鎖之事紫鵑都不知道認準是寶叉之物遞還鳳姐道這不是寶姑娘的難道是我姑娘的不成若説我姑娘有了這金的早就該配了有玉的了鳳姐歎口氣道我得罪了一個林姑娘已經擱不住這會兒玩笑玩笑又玩上紫鵑姑娘的氣來了我對你説罷你只知道你姑娘沒有金的還不知道你姑娘如今該配有玉的就有了金的了話未完只見雪雁走來叫道紫鵑姊姊在這裏嗎鳳姐便把金鎖給雪雁瞧道你可認得這金鎖是你姑娘的不是同你紫鵑的姊姊去問姑娘罷雪雁笑了一笑便拉著紫鵑走了接著周瑞家的來回鳳姐道剛才聽見外邊説起寶二爺也在這裏前兒還到林姑老爺墳上哭了一會我男人趕忙同著這裏的人出去打聽説昨兒已經走了是南京甄家有人同來的有兩個小和尚呢鳳姐啐道別混咇他娘一個和尚已經鬧得我腦門都昏了那裏又跑出什麼兩個小和尚來既聽見有這個話到底問問明白那一個小和尚又是誰呢周瑞家的忍住了笑回道他們連寶二爺都沒認識那裏知道這一個是誰鳳姐皺著眉道這句話聽我的不放心這裏太太留我多住幾天還要同去逛平山堂我也委實的沒心緒不知寶玉又在那裏傻出什麼事來了叫你周大爺去把送甄家的禮收拾出來包勇是甄家舊人他去熟識明兒叫包勇先走我也不過耽擱一兩天就要動身回明他家老太太説我要去請安道謝再告訴寶玉一聲先叫他放了心要緊周瑞家的自去傳話雪雁拉了紫鵑出來不等到黛玉屋裏便將金鎖的話説明紫鵑方知金鎖來因暗暗稱奇深悔方才出言莽撞一同來到黛玉處見黛玉一手拿著這塊通靈寶玉正看的呆呆出神擡頭見了紫鵑便把玉遞給他紫鵑笑道歸根兒是這樣先前何不早早辦了也不至顛顛倒倒鬧出這些緣故來了説著自替黛玉收藏到了次日鳳姐決意告辭説老太太同太太在家盼望不敢耽延林老夫人不好強留只得備酒餞行鳳姐起身到黛玉處一走順便交還了紫鵑黛玉因結親之後不便與鳳姐照常款接不過交談一兩句連賈母王夫人處請安的話一概刪減外面船隻早已齊備林老夫人送鳳姐至正廳前上了轎紫鵑雪雁直送至大門其餘管家媳婦丫頭送至船上然後轉回鳳姐這裏周瑞先已趕至碼頭上預備轎馬人夫伺候一時船隻出口渡江換了轎馬陸路兩程第二日已到南京包勇先在碼頭打探候接回明見過寶二爺話鳳姐才得放心包勇坐騎引路進了甄府大門衆家人先下了馬管家媳婦們早在儀門外迎接轎子擡進小紅等先下了轎至大廳穿堂內伺候鳳姐下轎徑進甄老太太住的正房院內將近臺階見兩旁站的七八個丫頭打起軟簾管家媳婦回明榮府二奶奶進來了甄老太太似欲款步出迎鳳姐趕忙上前走幾步進堂屋先代賈母王夫人請了安然後自行晚輩禮相見甄老太太命丫環扶住讓鳳姐客座鳳姐再三謙遜甄老太太笑道可是沒這個禮別教二奶奶跟來的管家大娘姑娘們笑話我老的連禮數都糊塗了鳳姐然後告坐甄老太太問賈母王夫人的安鳳姐站起身來回答個好當下送茶已畢甄老太太道我記得二奶奶就是做過九邊總制王大人的令侄女不是鳳姐答應一個是甄老太太道怪道有些面熟二奶奶沒有出閣的時候記得見過兩次就是榮府裏我們也有親誼又是世交因我老的不愛動彈只想躲在屋子裏躺躺吃吃有時抹個牌兒好幾年沒有進京連親戚們都生疏了鳳姐道那正是老太太的享福咱家老太太也是那麼著就歡喜和這些孫女兒們玩玩笑笑過日子的甄母道我們的姑娘們呢才聽説二奶奶到了叫他們出來迎接不知正在那裏玩得高興了説著便命丫環去告訴姑娘們知道客人已進來了旁邊幾個丫頭齊聲答應出去甄母又向鳳姐道聽京裏回來的老婆子説起見過府上有好幾位姑娘都長的俊比我們這幾個孫女兒還強政老爺的大小姐已做了娘娘可是知道的可惜短了些壽還有的姑娘都定了親沒有鳳姐道二姑娘已經出閣的了三姑娘上年許給周總兵周大人家哥兒家裏只有東府裏敬大老爺一個姑娘不瞞老太太説天生成的古怪脾氣也像要做超凡絶世的人了別的都是親戚人家來的姑娘甄母笑道我的孫子寶玉正想同府上結一門子親聽二奶奶説起來又白提了這句話了如今且講你們這位銜玉而生的哥兒怎麼也是那麼樣淘氣前兒包勇到這裏知道二奶奶去林府求親已經允定哥兒總不肯信穿的僧衣還沒換下鳳姐忙又站起道寶玉蒙府上留住咱家老太太真是感激叫我親到老太太府上磕頭道謝甄母道這是老太太見了外了本來早該送哥兒回去因為這裏給哥兒到林府去求過親那邊不允哥兒一定要等這門親事成了才肯回家所以耽遲了這幾個月鳳姐笑道府上的寶兄弟進京外邊的人都認做咱家的寶玉回來連老太太太太也錯認了甄母道這也難怪他們別説見了一個要錯認上年哥兒進來同我們的寶玉站在跟前還認不清誰是誰話未完聽丫頭們説姑娘們來了一時花團錦簇共有五六個年歲相同的姊妹進來與鳳姐相見俱同大觀園迎探雲岫輩仿佛各自坐定略敘寒暄管家婆子上來回道榮府哥兒知道這位二奶奶到了要進來見見呢甄母點頭姑娘們各自回避碧紗櫥後寶玉進來先與甄母請了安然後與鳳姐相見鳳姐瞧著寶玉宛然是一個小和尚又傷心又發笑叫聲寶兄弟這會兒我也不和你提別的話前兒打發包勇先到這裏想來都和你講明白的了快與這裏老太太磕頭謝謝換了衣服可安心樂意的回去了照那個樣兒你別想同著我走這不像饅頭庵裏的小姑子嗎甄母聽了忍不住笑道我不敢和二奶奶取笑哥兒不換衣服倒説榮府裏的奶奶拐著小和尚跑了甄母一句話引的碧紗櫥背後這些姑娘們都止不住要笑出聲來這裏寶玉問道我的玉呢鳳姐道那塊玉不是你寄回去叫聘林妹妹的嗎如今已換金的來了我真當寶貝一樣不敢叫別人沾手自己替你挂著呢寶玉此時已忘身在甄府便叫好姊姊是什麼東西給我瞧瞧鳳姐知道寶玉脾氣涎皮賴臉慣的便一手松扣褪下金鎖遞與寶玉寶玉一看生氣將鎖摔在地上道先前哄的我不夠如今還要來哄我這是寶姊姊的東西怎麼説是林妹妹家的回禮呢説著跺足哭道原來包勇來説的話都是假的我一輩子做和尚定了鳳姐心想為了他們金的玉的不知受了多少間氣先前過去的事不用説偏偏如今又跑出一個金的來了事情也委實奇怪意欲數説寶玉幾句當著甄老太太面前還有他家許多姑娘們在裏頭惹他呆出那些不中聽的話來臉上越發下不來只得忍住了氣小紅一面把金鎖拾起鳳姐正要與寶玉分證説明家中失落金鎖及至林府求親黛玉嬸母説起得夢當裏金鎖等事只見甄府管家媳婦慌慌張張的進來回道外邊打聽的不知為什麼又有旨諭下來地方官都出城接去了甄母聽説登時嚇得戰兢兢的口內只是念佛鳳姐更不知來由只得從旁勸慰道老太太別著急論老太太的福分這裏老爺居官的聲名先前雖然吃過一次虛驚後來平安無事這裏老爺在京沒有打發人回來恐怕是外面訛傳或者下的恩旨是府上恭喜的事老太太可吩咐他們再去打聽甄母道但願托二奶奶的福沒有什麼事就好不瞞二奶奶説我有了幾歲年紀膽也小了真正經不起這些風浪當下命管家媳婦傳話出去一語末了又聽説京裏打發人下來在外面聽候傳喚甄母便命來人進見暫請鳳姐避入碧紗櫥自與甄府衆姊妹敘話一時來人進內先向甄母磕了頭道老爺太太請老太太的安老爺在京納福前見軍機處傳出信來知道有欽使諭旨到咱家來卻不是咱家的事是為賈寶玉下的旨諭老爺恐家裏聽見旨諭下來不知為什麼叫奴才騎了包程騾子趕回稟老太太得知甄家的人話未完鳳姐在裏面聽説為寶玉下旨吃驚不小心想有何旨諭到寶玉身上莫非老爺在任上挪用庫銀一事發覺銀子去得遲了彌補不上如今連寶玉都有不是不知家裏鬧的怎麼樣了又不便自己去問甄家的人一面心裏著急只瞧著寶玉如何光景那知寶玉心上只盤算金鎖一事聽了甄府家人的話竟像無事人一般也不去盤問只是呆呆坐著鳳姐十分焦躁因有姑娘們同在一處不便叫寶玉進去教他的話不知下的旨諭所為何事畢竟與寶玉有無關係且看下回分解
