body:
  text: 第二十三回尋花公子屬意還珠掃墓佳人傷心淚草話説寶玉叫焙茗去傳蔣琪官焙茗答應了出去心上計較怕寶玉又要親近這班人上頭查出來自己干連在內想上年二爺走失了我不過一時沒留心不算什麼過犯立逼著在我身上還出一個二爺來帶纍吃了這場苦如今還敢掮了二爺的木梢亂動一動嗎一時拿定主意儘管自去玩他的停了一會捏個謊回報寶玉只説去的人回來了琪官不在家現留著話叫他一回家就來見二爺寶玉沒法兒只得由他百忙裏到甄老爺宅子裏並薛姨媽家東府裏各處去走了一趟回來又盤算到南邊去的人這幾天也該起身回來了心頭礪碌不定倒覺日子容易過去把題名奪錦的心腸反丟開了轉瞬到了放榜之日寶玉又高中第七名進士賈母王夫人都喜笑顔開親朋道喜請酒寶玉瓊林赴宴拜座師會同年種種忙亂自不必説這一天寶玉才出門回來在賈母處看賈母和姊妹們耍牌覺背後有人扯了他一把回過頭來見秋紋站著與他扭了一嘴寶玉會意便趁著衆人不留心扯了秋紋走到外面秋紋道焙茗叫老婆子來請二爺出去説有人要見二爺不用換衣服寶玉連忙趕到垂花門首見焙茗還站著寶玉問是誰原來前日寶玉吩咐焙茗去叫蔣琪官焙茗並沒去叫只是支吾的話寶玉因連日事忙也不催問今蔣琪官自來與寶玉道喜門上告訴焙茗只得來回寶玉道蔣琪官來了現在門房裏寶玉聽了喜出望外即叫招他進來自己跟了焙茗出去在花廳裏站著等他焙茗便到門房裏引了琪官到夢坡齋書廳內這書廳就是從前賈政痛打寶玉之處焙茗有意引到此間欲寶玉觸目驚心疏遠蔣琪官之意焙茗安頓了琪官來請寶玉蔣琪官恐怕寶玉見罪未免膽寒見了寶玉便跪下道一來與二爺叩喜二來負荊寶玉忙把琪官拉起蔣琪官見寶玉相待光景依然舊時情分毫無見怪之意便隨寶玉走進套間裏命琪官一同坐下蔣琪官未曾開口寶玉先笑道這件事你別放在心上如今和你商量一句話就為你娶這一個是老太太賞我的人你可送還了我底下在我身上給你圓全一頭好親事如何蔣琪官聽了發怔道二爺還不知後來的事麼寶玉著急問道後來便怎麼樣蔣琪官就把這一天娶親到門拜堂後適值王府來傳伺候了三天才得回家看見茜香羅汗巾問明來由就把新人送回娘家的話告訴一遍又致了許多不安寶玉才明白這件事心裏倒感激琪官便道難得你這樣義氣不枉先前相好一場我總知道的就只太委曲耽誤你了蔣琪官笑道二爺説到這句話委曲不止這一遭兒呢寶玉問道還有什麼委曲呢蔣琪官道我頭裏定過一家親事女兒已經允許的了到定聘的一天不知為什麼忽然翻悔把禮物原盤送回所以又定花家這頭親事娶過門來也落了空後來聽見説起先前定的這位姑娘也是府裏出去的寶玉道這件事我越發摸不著了既有這些緣故等我查問確實包管叫先定那一個人配給你也算還了我一件心事蔣琪官聽了點頭答應又打千謝了寶玉説些別後的事情就告辭走了寶玉聽了剛才的話要向麝月細問連忙回到自己屋裏聽見麝月正在那裏和秋紋吵嘴兩個人都漲紅了臉站著寶玉向問情由麝月便道剛才平姑娘那裏打發小紅來問説二奶奶屋裏的自鳴鍾壞了問我們有要修的一搭兒拿去不是我們這個勞什子也不準了好多時沒有裝放在書匱子上頭我開了扇子拿自鳴鍾記起二爺拿回來那面鏡子瞧一瞧袱子散開鏡子不在裏頭還是二爺藏過了呢拿去還給人家了寶玉著急道正是你提起這件東西這幾天我竟混忘了拿去還人家不包袱子去的嗎麝月秋紋兩個人聽了彼此瞪著眼便叫老婆子小丫頭來查問都説這屋子裏頭放的東西不是姑娘們發放出來我們那一個敢動呢秋紋想了一想道不是二爺那一晚照的時候鶯兒在他屋子裏還沒睡著別他聽見鏡子裏照見寶姑娘的話悄默聲兒拿了去快問他一聲麝月道罷罷鶯兒也未必來拿他近來火氣大你不見他一動就給二爺臉子瞧我不去碰他這個釘子寶玉道白去問一聲兒怕什麼呢麝月便推秋紋去問秋紋問了回來説鶯兒並沒有動寶玉心裏焦躁急的跺腳道那是我自己不好早早拿去還了張道士就是了這件東西不是銀錢買得來的如今叫我拿什麼還他呢正在吵嚷探春惜春兩個進來聽見探春便問何事麝月料不能瞞就把寶玉在清虛觀拿回鏡子一面放在匱子裏頭不見了的話説明只不講出照見寶姑娘的情由探春道這又奇了為什麼別的屋子裏沒聽見失東西就是你們這裏先前在園子裏頭二哥哥不見了玉後來連寶姊姊的金鎖也沒了如今又鬧出這些事來我看總有個不要臉的混在裏頭偷偷摸摸須得回明太太叫二奶奶來查究才好呢寶玉道這件東西又不好玩兒就拿去變賣也沒人識他不值幾個錢那一個偷了去簡截拿來還在原地方就是了省去回太太鬧什麼呢惜春便道三姊姊説二哥屋裏常失東西其實並沒有人來偷去的肯遠遠的送到人迹不到的荒山裏去撩呢如今這面鏡子既沒處找也可不用再尋那鏡子主兒未必來要的了探春聽了便知惜春話裏藏機再沒言語寶玉亦有所悟就丟開手了兄妹三人談敘一會走散麝月秋紋總不放心還是東找西查那裏查得出來不多時琥珀來叫寶玉過去吃了飯回來寶玉便問麝月道襲人嫁到蔣家蔣琪官就把他退送回來這件事你可知道嗎麝月道我怎麼不知道上年年底裏太太還打發人去叫過來説是病著沒有進來寶玉道後來太太又去叫過沒有呢麝月道接著過年甄寶玉來了就要料理璉二奶奶出門家裏忙的什麼樣似的太太那裏還提起他寶玉道你先為什麼不告訴我明白呢説著便把麝月拉在自己坐的杌子上道咱們商量要你在太太面前提一句叫襲人進來或者竟不用告訴太太我悄悄的打發人去叫他你道好不好麝月歎道我和襲人不比別一個前幾天還打發人出去看他説他還病著也不是什麼大病不過心上鬱結懨懨纏纏的沒好他肯進來也進來過幾趟了何必定要去叫呢如今他知道林姑娘也來快了怕未必肯進來寶玉道説到林姑娘也在園子裏混了這幾年大家怪好的為什麼他怕林姑娘呢麝月微笑道我也不過這樣瞎猜襲人是一個要強的人也顧臉只為錯走了一步知道林姑娘嘴頭上是利害的見了面保不定不説兩句取笑的話他就當不起二爺你不知道我們做女孩兒的雖然是丫頭比不得千金小姐的身分也常聽見鼓兒詞上説的什麼另抱琵琶又是什麼潑水難收想起他的錯處臉上下得來嗎寶玉道今兒我見過蔣琪官聽他説襲人過去還沒同炕蔣琪官知他是我的屋裏人就送回花自芳家裏不過到蔣家去白走了這一趟也算不了什麼麝月聽了嗤的一笑停了半晌道我告訴二爺咱們府裏我看見出去的人就記不清若説配給小子應該進來服役當差不用説了就是娘家贖身出去許配人家的他感念老太太太太奶奶姑娘們的恩典常進來請安走走的人何嘗少呢只為襲人與別一個不同蒙太太的擡舉又和你好他既然走錯了路索性嫁了蔣琪官倒也罷了如今有人知道的呢説是蔣琪官的好意不知道的還要添些混帳話出來説是鈍貨害得他青不青藍不藍算什麼呢二爺走了襲人的眼淚明裏暗裏不知淌了多少如今二爺回來了襲人在家裏二爺倒替他想想難道他不願意進來見見二爺嗎二爺既是不怪他要他進來別一時性急總得盤算一個長局等林姑娘來説明瞭再叫他進來才妥當我知道襲人別處是不去的了還怕他飛上天去我先前沒有告訴你明白就怕你急巴巴要他進來倒把這件事弄壞了寶玉聽了點點頭秋紋在那邊屋子裏聽他們講得厭煩了便走出來道你們也講的有時候了請麝月姑娘歇歇罷麝月道我同二爺講話礙著你的筋疼秋紋笑道這會兒襲人不肯進來二爺當緊何不就叫麝月權替著襲人呢麝月便起身來要打秋紋的嘴説我饒了你也算不得寶玉笑著來廝羅他們秋紋又道你那一樣不如襲人二爺權把你當了他好多著呢當下麝月秋紋頑罷了各自坐下把鬢髮理了一理秋紋笑道頭裏瞧二爺病好了這幾個月不理我們竟像屋子裏這一班人統可以攆的了那時候二爺出去做了和尚咱們也像襲人都走了二爺回來叫誰伺候呢麝月道扯臊短了你二爺就沒人伺候了寶玉道你們統走了我還一個個叫你們回來麝月秋紋一面整理寶玉的衾枕服事安歇次日起來寶玉往賈母王夫人處請了安到鳳姐屋裏坐了一會出來正遇見林之孝家的進去回話寶玉便拉住了叫聲林嫂子我問你一件事上年咱們家裏出去的丫頭到底是那一家許配了人後來又翻悔了你去查問明白了告訴我林之孝家的笑道咱這邊同東府裏一年出去的姑娘們少算些也有二三十個沒頭沒腦的叫去問誰呢二爺吩咐只好留心慢慢去查訪一時性急不來寶玉道你留心問去罷説著自往園子裏找探春姊妹們玩笑去了林之孝家的因要辦的正經事料理不開知道寶玉的話沒有頭路那裏放在心上進去回了鳳姐的話半晌出來把這件事就撩開了鳳姐和尤氏鎮日料理寶玉完婚之事又有報喜開賀這些夾在裏頭真是忙上添忙人逢喜事精神爽因有賈母這一宗墊項手頭寬裕賈璉安心在外應酬裏邊鳳姐打起精神辦事趁空兒還要陪賈母抹一會牌專等南邊送親到來榮府之事暫且按下講到黛玉家裏諸事齊備黛玉靜坐閨中惟與紫鵑間話消遣這年是閏三月清明節氣較遲想起父母早故零丁孤單做了一個女孩子不能承祧宗祀幸上年回家趕上送葬大事如今遠嫁到京連墳墓上不得時常去看看雖則舅舅家祖基亦在南邊現有田房産業但近依畿輔世受國恩若説回到原籍來有什麼好處趙太后愛女遠嫁持踵祝其勿返我亦明大義自然不敢動回南的念頭今年清明節必得到墓前祭掃哭別一番主意已定看看到了寒食上一天半夜裏下起濛濛細雨到天明晴了起來推開窗子見院子裏滿地緑苔帶潤樹上未謝的桃花飽含宿雨分外精神那天上顔色如洗過的一般黛玉愛這好天氣就趁這一日要去掃墓早飯後俱已齊備喚了四個家人同家人媳婦黛玉坐了大轎紫鵑雪雁小轎隨後擔夫扛了條盒離了林府出城行來黛玉從玻璃窗內望見花綴路旁柳盈門上記起儲光羲的詩杏酪漸香鄰舍粥又宋祁的簫聲吹暖賣餳天正是映景及時一路上踏青的女子聯袂而行隱隱緑楊樹裏露出秋千架子鄉村婦女挽著彩繩戲耍沿路風景娛目不多時到墳前下轎衆家人已將祭禮擺設齊整黛玉輕移細步走到墓前見已鋪好拜墊止不住雙淚交流跪將下去放聲大慟拜畢猶嗚咽不已紫鵑同家人媳婦都上前勸慰半晌才止了哭雪雁送過手帕子把淚痕拭淨然後將添種的松柏樹株墓前後周圍看了一遍見松土新添鋤除蔓草另有墓前一叢約長一尺餘草上生成的斑斑點點如血染一般四下裏並無一點微風那兒棵草對了黛玉似有性靈不住的輕搖淺曳起來黛玉便彎了腰細細認他並不識此草只是暗暗稱奇紫鵑雪雁動手燒化紙錢家人媳婦們收了祭禮便請黛玉上轎到墳屋裏去坐坐歇息黛玉搖頭道這幾步路我慢慢走了過去也算踏個青應應景兒當下衆人圍著黛玉往墳屋裏來管塋的女人趕先過去開了東屋門請黛玉進去回身取茶這裏一個家人媳婦笑道盤碗茶葉都現成知道你們這裏水是清的提一壺開水來就是了黛玉走進裏邊見小小三間坐室倒也精雅花牆外幾株垂柳間著紅桃院內滿架朱藤清香馥鬱家人媳婦又去推開了後窗道姑娘到這裏來看看遠景黛玉步至窗邊坐下見遍地菜花新雨後照著日色閃閃爍爍的分外光明遠遠望去一帶平山堂景致如在畫中風帆搖曳往來不絶黛玉正在憑欄凝眺那管塋的女人已攜上水來家人媳婦接過把帶來茗具泡上旗槍又整備幾色點心送上黛玉一面喝茶便叫住那管塋女人問道老爺太太墓前後的青草當春容易發生該隨時留心除淨才看見墓前留這一叢是什麼意思那女人答道這是有個緣故一個月前頭有個小和尚來在墓前哭了一場我男人到府裏去稟過的不料那小和尚哭的眼淚滴在草上那草就顯出這樣顔色來雨也淋不淨姑娘看見草上不是像血點樣的嗎我們鄉里人見的草也多沒見過這一種草定是哭的眼淚點成的因想起那小和尚不是仙家變化來的就是返老還童有德行的高僧我家男人所以單留這一叢不敢鋤棄他黛玉聽了怔怔的想道那小和尚非寶玉是誰怎麼哭的這樣傷心連草上都染成血點也太苦了呆了半晌對那女人道你們這樣説想起來的是仙人遺迹當真鋤棄不得我也希罕這種草要分掘一半去留他一半讓他長髮罷那女人答應連忙要去掘草黛玉便叫紫鵑向他們借了一件小小鐵器自去動手帶著些泥土掘來別損壞了根紫鵑會意便同到冢前約分了一半連土掘起送與黛玉看了黛玉點點頭命將根土包好帶回當下上轎一徑回府黛玉先到嬸母處講些鄉間野景坐了一會才到自己屋裏紫鵑就去找了一個羊脂白玉盆把草栽上灌了些水黛玉又端詳了一會天色已晚當夜無話清晨起來梳洗才畢就去玩弄那盆草兒又添了無數傷心這裏雪雁屈指吉期已近便對紫鵑道姑娘京裏帶出來的東西回家來住了幾時都又翻騰過的了如今還得過一遍手姊姊來幫幫我紫鵑笑道你不記得那時候我正病著都是你拾掇的我連手也沒沾一沾眼也沒瞧一瞧這會子倒像沒處插手似的好妹妹我勞你一個人經手了罷雪雁道你不肯來幫我也罷説著一面動手笑道就是這幾件子東西先前替姑娘收拾厭煩得什麼樣似的今兒動起手內像輕快了許多紫鵑忙喝道悄悄裏罷別教姑娘聽見了黛玉聽他們講話只是支頤默坐紫鵑忽然想起這幅小照站起身來在自己箱子裏找出來送還黛玉道畫兒帶回來了還沒告訴姑娘姑娘看看也叫雪雁收拾在書畫箱裏黛玉道我也忘了説著接過展開見上面題有詩句細細咀味了一會認得是惜春筆迹還有落款便問紫鵑道四姑娘題詩可是在甄家送信之前還是在後紫鵑道就是這一天得信的四姑娘題詩的時候甄寶玉還沒有到呢姑娘們都在大奶奶屋裏先是四姑娘高興三姑娘説題得的後來四姑娘寫上的姑娘看四姑娘題的好不好黛玉點頭暗想惜春已有先覺之明差不多功程圓滿的時候了雖然詞句裏有些獎借早把我終身料定萬不是寶玉這樣死活把人拖下紅塵四姑娘與妙玉同我結定松竹梅歲寒三友了黛玉想了一會把小照遞與紫鵑道替我把這幅大士像也收下來一搭兒放好在畫箱裏我還去供呢黛玉這邊的話且按下不表林府得信北靜王因有朝政不便遠行命長史官帶同榮府總管押送禮儀路程遠除表禮外一切水禮都到南邊備辦差官將次抵揚林府差了四名體面家人迎出百里之外投帖請安一同來到碼頭停泊地方官親往拜謁這裏早已邀請出仕過的二三品頂帶親戚迎接差官大門外兩旁扎了吹鼓彩亭裏邊東西院廳房二十餘處結彩懸燈陳設華麗預備安頓差官及新親一衆人等不用另備公館這裏榮府家人備齊水禮將盤盒裝設定當用朱紅描金回鸞翔鳳禮單開寫的鳳冠一品翠翹雙額補服四襲宮帶全圍霞四披朝裙四褶金玉珠翠首飾一百六十件緞綢紗綾二百四十匹單夾棉皮四季衣服三百四十套吉羊二十四腔福酒二十四壇枝圓松榛各色細果六十四盤還有聘金禮金並種種禮儀單上自然分款寫得滿滿的話休繁瑣王府差官坐了轎升炮吹打從碼頭上迎進林府開筵款待名班唱戲這裏家人將禮目送進內廳太太過了目便送到黛玉處紫鵑接過展開呈上黛玉就在紫鵑手裏把眼略睃了一睃紫鵑便折疊放在一旁接著管家媳婦同老婆子們七手八腳的把首飾綢緞衣服等物連盤送進院裏來交付紫鵑雪雁照單檢收説喜果六十四盤太太已留在那裏替另買了一千多斤籠總打包停當下船備著到那裏使用紫鵑和雪雁一一收拾明白開了單子裝好箱只記明號數陸續發下船去包勇托林府家人回明發了自己的行李帶了鴛鴦劍先到船中照應這日女眷都已到齊內外三班戲文正廳上只請幾位大老鄉紳同揚州府江都甘泉兩縣陪宴王府長官花廳內親友坐席看戲女眷們也有戲酒是一班小簧腔在內院伺候還買了蘇州一班女清音要陪送到榮府去的先叫他們在堂樓下試演奶奶姑娘們愛清靜的自去聽清音十番也有席面這裏黛玉早已妝飾得天仙似的等丫環媳婦們來請珠圍翠繞擁到那邊與衆親戚序次見禮黛玉的嬸母一一指點輩分長幼稱呼內中也有見過的沒見過的因黛玉在榮府住了多年未免生疏便少浹洽且現在妝新自與平日起居不同見禮後各自坐定戲文開場演的是滿堂福晚上席散黛玉自回房來不能在彼酬應接連宴客三日早已雇定大小沙飛滿江橫牡丹頭共三十餘號一應妝奩粗細什物箱籠行李並需用器皿伙食各編字型大小發運下船分派家人管理各有職司到了啓行吉日排開林府執事掌號細樂數班衆丫環媳婦伺候黛玉拜別祠堂又拜辭嬸母坐上彩輿紫鵑雪雁坐轎隨後滿城文武官員俱至碼頭候送林府家人站立兩旁回帖阻步請安看的人塞街填巷挨擠不開一時黛玉的嬸母同女眷們坐轎下船帶了公子與黛玉同坐一舟男女各分船隻船上一色扯起奉旨完姻黃旗送親的船上各扯自己官銜旗號三聲炮響起碇開船各船頭上鑼聲響應震天一號一號的都挨次開出去了未知送親船隻行到何處才回路上有無事故再看下回分解
