body:
  text: 第三十回領白鏹陡成新富戶制霓裳重集舊伶人話説賈氏族中領了榮府銀兩出去熱鬧非凡先講賈藝承領二十萬就在京都開設當鋪好不興頭心想先前瞎奉承了鳳姐到那麼個分兒花上本錢買了許多香貨討得個種樹差使想多大沾光和花兒匠磨牙如今不費一點子力領了二十萬銀子開了當鋪我便是個大掌匱每年少算些一個七釐錢不派到我名下有幾千銀子進路因向他母親道媽前兒夜裏夢見走水連房子都燒塌了媽驚的嚷醒來道這夢不吉利不是兒子告訴媽説夢見走水怕咱們要發財呢媽還不信如今可應了這夢了他母親道這也再想不到璉二嬸子那麼大出手起來整十萬銀子往外頭推倒放心賈藝道什麼整十萬咱們房族中遠遠近近幾十家門子都有一二十萬銀子領短了那一門子嗎你不知道這是璉二嬸子有那麼作為嗎都因寶二嬸子在園子裏得了一宗橫財他老人家疼顧族裏出了個意思才散給咱們營幹的呢他母親道這寶二嬸子就是先前在園子裏住的林姑娘那一天寶玉圓房我進去瞧著他原像個有福氣的人咱們底下不都依靠他吃飯嗎你錢在手頭別瞧得太容易了盡仔瞎花短少人家的帳目就去清了他們你娘舅家這宗會錢你舅母三頭五天捎信來説等湊著要去幹辦端午節的香料呢賈藝道你老人家別信他們的話那是怕我拖散了他盡仔來催逼他兩老人家心上才有盤算如今知道他外甥平空裏承領了這宗本錢保不住還要眼紅若説短他這幾吊錢就到下半年不送去再不來開口他母親道可不是人都勢利知道咱們有了你看昨兒就有人來給你提親賈藝聽了提親兩字倒怔了一怔問是那一家呢他母親道就是東街裏璜大嬸子娘家嫂子家裏胡老娘的內侄孫女兒説模樣也長的好陪送也體面璜大嬸子坐了車子自己來説我便含糊應他你留心打聽打聽倒是一件正經事賈藝搖頭道不論那一家來説親媽別應許他他母親正要問的是什麼緣故聽得外面有人叫道藝二爺可在家裏嗎賈藝聽是鄰居倪二的聲音趕忙走出見倪二帶著一個年輕小子頭面長的乾淨賈藝估量他不是正經來路便指著那一個笑問倪二道這一位是貴相知了為什麼很面生呢倪二正色道二爺什麼話這裏賈藝一面讓坐此時已新買了小廝便叫看茶三個人坐下早端上茶來倪二開口道這幾天就沸沸揚揚榮府裏頭髮了整千萬銀子出來交給貴族中營運我就估量著二爺常在裏頭跑動這件事總脫不了二爺後來細細打聽果然是有的今兒一來道喜二來有一件小事相求要二爺賞個臉賈藝因從前借過他銀子雖已清還也領過他的情便道老二有什麼話效力得來的一定遵教倪二道咱們多年老鄰居幹的事什麼瞞得過二爺我如今也看破了到底不是一件正經事情二爺你不見街坊上貼起大張的告示禁止賭博重則充發輕則發落便是枷杖抽頭贏錢還要追繳入官我已剁指頭戒賭了説著把右手伸給賈藝瞧道二爺不信瞧那指頭還包著呢賈藝笑道你剛剁了這一個那幾個指頭就抓不動色子了嗎説著大家笑起來倪二又道我和馬販子王短腿搭了夥計也要去做他這個買賣家裏只丟他們娘兒兩個沒有男人在家照應説著便指那年輕的道那就是上年冬裏給我女孩子定的女壻女兒年紀還小別管他生熟叫我這女壻到家裏年輕的人浪蕩壞了底下求二爺賞賜他碗飯吃在鋪子裏跑動跑動教訓他學出一點本事來一家門都是感激的倪二沒有別的孝敬將來騎出一匹又會顛又會走的馬來送你老人家賈藝因剛才語言冒失未免局蹐聽倪二要把他女壻薦到當鋪裏學習生意本是一樁小事又見這個人青年美秀並非粗笨之人便滿口應許道這一點小事算什麼老二儘管放心幹你的去等這裏的事定了大局就去相邀令壻正經你往口外去給我捎兩匹好馬回來毛片身材都要看得過去將來奉價説送是斷不敢領正説著又見有兩個人來找賈藝都跑的汗流滿面氣喘籲籲的倪二估量他們有話便起身告辭賈藝送了倪二翁壻出去回身進內那兩個人便開口道我們又去瞧了好幾處都不及前兒看的鼓樓西大街那一所又緊密又寬敞我們去打通原業主得了個底裏照前兒講的數目再添不到一千兩銀子就可下臺二爺總別開口讓我們去打擂臺總不叫二爺吃虧賈藝道就是弄到薛大爺恆舒當對門去了一個人道店多成市那怕什麼説著催賈藝就走賈藝便進內安頓他母親幾句話又道銀號裏有人來找回報他們晚上到號裏去説話一面説完趕忙同那兩個人出門走了再説林之孝家的得了裏頭的話要去訪舊日梨園急得一時無處查覓想起梨香院教習一事向派賈薔專管便來賈薔處探問消息賈薔正在承領本銀經管鋪面無暇他顧惟心坎上止有齡官一人雖彼此留情苦無買玉之資此時正可重價許購偏值榮府招集舊伶難以下手目下正靠著他們提拔不敢弄鬼還喜這班人不比到了別處消息難通有從此蕭郎是路人之歎當下把知道這幾個人的下落告訴了林之孝餘外憑他自去找尋林之孝只得上緊察訪因那些人聲氣相通訪著了一兩個都有著落可巧他們並未遠去查明藥官早已死了小生藕官小旦蕊官先跟了地藏庵姑子圓信出家未曾落發仍被教習中人賄買出去復了舊業大花面葵官老外艾官八淨豆官老旦茄官同先前打發教習時早出去這幾個腳色現俱賣歌為活一共十來個人雖各有班主或懼怕榮府聲勢或貪得重價兩三日內都已停當又在原班之外另買了幾個人雇覓女教習一齊送進府來回明鳳姐仍安置梨香院與清音分開居住一應器用什物照舊發出派人照管並添制舞衣彩服及一切刀槍旗幟以備演習新戲一日史湘雲薛寶琴李紋李綺探春王夫人都在賈母屋裏陪著間話賈母道咱們如今又熱鬧起來了園子裏有了清音又有戲班你們姊妹們高興瞧戲在我院子裏搭起台來説聲就唱王夫人道他們才進來聽説還要排一排再出場正經又不請客就是咱們娘兒們這幾個叫孩子們帶演帶習先唱一天給老太太散散心賈母道聽見你們要擺酒請客定下日子沒有王夫人道我想叫迎丫頭回來也高興兩天昨兒打發人去接説他家裏有事要後兒才來呢賈母歎了一口氣滿屋子裏一瞧才説道迎丫頭這樣在人家受苦好笑大太太一點子也不在心上還是你惦記著王夫人陪笑道正是這句話還沒回老太太昨兒打發去的老婆子回來説這一會子去見二姑娘不像先前愁眉淚眼的樣兒想是孫姑爺的性子改了些了賈母搖頭道那是天生成的牛性怎麼改得來呢迎丫頭當著他家的人在跟前也不好向咱們家打發去的人訴委曲那時寶琴正站在賈母身旁賈母便把他摟在懷裏用手撫摩道我的兒你如今有了幹姊姊別太太又不疼你了王夫人叫了一聲琴丫頭道那是老太太給你取笑説著又向賈母笑道老鴰子比起鳳凰來這一個那一樣趕得上他因為林姑娘的好意我瞧這孩子也還安頓當一件玩意兒事的辦了又借這個名兒擺擺酒孝敬老太太瞧一天戲賈母道那倒論不得説著對了李紋們衆姊妹道不是我當著你們姑娘跟前説句話古來丫頭出身的戴鳳冠做夫人比姑娘小姐福氣還大些呢我就會看相先前我也沒理會這孩子過一天仔細瞧瞧他是那麼個模樣兒王夫人道揀了好日子過來給老太太磕頭正説著只聽得嘻嘻哈哈鳳姐的聲音一路笑進來道我來給老祖宗要人呢賈母道你也學了你婆婆又來要想我屋裏那個丫頭你説了要的誰只要我願意就給你領了去鳳姐帶笑道這會兒老祖宗高興又捨得了我有那麼大面嗎老祖宗這裏來要人是真的為的那小班子裏頭短了一腳正生當下聘不出來文官是他們原班腳色道他腔口身段都好先前留在老祖宗屋裏就只他沒有出去如今打夥兒進來了要求老祖宗叫文官出去配一配腳色不知老祖宗叫他出去不出去賈母道不是你來説起我也沒理會文官在我屋子裏正是先前為什麼單留住他呢鳳姐道那是太太為芳官淘氣把派給各房裏的人都攆了太太不敢叫老祖宗屋裏的人也走便留下文官如今想起來他們出去的依舊進來了也像老祖宗屋裏的人不叫出去豈不省事呢賈母聽了歡喜道文官在這裏也盡間著叫他用心唱幾出戲給咱們聽也好一面便命琥珀去叫文官王夫人問鳳姐道這些孩子們進來你都見過了鳳姐道前兒進來請安打聽老太太歇午覺太太事情忙就回報了他們我也沒見呢聽得平兒説原班腳色蕊官藕官這些人都在裏頭王夫人道我記得頭裏把他們攆了有幾個孩子去出了家想不到依舊他們唱了戲賈母聽了歎道他們學了這個拋撇家鄉父母出來原是命苦的小孩子家看得破修修後世也難得的不該又叫他們進來鳳姐答道聽説他們在庵裏住不多時早就出去唱戲的賈母點點頭道既是這樣也罷了説話時文官早已叫到賈母便問文官你在屋裏做什麼文官應道琥珀姑娘教我扎花呢賈母道你們一班子師弟師兄又到咱們園子裏來了叫你去排戲呢一面又叫鳳姐道鳳哥兒你來要的人給你領了去鳳姐笑道老祖宗倒推到我身上來了我算當一名內領班伺候老太太就只放起賞來我是要加二扣頭的湘雲在旁笑道鳳姊姊還是那麼愛錢探春瞧了湘雲一眼鳳姐正向賈母説話並沒理會一面拉了文官的手道你如今做了還籠的雀兒了快理你的戲本子去仔細再別像頭裏秦瓊沒帶上鬍鬚就殺出潼關去了説著叫兩個老婆子到文官屋裏收拾東西領著送到梨香院去這裏賈母叫琥珀擺開雙陸場子與李紈打雙陸消遣王夫人鳳姐各自回去湘雲和衆人出了園門行至蜂腰橋李紋姊妹要轉過山坡子自回稻香村去被湘雲拉住道咱們鬧林姊姊去説著同到瀟酒館湘雲一進院門便笑著嚷道我們約了一群人來鬧你們呢黛玉一個人坐在窗前調弄鸚哥兒聽見湘雲聲音忙站起身早有丫頭們打起簾子黛玉含笑讓進裏邊坐下湘雲不見寶玉一口嚷道二哥哥躲避我們了便向各間屋子裏裏外外找尋又到丫頭們房裏掀起炕幔一瞧雪雁早跟了進去見湘雲揭他睡的炕幔便漲紅了臉道史大姑娘這算什麼找二爺找到我們炕上來了湘雲笑道二爺躲在那裏了呢雪雁道二爺在老太太那裏湘雲道你別扯謊剛才我們就在老太太屋裏出來春纖在外邊介面道二爺聽説藕官這班人都進來了估量著到梨香院去瞧他們呢湘雲道你打發個人去叫他咱們要商量正經事寶琴叫道史大姊姊你出來罷告訴了林姊姊也是一樣的一面向黛玉道他又要起詩社呢黛玉道我瞧雲丫頭發了瘋了你們可瞧見他前兒的詩胡話亂道講些什麼照像他這一位詩翁底下再結起社來便要鳴鼓而攻麾之門外的了湘雲道文章以不切題者為陳言賀新婚詩總得豔麗貼切為佳這不是到省親別墅獻詩都要像你借得山川秀添來氣象新的莊重句語嗎黛玉道你瞧琴妹妹他們這幾首何嘗不豔麗大嫂子這一首何嘗不貼切定要像你那麼樣謅才算得切題我單問你汗融乍試芳脂滑這兩句虧你一個做女孩子的把嘴裏説不出的話筆下公然寫了出來臊不臊湘雲道這兩句也算不得村俗黛玉道離開了題目約略看去原甚平淡你細細推敲起來成了什麼話雲丫頭你到底怎麼知道的你講呀湘雲道臯陶曰殺之三舜曰宥之三衆人聽湘雲説了這兩句底下便煞住了都怔怔的聽他語不以倫半晌黛玉介面道自然是想當然耳虧你也肯想也會想也想的到家湘雲又辨道後人評閲前人之書往往有作者心思未必想到之處閲者竟批得出來我本無心你偏現身説法領會硬賴派著我我總不服黛玉道子非我焉知我之現身説法領會湘雲被黛玉層層駁詰理屈詞窮寶琴探春都笑道今兒枕霞舊友瀟湘妃子舌戰大北了湘雲紅上臉來要撕子上貼的那首詩黛玉道你這一撕又是蛇足了貼在這上頭除了你二哥哥就咱們姊妹這幾個有什麼忌諱底下留心一點就是了別盡你的高興湘雲低點無語李綺笑道史大姊姊和林姊姊講了半日話我總不得明白黛玉笑推李綺道史大姊姊肚子裏很明白你儘管悄悄問他去湘雲站起身來道顰兒你再説我來擰你的嘴説著就趕攏來黛玉只得陪笑求饒一時寶玉進來了寶琴忙走過把湘雲拉開了道二哥哥來幫林姊姊了你別鬧罷當下湘雲放了黛玉問寶玉道二哥哥你到梨香院去瞧見我的葵官沒有寶玉道我何曾到梨香院去他們還沒進來呢話未説完丫頭們報道璉二奶奶來了衆人起身讓坐鳳姐道邢大妹妹身上不好去瞧瞧他順路進來坐坐恰好你們都在這裏寶玉忙問道唱戲的女孩子都進來了嗎我還不知道史大妹妹賴我去瞧他們呢探春道二哥哥不在梨香院到底那裏去了呢寶玉道我在四妹妹屋裏瞧他和妙師父下棋黛玉道我前兒到庵裏去拈香妙師父感冒著沒有見他如今想是好了湘雲介面道你還該再去走一趟上年他給你起的課我也知道你聽了不輸服如今看起來竟判得準極的了衆人問起的什麼課湘雲便將上年的事告訴他們衆人都説好靈課鳳姐暗想寶黛二人委系姻緣前定何不早為撮合省卻多少煩惱驚憂又轉念自為寬解想出謔詞向寶玉道寶兄弟何不再到妙師父那裏去起一課看太太幾時抱孫子呢衆人聽了都瞧著黛玉笑黛玉便沈下臉來瞪鳳姐一眼湘雲道且慢講起課的事咱們講起社的事罷趁這幾天都齊全二哥哥高興就鼓舞起來倘因別的事忙顧不上剛才二嫂子的話等做湯餅會再説罷寶玉笑了一笑便道這件事先前有大嫂子還得拉他在裏頭這會子大嫂子不在咱們定了日期打發人去告訴他一聲也使得鳳姐一聽忙站起身來道我聽你們講到這些只好幹我的事去了回頭一笑道少陪黛玉送鳳姐走了這裏湘雲一衆人重又坐下探春道你們別忙這幾天裏頭太太就要擺酒唱戲不如鬧過這幾天二姊姊也回來了邢大姊姊的病也好了多幾個人越發熱鬧些不好嗎湘雲又坐了一會各自走散次日寶玉起身到賈母王夫人處請安回來吃過早飯就要叫芳官這班人來又想屋裏人多不便問話何不自己到那裏順路瞧瞧園景也好於是出了瀟湘館徑往梨香院來心想芳官與晴雯同時被逐不料死者復生離者重聚一路行走但見紅雨塵花緑陰鏤日到了山石旁邊有幾株杏樹遮得密葉重重住步擡頭見樹上已垂垂子結又想起當日在園情景遇見藕官在此燒化紙錢也是清和時節風景宛然他們雖年歲漸長還不至像那子結枝頭落盡深紅的時候一頭思想已到了梨香院戲班裏班子裏的人見了寶玉忙去通知領班的喚齊全班迎出請安寶玉仔細一瞧偏不見有芳官在內寶玉便問芳官呢藕官見寶玉問起芳官頓時掉下淚來寶玉忙問根由藕官道二爺還不曉得芳官的事嗎此事説起話長請二爺裏邊去坐了細細講給你聽寶玉道你在那一個屋子裏咱們進去瞧瞧藕官引路領班的退出有幾個女孩子各自走開藕官同五六個舊人隨了寶玉來到藕官的屋裏藕官忙去泡茶用五彩蓋閉放在描金洋漆盤中捧與寶玉寶玉接過放在桌上一手拉了藕官挨身坐下追問芳官之事藕官道要講芳官還是我和蕊官兩個人説起有半本戲文的情節二爺只當聽戲一般畢竟芳官作何下落再看下回藕官替他敘明分解
