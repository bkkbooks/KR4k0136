body:
  text: 第三十九回恩償夙願追憶畫薔緣了前生重諧蔔鳳話説賈環見了賈璉想要躲避猛不防賈璉將他叫住賈環只得回轉身來站著賈璉道環兄弟你這幾時趁著家裏有事查察不到你在外頭鬧的太不像樣了我要寫稟帖到老爺任上去老爺是已有了升轉的信等旨諭一下就要回京請訓那時候看你死呢活我聽太太已給了你屋子裏人你寶哥哥叫你同蘭兒下場給你捐了監照也有了你肯聽我一句話呢書也念念好歹巴結完了三場再別出去胡鬧老爺回來我也好替你遮飾過去了你自去想罷賈環臉漲通紅不敢回答一句話賈璉又瞪了他一眼自走開了賈環因在錦香院被堆子上要拿受了這一次驚嚇稍為斂迹屋裏有了彩雲私情已遂不想再去問柳尋花又被彩雲隨時勸阻賈環倒肯受他幾分管束還怕賈政回來究責從此拼除外務竟將紈褲惡劣行為漸漸改了趙姨娘知道彩雲一事全仗黛玉之力又聽説寶玉的主意與環兒捐監下場頓時把他母子擡舉起來想起那一年薛大爺帶了許多南邊東西來寶姑娘叫人送來分給環兒我還誇寶姑娘為人抱怨林姑娘尖刻如今諸事有咱們娘兒在眼裏先前真是錯怪他的俗語道的日久見人心一點也不錯從此趙姨娘不但把怨毒寶玉之心冰消瓦解而且追悔無及親到黛玉處説了無數感激的話接著彩雲也來謝黛玉黛玉往紫菱洲去了晴雯紫鵑都在那裏便拉彩雲坐下見彩雲尚未開面同自己一般不過收在屋裏留以有待一面叫小丫頭子倒茶因小丫頭都玩去了五兒在外間屋子裏泡了一盞茶進來遞與彩雲彩雲接了茶對五兒笑道你幾時進來的也巴結上好地方了五兒想起茯苓霜一時帶纍他母女兩個人受了一夜苦一向不敢發泄如今到了這裏聽他説巴結上好地方的話由不得哼了一聲道幸虧先前沒有攆出去得到了好地方也沒別的話頭就是太太屋裏再被人家偷了東西去巴結相好的可連纍不著我受罪了彩雲聽了五兒的話觸心禁不住臉上一紅羞臉變怒指著五兒罵道你這小蹄子才上了台盤沒幾天就要倚勢欺壓人家你見我偷了太太的東西去給過誰就算我偷了害著你的筋疼不是你們廚房裏現搜出贓來就硬派上你們個賊名兒了五兒道我沒有指名説姑娘偷太太的東西姑娘何必攬到自己身上去姑娘説我們廚房裏有贓有贓要有賊到底審出偷盜實迹了沒有紫鵑喝住五兒道你要死呀不怕奶奶回來聽見了捶你又笑向晴雯道怪道五兒長來像你聽他這張利害嘴和你差不多晴雯也笑道五兒原該打怎麼就得罪新姨娘起來彩雲見紫鵑吆喝住了五兒也就不言語了又聽晴雯和他取笑便不依向晴雯道我是新姨娘你算什麼呢你是新奶奶新太太怕一個樣兒還掙不到姨娘的分兒呢不想想自己混來取笑人家唉呀呀好不害臊晴雯一想原是自己的話説莽撞了便向彩雲陪笑道好妹妹是我的不是別生氣一語未了麝月從外邊進來聽見晴雯和彩雲陪禮便道我同他過了半輩子憑他自己錯了總強到底要他賠不是可是今兒第一遭還是彩雲姊姊臉大説著大家一笑紫鵑問麝月道姑娘在邢大姑娘那裏做什麼麝月道才開了棋局和史大姑娘下棋呢叫我回來取馬褂麝月便往黛玉屋裏取了一件夾紗馬褂送往紫菱洲去了彩雲道奶奶回來還早你們替我説聲罷説著起身彩雲與紫鵑晴雯三個人同出了瀟湘館彩雲道你們要往那裏去晴雯道今兒好涼快天氣我們約著逛逛還要轉到梨香院去有你來了又坐住了咱們同走罷彩雲道趙姨奶奶還等著我描花樣子你們自去一路説話行至蜂腰橋分路彩雲自出園去了這裏晴雯紫鵑慢慢行走聽得寶玉叫著趕上來問你們到那裏去晴雯道屋子裏坐著悶得很和他到梨香院去逛逛寶玉趕上前去道這裏來那邊有起閣了的匠人你們廝趕著我盤出了櫳翠庵多走幾步橫豎間逛説著穿林渡徑而來只見碧天雲淨桐蔭生涼寶玉道立過了秋竟是一派秋天的光景原來節氣是不錯一點的紫鵑道記得去年這時候正是避難的躲在妙師父庵裏呢晴雯道我比你強在堡裏住了兩三年春夏秋冬也一天一天的挨過了寶玉一路聽他們講話不多時到了梨香院先進清音班的屋子裏只見那唱大淨的女孩子在那裏哭呢原來他們兩班都住在梨香院彼此往來講到唱曲字面辨得真板眼按得準清音高似戲班卻不知道場步清音的師父也要這些女孩子學幾出戲請戲班裏教師過來教他們今兒正在那裏排大淨的戲師父因他腳步走得不是打了他幾下寶玉見了問起緣由便生氣把他師父吆喝道他們本來不是唱戲的該慢慢教他學習不可性急底下再不許打他們我知道了是不依的那教師只得應了一聲是各自走開寶玉拉了唱淨這女孩子的手問學的什麼戲排了幾天了可會了沒有一面又拉了慶齡説話那遐齡雖然在怡紅院走動和晴雯時常見面到底與紫鵑分外親熱只挨著紫鵑身旁説説笑笑晴雯和他玩道你瞧慶齡是有二爺歡喜他的可惡遐齡也只認得鵑姑娘理也不理我慶齡們聽了趕忙笑著走過晴雯身邊紫鵑道你喜歡他們親熱很好便叫慶齡遐齡你們兩個都拜給晴姑娘做了幹女兒可不好一語未了不由晴雯做主兩個人便跪下磕頭連叫乾媽臊得晴雯臉漲通紅寶玉見了笑道這有什麼害臊的比如芳官這幾個認那些混帳老婆子做乾媽不如認你們好多著呢紫鵑便笑向慶齡道你們有了乾媽就該去認乾爹説著呶嘴兒叫他們去認寶玉和晴雯取笑慶齡們也知道紫鵑要玩晴雯便一眼瞅著晴雯搖頭笑道我們可不敢紫鵑道你們瞧認了幹女兒就回護乾媽了慶齡笑著叫唱大淨的女孩子去拿了鼓板笛子來把鼓板遞與寶玉自己拿起笛子道二爺的折柳陽關還沒很熟再唱一回説著把笛子亮好寶玉尚未開口只見戲班裏的藕官笑嘻嘻的趕來拉了寶玉過去見藕官房裏坐著他們一個同班女孩子笑臉相迎趕忙站起來請安倒茶親手捧與寶玉寶玉仔細瞧他便是在薔薇花下畫薔字要他唱曲不肯唱反走了開去冷落他的這個齡官今兒為什麼忽然殷勤起來再看他柳眉帶蹙杏靨含顰嫵媚中露出一種病態愁容寶玉正思細探其故藕官拉了寶玉至無人處道齡官有一件事要求二爺呢寶玉問有什麼事藕官道他先前在裏頭唱戲就和薔哥兒好二爺也知道的後來咱們出去仍舊唱了戲薔哥兒還常去瞧他如今咱們又進來了他們兩下裏幹著急薔哥兒要買他出去因在裏頭唱戲師父不敢做主薔哥兒寄信進來叫齡官想法兒齡官也知道我在杏樹下燒化紙錢被春燕的姨媽看見不依幸虧遇了你倒替我遮掩過去説你最肯憐念我們女孩子的想要求你當著面又臊的開不出口來所以我替他來求二爺的情只要二爺肯到上頭去説一句話準他出去師父另去聘了一個腳色來頂了他寶玉問頂他的人有了沒有呢藕官道那是現成寶玉道齡官有了替身也不用到裏頭去説話只推齡官有病到外邊調養好了再進來裏頭也不查察這些叫了一輛車子把齡官送到薔哥兒家裏去就是了又笑道你去對齡官説今兒可要好好唱一支曲兒我聽聽藕官也笑道今兒就叫他唱十支曲也包管肯説著引寶玉到齡官房裏齡官跟了進來藕官道二爺要聽你的曲兒寶玉道我可不要聽昆曲要唱小曲呢藕官道他就唱的好馬頭調還會自己彈齡官便拿起琵琶伸出尖尖玉指撥動弦槽嗽了一聲嗓子輕啓脂唇唱道繡不完細針密線的鴛鴦帶拭不幹淚珠滾滾滴下香腮想起我那可意人兒今何在病懨懨香銷錦帳軟咍咍夢醒陽臺聽梧桐葉落雨滴空階剔銀燈苦把秋涼耐歎命薄的紅顔錯轉了胎恨只恨今生還不盡相思債寶玉聽他唱完怔怔的出了一會神便向齡官道你放心包管你不叫在薔薇花底下白淋了一會雨就是了一時又進來了蕊官玉官寶玉叫他們過清音班那邊去叫了晴雯紫鵑來同走玉官們去不多時回來説他們走了好一會了趕著慶齡遐齡過來同齡官藕官這幾個人送寶玉出了梨香院寶玉一個人便走到櫳翠庵前看看匠人做工回到瀟湘館一概間文不敘看看七月將盡賈母不等去請示便對王夫人道今年我的生日可不必舉動接著就是寶玉做親説不得再受親友們一回賀禮底下碰著人家有事從厚答還他們也使得總要像娶林丫頭一樣的張親家面上好看些二來補了寶丫頭的情不可存寶丫頭是已經做過親的了這條心這些話我已對你説過的了別的事我不管王夫人應了一聲是出來便把賈母的話和鳳姐説了此時銀錢寬裕辦理從容一切遵依賈母的吩咐八月初三日拜夀並無外客都是子侄輩女眷們就是邢王二夫人同孫子媳婦孫女兒並園裏住的這幾個姑娘們還有尤氏領了佩鳳文花與蓉哥兒媳婦又來了薛姨媽香菱鬧了一天賈母因寶玉喜事這幾天衆人正要辛苦不肯久坐早早散了席叫上下人等各自歇息過了一天就是寶玉吉期諸王妃勳戚命婦聽説張觀察府上出嫁這位千金就是賈寶玉從前所娶的薛氏借體還陽當一件新聞異事都要來瞧瞧因此今番來賀喜的女眷比娶林黛玉這一會又多了幾家照前叫了幾班好戲內外唱戲宴客還添了梨香院的兩班越發熱鬧園內鋪設了綴錦閣嘉蔭堂兩處只有省親別墅的門不開迎親鹵簿照樣排場張家見了也甚歡喜雖然素來儉嗇此處陪嫁妝奩極其豐美也頗相稱一時迎娶進門在榮禧堂結親這裏晴雯紫鵑兩個人預先私下商量把雪雁妝扮好了引他來見黛玉黛玉不解其故笑問道你又不要妝新這樣插戴好了做什麼雪雁道紫鵑姊姊他們兩個人替我這樣妝扮的問他們又不肯和我説明白晴雯在旁只是抿著嘴笑紫鵑道送他到璉二奶奶那裏去黛玉道送他到璉二奶奶那裏去幹什麼紫鵑道二爺頭裏這一會娶寶姑娘不是雪雁去扶著寶姑娘拜堂的嗎怕今番還要用他送去交給璉二奶奶聽他們去使喚呢黛玉聽了才會意過他們這番舉動來便帶笑喝住道已經過去的事還翻騰他什麼如今你們把雪雁送去叫璉二奶奶臉上怎樣下得來呢不説你們鬧的玩兒還道是我故意揭他的短況且寶姑娘也是死去活來的人叫他知道心裏怪不受用何苦來呢紫鵑聽了黛玉的話也就歇了再講寶玉結親後自榮禧堂進園直至蘅蕪苑一路滿鋪了紅氈條照樣二十四名丫環提燈清音細樂送入洞房賈母與衆人要看新人的模貌等揭了蓋頭巾爭先去看宛然是一個寶叉寶玉見了更樂得心花開放竟忘了情不顧衆人在跟前連聲便叫寶姊姊衆人都笑起來黛玉暗暗扯了他一把寶玉回頭見是黛玉便笑著走開了再講新人睜眼看時滿屋子都是熟人想想我薛寶叉一個人與寶玉兩番花燭真是亙古奇聞不禁悲喜交集因不能不替張家小姐留些體統勉強妝出一個新人的漠樣暫且緩待與衆姊姊再訴死後衷腸一時衆人散去鶯兒與張家幾個陪嫁丫頭在屋裏伴陪見寶玉進來鶯兒想要數説他幾句一則因他姑娘已經還陽團聚二來當著張家的丫頭們在跟前只得忍耐住了寶玉等衆人散去便來親近寶叉此時寶叉亦將怨恨寶玉之意付之汪洋寶玉還疑借尸之説事屬模糊將舊話幾般探試寶叉逐一對答纖悉不忘寶玉十分奇異敘談至四鼓後寬衣同入銷金帳枕席歡娛比從前合巹時似加幾倍惟是含葩初放重點元紅不能不又試一番呻吟羞澀之態話休絮表連日酬客演戲忙亂過了幾天就是寶叉回九之期同寶玉到了張家張大老爺夫婦看見寶玉生得俊偉風流而且侯門子弟年少登科真是乘龍佳壻有女夭殤幸得絲蘿借附居然坦腹承歡比親生更為難得其款待殷勤之處自不必説因按規矩不便留住內外筵席散後當日就回間了一天便是中秋鳳姐向賈母處請示賞月酒席設于何處賈母道上年為你寶兄弟不在家林丫頭又回南去了冷冷落落這幾個人大家不高興就在我院子裏坐了一會也就算圓了月了今年難得林丫頭同寶丫頭兩個都是意想不到的與寶玉團聚了我瞧這天氣明兒晚上的月一定好的咱們興興頭頭做一個圓月團圓會別辜負了這一個中秋還是園子裏瞧月亮也寬闊些你們商量去揀一個合式地方擺酒鳳姐道前年八月十五老太太在凸碧山莊平臺上擺酒的那個地方高敞玩月最好當下湘雲黛玉也來了聽鳳姐説擺酒的話黛玉便道近水樓臺多得月山上玩月還不如在有水的地方更妙呢凸碧山莊底下就是凹晶館這個地方玩月又省得老祖宗走山坡子鳳姐道林妹妹説凹晶館好就擺在那裏罷賈母點頭道也使得我記得那一年還有你大老爺老爺都陪我喝酒叫他們講笑話我聽的姑娘們也有兩桌怎麼不記得有你在裏頭呢鴛鴦在旁介面道那時候他正病著呢鳳姐忙陪笑道不是躺著爬不起來肯躲懶不跟老祖宗去吃好東西嗎賈母道咱們先算算有多少人鳳姐便從大老爺那裏算起賈母道我説今年中秋喝的團圓酒你老爺不在家連你大老爺也不必過來叫他自同大太太在家裏圓月珍哥兒也叫他爺兒們各自兩口子團圓去咱們去邀了姨媽來娘兒們多樂一會鴛鴦指著鳳姐笑道他呢也該讓他們團圓去賈母聽了也笑道當真我倒忘了他們兩口子呢鳳姐道老祖宗別聽他的話沒有這個理況且璉二爺也不在家接環兄弟蘭哥兒的場去了賈母道環兒不肯念書就去下場不過應個名兒罷了我倒望蘭哥兒中一中也叫他母親喜歡喜歡不枉他這幾年的苦守話未了院子裏老婆子們説姨太太來了鳳姐忙起身相迎薛姨媽早已進了堂屋與賈母相見讓坐鳳姐過去問了好便道老祖宗才説要請姨媽過來正要打發人過去姨媽倒過來了薛姨媽道橫豎後兒一早要過來與老太太拜節今兒寶丫頭回九到張家去來不知怎樣款待他們我還要問問今兒過來就在園子裏歇了後日起來近便些鳳姐又問香菱呢薛姨媽道才從你太太那裏出來碰見紫鵑拉他到園子裏去了當下薛姨媽在賈母處説了一會間話出來進園子裏先到蘅蕪苑見寶叉已經回來了薛姨媽坐下正在説話黛玉進來便叫媽媽道方才紫鵑説姨太太來了我在屋子裏等了好一會知道媽媽在姊姊這裏我也趕來了薛姨媽笑道我也才來正要問他張家的話呢好笑這位張太太今兒寶丫頭回九還當他親生女兒看待連女壻都成了他家的親女壻了黛玉道這也難怪他們姊姊不是他家親骨血嗎總是姊姊命好倒多了一個親媽説著由不得眼圈上一紅寶叉笑道你也不用傷心了我有張家親媽也不認我的媽了把媽給你做了親媽豈不是我和你兩個人都有媽了説的連薛姨媽都笑起來正在説笑見一個小丫頭子來請黛玉道不知那裏來了一位奶奶等姑娘回去黛玉問是誰那小丫頭道我來了幾個月沒有見過這個人認不得是誰黛玉道雪雁這些人不知在那裏幹什麼講不清的話偏生叫這一點子小的來估量是襲人進來了寶叉道他出去嫁了一家姓蔣的又退了回來這件事鶯兒在張家早和我説過的了如今為什麼又進來呢黛玉道他停會兒總要到你這裏來的細細問他便知道了説著出了蘅蕪苑轉彎走不多路遇見香菱黛玉問香菱那裏來香菱道我到紫菱洲去邢大姑娘史大姑娘叫我吃姑娘送去的百果桂花餡子的月餅嘗著味兒很好黛玉道你愛吃我那裏還多著呢香菱又笑道寶二爺在那裏商量明兒賞月的地方邢大姑娘説不拘在那裏總沒有他的分他要到櫳翠庵同妙師父賞月去黛玉點頭笑道你太太在你姑娘屋裏快去罷黛玉自回瀟湘館來不知在屋裏等的是誰且看下回分解
